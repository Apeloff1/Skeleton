name: Backend Quality

# Mirrors the frontend ESLint guard for the FastAPI backend:
# Ruff (lint) + py_compile (syntax) on every push / PR touching backend/**.

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff==0.9.*"

      # Scope is defined in backend/ruff.toml (high-signal real-bug rules only).
      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Syntax check (py_compile)
        run: python -m compileall -q core routes
