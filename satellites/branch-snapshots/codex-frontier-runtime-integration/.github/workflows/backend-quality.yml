name: Backend Quality

# Fast, fail-closed backend gate: lint + full Python syntax compilation.
# Keep this independent from the heavier dependency-backed integration suite.

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff==0.9.*"

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Syntax check (full backend)
        run: python -m compileall -q .
