[metadata]
name = skeleton
version = 16.0.0
description = AI game engine and agent orchestration framework
author = Tutolage
license = MIT
python_requires = >=3.11

[options]
packages = find:
install_requires =
    fastapi>=0.100.0
    uvicorn[standard]>=0.23.0

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-asyncio>=0.21.0
    black>=23.0.0
    mypy>=1.0.0
ml =
    numpy>=1.24.0
    scikit-learn>=1.3.0
docs =
    mkdocs>=1.5.0
    mkdocs-material>=9.0.0
all =
    pytest>=7.0.0
    pytest-asyncio>=0.21.0
    black>=23.0.0
    mypy>=1.0.0
    numpy>=1.24.0
    scikit-learn>=1.3.0
    mkdocs>=1.5.0
    mkdocs-material>=9.0.0

[options.entry_points]
console_scripts =
    skeleton = skeleton.__main__:main
    skeleton-dev = skeleton.developer.cli:main
