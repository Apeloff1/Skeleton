[package]
name = "gf-ffi"
version = "0.3.0"
edition = "2021"

[dependencies]
gf-core = { path = "../gf-core" }
gf-gameforge = { path = "../gf-gameforge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lib]
crate-type = ["cdylib", "rlib"]
