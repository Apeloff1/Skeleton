      primary_source: Apeloff1/Lorebuffa
      source_path: backend/quest_system.py
      source_blob: c572dcc8919d342a8febb224e0131047b47c2644
      equivalent_sources:
        - repository: Apeloff1/Openworld
          source_path: backend/quest_system.py
          source_blob: c572dcc8919d342a8febb224e0131047b47c2644
      target: skeleton/frontier/quests.py
      promoted_capabilities:
        - source-record-normalization
        - prerequisite-availability
        - monotonic-objective-progress
        - completion-state
        - mutation-free-reward-planning
        - deterministic-type-selection
      evidence:
        - skeleton/testing/test_frontier_quest_policy.py
        - skeleton/testing/test_frontier_quest_reputation_logbook.py
    - capability: reputation
      primary_source: Apeloff1/Lorebuffa
      source_path: backend/reputation_system.py
      source_blob: 1ee119789969f963d258128ff544ea81bfd86526
      equivalent_sources:
        - repository: Apeloff1/Openworld
          source_path: backend/reputation_system.py
          source_blob: 1ee119789969f963d258128ff544ea81bfd86526
      target: skeleton/frontier/reputation.py
      promoted_capabilities:
        - faction-record-normalization
        - reputation-threshold-resolution
        - cumulative-benefits
        - ally-enemy-spillover
        - mutation-free-reputation-change
        - standing-summary
      evidence:
        - skeleton/testing/test_frontier_reputation_policy.py
        - skeleton/testing/test_frontier_quest_reputation_logbook.py
    - capability: captains-log
      primary_source: Apeloff1/Lorebuffa
      source_path: backend/captains_log.py
      source_blob: 5ed7efd452e7f2bb4ef7024185d66d65f1bd89d8
      equivalent_sources:
        - repository: Apeloff1/Openworld
          source_path: backend/captains_log.py
          source_blob: 5ed7efd452e7f2bb4ef7024185d66d65f1bd89d8
      target: skeleton/frontier/logbook.py
      promoted_capabilities:
        - log-record-normalization
        - fail-closed-template-rendering
        - pin-delete-search-milestone-policy
        - statistics-and-timeline-projection
        - canonical-memory-adapter
        - canonical-domain-event-adapter
      evidence:
        - skeleton/testing/test_frontier_logbook_policy.py
        - skeleton/testing/test_frontier_quest_reputation_logbook.py
  rejected_from-kernel:
    - source-quest-catalog
    - source-faction-catalog
    - source-log-persistence
    - fastapi-routes
    - motor-mongodb-client
    - wallet-or-user-document-mutations
  rationale: the three source blobs are identical across Lorebuffa and Openworld, so each portable policy is promoted once and composed through existing frontier memory/event contracts
