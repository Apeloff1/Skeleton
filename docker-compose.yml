# ============================================================================
# Tutolage Docker Compose
# ============================================================================
# One-command local development and production setup.
# Merged from the Tutolage + Skeleton compose files (consolidation pass).
#
# Usage:
#   docker compose up -d                 # Start all services
#   docker compose up -d backend         # Start backend only
#   docker compose up -d skeleton        # Start the v16 Skeleton API
#   docker compose --profile full up -d  # Also start standalone ChromaDB
#   docker compose logs -f               # View logs
#   docker compose down                  # Stop all
# ============================================================================

services:
  # ==========================================================================
  # Skeleton API (hexagonal v16 rewrite)
  # ==========================================================================
  skeleton:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutolage-skeleton
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    ports:
      - "${SKELETON_PORT:-8010}:8001"
    environment:
      - SKL_ENVIRONMENT=${ENVIRONMENT:-development}
      - SKL_MONGO_URI=${SKL_MONGO_URI:?SKL_MONGO_URI must be set to an authenticated MongoDB URI}
      - SKL_MONGO_DATABASE=skeleton
      - SKL_CHROMA_HOST=chroma
      - SKL_CHROMA_PORT=8000
      - SKL_OPERATION_STATE_PATH=/app/data/operation_state.sqlite
      - SKL_OPERATION_STREAM_PATH=/app/data/operation_stream.sqlite
      - SKL_ENGINE_SERVICE_PRINCIPAL=${SKL_ENGINE_SERVICE_PRINCIPAL:-codedock-backend}
      - BACKEND_TOOL_RECEIPT_PATH=/app/data/backend_tool_receipts.sqlite3
      - BACKEND_TOOL_RESULT_PATH=/app/data/backend_tool_results.sqlite3
      - SKL_ENGINE_SERVICE_TOKEN=${SKL_ENGINE_SERVICE_TOKEN:?SKL_ENGINE_SERVICE_TOKEN must be set to a high-entropy value}
      - SKL_ENGINE_ALLOWED_TENANTS_CSV=${SKL_ENGINE_ALLOWED_TENANTS_CSV:-*}
      - SKL_ENGINE_ALLOWED_CAPABILITIES_CSV=${SKL_ENGINE_ALLOWED_CAPABILITIES_CSV:-*}
      - SKL_ENGINE_EXECUTION_STATE_PATH=/app/data/engine_execution.sqlite
      - SKL_ENGINE_SUBMISSION_STATE_PATH=/app/data/engine_submissions.sqlite
      - SKL_ENGINE_TOOL_RECEIPT_PATH=/app/data/engine_tool_receipts.sqlite
      - SKL_ENGINE_QUOTA_STATE_PATH=/app/data/engine_quota.sqlite
      - SKL_ENGINE_PRESSURE_STATE_PATH=/app/data/engine_pressure.sqlite
      - SKL_GOVERNANCE_LIFECYCLE_PATH=/app/data/governance_lifecycle.sqlite
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health/live', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - skeleton_data:/app/data
    networks:
      - tutolage

  # ==========================================================================
  # Backend API Service
  # ==========================================================================
  # NOTE (B5): build context is the repo root so backend/Dockerfile can COPY
  # both backend/ and skeleton/ into the image — the guarded shims in
  # services/{cag,mag}.py then resolve to the canonical skeleton modules.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: tutolage-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set to an authenticated MongoDB URI}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      # Runtime model-provider credentials are engine-owned after Stage-5 cutover.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a high-entropy value}
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - SKELETON_INTERNAL_URL=${SKELETON_INTERNAL_URL:-http://skeleton:8001}
      - SKL_ENGINE_SERVICE_TOKEN=${SKL_ENGINE_SERVICE_TOKEN:?SKL_ENGINE_SERVICE_TOKEN must be set to a high-entropy value}
      - SKL_ENGINE_SERVICE_PRINCIPAL=${SKL_ENGINE_SERVICE_PRINCIPAL:-codedock-backend}
      - SKL_JEEVES_CANONICAL_CONVERSATIONS=${SKL_JEEVES_CANONICAL_CONVERSATIONS:-1}
    volumes:
      - backend_data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
      skeleton:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tutolage

  # ==========================================================================
  # Frontend Service (Expo)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      target: ${FRONTEND_BUILD_TARGET:-development}
    container_name: tutolage-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_CONTAINER_PORT:-3000}"
    environment:
      # EXPO_PUBLIC_* values are embedded into the browser bundle, so they
      # must be host-resolvable rather than Docker-internal service names.
      - EXPO_PUBLIC_BACKEND_URL=${EXPO_PUBLIC_BACKEND_URL:-http://localhost:8001}
      - EXPO_PUBLIC_SKELETON_URL=${EXPO_PUBLIC_SKELETON_URL:-http://localhost:8010}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      backend:
        condition: service_healthy
      skeleton:
        condition: service_healthy
    networks:
      - tutolage

  # ==========================================================================
  # MongoDB Database
  # ==========================================================================
  mongo:
    # Docker Official Image mongo:7.0.41 pinned to the reviewed multi-platform index.
    image: mongo:7.0.41@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0
    container_name: tutolage-mongo
    restart: unless-stopped
    # Application containers use the internal network. Host access is local-only.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD must be set}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-tutolage}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tutolage

  # ==========================================================================
  # ChromaDB Vector Database (Optional, for RAG)
  # ==========================================================================
  chroma:
    # Pin the current reviewed multi-platform `latest` index so deploys cannot drift.
    image: chromadb/chroma:latest@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: tutolage-chroma
    restart: unless-stopped
    # This service has no auth boundary here, so never bind it publicly.
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - tutolage
    profiles:
      - full  # Only start with: docker compose --profile full up

# ============================================================================
# Networks
# ============================================================================
networks:
  tutolage:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  mongo_data:
    driver: local
    labels:
      com.skeleton.state.role: "authoritative"
      com.skeleton.recovery.order: "10"
  mongo_config:
    driver: local
    labels:
      com.skeleton.state.role: "authoritative-support"
      com.skeleton.recovery.order: "10"
  backend_data:
    driver: local
    labels:
      com.skeleton.state.role: "declared-mixed-tool-authority-and-derived"
      com.skeleton.recovery.order: "50"
  skeleton_data:
    driver: local
    labels:
      com.skeleton.state.role: "declared-mixed-operation-authority-and-stream-projection"
      com.skeleton.recovery.order: "40"
  chroma_data:
    driver: local
    labels:
      com.skeleton.state.role: "derived"
      com.skeleton.recovery.order: "90"
