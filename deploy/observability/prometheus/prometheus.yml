# Prometheus scrape config for the Skeleton/Tutolage backend.
# The backend exposes text exposition at /api/metrics (backend/core/observability.py).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tutolage-backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:8001"]
        labels:
          service: backend
