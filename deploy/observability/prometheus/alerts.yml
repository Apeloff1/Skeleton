groups:
  - name: tutolage-backend
    rules:
      - alert: BackendDown
        expr: up{job="tutolage-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Backend scrape target is down
      - alert: BackendHighP95Latency
        expr: max(codedock_http_latency_ms{quantile="0.95"}) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "An endpoint p95 latency is above 2s"
      - alert: BackendErrorsRising
        expr: delta(codedock_errors_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 10 new 5xx errors recorded in 10 minutes"
      - alert: BackendRestarted
        expr: codedock_process_uptime_seconds < 300
        for: 1m
        labels:
          severity: info
        annotations:
          summary: Backend process restarted in the last 5 minutes
