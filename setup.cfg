[metadata]
name = skeleton
version = 16.0.0
description = AI game engine and agent orchestration framework
author = Tutolage
license = MIT

[options]
packages = find:
install_requires =
	bcrypt>=4,<5
	cryptography>=50.0.1
	fastapi>=0.142.2
	motor==3.7.1
	pymongo==4.18.2
	pydantic[email]>=2.13.5
	pydantic-settings>=2.15.0
	uvicorn[standard]>=0.54.0
python_requires = >=3.11

[options.package_data]
skeleton.native =
	asm/*.S
	asm/*.md
	asm/*.h
skeleton.ai.game_builder =
	platform_catalog.json
skeleton.acquired.gaming =
	*.json
	*.jsonl
skeleton.app =
	manifest.json

[options.entry_points]
console_scripts =
	skeleton = skeleton.__main__:main
	skeleton-dev = skeleton.developer.cli:main
	skeleton-bootstrap = skeleton.developer.bootstrap:main
	skeleton-repo-machine = skeleton.repo_machine.cli:main
	skeleton-train-local-model = skeleton.ai.runtime.inference.train:main

[options.extras_require]
dev =
	PyYAML>=6,<7
	pytest>=7.0.0
	pytest-asyncio>=1.4.0
	httpx>=0.27,<1
	black>=26.5.1
	mypy>=2.4.0
	ruff>=0.9,<0.17
local-inference =
	numpy==2.4.6
	Pillow>=11,<13

[options.packages.find]
where =
	.
include =
	skeleton*
