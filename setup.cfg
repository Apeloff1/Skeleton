[metadata]
name = skeleton
version = 16.0.0
description = Local-first game studio with Jeeves AI chat, Dragon source review and bounded game learning
author = Tutolage
license = MIT

[options]
packages = find:
install_requires =
	bcrypt>=4,<5
	cryptography>=50.0.2
	fastapi>=0.142.2
	httpx>=0.28.1,<1
	motor==3.7.1
	pymongo==4.19.0
	pydantic[email]>=2.14.1
	pydantic-settings>=2.15.0
	regex>=2026.9.29,<2027
	uvicorn[standard]>=0.54.0
python_requires = >=3.11

[options.package_data]
skeleton.native =
	asm/*.S
	asm/*.md
	asm/*.h
skeleton.ai.game_builder =
	platform_catalog.json
	evolution_lineages.json
	legal_authorities.json
skeleton.acquired.gaming =
	*.json
	*.jsonl
skeleton.app =
	manifest.json
skeleton.game.gameplay =
	fixtures/*.json

[options.entry_points]
console_scripts =
	skeleton-frontier-wing-export = skeleton.app.frontier_wing_export_cli:main
	skeleton-expedition-controller-journey = skeleton.app.expedition_controller_cli:main
