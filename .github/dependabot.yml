version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    # Keep routine version-update PRs inside the current major line. Security
    # updates are not restricted by allow.update-types and continue to surface.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      backend-runtime:
        applies-to: version-updates
        dependency-type: production
        patterns: ["*"]
        update-types: ["minor", "patch"]
      backend-development:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Major Expo/React/toolchain jumps require coordinated application changes.
    # Restrict routine version PRs to minor/patch while leaving security updates
    # unaffected by this allow policy. Keep framework/platform families separate
    # from the general runtime group so large ecosystem moves stay reviewable.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      frontend-expo-platform:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
        update-types: ["minor", "patch"]
      frontend-react-native-platform:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@react-navigation/*"
          - "@react-native-community/*"
          - "@react-native-async-storage/*"
        update-types: ["minor", "patch"]
      frontend-runtime:
        applies-to: version-updates
        dependency-type: production
        patterns: ["*"]
        exclude-patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@react-navigation/*"
          - "@react-native-community/*"
          - "@react-native-async-storage/*"
        update-types: ["minor", "patch"]
      frontend-development:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Oslo
    open-pull-requests-limit: 3
    groups:
      root-images:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 3
    groups:
      backend-images:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Oslo
    open-pull-requests-limit: 3
    groups:
      frontend-images:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
