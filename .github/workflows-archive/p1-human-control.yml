name: P1 Human Control Receipt Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/agents/human_control.py"
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/ai/agents/core/human_control.py"
      - "skeleton/agents/autonomy_control.py"
      - "skeleton/agents/delegation_qualification.py"
      - "skeleton/agents/__init__.py"
      - "skeleton/ai/agents/core/__init__.py"
      - "skeleton/testing/test_human_control.py"
      - ".github/workflows/p1-human-control.yml"
  pull_request:
    branches:
      - main
      - p1/auto-03-autonomy-deescalation-20260928
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/agents/human_control.py"
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/ai/agents/core/human_control.py"
      - "skeleton/agents/autonomy_control.py"
      - "skeleton/agents/delegation_qualification.py"
      - "skeleton/agents/__init__.py"
      - "skeleton/ai/agents/core/__init__.py"
      - "skeleton/testing/test_human_control.py"
      - ".github/workflows/p1-human-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-human-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate human control receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile human control contract
        run: >-
          python -m compileall -q
          skeleton/agents/human_control.py
          skeleton/ai/agents/core/human_control.py

      - name: Run AUTO-04/AUTO-03/AUTO-02 regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_human_control.py
          skeleton/testing/test_autonomy_deescalation.py
          skeleton/testing/test_agent_delegation_qualification.py

      - name: Validate canonical AI file tree parity
        run: python scripts/check_ai_file_tree.py

      - name: Build accepted human approval receipt
        run: |
          set -euo pipefail
          mkdir -p .p1-auto-04
          python - <<'PY'
          import json
          from pathlib import Path

          from skeleton.agents.autonomy_control import AutonomyLevel, AutonomyState
          from skeleton.agents.delegation_qualification import AgentDelegationDecision
          from skeleton.agents.human_control import (
              HumanControlAction,
              HumanControlCommand,
              HumanControlState,
              evaluate_human_control,
          )
          from skeleton.contracts.canonical import EvidenceRef

          now = 1_800_000_000.0
          delegation = AgentDelegationDecision(
              accepted=True,
              reasons=(),
              parent_authority_digest="a" * 64,
              child_authority_digest="b" * 64,
              handoff_digest="c" * 64,
              lease_fence_digest="d" * 64,
              live_lease_digest="e" * 64,
              observed_at=now - 30.0,
          )
          autonomy = AutonomyState(
              operation_id="ci-operation",
              execution_id="ci-execution",
              agent_id="ci-agent",
              level=AutonomyLevel.DELEGATED,
              delegation_digest=delegation.decision_digest,
              version=3,
          )
          state = HumanControlState(
              operation_id=autonomy.operation_id,
              execution_id=autonomy.execution_id,
              agent_id=autonomy.agent_id,
              autonomy_state_digest=autonomy.digest,
              authority_digest=autonomy.delegation_digest,
              level=autonomy.level,
              version=5,
          )
          command = HumanControlCommand(
              operation_id=state.operation_id,
              execution_id=state.execution_id,
              agent_id=state.agent_id,
              action=HumanControlAction.APPROVE,
              arguments_digest="6" * 64,
              authority_digest=state.authority_digest,
              state_digest=state.digest,
              state_version=state.version,
              issuer_id="human:ci-operator",
              issuer_digest="f" * 64,
              issued_at=now - 10.0,
              expires_at=now + 300.0,
              evidence_refs=(
                  EvidenceRef(
                      source="ci://human-approval",
                      digest="1" * 64,
                      category="human_control_authorization",
                  ),
              ),
              requested_level=AutonomyLevel.AUTONOMOUS,
              independent=True,
          )
          decision = evaluate_human_control(
              state=state,
              command=command,
              autonomy_state=autonomy,
              observed_at=now,
          )
          if not decision.accepted:
              raise SystemExit(f"AUTO-04 fixture rejected: {decision.reasons}")
          authorization = decision.accepted_autonomy_authorization()
          if authorization.delegation_digest != delegation.decision_digest:
              raise SystemExit("AUTO-04 authorization authority drift")

          evidence = decision.accepted_evidence_ref()
          Path(".p1-auto-04/decision.json").write_text(
              json.dumps(decision.receipt_payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-auto-04/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head AUTO-04 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-auto-04/config.digest").write_text(
              hashlib.sha256(b"p1-auto-04-human-control-v1").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-auto-04/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|auto-04"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-auto-04/verifier.digest").write_text(
              digest([
                  "skeleton/agents/human_control.py",
                  "skeleton/agents/autonomy_control.py",
                  ".github/workflows/p1-human-control.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-auto-04/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_human_control.py",
                  "skeleton/testing/test_autonomy_deescalation.py",
                  "skeleton/testing/test_agent_delegation_qualification.py",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-AUTO-04 \
            --accountability-id ACC-P1-AUTO-04 \
            --configuration-digest "$(cat .p1-auto-04/config.digest)" \
            --environment-digest "$(cat .p1-auto-04/environment.digest)" \
            --verifier-id github-actions:p1-human-control \
            --verifier-digest "$(cat .p1-auto-04/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-auto-04/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-auto-04/refs.json \
            --out .p1-auto-04/receipt.json \
            > .p1-auto-04/stdout.json

      - name: Assert exact-head AUTO-04 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-auto-04/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("AUTO-04 receipt head mismatch")
          if receipt["task_id"] != "P1-AUTO-04":
              raise SystemExit("AUTO-04 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-AUTO-04":
              raise SystemExit("AUTO-04 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("AUTO-04 exact-head receipt OK", receipt["receipt_digest"])
          PY
