name: P0 Capability Security Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/jeeves/agent/tools.py"
      - "skeleton/jeeves/agent/epistemic_tool_gate.py"
      - "skeleton/skills/privileged_transaction.py"
      - "skeleton/testing/test_jeeves_epistemic_tool_gate.py"
      - "skeleton/testing/test_privileged_tool_transaction.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-capability-security-evidence.yml"
  workflow_dispatch:


concurrency:
  group: p0-capability-security-evidence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capability-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run capability boundary regressions
        run: |
          python -m pytest -q skeleton/testing/test_jeeves_epistemic_tool_gate.py
          python -m pytest -q skeleton/testing/test_privileged_tool_transaction.py
