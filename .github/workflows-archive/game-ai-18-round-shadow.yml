name: Game AI 18-Round Shadow Quality
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-ai-18-round-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  signed-shadow:
    name: Signed shadow Dragon execution (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      EXACT_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            skeleton/ai/webcrawler/
            tests/__init__.py
            tests/test_game_builder_18round_evolution.py
            tests/test_game_builder_reviewer_promotion.py
            tests/test_game_builder_optimizer_and_wisdom.py
            tests/test_game_builder_knowledge_rights_bridge.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Audit exact-head 18-round implementation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          python -m compileall -q skeleton/ai/game_builder
          python -m unittest tests.test_game_builder_18round_evolution -v
