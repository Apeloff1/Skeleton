name: VOL-028 Authority Policy Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/vault/authority_policy.py"
      - "skeleton/automation/agents/authority_policy_bridge.py"
      - "skeleton/ai/agents/core/authority_policy_bridge.py"
      - "skeleton/ai/runtime/vault/authority_policy.py"
      - "skeleton/vault/__init__.py"
      - "skeleton/ai/runtime/vault/__init__.py"
      - "skeleton/testing/test_vol028_authority_policy.py"
      - ".github/workflows/vol028-authority-policy.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/vault/authority_policy.py"
      - "skeleton/automation/agents/authority_policy_bridge.py"
      - "skeleton/ai/agents/core/authority_policy_bridge.py"
      - "skeleton/ai/runtime/vault/authority_policy.py"
      - "skeleton/vault/__init__.py"
      - "skeleton/ai/runtime/vault/__init__.py"
      - "skeleton/testing/test_vol028_authority_policy.py"
      - ".github/workflows/vol028-authority-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol028-authority-policy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority-policy:
    name: Unified authority compiler and evaluator
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Compile authority boundaries
        run: >-
          python -m py_compile
          skeleton/vault/authority_policy.py
          skeleton/ai/runtime/vault/authority_policy.py
          skeleton/automation/agents/authority_policy_bridge.py
          skeleton/ai/agents/core/authority_policy_bridge.py
          skeleton/testing/test_vol028_authority_policy.py

      - name: Run authority policy regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_vol028_authority_policy.py

      - name: Assert exact governed mirror and non-executing contract
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(".")
          pairs = (
              (
                  root / "skeleton/vault/authority_policy.py",
                  root / "skeleton/ai/runtime/vault/authority_policy.py",
              ),
              (
                  root / "skeleton/automation/agents/authority_policy_bridge.py",
                  root / "skeleton/ai/agents/core/authority_policy_bridge.py",
              ),
              (
                  root / "skeleton/vault/__init__.py",
                  root / "skeleton/ai/runtime/vault/__init__.py",
              ),
          )
          for source, mirror in pairs:
              left = source.read_bytes()
              right = mirror.read_bytes()
              if left != right:
                  raise SystemExit(f"governed mirror drift: {source} != {mirror}")
              print(source, hashlib.sha256(left).hexdigest())

          text = (root / "skeleton/vault/authority_policy.py").read_text(
              encoding="utf-8"
          )
          required = (
              'default_effect: PolicyEffect = PolicyEffect.DENY',
              '"principal-revoked"',
              '"principal-expired"',
              '"tenant-boundary-mismatch"',
              '"authority-generation-mismatch"',
              '"principal-capability-not-granted"',
              '"principal-scope-not-granted"',
              '"explicit-deny"',
              '"default-deny"',
              '"approval-required"',
              'authority_scope: str = "authority-decision-only"',
              "production_authority: bool = False",
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"VOL-028 fail-closed token missing: {token}")

          forbidden = ("subprocess.", "os.system(", "requests.", "httpx.")
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"VOL-028 compiler gained execution surface: {token}")

          if not os.environ["EXPECTED_SHA"].strip():
              raise SystemExit("exact head SHA missing")
          print("VOL-028 exact head:", os.environ["EXPECTED_SHA"])
          PY
