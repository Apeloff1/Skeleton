name: P0 Secret Observability Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/observability/redaction.py"
      - "skeleton/ai/runtime/observability/redaction.py"
      - "tests/test_observability.py"
      - "skeleton/testing/test_frontier_observability_correlation.py"
      - "skeleton/testing/test_current_main_observability_closure.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-secret-observability-evidence.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/observability/redaction.py"
      - "skeleton/ai/runtime/observability/redaction.py"
      - "tests/test_observability.py"
      - "skeleton/testing/test_frontier_observability_correlation.py"
      - "skeleton/testing/test_current_main_observability_closure.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-secret-observability-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-secret-observability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install project test runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify observability mirror identity
        run: cmp skeleton/observability/redaction.py skeleton/ai/runtime/observability/redaction.py
      - name: Run secret-redaction regressions
        run: |
          python -m pytest -q tests/test_observability.py::test_structured_logger_redacts_messages_and_context
          python -m pytest -q tests/test_observability.py::test_text_redaction_removes_full_basic_authorization_credential
          python -m pytest -q tests/test_observability.py::test_tracer_failure_never_persists_exception_message
          python -m pytest -q skeleton/testing/test_frontier_observability_correlation.py::test_retry_event_is_correlated_and_does_not_store_exception_message
          python -m pytest -q skeleton/testing/test_frontier_observability_correlation.py::test_tool_failure_event_exposes_type_not_secret_message
