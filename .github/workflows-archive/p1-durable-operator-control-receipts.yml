name: P1 Durable Operator Control Receipt Gate

on:
  push:
    branches:
      - main
    paths:
      - "backend/core/user_control_receipts.py"
      - "backend/core/operator_control_projection.py"
      - "backend/core/workspace_projection.py"
      - "backend/tests/test_durable_user_control_receipts.py"
      - "backend/tests/test_user_control_receipts.py"
      - "backend/tests/test_workspace_projection.py"
      - "skeleton/agents/human_control.py"
      - ".github/workflows/p1-durable-operator-control-receipts.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/core/user_control_receipts.py"
      - "backend/core/operator_control_projection.py"
      - "backend/core/workspace_projection.py"
      - "backend/tests/test_durable_user_control_receipts.py"
      - "backend/tests/test_user_control_receipts.py"
      - "backend/tests/test_workspace_projection.py"
      - "skeleton/agents/human_control.py"
      - ".github/workflows/p1-durable-operator-control-receipts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-durable-operator-controls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate durable AUTO-04 receipt reconstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "pytest>=8,<9"

      - name: Compile durable control contracts
        run: >-
          python -m compileall -q
          backend/core/user_control_receipts.py
          backend/core/operator_control_projection.py

      - name: Run AUTO-04 / PROD-03 / durable PROD-04 regressions
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_human_control.py
          backend/tests/test_workspace_projection.py
          backend/tests/test_user_control_receipts.py
          backend/tests/test_durable_user_control_receipts.py

      - name: Build restart-safe supplemental PROD-04 evidence
        run: |
          set -euo pipefail
          mkdir -p .p1-prod-04-durable
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from core.operator_control_projection import (
              build_operator_control_projection_from_store,
              verify_operator_control_projection_from_store,
          )
          from core.user_control_receipts import SQLiteHumanControlReceiptStore
          from core.workspace_projection import (
              WorkspaceProjection,
              WorkspaceProjectionDecision,
          )
          from skeleton.agents.autonomy_control import AutonomyLevel
          from skeleton.agents.human_control import (
              HumanControlAction,
              HumanControlDecision,
          )
          from skeleton.contracts.canonical import EvidenceRef
          from skeleton.contracts.operation import OperationState

          workspace = WorkspaceProjection(
              operation_id="ci-operation",
              tenant_id="ci-tenant",
              trace_id="ci-trace",
              canonical_state=OperationState.RUNNING,
              operation_version=5,
              cursor_sequence=5,
              terminal=False,
              operation_projection_digest="1" * 64,
              projection_authority_digest="2" * 64,
          )
          workspace_decision = WorkspaceProjectionDecision(
              accepted=True,
              reasons=(),
              workspace_projection_digest=workspace.projection_digest,
              operation_projection_digest="1" * 64,
              projection_authority_digest="2" * 64,
              operation_id=workspace.operation_id,
              tenant_id=workspace.tenant_id,
              operation_version=workspace.operation_version,
              cursor_sequence=workspace.cursor_sequence,
          )
          pause = HumanControlDecision(
              accepted=True,
              action=HumanControlAction.PAUSE,
              reasons=(),
              operation_id=workspace.operation_id,
              execution_id="ci-execution",
              agent_id="ci-agent",
              arguments_digest="3" * 64,
              state_digest="4" * 64,
              command_digest="5" * 64,
              autonomy_state_digest="6" * 64,
              authority_digest="7" * 64,
              from_level=AutonomyLevel.DELEGATED,
              requested_level=None,
              next_level=AutonomyLevel.OBSERVE,
              next_paused=True,
              next_interrupted=False,
              current_version=1,
              next_version=2,
              issuer_id="human:ci-operator",
              issuer_digest="8" * 64,
              expires_at=1_800_000_300.0,
              evidence_refs=(
                  EvidenceRef(
                      source="ci://prod-04/durable-pause",
                      digest="9" * 64,
                      category="human_control_authorization",
                  ),
              ),
              independent=True,
              observed_at=1_800_000_000.0,
              previous_receipt_digest=None,
          )

          root = Path(tempfile.mkdtemp(prefix="p1-prod-04-durable-"))
          db = root / "controls.sqlite"
          store = SQLiteHumanControlReceiptStore(db)
          store.append(tenant_id=workspace.tenant_id, decision=pause)
          store.close()

          reopened = SQLiteHumanControlReceiptStore(db)
          projection = build_operator_control_projection_from_store(
              store=reopened,
              tenant_id=workspace.tenant_id,
              execution_id=pause.execution_id,
              workspace=workspace,
              workspace_decision=workspace_decision,
          )
          decision = verify_operator_control_projection_from_store(
              projection,
              store=reopened,
              tenant_id=workspace.tenant_id,
              execution_id=pause.execution_id,
              workspace=workspace,
              workspace_decision=workspace_decision,
          )
          if not decision.accepted:
              raise SystemExit(
                  f"durable PROD-04 fixture rejected: {decision.reasons}"
              )
          if projection.human_control_receipt_digest != pause.receipt_digest:
              raise SystemExit("restart did not recover exact receipt")
          if projection.available_actions != ("cancel", "resume"):
              raise SystemExit("recovered pause did not expose resume")
          evidence = decision.accepted_evidence_ref()
          Path(".p1-prod-04-durable/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          reopened.close()
          PY

      - name: Emit exact-head supplemental PROD-04 receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-prod-04-durable/config.digest").write_text(
              hashlib.sha256(
                  b"p1-prod-04-durable-control-receipts-v1"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-prod-04-durable/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|prod-04-durable"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-prod-04-durable/verifier.digest").write_text(
              digest([
                  "backend/core/user_control_receipts.py",
                  "backend/core/operator_control_projection.py",
                  "backend/core/workspace_projection.py",
                  "skeleton/agents/human_control.py",
                  ".github/workflows/p1-durable-operator-control-receipts.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-prod-04-durable/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_human_control.py",
                  "backend/tests/test_workspace_projection.py",
                  "backend/tests/test_user_control_receipts.py",
                  "backend/tests/test_durable_user_control_receipts.py",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-PROD-04 \
            --accountability-id ACC-P1-PROD-04 \
            --configuration-digest "$(cat .p1-prod-04-durable/config.digest)" \
            --environment-digest "$(cat .p1-prod-04-durable/environment.digest)" \
            --verifier-id github-actions:p1-durable-operator-control-receipts \
            --verifier-digest "$(cat .p1-prod-04-durable/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-prod-04-durable/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-prod-04-durable/refs.json \
            --out .p1-prod-04-durable/receipt.json \
            > .p1-prod-04-durable/stdout.json

      - name: Assert exact-head supplemental PROD-04 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-prod-04-durable/receipt.json").read_text(
                  encoding="utf-8"
              )
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("durable PROD-04 receipt head mismatch")
          if receipt["task_id"] != "P1-PROD-04":
              raise SystemExit("durable PROD-04 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-PROD-04":
              raise SystemExit("durable PROD-04 accountability mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print(
              "durable PROD-04 exact-head receipt OK",
              receipt["receipt_digest"],
          )
          PY
