    concurrency:
      # Intentionally matches pre-coalescing SHA-scoped Merge Readiness runs.
      # No current main-head SHA and no PR-number group is admitted.
      group: merge-readiness-${{ matrix.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify retired SHA cannot be the current integration HEAD
        env:
          LEGACY_SHA: ${{ matrix.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LEGACY_SHA" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "/repos/${REPO}/branches/main" --jq '.commit.sha')
          [[ "$current" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LEGACY_SHA" != "$current" ]]
          printf 'Retired superseded Merge Readiness concurrency group for %s\n' "$LEGACY_SHA"
