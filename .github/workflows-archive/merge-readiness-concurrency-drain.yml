name: Merge Readiness Legacy Concurrency Drain

on:
  workflow_dispatch:
  # One-shot recovery wake when this bounded tombstone inventory changes.
  # Never run on ordinary application pushes.
  push:
    branches: [main]
    paths: ['.github/workflows/merge-readiness-concurrency-drain.yml']

permissions: {}

# Separate recovery lane; old SHA identities are retired at the job level.
concurrency:
  group: merge-readiness-legacy-drain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tombstone:
    name: Retire legacy Merge Readiness ${{ matrix.sha }}
    strategy:
      fail-fast: false
      # Keep tiny recovery jobs bounded; concurrency evicts matching obsolete
      # SHA-scoped workflow runs even when the old runner is slow or stuck.
      max-parallel: 32
