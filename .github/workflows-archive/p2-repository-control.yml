name: P2 Repository Control

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-repository-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-repository-control:
    name: Validate P2 repository control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Validate repository control
        run: python scripts/check_p2_repository_control.py --json

      - name: Run repository-control regressions
        run: python -m unittest -v tests.test_p2_repository_control
