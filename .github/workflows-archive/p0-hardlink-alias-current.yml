name: P0 Hardlink Alias Security

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/security/rooted_fs.py"
      - "skeleton/ai/runtime/security/rooted_fs.py"
      - "skeleton/testing/test_security_rooted_fs.py"
      - "machine/ai_file_tree.json"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-hardlink-alias-current.yml"
  workflow_dispatch:


concurrency:
  group: p0-hardlink-alias-current-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hardlink-alias-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run hardlink alias regressions
        run: >-
          python -m pytest -q
          skeleton/testing/test_security_rooted_fs.py::test_read_rejects_hardlink_alias_to_outside_inode
          skeleton/testing/test_security_rooted_fs.py::test_snapshot_rejects_hardlink_alias
          skeleton/testing/test_security_rooted_fs.py::test_write_rejects_existing_hardlink_without_mutating_source
          skeleton/testing/test_security_rooted_fs.py::test_remove_rejects_hardlink_without_unlinking_alias
      - run: python scripts/check_ai_file_tree.py
