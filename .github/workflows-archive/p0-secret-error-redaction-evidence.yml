name: P0 Secret Error Redaction Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/observability/redaction.py"
      - "skeleton/shells/redaction.py"
      - "tests/test_api_gateway_error_redaction.py"
      - "tests/test_orchestration_error_redaction.py"
      - "tests/test_app_error_redaction.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - "machine/backlog_registry.json"
      - ".github/workflows/p0-secret-error-redaction-evidence.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/observability/redaction.py"
      - "skeleton/shells/redaction.py"
      - "tests/test_api_gateway_error_redaction.py"
      - "tests/test_orchestration_error_redaction.py"
      - "tests/test_app_error_redaction.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - "machine/backlog_registry.json"
      - ".github/workflows/p0-secret-error-redaction-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-secret-error-redaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-error-redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install project test runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run error redaction regressions
        run: >-
          python -m pytest -q
          tests/test_api_gateway_error_redaction.py
          tests/test_orchestration_error_redaction.py
          tests/test_app_error_redaction.py
