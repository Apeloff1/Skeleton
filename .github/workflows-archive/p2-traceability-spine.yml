name: P2 Master Traceability Spine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-master-traceability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-traceability:
    name: Validate requirements-to-runtime traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Validate sharded master trace
        run: python scripts/check_master_traceability.py --json

      - name: Validate NFR registry
        run: python scripts/check_nfr_registry.py --json

      - name: Validate complete traceability spine
        run: python scripts/check_traceability_spine.py --json

      - name: Resolve PR impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_trace_pr_impact.py --base "$BASE_SHA" --head "$HEAD_SHA" --json

      - name: Run focused traceability regressions
        run: >-
          python -m unittest -v
          tests.test_master_traceability
          tests.test_nfr_registry
          tests.test_traceability_spine
          tests.test_trace_pr_impact
          tests.test_internal_protocol_envelope
