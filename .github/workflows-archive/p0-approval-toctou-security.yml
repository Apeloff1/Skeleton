name: P0 Approval TOCTOU Security

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/shells/ai/approval.py"
      - "skeleton/ai/shell/approval.py"
      - "skeleton/testing/test_shell_ai_approval_budget_toolguards.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-approval-toctou-security.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/shells/ai/approval.py"
      - "skeleton/ai/shell/approval.py"
      - "skeleton/testing/test_shell_ai_approval_budget_toolguards.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-approval-toctou-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-approval-toctou-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approval-toctou:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify approval mirrors
        run: cmp skeleton/shells/ai/approval.py skeleton/ai/shell/approval.py
      - name: Run approval race regressions
        run: >-
          python -m pytest -q
          skeleton/testing/test_shell_ai_approval_budget_toolguards.py
