name: Configuration Authority Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/config/authority.py"
      - "skeleton/ai/runtime/config/authority.py"
      - "skeleton/config/snapshots.py"
      - "skeleton/kernel/config_snapshots.py"
      - "skeleton/testing/test_config_authority.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/config-authority-contract.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/config/authority.py"
      - "skeleton/ai/runtime/config/authority.py"
      - "skeleton/config/snapshots.py"
      - "skeleton/kernel/config_snapshots.py"
      - "skeleton/testing/test_config_authority.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/config-authority-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: config-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  config-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pydantic>=2,<3" "pydantic-settings>=2,<3"
      - name: Compile configuration authority
        run: >-
          python -m compileall -q
          skeleton/config/authority.py
          skeleton/ai/runtime/config/authority.py
          skeleton/testing/test_config_authority.py
      - name: Run configuration authority regressions
        run: python -m unittest -q skeleton.testing.test_config_authority
      - name: Verify canonical architecture and construction
        run: >-
          python scripts/check_architecture_map.py
          && python scripts/check_ai_app_construction.py
      - name: Verify governed AI file-tree parity
        run: python scripts/check_ai_file_tree.py
      - name: Verify hostile-gap disposition
        run: python scripts/verify_ai_hostile_gap_disposition.py
