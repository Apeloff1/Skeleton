name: P0 Capability Discovery Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/shells/ai/mcp.py"
      - "skeleton/ai/shell/mcp.py"
      - "skeleton/shells/ai/mcp_authz.py"
      - "skeleton/ai/shell/mcp_authz.py"
      - "skeleton/shells/ai/mcp_gateway.py"
      - "skeleton/ai/shell/mcp_gateway.py"
      - "skeleton/testing/test_shell_ai_mcp_2026.py"
      - "machine/ai_file_tree.json"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - "machine/backlog_registry.json"
      - ".github/workflows/p0-capability-discovery-boundary.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/shells/ai/mcp.py"
      - "skeleton/ai/shell/mcp.py"
      - "skeleton/shells/ai/mcp_authz.py"
      - "skeleton/ai/shell/mcp_authz.py"
      - "skeleton/shells/ai/mcp_gateway.py"
      - "skeleton/ai/shell/mcp_gateway.py"
      - "skeleton/testing/test_shell_ai_mcp_2026.py"
      - "machine/ai_file_tree.json"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - "machine/backlog_registry.json"
      - ".github/workflows/p0-capability-discovery-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-capability-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capability-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install project test runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify AI shell mirrors
        run: |
          cmp skeleton/shells/ai/mcp.py skeleton/ai/shell/mcp.py
          cmp skeleton/shells/ai/mcp_authz.py skeleton/ai/shell/mcp_authz.py
          cmp skeleton/shells/ai/mcp_gateway.py skeleton/ai/shell/mcp_gateway.py
      - name: Run capability-discovery regressions
        run: python -m pytest -q skeleton/testing/test_shell_ai_mcp_2026.py
