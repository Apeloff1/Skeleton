name: Game Builder Native C64 PRG

on:
  pull_request:
    paths:
      - 'skeleton/ai/game_builder/**'
      - 'scripts/game_builder/native_c64_ci.py'
      - '.github/workflows/game-builder-native-c64.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-builder-c64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-c64-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /skeleton/__init__.py
            /skeleton/ai/__init__.py
            /skeleton/ai/capability_map.py
            /skeleton/ai/game_builder/
            /scripts/game_builder/native_c64_ci.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Commodore 64 cc65/6510 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cc65 make
          cl65 --version
      - name: Build original three-level C64 game and verify genuine .prg launcher
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/game_builder/native_c64_ci.py --emit c64-original-src > c64-source-evidence.json
          make -C c64-original-src
          test -s c64-original-src/build/skeleton-original.prg
          python scripts/game_builder/native_c64_ci.py --verify-prg c64-original-src/build/skeleton-original.prg > c64-prg-validation.json
          python - <<'PY'
          import json
          report=json.load(open("c64-prg-validation.json", encoding="utf-8"))
          assert report["native_machine_code_compiled"] is True
          assert report["load_address"] == 0x0801
          assert report["real_hardware_verified"] is False
          print("ORIGINAL_C64_PRG_COMPILED", report["prg_sha256"])
          PY
      - name: Validate C64 hardware-specific source and rights regression
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8.4,<9"
          python -m pytest -q --noconftest skeleton/testing/test_game_builder_c64_native.py
      - name: Upload original C64 game and source provenance
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-original-c64-prg
          path: |
            c64-original-src/build/skeleton-original.prg
            c64-original-src/manifest.json
            c64-source-evidence.json
            c64-prg-validation.json
          if-no-files-found: error
          retention-days: 7
