name: Gate Boundary Security

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/api/middleware.py"
      - "skeleton/api/server.py"
      - "skeleton/testing/test_gate_policy_boundaries.py"
      - ".github/workflows/gate-boundary-security.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/api/middleware.py"
      - "skeleton/api/server.py"
      - "skeleton/testing/test_gate_policy_boundaries.py"
      - ".github/workflows/gate-boundary-security.yml"

permissions:
  contents: read

concurrency:
  group: gate-boundary-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8,<9" "starlette>=0.27,<1" "pydantic>=2.0,<3" "pydantic-settings>=2.0,<3"
      - name: Reject Gate security regressions
        run: python -m pytest -q skeleton/testing/test_gate_policy_boundaries.py
