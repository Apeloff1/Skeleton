name: Gate Boundary Security

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/api/middleware.py"
      - "skeleton/testing/test_gate_policy_boundaries.py"
      - ".github/workflows/gate-boundary-security.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/api/middleware.py"
      - "skeleton/testing/test_gate_policy_boundaries.py"
      - ".github/workflows/gate-boundary-security.yml"

permissions:
  contents: read

concurrency:
  group: gate-boundary-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Reject open-route and governance-prefix confusion
        run: python -m pytest -q skeleton/testing/test_gate_policy_boundaries.py
