name: Repository Intelligence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repo-intel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: read

env:
  PYTHON_VERSION: "3.11.16"
  PYTHONPATH: "${{ github.workspace }}"

jobs:
  map-and-gate:
    name: Map semantic / supply-chain / runtime / tests / artifacts / impact / security / handoff graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Restore/save content-addressed semantic cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .cache/repo-intel/semantic-cache.json
          key: repo-intel-semantic-v1-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ github.sha }}
          restore-keys: |
            repo-intel-semantic-v1-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install repository test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e ".[dev]"

      - name: Validate repo-intelligence contracts
        run: |
          python -m compileall -q \
            scripts/repo_intel.py \
            scripts/repo_intel_sota.py \
            scripts/repo_intel_supply_chain.py \
            scripts/repo_intel_deep.py \
            scripts/repo_intel_test_evidence.py \
            scripts/repo_intel_artifacts.py \
            scripts/repo_index.py \
            scripts/repo_intel_frontier.py \
            scripts/benchmark_repo_intel.py
          python scripts/repo_intel_frontier.py check

      - name: Run focused repository-index regressions
        run: >-
          python -m pytest -q
          tests/test_repo_intel.py
          tests/test_repo_intel_sota.py
          tests/test_repo_intel_deep.py
          tests/test_repo_intel_test_evidence.py
          tests/test_repo_intel_artifacts.py
          tests/test_repo_intel_frontier.py
          tests/test_repo_index.py

      - name: Build frontier repository knowledge graph
        env:
          REPO_INTEL_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          python scripts/repo_intel_frontier.py snapshot --base "$REPO_INTEL_BASE" --out .cache/repo-intel
          python scripts/repo_intel_frontier.py diff --base "$REPO_INTEL_BASE" --out .cache/repo-intel

      - name: Require build augmentation note
        if: github.event_name == 'pull_request'
        env:
          REPO_INTEL_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/repo_intel_frontier.py gate --base "$REPO_INTEL_BASE"

      - name: Query live Dependabot security data when permitted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .cache/repo-intel
          if gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/dependabot/alerts" \
            -f state=open -f per_page=100 \
            > .cache/repo-intel/dependabot-alerts.json 2> .cache/repo-intel/dependabot-alerts.err; then
            echo "Dependabot alert API available"
          else
            : > .cache/repo-intel/dependabot-alerts.json
            echo "Dependabot alert API unavailable to workflow token; continuing with static coverage"
          fi
          if gh api -X GET search/issues \
            -f q="repo:${GITHUB_REPOSITORY} author:app/dependabot is:pr is:open" \
            -f per_page=100 \
            > .cache/repo-intel/dependabot-prs.json 2> .cache/repo-intel/dependabot-prs.err; then
            echo "Dependabot PR search available"
          else
            : > .cache/repo-intel/dependabot-prs.json
          fi
          python scripts/repo_intel_frontier.py dependabot-notes \
            --alerts .cache/repo-intel/dependabot-alerts.json \
            --prs .cache/repo-intel/dependabot-prs.json \
            --out .cache/repo-intel/dependabot-notes.md

      - name: Publish build-facing notes to job summary
        shell: bash
        run: |
          {
            cat .cache/repo-intel/notes.md
            echo
            cat .cache/repo-intel/dependabot-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show machine-map summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.cache/repo-intel')
          index = json.loads((root / 'index.json').read_text())
          gaps = json.loads((root / 'gaps.json').read_text())
          sq = json.loads((root / 'security-quality.json').read_text())
          impact = json.loads((root / 'impact.json').read_text())
          supply = json.loads((root / 'supply-chain.json').read_text())
          surfaces = json.loads((root / 'surfaces.json').read_text())
          hotspots = json.loads((root / 'hotspots.json').read_text())
          batches = json.loads((root / 'batch-status.json').read_text())
          tests = json.loads((root / 'test-evidence.json').read_text())
          artifacts = json.loads((root / 'artifact-lineage.json').read_text())
          arch = json.loads((root / 'architecture.json').read_text())
          m = index['metrics']
          print('source_digest=', index['source_digest'])
          print('tracked_files=', index['tracked_files'])
          print('tracked_bytes=', index['tracked_bytes'])
          print('graph_nodes=', m['graph_nodes'])
          print('graph_edges=', m['graph_edges'])
          print('semantic_cache_hit_ratio=', m['semantic_cache_hit_ratio'])
          print('dependency_cycles=', m['dependency_cycles'])
          print('external_dependencies=', supply['component_count'])
          print('dependency_ecosystems=', supply['ecosystems'])
          print('routes=', surfaces['route_count'])
          print('environment_variables=', surfaces['environment_variable_count'])
          print('build_targets=', m['build_target_count'])
          print('history_window_commits=', m['history_window_commits'])
          print('top_hotspot=', hotspots['hotspots'][0] if hotspots['hotspots'] else None)
          print('batch_lane_counts=', batches['lane_counts'])
          print('test_evidence_links=', tests['evidence_link_count'])
          print('source_test_evidence_ratio=', tests['source_evidence_ratio'])
          print('artifact_nodes=', artifacts['artifact_node_count'])
          print('artifact_lineage_edges=', artifacts['lineage_edge_count'])
          print('artifact_unresolved_inputs=', artifacts['unresolved_count'])
          print('affected_artifacts=', len(impact.get('affected_artifacts', [])))
          print('ranked_candidate_tests=', len(impact.get('ranked_candidate_tests', [])))
          print('architecture_boundaries=', arch['counts_by_severity'])
          print('owned_file_ratio=', m['owned_file_ratio'])
          print('impact_files=', impact['affected_file_count'])
          print('impact_subsystems=', impact['subsystems'])
          print('candidate_tests=', len(impact['candidate_tests']))
          print('gap_counts=', gaps['counts'])
          print('dependabot_ecosystems=', sq['dependabot_ecosystems'])
          print('large_tracked_files=', len(index['large_tracked_files']))
          PY
