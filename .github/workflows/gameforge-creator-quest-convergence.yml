name: GameForge creator + native quest convergence

on:
  pull_request:
    paths:
      - 'frontend/src/skeletonForge/**'
      - 'frontend/scripts/skeleton-forge/**'
      - 'frontend/app/galaxy.tsx'
      - 'frontend/app/skeleton-forge.tsx'
      - 'frontend/src/features/GalaxyStudioFactory/draftCustody.ts'
      - 'frontend/src/features/GalaxyStudioFactory/galaxyDraftCodec.ts'
      - 'frontend/src/features/GalaxyStudioFactory/genreRegistry.ts'
      - 'frontend/src/features/GalaxyStudioFactory/GalaxyStudioFactoryModal.tsx'
      - 'backend/routes/skeleton_gameforge.py'
      - 'skeleton/context/**'
      - 'skeleton/ai/game_builder/godot_quest_bridge.py'
      - 'skeleton/testing/test_creator_quest_convergence.py'
      - 'skeleton/testing/test_gameforge_playable_quest_convergence.py'
      - 'skeleton/testing/test_gameforge_archetype_playtest.py'
      - 'skeleton/forge/playtest.py'
      - 'skeleton/forge/playable_portal.py'
      - 'skeleton/testing/test_gameforge_playable_portal.py'
      - 'skeleton/testing/test_archetype_playable_e2e.py'
      - 'skeleton/testing/test_gameforge_source_archive.py'
      - 'frontend/src/skeletonForge/sourceArchive.ts'
      - 'frontend/src/skeletonForge/shareSourceArchive.ts'
      - '.github/workflows/gameforge-creator-quest-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gameforge-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  creator-native-python:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused source-test prerequisites
        run: python -m pip install 'pytest>=8,<9' 'fastapi>=0.115' 'pydantic>=2' 'PyYAML>=6'
      - name: Compile original and converged sources
        run: |
          python -m compileall -q skeleton/context skeleton/ai/game_builder/godot_quest_bridge.py skeleton/forge/playtest.py skeleton/forge/playable_portal.py backend/routes/skeleton_gameforge.py skeleton/testing/test_creator_quest_convergence.py skeleton/testing/test_gameforge_playable_quest_convergence.py skeleton/testing/test_gameforge_archetype_playtest.py skeleton/testing/test_gameforge_playable_portal.py skeleton/testing/test_gameforge_source_archive.py
      - name: Verify both feature paths together
        run: |
          python -m pytest -q \
            skeleton/testing/test_creator_quest_convergence.py \
            skeleton/testing/test_gameforge_playable_quest_convergence.py \
            skeleton/testing/test_gameforge_archetype_playtest.py \
            skeleton/testing/test_gameforge_playable_portal.py \
            skeleton/testing/test_gameforge_source_archive.py \
            skeleton/testing/test_archetype_playable_e2e.py \
            skeleton/testing/test_gameforge_instrument_overrides.py \
            skeleton/testing/test_extended_genre_catalog.py \
            skeleton/testing/test_native_godot_quest.py \
            skeleton/testing/test_original_quest_slice.py

  creator-quest-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Converged questionnaire and native quest regression
        run: |
          node --test \
            scripts/skeleton-forge/creator-quest-convergence.test.cjs \
            scripts/skeleton-forge/playable-scene-evidence.test.cjs \
            scripts/skeleton-forge/source-archive.test.cjs \
            scripts/skeleton-forge/run-session-isolation.test.cjs \
            scripts/skeleton-forge/run.components.test.cjs \
            scripts/skeleton-forge/creator-bridge.test.cjs \
            scripts/skeleton-forge/galaxy-draft-custody.test.cjs \
            scripts/skeleton-forge/galaxy-genre-registry.test.cjs \
            scripts/skeleton-forge/storage-scope.test.cjs \
            scripts/skeleton-forge/instruments.test.cjs \
            scripts/skeleton-forge/native-quest.test.cjs
      - name: Typecheck complete frontend
        run: yarn typecheck
