name: GameForge creator + native quest convergence

on:
  pull_request:
    paths:
      - 'frontend/src/skeletonForge/**'
      - 'frontend/scripts/skeleton-forge/**'
      - 'frontend/app/galaxy.tsx'
      - 'frontend/app/skeleton-forge.tsx'
      - 'frontend/src/features/GalaxyStudioFactory/draftCustody.ts'
      - 'frontend/src/features/GalaxyStudioFactory/galaxyDraftCodec.ts'
      - 'frontend/src/features/GalaxyStudioFactory/genreRegistry.ts'
      - 'frontend/src/features/GalaxyStudioFactory/GalaxyStudioFactoryModal.tsx'
      - 'backend/routes/skeleton_gameforge.py'
      - 'skeleton/context/**'
      - 'skeleton/ai/game_builder/godot_quest_bridge.py'
      - 'skeleton/testing/test_creator_quest_convergence.py'
      - 'skeleton/testing/test_gameforge_playable_quest_convergence.py'
      - 'skeleton/testing/test_gameforge_archetype_playtest.py'
      - 'skeleton/forge/playtest.py'
      - 'skeleton/forge/archetype_content.py'
      - 'skeleton/ai/forge/archetype_content.py'
      - 'skeleton/forge/playable_portal.py'
      - 'skeleton/testing/test_gameforge_playable_portal.py'
      - 'skeleton/testing/test_archetype_playable_e2e.py'
      - 'skeleton/testing/test_gameforge_native_archive_custody.py'
      - 'scripts/qualify_gameforge_godot_native.py'
      - 'skeleton/testing/test_gameforge_source_archive.py'
      - 'frontend/src/skeletonForge/sourceArchive.ts'
      - 'frontend/src/skeletonForge/shareSourceArchive.ts'
      - '.github/workflows/gameforge-creator-quest-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gameforge-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  creator-native-python:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install focused source-test prerequisites
        run: python -m pip install -e . 'pytest>=8,<9' 'pytest-asyncio>=1.4,<2' 'PyYAML>=6,<7'
      - name: Compile original and converged sources
        run: |
          python -m compileall -q skeleton/context skeleton/ai/game_builder/godot_quest_bridge.py skeleton/forge/archetype_content.py skeleton/ai/forge/archetype_content.py skeleton/forge/playtest.py skeleton/forge/playable_portal.py scripts/qualify_gameforge_godot_native.py backend/routes/skeleton_gameforge.py skeleton/testing/test_creator_quest_convergence.py skeleton/testing/test_gameforge_playable_quest_convergence.py skeleton/testing/test_gameforge_archetype_playtest.py skeleton/testing/test_gameforge_playable_portal.py skeleton/testing/test_gameforge_source_archive.py skeleton/testing/test_gameforge_native_archive_custody.py
      - name: Verify both feature paths together
        run: |
          python -m pytest -q \
            skeleton/testing/test_creator_quest_convergence.py \
            skeleton/testing/test_gameforge_playable_quest_convergence.py \
            skeleton/testing/test_gameforge_archetype_playtest.py \
            skeleton/testing/test_gameforge_playable_portal.py \
            skeleton/testing/test_gameforge_source_archive.py \
            skeleton/testing/test_archetype_playable_e2e.py \
            skeleton/testing/test_gameforge_native_archive_custody.py \
            skeleton/testing/test_gameforge_instrument_overrides.py \
            skeleton/testing/test_extended_genre_catalog.py \
            skeleton/testing/test_native_godot_quest.py \
            skeleton/testing/test_original_quest_slice.py

  creator-quest-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Verify postinstall RSA nested digest security patch
        run: node --test scripts/test-node-forge-digest-info-patch.cjs
      - name: Converged questionnaire and native quest regression
        run: |
          node --test \
            scripts/skeleton-forge/creator-quest-convergence.test.cjs \
            scripts/skeleton-forge/playable-scene-evidence.test.cjs \
            scripts/skeleton-forge/source-archive.test.cjs \
            scripts/skeleton-forge/run-session-isolation.test.cjs \
            scripts/skeleton-forge/foundation.model.test.cjs \
            scripts/skeleton-forge/foundation.screens.test.cjs \
            scripts/skeleton-forge/run.components.test.cjs \
            scripts/skeleton-forge/creator-bridge.test.cjs \
            scripts/skeleton-forge/navigation.test.cjs \
            scripts/skeleton-forge/galaxy-draft-custody.test.cjs \
            scripts/skeleton-forge/galaxy-genre-registry.test.cjs \
            scripts/skeleton-forge/storage-scope.test.cjs \
            scripts/skeleton-forge/instruments.test.cjs \
            scripts/skeleton-forge/native-quest.test.cjs
      - name: Typecheck complete frontend
        run: yarn typecheck

  # Independent Linux native-engine evidence, never a device/release pass.
  creator-godot-native:
    needs: creator-native-python
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact native source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install declared native source prerequisites
        run: python -m pip install -e . 'PyYAML>=6,<7'
      - name: Acquire official Godot 4.6 Linux ZIP by pinned release digest
        env:
          GODOT_ARCHIVE_SHA256: 6bcc59dfd1d670e918c77eae06e82b9dc5699de13d353dc3a4b3b6b307b6dc06
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --show-error --silent --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 240 --proto '=https' --proto-redir '=https' --tlsv1.2 --output 'Godot_v4.6-stable_linux.x86_64.zip' 'https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip'
          printf '%s  %s\n' "$GODOT_ARCHIVE_SHA256" 'Godot_v4.6-stable_linux.x86_64.zip' | sha256sum --check --
          python - <<'PY'
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path
          archive = Path(os.environ["RUNNER_TEMP"]) / "Godot_v4.6-stable_linux.x86_64.zip"
          expected = "Godot_v4.6-stable_linux.x86_64"
          target = Path(os.environ['RUNNER_TEMP']) / 'gameforge-godot-native'
          with zipfile.ZipFile(archive) as zf:
              choices = [m for m in zf.infolist() if not m.is_dir() and Path(m.filename).name == expected]
              if len(choices) != 1 or choices[0].file_size > 400 * 1024 * 1024:
                  raise SystemExit('official Godot executable member missing or unbounded')
              if (choices[0].external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                  raise SystemExit('official Godot executable cannot be a symlink')
              with zf.open(choices[0]) as src, target.open('xb') as out:
                  shutil.copyfileobj(src, out, length=1024 * 1024)
          target.chmod(0o700)
          PY
      - name: Import and complete six native baseline and tuned gameplay scenarios
        env:
          GODOT_ARCHIVE_SHA256: 6bcc59dfd1d670e918c77eae06e82b9dc5699de13d353dc3a4b3b6b307b6dc06
        run: |
          set -euo pipefail
          python scripts/qualify_gameforge_godot_native.py \
            --godot "$RUNNER_TEMP/gameforge-godot-native" \
            --archive "$RUNNER_TEMP/Godot_v4.6-stable_linux.x86_64.zip" \
            --archive-sha256 "$GODOT_ARCHIVE_SHA256"
