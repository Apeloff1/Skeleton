name: P3 Native Training Runtime

on:
  pull_request:
    paths:
      - "skeleton/ai/runtime/training/**"
      - "skeleton/testing/test_native_training_runtime.py"
      - ".github/workflows/p3-native-training-runtime.yml"
  push:
    branches:
      - main
      - feat/p3-native-training-frontier
    paths:
      - "skeleton/ai/runtime/training/**"
      - "skeleton/testing/test_native_training_runtime.py"
      - ".github/workflows/p3-native-training-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-native-training-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"
      - run: python -m pytest -q skeleton/testing/test_native_training_runtime.py
