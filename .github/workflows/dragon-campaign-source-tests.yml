          python -m py_compile skeleton/ai/webcrawler/tsv_documents.py
          python -m py_compile skeleton/ai/webcrawler/technical_documents.py
          python -m py_compile skeleton/ai/webcrawler/html_landmarks.py
          python -m py_compile skeleton/ai/webcrawler/binary_media_metadata.py
          python -m py_compile skeleton/ai/webcrawler/zip_inventory.py
          python -m py_compile skeleton/ai/webcrawler/obj_documents.py
          python -m py_compile skeleton/ai/webcrawler/gltf_documents.py
          python -m py_compile skeleton/ai/webcrawler/asset_formats.py
