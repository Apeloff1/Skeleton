name: Dragon campaign source qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/webcrawler/dragon_campaign_stack/**"
      - "skeleton/ai/webcrawler/operations.py"
      - "skeleton/ai/webcrawler/core.py"
      - "skeleton/ai/webcrawler/document_formats.py"
      - "skeleton/ai/webcrawler/frontier_scheduler.py"
      - "skeleton/ai/webcrawler/link_header_discovery.py"
      - "skeleton/ai/webcrawler/structured_discovery.py"
      - "skeleton/ai/webcrawler/bound_http.py"
      - "skeleton/ai/webcrawler/content_coding.py"
      - "tests/test_ai_webcrawler_dragon_http_coding.py"
      - "tests/test_ai_webcrawler_dragon_feed_pagination.py"
      - "tests/test_ai_webcrawler_dragon_gain7.py"
      - "tests/test_ai_webcrawler_dragon_campaign_stack.py"
      - "tests/test_ai_webcrawler_dragon_campaign_depth.py"
      - "tests/test_ai_webcrawler_dragon_atlas.py"
      - "tests/test_ai_webcrawler_dragon_invalidation.py"
      - "tests/test_ai_webcrawler_dragon_review_ops.py"
      - "tests/test_ai_webcrawler_dragon_retrieval_intel.py"
      - "tests/test_ai_webcrawler_dragon_frontier_ops.py"
      - "tests/test_ai_webcrawler_dragon_retrieval_robustness.py"
      - "tests/test_ai_webcrawler_dragon_source_similarity.py"
      - "tests/test_ai_webcrawler_dragon_family_stress.py"
      - "tests/test_ai_webcrawler_dragon_forensics.py"
      - "tests/test_ai_webcrawler_dragon_deep_forensics.py"
      - "tests/test_ai_webcrawler_dragon_custody_wave3.py"
      - "tests/test_ai_webcrawler_dragon_research_ops_wave4.py"
      - "tests/test_ai_webcrawler_dragon_wave5.py"
      - "backend/core/dragon_crawler.py"
      - "backend/routes/dragon_academy.py"
      - ".github/workflows/dragon-campaign-source-tests.yml"

permissions:
  contents: read

concurrency:
  group: dragon-campaign-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  campaign_source:
    name: Bounded campaign integrity, custody and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Compile the completed Dragon campaign stack
        run: |
          python -m compileall -q skeleton/ai/webcrawler/dragon_campaign_stack
          python -m py_compile skeleton/ai/webcrawler/document_formats.py
          python -m py_compile skeleton/ai/webcrawler/frontier_scheduler.py
          python -m py_compile skeleton/ai/webcrawler/link_header_discovery.py
          python -m py_compile skeleton/ai/webcrawler/structured_discovery.py
          python -m py_compile skeleton/ai/webcrawler/core.py
          python -m py_compile skeleton/ai/webcrawler/operations.py
          python -m py_compile skeleton/ai/webcrawler/bound_http.py
          python -m py_compile skeleton/ai/webcrawler/content_coding.py
          python -m py_compile tests/test_ai_webcrawler_dragon_http_coding.py
          python -m py_compile tests/test_ai_webcrawler_dragon_feed_pagination.py
          python -m py_compile tests/test_ai_webcrawler_dragon_campaign_stack.py
          python -m py_compile tests/test_ai_webcrawler_dragon_campaign_depth.py
          python -m py_compile tests/test_ai_webcrawler_dragon_atlas.py
          python -m py_compile tests/test_ai_webcrawler_dragon_invalidation.py
          python -m py_compile tests/test_ai_webcrawler_dragon_review_ops.py
          python -m py_compile tests/test_ai_webcrawler_dragon_retrieval_intel.py
          python -m py_compile tests/test_ai_webcrawler_dragon_frontier_ops.py
          python -m py_compile tests/test_ai_webcrawler_dragon_retrieval_robustness.py
          python -m py_compile tests/test_ai_webcrawler_dragon_source_similarity.py
          python -m py_compile tests/test_ai_webcrawler_dragon_family_stress.py
          python -m py_compile tests/test_ai_webcrawler_dragon_forensics.py
          python -m py_compile tests/test_ai_webcrawler_dragon_deep_forensics.py
          python -m py_compile tests/test_ai_webcrawler_dragon_custody_wave3.py
          python -m py_compile tests/test_ai_webcrawler_dragon_research_ops_wave4.py
          python -m py_compile tests/test_ai_webcrawler_dragon_wave5.py
          python -m py_compile tests/test_ai_webcrawler_dragon_ops_wave6.py
          python -m py_compile tests/test_ai_webcrawler_dragon_live_discovery.py
          python -m py_compile tests/test_ai_webcrawler_dragon_gain7.py
          python -m py_compile backend/core/dragon_crawler.py backend/routes/dragon_academy.py
      - name: Execute source-only campaign regressions
        env:
          PYTHONPATH: "."
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_campaign_stack.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_campaign_depth.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_atlas.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_invalidation.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_review_ops.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_retrieval_intel.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_frontier_ops.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_retrieval_robustness.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_source_similarity.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_family_stress.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_forensics.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_deep_forensics.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_custody_wave3.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_research_ops_wave4.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_wave5.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_ops_wave6.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_live_discovery.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_gain7.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_http_coding.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_feed_pagination.py' -v
