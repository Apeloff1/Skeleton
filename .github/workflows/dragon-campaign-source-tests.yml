name: Dragon campaign source qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-campaign-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  campaign_source:
    name: Bounded campaign integrity, custody and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source-head checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Use supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install pinned guarded PDF parser
        run: python -m pip install --disable-pip-version-check "pypdf==7.0.0"
      - name: Compile the completed Dragon campaign stack
        run: |
          python -m compileall -q skeleton/ai/webcrawler/dragon_campaign_stack
          python -m py_compile skeleton/ai/webcrawler/document_formats.py
          python -m py_compile skeleton/ai/webcrawler/research_projection.py
