  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/webcrawler/dragon_campaign_stack/**"
      - "skeleton/ai/webcrawler/operations.py"
      - "skeleton/ai/webcrawler/core.py"
      - "skeleton/ai/webcrawler/document_formats.py"
      - "skeleton/ai/webcrawler/frontier_scheduler.py"
