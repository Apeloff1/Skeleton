name: AI Core October 2026 Depth Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/intelligence/routing_governance.py"
      - "skeleton/intelligence/knowledge_store.py"
      - "skeleton/context/semantic_compression.py"
      - "skeleton/ai/runtime/intelligence/routing_governance.py"
      - "skeleton/ai/runtime/intelligence/knowledge_store.py"
      - "skeleton/ai/runtime/context/semantic_compression.py"
      - "skeleton/testing/test_routing_governance_oct2026.py"
      - "skeleton/testing/test_semantic_compression_oct2026.py"
      - "skeleton/testing/test_temporal_knowledge_store_oct2026.py"
      - "machine/ai_master_plan.json"
      - ".github/workflows/ai-core-oct2026-depth.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/intelligence/routing_governance.py"
      - "skeleton/intelligence/knowledge_store.py"
      - "skeleton/context/semantic_compression.py"
      - "skeleton/ai/runtime/intelligence/routing_governance.py"
      - "skeleton/ai/runtime/intelligence/knowledge_store.py"
      - "skeleton/ai/runtime/context/semantic_compression.py"
      - "skeleton/testing/test_routing_governance_oct2026.py"
      - "skeleton/testing/test_semantic_compression_oct2026.py"
      - "skeleton/testing/test_temporal_knowledge_store_oct2026.py"
      - "machine/ai_master_plan.json"
      - ".github/workflows/ai-core-oct2026-depth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-core-oct2026-depth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact-head AI core depth validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile canonical and AI-tree implementations
        run: >-
          python -m compileall -q
          skeleton/intelligence/routing_governance.py
          skeleton/intelligence/knowledge_store.py
          skeleton/context/semantic_compression.py
          skeleton/ai/runtime/intelligence/routing_governance.py
          skeleton/ai/runtime/intelligence/knowledge_store.py
          skeleton/ai/runtime/context/semantic_compression.py

      - name: Run adversarial focused regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_router_registry.py
          skeleton/testing/test_routing_governance_oct2026.py
          skeleton/testing/test_semantic_compression_oct2026.py
          skeleton/testing/test_temporal_knowledge_store_oct2026.py
          skeleton/testing/test_context_compiler.py
          skeleton/testing/test_memory_retrieval_knowledge_quality.py

      - name: Assert exact AI-tree byte parity
        shell: bash
        run: |
          set -euo pipefail
          cmp skeleton/intelligence/routing_governance.py skeleton/ai/runtime/intelligence/routing_governance.py
          cmp skeleton/intelligence/knowledge_store.py skeleton/ai/runtime/intelligence/knowledge_store.py
          cmp skeleton/context/semantic_compression.py skeleton/ai/runtime/context/semantic_compression.py

      - name: Validate AI tree and master plan
        run: |
          python scripts/check_ai_file_tree.py
          python scripts/check_ai_master_plan.py
