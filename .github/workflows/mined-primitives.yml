name: Mined Primitive Gates

on:
  push:
    paths:
      - "backend/core/worm_audit.py"
      - "backend/tests/test_worm_audit.py"
      - "frontend/scripts/ui-regression-verdict.mjs"
      - "frontend/scripts/ui-regression-verdict.test.mjs"
      - ".github/workflows/mined-primitives.yml"
  pull_request:
    paths:
      - "backend/core/worm_audit.py"
      - "backend/tests/test_worm_audit.py"
      - "frontend/scripts/ui-regression-verdict.mjs"
      - "frontend/scripts/ui-regression-verdict.test.mjs"
      - ".github/workflows/mined-primitives.yml"

permissions:
  contents: read

jobs:
  backend-worm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8,<9"
      - name: Run WORM ledger regression suite
        run: python -m pytest -q --noconftest tests/test_worm_audit.py

  frontend-ui-verdict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run mined UI regression oracle tests
        run: node --test scripts/ui-regression-verdict.test.mjs
