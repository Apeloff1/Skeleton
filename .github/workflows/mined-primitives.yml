name: Mined Primitive Gates

on:
  push:
    paths:
      - "backend/core/worm_audit.py"
      - "backend/tests/test_worm_audit.py"
      - "frontend/scripts/ui-regression-verdict.mjs"
      - "frontend/scripts/ui-regression-verdict.test.mjs"
      - ".github/workflows/mined-primitives.yml"
  pull_request:
    paths:
      - "backend/core/worm_audit.py"
      - "backend/tests/test_worm_audit.py"
      - "frontend/scripts/ui-regression-verdict.mjs"
      - "frontend/scripts/ui-regression-verdict.test.mjs"
      - ".github/workflows/mined-primitives.yml"

permissions:
  contents: read

jobs:
  backend-worm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Run WORM ledger regression suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --noconftest tests/test_worm_audit.py

  frontend-ui-verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Run mined UI regression oracle tests
        run: node --test scripts/ui-regression-verdict.test.mjs
