name: P0 Compaction Trust Geometry

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/context/compaction.py"
      - "skeleton/ai/runtime/context/compaction.py"
      - "skeleton/contracts/context.py"
      - "skeleton/testing/test_context_compaction_trust_geometry.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - "machine/backlog_registry.json"
      - ".github/workflows/p0-compaction-trust-geometry.yml"
  workflow_dispatch:


concurrency:
  group: p0-compaction-trust-geometry-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compaction-trust-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify canonical/AI compaction mirror
        run: cmp skeleton/context/compaction.py skeleton/ai/runtime/context/compaction.py
      - name: Run trust-geometry regressions
        run: python -m pytest -q skeleton/testing/test_context_compaction_trust_geometry.py
