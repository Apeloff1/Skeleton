name: P0 Rooted Filesystem Race Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/security/rooted_fs.py"
      - "skeleton/testing/test_security_rooted_fs.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-rooted-fs-race-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rooted-fs-races:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run symlink and temporary-file race regressions
        run: >-
          python -m pytest -q
          skeleton/testing/test_security_rooted_fs.py::test_existing_symlink_file_is_never_read
          skeleton/testing/test_security_rooted_fs.py::test_symlink_parent_is_never_traversed_for_write
          skeleton/testing/test_security_rooted_fs.py::test_read_remains_bound_when_parent_path_is_swapped
          skeleton/testing/test_security_rooted_fs.py::test_stream_write_cannot_escape_after_parent_path_swap
          skeleton/testing/test_security_rooted_fs.py::test_failed_stream_does_not_leave_temp_files
          skeleton/testing/test_security_rooted_fs.py::test_temporary_directory_fails_closed_on_root_path_swap
          skeleton/testing/test_security_rooted_fs.py::test_remove_file_rejects_symlink_without_touching_target
