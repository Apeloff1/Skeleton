name: AI Effectiveness Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/intelligence/execution_runtime.py"
      - "skeleton/testing/test_ai_effectiveness.py"
      - "skeleton/testing/test_vs001_functional_ai.py"
      - ".github/workflows/ai-effectiveness-acceptance.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/intelligence/execution_runtime.py"
      - "skeleton/testing/test_ai_effectiveness.py"
      - "skeleton/testing/test_vs001_functional_ai.py"
      - ".github/workflows/ai-effectiveness-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-effectiveness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  effect-postcondition-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install project test runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run effect acceptance and VS-001 regressions
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_ai_effectiveness.py
          skeleton/testing/test_vs001_functional_ai.py
