name: Archive closed PR branches safely

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Prune redundant branches safely"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7-57/10 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/branch-archive.yml']

concurrency:
  group: branch-archive-v2-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  archive:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    name: Tag and remove inactive closed-PR refs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch complete branch graph
        shell: bash
        run: |
          set -euo pipefail

          auth_dir="$RUNNER_TEMP/branch-archive-auth"
          mkdir -p "$auth_dir"
          cat > "$auth_dir/askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$auth_dir/askpass.sh"
          export GIT_ASKPASS="$auth_dir/askpass.sh"
          export GIT_ASKPASS_REQUIRE=force
          {
            echo "GIT_ASKPASS=$GIT_ASKPASS"
            echo 'GIT_ASKPASS_REQUIRE=force'
          } >> "$GITHUB_ENV"

          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Archive exact inactive closed PR heads
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          cutoff=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')

          declare -A open_heads=()
          declare -A open_bases=()
          declare -A archive_pr=()

          load_open_refs() {
            local branch heads_file bases_file
            heads_file="$RUNNER_TEMP/archive-open-heads.txt"
            bases_file="$RUNNER_TEMP/archive-open-bases.txt"
            open_heads=()
            open_bases=()

            # Persist API results before consuming them. Process substitution can
            # hide a failed gh command from set -e and make "unknown" look empty.
            if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .head.ref' \
              > "$heads_file"; then
              echo '::warning::Branch archive could not load open pull-request heads; no further refs will be deleted.'
              return 1
            fi
            if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .base.ref' \
              > "$bases_file"; then
              echo '::warning::Branch archive could not load open pull-request bases; no further refs will be deleted.'
              return 1
            fi

            while IFS= read -r branch; do
              [[ -n "$branch" ]] || continue
              open_heads["$branch"]=1
            done < "$heads_file"

            while IFS= read -r branch; do
              [[ -n "$branch" && "$branch" != main ]] || continue
              open_bases["$branch"]=1
            done < "$bases_file"
          }
          load_archive_candidates() {
            local branch tip pr candidates_file
            candidates_file="$RUNNER_TEMP/archive-candidates.tsv"
            archive_pr=()
            if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
              --jq ".[] | select(.closed_at != null and .closed_at <= \"$cutoff\" and .head.repo.full_name == .base.repo.full_name) | [.head.ref, .head.sha, (.number|tostring)] | @tsv" \
              > "$candidates_file"; then
              echo '::warning::Branch archive could not load closed pull-request heads; no refs will be deleted.'
              return 1
            fi
            while IFS=$'\t' read -r branch tip pr; do
              [[ -n "$branch" && -n "$tip" && -n "$pr" ]] || continue
              archive_pr["${branch}:${tip}"]="$pr"
            done < "$candidates_file"
          }
          if ! load_open_refs; then
            {
              echo '## Closed PR branch archive deferred'
              echo '- Open pull-request refs were unavailable.'
              echo '- No refs were deleted because active-PR protection could not be established.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! load_archive_candidates; then
            {
              echo '## Closed PR branch archive deferred'
              echo '- Closed pull-request evidence was unavailable.'
              echo '- No refs were deleted because archive candidates could not be established.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          archived=0
          preserved_open=0
          preserved_named=0
          raced=0
          tag_conflict=0
          no_match=0

          while read -r tip branch; do
            [[ -n "$tip" && -n "$branch" ]] || continue

            case "$branch" in
              main|master|develop|development|staging|production|prod|gh-pages|release/*|keep/*|backup/*|archive/*)
                preserved_named=$((preserved_named + 1))
                continue
                ;;
            esac

            if [[ -n "${open_heads[$branch]+x}" || -n "${open_bases[$branch]+x}" ]]; then
              preserved_open=$((preserved_open + 1))
              continue
            fi

            key="${branch}:${tip}"
            pr="${archive_pr[$key]-}"
            if [[ -z "$pr" ]]; then
              no_match=$((no_match + 1))
              continue
            fi

            # Revalidate both PR references immediately before mutation.
            # If GitHub cannot establish the active-PR set, stop the sweep.
            if ! load_open_refs; then
              {
                echo '## Closed PR branch archive stopped safely'
                echo '- Open pull-request revalidation failed during the sweep.'
                echo '- No additional refs were deleted.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ -n "${open_heads[$branch]+x}" || -n "${open_bases[$branch]+x}" ]]; then
              preserved_open=$((preserved_open + 1))
              continue
            fi

            live_tip=$(git ls-remote --heads origin "refs/heads/${branch}" | awk 'NR==1 {print $1}')
            if [[ -z "$live_tip" || "$live_tip" != "$tip" ]]; then
              raced=$((raced + 1))
              continue
            fi

            tag="archive/closed-pr/pr-${pr}-${tip:0:12}"
            remote_tag=$(git ls-remote --refs --tags origin "refs/tags/${tag}" | awk 'NR==1 {print $1}')
            if [[ -z "$remote_tag" ]]; then
              if ! git push --quiet origin "${tip}:refs/tags/${tag}"; then
                tag_conflict=$((tag_conflict + 1))
                continue
              fi
              remote_tag=$(git ls-remote --refs --tags origin "refs/tags/${tag}" | awk 'NR==1 {print $1}')
            fi

            if [[ "$remote_tag" != "$tip" ]]; then
              tag_conflict=$((tag_conflict + 1))
              continue
            fi

            # The tag now preserves the exact closed-PR commit. Delete only if
            # the branch still points at the expected tip.
            if git push --quiet "--force-with-lease=refs/heads/${branch}:${tip}" origin ":refs/heads/${branch}"; then
              archived=$((archived + 1))
            else
              raced=$((raced + 1))
            fi
          done < <(
            git for-each-ref --format='%(objectname) %(refname:strip=3)' refs/remotes/origin | sort -k2,2
          )

          {
            echo '## Closed PR branch archive'
            echo "- Cutoff: closed on or before \`$cutoff\`"
            echo "- Branches archived to exact tags then removed: $archived"
            echo "- Open PR head/base refs preserved: $preserved_open"
            echo "- Protected-name refs preserved: $preserved_named"
            echo "- Refs without an exact inactive closed-PR match preserved: $no_match"
            echo "- Branches that moved during cleanup preserved: $raced"
            echo "- Archive-tag conflicts preserved: $tag_conflict"
            echo '- Archive candidates include merged and unmerged PRs closed for at least 24 hours.'
            echo '- Archive tags use archive/closed-pr/pr-<number>-<sha12>.'
            echo '- No branch is deleted until its exact commit is confirmed reachable through the archive tag.'
            echo '- Any open-PR or closed-PR API failure stops deletion instead of being interpreted as an empty result.'
          } >> "$GITHUB_STEP_SUMMARY"
