name: Archive closed PR and duplicate-tip branches safely

on:
  workflow_dispatch:
  schedule:
    - cron: '7-57/10 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/branch-archive.yml']

concurrency:
  # Independent ARM maintenance lane; earlier queued x64 archive runs stay isolated.
  group: branch-archive-v3-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  archive:
    name: Preserve and prune inactive refs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch complete branch graph
        shell: bash
        run: |
          set -euo pipefail

          auth_dir="$RUNNER_TEMP/branch-archive-auth"
          mkdir -p "$auth_dir"
          cat > "$auth_dir/askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$auth_dir/askpass.sh"
          export GIT_ASKPASS="$auth_dir/askpass.sh"
          export GIT_ASKPASS_REQUIRE=force
          {
            echo "GIT_ASKPASS=$GIT_ASKPASS"
            echo 'GIT_ASKPASS_REQUIRE=force'
          } >> "$GITHUB_ENV"

          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Archive exact inactive closed PR heads
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          cutoff=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')

          declare -A open_heads=()
          declare -A open_bases=()
          declare -A archive_pr=()

          load_open_refs() {
            local branch heads_file bases_file
            heads_file="$RUNNER_TEMP/branch-archive-open-heads.txt"
            bases_file="$RUNNER_TEMP/branch-archive-open-bases.txt"
            open_heads=()
            open_bases=()

            # A process substitution can conceal API failures from set -e.
            # Resolve each snapshot completely before any cleanup decision.
            if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .head.ref' \
              > "$heads_file"; then
              echo '::error::Open PR heads unavailable; refusing branch archive mutations.'
              return 1
            fi
            if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .base.ref' \
              > "$bases_file"; then
              echo '::error::Open PR bases unavailable; refusing branch archive mutations.'
              return 1
            fi

            while IFS= read -r branch; do
              [[ -n "$branch" ]] || continue
              open_heads["$branch"]=1
            done < "$heads_file"
            while IFS= read -r branch; do
              [[ -n "$branch" && "$branch" != main ]] || continue
              open_bases["$branch"]=1
            done < "$bases_file"
          }

          load_archive_candidates() {
            local branch tip pr candidates_file
            candidates_file="$RUNNER_TEMP/branch-archive-closed-candidates.tsv"
            archive_pr=()

            if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
              --jq ".[] | select(.merged_at == null and .closed_at != null and .closed_at <= \"$cutoff\" and .head.repo.full_name == .base.repo.full_name) | [.head.ref, .head.sha, (.number|tostring)] | @tsv" \
              > "$candidates_file"; then
              echo '::error::Closed PR history unavailable; refusing branch archive mutations.'
              return 1
            fi

            while read -r branch tip pr; do
              [[ -n "$branch" && -n "$tip" && -n "$pr" ]] || continue
              archive_pr["${branch}:${tip}"]="$pr"
            done < "$candidates_file"
          }

          if ! load_open_refs || ! load_archive_candidates; then
            echo '::error::Branch archive snapshots incomplete; no branches deleted.'
            exit 1
          fi

          archived=0
          preserved_open=0
          preserved_named=0
          raced=0
          tag_conflict=0
          no_match=0

          while read -r tip branch; do
            [[ -n "$tip" && -n "$branch" ]] || continue

            case "$branch" in
              main|master|develop|development|staging|production|prod|gh-pages|release/*|keep/*|backup/*|archive/*)
                preserved_named=$((preserved_named + 1))
                continue
                ;;
            esac

            if [[ -n "${open_heads[$branch]+x}" || -n "${open_bases[$branch]+x}" ]]; then
              preserved_open=$((preserved_open + 1))
              continue
            fi

            key="${branch}:${tip}"
            pr="${archive_pr[$key]-}"
            if [[ -z "$pr" ]]; then
              no_match=$((no_match + 1))
              continue
            fi

            # Revalidate both PR references immediately before mutation.
            if ! load_open_refs; then
              echo '::error::Late PR revalidation failed; no further branch deletes.'
              exit 1
            fi
            if [[ -n "${open_heads[$branch]+x}" || -n "${open_bases[$branch]+x}" ]]; then
              preserved_open=$((preserved_open + 1))
              continue
            fi

            live_tip=$(git ls-remote --heads origin "refs/heads/${branch}" | awk 'NR==1 {print $1}')
            if [[ -z "$live_tip" || "$live_tip" != "$tip" ]]; then
              raced=$((raced + 1))
              continue
            fi

            tag="archive/closed-pr/pr-${pr}-${tip:0:12}"
            remote_tag=$(git ls-remote --refs --tags origin "refs/tags/${tag}" | awk 'NR==1 {print $1}')
            if [[ -z "$remote_tag" ]]; then
              if ! git push --quiet origin "${tip}:refs/tags/${tag}"; then
                tag_conflict=$((tag_conflict + 1))
                continue
              fi
              remote_tag=$(git ls-remote --refs --tags origin "refs/tags/${tag}" | awk 'NR==1 {print $1}')
            fi

            if [[ "$remote_tag" != "$tip" ]]; then
              tag_conflict=$((tag_conflict + 1))
              continue
            fi

            # The tag now preserves the exact closed-PR commit. Delete only if
            # the branch still points at the expected tip.
            if git push --quiet "--force-with-lease=refs/heads/${branch}:${tip}" origin ":refs/heads/${branch}"; then
              archived=$((archived + 1))
            else
              raced=$((raced + 1))
            fi
          done < <(
            git for-each-ref --format='%(objectname) %(refname:strip=3)' refs/remotes/origin | sort -k2,2
          )

          {
            echo '## Closed PR branch archive'
            echo "- Cutoff: closed on or before \`$cutoff\`"
            echo "- Branches archived to exact tags then removed: $archived"
            echo "- Open PR head/base refs preserved: $preserved_open"
            echo "- Protected-name refs preserved: $preserved_named"
            echo "- Refs without an exact inactive closed-PR match preserved: $no_match"
            echo "- Branches that moved during cleanup preserved: $raced"
            echo "- Archive-tag conflicts preserved: $tag_conflict"
            echo '- Archive tags use archive/closed-pr/pr-<number>-<sha12>.'
            echo '- No branch is deleted until its exact commit is confirmed reachable through the archive tag.'
          } >> "$GITHUB_STEP_SUMMARY"

          # Exact-tip duplicate aliases carry no distinct commits. Preserve
          # a stable survivor *and* a remote recovery tag before retiring old
          # secondary names. Never infer that their work is on main.
          git fetch --quiet --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
          if ! load_open_refs; then
            echo '::warning::Duplicate archive skipped: open PR refs unavailable.'
            exit 0
          fi

          events_file="$RUNNER_TEMP/branch-archive-ref-events.tsv"
          if ! gh api --paginate "/repos/$GITHUB_REPOSITORY/events?per_page=100" \
            --jq '.[] | select((.type == "CreateEvent" or .type == "DeleteEvent") and .payload.ref_type == "branch") | [.type, .payload.ref, .created_at] | @tsv' \
            > "$events_file"; then
            echo '::warning::Duplicate archive skipped: branch event inventory unavailable.'
            exit 0
          fi

          declare -A recent_create=()
          declare -A recent_delete=()
          declare -A survivor=()
          declare -A survivor_priority=()

          while IFS=$'\t' read -r kind ref when; do
            [[ -n "$kind" && -n "$ref" && -n "$when" ]] || continue
            epoch=$(date -u -d "$when" +%s 2>/dev/null || true)
            [[ "$epoch" =~ ^[0-9]+$ ]] || continue
            if [[ "$kind" == CreateEvent ]]; then
              if (( epoch > ${recent_create[$ref]:-0} )); then
                recent_create["$ref"]="$epoch"
              fi
            else
              if (( epoch > ${recent_delete[$ref]:-0} )); then
                recent_delete["$ref"]="$epoch"
              fi
            fi
          done < "$events_file"

          # The lexicographically first branch survives ties. Named protected
          # refs and active PR heads/bases always outrank disposable aliases.
          while read -r tip branch; do
            [[ -n "$tip" && -n "$branch" ]] || continue
            priority=2
            case "$branch" in
              main|master|develop|development|staging|production|prod|gh-pages|release/*|keep/*|backup/*|archive/*)
                priority=0
                ;;
            esac
            if [[ -n "${open_heads[$branch]+x}" || -n "${open_bases[$branch]+x}" ]]; then
              priority=0
            fi
            if [[ -z "${survivor[$tip]+x}" ]] || (( priority < survivor_priority[$tip] )); then
              survivor["$tip"]="$branch"
              survivor_priority["$tip"]="$priority"
            fi
          done < <(
            git for-each-ref --format='%(objectname) %(refname:strip=3)' refs/remotes/origin | sort -k2,2
          )

          duplicate_archived=0
          duplicate_preserved=0
          duplicate_races=0
          duplicate_cap=20
          now_epoch=$(date -u +%s)
          while read -r tip branch; do
            [[ -n "$tip" && -n "$branch" ]] || continue
            [[ "$branch" != "${survivor[$tip]}" ]] || continue

            case "$branch" in
              main|master|develop|development|staging|production|prod|gh-pages|release/*|keep/*|backup/*|archive/*)
                duplicate_preserved=$((duplicate_preserved + 1))
                continue
                ;;
            esac
            if [[ -n "${open_heads[$branch]+x}" || -n "${open_bases[$branch]+x}" ]]; then
              duplicate_preserved=$((duplicate_preserved + 1))
              continue
            fi
            created="${recent_create[$branch]:-}"
            deleted="${recent_delete[$branch]:-}"
            if [[ -n "$created" ]]; then
              if (( now_epoch - created < 86400 || now_epoch < created )); then
                duplicate_preserved=$((duplicate_preserved + 1))
                continue
              fi
              if [[ -n "$deleted" ]] && (( deleted >= created )); then
                duplicate_preserved=$((duplicate_preserved + 1))
                continue
              fi
            fi
            committed=$(git show -s --format=%ct "$tip" 2>/dev/null || true)
            if [[ ! "$committed" =~ ^[0-9]+$ ]] || (( now_epoch - committed < 604800 )); then
              duplicate_preserved=$((duplicate_preserved + 1))
              continue
            fi

            # Rate-limit the number of write attempts per pass, not just
            # successful deletes, to avoid amplifying repository congestion.
            if (( duplicate_archived + duplicate_races >= duplicate_cap )); then
              echo '::notice::Duplicate-tip archive write budget exhausted.'
              break
            fi

            # Revalidate after inventory: no new open PR may lose its branch.
            if ! load_open_refs; then
              echo '::warning::PR revalidation unavailable; stopping duplicate cleanup.'
              break
            fi
            if [[ -n "${open_heads[$branch]+x}" || -n "${open_bases[$branch]+x}" ]]; then
              duplicate_preserved=$((duplicate_preserved + 1))
              continue
            fi
            keeper="${survivor[$tip]}"
            keeper_live=$(git ls-remote --heads origin "refs/heads/$keeper" | awk 'NR==1 {print $1}')
            branch_live=$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR==1 {print $1}')
            if [[ "$keeper_live" != "$tip" || "$branch_live" != "$tip" ]]; then
              duplicate_races=$((duplicate_races + 1))
              continue
            fi

            branch_fingerprint=$(printf '%s' "$branch" | sha256sum | cut -c1-16)
            tag="archive/duplicate-ref/${tip:0:12}-$branch_fingerprint"
            remote_tag=$(git ls-remote --refs --tags origin "refs/tags/$tag" | awk 'NR==1 {print $1}')
            if [[ -z "$remote_tag" ]]; then
              if ! git push --quiet origin "$tip:refs/tags/$tag"; then
                duplicate_races=$((duplicate_races + 1))
                continue
              fi
              remote_tag=$(git ls-remote --refs --tags origin "refs/tags/$tag" | awk 'NR==1 {print $1}')
            fi
            if [[ "$remote_tag" != "$tip" ]]; then
              duplicate_races=$((duplicate_races + 1))
              continue
            fi

            if ! load_open_refs; then
              echo '::warning::Post-tag PR revalidation unavailable; keeping branch.'
              break
            fi
            if [[ -n "${open_heads[$branch]+x}" || -n "${open_bases[$branch]+x}" ]]; then
              duplicate_preserved=$((duplicate_preserved + 1))
              continue
            fi
            keeper_live=$(git ls-remote --heads origin "refs/heads/$keeper" | awk 'NR==1 {print $1}')
            if [[ "$keeper_live" != "$tip" ]]; then
              duplicate_races=$((duplicate_races + 1))
              continue
            fi
            if git push --quiet "--force-with-lease=refs/heads/$branch:$tip" origin ":refs/heads/$branch"; then
              duplicate_archived=$((duplicate_archived + 1))
            else
              duplicate_races=$((duplicate_races + 1))
            fi
          done < <(
            git for-each-ref --format='%(objectname) %(refname:strip=3)' refs/remotes/origin | sort -k2,2
          )

          {
            echo
            echo '## Exact-tip duplicate archive'
            echo "- Redundant aliases tagged then deleted: $duplicate_archived"
            echo "- Recent, protected, or PR-related aliases preserved: $duplicate_preserved"
            echo "- Moved refs, tag failures, and blocked deletes: $duplicate_races"
            echo "- Write budget: $duplicate_cap"
            echo '- No duplicate is deleted without a surviving same-SHA branch and an exact-SHA recovery tag.'
            echo '- Minimum commit age: seven days; observed recent creations or delayed recreations are preserved.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Duplicate-tip archive: deleted=$duplicate_archived, preserved=$duplicate_preserved, races=$duplicate_races"
