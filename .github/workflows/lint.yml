name: Lint

# Guards against ESLint debt silently re-accumulating in the Expo frontend.
# Keep the workflow itself in the path filter so CI changes validate themselves.

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

# Do not terminate the active lint pass when main is receiving rapid commits.
# GitHub keeps only the newest pending run, so validation completes without an unbounded queue.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run ESLint (zero warnings allowed)
        env:
          CI: "true"
        run: yarn lint:ci
