name: AI Accountability Closure Bridge

on:
  push:
    branches:
      - main
    paths:
      - "machine/ai_accountability_closure_map.json"
      - "machine/ai_build_accountability.json"
      - "machine/ai_build_queue.json"
      - "machine/ai_app_construction.json"
      - "machine/ai_implementation_handoff.json"
      - "machine/ai_closure_evidence.json"
      - "scripts/ai_accountability.py"
      - "scripts/check_ai_build_accountability.py"
      - "scripts/verify_ai_accountability_closure_map.py"
      - "scripts/run_ai_accountability_verifiers.py"
      - "scripts/verify_*.py"
      - "tests/test_ai_accountability_closure_map.py"
      - "tests/test_*verifier*.py"
      - ".github/workflows/*closure*.yml"
      - ".github/workflows/state-recovery-drill.yml"
      - ".github/workflows/engine-container-boundary.yml"
      - ".github/workflows/ai-accountability-closure-map.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_accountability_closure_map.json"
      - "machine/ai_build_accountability.json"
      - "machine/ai_build_queue.json"
      - "machine/ai_app_construction.json"
      - "machine/ai_implementation_handoff.json"
      - "machine/ai_closure_evidence.json"
      - "scripts/ai_accountability.py"
      - "scripts/check_ai_build_accountability.py"
      - "scripts/verify_ai_accountability_closure_map.py"
      - "scripts/run_ai_accountability_verifiers.py"
      - "scripts/verify_*.py"
      - "tests/test_ai_accountability_closure_map.py"
      - "tests/test_*verifier*.py"
      - ".github/workflows/*closure*.yml"
      - ".github/workflows/state-recovery-drill.yml"
      - ".github/workflows/engine-container-boundary.yml"
      - ".github/workflows/ai-accountability-closure-map.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-accountability-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  accountability-closure-map:
    name: Independent accountability closure-map verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Validate canonical accountability ledger
        run: python scripts/check_ai_build_accountability.py

      - name: Run accountability bridge adversarial tests
        run: >-
          python -m pytest -q --noconftest
          tests/test_ai_accountability_closure_map.py
          tests/test_ai_accountability_verifier_runner.py
          tests/test_ai_p0_accountability_terminal_verifier.py
          tests/test_engine_application_boundary_independent_verifier.py
          tests/test_memory_authority_independent_verifier.py
          tests/test_provider_protocol_independent_verifier.py

      - name: Re-verify inherited terminal masterplan on exact PR head
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_masterplan_completion.py
          --evidence-out .stack-masterplan-completion.json
          --print-evidence

      - name: Assert inherited masterplan remains terminal
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".stack-masterplan-completion.json").read_text(encoding="utf-8")
          )
          if receipt.get("head_sha") != os.environ["EXPECTED_SHA"].strip():
              raise SystemExit("stack masterplan receipt is not exact-head")
          if receipt.get("verifier") != "independent-masterplan-completion-v1":
              raise SystemExit("unexpected stack masterplan verifier identity")
          if receipt.get("actual_gap_count") != 17 or receipt.get("open_gaps"):
              raise SystemExit("stack no longer contains 17/17 closed masterplan gaps")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("inherited terminal masterplan verification failed")
          PY

      - name: Execute every declared verifier on exact PR head
        env:
          ACCOUNTABILITY_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/run_ai_accountability_verifiers.py
          --head-sha "$ACCOUNTABILITY_HEAD_SHA"
          --evidence-out .ai-accountability-verifier-runner.json
          --print-evidence

      - name: Assert all declared verifiers passed exact head
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".ai-accountability-verifier-runner.json").read_text(
                  encoding="utf-8"
              )
          )
          if receipt.get("head_sha") != os.environ["EXPECTED_SHA"].strip():
              raise SystemExit("verifier-runner receipt is not exact-head")
          if receipt.get("verifier") != "ai-accountability-verifier-runner-v1":
              raise SystemExit("unexpected verifier-runner identity")
          if receipt.get("verifier_count") != 14:
              raise SystemExit("accountability verifier inventory must contain 14 groups")
          if receipt.get("passed_count") != 14 or receipt.get("failures"):
              raise SystemExit("not every declared accountability verifier passed")
          results = receipt.get("results") or []
          if len(results) != 14:
              raise SystemExit("verifier-runner result inventory is incomplete")
          if any(result.get("receipt_head_sha") != receipt.get("head_sha") for result in results):
              raise SystemExit("a child verifier receipt is not exact-head")
          if any(not result.get("receipt_digest") for result in results):
              raise SystemExit("a child verifier receipt digest is missing")
          if receipt.get("valid") is not True:
              raise SystemExit("accountability verifier runner is invalid")
          PY

      - name: Emit exact-head accountability closure-map receipt
        env:
          ACCOUNTABILITY_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_ai_accountability_closure_map.py
          --evidence-out .ai-accountability-closure-map.json
          --print-evidence

      - name: Assert exact-head bridge receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".ai-accountability-closure-map.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("accountability bridge receipt is not exact-head")
          if receipt.get("verifier") != "ai-accountability-closure-map-v1":
              raise SystemExit("unexpected accountability bridge verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("accountability closure map is invalid")
          if receipt.get("task_count") != 42:
              raise SystemExit("accountability queue must contain exactly 42 atomic tasks")
          if receipt.get("mapped_task_count") != 42:
              raise SystemExit("not every atomic queue task is mapped")
          if receipt.get("group_count") != 14:
              raise SystemExit("accountability map must contain exactly 14 gap groups")
          groups = receipt.get("groups") or []
          if len(groups) != 14 or any(
              not group.get("verifier_script") for group in groups
          ):
              raise SystemExit(
                  "every accountability group must bind an independent verifier"
              )
          counts = receipt.get("candidate_counts") or {}
          if sum(int(value) for value in counts.values()) != 42:
              raise SystemExit("candidate-state accounting does not cover all tasks")
          if not all(receipt.get("digests", {}).values()):
              raise SystemExit("accountability bridge digests are incomplete")
          print(
              "AI accountability closure bridge exact-head receipt:",
              expected,
              counts,
          )
          PY

      - name: Verify terminal 42-of-42 P0 accountability on exact head
        env:
          ACCOUNTABILITY_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_ai_p0_accountability_terminal.py
          --head-sha "$ACCOUNTABILITY_HEAD_SHA"
          --verifier-receipt .ai-accountability-verifier-runner.json
          --closure-map-receipt .ai-accountability-closure-map.json
          --evidence-out .ai-p0-accountability-terminal.json
          --print-evidence

      - name: Assert terminal P0 receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".ai-p0-accountability-terminal.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("terminal P0 receipt is not exact-head")
          if receipt.get("verifier") != "ai-p0-accountability-terminal-v1":
              raise SystemExit("unexpected terminal P0 verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("terminal P0 accountability verification failed")
          if receipt.get("task_count") != 42:
              raise SystemExit("terminal P0 queue must contain exactly 42 tasks")
          if receipt.get("terminal_task_count") != 42:
              raise SystemExit("terminal P0 closure requires 42/42 done")
          if receipt.get("group_count") != 14:
              raise SystemExit("terminal P0 closure requires all 14 verifier groups")
          if receipt.get("fresh_verifier_pass_count") != 14:
              raise SystemExit("terminal P0 closure requires 14/14 fresh verifiers")
          if not all(receipt.get("digests", {}).values()):
              raise SystemExit("terminal P0 evidence digests are incomplete")
          print(
              "AI P0 terminal accountability exact-head receipt:",
              expected,
              f"{receipt['terminal_task_count']}/{receipt['task_count']}",
          )
          PY
