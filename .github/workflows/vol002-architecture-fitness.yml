name: VOL-002 Architecture Fitness and Ownership Gate

on:
  pull_request:
    paths:
      - "machine/architecture.json"
      - "machine/ai_app_construction.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_master_plan.json"
      - "skeleton/app/manifest.json"
      - "scripts/check_architecture_map.py"
      - "skeleton/testing/test_architecture_map.py"
      - "tests/test_architecture_boundaries.py"
      - ".github/workflows/vol002-architecture-fitness.yml"
  push:
    branches: [main]
    paths:
      - "machine/architecture.json"
      - "machine/ai_app_construction.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_master_plan.json"
      - "skeleton/app/manifest.json"
      - "scripts/check_architecture_map.py"
      - "skeleton/testing/test_architecture_map.py"
      - "tests/test_architecture_boundaries.py"
      - ".github/workflows/vol002-architecture-fitness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol002-architecture-fitness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-fitness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"

      - name: Compile architecture validator
        run: python -m compileall -q scripts/check_architecture_map.py

      - name: Validate architecture and ownership fitness
        run: python scripts/check_architecture_map.py --json

      - name: Run architecture regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_architecture_map.py
          tests/test_architecture_boundaries.py
