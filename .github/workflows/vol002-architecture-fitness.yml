name: VOL-002 Architecture Fitness and Ownership Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/architecture.json"
      - "machine/ai_app_construction.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_master_plan.json"
      - "skeleton/app/manifest.json"
      - "scripts/check_architecture_map.py"
      - "scripts/verify_vol002_architecture_fitness.py"
      - "skeleton/testing/test_architecture_map.py"
      - "tests/test_architecture_boundaries.py"
      - "tests/test_vol002_architecture_independent_verifier.py"
      - ".github/workflows/vol002-architecture-fitness.yml"
  push:
    branches:
      - main
    paths:
      - "machine/architecture.json"
      - "machine/ai_app_construction.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_master_plan.json"
      - "skeleton/app/manifest.json"
      - "scripts/check_architecture_map.py"
      - "scripts/verify_vol002_architecture_fitness.py"
      - "skeleton/testing/test_architecture_map.py"
      - "tests/test_architecture_boundaries.py"
      - "tests/test_vol002_architecture_independent_verifier.py"
      - ".github/workflows/vol002-architecture-fitness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol002-architecture-fitness-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture-fitness:
    name: Canonical architecture fitness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install architecture validation runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile architecture validator
        run: python -m compileall -q scripts/check_architecture_map.py

      - name: Validate architecture and ownership fitness
        run: python scripts/check_architecture_map.py --json

      - name: Run architecture regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_architecture_map.py
          tests/test_architecture_boundaries.py

  architecture-fitness-independent:
    name: Independent exact-head architecture verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install independent verifier dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Run independent verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_vol002_architecture_independent_verifier.py

      - name: Emit independent exact-head architecture receipt
        run: >-
          python scripts/verify_vol002_architecture_fitness.py
          --evidence-out .vol002-architecture-independent.json
          --print-evidence

      - name: Assert exact-head receipt identity and coverage
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".vol002-architecture-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("VOL-002 receipt does not bind exact head")
          if receipt.get("verifier") != "independent-vol002-architecture-v1":
              raise SystemExit("unexpected VOL-002 verifier identity")
          if receipt.get("volume") != "VOL-002":
              raise SystemExit("architecture verifier bound wrong masterplan volume")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent VOL-002 verification failed")
          if len(receipt.get("canonical_root_ids") or []) < 8:
              raise SystemExit("canonical root coverage is incomplete")
          if len(receipt.get("runtime_node_ids") or []) < 5:
              raise SystemExit("runtime-node coverage is incomplete")
          if not receipt.get("zone_order") or not receipt.get("runtime_order"):
              raise SystemExit("architecture DAG evidence is incomplete")
          binding = receipt.get("volume_binding") or {}
          if len(binding.get("binding_digest") or "") != 64:
              raise SystemExit("VOL-002 masterplan binding digest is missing")
          if len(receipt.get("receipt_digest") or "") != 64:
              raise SystemExit("VOL-002 closure receipt digest is invalid")
          print(
              "VOL-002 independent exact-head receipt:",
              expected,
              receipt["receipt_digest"],
          )
          PY
