name: PR Lifecycle Signal

on:
  pull_request:
    branches: [main]
    types: [synchronize, closed]

# Only the newest lifecycle signal for a PR is useful to the default-branch
# workflow_run drainer. Collapse superseded signals so this tiny control-plane
# trigger cannot become part of the Actions queue it is intended to drain.
concurrency:
  group: pr-lifecycle-signal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# This workflow intentionally has no write token and never checks out or executes
# repository code. Its completion is only a trusted trigger for the privileged
# workflow_run drainer on the default branch.
permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit lifecycle signal
        run: printf '%s\n' 'pull-request lifecycle signal complete'
