name: Advanced Godot Native Physics Laboratory
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/game_builder/advanced_physics_godot.py"
      - "docs/GAME_BUILDER_NATIVE_PHYSICS_LAB.md"
      - "skeleton/ai/game_builder/advanced_physics_runtime.py"
      - "skeleton/ai/game_builder/advanced_godot_export.py"
      - "skeleton/ai/game_builder/game_workspace_server.py"
      - "skeleton/ai/game_builder/game_workspace_ui.py"
      - "tests/test_game_builder_advanced_physics_godot.py"
      - ".github/workflows/game-builder-advanced-physics-native.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-physics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independent-fixedpoint-game:
    name: Independent Python/Godot physics parity on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Checkout exact branch head and original engine sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_advanced_physics_godot.py
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Godot 4.4.1 real native runtime and templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: "4.4.1"
          use-dotnet: false
          include-templates: true
          cache: true
      - name: Verify all original Python source and replay contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          godot --version
          python -m py_compile skeleton/ai/game_builder/advanced_physics_godot.py
          python -m unittest tests.test_game_builder_advanced_physics_godot -v
      - name: Author four different real original native physics games
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from skeleton.ai.game_builder.advanced_physics_runtime import default_layout
          from skeleton.ai.game_builder.system_editors import make_editor_document
          from skeleton.ai.game_builder.advanced_level_scenes import make_advanced_scene
          from skeleton.ai.game_builder.advanced_gameplay_runtime import run_advanced_session
          from skeleton.ai.game_builder.advanced_physics_godot import render_physics_godot_package
          from skeleton.ai.game_builder.advanced_godot_export import write_advanced_godot_package
          root=Path(os.environ["RUNNER_TEMP"])/"native-original-physics"
          root.mkdir()
          common={"dimension":"2d","collision_geometry":"aabb",
                  "max_bodies":1,"gravity":0,"substeps":1,"initial_battery":0}
          cases=(
            ("movement",{},("inspect","push:east","step:4","brake","torque:cw","step"),0,False),
            ("signed_impulses",{"impulse_strength":157,"air_drag":5},
             ("push:west","push:up","step","torque:ccw","brake"),3,False),
            ("real_goal",{"goal_radius":70,"goal_speed":300},
             ("push:east",),4,True),
            ("open_ended",{"goal_radius":70,"goal_speed":300,"completion_mode":"sandbox"},
             ("push:east","step"),7,True),
            ("gravity_drop",{"gravity":8,"tick_hz":40,"air_drag":0,
                              "wall_restitution":0,"floor_friction":0},
             ("step:4",)*6,2,False),
          )
          for name,extra,commands,seed,win in cases:
              settings={**common,**extra}
              layout=default_layout(make_editor_document("physics",settings)["settings"],seed)
              layout["fixtures"]=[]
              if name=="gravity_drop":
                  layout["bodies"][0]["position"]=[200,500,0]
              if win:
                  layout["goal"]=[300,960,0]
              scene=make_advanced_scene("physics",settings,seed=seed,layout=layout)
              session=run_advanced_session("physics",settings,commands,
                                           seed=seed,scene=scene)
              package=render_physics_godot_package(session,settings,authorized=True)
              write_advanced_godot_package(package,root/name,authorized=True)
              print("NATIVE_PHYSICS_AUTHORED",name,session["head_digest"])
          PY
      - name: Execute independent source in real Godot 4 on Windows and Linux
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/native-original-physics"
          for scenario in movement signed_impulses real_goal open_ended gravity_drop; do
            project="$root/$scenario/godot"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              # The Godot setup action provides a Git Bash launcher, not a
              # Windows CreateProcess-resolvable .exe named "godot".
              if command -v timeout >/dev/null 2>&1; then
                timeout 90s godot --headless --path "$project" --import >"$root/$scenario/import.log" 2>&1
                timeout 75s godot --headless --path "$project" -- --verify-physics >"$root/$scenario/native.log" 2>&1
              else
                godot --headless --path "$project" --import >"$root/$scenario/import.log" 2>&1
                godot --headless --path "$project" -- --verify-physics >"$root/$scenario/native.log" 2>&1
              fi
              cat "$root/$scenario/native.log"
              grep -q "NATIVE_ADVANCED_PHYSICS_OK" "$root/$scenario/native.log"
              continue
            fi
            python - "$project" "$root/$scenario/native.log" <<'PY'
          from pathlib import Path
          import subprocess,sys
          project,log=sys.argv[1:]
          combined=[]
          for label,args,seconds in (
              ("import",["godot","--headless","--path",project,"--import"],90),
              ("native replay",["godot","--headless","--path",project,
                                "--","--verify-physics"],75),
          ):
              try:
                  proc=subprocess.run(args,capture_output=True,text=True,
                                      errors="replace",timeout=seconds)
              except subprocess.TimeoutExpired as exc:
                  print("NATIVE_PHYSICS_TIMEOUT",label,str(exc))
                  sys.exit(1)
              chunk=(proc.stdout or "")+"\n"+(proc.stderr or "")
              combined.append(chunk)
              if proc.returncode!=0:
                  print("NATIVE_PHYSICS_ERROR",label,proc.returncode,chunk)
                  sys.exit(1)
          Path(log).write_text("\n".join(combined),encoding="utf-8")
          print(combined[-1])
          if "NATIVE_ADVANCED_PHYSICS_OK" not in combined[-1]:
              sys.exit("Independent Godot gameplay proof marker was not printed")
          PY
          done
      - name: Export actual standalone Linux native game
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/native-original-physics/real_goal/godot"
          executable="$RUNNER_TEMP/native-original-physics/physics-lab.x86_64"
          godot --headless --path "$project" --export-release Linux "$executable"
          test -s "$executable"
          chmod +x "$executable"
          "$executable" --headless -- --verify-physics | tee "$RUNNER_TEMP/native-original-physics/exported.log"
          grep -q "NATIVE_ADVANCED_PHYSICS_OK" "$RUNNER_TEMP/native-original-physics/exported.log"
