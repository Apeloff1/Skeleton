name: P3 T2 Governed Storage Plane

on:
  pull_request:
    paths:
      - "skeleton/storage/**"
      - "skeleton/ai/runtime/storage/**"
      - "skeleton/testing/test_content_addressing.py"
      - "skeleton/testing/test_cache_architecture.py"
      - "skeleton/testing/test_distributed_transactions.py"
      - "machine/ai_file_tree.json"
      - "machine/ai_master_plan.json"
      - "machine/ai_masterplan_continuation_frontier.json"
      - "machine/ai_p3t2_storage_candidate.json"
      - "scripts/check_p3t2_storage_candidate.py"
      - "tests/test_p3t2_storage_candidate.py"
      - ".github/workflows/p3t2-governed-storage.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/storage/**"
      - "skeleton/ai/runtime/storage/**"
      - "skeleton/testing/test_content_addressing.py"
      - "skeleton/testing/test_cache_architecture.py"
      - "skeleton/testing/test_distributed_transactions.py"
      - "machine/ai_file_tree.json"
      - "machine/ai_master_plan.json"
      - "machine/ai_masterplan_continuation_frontier.json"
      - "machine/ai_p3t2_storage_candidate.json"
      - "scripts/check_p3t2_storage_candidate.py"
      - "tests/test_p3t2_storage_candidate.py"
      - ".github/workflows/p3t2-governed-storage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3t2-storage-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  storage:
    name: Governed storage contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused test runner
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=7,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Compile governed storage plane
        run: >-
          python -m compileall -q
          skeleton/storage
          skeleton/ai/runtime/storage

      - name: Verify exact AI-runtime mirror
        run: |
          cmp skeleton/storage/__init__.py skeleton/ai/runtime/storage/__init__.py
          cmp skeleton/storage/cas/__init__.py skeleton/ai/runtime/storage/cas/__init__.py

      - name: Validate AI-tree and masterplan authority
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python scripts/check_ai_file_tree.py
          python scripts/check_ai_master_plan.py
          python scripts/check_p3t2_storage_candidate.py --head "$(git rev-parse HEAD)" --json

      - name: Run P3-T2 storage regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_content_addressing.py
          skeleton/testing/test_cache_architecture.py
          skeleton/testing/test_distributed_transactions.py
          tests/test_p3t2_storage_candidate.py
