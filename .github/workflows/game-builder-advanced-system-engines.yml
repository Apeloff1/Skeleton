      - ".github/workflows/game-builder-advanced-system-engines.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: advanced-original-game-engines-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  executable-reference:
    name: Advanced reference gameplay and forged-replay resistance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Exact head checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_advanced_runtime.py
            tests/test_game_builder_advanced_scenes.py
            tests/test_game_builder_advanced_genres.py
            tests/test_game_builder_advanced_godot.py
            tests/test_game_builder_advanced_platformer_godot.py
            tests/test_game_builder_advanced_deck_godot.py
            tests/test_game_builder_advanced_shooter_godot.py
            tests/test_game_builder_advanced_tactics_godot.py
            tests/test_game_builder_advanced_defense_godot.py
            tests/test_game_builder_advanced_racing_godot.py
            tests/test_game_builder_advanced_survival_godot.py
            tests/test_game_builder_advanced_farming_godot.py
            tests/test_game_builder_advanced_factory_godot.py
            tests/test_game_builder_advanced_colony.py
            tests/test_game_builder_advanced_city.py
            tests/test_game_builder_advanced_stealth.py
            tests/test_game_builder_advanced_metroidvania.py
            tests/test_game_builder_advanced_sandbox.py
            tests/test_game_builder_advanced_roguelike.py
            tests/test_game_builder_advanced_rts.py
            tests/test_game_builder_advanced_rhythm.py
            tests/test_game_builder_advanced_fighting.py
            tests/test_game_builder_advanced_quest_director.py
            tests/test_game_builder_advanced_sailing.py
            tests/test_game_builder_advanced_fighting_rollback.py
            tests/test_game_builder_advanced_rhythm_audio.py
            tests/test_game_builder_advanced_rhythm_longrun.py
            tests/test_game_builder_advanced_roguelike_longrun.py
            tests/test_game_builder_system_editors.py
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Validate exact head and Python syntax
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile  skeleton/ai/game_builder/advanced_gameplay_runtime.py skeleton/ai/game_builder/advanced_godot_export.py skeleton/ai/game_builder/advanced_platformer_godot.py skeleton/ai/game_builder/advanced_deck_godot.py skeleton/ai/game_builder/advanced_shooter_godot.py skeleton/ai/game_builder/advanced_tactics_godot.py skeleton/ai/game_builder/advanced_defense_godot.py skeleton/ai/game_builder/advanced_racing_godot.py skeleton/ai/game_builder/advanced_survival_godot.py skeleton/ai/game_builder/advanced_farming_runtime.py skeleton/ai/game_builder/advanced_farming_godot.py skeleton/ai/game_builder/advanced_factory_runtime.py skeleton/ai/game_builder/advanced_factory_godot.py skeleton/ai/game_builder/advanced_colony_runtime.py skeleton/ai/game_builder/advanced_city_runtime.py skeleton/ai/game_builder/advanced_stealth_runtime.py skeleton/ai/game_builder/advanced_metroidvania_runtime.py skeleton/ai/game_builder/advanced_sandbox_runtime.py skeleton/ai/game_builder/advanced_roguelike_runtime.py skeleton/ai/game_builder/advanced_rts_runtime.py skeleton/ai/game_builder/advanced_rhythm_runtime.py skeleton/ai/game_builder/advanced_fighting_runtime.py skeleton/ai/game_builder/advanced_quest_director_runtime.py skeleton/ai/game_builder/advanced_sailing_runtime.py skeleton/ai/game_builder/advanced_fighting_rollback.py skeleton/ai/game_builder/advanced_rhythm_audio.py skeleton/ai/game_builder/advanced_rhythm_longrun.py skeleton/ai/game_builder/advanced_roguelike_longrun.py skeleton/ai/game_builder/advanced_sandbox_story.py skeleton/ai/game_builder/advanced_world_planner.py skeleton/ai/game_builder/advanced_stealth_planner.py skeleton/ai/game_builder/advanced_colony_godot.py skeleton/ai/game_builder/advanced_genre_engines.py skeleton/ai/game_builder/advanced_puzzle_solver.py skeleton/ai/game_builder/advanced_level_scenes.py skeleton/ai/game_builder/advanced_gameplay_save.py skeleton/ai/game_builder/system_editors.py skeleton/ai/game_builder/system_editor_assembly.py skeleton/ai/game_builder/system_editor_cli.py skeleton/ai/game_builder/game_workspace_server.py skeleton/ai/game_builder/game_workspace_ui.py tests/test_game_builder_advanced_runtime.py tests/test_game_builder_advanced_scenes.py tests/test_game_builder_advanced_genres.py tests/test_game_builder_advanced_godot.py tests/test_game_builder_advanced_platformer_godot.py tests/test_game_builder_advanced_deck_godot.py tests/test_game_builder_advanced_shooter_godot.py tests/test_game_builder_advanced_tactics_godot.py tests/test_game_builder_advanced_defense_godot.py tests/test_game_builder_advanced_racing_godot.py tests/test_game_builder_advanced_survival_godot.py tests/test_game_builder_advanced_farming_godot.py tests/test_game_builder_advanced_factory_godot.py tests/test_game_builder_advanced_sailing.py tests/test_game_builder_system_editors.py
      - name: Parse original-game visual authoring JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from skeleton.ai.game_builder.game_workspace_ui import SCRIPT
          target=Path(os.environ["RUNNER_TEMP"])/"original_game_studio_check.js"
          target.write_text(SCRIPT.replace("__TOKEN__",'"validated-ci-token"'),encoding="utf-8")
          PY
          node --check "$RUNNER_TEMP/original_game_studio_check.js"
      - name: Execute advanced-floor authoring, eight engines and replay attacks
        shell: bash
        run: python -m unittest tests.test_game_builder_advanced_runtime tests.test_game_builder_advanced_scenes tests.test_game_builder_advanced_genres tests.test_game_builder_advanced_godot tests.test_game_builder_advanced_platformer_godot tests.test_game_builder_advanced_deck_godot tests.test_game_builder_advanced_shooter_godot tests.test_game_builder_advanced_tactics_godot tests.test_game_builder_advanced_defense_godot tests.test_game_builder_advanced_racing_godot tests.test_game_builder_advanced_survival_godot tests.test_game_builder_advanced_farming_godot tests.test_game_builder_advanced_factory_godot tests.test_game_builder_advanced_colony tests.test_game_builder_advanced_city tests.test_game_builder_advanced_stealth tests.test_game_builder_advanced_metroidvania tests.test_game_builder_advanced_sandbox tests.test_game_builder_advanced_roguelike tests.test_game_builder_advanced_rts tests.test_game_builder_advanced_rhythm tests.test_game_builder_advanced_fighting tests.test_game_builder_advanced_quest_director tests.test_game_builder_advanced_sailing tests.test_game_builder_advanced_fighting_rollback tests.test_game_builder_advanced_rhythm_audio tests.test_game_builder_advanced_rhythm_longrun tests.test_game_builder_advanced_roguelike_longrun tests.test_game_builder_system_editors -v
