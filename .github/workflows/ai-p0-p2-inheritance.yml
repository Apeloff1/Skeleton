name: AI P0-P2 Inheritance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-p0-p2-inheritance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inherited-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pytest-asyncio>=0.24,<1"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"

      - name: Verify inherited phase authorities
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python scripts/verify_masterplan_completion.py
          python scripts/check_p1_terminal_closure_manifest.py --json
          python scripts/check_p2_functional_ai_closure.py --require-closed --json
          python scripts/verify_ai_phase_inheritance.py \
            --head-sha "$EVIDENCE_HEAD_SHA" \
            --evidence-out .ai-phase-inheritance.json \
            --json

      - name: Run inheritance verifier regressions
        run: python -m pytest -q --noconftest tests/test_ai_phase_inheritance.py

      - name: Re-exercise provider-independent P2 functional path
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_local_inference.py
          skeleton/testing/test_vs001_functional_ai.py

      - name: Assert exact-head receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".ai-phase-inheritance.json").read_text(encoding="utf-8")
          )
          if receipt["head_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("phase-inheritance receipt head mismatch")
          if receipt["valid"] is not True or receipt["errors"]:
              raise SystemExit("phase-inheritance receipt is invalid")
          print("P0-P2 inherited closure exact-head:", receipt["head_sha"])
          PY
