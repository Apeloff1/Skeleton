name: AI Hostile Gap Disposition

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/architecture/masterplan-gap-audit.md"
      - "machine/ai_hostile_gap_disposition.json"
      - "scripts/verify_ai_hostile_gap_disposition.py"
      - "tests/test_ai_hostile_gap_disposition.py"
      - ".github/workflows/ai-hostile-gap-disposition.yml"
  push:
    branches:
      - main
    paths:
      - "docs/architecture/masterplan-gap-audit.md"
      - "machine/ai_hostile_gap_disposition.json"
      - "scripts/verify_ai_hostile_gap_disposition.py"
      - "tests/test_ai_hostile_gap_disposition.py"
      - ".github/workflows/ai-hostile-gap-disposition.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-hostile-gap-disposition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gap-disposition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Verify canonical hostile-gap disposition
        run: python scripts/verify_ai_hostile_gap_disposition.py --json
      - name: Run hostile-gap disposition regressions
        run: python -m pytest -q --noconftest tests/test_ai_hostile_gap_disposition.py
