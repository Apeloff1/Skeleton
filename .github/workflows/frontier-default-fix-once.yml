name: One-shot Frontier dataclass default repair

on:
  push:
    branches:
      - fix/frontier-dataclass-mapping-defaults-20260915
    paths:
      - '.github/workflows/frontier-default-fix-once.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Replace shared immutable mapping defaults with factories
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('skeleton/frontier/commerce.py'): [
                  ('from dataclasses import dataclass, replace', 'from dataclasses import dataclass, field, replace'),
                  ('effects: Mapping[str, int] = MappingProxyType({})', 'effects: Mapping[str, int] = field(default_factory=dict)'),
                  ('bait_increments: Mapping[str, int] = MappingProxyType({})', 'bait_increments: Mapping[str, int] = field(default_factory=dict)'),
                  ('effect_increments: Mapping[str, int] = MappingProxyType({})', 'effect_increments: Mapping[str, int] = field(default_factory=dict)'),
                  ('last_purchase_at: Mapping[str, datetime] = MappingProxyType({})', 'last_purchase_at: Mapping[str, datetime] = field(default_factory=dict)'),
              ],
              Path('skeleton/frontier/encyclopedia.py'): [
                  ('from dataclasses import dataclass', 'from dataclasses import dataclass, field'),
                  ('fish_stats: Mapping[str, FishCatchStats] = MappingProxyType({})', 'fish_stats: Mapping[str, FishCatchStats] = field(default_factory=dict)'),
              ],
              Path('skeleton/frontier/tournament.py'): [
                  ('from dataclasses import dataclass, replace', 'from dataclasses import dataclass, field, replace'),
                  ('entries: Mapping[str, TournamentEntry] = MappingProxyType({})', 'entries: Mapping[str, TournamentEntry] = field(default_factory=dict)'),
              ],
          }

          for path, replacements in changes.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Install Frontier test runtime
        run: python -m pip install --disable-pip-version-check -e . pytest pytest-asyncio
      - name: Run affected Frontier contract suites
        env:
          PYTHONPATH: '.'
        run: >-
          python -m pytest -q
          skeleton/testing/test_frontier_commerce_policy.py
          skeleton/testing/test_frontier_encyclopedia_policy.py
          skeleton/testing/test_frontier_tournament_policy.py
          skeleton/testing/test_frontier_vip_policy.py
      - name: Commit validated repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/frontier-default-fix-once.yml
          git add skeleton/frontier/commerce.py skeleton/frontier/encyclopedia.py skeleton/frontier/tournament.py
          git commit -m 'fix(frontier): use factories for immutable mapping defaults'
          git push origin HEAD:fix/frontier-dataclass-mapping-defaults-20260915
