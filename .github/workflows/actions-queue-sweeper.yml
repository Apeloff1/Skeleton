name: Actions Queue Sweeper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-queue-sweeper.yml"
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: actions-queue-sweeper-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  sweep:
    name: Cancel superseded queued main runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: main
      MAX_CANCEL: "1000"
    steps:
      - name: Keep newest queued run per workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ.get("TARGET_BRANCH", "main")
          max_cancel = int(os.environ.get("MAX_CANCEL", "1000"))
          api = f"https://api.github.com/repos/{repo}/actions/runs"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "skeleton-actions-queue-sweeper",
          }

          def request_json(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def list_status(status: str):
              runs = []
              page = 1
              while True:
                  query = urllib.parse.urlencode(
                      {
                          "branch": branch,
                          "status": status,
                          "per_page": 100,
                          "page": page,
                      }
                  )
                  payload = request_json(f"{api}?{query}")
                  batch = payload.get("workflow_runs", [])
                  runs.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return runs

          pending_statuses = ("queued", "pending", "waiting", "requested")
          by_id = {}
          for status in pending_statuses:
              try:
                  for run in list_status(status):
                      by_id[run["id"]] = run
              except urllib.error.HTTPError as exc:
                  # Some API versions reject a status that never occurs for workflow runs.
                  if exc.code == 422:
                      continue
                  raise

          runs = sorted(
              by_id.values(),
              key=lambda run: (run.get("created_at") or "", run["id"]),
              reverse=True,
          )

          newest_by_workflow = {}
          stale = []
          for run in runs:
              workflow_id = run["workflow_id"]
              if workflow_id not in newest_by_workflow:
                  newest_by_workflow[workflow_id] = run
              else:
                  stale.append(run)

          stale = stale[:max_cancel]
          cancelled = []
          raced = []
          failed = []

          for run in stale:
              req = urllib.request.Request(
                  f"{api}/{run['id']}/cancel",
                  headers=headers,
                  data=b"{}",
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      response.read()
                  cancelled.append(run)
              except urllib.error.HTTPError as exc:
                  if exc.code in (409, 422):
                      raced.append((run, exc.code))
                  else:
                      failed.append((run, exc.code))
              # Be polite to the API while still draining hundreds of stale entries quickly.
              time.sleep(0.02)

          kept = sorted(
              newest_by_workflow.values(),
              key=lambda run: run.get("name") or "",
          )
          summary = [
              "## GitHub Actions queue sweep",
              "",
              f"- Branch: `{branch}`",
              f"- Pending runs inspected: **{len(runs)}**",
              f"- Newest pending workflow runs preserved: **{len(kept)}**",
              f"- Superseded runs cancelled: **{len(cancelled)}**",
              f"- Runs that changed state during cancellation: **{len(raced)}**",
              f"- Cancellation errors: **{len(failed)}**",
              "",
              "Newest pending run is preserved independently for each workflow ID.",
          ]
          if kept:
              summary.extend(["", "### Preserved pending heads"])
              for run in kept[:50]:
                  summary.append(
                      f"- `{run.get('name', run['workflow_id'])}`: run `{run['id']}` at `{run.get('head_sha', '')[:12]}`"
                  )
          if failed:
              summary.extend(["", "### Cancellation errors"])
              for run, code in failed[:50]:
                  summary.append(f"- run `{run['id']}`: HTTP {code}")

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary) + "\n",
              encoding="utf-8",
          )
          print("\n".join(summary[:8]))
          if failed:
              raise SystemExit("one or more stale runs could not be cancelled")
          PY
