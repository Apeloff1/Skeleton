name: P0 Archive Security Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/security/archive_sandbox.py"
      - "skeleton/testing/test_security_archive_sandbox.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-archive-security-evidence-current.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run archive boundary regressions
        run: >-
          python -m pytest -q
          skeleton/testing/test_security_archive_sandbox.py::test_zip_rejects_traversal_absolute_or_ambiguous_paths
          skeleton/testing/test_security_archive_sandbox.py::test_tar_rejects_traversal_absolute_or_ambiguous_paths
          skeleton/testing/test_security_archive_sandbox.py::test_total_expanded_size_bound_is_enforced
          skeleton/testing/test_security_archive_sandbox.py::test_zip_compression_ratio_bound_is_enforced
          skeleton/testing/test_security_archive_sandbox.py::test_archive_expansion_ratio_bound_is_enforced
          skeleton/testing/test_security_archive_sandbox.py::test_zip_symlink_member_is_rejected
          skeleton/testing/test_security_archive_sandbox.py::test_tar_special_members_are_rejected
