name: Masterplan Continuation Frontier
on:
  pull_request:
    branches: [main]
    paths:
      - "machine/ai_masterplan_continuation_frontier.json"
      - "machine/ai_app_construction.json"
      - "machine/ai_p1_terminal_closure.json"
      - "machine/ai_p2_functional_ai_closure.json"
      - "machine/ai_p3_expansion_closure.json"
      - "machine/ai_p3_engineering_closure.json"
      - "machine/ai_p3_engineering_execution_map.json"
      - "machine/ai_p3_execution_map.json"
      - "machine/ai_master_plan.json"
      - "scripts/check_ai_masterplan_continuation.py"
      - "tests/test_ai_masterplan_continuation.py"
      - ".github/workflows/masterplan-continuation-frontier.yml"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masterplan-continuation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - run: python scripts/check_ai_masterplan_continuation.py --json
      - run: python -m pytest -q --noconftest tests/test_ai_masterplan_continuation.py
