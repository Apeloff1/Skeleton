name: AI Chat Chapter Continuity Production

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "backend/core/chapter_continuity.py"
      - "backend/routes/chapter_studio.py"
      - "backend/routes/game_kb.py"
      - "backend/tests/test_chapter_continuity.py"
      - "backend/tests/test_chapter_studio_routes.py"
      - "frontend/features/Jeeves/chapterStudio.ts"
      - "frontend/features/Jeeves/ChatChapterActions.tsx"
      - "frontend/features/Jeeves/ChatWorkspace.tsx"
      - "frontend/app/chapter-studio.tsx"
      - "frontend/app/story-index.tsx"
      - "frontend/src/product/worldWorkspace.ts"
      - "frontend/scripts/jeeves-workbench/chapter-studio.test.cjs"
      - "frontend/scripts/test-world-workbench.mjs"
      - "frontend/tsconfig.jeeves.json"
      - ".github/workflows/ai-chat-chapter-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-chat-chapter-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chapter-backend:
    name: Chapter canon and 100k proof receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install focused runtime
        run: >-
          python -m pip install -e ".[dev]"
          "httpx==0.28.1" "PyJWT==2.14.0"
          "python-dotenv==1.2.3" "bcrypt==4.3.0"
          "email-validator==2.3.0" "matplotlib==3.10.6" "networkx==3.5"
      - name: Compile production surfaces
        run: >-
          python -m compileall -q
          backend/core/chapter_continuity.py
          backend/routes/chapter_studio.py
          backend/routes/game_kb.py
          backend/tests/test_chapter_continuity.py
          backend/tests/test_chapter_studio_routes.py
      - name: Test chapter revision, scene production and proof receipts
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          backend/tests/test_chapter_continuity.py
          backend/tests/test_chapter_studio_routes.py
          backend/tests/test_story_continuity.py
          backend/tests/test_story_index_routes.py

  chapter-frontend:
    name: Jeeves chapter and editor continuity integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies without lifecycle scripts
        working-directory: frontend
        run: yarn install --ignore-scripts
      - name: Check Jeeves chat and chapter editor types
        working-directory: frontend
        run: yarn typecheck:jeeves
      - name: Test Jeeves chapter highlighters and canonical handoffs
        working-directory: frontend
        run: yarn test:jeeves
      - name: Verify actual project navigation paths
        working-directory: frontend
        run: yarn test:world-workbench
