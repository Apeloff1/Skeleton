name: Jeeves laptop native dispatcher source tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: jeeves-laptop-dispatcher-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  bounded_native_dispatcher:
    name: Source-only native dispatch, replay and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use repository-supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Compile native dispatcher and its full local-first source tests
        run: >-
          python -m compileall -q
          skeleton/ai/runtime/operational_ai/laptop_runtime
          skeleton/testing
      - name: Run bounded source-only native concurrency and custody regressions
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_laptop_dispatcher_singleflight_*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_dispatcher_commit_enforcement.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_dispatcher_principal_fence.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_dispatcher_replay_tamper.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_dispatcher_metadata_and_outbox.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_runtime_dispatcher.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_turnbridge_*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_runtime_turn_bridge.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_real_acceptance_*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_cold_reopen_*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_replay_probe_*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_client_*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_exact_prompt_custody.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_inference_deadline_fence.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_runtime_http.py' -v
      - name: Assert this gate cannot claim laptop or release qualification
        run: |
          python -c 'from skeleton.ai.runtime.operational_ai.laptop_runtime.dispatcher import LaptopDispatcher; assert not hasattr(LaptopDispatcher, "release_certified")'
