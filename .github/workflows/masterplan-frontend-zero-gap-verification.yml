name: Masterplan Frontend Zero-Gap Verification

on:
  pull_request:
    paths:
      - "machine/ai_frontend_zero_gap_verification_candidate.json"
      - "machine/ai_master_plan.json"
      - "machine/ai_build_accountability.json"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/scripts/test-accessibility-contract.mjs"
      - "frontend/scripts/test-localization-contract.mjs"
      - "frontend/src/accessibility/**"
      - "frontend/src/i18n/**"
      - "skeleton/testing/test_vol087_localization.py"
      - ".github/workflows/masterplan-frontend-zero-gap-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masterplan-frontend-zero-gap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: Frontend zero-gap authority preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate candidate authority
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path(".")
          candidate = json.loads((root / "machine/ai_frontend_zero_gap_verification_candidate.json").read_text())
          plan = json.loads((root / "machine/ai_master_plan.json").read_text())
          accountability = json.loads((root / "machine/ai_build_accountability.json").read_text())

          assert candidate["schema_version"] == "skeleton.ai.masterplan.frontend_zero_gap_verification.v1"
          assert candidate["status"] == "independent_verification_candidate"

          volumes = {v["key"]: v for v in plan["volumes"] if isinstance(v, dict) and isinstance(v.get("key"), str)}
          records = {}
          def walk(value):
              if isinstance(value, list):
                  for item in value:
                      walk(item)
              elif isinstance(value, dict):
                  rid = value.get("id")
                  if isinstance(rid, str) and rid.startswith("ACC-VOL-"):
                      records[rid] = value
                  for item in value.values():
                      walk(item)
          walk(accountability)

          assert [item["key"] for item in candidate["volumes"]] == ["VOL-086", "VOL-087"]
          for item in candidate["volumes"]:
              key = item["key"]
              volume = volumes[key]
              record = records["ACC-" + key]
              assert volume["implementation_status"] == "implemented", key
              assert volume["completion_checkbox"] is False, key
              assert volume.get("gaps", []) == [], key
              assert record["status"] == "implemented", key
              assert record["checkbox"] is False, key
              assert record["implementation_signoff"]["signed"] is True, key
              assert record["verification_signoff"]["signed"] is False, key
              for test_path in item["tests"]:
                  assert test_path in set(volume.get("tests", [])), (key, test_path)
                  assert (root / test_path).is_file(), (key, test_path)

          print(json.dumps({"status": "valid", "volume_count": 2}, sort_keys=True))
          PY

  verify:
    name: ${{ matrix.volume }} frontend independent verification
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - volume: VOL-086
            command: "yarn test:accessibility"
          - volume: VOL-087
            command: "yarn test:localization"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: "frontend/yarn.lock"
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Run focused frontend regression
        working-directory: frontend
        run: ${{ matrix.command }}
