name: Dragon research pilot source qualification

on:
  pull_request:
    paths:
      - "backend/core/dragon_campaign_pilot_qualification.py"
      - "backend/core/dragon_crawler.py"
      - "backend/tests/test_dragon_campaign_pilot_qualification.py"
      - "backend/tests/test_dragon_atlas_bridge.py"
      - "frontend/src/product/crawlerClient.ts"
      - "frontend/src/features/Jeeves/CrawlerResearchAtlasPanel.tsx"
      - ".github/workflows/dragon-pilot-source-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-pilot-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pilot_contract:
    name: Bounded pilot contract and fail-closed source checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source-head identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Use supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Compile changed backend modules
        run: |
          python -m py_compile backend/core/dragon_campaign_pilot_qualification.py
          python -m py_compile backend/core/dragon_crawler.py
          python -m py_compile backend/tests/test_dragon_campaign_pilot_qualification.py
          python -m py_compile backend/tests/test_dragon_atlas_bridge.py
      - name: Execute hermetic authority and release-hold regressions
        env:
          PYTHONPATH: "backend:."
        run: python -m unittest discover -s backend/tests -p 'test_dragon_campaign_pilot_qualification.py' -v
      - name: Verify patch whitespace
        run: git diff --check HEAD^ HEAD
