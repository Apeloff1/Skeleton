name: Dragon research pilot source qualification

on:
  pull_request:
    paths:
      - "backend/core/dragon_campaign_pilot_qualification.py"
      - "backend/core/dragon_crawler.py"
      - "backend/tests/test_dragon_campaign_pilot_qualification.py"
      - "backend/tests/test_dragon_atlas_bridge.py"
      - "frontend/src/product/crawlerClient.ts"
      - "frontend/src/features/Jeeves/CrawlerResearchAtlasPanel.tsx"
      - ".github/workflows/dragon-pilot-source-qualification.yml"
      - ".github/workflows/malware-gate.yml"
      - ".github/workflows/artifact-policy.yml"
      - "tests/test_dragon_pilot_release_gate_admission.py"
      - "tests/test_dragon_e2e_editor_admission.py"
      - "scripts/qualify_e2e_dragon_editor.py"
      - "tests/e2e/app-foundation/dragon-crawler-pilot.spec.mjs"
      - "frontend/src/features/Jeeves/dragonResearchDecisionEngine.ts"
      - "frontend/src/features/Jeeves/DragonResearchDecisionCockpit.tsx"
      - "frontend/scripts/test-dragon-advanced-decision.mjs"
      - "scripts/emerald_v7_*.py"
      - "scripts/prepare_emerald_v7_*.py"
      - "scripts/qualify_emerald_v7_offline_stack.py"
      - "scripts/audit_emerald_v7_original_zip_pair.py"
      - "scripts/emerald_v7_model_pins.py"
      - "scripts/test_emerald_v7_model_pins.py"
      - "scripts/verify_emerald_v7_remote_original.py"
      - "scripts/stage_emerald_v7_quarantine.py"
      - "scripts/test_stage_emerald_v7_quarantine.py"
      - "scripts/test_emerald_v7_remote_original.py"
      - "scripts/test_audit_emerald_v7_original_zip_pair.py"
      - "scripts/check_emerald_v7_independent_original_receipt.py"
      - "scripts/test_emerald_v7_independent_original_receipt.py"
      - "scripts/audit_emerald_v7_original_zip_pair.py"
      - "scripts/test_audit_emerald_v7_original_zip_pair.py"
      - "scripts/check_emerald_v7_independent_original_receipt.py"
      - "scripts/test_emerald_v7_independent_original_receipt.py"
      - "scripts/test_qualify_emerald_v7_offline_stack.py"
      - "scripts/publish_emerald_v7_*.py"
      - "scripts/test_emerald_v7_*.py"
      - "scripts/test_prepare_emerald_v7_*.py"
      - "scripts/check_emerald_v7_*.py"
      - "assets/emerald/evolution-v7/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-pilot-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pilot_contract:
    name: Bounded pilot contract and fail-closed source checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source-head identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Use supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Compile changed backend modules
        run: |
          python -m py_compile backend/core/dragon_campaign_pilot_qualification.py
          python -m py_compile backend/core/dragon_crawler.py
          python -m py_compile backend/tests/test_dragon_campaign_pilot_qualification.py
          python -m py_compile backend/tests/test_dragon_atlas_bridge.py
      - name: Execute hermetic authority and release-hold regressions
        env:
          PYTHONPATH: "backend:."
        run: python -m unittest discover -s backend/tests -p 'test_dragon_campaign_pilot_qualification.py' -v
      - name: Verify review-only malware and artifact admission remains fail closed
        run: python -m unittest discover -s tests -p 'test_dragon_pilot_release_gate_admission.py' -v
      - name: Verify CI-only editor token custody and least-authority role grant
        run: python -m unittest discover -s tests -p 'test_dragon_e2e_editor_admission.py' -v
      - name: Verify patch whitespace against fetched parent
        run: |
          test "$(git rev-list --count HEAD)" -ge 2
          git diff --check HEAD^ HEAD
      - name: Use supported Node 24 for pure journey contracts
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Exercise user journey preflight and pilot receipt encoding
        run: |
          node --experimental-strip-types --test frontend/scripts/test-crawler-pilot-journey.mjs
          node --experimental-strip-types --test frontend/scripts/test-dragon-advanced-decision.mjs


  v7_source:
    name: V7 exact-head original-model source and adverse custody tests
    if: startsWith(github.head_ref, 'feat/emerald-v7-') || startsWith(github.head_ref, 'fix/emerald-v7-')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact V7 PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Match exact head before any acceptance check
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Supported isolated Python interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Pinned scientific ABI used by the reviewed contact source
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 numba==0.62.1
      - name: Compile original-model qualification source
        run: |
          python -m py_compile scripts/emerald_v7_orbit02.py scripts/verify_emerald_v7_orbit02.py
          python -m py_compile scripts/emerald_v7_crossfade_screen.py scripts/check_emerald_v7_evidence.py
          python -m py_compile scripts/check_emerald_v7_nine_phase.py scripts/prepare_emerald_v7_reviewed_tools.py
          python -m py_compile scripts/publish_emerald_v7_orbit02.py
      - name: Test real-format crossfade evidence and unsafe-source rejection
        run: |
          python scripts/test_emerald_v7_orbit02.py
          python scripts/test_emerald_v7_evidence.py
          python scripts/test_emerald_v7_publication.py
          python scripts/test_emerald_v7_nine_phase.py
          python scripts/test_emerald_v7_nine_phase_contract.py
          python scripts/test_prepare_emerald_v7_reviewed_tools.py
          python scripts/test_qualify_emerald_v7_offline_stack.py
          python scripts/test_audit_emerald_v7_original_zip_pair.py
          python scripts/test_emerald_v7_independent_original_receipt.py
          python scripts/check_emerald_v7_independent_original_receipt.py
          python scripts/test_emerald_v7_model_pins.py
          python scripts/test_emerald_v7_remote_original.py
          python scripts/test_stage_emerald_v7_quarantine.py
          python scripts/test_audit_emerald_v7_original_zip_pair.py
          python scripts/test_emerald_v7_independent_original_receipt.py
          python scripts/check_emerald_v7_independent_original_receipt.py
          python scripts/check_emerald_v7_nine_phase.py
      - name: Bound claims
        run: echo 'Only source, synthetic and recorded report consistency. No original 229 MB GLB reexecution, full CCD, browser/device, artist, RTX, release or merge evidence.'
  v7_original_binary:
    name: V7 actual raw original Git bytes (fail closed)
    if: startsWith(github.head_ref, 'assets/emerald-v7-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact payload PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Match payload source
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Verify all actual SHA-256-pinned GLB chunks
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          case "$BRANCH" in
            assets/emerald-v7-pathfinder-orbit02-20261117) stage=pathfinder ;;
            assets/emerald-v7-archivist-orbit02-20261117) stage=archivist ;;
            *) echo 'Unreviewed original payload branch'; exit 1 ;;
          esac
          python3 scripts/publish_emerald_v7_orbit02.py verify-tree --stage "$stage"
