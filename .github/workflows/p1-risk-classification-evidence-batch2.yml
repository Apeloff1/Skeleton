name: P1 Risk Classification Evidence Batch 2 Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "skeleton/intelligence/plan_verifier.py"
      - "backend/core/operation_stream_transport.py"
      - "backend/core/operation_projection.py"
      - "backend/routes/operation_stream.py"
      - "skeleton/frontier/operation_stream.py"
      - "backend/core/api_contract_registry.py"
      - "backend/core/product_operations.py"
      - "backend/core/product_shell_projection.py"
      - "machine/p1_api_contract_registry.json"
      - "scripts/check_p1_api_contract_registry.py"
      - "scripts/build_p1_risk_classification_evidence_batch2.py"
      - "skeleton/testing/test_plan_static_analyzer.py"
      - "skeleton/testing/test_plan_simulation.py"
      - "skeleton/testing/test_plan_qualification.py"
      - "skeleton/testing/test_plan_execution_admission.py"
      - "backend/tests/test_operation_stream_transport.py"
      - "backend/tests/test_operation_stream_route.py"
      - "backend/tests/test_operation_projection.py"
      - "skeleton/testing/test_operation_stream.py"
      - "backend/tests/test_api_contract_registry.py"
      - "tests/test_p1_api_contract_registry.py"
      - "backend/tests/test_product_operations.py"
      - "backend/tests/test_product_shell_projection.py"
      - "tests/test_p1_risk_classification_evidence_batch2.py"
      - ".github/workflows/p1-risk-classification-evidence-batch2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-risk-classification-batch2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify P1 risk classification evidence batch 2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Validate canonical inputs
        run: |
          set -euo pipefail
          python scripts/check_ai_master_plan.py
          python scripts/check_p1_api_contract_registry.py

      - name: Run focused batch 2 regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_plan_static_analyzer.py
          skeleton/testing/test_plan_simulation.py
          skeleton/testing/test_plan_qualification.py
          skeleton/testing/test_plan_execution_admission.py
          backend/tests/test_operation_stream_transport.py
          backend/tests/test_operation_stream_route.py
          backend/tests/test_operation_projection.py
          skeleton/testing/test_operation_stream.py
          backend/tests/test_api_contract_registry.py
          tests/test_p1_api_contract_registry.py
          backend/tests/test_product_operations.py
          backend/tests/test_product_shell_projection.py
          tests/test_p1_risk_classification_evidence_batch2.py

      - name: Build exact-head batch 2 candidates
        run: |
          set -euo pipefail
          mkdir -p .p1-risk-classification-batch2
          python scripts/build_p1_risk_classification_evidence_batch2.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-risk-classification-batch2/report.json \
            --print-summary \
            --print-candidates
          python scripts/build_p1_risk_classification_evidence_batch2.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-risk-classification-batch2/replay.json
          cmp .p1-risk-classification-batch2/report.json \
              .p1-risk-classification-batch2/replay.json

      - name: Prove batch 2 authority boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".p1-risk-classification-batch2/report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("batch 2 report is not exact-head bound")
          if report["covered_risk_count"] != 12:
              raise SystemExit("batch 2 must cover exactly 12 risks")
          if report["covered_volume_count"] != 4:
              raise SystemExit("batch 2 must cover exactly 4 volumes")
          if report["already_bound_count"] != 0:
              raise SystemExit("batch 2 overlaps existing governed bindings")
          if report["candidate_binding_count"] != 12:
              raise SystemExit("batch 2 must emit exactly 12 candidates")
          if report["recommended_severity"] != "high":
              raise SystemExit("batch 2 severity must remain high")
          if report["recommended_disposition"] != "evidence":
              raise SystemExit("batch 2 disposition must remain evidence")
          for field in (
              "creates_bindings",
              "accepts_risk",
              "lowers_severity",
              "clears_source_risks",
              "promotes_maturity",
          ):
              if report[field] is not False:
                  raise SystemExit(f"batch 2 authority drift: {field}")
          for row in report["records"]:
              if row["binding_present"]:
                  raise SystemExit("batch 2 risk already bound: " + row["obligation_id"])
              if row["candidate_evidence_ref"]["digest"] != row["packet_digest"]:
                  raise SystemExit("batch 2 evidence digest drift")
              if not row["candidate_evidence_ref"]["source"].endswith(
                  ":" + os.environ["EXPECTED_SHA"]
              ):
                  raise SystemExit("batch 2 evidence is not exact-head bound")
          print("P1 risk classification batch 2:", report["report_digest"])
          PY

      - name: Prove reconciliation remains non-mutating
        run: |
          set -euo pipefail
          EVALUATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/reconcile_p1_risk_evidence.py \
            --evaluated-at "$EVALUATED_AT" \
            --out .p1-risk-classification-batch2/risk-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-risk-classification-batch2/risk-report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["non_authoritative"] is not True:
              raise SystemExit("risk reconciliation became authoritative")
          if report["source_mutation_detected"] is not False:
              raise SystemExit("risk reconciliation mutated canonical sources")
          if report["inventory"]["total_obligation_count"] != 513:
              raise SystemExit("risk obligation inventory drift")
          print(
              "Risk registry unchanged during batch 2 verification:",
              report["binding_count"],
              report["unresolved_blocking_count"],
              report["unclassified_count"],
          )
          PY
