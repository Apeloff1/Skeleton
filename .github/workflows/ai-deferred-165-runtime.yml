name: AI Deferred 165 Runtime

on:
  pull_request:
    paths:
      - "machine/ai_deferred_165_execution_map.json"
      - "skeleton/ai/runtime/deferred/**"
      - "skeleton/testing/test_ai_deferred_165_runtime.py"
      - "scripts/check_ai_deferred_165_runtime.py"
      - ".github/workflows/ai-deferred-165-runtime.yml"
  push:
    branches: [main]
    paths:
      - "machine/ai_deferred_165_execution_map.json"
      - "skeleton/ai/runtime/deferred/**"
      - "skeleton/testing/test_ai_deferred_165_runtime.py"
      - "scripts/check_ai_deferred_165_runtime.py"
      - ".github/workflows/ai-deferred-165-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-deferred-165-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deferred-165:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "pydantic>=2,<3" "pydantic-settings>=2,<3"
      - run: python -m compileall -q skeleton/ai/runtime/deferred
      - run: python scripts/check_ai_deferred_165_runtime.py
      - run: python -m pytest -q --noconftest skeleton/testing/test_ai_deferred_165_runtime.py
