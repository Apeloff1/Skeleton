name: P1 Safe Autonomy Bundle Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/agents/safe_autonomy.py"
      - "skeleton/ai/agents/core/safe_autonomy.py"
      - "skeleton/agents/blast_radius.py"
      - "skeleton/agents/human_control.py"
      - "skeleton/agents/autonomy_control.py"
      - "skeleton/agents/delegation_qualification.py"
      - "skeleton/skills/privileged_transaction.py"
      - "skeleton/agents/__init__.py"
      - "skeleton/ai/agents/core/__init__.py"
      - "skeleton/testing/test_safe_autonomy_bundle.py"
      - ".github/workflows/p1-safe-autonomy-bundle.yml"
  pull_request:
    branches:
      - main
      - p1/auto-05-blast-radius-alignment-20260928
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/agents/safe_autonomy.py"
      - "skeleton/ai/agents/core/safe_autonomy.py"
      - "skeleton/agents/blast_radius.py"
      - "skeleton/agents/human_control.py"
      - "skeleton/agents/autonomy_control.py"
      - "skeleton/agents/delegation_qualification.py"
      - "skeleton/skills/privileged_transaction.py"
      - "skeleton/agents/__init__.py"
      - "skeleton/ai/agents/core/__init__.py"
      - "skeleton/testing/test_safe_autonomy_bundle.py"
      - ".github/workflows/p1-safe-autonomy-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-safe-autonomy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate safe autonomy bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile AUTO-06 contracts
        run: >-
          python -m compileall -q
          skeleton/agents/safe_autonomy.py
          skeleton/ai/agents/core/safe_autonomy.py

      - name: Run AUTO-06 through AUTO-01 regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_safe_autonomy_bundle.py
          skeleton/testing/test_blast_radius_alignment.py
          skeleton/testing/test_human_control.py
          skeleton/testing/test_autonomy_deescalation.py
          skeleton/testing/test_agent_delegation_qualification.py
          skeleton/testing/test_privileged_tool_transaction.py

      - name: Validate canonical AI file tree parity
        run: python scripts/check_ai_file_tree.py

      - name: Build accepted AUTO-01 through AUTO-05 chain
        run: |
          set -euo pipefail
          mkdir -p .p1-auto-06
          python - <<'PY'
          import json
          from pathlib import Path

          from skeleton.agents.autonomy_control import (
              AutonomyLevel,
              AutonomyTransitionDecision,
              TransitionDisposition,
          )
          from skeleton.agents.blast_radius import (
              BlastRadiusDecision,
              ImpactClass,
          )
          from skeleton.agents.delegation_qualification import AgentDelegationDecision
          from skeleton.agents.human_control import (
              HumanControlAction,
              HumanControlDecision,
          )
          from skeleton.agents.safe_autonomy import qualify_safe_autonomy
          from skeleton.contracts.canonical import EvidenceRef
          from skeleton.skills.privileged_transaction import (
              PrivilegedToolTransactionDecision,
          )

          now = 1_800_000_000.0

          tool = PrivilegedToolTransactionDecision(
              accepted=True,
              reasons=(),
              manifest_digest="1" * 64,
              request_digest="a" * 64,
              receipt_digest="2" * 64,
              isolation_requirement_digest="3" * 64,
              isolation_observation_digest="4" * 64,
              receipt_persisted=True,
          )
          delegation = AgentDelegationDecision(
              accepted=True,
              reasons=(),
              parent_authority_digest="5" * 64,
              child_authority_digest="6" * 64,
              handoff_digest="7" * 64,
              lease_fence_digest="8" * 64,
              live_lease_digest="9" * 64,
              observed_at=now - 30.0,
          )
          human = HumanControlDecision(
              accepted=True,
              action=HumanControlAction.APPROVE,
              reasons=(),
              operation_id="ci-operation",
              execution_id="ci-execution",
              agent_id="ci-agent",
              arguments_digest=tool.request_digest,
              state_digest="b" * 64,
              command_digest="c" * 64,
              autonomy_state_digest="d" * 64,
              authority_digest=delegation.decision_digest,
              from_level=AutonomyLevel.DELEGATED,
              requested_level=AutonomyLevel.AUTONOMOUS,
              next_level=AutonomyLevel.DELEGATED,
              next_paused=False,
              next_interrupted=False,
              current_version=3,
              next_version=4,
              issuer_id="human:ci-operator",
              issuer_digest="e" * 64,
              expires_at=now + 300.0,
              evidence_refs=(
                  EvidenceRef(
                      source="ci://safe-autonomy-human-approval",
                      digest="f" * 64,
                      category="human_control_authorization",
                  ),
              ),
              independent=True,
              observed_at=now - 10.0,
              previous_receipt_digest=None,
          )
          authorization = human.accepted_autonomy_authorization()
          autonomy = AutonomyTransitionDecision(
              accepted=True,
              disposition=TransitionDisposition.APPLY,
              from_level=AutonomyLevel.DELEGATED,
              requested_level=AutonomyLevel.AUTONOMOUS,
              next_level=AutonomyLevel.AUTONOMOUS,
              reasons=(),
              state_digest="1" * 64,
              signal_digest="2" * 64,
              policy_digest="3" * 64,
              delegation_digest=delegation.decision_digest,
              authorization_digest=authorization.digest,
          )
          blast = BlastRadiusDecision(
              accepted=True,
              impact=ImpactClass.HIGH,
              reasons=(),
              operation_id=human.operation_id,
              execution_id=human.execution_id,
              agent_id=human.agent_id,
              action_digest=tool.request_digest,
              authority_digest=delegation.decision_digest,
              profile_digest="4" * 64,
              alignment_digest="5" * 64,
              policy_digest="6" * 64,
              risk_evaluation_digest="7" * 64,
              human_receipt_digest=human.receipt_digest,
          )
          decision = qualify_safe_autonomy(
              tool_transaction=tool,
              delegation=delegation,
              autonomy_transition=autonomy,
              human_control=human,
              blast_radius=blast,
              observed_at=now,
          )
          if not decision.accepted:
              raise SystemExit(f"AUTO-06 fixture rejected: {decision.reasons}")

          evidence = decision.accepted_evidence_ref()
          Path(".p1-auto-06/decision.json").write_text(
              json.dumps(decision.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-auto-06/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head AUTO-06 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-auto-06/config.digest").write_text(
              hashlib.sha256(b"p1-auto-06-safe-autonomy-v1").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-auto-06/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|auto-06"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-auto-06/verifier.digest").write_text(
              digest([
                  "skeleton/agents/safe_autonomy.py",
                  "skeleton/agents/blast_radius.py",
                  "skeleton/agents/human_control.py",
                  "skeleton/agents/autonomy_control.py",
                  "skeleton/agents/delegation_qualification.py",
                  "skeleton/skills/privileged_transaction.py",
                  ".github/workflows/p1-safe-autonomy-bundle.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-auto-06/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_safe_autonomy_bundle.py",
                  "skeleton/testing/test_blast_radius_alignment.py",
                  "skeleton/testing/test_human_control.py",
                  "skeleton/testing/test_autonomy_deescalation.py",
                  "skeleton/testing/test_agent_delegation_qualification.py",
                  "skeleton/testing/test_privileged_tool_transaction.py",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-AUTO-06 \
            --accountability-id ACC-P1-AUTO-06 \
            --configuration-digest "$(cat .p1-auto-06/config.digest)" \
            --environment-digest "$(cat .p1-auto-06/environment.digest)" \
            --verifier-id github-actions:p1-safe-autonomy \
            --verifier-digest "$(cat .p1-auto-06/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-auto-06/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-auto-06/refs.json \
            --out .p1-auto-06/receipt.json \
            > .p1-auto-06/stdout.json

      - name: Assert exact-head AUTO-06 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-auto-06/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("AUTO-06 receipt head mismatch")
          if receipt["task_id"] != "P1-AUTO-06":
              raise SystemExit("AUTO-06 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-AUTO-06":
              raise SystemExit("AUTO-06 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("AUTO-06 exact-head receipt OK", receipt["receipt_digest"])
          PY
