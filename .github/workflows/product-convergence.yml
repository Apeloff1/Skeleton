          tests/test_deployment_checkpoint_assurance.py
          tests/test_deployment_checkpoint_pin_diagnostics.py
          tests/test_deployment_checkpoint_route_architecture.py
          tests/test_deployment_checkpoint_trust_advance.py
          tests/test_deployment_checkpoint_trust_wire.py
          tests/test_deployment_checkpoint_trust_policy.py
          tests/test_deployment_checkpoint_policy_verifier.py
          tests/test_deployment_checkpoint_verification_package.py
          tests/test_deployment_checkpoint_verification_dispatch.py
