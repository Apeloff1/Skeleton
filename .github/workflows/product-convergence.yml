name: Product Convergence Gates

on:
  push:
    paths:
      - "backend/core/content_store.py"
      - "backend/core/product_operations.py"
      - "backend/core/progression.py"
      - "backend/tests/test_content_store.py"
      - "backend/tests/test_product_operations.py"
      - "backend/tests/test_progression.py"
      - ".github/workflows/product-convergence.yml"
  pull_request:
    paths:
      - "backend/core/content_store.py"
      - "backend/core/product_operations.py"
      - "backend/core/progression.py"
      - "backend/tests/test_content_store.py"
      - "backend/tests/test_product_operations.py"
      - "backend/tests/test_progression.py"
      - ".github/workflows/product-convergence.yml"

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install "pytest>=8,<9" "ruff>=0.9,<0.10"
      - name: Ruff mined convergence modules
        run: >-
          ruff check
          core/content_store.py
          core/product_operations.py
          core/progression.py
          tests/test_content_store.py
          tests/test_product_operations.py
          tests/test_progression.py
      - name: Run convergence regression suites
        run: >-
          python -m pytest -q
          tests/test_content_store.py
          tests/test_product_operations.py
          tests/test_progression.py
          tests/test_charter_policy.py
          tests/test_durable_outbox.py
          tests/test_worm_audit.py
