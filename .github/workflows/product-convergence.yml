permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install "pytest>=8,<9"
      - name: Run convergence regression suites
        run: >-
          python -m pytest -q --noconftest
          tests/test_content_store.py
          tests/test_execution_receipts.py
          tests/test_execution_evidence.py
          tests/test_execution_lifecycle_integration.py
          tests/test_system_assurance.py
