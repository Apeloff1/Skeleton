name: Product Convergence Gates

on:
  push:
    paths:
      - "backend/core/**"
      - "backend/routes/ops.py"
      - "backend/tests/test_content_store.py"
      - "backend/tests/test_execution_receipts.py"
      - "backend/tests/test_execution_evidence.py"
      - "backend/tests/test_execution_lifecycle_integration.py"
      - "backend/tests/test_system_assurance.py"
      - "backend/tests/test_system_root_attestation.py"
      - "backend/tests/test_capability_readiness.py"
      - "backend/tests/test_progression_intelligence_and_deployment.py"
      - "backend/tests/test_native_product_executors.py"
      - "backend/tests/test_world_system_composer.py"
      - "backend/tests/test_product_operations.py"
      - "backend/tests/test_policy_repository.py"
