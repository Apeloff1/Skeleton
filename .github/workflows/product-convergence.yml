      - "backend/tests/test_runtime_sessions.py"
      - "backend/tests/test_course_runtime.py"
      - "backend/tests/test_game_session.py"
      - "backend/tests/test_input_sensory_vfx.py"
      - "backend/tests/test_quest_reputation.py"
      - "backend/tests/test_player_runtime.py"
      - "backend/tests/test_openworld_runtime.py"
      - "backend/tests/test_runtime_resilience.py"
      - "backend/tests/test_newmove_agents_and_ai.py"
      - "backend/tests/test_skill_save_character.py"
      - "backend/tests/test_environment_world_runtime.py"
      - "backend/tests/test_relationship_travel_discovery.py"
      - "backend/tests/test_world_runtime_social_travel.py"
      - "backend/tests/test_economy_dialogue_runtime.py"
      - "backend/tests/test_world_economy_dialogue.py"
      - "frontend/src/product/productCatalog.ts"
      - ".github/workflows/product-convergence.yml"
  pull_request:
    paths:
      - "backend/core/**"
      - "backend/routes/ops.py"
      - "backend/tests/test_content_store.py"
      - "backend/tests/test_execution_receipts.py"
      - "backend/tests/test_execution_evidence.py"
      - "backend/tests/test_execution_lifecycle_integration.py"
      - "backend/tests/test_system_assurance.py"
      - "backend/tests/test_system_root_attestation.py"
      - "backend/tests/test_capability_readiness.py"
      - "backend/tests/test_progression_intelligence_and_deployment.py"
      - "backend/tests/test_native_product_executors.py"
      - "backend/tests/test_world_system_composer.py"
      - "backend/tests/test_product_operations.py"
      - "backend/tests/test_policy_repository.py"
      - "backend/tests/test_product_control_plane.py"
      - "backend/tests/test_product_executor_registry.py"
      - "backend/tests/test_product_contract_parity.py"
      - "backend/tests/test_progression.py"
      - "backend/tests/test_playable_simulation.py"
      - "backend/tests/test_runtime_sessions.py"
      - "backend/tests/test_course_runtime.py"
      - "backend/tests/test_game_session.py"
      - "backend/tests/test_input_sensory_vfx.py"
      - "backend/tests/test_quest_reputation.py"
      - "backend/tests/test_player_runtime.py"
      - "backend/tests/test_openworld_runtime.py"
      - "backend/tests/test_runtime_resilience.py"
      - "backend/tests/test_newmove_agents_and_ai.py"
      - "backend/tests/test_skill_save_character.py"
      - "backend/tests/test_environment_world_runtime.py"
      - "backend/tests/test_relationship_travel_discovery.py"
      - "backend/tests/test_world_runtime_social_travel.py"
      - "backend/tests/test_economy_dialogue_runtime.py"
      - "backend/tests/test_world_economy_dialogue.py"
      - "frontend/src/product/productCatalog.ts"
      - ".github/workflows/product-convergence.yml"

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install "pytest>=8,<9"
      - name: Run convergence regression suites
        run: >-
          python -m pytest -q
          tests/test_content_store.py
          tests/test_execution_receipts.py
          tests/test_execution_evidence.py
          tests/test_execution_lifecycle_integration.py
          tests/test_system_assurance.py
          tests/test_system_root_attestation.py
          tests/test_capability_readiness.py
          tests/test_progression_intelligence_and_deployment.py
          tests/test_world_system_composer.py
          tests/test_product_operations.py
          tests/test_policy_repository.py
          tests/test_product_control_plane.py
          tests/test_product_executor_registry.py
          tests/test_native_product_executors.py
          tests/test_product_contract_parity.py
          tests/test_progression.py
          tests/test_playable_simulation.py
          tests/test_runtime_sessions.py
          tests/test_course_runtime.py
          tests/test_game_session.py
          tests/test_input_sensory_vfx.py
          tests/test_quest_reputation.py
          tests/test_player_runtime.py
          tests/test_openworld_runtime.py
          tests/test_runtime_resilience.py
          tests/test_newmove_agents_and_ai.py
          tests/test_skill_save_character.py
          tests/test_environment_world_runtime.py
          tests/test_relationship_travel_discovery.py
          tests/test_world_runtime_social_travel.py
          tests/test_economy_dialogue_runtime.py
          tests/test_world_economy_dialogue.py
          tests/test_charter_policy.py
          tests/test_durable_outbox.py
          tests/test_worm_audit.py
