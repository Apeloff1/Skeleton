name: Emerald V6 crossfade contact qualification
on:
  push:
    branches:
      - 'feat/emerald-v6-crossfade-*'
    paths:
      - 'scripts/emerald_v6_crossfade_screen.py'
      - 'scripts/test_emerald_v6_crossfade_screen.py'
      - 'scripts/verify_emerald_v6_crossfade_evidence.py'
      - 'scripts/test_emerald_v6_crossfade_evidence.py'
      - 'assets/emerald/evolution-v6/crossfade-*.json'
      - '.github/workflows/emerald-v6-crossfade.yml'
  pull_request:
    paths:
      - 'scripts/emerald_v6_crossfade_screen.py'
      - 'scripts/test_emerald_v6_crossfade_screen.py'
      - 'scripts/verify_emerald_v6_crossfade_evidence.py'
      - 'scripts/test_emerald_v6_crossfade_evidence.py'
      - 'assets/emerald/evolution-v6/crossfade-*.json'
      - '.github/workflows/emerald-v6-crossfade.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install numerical source dependencies
        run: python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.16.3 numba==0.62.1
      - name: Compile bounded exact GLB crossfade checker
        run: python -m py_compile scripts/emerald_v6_crossfade_screen.py scripts/test_emerald_v6_crossfade_screen.py scripts/verify_emerald_v6_crossfade_evidence.py scripts/test_emerald_v6_crossfade_evidence.py
      - name: Run hostile input, seam identity and evidence contract regressions
        run: |
          python scripts/test_emerald_v6_crossfade_screen.py
          python scripts/test_emerald_v6_crossfade_evidence.py
      - name: Report equipment and device holds
        run: echo 'Synthetic checks only; exact large private GLBs must be independently supplied; full continuous CCD, actual Three mixer, Unreal, physical RTX, artist and release NOT qualified.'
