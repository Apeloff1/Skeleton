name: Advanced Godot Native Factory Replay
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: advanced-native-factory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independently-execute-factory:
    name: Python/Godot factory parity on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 23
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Checkout exact PR head with safe source scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_advanced_factory_godot.py
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Godot 4.4.1 native runtime and export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: "4.4.1"
          use-dotnet: false
          include-templates: true
          cache: true
      - name: Validate exact source and Python proof contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          godot --version
          python -m py_compile skeleton/ai/game_builder/advanced_gameplay_runtime.py skeleton/ai/game_builder/advanced_factory_runtime.py skeleton/ai/game_builder/advanced_godot_export.py skeleton/ai/game_builder/advanced_factory_godot.py
          python -m unittest tests.test_game_builder_advanced_factory_godot -v
      - name: Build eight real authored factory production chains and resource scenarios
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from skeleton.ai.game_builder.advanced_level_scenes import make_advanced_scene
          from skeleton.ai.game_builder.advanced_gameplay_runtime import run_advanced_session
          from skeleton.ai.game_builder.advanced_factory_godot import render_factory_godot_package
          from skeleton.ai.game_builder.advanced_godot_export import write_advanced_godot_package
          root=Path(os.environ["RUNNER_TEMP"])/"advanced-native-factory"
          root.mkdir()
          winner=(["build:0","build:1","build:2","priority:speed"]
                  +["mine"]*3+["tick:4","ship"]
                  +["mine"]*5+["tick:4","ship"])
          cases=(
              ("original",{},["build:0","build:1","build:2","mine",
                                "tick:4","ship"],0,3),
              ("market_win",{"machines":4,"belt_speed":3},winner,1,3),
              ("power",{"belt_speed":2,"power_supply":14,"pollution":True},
               ["build:0","build:1","build:2","tick:4","generate",
                "priority:speed","scrub","repair:0","buy_coal",
                "upgrade:0","toggle:2","toggle:2"],2,3),
              ("grid",{"power_supply":12},
               ["build:0","build:1","build:2","build:3","tick:4",
                "buy_coal","priority:speed","tick:4"],3,4),
              ("machine_sales",{},
               ["build:0","build:1","sell:1","build:1",
                "upgrade:0","tick:4"],4,3),
              ("efficiency",{"belt_speed":1},
               ["build:0","build:1","build:2",
                "priority:efficiency","tick:4","mine","tick:4","ship"],5,3),
              ("scarce",{"machines":1,"power_supply":3},
               ["build:0","mine","tick:4","generate"],6,1),
              ("pollution",{"pollution":True,"belt_speed":3},
               ["build:0","build:1","build:2","priority:speed",
                "tick:4","scrub","priority:efficiency","mine"],7,3),
          )
          observed=set()
          for name,settings,actions,seed,slots in cases:
              topology={"stations":[{"id":i,"role":("smelter","assembler","packer","generator")[i]}
                                     for i in range(slots)],
                        "ore_deposit":45,"coal_deposit":14,"market_price":3,
                        "contract_target":8}
              scene=make_advanced_scene("factory",settings,seed=seed,layout=topology)
              game=run_advanced_session("factory",settings,actions,seed=seed,scene=scene)
              if name=="market_win":
                  assert game["terminal"] and game["state"]["finished"]
                  assert game["state"]["shipped"]>=8 and game["state"]["contracts"]>=2
              observed.update(event for record in game["trace"] for event in record["events"])
              package=render_factory_godot_package(game,settings,authorized=True)
              write_advanced_godot_package(package,root/name,authorized=True)
              print("NATIVE_FACTORY_SOURCE",name,"steps",len(actions),
                    "shipped",game["state"]["shipped"],"power",game["state"]["power"],
                    "digest",game["digest"])
          assert {"machine_constructed","finite_ore_mined","machine_produced",
                  "machine_stalled","manufacturing_contract_shipped",
                  "sustainable_factory_operating","machine_repaired",
                  "pollution_scrubbed","production_priority_changed",
                  "finite_coal_bought","machine_upgraded","local_grid_generated"}<=observed,observed
          PY
      - name: Independently execute eight original factory manufacturing histories
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/advanced-native-factory"
          python - "$root" <<'PY'
          import os, pathlib, subprocess, sys
          root=pathlib.Path(sys.argv[1])
          cases=("original","market_win","power","grid",
                 "machine_sales","efficiency","scarce","pollution")
          for case in cases:
              project=root/case/"godot"
              print("NATIVE_ADVANCED_FACTORY_CASE",case,flush=True)
              for args in (["--headless","--path",str(project),"--import"],
                           ["--headless","--path",str(project),"--","--verify-factory"]):
                  try:
                      # Git Bash provides the Godot launcher on Windows, but
                      # CreateProcess cannot resolve that shell-only command.
                      # Use the exact Git Bash installed by actions' bash shell.
                      cmd=(["godot",*args] if sys.platform!="win32" else [
                          str(pathlib.Path(os.environ["ProgramFiles"])/"Git"/"bin"/"bash.exe"),
                          "-c",'godot "$@"',"godot",*args])
                      result=subprocess.run(cmd,stdout=subprocess.PIPE,
                                            stderr=subprocess.STDOUT,text=True,
                                            encoding="utf-8",errors="replace",timeout=45)
                  except subprocess.TimeoutExpired as exc:
                      print("NATIVE_ADVANCED_FACTORY_TIMEOUT",case,args,flush=True)
                      if exc.stdout:
                          print(exc.stdout.decode("utf-8","replace") if isinstance(exc.stdout,bytes) else exc.stdout)
                      raise
                  print(result.stdout,flush=True)
                  if "--verify-factory" in args:
                      (root/case/"native-replay.log").write_text(result.stdout,encoding="utf-8")
                      if "NATIVE_ADVANCED_FACTORY_OK" not in result.stdout:
                          raise SystemExit("native gameplay proof marker absent: "+case)
                  if result.returncode:
                      raise SystemExit(f"Godot returned {result.returncode} on {case} {args}")
          PY
      - name: Export Linux desktop factory executable and execute the actual binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/advanced-native-factory/market_win/godot"
          executable="$RUNNER_TEMP/advanced-native-factory/original-advanced-factory.x86_64"
          godot --headless --path "$project" --export-release Linux "$executable"
          test -s "$executable"
          chmod +x "$executable"
          "$executable" --headless -- --verify-factory | tee "$RUNNER_TEMP/advanced-native-factory/linux-export-replay.log"
          grep -q "NATIVE_ADVANCED_FACTORY_OK" "$RUNNER_TEMP/advanced-native-factory/linux-export-replay.log"
      - name: Export actual Windows game and verify native console executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'advanced-native-factory'
          $project = Join-Path $root 'market_win/godot'
          $binary = Join-Path $root 'original-advanced-factory.exe'
          # The setup-godot Windows GUI editor can detach without a reliable
          # synchronous exit code. Use the same pinned official console engine
          # already required by the repository's Windows native integration.
          $archive = Join-Path $env:USERPROFILE 'downloads/Godot_v4.4.1-stable_win64.exe.zip'
          $engineDir = Join-Path $root 'pinned-godot-console'
          if (-not (Test-Path $archive)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $archive) | Out-Null
            Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip' -OutFile $archive -MaximumRedirection 5
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $engineDir -Force
          $nativeEditor = Get-ChildItem $engineDir -Recurse -Filter '*_console.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nativeEditor) {
            throw "Version-pinned official Godot Windows console editor unavailable"
          }
          & $nativeEditor.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows console startup failed" }
          & $nativeEditor.FullName --headless --path $project --import
          if ($LASTEXITCODE -ne 0) { throw "Advanced factory Windows resource import failed" }
          & $nativeEditor.FullName --headless --path $project --export-release 'Windows Desktop' $binary
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $binary)) {
            throw "Advanced Godot Windows console game executable export failed"
          }
          if ((Get-Item $binary).Length -le 1024) {
            throw "Advanced Godot Windows game executable is empty"
          }
          $console = Join-Path $root 'original-advanced-factory.console.exe'
          if (-not (Test-Path $console)) {
            throw "Exported original factory lacks an observable Windows console binary"
          }
          $python = @'
          import subprocess,sys
          result=subprocess.run(
              [sys.argv[1],"--headless","--","--verify-factory"],
              capture_output=True,text=True,timeout=90)
          print(result.stdout)
          print(result.stderr)
          sys.exit(0 if result.returncode==0 and
              "NATIVE_ADVANCED_FACTORY_OK" in result.stdout+result.stderr else 1)
          '@
          $proofScript = Join-Path $root 'verify_windows_native.py'
          [IO.File]::WriteAllText($proofScript, $python)
          & python $proofScript $console
          if ($LASTEXITCODE -ne 0) {
            throw "Exported Windows homebrew factory gameplay diverged from reviewed Python"
          }
          Write-Host "Native Windows executable SHA256:"
          Get-FileHash -Algorithm SHA256 $binary | Format-List
          Get-FileHash -Algorithm SHA256 $console | Format-List
      - name: Upload native gameplay proof logs and source release manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-advanced-factory-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/advanced-native-factory/*/native-replay.log
            ${{ runner.temp }}/advanced-native-factory/*/release.json
            ${{ runner.temp }}/advanced-native-factory/linux-export-replay.log
            ${{ runner.temp }}/advanced-native-factory/original-advanced-factory.exe
            ${{ runner.temp }}/advanced-native-factory/original-advanced-factory.console.exe
            ${{ runner.temp }}/advanced-native-factory/original-advanced-factory.x86_64
          if-no-files-found: warn
          retention-days: 7
