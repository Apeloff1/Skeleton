name: Adversarial Foundation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "backend/api_middleware.py"
      - "backend/tests/test_api_middleware_security.py"
      - "pyproject.toml"
      - "setup.cfg"
      - "skeleton/developer/cli.py"
      - "skeleton/testing/test_packaging_contract.py"
      - ".github/workflows/adversarial-foundation.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "backend/api_middleware.py"
      - "backend/tests/test_api_middleware_security.py"
      - "pyproject.toml"
      - "setup.cfg"
      - "skeleton/developer/cli.py"
      - "skeleton/testing/test_packaging_contract.py"
      - ".github/workflows/adversarial-foundation.yml"

permissions:
  contents: read

concurrency:
  group: adversarial-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Enforce packaging and runtime-image contracts
        run: python -m pytest -q skeleton/testing/test_packaging_contract.py

  middleware-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install runtime and focused test dependencies
        run: python -m pip install . "pytest>=8,<9"
      - name: Enforce proxy identity and API routing trust boundaries
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_api_middleware_security.py

  docker-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build root runtime image without publishing
        run: docker build --file Dockerfile .
      - name: Build backend production image without publishing
        run: docker build --file backend/Dockerfile --target production .
      - name: Build frontend production image without publishing
        run: docker build --file frontend/Dockerfile --target production frontend
