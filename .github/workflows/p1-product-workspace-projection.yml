name: P1 Product Workspace Projection Gate

on:
  push:
    branches:
      - main
    paths:
      - "backend/core/product_shell_projection.py"
      - "machine/ai_p1_task_backlog.json"
      - "backend/core/operation_projection.py"
      - "backend/tests/test_product_shell_projection.py"
      - "backend/tests/test_operation_projection.py"
      - "frontend/services/productProjection.ts"
      - "frontend/services/operationStreamReducer.ts"
      - "frontend/scripts/test-product-projection.mjs"
      - "frontend/scripts/test-operation-stream-reducer.mjs"
      - "frontend/package.json"
      - ".github/workflows/p1-product-workspace-projection.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/core/product_shell_projection.py"
      - "machine/ai_p1_task_backlog.json"
      - "backend/core/operation_projection.py"
      - "backend/tests/test_product_shell_projection.py"
      - "backend/tests/test_operation_projection.py"
      - "frontend/services/productProjection.ts"
      - "frontend/services/operationStreamReducer.ts"
      - "frontend/scripts/test-product-projection.mjs"
      - "frontend/scripts/test-operation-stream-reducer.mjs"
      - "frontend/package.json"
      - ".github/workflows/p1-product-workspace-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-product-workspace-projection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate authority-bound workspace projection
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install focused Python runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile PROD-03 backend contract
        run: python -m compileall -q backend/core/product_shell_projection.py

      - name: Run PROD-02/03 backend regressions
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_operation_projection.py
          backend/tests/test_product_shell_projection.py

      - name: Run operation and workspace frontend reducers
        run: >-
          node --test
          frontend/scripts/test-operation-stream-reducer.mjs
          frontend/scripts/test-product-projection.mjs

      - name: Build accepted PROD-03 projection evidence
        run: |
          set -euo pipefail
          mkdir -p .p1-prod-03
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          from core.operation_projection import (
              apply_projection_events,
              start_projection,
          )
          from core.product_shell_projection import (
              project_workspace_product_state,
          )
          from skeleton.contracts.operation import OperationEnvelope, OperationState
          from skeleton.frontier.operation_stream import StreamEvent
          from skeleton.persistence.operation_store import StoredOperation

          now = datetime(2026, 9, 28, 12, 0, tzinfo=timezone.utc)
          operation_id = "00000000-0000-4000-8000-000000000031"
          envelope = OperationEnvelope(
              operation_id=operation_id,
              tenant_id="ci-tenant",
              actor_id="ci-actor",
              capability="chat",
              created_at=now,
              deadline=now + timedelta(minutes=10),
              idempotency_key="p1-prod-03-ci",
              trace_id="ci-prod-03",
              state=OperationState.RUNNING,
          )
          authority = StoredOperation(
              envelope=envelope,
              version=5,
              updated_at=now + timedelta(seconds=5),
          )
          states = (
              OperationState.CREATED,
              OperationState.VALIDATED,
              OperationState.AUTHORIZED,
              OperationState.ADMITTED,
              OperationState.RUNNING,
          )
          events = []
          for sequence, state in enumerate(states, start=1):
              payload = {
                  "state": state.value,
                  "version": sequence,
                  "trace_id": envelope.trace_id,
              }
              if state is OperationState.RUNNING:
                  payload.update({
                      "progress": 0.75,
                      "progress_label": "Verifying result",
                      "cost": {
                          "currency": "USD",
                          "spent": 0.25,
                          "budget": 1.0,
                      },
                      "evidence": [{
                          "source": "ci://prod-03/result",
                          "digest": "a" * 64,
                          "category": "workspace_receipt",
                      }],
                  })
              events.append(StreamEvent(
                  operation_id=operation_id,
                  event_id=f"10000000-0000-4000-8000-{sequence:012d}",
                  sequence=sequence,
                  type=f"operation.{state.value}",
                  timestamp=now + timedelta(seconds=sequence),
                  payload=payload,
              ))

          projection = apply_projection_events(
              start_projection(authority),
              tuple(events),
          )
          product = project_workspace_product_state(
              authority=authority,
              projection=projection,
              events=tuple(events),
          )
          evidence = product.evidence_ref()
          if product.writable is not False:
              raise SystemExit("PROD-03 projection unexpectedly writable")
          if product.operation_state != "running" or product.progress != 0.75:
              raise SystemExit("PROD-03 projection fixture mismatch")
          Path(".p1-prod-03/projection.json").write_text(
              json.dumps(product.as_dict(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-prod-03/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head PROD-03 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-prod-03/config.digest").write_text(
              hashlib.sha256(
                  b"p1-prod-03-workspace-projection-v1"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-prod-03/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|node-24|prod-03"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-prod-03/verifier.digest").write_text(
              digest([
                  "backend/core/product_shell_projection.py",
                  "backend/core/operation_projection.py",
                  "frontend/services/productProjection.ts",
                  "frontend/services/operationStreamReducer.ts",
                  ".github/workflows/p1-product-workspace-projection.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-prod-03/tests.digest").write_text(
              digest([
                  "backend/tests/test_operation_projection.py",
                  "backend/tests/test_product_shell_projection.py",
                  "frontend/scripts/test-operation-stream-reducer.mjs",
                  "frontend/scripts/test-product-projection.mjs",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-PROD-03 \
            --accountability-id ACC-P1-PROD-03 \
            --configuration-digest "$(cat .p1-prod-03/config.digest)" \
            --environment-digest "$(cat .p1-prod-03/environment.digest)" \
            --verifier-id github-actions:p1-product-workspace-projection \
            --verifier-digest "$(cat .p1-prod-03/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-prod-03/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-prod-03/refs.json \
            --out .p1-prod-03/receipt.json \
            > .p1-prod-03/stdout.json

      - name: Assert exact-head PROD-03 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-prod-03/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("PROD-03 receipt head mismatch")
          if receipt["task_id"] != "P1-PROD-03":
              raise SystemExit("PROD-03 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-PROD-03":
              raise SystemExit("PROD-03 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("PROD-03 exact-head receipt OK", receipt["receipt_digest"])
          PY
