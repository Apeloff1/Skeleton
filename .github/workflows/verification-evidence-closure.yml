name: Verification Evidence Closure Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/contracts/verification.py"
      - "skeleton/ai/runtime/contracts/verification.py"
      - "skeleton/intelligence/verification_policy.py"
      - "skeleton/ai/runtime/intelligence/verification_policy.py"
      - "skeleton/intelligence/verification_runtime.py"
      - "skeleton/ai/runtime/intelligence/verification_runtime.py"
      - "skeleton/retrieval/verification.py"
      - "skeleton/skills/verification.py"
      - "skeleton/ai/runtime/skills/verification.py"
      - "skeleton/intelligence/execution_runtime.py"
      - "skeleton/ai/runtime/intelligence/execution_runtime.py"
      - "skeleton/persistence/execution_repository.py"
      - "skeleton/ai/runtime/persistence/execution_repository.py"
      - "skeleton/testing/test_verification_runtime.py"
      - "skeleton/testing/test_execution_runtime.py"
      - "scripts/verify_verification_evidence_closure.py"
      - "tests/test_verification_evidence_independent_verifier.py"
      - "machine/ai_app_construction.json"
      - "machine/ai_closure_evidence.json"
      - "machine/ai_implementation_handoff.json"
      - ".github/workflows/verification-evidence-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-evidence-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification-evidence-contracts:
    name: Verification evidence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused verification runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"

      - name: Run canonical verification contracts
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_verification_runtime.py

      - name: Run execution verification persistence contracts
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_execution_runtime.py
          -k "verification or finalization_binding"

  verification-evidence-independent:
    name: Independent verification evidence verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install independent verifier dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Run independent verification evidence regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_verification_evidence_independent_verifier.py

      - name: Run independent exact-head verification scan
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_verification_evidence_closure.py
          --evidence-out .verification-evidence-independent.json
          --print-evidence

      - name: Assert independent exact-head receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".verification-evidence-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit(
                  "verification evidence receipt does not match exact PR head"
              )
          if receipt.get("verifier") != "independent-verification-evidence-v1":
              raise SystemExit(
                  "unexpected verification evidence verifier identity"
              )
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit(
                  "independent verification evidence scan failed"
              )
          if len(receipt.get("boundary_digests") or {}) < 6:
              raise SystemExit(
                  "verification evidence boundary coverage is incomplete"
              )
          mirrors = receipt.get("mirror_pairs") or []
          if len(mirrors) < 6:
              raise SystemExit(
                  "verification evidence mirror coverage is incomplete"
              )
          expected_dependencies = {
              "gap-context-compiler-convergence",
              "gap-tool-runtime-convergence",
              "gap-provider-interaction-protocol",
          }
          if set(receipt.get("dependency_graph") or []) != expected_dependencies:
              raise SystemExit(
                  "verification evidence dependency graph is invalid"
              )
          if not receipt.get("handoff_digest"):
              raise SystemExit(
                  "verification evidence handoff digest is missing"
              )
          print(
              "independent verification evidence exact-head receipt:",
              expected,
              "boundaries=",
              len(receipt["boundary_digests"]),
              "mirrors=",
              len(mirrors),
          )
          PY
