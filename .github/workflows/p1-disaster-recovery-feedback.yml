name: P1 Disaster Recovery Feedback Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/release/disaster_recovery.py"
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/release/restore.py"
      - "skeleton/release/__init__.py"
      - "skeleton/eval/failure_knowledge.py"
      - "scripts/state_recovery_drill.py"
      - "skeleton/testing/test_disaster_recovery_qualification.py"
      - "skeleton/testing/test_backup_restore_qualification.py"
      - "skeleton/testing/test_backup_restore_integration.py"
      - "skeleton/testing/test_failure_knowledge.py"
      - "skeleton/testing/test_state_recovery_drill.py"
      - ".github/workflows/p1-disaster-recovery-feedback.yml"
  pull_request:
    branches:
      - main
      - p1/rel-04-backup-restore-qualification-20260928
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/release/disaster_recovery.py"
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/release/restore.py"
      - "skeleton/release/__init__.py"
      - "skeleton/eval/failure_knowledge.py"
      - "scripts/state_recovery_drill.py"
      - "skeleton/testing/test_disaster_recovery_qualification.py"
      - "skeleton/testing/test_backup_restore_qualification.py"
      - "skeleton/testing/test_backup_restore_integration.py"
      - "skeleton/testing/test_failure_knowledge.py"
      - "skeleton/testing/test_state_recovery_drill.py"
      - ".github/workflows/p1-disaster-recovery-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-disaster-recovery-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate DR RTO RPO and incident feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile REL-04 and REL-05 contracts
        run: >-
          python -m compileall -q
          skeleton/release/restore.py
          skeleton/release/disaster_recovery.py
          skeleton/eval/failure_knowledge.py
          scripts/state_recovery_drill.py

      - name: Run restore recovery and failure-feedback regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_backup_restore_qualification.py
          skeleton/testing/test_backup_restore_integration.py
          skeleton/testing/test_disaster_recovery_qualification.py
          skeleton/testing/test_failure_knowledge.py
          skeleton/testing/test_state_recovery_drill.py

      - name: Build accepted exact-head REL-05 evidence
        run: |
          set -euo pipefail
          mkdir -p .p1-rel-05
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from skeleton.contracts.canonical import EvidenceRef
          from skeleton.eval.failure_knowledge import (
              FailureDisposition,
              FailureKnowledgeLedger,
              FailureKnowledgeQualificationDecision,
              FailureKnowledgeRecord,
              FailureSourceKind,
          )
          from skeleton.eval.regression_corpus import FailureClass
          from skeleton.release.disaster_recovery import (
              DisasterRecoveryDrillReceipt,
              DisasterScenario,
              IncidentCorrectiveAction,
              qualify_disaster_recovery,
          )
          from skeleton.release.restore import (
              BackupRestoreQualificationDecision,
          )

          def sha(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          commit = os.environ["EXPECTED_SHA"]
          restore = BackupRestoreQualificationDecision(
              accepted=True,
              reasons=(),
              source_commit=commit,
              migration_compatibility_digest=sha(b"rel-03"),
              manifest_digest=sha(b"rel-04-manifest"),
              authoritative_state_digest=sha(b"authoritative-state"),
              receipt_digests=(sha(b"restore-receipts"),),
          )

          records = []
          actions = []
          drills = []
          for index, scenario in enumerate(DisasterScenario, start=1):
              incident_id = f"INC-{index}"
              risk_id = f"P1-RISK-DR-{index}"
              risk_digest = sha(f"{risk_id}:digest".encode())
              record = FailureKnowledgeRecord(
                  record_id=f"dr-failure-{index}",
                  version=1,
                  sequence=index,
                  source_kind=FailureSourceKind.INCIDENT,
                  source_ref=f"incident:{incident_id}",
                  source_digest=sha(f"{incident_id}:source".encode()),
                  failure_class=FailureClass.REASONING_ERROR,
                  failure_fingerprint=sha(
                      f"{incident_id}:fingerprint".encode()
                  ),
                  summary=f"DR incident feedback for {scenario.value}.",
                  root_cause_digest=sha(
                      f"{incident_id}:root-cause".encode()
                  ),
                  risk_obligation_id=risk_id,
                  risk_obligation_digest=risk_digest,
                  disposition=FailureDisposition.REGRESSION_COVERED,
                  evidence_refs=(
                      EvidenceRef(
                          source=f"ci://failure/{incident_id}",
                          digest=sha(
                              f"{incident_id}:failure-evidence".encode()
                          ),
                          category="failure_knowledge",
                      ),
                  ),
                  regression_case_id=f"dr-regression-{index}",
                  regression_case_version=1,
                  regression_case_digest=sha(
                      f"dr-regression-{index}".encode()
                  ),
              )
              records.append(record)

          ledger = FailureKnowledgeLedger(
              ledger_id="rel-05-dr-incidents",
              version=1,
              records=tuple(records),
          )
          knowledge = FailureKnowledgeQualificationDecision(
              accepted=True,
              reasons=(),
              ledger_digest=ledger.ledger_digest,
              regression_corpus_digest=sha(b"known-failure-corpus"),
              signal_digests=(sha(b"failure-signal"),),
          )

          for index, (scenario, record) in enumerate(
              zip(DisasterScenario, records, strict=True),
              start=1,
          ):
              incident_id = record.source_ref.removeprefix("incident:")
              action = IncidentCorrectiveAction(
                  action_id=f"action-{index}",
                  incident_id=incident_id,
                  incident_digest=record.source_digest,
                  owner_id="owner:reliability",
                  risk_obligation_id=record.risk_obligation_id,
                  risk_obligation_digest=record.risk_obligation_digest,
                  failure_knowledge_ledger_digest=ledger.ledger_digest,
                  failure_record_digest=record.record_digest,
                  corrective_test_digest=sha(
                      f"action-{index}:corrective-test".encode()
                  ),
                  evidence_refs=(
                      EvidenceRef(
                          source=f"ci://incident/{incident_id}/followup",
                          digest=sha(
                              f"{incident_id}:followup".encode()
                          ),
                          category="incident_followup",
                      ),
                  ),
              )
              actions.append(action)
              state = sha(f"{scenario.value}:state".encode())
              drills.append(
                  DisasterRecoveryDrillReceipt(
                      scenario=scenario,
                      source_commit=commit,
                      backup_restore_qualification_digest=(
                          restore.decision_digest
                      ),
                      authoritative_state_digest=(
                          restore.authoritative_state_digest
                      ),
                      pre_failure_state_digest=state,
                      recovered_state_digest=state,
                      rto_target_seconds=300.0,
                      rto_observed_seconds=120.0,
                      rpo_target_seconds=60.0,
                      rpo_observed_seconds=20.0,
                      incident_id=incident_id,
                      incident_digest=record.source_digest,
                      corrective_action_ids=(action.action_id,),
                      verifier_id=f"github-actions:{scenario.value}",
                      verifier_digest=sha(
                          f"{scenario.value}:verifier".encode()
                      ),
                      test_manifest_digest=sha(
                          f"{scenario.value}:tests".encode()
                      ),
                      evidence_refs=(
                          EvidenceRef(
                              source=f"ci://rel-05/{scenario.value}",
                              digest=sha(
                                  f"{scenario.value}:dr-evidence".encode()
                              ),
                              category="disaster_recovery",
                          ),
                      ),
                      passed=True,
                      independent=True,
                      production_mutation_count=0,
                  )
              )

          decision = qualify_disaster_recovery(
              backup_restore=restore,
              failure_knowledge=knowledge,
              failure_knowledge_ledger=ledger,
              drills=tuple(drills),
              corrective_actions=tuple(actions),
          )
          if not decision.accepted:
              raise SystemExit(
                  f"REL-05 DR qualification rejected: {decision.reasons}"
              )
          evidence = decision.accepted_evidence_ref()
          Path(".p1-rel-05/decision.json").write_text(
              json.dumps(decision.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-rel-05/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          Path(".p1-rel-05/config.digest").write_text(
              sha(b"p1-rel-05-disaster-recovery-v1"),
              encoding="utf-8",
          )
          Path(".p1-rel-05/environment.digest").write_text(
              sha(b"ubuntu-24.04|python-3.11.16|rel-05"),
              encoding="utf-8",
          )
          Path(".p1-rel-05/verifier.digest").write_text(
              sha(
                  Path("skeleton/release/disaster_recovery.py").read_bytes()
                  + Path(".github/workflows/p1-disaster-recovery-feedback.yml").read_bytes()
              ),
              encoding="utf-8",
          )
          Path(".p1-rel-05/tests.digest").write_text(
              sha(
                  Path("skeleton/testing/test_disaster_recovery_qualification.py").read_bytes()
                  + Path("skeleton/testing/test_state_recovery_drill.py").read_bytes()
                  + Path("skeleton/testing/test_failure_knowledge.py").read_bytes()
              ),
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head REL-05 evidence receipt
        run: |
          set -euo pipefail
          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-REL-05 \
            --accountability-id ACC-P1-REL-05 \
            --configuration-digest "$(cat .p1-rel-05/config.digest)" \
            --environment-digest "$(cat .p1-rel-05/environment.digest)" \
            --verifier-id github-actions:p1-disaster-recovery-feedback \
            --verifier-digest "$(cat .p1-rel-05/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-rel-05/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-rel-05/refs.json \
            --out .p1-rel-05/receipt.json \
            > .p1-rel-05/stdout.json

      - name: Assert exact-head REL-05 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-rel-05/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("REL-05 receipt head mismatch")
          if receipt["task_id"] != "P1-REL-05":
              raise SystemExit("REL-05 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-REL-05":
              raise SystemExit("REL-05 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("REL-05 exact-head receipt OK", receipt["receipt_digest"])
          PY
