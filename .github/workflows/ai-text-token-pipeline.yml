name: AI Text-to-Token Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skeleton/ai/model_runtime/text_normalization.py'
      - 'skeleton/ai/model_runtime/text_pipeline.py'
      - 'skeleton/ai/model_runtime/tokenization.py'
      - 'skeleton/ai/model_runtime/__init__.py'
      - 'tests/flgb/test_flgb_02_text_normalization.py'
      - 'tests/ai_pipeline/test_text_pipeline.py'
      - '.github/workflows/ai-text-token-pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'skeleton/ai/model_runtime/text_normalization.py'
      - 'skeleton/ai/model_runtime/text_pipeline.py'
      - 'skeleton/ai/model_runtime/tokenization.py'
      - 'skeleton/ai/model_runtime/__init__.py'
      - 'tests/flgb/test_flgb_02_text_normalization.py'
      - 'tests/ai_pipeline/test_text_pipeline.py'
      - '.github/workflows/ai-text-token-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-text-token-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Verify text-to-token pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Install runtime and pinned pytest
        run: python -m pip install --disable-pip-version-check . 'pytest==8.4.2'
      - name: Compile implementation and tests
        run: python -m py_compile skeleton/ai/model_runtime/text_pipeline.py skeleton/ai/model_runtime/text_normalization.py skeleton/ai/model_runtime/tokenization.py tests/ai_pipeline/test_text_pipeline.py tests/flgb/test_flgb_02_text_normalization.py
      - name: Test normalization contracts
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_02_text_normalization.py' -v
      - name: Test deterministic pipeline and temporal evidence gates
        run: python -m pytest -q tests/ai_pipeline/test_text_pipeline.py
      - name: Verify checkout remains exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
