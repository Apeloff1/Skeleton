name: Jeeves Hyperdispatcher source qualification
on:
  pull_request:
    paths:
      - 'skeleton/intelligence/dispatch_policy.py'
      - 'skeleton/intelligence/dispatch_advisory.py'
      - 'skeleton/kernel/global_resource_scheduler.py'
      - 'skeleton/automation/agents/swarm_*.py'
      - 'skeleton/ai/agents/core/swarm_*.py'
      - 'skeleton/ai/runtime/kernel/global_resource_scheduler.py'
      - 'skeleton/intelligence/shared_pressure.py'
      - 'skeleton/ai/runtime/intelligence/**'
      - 'skeleton/testing/test_jeeves_hyperdispatcher.py'
      - '.github/workflows/jeeves-hyperdispatcher-source.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir pytest
      - run: python -m pytest -q --noconftest skeleton/testing/test_jeeves_hyperdispatcher.py
      - run: python scripts/check_ai_file_tree.py
