name: Jeeves Hyperdispatcher source qualification
on:
  pull_request:
    paths:
      - 'skeleton/intelligence/dispatch_policy.py'
      - 'skeleton/intelligence/dispatch_advisory.py'
      - 'skeleton/intelligence/dispatch_hardware.py'
      - 'skeleton/intelligence/dispatch_cognitive.py'
      - 'skeleton/intelligence/dispatch_workflow.py'
      - 'skeleton/intelligence/dispatch_expansion.py'
      - 'skeleton/intelligence/dispatch_fabric.py'
      - 'skeleton/intelligence/dispatch_events.py'
      - 'skeleton/intelligence/dispatch_affinity.py'
      - 'skeleton/kernel/global_resource_scheduler.py'
      - 'skeleton/automation/agents/swarm_*.py'
      - 'skeleton/ai/runtime/inference/llama_cpp.py'
      - 'skeleton/app/cli.py'
      - 'skeleton/app/runtime/jeeves_host_runtime.py'
      - 'skeleton/ai/runtime/application/jeeves_host_runtime.py'
      - 'skeleton/ai/agents/core/swarm_*.py'
      - 'skeleton/ai/runtime/kernel/global_resource_scheduler.py'
      - 'skeleton/intelligence/shared_pressure.py'
      - 'skeleton/ai/runtime/intelligence/**'
      - 'skeleton/testing/test_jeeves_hyperdispatcher.py'
      - 'pyproject.toml'
      - 'skeleton/testing/test_durable_run_store.py'
      - 'skeleton/state/run_store.py'
      - 'skeleton/ai/runtime/state/run_store.py'
      - 'machine/ai_file_tree.json'
      - '.machine/repository.toml'
      - '.github/workflows/jeeves-hyperdispatcher-source.yml'
concurrency:
  group: jeeves-hyperdispatcher-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input -e . "pytest>=8,<9" "pytest-asyncio>=1.4.0,<2" "PyJWT==2.15.1" "zstandard==0.25.0" "PyYAML>=6,<7" "numpy>=2,<3" "Pillow>=13.0.0,<14"
      - run: python -m pytest -q -rP --noconftest skeleton/testing/test_jeeves_hyperdispatcher.py
      - run: python -m pytest -q -rP --noconftest skeleton/testing/test_durable_run_store.py
      - run: python scripts/check_ai_file_tree.py
