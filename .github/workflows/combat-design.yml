name: Combat Design

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "skeleton/simulation/game/combat_design/**"
      - "skeleton/simulation/game/mechanics_depth/tick_clock.py"
      - "skeleton/testing/test_combat_design.py"
      - "scripts/balance_combat_encounter.py"
      - "docs/game/COMBAT_DESIGN_SPEC.md"
      - ".github/workflows/combat-design.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/simulation/game/combat_design/**"
      - "skeleton/simulation/game/mechanics_depth/tick_clock.py"
      - "skeleton/testing/test_combat_design.py"
      - "scripts/balance_combat_encounter.py"
      - "docs/game/COMBAT_DESIGN_SPEC.md"
      - ".github/workflows/combat-design.yml"

concurrency:
  group: combat-design-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  combat-design:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Combat design invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install focused test runtime
        run: >-
          python -m pip install
          "pytest>=8,<9"
          "pydantic>=2.5,<3"
          "pydantic-settings>=2.1,<3"
      - name: Compile combat design slice
        run: >-
          python -m compileall -q
          skeleton/simulation/game/combat_design
          skeleton/testing/test_combat_design.py
          scripts/balance_combat_encounter.py
      - name: Run combat design regressions
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q skeleton/testing/test_combat_design.py
