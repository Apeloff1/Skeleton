name: Dragon Atlas backend adapter qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-atlas-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Owner-scoped research Atlas policy and application bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact source head identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install approved backend adapter dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pymongo==4.19.0" "motor==3.7.1" "httpx>=0.28.1,<1"
          "python-dotenv>=1,<2" "fastapi>=0.142.2,<1"
          "pydantic>=2.14.1,<3" "pydantic-settings>=2.15.0,<3"
          "cryptography>=50.0.2"
      - name: Compile backend and fixture
        run: |
          python -m py_compile backend/core/dragon_crawler.py
          python -m py_compile backend/tests/test_dragon_atlas_bridge.py
          python -m py_compile skeleton/ai/webcrawler/operations.py
          python -m py_compile skeleton/ai/webcrawler/media_probe.py
          python -m py_compile tests/test_ai_webcrawler_dragon_mime_custody.py
      - name: Verify actual read-only application adapter with forged storage races
        env:
          PYTHONPATH: ".:backend:tests"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s backend/tests -p 'test_dragon_atlas_bridge.py' -v
      - name: Verify legacy and forged media provenance remains fail closed
        env:
          PYTHONPATH: ".:backend:tests"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_mime_custody.py' -v
