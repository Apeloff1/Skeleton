name: P1 Core Intelligence Bundle Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/intelligence/core_intelligence.py"
      - "skeleton/ai/runtime/intelligence/core_intelligence.py"
      - "skeleton/intelligence/routing_context_receipt.py"
      - "skeleton/intelligence/memory_retrieval_quality.py"
      - "skeleton/intelligence/strategy_registry.py"
      - "skeleton/intelligence/output_quality.py"
      - "skeleton/intelligence/plan_verifier.py"
      - "skeleton/intelligence/__init__.py"
      - "skeleton/ai/runtime/intelligence/__init__.py"
      - "skeleton/testing/test_core_intelligence_bundle.py"
      - ".github/workflows/p1-core-intelligence-bundle.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/intelligence/core_intelligence.py"
      - "skeleton/ai/runtime/intelligence/core_intelligence.py"
      - "skeleton/intelligence/routing_context_receipt.py"
      - "skeleton/intelligence/memory_retrieval_quality.py"
      - "skeleton/intelligence/strategy_registry.py"
      - "skeleton/intelligence/output_quality.py"
      - "skeleton/intelligence/plan_verifier.py"
      - "skeleton/intelligence/__init__.py"
      - "skeleton/ai/runtime/intelligence/__init__.py"
      - "skeleton/testing/test_core_intelligence_bundle.py"
      - ".github/workflows/p1-core-intelligence-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-core-intelligence-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate core intelligence qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile INTEL-06 contracts
        run: >-
          python -m compileall -q
          skeleton/intelligence/core_intelligence.py
          skeleton/ai/runtime/intelligence/core_intelligence.py

      - name: Run INTEL-01 through INTEL-06 regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_routing_context_receipt.py
          skeleton/testing/test_memory_retrieval_knowledge_quality.py
          skeleton/testing/test_reasoning_strategy_registry.py
          skeleton/testing/test_vol013_cognitive_budget_control.py
          skeleton/testing/test_answer_artifact_quality.py
          skeleton/testing/test_plan_qualification.py
          skeleton/testing/test_core_intelligence_bundle.py

      - name: Validate canonical AI file tree parity
        run: python scripts/check_ai_file_tree.py

      - name: Build accepted INTEL-06 decision
        run: |
          set -euo pipefail
          mkdir -p .p1-intel-06
          python - <<'PY'
          import json
          from pathlib import Path

          from skeleton.intelligence.core_intelligence import (
              qualify_core_intelligence,
          )
          from skeleton.intelligence.memory_retrieval_quality import (
              IntelligenceQualityDecision,
          )
          from skeleton.intelligence.output_quality import (
              AnswerArtifactQualityDecision,
              OutputDisposition,
          )
          from skeleton.intelligence.plan_verifier import (
              PlanQualificationDecision,
          )
          from skeleton.intelligence.routing_context_receipt import (
              RoutingContextReceipt,
          )
          from skeleton.intelligence.strategy_registry import (
              StopDisposition,
              StoppingDecision,
          )

          routing = RoutingContextReceipt(
              operation_id="ci-operation",
              execution_id="ci-execution",
              turn_id="ci-turn",
              tenant_id="ci-tenant",
              request_id="ci-request",
              context_id="ci-context",
              context_digest="a" * 64,
              request_digest="b" * 64,
              route_plan_digest="c" * 64,
              route_result_digest="d" * 64,
              admission_decision_id="ci-admission",
              admission_status="admit",
              admission_reason="within-bounds",
              route_status="ok",
              selected_provider_id="provider-ci",
              planned_provider_ids=("provider-ci",),
              fallback_provider_ids=(),
              required_capabilities=("text",),
              context_tokens=100,
              context_capacity=1000,
              trust_counts=(("trusted", 1),),
              data_class_counts=(("internal", 1),),
              omission_reason_counts=(),
              max_selected_data_class="internal",
              max_allowed_data_class="confidential",
              quality_score=0.95,
              quality_floor=0.80,
              quality_accepted=True,
              quality_digest="e" * 64,
              spent_cost=0.10,
              remaining_cost=0.90,
              spent_output_tokens=50,
              remaining_output_tokens=950,
              deadline_seconds=30.0,
              observed_attempt_latency_seconds=0.25,
              blockers=(),
              eligible_for_promotion=True,
          )
          intelligence = IntelligenceQualityDecision(
              accepted=True,
              reasons=(),
              memory_digest="1" * 64,
              conflict_digest="2" * 64,
              retrieval_digest="3" * 64,
              retrieval_provenance_digest="4" * 64,
              freshness_digest="5" * 64,
              knowledge_digest="6" * 64,
              quality_digest=routing.quality_digest,
              policy_digest="7" * 64,
              observed_at=1_800_000_000.0,
          )
          stopping = StoppingDecision(
              disposition=StopDisposition.COMPLETE,
              reason="quality-complete",
              policy_digest="8" * 64,
              history_digest="9" * 64,
              steps_remaining=2,
              tokens_remaining=1000,
              cost_remaining=2.0,
              time_remaining_s=20.0,
          )
          output = AnswerArtifactQualityDecision(
              accepted=True,
              disposition=OutputDisposition.QUALIFIED,
              reasons=(),
              answer_evaluation_digest="a" * 64,
              artifact_evaluation_digests=("b" * 64,),
              regression_digests=("c" * 64,),
              policy_digest="d" * 64,
          )
          plan = PlanQualificationDecision(
              accepted=True,
              reasons=(),
              plan_digest="e" * 64,
              verification_policy_digest="f" * 64,
              reasoning_policy_digest=stopping.policy_digest,
              analysis_digest="1" * 64,
              simulation_digest="2" * 64,
              stopping_digest=stopping.decision_digest,
              risk_evaluation_digest="3" * 64,
          )
          decision = qualify_core_intelligence(
              routing_context=routing,
              intelligence_quality=intelligence,
              stopping=stopping,
              output_quality=output,
              plan_qualification=plan,
          )
          if not decision.accepted:
              raise SystemExit(
                  f"INTEL-06 fixture rejected: {decision.reasons}"
              )
          evidence = decision.accepted_evidence_ref()
          Path(".p1-intel-06/decision.json").write_text(
              json.dumps(decision.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-intel-06/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head INTEL-06 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-intel-06/config.digest").write_text(
              hashlib.sha256(
                  b"p1-intel-06-core-intelligence-v1"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-intel-06/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|intel-06"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-intel-06/verifier.digest").write_text(
              digest([
                  "skeleton/intelligence/core_intelligence.py",
                  "skeleton/intelligence/routing_context_receipt.py",
                  "skeleton/intelligence/memory_retrieval_quality.py",
                  "skeleton/intelligence/strategy_registry.py",
                  "skeleton/intelligence/output_quality.py",
                  "skeleton/intelligence/plan_verifier.py",
                  ".github/workflows/p1-core-intelligence-bundle.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-intel-06/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_routing_context_receipt.py",
                  "skeleton/testing/test_memory_retrieval_knowledge_quality.py",
                  "skeleton/testing/test_reasoning_strategy_registry.py",
                  "skeleton/testing/test_answer_artifact_quality.py",
                  "skeleton/testing/test_plan_qualification.py",
                  "skeleton/testing/test_core_intelligence_bundle.py",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-INTEL-06 \
            --accountability-id ACC-P1-INTEL-06 \
            --configuration-digest "$(cat .p1-intel-06/config.digest)" \
            --environment-digest "$(cat .p1-intel-06/environment.digest)" \
            --verifier-id github-actions:p1-core-intelligence-bundle \
            --verifier-digest "$(cat .p1-intel-06/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-intel-06/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-intel-06/refs.json \
            --out .p1-intel-06/receipt.json \
            > .p1-intel-06/stdout.json

      - name: Assert exact-head INTEL-06 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-intel-06/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("INTEL-06 receipt head mismatch")
          if receipt["task_id"] != "P1-INTEL-06":
              raise SystemExit("INTEL-06 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-INTEL-06":
              raise SystemExit("INTEL-06 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("INTEL-06 exact-head receipt OK", receipt["receipt_digest"])
          PY
