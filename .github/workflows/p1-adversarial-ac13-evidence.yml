name: P1 Adversarial AC-13 Evidence Gate

on:
  pull_request:
    branches:
      - main
      - p1/adversarial-wave2-bindings-20260930
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "skeleton/security/archive_sandbox.py"
      - "skeleton/testing/test_security_archive_sandbox.py"
      - "scripts/build_p1_adversarial_ac13_evidence.py"
      - "tests/test_p1_adversarial_ac13_evidence.py"
      - "tests/test_p1_adversarial_ac13_binding.py"
      - ".github/workflows/p1-adversarial-ac13-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-adversarial-ac13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify AC-13 hostile parser and resource-bomb evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Run hostile archive parser regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_security_archive_sandbox.py
          tests/test_p1_adversarial_ac13_evidence.py
          tests/test_p1_adversarial_ac13_binding.py
          tests/test_p1_adversarial_ac11_binding.py
          tests/test_p1_adversarial_ac14_binding.py
          tests/test_p1_adversarial_ac15_binding.py
          tests/test_p1_adversarial_ac20_binding.py
          tests/test_p1_risk_evidence_reconciliation.py

      - name: Compile exact-head AC-13 evidence twice
        run: |
          set -euo pipefail
          mkdir -p .p1-ac13
          python scripts/build_p1_adversarial_ac13_evidence.py             --expected-head "$EXPECTED_SHA"             --out .p1-ac13/report.json             --print-summary
          python scripts/build_p1_adversarial_ac13_evidence.py             --expected-head "$EXPECTED_SHA"             --out .p1-ac13/replay.json
          cmp .p1-ac13/report.json .p1-ac13/replay.json

      - name: Prove AC-13 mode completeness and emit binding seed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(".p1-ac13/report.json").read_text(encoding="utf-8"))
          candidate = report["candidate"]
          expected_modes = {
              "fuzz",
              "parser_limits",
              "decompression_bomb",
              "complexity_budget",
          }
          if report["axis_id"] != "AC-13":
              raise SystemExit("wrong adversarial axis")
          if report["candidate_count"] != 1:
              raise SystemExit("AC-13 candidate count drift")
          if report["already_bound_count"] != 1:
              raise SystemExit("AC-13 governed binding not detected")
          if report["candidate_binding_count"] != 0:
              raise SystemExit("AC-13 unexpectedly remains a binding candidate")
          if candidate["binding_present"] is not True:
              raise SystemExit("AC-13 candidate does not detect governed binding")
          if set(candidate["required_evidence_modes"]) != expected_modes:
              raise SystemExit("AC-13 required evidence modes drift")
          if {row["category"] for row in candidate["evidence"]} != expected_modes:
              raise SystemExit("AC-13 evidence categories incomplete")
          if candidate["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("AC-13 candidate is not exact-head bound")
          if candidate["recommended_severity"] != "high":
              raise SystemExit("AC-13 severity must remain high")
          if candidate["recommended_disposition"] != "evidence":
              raise SystemExit("AC-13 disposition must remain evidence")
          for field in (
              "creates_binding",
              "accepts_risk",
              "lowers_severity",
              "promotes_maturity",
          ):
              if candidate[field] is not False:
                  raise SystemExit(f"AC-13 authority boundary drift: {field}")
          print(
              "P1_AC13_BINDING_SEED "
              + json.dumps(
                  {
                      "obligation_id": candidate["obligation_id"],
                      "obligation_digest": candidate["obligation_digest"],
                      "owner_id": candidate["owner_id"],
                      "severity": candidate["recommended_severity"],
                      "disposition": candidate["recommended_disposition"],
                      "evidence": candidate["evidence"],
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

      - name: Confirm governed frontier remains 497 resolved and 16 blocking
        run: |
          set -euo pipefail
          python scripts/reconcile_p1_risk_evidence.py             --evaluated-at "2026-10-01T12:00:00+00:00"             --out .p1-ac13/reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-ac13/reconciliation.json").read_text(encoding="utf-8")
          )
          if report["binding_count"] != 497:
              raise SystemExit("AC-13 verifier mutated binding count")
          if report["resolved_count"] != 497:
              raise SystemExit("AC-13 verifier mutated resolved count")
          if report["unresolved_blocking_count"] != 16:
              raise SystemExit("AC-13 verifier mutated blocking count")
          if report["unclassified_count"] != 0:
              raise SystemExit("AC-13 verifier reintroduced unclassified risks")
          if report["disposition_counts"] != {
              "evidence": 497,
              "unbound": 16,
          }:
              raise SystemExit("AC-13 verifier mutated disposition counts")
          PY
