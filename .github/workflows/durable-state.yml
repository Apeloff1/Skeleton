name: Durable State

on:
  push:
    branches: [main]
    paths:
      - "skeleton/state/**"
      - "skeleton/jeeves/agent/durable_audit.py"
      - "skeleton/jeeves/agent/durable_transition_model.py"
      - "skeleton/jeeves/agent/durable_runtime.py"
      - "skeleton/jeeves/agent/frontier_runtime.py"
      - "skeleton/jeeves/agent/runtime_guard.py"
      - "skeleton/jeeves/agent/audit_assurance.py"
      - "skeleton/testing/test_durable_run_store.py"
      - "skeleton/testing/test_checkpoint_migrations.py"
      - "skeleton/testing/test_jeeves_durable_*.py"
      - ".github/workflows/durable-state.yml"
  pull_request:
    paths:
      - "skeleton/state/**"
      - "skeleton/jeeves/agent/durable_audit.py"
      - "skeleton/jeeves/agent/durable_transition_model.py"
      - "skeleton/jeeves/agent/durable_runtime.py"
      - "skeleton/jeeves/agent/frontier_runtime.py"
      - "skeleton/jeeves/agent/runtime_guard.py"
      - "skeleton/jeeves/agent/audit_assurance.py"
      - "skeleton/testing/test_durable_run_store.py"
      - "skeleton/testing/test_checkpoint_migrations.py"
      - "skeleton/testing/test_jeeves_durable_*.py"
      - ".github/workflows/durable-state.yml"

permissions:
  contents: read

concurrency:
  group: durable-state-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install package and focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"
      - name: Compile durable state and Jeeves recovery packages
        run: >-
          python -m compileall -q
          skeleton/state
          skeleton/jeeves/agent/durable_audit.py
          skeleton/jeeves/agent/durable_transition_model.py
          skeleton/jeeves/agent/durable_runtime.py
          skeleton/jeeves/agent/frontier_runtime.py
          skeleton/jeeves/agent/runtime_guard.py
          skeleton/jeeves/agent/audit_assurance.py
      - name: Run generic durable-state contracts
        env:
          PYTHONPATH: "."
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_durable_run_store.py
          skeleton/testing/test_checkpoint_migrations.py
      - name: Run Jeeves durable audit and model contracts
        env:
          PYTHONPATH: "."
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_jeeves_durable_audit.py
          skeleton/testing/test_jeeves_durable_transition_model.py
      - name: Run Jeeves process-loss recovery contracts
        env:
          PYTHONPATH: "."
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_jeeves_durable_runtime.py
          skeleton/testing/test_jeeves_durable_side_effect_quarantine.py
