      - "docs/runbooks/SPINE_MOTOR_BOOTSTRAP.md"
      - "skeleton/ai/runtime/persistence/spine_bind_*.py"
      - "skeleton/persistence/spine_manifest.py"
      - "skeleton/ai/runtime/persistence/spine_manifest.py"
      - "skeleton/persistence/spine_masterplan.py"
      - "skeleton/ai/runtime/persistence/spine_masterplan.py"
      - "docs/plan/P2_SPINE_MASTERPLAN.md"
      - "docs/runbooks/SPINE_BIND_RECOVERY.md"
      - "skeleton/testing/test_state_backup_bundle.py"
      - "machine/state_backup_policy.json"
      - "backend/services/rag_state_repository.py"
      - "backend/services/rag_service.py"
      - "backend/tests/test_rag_state_authority.py"
      - "skeleton/persistence/operation_store.py"
      - "skeleton/persistence/operation_runtime.py"
      - "skeleton/persistence/execution_repository.py"
      - "skeleton/api/engine_service.py"
      - "skeleton/skills/tool_receipt_store.py"
      - "skeleton/ai/runtime/observability/cost_governor.py"
      - "skeleton/intelligence/admission_runtime.py"
      - "skeleton/intelligence/quota.py"
      - "skeleton/intelligence/quota_sqlite.py"
      - "skeleton/intelligence/shared_pressure.py"
      - "skeleton/testing/test_cost_governor_reattach.py"
      - "skeleton/testing/test_cost_governor_unknown_usage_reattach.py"
      - "skeleton/testing/test_cost_governor_shared_pressure_reattach.py"
      - "skeleton/testing/test_cost_governor_admission_intent_recovery.py"
      - "skeleton/config/settings.py"
      - "machine/state_topology.json"
      - "machine/ai_app_construction.json"
      - "docker-compose.yml"
      - ".github/workflows/state-recovery-drill.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: state-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authoritative-first-recovery:
    name: Authoritative-first recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."

    services:
      mongo:
        image: mongo:7.0.41@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused recovery test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pymongo>=4.13,<5"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"

      - name: Validate canonical state topology
        run: python scripts/check_state_topology.py --json

      - name: Run pure recovery and backup contract tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_state_recovery_drill.py
          skeleton/testing/test_state_backup_bundle.py
          skeleton/testing/test_state_migration_compatibility.py

      - name: Rehearse legacy durable-state migration compatibility
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/state_migration_compatibility.py
          --workdir "${RUNNER_TEMP}/skeleton_state_migration_compatibility"
          --output "${RUNNER_TEMP}/state-migration-compatibility.json"
          --print-evidence

      - name: Assert exact-head state migration receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "state-migration-compatibility.json")
              .read_text(encoding="utf-8")
          )
          assert receipt["schema_version"] == 1
          assert receipt["kind"] == "vol005-state-migration-compatibility"
          assert receipt["head_sha"] == os.environ["EXPECTED_SHA"]
          assert receipt["volume"] == "VOL-005"
          assert receipt["passed"] is True
          assert set(receipt["stores"]) == {"execution", "tool_receipts", "quota"}
          assert receipt["topology"]["closed_gap_references"] == 0
          assert receipt["topology"]["partial_authorities"] == 0
          assert len(receipt["workflow_binding"]["recovery"]["digest"]) == 64
          assert len(receipt["workflow_binding"]["release"]["digest"]) == 64
          assert len(receipt["volume_binding"]["binding_digest"]) == 64
          assert len(receipt["receipt_digest"]) == 64
          print("VOL-005 state migration exact-head receipt OK")
          print(receipt["receipt_digest"])
          PY

      - name: Verify durable AI admission recovery contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_cost_governor_reattach.py
          skeleton/testing/test_cost_governor_unknown_usage_reattach.py
          skeleton/testing/test_cost_governor_shared_pressure_reattach.py
          skeleton/testing/test_cost_governor_admission_intent_recovery.py

      - name: Verify P2 bind recovery checkpoint contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_spine_bind_snapshot.py
          skeleton/testing/test_spine_bind_checkpoint.py
          skeleton/testing/test_spine_bind_bundle.py
          skeleton/testing/test_spine_bind_restore_receipt.py
          skeleton/testing/test_spine_bind_restore_journal.py
          skeleton/testing/test_spine_bind_restore_export.py
          skeleton/testing/test_spine_bind_recovery_control.py
          skeleton/testing/test_spine_manifest.py
          skeleton/testing/test_spine_masterplan.py
          skeleton/testing/test_spine_dispatch_guard.py

      - name: Verify P2 bind hold refusal contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_spine_bind_hold.py
          skeleton/testing/test_spine_bind_hold_verify.py

      - name: Verify P2 bind recovery control
        run: python scripts/check_spine_bind_recovery.py

      - name: Verify P2 poison recovery contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_spine_hold.py
          skeleton/testing/test_spine_reaccept.py
          skeleton/testing/test_spine_gate.py
          skeleton/testing/test_spine_poison_apply.py
          skeleton/testing/test_spine_poison_apply_verify.py
          skeleton/testing/test_spine_poison_chain.py

      - name: Verify P2 projection crash-recovery contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_spine_projection.py
          skeleton/testing/test_mongo_projection.py

      - name: Verify P2 authenticated receipt producer contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_spine_ci_receipt.py
          skeleton/testing/test_spine_pr_automation_receipt.py
          skeleton/testing/test_spine_ci_qualification.py
          skeleton/testing/test_spine_pr_automation_qualification.py

      - name: Verify P2 async Mongo bootstrap contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_spine_motor_bootstrap.py
          skeleton/testing/test_spine_pymongo_async_qualification_verify.py
          skeleton/testing/test_spine_motor_bootstrap_control.py
          skeleton/testing/test_spine_motor_witness.py
          skeleton/testing/test_spine_index_bind.py
          skeleton/testing/test_spine_pymongo_async_adapter.py
          skeleton/testing/test_spine_runtime_selection.py
          skeleton/testing/test_spine_cutover_rehearsal.py
          skeleton/testing/test_spine_cutover_authorization.py
          skeleton/testing/test_spine_cutover_effectiveness.py
          skeleton/testing/test_spine_selection_permit.py
          skeleton/testing/test_spine_selection_consumption.py
          skeleton/testing/test_spine_driver_selection.py
          skeleton/testing/test_spine_runtime_activation_gate.py
          skeleton/testing/test_spine_activation_permit.py
          skeleton/testing/test_spine_activation_consumption.py
          skeleton/testing/test_spine_runtime_activation_commit.py
          skeleton/testing/test_spine_runtime_activation_boundary.py
          skeleton/testing/test_spine_runtime_activation_handoff.py
          skeleton/testing/test_spine_runtime_transition_rehearsal.py
          skeleton/testing/test_spine_runtime_transition_permit.py
          skeleton/testing/test_spine_runtime_transition_consumption.py
          skeleton/testing/test_spine_runtime_transition_attempt.py
          skeleton/testing/test_spine_runtime_transition_rollback.py
          skeleton/testing/test_spine_runtime_transition_execution.py
          skeleton/testing/test_spine_runtime_transition_effect_rollback.py
          skeleton/testing/test_spine_runtime_transition_health.py
          skeleton/testing/test_spine_runtime_transition_acceptance.py
          skeleton/testing/test_spine_runtime_production_activation_authorization.py
          skeleton/testing/test_spine_runtime_production_activation.py
          skeleton/testing/test_spine_provider_surface_qualification.py
          skeleton/testing/test_spine_pr_automation_qualification.py
          skeleton/testing/test_spine_ci_qualification.py
          skeleton/testing/test_spine_provider_live_qualification.py
          skeleton/testing/test_spine_provider_live_script.py
          skeleton/testing/test_spine_cutover.py
          skeleton/testing/test_spine_cut_gate.py

      - name: Verify P2 async Mongo core structural control
        run: python scripts/check_spine_motor_bootstrap.py

      - name: Run P2 live PyMongo Async qualification
        run: >-
          python scripts/qualify_spine_pymongo_async.py
          --uri "mongodb://127.0.0.1:27017"
          --database "skeleton_p2_pymongo_async_qualification"
          --output "${RUNNER_TEMP}/p2-pymongo-async.json"

      - name: Verify P2 live PyMongo Async evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "p2-pymongo-async.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["kind"] == "spine_pymongo_async_live_qualification"
          assert report["qualified"] is True
          assert report["driver_distribution"] == "pymongo"
          assert report["driver_class"] == "AsyncMongoClient"
          assert report["supported_async_driver"] is True
          assert report["deployment_driver_imported"] is True
          assert report["deployment_driver_connected"] is True
          assert report["core_driver_imported"] is False
          assert report["indexes_planned"] == 3
          assert report["indexes_applied"] == 3
          assert report["bootstrap_replay_equivalent"] is True
          assert report["runtime_driver_selected"] is False
          assert report["runtime_activated"] is False
          assert report["live_motor"] is False
          assert len(report["driver_receipt_digest"]) == 64
          assert len(report["preflight_digest"]) == 64
          assert len(report["bootstrap_digest"]) == 64
          assert report["index_names"] == [
              "namespace_1_consumer_id_1_event_id_1",
              "namespace_1_consumer_id_1_operation_id_1",
              "namespace_1_tenant_id_1_resource_id_1",
          ]
          from skeleton.persistence.spine_pymongo_async_qualification_verify import (
              SpinePyMongoAsyncQualificationVerify,
          )
          verified = SpinePyMongoAsyncQualificationVerify().verify(report)
          assert verified["verified"] is True
          assert verified["qualification_digest"] == report["digest"]
          assert verified["bootstrap_digest"] == report["bootstrap_digest"]
          assert len(report["digest"]) == 64
          print("p2-pymongo-async-live-qualification: OK")
          print("driver:", report["driver_version"])
          print("wire:", report["wire_version_min"], report["wire_version_max"])
          print("evidence:", report["digest"])
          PY
      - name: Rehearse P2 cutover from live PyMongo qualification
        run: >-
          python scripts/rehearse_spine_pymongo_cutover.py
          --qualification "${RUNNER_TEMP}/p2-pymongo-async.json"
          --output "${RUNNER_TEMP}/p2-pymongo-cutover-rehearsal.json"

      - name: Verify P2 live cutover rehearsal evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "p2-pymongo-cutover-rehearsal.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["kind"] == "spine_pymongo_async_cutover_rehearsal"
          assert report["candidate_verified"] is True
          assert report["rehearsal_verified"] is True
          assert report["cutover_preconditions_green"] is True
          assert report["switch_refused"] is True
          assert report["switch_reason"] == "switch-not-landed"
          assert report["dispatcher_identity_stable"] is True
          assert report["dispatcher_running"] is False
          assert report["runtime_driver_selected"] is False
          assert report["selection_authorized"] is False
          assert report["runtime_activated"] is False
          assert len(report["qualification_digest"]) == 64
          assert len(report["candidate_digest"]) == 64
          assert len(report["rehearsal_digest"]) == 64
          print("p2-pymongo-async-cutover-rehearsal: OK")
          print("driver:", report["driver_version"])
          print("switch reason:", report["switch_reason"])
          print("rehearsal:", report["rehearsal_digest"])
          PY

      - name: Run live Mongo backup restore and rebuild drill
        run: >-
          python scripts/state_recovery_drill.py live-mongo
          --uri "mongodb://127.0.0.1:27017"
          --source-database "skeleton_recovery_drill_source"
          --restored-database "skeleton_recovery_drill_restored"
          --output "${RUNNER_TEMP}/state-recovery.json"

      - name: Run authoritative operation SQLite backup restore drill
        run: >-
          python scripts/state_recovery_drill.py live-sqlite
          --workdir "${RUNNER_TEMP}/skeleton_recovery_drill_operation_sqlite"
          --output "${RUNNER_TEMP}/operation-sqlite-recovery.json"

      - name: Run full engine SQLite bundle backup restore drill
        run: >-
          python scripts/state_recovery_drill.py live-engine-sqlite
          --workdir "${RUNNER_TEMP}/skeleton_recovery_drill_engine_sqlite"
          --output "${RUNNER_TEMP}/engine-sqlite-recovery.json"

      - name: Run P2 bind checkpoint backup restore drill
        run: >-
          python scripts/state_recovery_drill.py live-spine-bind-sqlite
          --workdir "${RUNNER_TEMP}/skeleton_recovery_drill_spine_bind"
          --output "${RUNNER_TEMP}/spine-bind-recovery.json"

      - name: Verify recovery evidence and ordering
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "state-recovery.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          phases = [
              "seed_authority",
              "backup_authority",
              "destroy_restore_target",
              "restore_authority",
              "verify_authority",
              "rebuild_derived",
              "verify_derived",
              "ready",
          ]
          actual = [event["phase"] for event in report["journal"]["events"]]
          assert report["status"] == "passed"
          assert report["journal"]["verified_authority"] is True
          assert report["journal"]["complete"] is True
          assert actual == phases
          assert actual.index("verify_authority") < actual.index("rebuild_derived")
          assert report["backup_digest"] == report["restore_digest"]
          print("state-recovery-drill: OK")
          print("phases:", " -> ".join(actual))
          print("backup/restore digest:", report["backup_digest"])
          print("derived digest:", report["derived_projection_digest"])
          PY

      - name: Verify operation SQLite recovery evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "operation-sqlite-recovery.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          phases = [
              "seed_operation_authority",
              "backup_operation_authority",
              "destroy_operation_authority",
              "restore_operation_authority",
              "verify_operation_authority",
              "reconcile_operation_outbox",
              "ready",
          ]
          actual = [event["phase"] for event in report["journal"]["events"]]
          assert report["status"] == "passed"
          assert report["backup_digest"] == report["restore_digest"]
          assert report["journal"]["complete"] is True
          assert actual == phases
          evidence = report["journal"]["events"][4]["evidence"]
          assert evidence["state"] == "admitted"
          assert evidence["version"] == 4
          reconciliation = report["journal"]["events"][5]["evidence"]
          assert reconciliation["remaining"] == 0
          assert reconciliation["published"] == 4
          print("operation-sqlite-recovery: OK")
          print("phases:", " -> ".join(actual))
          print("backup/restore digest:", report["backup_digest"])
          PY

      - name: Verify engine SQLite bundle recovery evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "engine-sqlite-recovery.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["status"] == "passed"
          assert report["bundle_digest"] == report["restored_bundle_digest"]
          assert set(report["stores"]) == {
              "execution",
              "pressure",
              "quota",
              "submissions",
              "tool_receipts",
          }
          for store in report["stores"].values():
              assert store["backup_digest"] == store["restore_digest"]
          verified = report["verified"]
          assert verified["execution_state"] == "routing"
          assert verified["checkpoint_version"] == 1
          assert verified["approval_ref"].startswith("approval:")
          assert len(verified["approval_ref"]) == len("approval:") + 64
          assert verified["tool_reservation_status"] == "in_doubt"
          assert verified["quota_committed_input_tokens"] == 90
          assert verified["pressure_active"] == 1
          assert verified["pressure_queued"] == 1
          print("engine-sqlite-bundle-recovery: OK")
          print("bundle digest:", report["bundle_digest"])
          PY

      - name: Verify P2 bind checkpoint restore evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "spine-bind-recovery.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["status"] == "passed"
          assert report["policy"] == "spine-bind-checkpoint-dark-restore"
          assert report["backup_digest"] == report["restore_digest"]
          assert report["checkpoint"]["rows"] == 1
          assert report["replay"]["rows_before"] == 1
          assert report["replay"]["rows_after"] == 1
          assert report["replay"]["inserted"] is False
          assert report["replay"]["rewritten"] is False
          assert report["tenant"]["own_count"] == 1
          assert report["tenant"]["foreign_count"] == 0
          assert report["chain"]["rows"] == 1
          assert report["chain"]["rewritten"] is False
          assert report["bundle"]["verified"] is True
          assert report["bundle"]["activated"] is False
          assert len(report["restore_receipt"]["digest"]) == 64
          assert report["restore_receipt"]["backup_restore_digest"] == report["backup_digest"]
          assert report["restore_receipt"]["recovery_digest"] == report["checkpoint"]["recovery_digest"]
          assert report["restore_receipt"]["verified"] is True
          assert report["restore_receipt"]["activated"] is False
          journal = report["restore_journal"]
          assert journal["backup_digest"] == journal["restore_digest"]
          assert journal["receipt_digest"] == report["restore_receipt"]["digest"]
          assert journal["rows"] == 1
          assert journal["foreign_rows"] == 0
          assert journal["replay_rows_before"] == 1
          assert journal["replay_rows_after"] == 1
          assert journal["replay_inserted"] is False
          assert journal["chain_rows"] == 1
          assert len(journal["chain_digest"]) == 64
          assert len(journal["continuity_digest"]) == 64
          assert journal["durable"] is True
          assert journal["tenant_isolated"] is True
          assert journal["replay_safe"] is True
          assert journal["activated"] is False
          portable = report["portable_evidence"]
          assert len(portable["digest"]) == 64
          assert portable["bytes"] > 0
          assert portable["verified"] is True
          assert portable["roundtrip_exact"] is True
          assert portable["activated"] is False
          assert report["activation_claimed"] is False
          assert report["apply_landed"] is False
          assert report["live_motor"] is False
          assert report["dispatcher_running"] is False
          assert report["ci_green"] is False
          assert report["merged"] is False
          print("spine-bind-checkpoint-recovery: OK")
          print("backup/restore digest:", report["backup_digest"])
          print("bundle digest:", report["bundle"]["digest"])
          print("restore receipt digest:", report["restore_receipt"]["digest"])
          print("restore journal chain:", report["restore_journal"]["chain_digest"])
          print("restore continuity:", report["restore_journal"]["continuity_digest"])
          print("portable evidence:", report["portable_evidence"]["digest"])
          PY

  independent-state-authority:
    name: Independent state authority verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install independent verifier test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Run independent state authority verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_state_authority_independent_verifier.py

      - name: Verify exact-head state authority and emit receipt
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_state_authority_closure.py
          --evidence-out .state-authority-evidence.json
          --print-evidence

      - name: Assert exact-head state authority receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".state-authority-evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          assert receipt["schema_version"] == 1
          assert receipt["verifier"] == "independent-state-authority-v2"
          assert receipt["volume"] == "VOL-005"
          assert receipt["head_sha"] == os.environ["EXPECTED_SHA"]
          assert receipt["valid"] is True
          assert receipt["errors"] == []
          assert len(receipt["authority_digest"]) == 64
          assert len(receipt["authoritative_domains"]) >= 12
          assert len(receipt["derived_domains"]) == 3
          assert len(receipt["backup_stores"]) == 8
          assert len(receipt["volume_binding"]["binding_digest"]) == 64
          assert len(receipt["receipt_digest"]) == 64
          print("independent-state-authority: exact-head VOL-005 receipt OK")
          print("authority digest:", receipt["authority_digest"])
          print("volume binding:", receipt["volume_binding"]["binding_digest"])
          print("receipt digest:", receipt["receipt_digest"])
          PY
