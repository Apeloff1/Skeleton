name: AI Evidence Runtime Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/ai/learning/audit_chain.py"
      - "skeleton/learning/audit_chain.py"
      - "skeleton/ai/learning/evidence.py"
      - "skeleton/learning/evidence.py"
      - "skeleton/ai/learning/__init__.py"
      - "skeleton/learning/__init__.py"
      - "skeleton/ai/learning/school/decision_ledger.py"
      - "skeleton/learning/school/decision_ledger.py"
      - "skeleton/ai/learning/school/session_audit.py"
      - "skeleton/learning/school/session_audit.py"
      - "skeleton/school/decision_ledger.py"
      - "skeleton/ai/learning/school/runtime_replay.py"
      - "skeleton/learning/school/runtime_replay.py"
      - "skeleton/school/runtime_replay.py"
      - "skeleton/ai/learning/school/runtime_capsule.py"
      - "skeleton/learning/school/runtime_capsule.py"
      - "skeleton/school/runtime_capsule.py"
      - "skeleton/ai/learning/school/runtime_attestation.py"
      - "skeleton/learning/school/runtime_attestation.py"
      - "skeleton/school/runtime_attestation.py"
      - "skeleton/testing/test_learning_audit_chain.py"
      - "skeleton/testing/test_learning_evidence.py"
      - "tests/test_runtime_replay.py"
      - "tests/test_runtime_replay_terminal_contract.py"
      - "tests/test_runtime_capsule.py"
      - "tests/test_runtime_attestation.py"
      - "tests/test_session_audit.py"
      - "tests/test_session_audit_supersession.py"
      - "tests/test_ai_evidence_runtime_attestation_integrity.py"
      - ".github/workflows/ai-evidence-runtime-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/ai/learning/audit_chain.py"
      - "skeleton/learning/audit_chain.py"
      - "skeleton/ai/learning/evidence.py"
      - "skeleton/learning/evidence.py"
      - "skeleton/ai/learning/__init__.py"
      - "skeleton/learning/__init__.py"
      - "skeleton/ai/learning/school/decision_ledger.py"
      - "skeleton/learning/school/decision_ledger.py"
      - "skeleton/school/decision_ledger.py"
      - "skeleton/ai/learning/school/runtime_replay.py"
      - "skeleton/learning/school/runtime_replay.py"
      - "skeleton/school/runtime_replay.py"
      - "skeleton/ai/learning/school/runtime_capsule.py"
      - "skeleton/learning/school/runtime_capsule.py"
      - "skeleton/school/runtime_capsule.py"
      - "skeleton/ai/learning/school/runtime_attestation.py"
      - "skeleton/learning/school/runtime_attestation.py"
      - "skeleton/school/runtime_attestation.py"
      - "skeleton/testing/test_learning_audit_chain.py"
      - "skeleton/testing/test_learning_evidence.py"
      - "tests/test_runtime_replay.py"
      - "tests/test_runtime_replay_terminal_contract.py"
      - "tests/test_runtime_capsule.py"
      - "tests/test_runtime_attestation.py"
      - "tests/test_session_audit.py"
      - "tests/test_session_audit_supersession.py"
      - "tests/test_ai_evidence_runtime_attestation_integrity.py"
      - ".github/workflows/ai-evidence-runtime-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-evidence-runtime-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-runtime-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          "pytest>=8,<9"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"

      - name: Verify exact head and full PR diff
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          BASE="$(git merge-base HEAD origin/main)"
          test -n "$BASE"
          git diff --check "$BASE" HEAD

      - name: Compile evidence and runtime integrity surfaces
        run: >-
          python -m py_compile
          skeleton/ai/learning/audit_chain.py
          skeleton/learning/audit_chain.py
          skeleton/ai/learning/evidence.py
          skeleton/learning/evidence.py
          skeleton/ai/learning/school/decision_ledger.py
          skeleton/learning/school/decision_ledger.py
          skeleton/school/decision_ledger.py
          skeleton/ai/learning/school/session_audit.py
          skeleton/learning/school/session_audit.py
          skeleton/ai/learning/school/runtime_replay.py
          skeleton/learning/school/runtime_replay.py
          skeleton/school/runtime_replay.py
          skeleton/ai/learning/school/runtime_capsule.py
          skeleton/learning/school/runtime_capsule.py
          skeleton/school/runtime_capsule.py
          skeleton/ai/learning/school/runtime_attestation.py
          skeleton/learning/school/runtime_attestation.py
          skeleton/school/runtime_attestation.py
          tests/test_ai_evidence_runtime_attestation_integrity.py

      - name: Verify canonical AI namespace parity
        run: |
          python - <<'PY'
          from pathlib import Path

          exact_pairs = (
              ("skeleton/ai/learning/audit_chain.py", "skeleton/learning/audit_chain.py"),
              ("skeleton/ai/learning/evidence.py", "skeleton/learning/evidence.py"),
          )
          for canonical, compatibility in exact_pairs:
              left = Path(canonical).read_bytes()
              right = Path(compatibility).read_bytes()
              assert left == right, f"namespace drift: {canonical} != {compatibility}"
              print("exact namespace parity", canonical, len(left), "bytes")

          implementation_pairs = (
              (
                  "skeleton/ai/learning/school/decision_ledger.py",
                  "skeleton/learning/school/decision_ledger.py",
              ),
              (
                  "skeleton/ai/learning/school/session_audit.py",
                  "skeleton/learning/school/session_audit.py",
              ),
              (
                  "skeleton/ai/learning/school/runtime_replay.py",
                  "skeleton/learning/school/runtime_replay.py",
              ),
              (
                  "skeleton/ai/learning/school/runtime_capsule.py",
                  "skeleton/learning/school/runtime_capsule.py",
              ),
              (
                  "skeleton/ai/learning/school/runtime_attestation.py",
                  "skeleton/learning/school/runtime_attestation.py",
              ),
          )
          for canonical, compatibility in implementation_pairs:
              left = Path(canonical).read_bytes()
              right = Path(compatibility).read_bytes()
              assert left == right, f"namespace drift: {canonical} != {compatibility}"
              print("implementation namespace parity", canonical)

          shims = {
              "skeleton/school/decision_ledger.py":
                  "from skeleton.learning.school.decision_ledger import *",
              "skeleton/school/runtime_replay.py":
                  "from skeleton.learning.school.runtime_replay import *",
              "skeleton/school/runtime_capsule.py":
                  "from skeleton.learning.school.runtime_capsule import *",
              "skeleton/school/runtime_attestation.py":
                  "from skeleton.learning.school.runtime_attestation import *",
          }
          for path, expected_import in shims.items():
              text = Path(path).read_text()
              assert expected_import in text, f"compatibility shim drift: {path}"
              assert text.count("\n") <= 4, f"compatibility shim grew implementation: {path}"
              print("compatibility shim verified", path)
          PY

      - name: Run existing and adversarial evidence-runtime regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_learning_audit_chain.py
          skeleton/testing/test_learning_evidence.py
          tests/test_runtime_replay.py
          tests/test_runtime_replay_terminal_contract.py
          tests/test_runtime_capsule.py
          tests/test_session_audit.py
          tests/test_session_audit_supersession.py
          tests/test_ai_evidence_runtime_attestation_integrity.py

      - name: Assert fail-closed identity boundaries
        run: |
          python - <<'PY'
          from skeleton.ai.learning.evidence import (
              LearningEvidenceError,
              canonical_fingerprint,
          )
          from skeleton.learning.school.decision_ledger import (
              DecisionLedger,
          )

          try:
              canonical_fingerprint({"x": object()})
          except LearningEvidenceError:
              pass
          else:
              raise SystemExit("unsupported runtime object was fingerprinted")

          ledger = DecisionLedger()
          try:
              ledger.append(
                  session_id="s",
                  decision_id="d",
                  domain="runtime",
                  action="x",
                  state={"score": float("nan")},
              )
          except ValueError:
              pass
          else:
              raise SystemExit("non-finite decision state was hashed")

          print("critical evidence/runtime fail-closed boundaries passed")
          PY
