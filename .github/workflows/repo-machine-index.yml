name: Repository machine index

on:
  push:
    branches: [main]
    paths-ignore:
      - ".machine/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: repo-machine-index-main
  cancel-in-progress: true

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Build machine index
        run: |
          python -m pip install .
          mkdir -p .machine
          skeleton-repo-machine --root . --output .machine/repository-machine.json --build-code-search .machine/code-search-index.json
          python - <<'PY'
          from skeleton.repo_machine.code_search import load_code_search_index
          from skeleton.repo_machine.manifest import load_manifest, validate_manifest
          manifest = load_manifest(".machine/repository-machine.json")
          validate_manifest(manifest)
          code_index = load_code_search_index(
              ".machine/code-search-index.json",
              expected_fingerprint=manifest["fingerprint"],
          )
          files = manifest["state"]["files"]
          summary = code_index.summary()
          print(f"Machine index contains {len(files)} files.")
          print(f"Code search contains {summary[\"documents\"]} documents, {summary[\"terms\"]} terms, {summary[\"postings\"]} postings.")
          PY

      - name: Commit changed index
        run: |
          if git diff --quiet -- .machine/repository-machine.json .machine/code-search-index.json; then
            echo "Machine index is current."
            exit 0
          fi
          git config user.name "skeleton-machine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .machine/repository-machine.json .machine/code-search-index.json
          git commit -m "chore(machine): refresh repository and code-search indexes"
          git push
