name: Repository machine index

on:
  push:
    branches: [main]
    paths-ignore:
      - ".machine/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: repo-machine-index-main
  cancel-in-progress: true

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build machine index
        run: |
          python -m pip install --no-deps .
          mkdir -p .machine
          skeleton-repo-machine --root . --output .machine/repository-machine.json
          python - <<'PY'
          from skeleton.repo_machine.manifest import load_manifest, validate_manifest
          manifest = load_manifest(".machine/repository-machine.json")
          validate_manifest(manifest)
          files = manifest["state"]["files"]
          print(f"Machine index contains {len(files)} files.")
          PY

      - name: Commit changed index
        run: |
          if git diff --quiet -- .machine/repository-machine.json; then
            echo "Machine index is current."
            exit 0
          fi
          git config user.name "skeleton-machine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .machine/repository-machine.json
          git commit -m "chore(machine): refresh repository index"
          git push
