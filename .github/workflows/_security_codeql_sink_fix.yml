name: Security CodeQL sink fix
on:
  push:
    branches:
      - security/code-scan-fixes-2026-09-15
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/security/code-scan-fixes-2026-09-15'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/code-scan-fixes-2026-09-15
      - name: Apply CodeQL sink hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bv = Path("backend/core/build_vault.py")
          text = bv.read_text()
          old = '''    root = os.path.realpath(os.fspath(BUILDS_ROOT))\n    candidate = os.path.realpath(os.path.normpath(os.path.join(root, build_id)))\n'''
          new = '''    root = os.path.realpath(os.fspath(BUILDS_ROOT))\n    safe_id = os.path.basename(build_id)\n    if safe_id != build_id or not safe_id:\n        raise ValueError("build_id must be a single path component")\n    candidate = os.path.realpath(os.path.normpath(os.path.join(root, safe_id)))\n'''
          if old not in text:
              raise SystemExit("build_vault target not found")
          bv.write_text(text.replace(old, new, 1))

          ai = Path("backend/routes/apk_inspector.py")
          text = ai.read_text()
          old = '''    safe_id = _validate_build_id(build_id)\n    root = os.path.realpath(os.fspath(binary_builder.ARTIFACTS_ROOT))\n    candidate = os.path.realpath(os.path.normpath(os.path.join(root, f"{safe_id}.{kind}")))\n'''
          new = '''    requested = str(build_id)\n    safe_id = os.path.basename(requested)\n    if safe_id != requested or not safe_id:\n        raise HTTPException(400, "invalid build_id")\n    safe_id = _validate_build_id(safe_id)\n    root = os.path.realpath(os.fspath(binary_builder.ARTIFACTS_ROOT))\n    candidate = os.path.realpath(os.path.normpath(os.path.join(root, f"{safe_id}.{kind}")))\n'''
          if old not in text:
              raise SystemExit("apk_inspector artifact target not found")
          text = text.replace(old, new, 1)

          old = '''    root = os.path.realpath(os.fspath(binary_builder.ARTIFACTS_ROOT))\n    requested = os.fspath(apk_path)\n    candidate = requested if os.path.isabs(requested) else os.path.join(root, requested)\n    normalized = os.path.realpath(os.path.normpath(candidate))\n'''
          new = '''    root = os.path.realpath(os.fspath(binary_builder.ARTIFACTS_ROOT))\n    requested_name = os.path.basename(os.fspath(apk_path))\n    if not requested_name or requested_name in {".", ".."} or not requested_name.endswith(".apk"):\n        raise ValueError("invalid APK path")\n    candidate = os.path.join(root, requested_name)\n    normalized = os.path.realpath(os.path.normpath(candidate))\n'''
          if old not in text:
              raise SystemExit("apk_inspector confinement target not found")
          ai.write_text(text.replace(old, new, 1))
          PY
      - name: Validate and commit
        run: |
          python3 -m compileall -q backend/core/build_vault.py backend/routes/apk_inspector.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/core/build_vault.py backend/routes/apk_inspector.py .github/workflows/_security_codeql_sink_fix.yml
          git commit -m "security: make CodeQL path sanitization explicit"
          git push origin HEAD:security/code-scan-fixes-2026-09-15
