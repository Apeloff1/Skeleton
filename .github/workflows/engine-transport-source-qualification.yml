name: Canonical engine transport source qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/core/engine_client.py"
      - "backend/tests/test_engine_client.py"
      - "backend/tests/test_engine_transport_origin_custody.py"
      - ".github/workflows/engine-transport-source-qualification.yml"

permissions:
  contents: read

concurrency:
  group: engine-transport-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  engine_transport_source:
    name: Offline engine origin, authority and transport contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use supported Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install source-only test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
          "httpx>=0.28.1,<1" "pydantic>=2.14.1,<3"
          "fastapi>=0.142.2,<1" "pydantic-settings>=2.15,<3"
          "PyYAML>=6,<7" "cryptography>=50.0.2"
          "numpy>=2,<3" "motor==3.7.1" "pymongo==4.19.0"
          "Pillow>=13,<14" "regex>=2026.9.29,<2027"
      - name: Compile engine authority and focused tests
        run: >-
          python -m compileall -q
          backend/core/engine_client.py
          backend/tests/test_engine_client.py
          backend/tests/test_engine_transport_origin_custody.py
      - name: Verify exact HTTPX credential and canonical engine source contracts
        env:
          PYTHONPATH: "backend:."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          # These tests use their own mock HTTPX transport. Loading the
          # repository-wide conftest would import the entire backend server
          # and turn a transport-only gate into a full application bootstrap.
          # Autoload is off: explicitly enable only the async test plugin.
          python -m pytest -q --maxfail=1 --noconftest -p pytest_asyncio.plugin \
            backend/tests/test_engine_transport_origin_custody.py \
            backend/tests/test_engine_client.py
      - name: Refuse device and release certification from source-only tests
        run: |
          python -c 'from pathlib import Path; source=Path("backend/core/engine_client.py").read_text(); assert "device_qualified" not in source.split("class EngineClientConfig",1)[0]'
