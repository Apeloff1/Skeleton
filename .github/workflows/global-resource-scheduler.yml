name: Global Resource Scheduler

on:
  pull_request:
    branches:
      - main
    paths:
      - "machine/global_resource_scheduler_contract.json"
      - "scripts/verify_global_resource_scheduler_contract.py"
      - "skeleton/kernel/global_resource_scheduler.py"
      - "skeleton/ai/runtime/kernel/global_resource_scheduler.py"
      - "skeleton/automation/agents/scheduler.py"
      - "skeleton/ai/agents/core/scheduler.py"
      - "skeleton/testing/test_global_resource_scheduler.py"
      - "skeleton/testing/test_global_resource_swarm_integration.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/global-resource-scheduler.yml"
  push:
    branches:
      - main
    paths:
      - "machine/global_resource_scheduler_contract.json"
      - "scripts/verify_global_resource_scheduler_contract.py"
      - "skeleton/kernel/global_resource_scheduler.py"
      - "skeleton/ai/runtime/kernel/global_resource_scheduler.py"
      - "skeleton/automation/agents/scheduler.py"
      - "skeleton/ai/agents/core/scheduler.py"
      - "skeleton/testing/test_global_resource_scheduler.py"
      - "skeleton/testing/test_global_resource_swarm_integration.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/global-resource-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-resource-scheduler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  global-resource-scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "pydantic>=2,<3" "pydantic-settings>=2,<3"
      - name: Compile global scheduler surfaces
        run: >-
          python -m compileall -q
          skeleton/kernel/global_resource_scheduler.py
          skeleton/ai/runtime/kernel/global_resource_scheduler.py
          skeleton/automation/agents/scheduler.py
          skeleton/ai/agents/core/scheduler.py
          scripts/verify_global_resource_scheduler_contract.py
          skeleton/testing/test_global_resource_scheduler.py
          skeleton/testing/test_global_resource_swarm_integration.py
      - name: Verify G021 contract
        run: python scripts/verify_global_resource_scheduler_contract.py --json
      - name: Run global scheduler regressions
        run: >-
          python -m pytest -q
          skeleton/testing/test_global_resource_scheduler.py
          skeleton/testing/test_global_resource_swarm_integration.py
          tests/test_scheduler.py
      - name: Verify governed AI file-tree parity
        run: python scripts/check_ai_file_tree.py
      - name: Verify hostile-gap disposition
        run: python scripts/verify_ai_hostile_gap_disposition.py
