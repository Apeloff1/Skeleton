name: Original Chunked World Timeline and Fork
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/game_builder/advanced_chunked_world_timeline.py"
      - "skeleton/ai/game_builder/advanced_chunked_npc_world.py"
      - "skeleton/ai/game_builder/system_editor_cli.py"
      - "skeleton/ai/game_builder/game_workspace_server.py"
      - "skeleton/ai/game_builder/game_workspace_ui.py"
      - "tests/test_game_builder_chunked_world_timeline.py"
      - ".github/workflows/game-builder-chunked-world-timeline.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-streamed-world-timeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-bound-timeline:
    name: Genuine streamed savegame and replayed branches (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 18
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: "."
      PR_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out exact source head without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_chunked_world_timeline.py
      - name: Configure Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Verify exact source and compile original game checkpoint code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          python -m py_compile \
            skeleton/ai/game_builder/advanced_chunked_world_timeline.py \
            skeleton/ai/game_builder/advanced_chunked_npc_world.py \
            skeleton/ai/game_builder/system_editor_cli.py \
            skeleton/ai/game_builder/game_workspace_server.py \
            skeleton/ai/game_builder/game_workspace_ui.py \
            tests/test_game_builder_chunked_world_timeline.py
      - name: Adversarial streaming checkpoint and alternate-history replay
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_game_builder_chunked_world_timeline -v
      - name: Four seeded original continuity branches on each source platform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from skeleton.ai.game_builder.advanced_chunked_npc_world import (
              run_chunked_npc_world, verify_chunked_npc_world,
          )
          from skeleton.ai.game_builder.advanced_chunked_world_timeline import (
              make_chunked_bookmarks, verify_chunked_bookmarks,
              continue_chunked_world, verify_chunked_continuation,
          )
          for seed in (0,1,5,9):
              original=run_chunked_npc_world(
                  ["wait"]*8,seed=seed,
                  options={"chunks_per_side":5,"citizens":32,
                           "active_limit":6,"chunk_radius":0})
              checkpoint=make_chunked_bookmarks(original,interval=8)
              assert verify_chunked_bookmarks(checkpoint)
              for suffix in (["wait"],["move:west","move:east"]):
                  branch=continue_chunked_world(checkpoint,suffix,cursor=8)
                  assert verify_chunked_continuation(branch)
                  assert verify_chunked_npc_world(branch["result"])
                  assert branch["result"]["seed"]==seed
                  assert not branch["ai_model_weights_promoted"]
                  print("SOURCE_CHUNKED_TIMELINE_OK",
                        seed,len(suffix),branch["result_world_digest"])
          PY
