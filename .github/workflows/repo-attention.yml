name: Repository Attention

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  issues:
    types: [edited, reopened, assigned, unassigned, milestoned, demilestoned]
  issue_comment:
    types: [created]
  pull_request:
    types:
      - synchronize
      - edited
      - reopened
      - ready_for_review
      - converted_to_draft
      - assigned
      - unassigned
      - milestoned
      - demilestoned
      - review_requested
      - review_request_removed

concurrency:
  group: repository-attention-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

# Fail closed at workflow scope. Jobs receive only the permissions they need.
permissions: {}

jobs:
  sweep:
    name: Flag quiet work without closing it
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_QUIET_DAYS: '14'
      DRAFT_QUIET_DAYS: '21'
      ISSUE_QUIET_DAYS: '30'
    steps:
      - name: Ensure managed attention labels exist
        shell: bash
        run: |
          set -euo pipefail
          gh label create 'needs-attention' --repo "$REPO" --color 'fbca04' --description 'Quiet item that may need a human decision' --force >/dev/null
          gh label create 'stale-draft' --repo "$REPO" --color 'd4c5f9' --description 'Draft pull request quiet for an extended period' --force >/dev/null

      - name: Sweep pull requests
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          attention_cutoff=$((now - PR_QUIET_DAYS * 86400))
          draft_cutoff=$((now - DRAFT_QUIET_DAYS * 86400))
          added_attention=0
          added_draft=0
          while IFS=$'\t' read -r number updated draft labels_csv; do
            [[ -n "${number:-}" ]] || continue
            updated_epoch=$(date -u -d "$updated" +%s)
            has_attention=false
            has_draft=false
            tr ',' '\n' <<<"$labels_csv" | grep -Fxq 'needs-attention' && has_attention=true || true
            tr ',' '\n' <<<"$labels_csv" | grep -Fxq 'stale-draft' && has_draft=true || true
            if [[ "$draft" == 'true' ]]; then
              if (( updated_epoch < draft_cutoff )) && [[ "$has_draft" == 'false' ]]; then
                gh api --method POST "/repos/${REPO}/issues/${number}/labels" -f 'labels[]=stale-draft' >/dev/null
                added_draft=$((added_draft + 1))
              fi
            elif (( updated_epoch < attention_cutoff )) && [[ "$has_attention" == 'false' ]]; then
              gh api --method POST "/repos/${REPO}/issues/${number}/labels" -f 'labels[]=needs-attention' >/dev/null
              added_attention=$((added_attention + 1))
            fi
          done < <(gh api --paginate "/repos/${REPO}/pulls?state=open&per_page=100" --jq '.[] | [.number, .updated_at, .draft, ([.labels[].name] | join(","))] | @tsv')
          {
            echo '## Pull-request attention sweep'
            echo "- Added needs-attention: $added_attention"
            echo "- Added stale-draft: $added_draft"
            echo "- Regular PR quiet threshold: ${PR_QUIET_DAYS} days"
            echo "- Draft PR quiet threshold: ${DRAFT_QUIET_DAYS} days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sweep issues
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          cutoff=$((now - ISSUE_QUIET_DAYS * 86400))
          added=0
          while IFS=$'\t' read -r number updated labels_csv; do
            [[ -n "${number:-}" ]] || continue
            updated_epoch=$(date -u -d "$updated" +%s)
            has_attention=false
            tr ',' '\n' <<<"$labels_csv" | grep -Fxq 'needs-attention' && has_attention=true || true
            if (( updated_epoch < cutoff )) && [[ "$has_attention" == 'false' ]]; then
              gh api --method POST "/repos/${REPO}/issues/${number}/labels" -f 'labels[]=needs-attention' >/dev/null
              added=$((added + 1))
            fi
          done < <(gh api --paginate "/repos/${REPO}/issues?state=open&per_page=100" --jq '.[] | select(.pull_request | not) | [.number, .updated_at, ([.labels[].name] | join(","))] | @tsv')
          {
            echo '## Issue attention sweep'
            echo "- Added needs-attention: $added"
            echo "- Issue quiet threshold: ${ISSUE_QUIET_DAYS} days"
            echo '- This workflow never auto-closes issues or pull requests.'
          } >> "$GITHUB_STEP_SUMMARY"

  clear-pr-attention:
    name: Clear attention after PR activity
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    # SECURITY: ordinary pull_request plus a same-repository guard keeps label
    # mutation write access away from untrusted fork pull requests. This job
    # never checks out, sources, or executes pull-request head content.
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Clear managed attention labels
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/${REPO}/issues/${NUMBER}/labels/needs-attention" >/dev/null 2>&1 || true
          gh api --method DELETE "/repos/${REPO}/issues/${NUMBER}/labels/stale-draft" >/dev/null 2>&1 || true

  clear-issue-attention:
    name: Clear attention after issue activity
    if: github.event_name == 'issues' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Clear managed attention label
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/${REPO}/issues/${NUMBER}/labels/needs-attention" >/dev/null 2>&1 || true

  clear-comment-attention:
    name: Clear attention after trusted human discussion
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.sender.type != 'Bot' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Clear needs-attention
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/${REPO}/issues/${NUMBER}/labels/needs-attention" >/dev/null 2>&1 || true

      - name: Clear stale-draft for pull-request discussion
        if: github.event.issue.pull_request != null
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/${REPO}/issues/${NUMBER}/labels/stale-draft" >/dev/null 2>&1 || true
