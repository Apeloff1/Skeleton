name: Artifact Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
    paths-ignore:
      - '.github/workflows/branch-clean.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 0'

concurrency:
  group: artifact-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Artifact placement and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Compile policy gate
        run: python -m compileall -q scripts/check_artifact_policy.py tests/test_artifact_policy.py
      - name: Run policy regressions
        run: python -m unittest discover -s tests -p 'test_artifact_policy.py' -q
      - name: Enforce artifact policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ARTIFACT_BASE:-}" ]]; then
            python scripts/check_artifact_policy.py --base "$ARTIFACT_BASE"
          else
            python scripts/check_artifact_policy.py --all
          fi

  actions-housekeeping:
    name: Clear caches and prune stale Actions data
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[actions-housekeeping]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RETENTION_DAYS: '7'
      MAX_RUN_DELETES: '1000'
    steps:
      - name: Purge all Actions caches
        shell: bash
        run: |
          set -euo pipefail
          cache_file="$RUNNER_TEMP/actions-cache-ids.txt"
          : > "$cache_file"
          gh api --paginate "/repos/${REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[].id' > "$cache_file"

          deleted=0
          failed=0
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            if gh api --method DELETE "/repos/${REPO}/actions/caches/${id}" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < "$cache_file"

          echo "CACHE_DELETED=$deleted" >> "$GITHUB_ENV"
          echo "CACHE_DELETE_FAILED=$failed" >> "$GITHUB_ENV"
          echo "Purged ${deleted} Actions caches (${failed} failed deletions)." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete stale workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${RETENTION_DAYS} days ago" +%s)
          artifact_file="$RUNNER_TEMP/actions-artifacts.tsv"
          : > "$artifact_file"
          gh api --paginate "/repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .created_at, .expired] | @tsv' > "$artifact_file"

          deleted=0
          failed=0
          kept=0
          while IFS=$'\t' read -r id created_at expired; do
            [[ -n "$id" && -n "$created_at" ]] || continue
            created_epoch=$(date -u -d "$created_at" +%s)
            if [[ "$expired" == "true" || "$created_epoch" -lt "$cutoff" ]]; then
              if gh api --method DELETE "/repos/${REPO}/actions/artifacts/${id}" >/dev/null 2>&1; then
                deleted=$((deleted + 1))
              else
                failed=$((failed + 1))
              fi
            else
              kept=$((kept + 1))
            fi
          done < "$artifact_file"

          echo "ARTIFACT_DELETED=$deleted" >> "$GITHUB_ENV"
          echo "ARTIFACT_DELETE_FAILED=$failed" >> "$GITHUB_ENV"
          echo "Deleted ${deleted} stale/expired artifacts; kept ${kept} recent artifacts (${failed} failed deletions)." >> "$GITHUB_STEP_SUMMARY"

      - name: Prune stale failed workflow runs
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${RETENTION_DAYS} days ago" +%s)
          run_file="$RUNNER_TEMP/stale-runs.tsv"
          : > "$run_file"

          for status in failure cancelled timed_out action_required stale; do
            gh api --paginate "/repos/${REPO}/actions/runs?status=${status}&per_page=100" \
              --jq '.workflow_runs[] | [.id, .created_at, .conclusion, .name] | @tsv' >> "$run_file"
          done

          sort -u -o "$run_file" "$run_file"
          deleted=0
          failed=0
          kept=0
          while IFS=$'\t' read -r id created_at conclusion name; do
            [[ -n "$id" && -n "$created_at" ]] || continue
            [[ "$id" != "$GITHUB_RUN_ID" ]] || continue
            created_epoch=$(date -u -d "$created_at" +%s)
            if [[ "$created_epoch" -ge "$cutoff" ]]; then
              kept=$((kept + 1))
              continue
            fi
            if [[ "$deleted" -ge "$MAX_RUN_DELETES" ]]; then
              kept=$((kept + 1))
              continue
            fi
            if gh api --method DELETE "/repos/${REPO}/actions/runs/${id}" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < "$run_file"

          {
            echo "Deleted ${deleted} failed/cancelled/timed-out/stale runs older than ${RETENTION_DAYS} days."
            echo "Preserved ${kept} recent or over-cap runs; ${failed} deletions failed."
            echo "Per-sweep safety cap: ${MAX_RUN_DELETES} run deletions."
          } >> "$GITHUB_STEP_SUMMARY"
