name: Artifact Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
    paths-ignore:
      - '.github/workflows/branch-clean.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 0'

concurrency:
  group: artifact-policy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Artifact placement and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fast diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          base="${ARTIFACT_BASE:-}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then base=$(git rev-parse HEAD^); else base=''; fi
          fi
          if [[ -n "$base" ]]; then
            git diff --check "${base}...HEAD"
            if git diff --unified=0 --no-color "${base}...HEAD" -- | grep -E '^\+(<<<<<<<|>>>>>>>)( |$)' >/dev/null; then
              echo 'Committed merge-conflict marker found in changed lines.' >&2
              exit 1
            fi
          else
            git diff --check
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Compile policy gate
        run: python -m compileall -q scripts/check_artifact_policy.py tests/test_artifact_policy.py
      - name: Run policy regressions
        run: python -m unittest discover -s tests -p 'test_artifact_policy.py' -q
      - name: Enforce artifact policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ARTIFACT_BASE:-}" ]]; then
            python scripts/check_artifact_policy.py --base "$ARTIFACT_BASE"
          else
            python scripts/check_artifact_policy.py --all
          fi
