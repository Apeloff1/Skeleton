name: Artifact Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  push:
    branches: [main, develop]
    paths-ignore:
      - '.github/workflows/branch-clean.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 0'

concurrency:
  # PR runs stay per-PR. Main/scheduled/manual runs are full-repository scans,
  # so the newest ref-scoped run safely supersedes older main generations.
  group: artifact-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: Artifact placement and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # PR validation remains incremental. Push/schedule/manual validation is
      # deliberately full-repository so ref-level concurrency can coalesce
      # superseded main runs without skipping artifact-policy evidence.
      ARTIFACT_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Compile policy gate
        run: python -m compileall -q scripts/check_artifact_policy.py tests/test_artifact_policy.py
      - name: Run policy regressions
        run: python -m unittest discover -s tests -p 'test_artifact_policy.py' -q
      - name: Enforce artifact policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ARTIFACT_BASE:-}" ]]; then
            python scripts/check_artifact_policy.py --base "$ARTIFACT_BASE"
          else
            python scripts/check_artifact_policy.py --all
          fi
