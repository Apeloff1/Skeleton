name: Emerald V7 original-binary custody
on:
  push:
    branches:
      - 'feat/emerald-v7-binary-*'
      - 'assets/emerald-v7-*'
    paths:
      - 'assets/emerald/evolution-v7/**'
      - 'scripts/publish_emerald_v7_orbit02.py'
      - 'scripts/test_emerald_v7_publication.py'
      - '.github/workflows/emerald-v7-binary-custody.yml'
  pull_request:
    paths:
      - 'assets/emerald/evolution-v7/**'
      - 'scripts/publish_emerald_v7_orbit02.py'
      - 'scripts/test_emerald_v7_publication.py'
      - '.github/workflows/emerald-v7-binary-custody.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact original source SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install source-only numerical dependency
        run: python -m pip install --only-binary=:all: numpy==2.3.5
      - name: Run manifest and malicious binary transport rejection
        run: |
          python -m py_compile scripts/publish_emerald_v7_orbit02.py scripts/test_emerald_v7_publication.py
          python scripts/test_emerald_v7_publication.py
      - name: No original binary claim from synthetic source tests
        run: echo 'No original GLB bytes, continuous CCD, real Three mixer, RTX, artist or release qualified by source tests.'
  exact-original-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.head_ref, 'assets/emerald-v7-') || startsWith(github.ref_name, 'assets/emerald-v7-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require all four original raw Git chunks and complete model SHA
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH" in
            assets/emerald-v7-pathfinder-orbit02-20261117) stage=pathfinder ;;
            assets/emerald-v7-archivist-orbit02-20261117) stage=archivist ;;
            *) echo 'Unqualified V7 publication target';exit 1 ;;
          esac
          python3 scripts/publish_emerald_v7_orbit02.py verify-tree --stage "$stage"
