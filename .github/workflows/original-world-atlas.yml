name: Original World Atlas

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/game/generation/original_*.py"
      - "skeleton/game/generation/world_*.py"
      - "tests/test_original_world*.py"
      - "docs/ORIGINAL_WORLD_MECHANIC_ATLAS.md"
      - ".github/workflows/original-world-atlas.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/game/generation/original_*.py"
      - "skeleton/game/generation/world_*.py"
      - "tests/test_original_world*.py"
      - "docs/ORIGINAL_WORLD_MECHANIC_ATLAS.md"
      - ".github/workflows/original-world-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-world-atlas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    name: Validate authorship, exact indexing and abstract rule replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Compile atlas and simulation modules
        run: python -m compileall -q skeleton/game/generation
      - name: Verify originals, styles and rule simulations
        run: python -m pytest -q --noconftest tests/test_original_world_mechanic_atlas.py tests/test_original_world_simulator.py tests/test_original_world_campaign.py tests/test_original_world_campaign_cli.py tests/test_original_world_nexus.py tests/test_original_world_society.py tests/test_original_world_play_cli.py tests/test_original_world_frontier.py tests/test_original_world_frontier_cli.py
      - name: Exercise era and theology preview
        run: |
          python -m skeleton.game.generation.original_world_cli --seed gentle-history --era paleolithic --chronology remote-past --theology animist-invented --theme comfort --tone ultra-snuggly --comfort 100 --realism 95 --brief >/dev/null
          python -m skeleton.game.generation.original_world_cli --index 123456789 --era deep-future --theology cosmic-mythic --theme cosmic-horror --visual-style photorealistic-target --tone nightmarish --simulation-realism hyperrealism-target --demo-rules >/dev/null
      - name: Play four authored worlds with real actions
        run: |
          python -m skeleton.game.generation.original_world_campaign_cli --world topology-02 --seed maze --actions-json '[{"verb":"observe"},{"verb":"end_turn"},{"verb":"move","target":1}]' --show-map
          python -m skeleton.game.generation.original_world_campaign_cli --world ecology-03 --seed living-rain --actions-json '[{"verb":"redirect_rain","option":"west","amount":2},{"verb":"end_turn"}]' --show-map
          python -m skeleton.game.generation.original_world_campaign_cli --world civilization-01 --seed promises --actions-json '[{"verb":"pledge"},{"verb":"fulfill"},{"verb":"end_turn"}]' --show-map
          python -m skeleton.game.generation.original_world_campaign_cli --world serenity-05 --seed cozy --actions-json '[{"verb":"weave","amount":2},{"verb":"rest"},{"verb":"end_turn"}]' --show-map
      - name: Run connected four-world expedition
        run: |
          python - <<'PY'
          from skeleton.game.generation.original_world_campaign import CampaignAction
          from skeleton.game.generation.original_world_nexus import (
              create_nexus, act, travel, recharge, nexus_save, nexus_restore,
          )
          state = create_nexus("cross-world-expedition")
          state, _ = act(state, CampaignAction("weave", amount=2))
          for realm in (1, 2, 3, 0):
              state, _ = travel(state, realm)
              state, _ = act(state, CampaignAction("end_turn"))
          restored = nexus_restore(nexus_save(state))
          assert restored == state
          assert state.realms[0].quilt == 4
          assert sum(realm.wood for realm in state.realms) == 1
          assert len(state.realms) == 4
          print("Four-world traversal and non-duplicated inventory verified")
          PY
      - name: Simulate autonomous inhabitants and persist their consequences
        run: |
          python - <<'PY'
          from skeleton.game.generation.original_world_campaign import CampaignAction
          from skeleton.game.generation.original_world_society import SocietyAction
          from skeleton.game.generation.original_world_living_session import (
              create_living_session, living_step, living_save, living_restore,
          )
          session = create_living_session("topology-02", "resident-sim")
          for event in (
              SocietyAction("greet"), SocietyAction("invite"),
              CampaignAction("move", target=1),
              CampaignAction("end_turn"), CampaignAction("forage"),
              CampaignAction("end_turn"),
          ):
              session, receipt = living_step(session, event)
          assert session.society.day == session.campaign.turn == 2
          assert session.society.residents[0].following
          assert session.society.residents[0].location == session.campaign.position
          assert living_restore(living_save(session)) == session
          print("Autonomous resident economy and save/replay verified")
          PY
      - name: Exercise unified playable terminal in all three modes
        run: |
          python -m skeleton.game.generation.original_world_play_cli --mode campaign --world serenity-05 --actions-json '[{"verb":"weave","amount":2},{"verb":"end_turn"}]' --show-map
          python -m skeleton.game.generation.original_world_play_cli --mode living --world topology-02 --actions-json '[{"social":"greet"},{"social":"invite"},{"verb":"move","target":1},{"verb":"end_turn"}]' --show-map
          python -m skeleton.game.generation.original_world_play_cli --mode nexus --actions-json '[{"verb":"weave","amount":2},{"portal":1},{"verb":"end_turn"},{"portal":2},{"verb":"redirect_rain","option":"west","amount":2}]' --show-map
      - name: Execute persistent procedurally generated frontier
        run: |
          python -m skeleton.game.generation.original_world_frontier_cli --world topology-02 --seed maze-expedition --actions-json '[{"verb":"move","option":"north"},{"verb":"end_turn"}]' --show-map
          python -m skeleton.game.generation.original_world_frontier_cli --world ecology-03 --seed weather-expedition --actions-json '[{"verb":"redirect_rain","option":"west","amount":2},{"verb":"end_turn"}]' --show-map
          python -m skeleton.game.generation.original_world_frontier_cli --world civilization-01 --seed promise-expedition --actions-json '[{"verb":"pledge"},{"verb":"fulfill"},{"verb":"settle"}]' --show-map
          python -m skeleton.game.generation.original_world_frontier_cli --world serenity-05 --seed comfy-expedition --actions-json '[{"verb":"weave","amount":2},{"verb":"rest"}]' --show-map
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
