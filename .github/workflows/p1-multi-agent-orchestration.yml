# Evidence refresh trigger: VOL-017 current-head closure verification.
name: P1 Multi-Agent Orchestration Gate

on:
  pull_request:
    branches:
      - main
      - fix/ai-file-tree-parity-sweep-20261004
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/automation/swarm/multi_agent_orchestration.py"
      - "skeleton/ai/agents/swarm/multi_agent_orchestration.py"
      - "skeleton/automation/swarm/__init__.py"
      - "skeleton/ai/agents/swarm/__init__.py"
      - "skeleton/swarm/multi_agent_orchestration.py"
      - "skeleton/testing/test_multi_agent_orchestration.py"
      - "skeleton/testing/test_agent_delegation_qualification.py"
      - "skeleton/testing/test_swarm_fencing.py"
      - "skeleton/testing/test_swarm_fencing_concurrency.py"
      - ".github/workflows/p1-multi-agent-orchestration.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/automation/swarm/multi_agent_orchestration.py"
      - "skeleton/ai/agents/swarm/multi_agent_orchestration.py"
      - "skeleton/automation/swarm/__init__.py"
      - "skeleton/ai/agents/swarm/__init__.py"
      - "skeleton/swarm/multi_agent_orchestration.py"
      - "skeleton/testing/test_multi_agent_orchestration.py"
      - ".github/workflows/p1-multi-agent-orchestration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-multi-agent-orchestration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate evidence-bound multi-agent orchestration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "fastapi>=0.110,<1"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Compile orchestration boundary
        run: >-
          python -m compileall -q
          skeleton/automation/swarm/multi_agent_orchestration.py
          skeleton/ai/agents/swarm/multi_agent_orchestration.py
          skeleton/swarm/multi_agent_orchestration.py

      - name: Run orchestration, delegation, and fencing regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_multi_agent_orchestration.py
          skeleton/testing/test_agent_delegation_qualification.py
          skeleton/testing/test_swarm_fencing.py
          skeleton/testing/test_swarm_fencing_concurrency.py

      - name: Validate canonical AI file tree parity
        run: python scripts/check_ai_file_tree.py

      - name: Verify exact checked-out head
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Exact-head orchestration validation OK: $actual"
