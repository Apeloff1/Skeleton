name: P1 L0 Accountability Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "machine/ai_build_accountability.json"
      - "machine/ai_p1_task_backlog.json"
      - "machine/accountability_events/P1-L0/**"
      - "docs/plan/BUILD_ACCOUNTABILITY_LEDGER.md"
      - "tests/test_p1_accountability_materialization.py"
      - "tests/test_ai_p1_execution_map.py"
      - ".github/workflows/p1-l0-accountability-verification.yml"
  push:
    branches: [main]
    paths:
      - "machine/ai_build_accountability.json"
      - "machine/ai_p1_task_backlog.json"
      - "machine/accountability_events/P1-L0/**"
      - "docs/plan/BUILD_ACCOUNTABILITY_LEDGER.md"
      - "tests/test_p1_accountability_materialization.py"
      - "tests/test_ai_p1_execution_map.py"
      - ".github/workflows/p1-l0-accountability-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-l0-accountability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-p1-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install project test runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate signed-accountability and task DAG
        run: |
          python scripts/check_ai_build_accountability.py
          python scripts/check_ai_p1_execution_map.py --print-summary

      - name: Validate P1-L0 implementation-only lifecycle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          backlog = json.loads((root / "machine/ai_p1_task_backlog.json").read_text())
          ledger = json.loads((root / "machine/ai_build_accountability.json").read_text())
          tasks = {row["task_id"]: row for row in backlog["tasks"]}
          records = {row["id"]: row for row in ledger["records"]}
          expected = {f"P1-EVID-{index:02d}" for index in range(1, 7)}
          for task_id in sorted(expected):
              task = tasks[task_id]
              record = records[f"ACC-{task_id}"]
              assert task["accountability_status"] == "evidence_pending"
              assert task["implementation_signed"] is True
              assert task["verification_signed"] is False
              assert task["completion_checkbox"] is False
              assert record["status"] == "evidence_pending"
              assert record["implementation_signoff"]["signed"] is True
              assert record["verification_signoff"]["signed"] is False
              assert record["checkbox"] is False
              assert record["implementation_signoff"]["signer_id"] == "chatgpt:gpt-5.6-sol"
              assert record["implementation_signoff"]["git_sha"] == "35f4161f8cdd4f0edc6ce223671e94828c29beef"
          assert tasks["P1-EVID-01"]["status"] == "in_progress"
          assert all(tasks[f"P1-EVID-{index:02d}"]["status"] == "blocked" for index in range(2, 7))
          print("P1-L0 implementation accountability: exact-head valid", EXPECTED_SHA if "EXPECTED_SHA" in globals() else "")
          PY

      - name: Run P1-L0 accountability regressions
        run: |
          python -m pytest -q --noconftest             tests/test_p1_accountability_materialization.py             tests/test_ai_p1_execution_map.py

      - name: Run evidence-spine contract regressions
        run: |
          python -m pytest -q --noconftest             skeleton/testing/test_promotion_evidence.py             skeleton/testing/test_evidence_ingestion.py             tests/test_p1_promotion_evidence_emitter.py             skeleton/testing/test_promotion_gates.py             tests/test_p1_required_gate_authority.py             skeleton/testing/test_risk_evidence.py             tests/test_p1_risk_evidence_reconciliation.py             skeleton/testing/test_reproducibility.py             tests/test_p1_reproducibility_bundle.py             skeleton/testing/test_maturity_reconciliation.py             tests/test_p1_maturity_reconciliation.py             skeleton/testing/test_architecture_scope_freeze.py
