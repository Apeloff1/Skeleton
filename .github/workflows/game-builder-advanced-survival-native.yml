name: Advanced Godot Native Survival Replay
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/game_builder/advanced_survival_godot.py"
      - "skeleton/ai/game_builder/advanced_godot_export.py"
      - "docs/GAME_BUILDER_SYSTEM_EDITOR_FABRIC.md"
      - ".github/workflows/game-builder-advanced-system-engines.yml"
      - "skeleton/ai/game_builder/advanced_gameplay_runtime.py"
      - "skeleton/ai/game_builder/advanced_level_scenes.py"
      - "skeleton/ai/game_builder/advanced_genre_engines.py"
      - "skeleton/ai/game_builder/system_editor_cli.py"
      - "skeleton/ai/game_builder/game_workspace_server.py"
      - "skeleton/ai/game_builder/game_workspace_ui.py"
      - "tests/test_game_builder_advanced_survival_godot.py"
      - ".github/workflows/game-builder-advanced-survival-native.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: advanced-native-survival-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independently-execute-survival:
    name: Python/Godot survival parity on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 23
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Checkout exact PR head with safe source scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_advanced_survival_godot.py
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Godot 4.4.1 native runtime and export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: "4.4.1"
          use-dotnet: false
          include-templates: true
          cache: true
      - name: Validate exact source and Python proof contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          godot --version
          python -m py_compile skeleton/ai/game_builder/advanced_godot_export.py skeleton/ai/game_builder/advanced_survival_godot.py
          python -m unittest tests.test_game_builder_advanced_survival_godot -v
      - name: Build eight original survival biomes and settlement histories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from skeleton.ai.game_builder.advanced_level_scenes import make_advanced_scene
          from skeleton.ai.game_builder.advanced_gameplay_runtime import run_advanced_session
          from skeleton.ai.game_builder.advanced_survival_godot import render_survival_godot_package
          from skeleton.ai.game_builder.advanced_godot_export import write_advanced_godot_package
          root=Path(os.environ["RUNNER_TEMP"])/"advanced-native-survival"
          root.mkdir()
          rich={"starting_food":20,"starting_water":20,"initial_wood":15}
          cases=(
              ("original",{},["forage","gather_wood","mine_stone","drink","rest"],
               0,"clear",0),
              ("regions",{"starting_food":15,"starting_water":15},
               ["travel","forage","drink","trade","rest","travel"],
               1,"rain",0),
              ("camp",rich,["mine_stone","mine_stone","craft_tool",
                            "build_shelter","mine_stone","mine_stone",
                            "build_shelter","rest","travel"],
               0,"cold",0),
              ("cooking",{"initial_wood":4,"starting_food":12,"starting_water":12},
               ["hunt","light_fire","cook","trade","rest"],
               3,"heat",0),
              ("merchant",{"starting_food":12,"starting_water":12},
               ["trade","trade","rest","rest"],
               4,"rain",0),
              ("weather",{"starting_food":20,"starting_water":20},
               ["rest"]*12,2,"cold",0),
              ("new_world",{"starting_food":15,"starting_water":15},
               ["travel","rest","travel","forage","rest"],
               5,"storm" if False else "rain",2),
              ("survivor_lost",{"max_health":2,"starting_food":0,
                                "starting_water":0,"hunger_rate":2},
               ["rest","rest"],6,"heat",0),
          )
          witnessed=set()
          for name,settings,commands,seed,weather,region in cases:
              base=make_advanced_scene("survival",settings,seed=seed)["layout"]
              layout={"regions":base["regions"],"starting_region":region,
                      "weather":weather}
              scene=make_advanced_scene("survival",settings,seed=seed,layout=layout)
              session=run_advanced_session("survival",settings,commands,
                                           seed=seed,scene=scene)
              witnessed.update(e for record in session["trace"]
                               for e in record["events"])
              if name=="camp":
                  assert "self_sufficient_outpost" in session["state"]["milestones"]
                  assert not session["state"]["finished"] and not session["terminal"]
              if name=="survivor_lost":
                  assert session["terminal"] and session["state"]["failed"]
              pkg=render_survival_godot_package(session,settings,authorized=True)
              write_advanced_godot_package(pkg,root/name,authorized=True)
              print("NATIVE_SURVIVAL_SOURCE",name,"actions",len(commands),
                    "day",session["state"]["day"],
                    "events",session["state"]["events"],
                    "digest",session["digest"])
          assert {"finite_resource_harvested","finite_market_trade",
                  "meal_cooked","tool_crafted","shelter_built",
                  "region_discovered","original_world_milestone",
                  "dehydration_or_hunger","survivor_lost"} <= witnessed,witnessed
          PY
      - name: Independently execute eight real native open-ended survival worlds
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/advanced-native-survival"
          python - "$root" <<'PY'
          import os, pathlib, subprocess, sys
          root=pathlib.Path(sys.argv[1])
          cases=("original","regions","camp","cooking",
                 "merchant","weather","new_world","survivor_lost")
          for case in cases:
              project=root/case/"godot"
              print("NATIVE_ADVANCED_SURVIVAL_CASE",case,flush=True)
              for args in (["--headless","--path",str(project),"--import"],
                           ["--headless","--path",str(project),"--","--verify-survival"]):
                  try:
                      # Git Bash provides the Godot launcher on Windows, but
                      # CreateProcess cannot resolve that shell-only command.
                      # Use the exact Git Bash installed by actions' bash shell.
                      cmd=(["godot",*args] if sys.platform!="win32" else [
                          str(pathlib.Path(os.environ["ProgramFiles"])/"Git"/"bin"/"bash.exe"),
                          "-c",'godot "$@"',"godot",*args])
                      result=subprocess.run(cmd,stdout=subprocess.PIPE,
                                            stderr=subprocess.STDOUT,text=True,
                                            encoding="utf-8",errors="replace",timeout=45)
                  except subprocess.TimeoutExpired as exc:
                      print("NATIVE_ADVANCED_SURVIVAL_TIMEOUT",case,args,flush=True)
                      if exc.stdout:
                          print(exc.stdout.decode("utf-8","replace") if isinstance(exc.stdout,bytes) else exc.stdout)
                      raise
                  print(result.stdout,flush=True)
                  if "--verify-survival" in args:
                      (root/case/"native-replay.log").write_text(result.stdout,encoding="utf-8")
                      if "NATIVE_ADVANCED_SURVIVAL_OK" not in result.stdout:
                          raise SystemExit("native gameplay proof marker absent: "+case)
                  if result.returncode:
                      raise SystemExit(f"Godot returned {result.returncode} on {case} {args}")
          PY
      - name: Export Linux desktop survival executable and execute the actual binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/advanced-native-survival/camp/godot"
          executable="$RUNNER_TEMP/advanced-native-survival/original-advanced-survival.x86_64"
          godot --headless --path "$project" --export-release Linux "$executable"
          test -s "$executable"
          chmod +x "$executable"
          "$executable" --headless -- --verify-survival | tee "$RUNNER_TEMP/advanced-native-survival/linux-export-replay.log"
          grep -q "NATIVE_ADVANCED_SURVIVAL_OK" "$RUNNER_TEMP/advanced-native-survival/linux-export-replay.log"
      - name: Export actual Windows game and verify native console executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'advanced-native-survival'
          $project = Join-Path $root 'camp/godot'
          $binary = Join-Path $root 'original-advanced-survival.exe'
          # The setup-godot Windows GUI editor can detach without a reliable
          # synchronous exit code. Use the same pinned official console engine
          # already required by the repository's Windows native integration.
          $archive = Join-Path $env:USERPROFILE 'downloads/Godot_v4.4.1-stable_win64.exe.zip'
          $engineDir = Join-Path $root 'pinned-godot-console'
          if (-not (Test-Path $archive)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $archive) | Out-Null
            Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip' -OutFile $archive -MaximumRedirection 5
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $engineDir -Force
          $nativeEditor = Get-ChildItem $engineDir -Recurse -Filter '*_console.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nativeEditor) {
            throw "Version-pinned official Godot Windows console editor unavailable"
          }
          & $nativeEditor.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows console startup failed" }
          & $nativeEditor.FullName --headless --path $project --import
          if ($LASTEXITCODE -ne 0) { throw "Advanced survival Windows resource import failed" }
          & $nativeEditor.FullName --headless --path $project --export-release 'Windows Desktop' $binary
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $binary)) {
            throw "Advanced Godot Windows console game executable export failed"
          }
          if ((Get-Item $binary).Length -le 1024) {
            throw "Advanced Godot Windows game executable is empty"
          }
          $console = Join-Path $root 'original-advanced-survival.console.exe'
          if (-not (Test-Path $console)) {
            throw "Exported original survival lacks an observable Windows console binary"
          }
          $python = @'
          import subprocess,sys
          result=subprocess.run(
              [sys.argv[1],"--headless","--","--verify-survival"],
              capture_output=True,text=True,timeout=90)
          print(result.stdout)
          print(result.stderr)
          sys.exit(0 if result.returncode==0 and
              "NATIVE_ADVANCED_SURVIVAL_OK" in result.stdout+result.stderr else 1)
          '@
          $proofScript = Join-Path $root 'verify_windows_native.py'
          [IO.File]::WriteAllText($proofScript, $python)
          & python $proofScript $console
          if ($LASTEXITCODE -ne 0) {
            throw "Exported Windows homebrew survival gameplay diverged from reviewed Python"
          }
          Write-Host "Native Windows executable SHA256:"
          Get-FileHash -Algorithm SHA256 $binary | Format-List
          Get-FileHash -Algorithm SHA256 $console | Format-List
      - name: Upload native gameplay proof logs and source release manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-advanced-survival-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/advanced-native-survival/*/native-replay.log
            ${{ runner.temp }}/advanced-native-survival/*/release.json
            ${{ runner.temp }}/advanced-native-survival/linux-export-replay.log
            ${{ runner.temp }}/advanced-native-survival/original-advanced-survival.exe
            ${{ runner.temp }}/advanced-native-survival/original-advanced-survival.console.exe
            ${{ runner.temp }}/advanced-native-survival/original-advanced-survival.x86_64
          if-no-files-found: warn
          retention-days: 7
