name: VOL-019 World Model Closure

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/simulation/**"
      - "skeleton/ai/simulation/**"
      - "skeleton/testing/test_vol019_world_model_contract.py"
      - "scripts/verify_vol019_world_model.py"
      - "tests/test_vol019_world_model_independent.py"
      - ".github/workflows/vol019-world-model.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/simulation/**"
      - "skeleton/ai/simulation/**"
      - "skeleton/testing/test_vol019_world_model_contract.py"
      - "scripts/verify_vol019_world_model.py"
      - "tests/test_vol019_world_model_independent.py"
      - ".github/workflows/vol019-world-model.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol019-world-model-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  world-model-contract:
    name: Canonical world-model simulation boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install world-model test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          .
          "pytest>=8,<9"
      - name: Compile VOL-019 surfaces
        run: >-
          python -m compileall -q
          skeleton/simulation/environment.py
          skeleton/simulation/world_model.py
          skeleton/simulation/scenario_runtime.py
          skeleton/ai/simulation/environment.py
          skeleton/ai/simulation/world_model.py
          skeleton/ai/simulation/scenario_runtime.py
          scripts/verify_vol019_world_model.py
      - name: Require canonical simulation mirror parity
        run: |
          cmp skeleton/simulation/environment.py skeleton/ai/simulation/environment.py
          cmp skeleton/simulation/world_model.py skeleton/ai/simulation/world_model.py
          cmp skeleton/simulation/scenario_runtime.py skeleton/ai/simulation/scenario_runtime.py
      - name: Run world-model behavioral regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_vol019_world_model_contract.py

  world-model-independent:
    name: Independent exact-head world-model verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install independent verifier test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
      - name: Run independent verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_vol019_world_model_independent.py
      - name: Emit independent exact-head receipt
        run: >-
          python scripts/verify_vol019_world_model.py
          --evidence-out .vol019-world-model-independent.json
          --print-evidence
      - name: Assert exact-head receipt identity
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads(Path(".vol019-world-model-independent.json").read_text())
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("VOL-019 receipt does not bind exact head")
          if receipt.get("verifier") != "independent-vol019-world-model-v1":
              raise SystemExit("unexpected VOL-019 verifier identity")
          if receipt.get("volume") != "VOL-019":
              raise SystemExit("VOL-019 verifier bound wrong volume")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent VOL-019 verification failed")
          if receipt.get("checked_invariant_count", 0) < 20:
              raise SystemExit("VOL-019 invariant coverage is incomplete")
          if len(receipt.get("source_digests") or {}) != 3:
              raise SystemExit("VOL-019 source digest coverage is incomplete")
          if len(receipt.get("mirror_digests") or {}) != 3:
              raise SystemExit("VOL-019 mirror digest coverage is incomplete")
          if len((receipt.get("volume_binding") or {}).get("binding_digest") or "") != 64:
              raise SystemExit("VOL-019 plan binding digest is missing")
          if len(receipt.get("receipt_digest") or "") != 64:
              raise SystemExit("VOL-019 receipt digest is invalid")
          print("VOL-019 independent exact-head receipt:", expected, receipt["receipt_digest"])
          PY
