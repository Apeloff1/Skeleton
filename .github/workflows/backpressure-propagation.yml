name: Backpressure Propagation

on:
  pull_request:
    branches:
      - main
    paths:
      - "machine/backpressure_contract.json"
      - "scripts/verify_backpressure_contract.py"
      - "skeleton/kernel/backpressure.py"
      - "skeleton/ai/runtime/kernel/backpressure.py"
      - "skeleton/testing/test_backpressure_propagation.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/backpressure-propagation.yml"
  push:
    branches:
      - main
    paths:
      - "machine/backpressure_contract.json"
      - "scripts/verify_backpressure_contract.py"
      - "skeleton/kernel/backpressure.py"
      - "skeleton/ai/runtime/kernel/backpressure.py"
      - "skeleton/testing/test_backpressure_propagation.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/backpressure-propagation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backpressure-propagation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backpressure-propagation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused runtime dependency
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3" "pydantic-settings>=2,<3"
      - name: Compile backpressure surfaces
        run: >-
          python -m compileall -q
          skeleton/kernel/backpressure.py
          skeleton/ai/runtime/kernel/backpressure.py
          scripts/verify_backpressure_contract.py
          skeleton/testing/test_backpressure_propagation.py
      - name: Verify G022 contract
        run: python scripts/verify_backpressure_contract.py --json
      - name: Run backpressure regressions
        run: python -m unittest -q skeleton.testing.test_backpressure_propagation
      - name: Verify governed AI file-tree parity
        run: python scripts/check_ai_file_tree.py
      - name: Verify hostile-gap disposition
        run: python scripts/verify_ai_hostile_gap_disposition.py
