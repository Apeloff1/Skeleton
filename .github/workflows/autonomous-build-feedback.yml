name: Autonomous Build Feedback

on:
  workflow_run:
    workflows:
      - "Autonomous Studio Smoke"
      - "Backend Quality"
      - "CI/CD"
      - "ARM64 Ubuntu Validation"
      - "Repository Hygiene Gate"
    types: [completed]
    branches: ["*", "**"]

concurrency:
  group: autonomous-build-feedback-${{ github.event_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  feedback:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      GATE_NAME: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - name: Checkout exact tested head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.1.0
        with:
          python-version: '3.11.16'

      - name: Verify event/head boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -n "$GATE_NAME"
          test -n "$RUN_ID"

      - name: Materialize bounded feedback seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feedback"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema": "autonomous-studio.workflow-feedback-seed.v1",
              "head_sha": os.environ["HEAD_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "gate": os.environ["GATE_NAME"],
              "conclusion": os.environ["CONCLUSION"],
          }
          Path(os.environ["RUNNER_TEMP"] + "/feedback/seed.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Validate feedback control plane
        run: >-
          python -m pytest -q
          skeleton/testing/test_ci_evidence.py
          skeleton/testing/test_ci_log_evidence.py
          skeleton/testing/test_ci_repair_queue.py
          skeleton/testing/test_ci_feedback.py
          skeleton/testing/test_ci_feedback_report.py
          skeleton/testing/test_repair_inbox.py
          skeleton/testing/test_repair_authority.py
          --tb=short --maxfail=1

      - name: Publish feedback seed artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b5404495eeb8b5cf9c8f1f1a2 # v4.6.2
        with:
          name: autonomous-build-feedback-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/feedback/seed.json
          if-no-files-found: error
          retention-days: 7
