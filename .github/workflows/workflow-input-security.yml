name: Workflow Input Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - '.github/workflows/**'
      - 'backend/scripts/check_workflow_input_security.py'
      - 'backend/scripts/check_workflow_action_allowlist.py'
      - 'backend/scripts/check_repo_attention_contract.py'
      - 'backend/scripts/check_branch_flow_contract.py'
      - 'backend/tests/test_workflow_input_security_gate.py'
      - 'backend/tests/test_workflow_event_shell_security.py'
      - 'backend/tests/test_workflow_action_allowlist.py'
      - 'backend/tests/test_repo_attention_contract.py'
      - 'backend/tests/test_branch_flow_contract.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'backend/scripts/check_workflow_input_security.py'
      - 'backend/scripts/check_workflow_action_allowlist.py'
      - 'backend/scripts/check_repo_attention_contract.py'
      - 'backend/scripts/check_branch_flow_contract.py'
      - 'backend/tests/test_workflow_input_security_gate.py'
      - 'backend/tests/test_workflow_event_shell_security.py'
      - 'backend/tests/test_workflow_action_allowlist.py'
      - 'backend/tests/test_repo_attention_contract.py'
      - 'backend/tests/test_branch_flow_contract.py'

concurrency:
  group: workflow-input-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-input-shell-boundary:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Workflow input shell boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install security-gate test runtime
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Run workflow security contract regression suite
        working-directory: backend
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          tests/test_workflow_input_security_gate.py
          tests/test_workflow_event_shell_security.py
          tests/test_workflow_action_allowlist.py
          tests/test_repo_attention_contract.py
          tests/test_branch_flow_contract.py
      - name: Reject direct untrusted event interpolation in run shells
        run: python backend/scripts/check_workflow_input_security.py
      - name: Enforce reviewed action repository allowlist
        run: python backend/scripts/check_workflow_action_allowlist.py
      - name: Enforce Repository Attention contract
        run: python backend/scripts/check_repo_attention_contract.py
      - name: Enforce branch-flow mutation contract
        run: python backend/scripts/check_branch_flow_contract.py
