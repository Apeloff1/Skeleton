      - 'backend/scripts/check_workflow_action_allowlist.py'
      - 'backend/scripts/check_workflow_permissions.py'
      - 'backend/scripts/check_workflow_trigger_fanout.py'
      - 'backend/scripts/check_workflow_concurrency.py'
      - 'backend/scripts/check_repo_attention_contract.py'
      - 'backend/scripts/check_branch_flow_contract.py'
      - 'backend/scripts/check_workflow_run_branch_completions.py'
      - 'backend/tests/test_workflow_input_security_gate.py'
      - 'backend/tests/test_workflow_event_shell_security.py'
      - 'backend/tests/test_workflow_action_allowlist.py'
      - 'backend/tests/test_workflow_permissions_gate.py'
      - 'backend/tests/test_workflow_trigger_fanout_gate.py'
      - 'backend/tests/test_workflow_concurrency_gate.py'
      - 'backend/tests/test_pr_close_tombstone_workflows.py'
      - 'backend/tests/test_repo_attention_contract.py'
      - 'backend/tests/test_branch_flow_contract.py'
      - 'backend/tests/test_workflow_run_branch_completions_contract.py'
      - 'backend/tests/test_bot_activation_security.py'
      - 'backend/tests/test_supervisor_workflow_contract.py'
      - 'backend/tests/test_traffic_manager_workflow_contract.py'
      - 'skeleton/automation/supervisor.py'
      - 'skeleton/automation/traffic_manager.py'
      - 'skeleton/automation/build_authority.py'
      - 'skeleton/automation/builder_plane.py'
      - 'skeleton/automation/supervisor_runtime.py'
      - 'skeleton/automation/secretary.py'
      - 'skeleton/automation/specialist_bots.py'
      - 'skeleton/automation/advanced_bots.py'
      - 'skeleton/automation/bot_manager.py'
      - 'skeleton/automation/worker_health.py'
      - 'tests/test_autonomous_supervisor.py'
      - 'tests/test_build_authority.py'
      - 'tests/test_builder_plane.py'
      - 'tests/test_builder_plane_integration.py'
      - 'tests/test_supervisor_runtime.py'
      - 'tests/test_traffic_manager.py'
      - 'tests/test_worker_health.py'
      - 'skeleton/testing/test_bot_manager.py'
      - 'core/activation_security.py'
      - 'skeleton/security/activation_security.py'
      - 'core/shift_supervisor/model_gateway.py'
      - 'skeleton/automation/chatgpt_adapter.py'
      - 'skeleton/testing/test_repair_intake.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.machine/**'
      - 'skeleton/repo_machine/**'
      - 'scripts/check_repo_machine.py'
      - 'tests/test_repo_machine.py'
      - 'tests/test_repo_machine_advanced.py'
      - 'tests/test_repo_machine_growth.py'
      - 'tests/test_repo_machine_catalog.py'
      - 'tests/test_repo_machine_sota.py'
      - 'backend/scripts/check_workflow_input_security.py'
      - 'backend/scripts/check_workflow_action_allowlist.py'
      - 'backend/scripts/check_workflow_permissions.py'
      - 'backend/scripts/check_workflow_trigger_fanout.py'
      - 'backend/scripts/check_workflow_concurrency.py'
      - 'backend/scripts/check_repo_attention_contract.py'
      - 'backend/scripts/check_branch_flow_contract.py'
      - 'backend/scripts/check_workflow_run_branch_completions.py'
      - 'backend/tests/test_workflow_input_security_gate.py'
      - 'backend/tests/test_workflow_event_shell_security.py'
      - 'backend/tests/test_workflow_action_allowlist.py'
      - 'backend/tests/test_workflow_permissions_gate.py'
      - 'backend/tests/test_workflow_trigger_fanout_gate.py'
      - 'backend/tests/test_workflow_concurrency_gate.py'
      - 'backend/tests/test_pr_close_tombstone_workflows.py'
      - 'backend/tests/test_repo_attention_contract.py'
      - 'backend/tests/test_branch_flow_contract.py'
      - 'backend/tests/test_workflow_run_branch_completions_contract.py'
      - 'backend/tests/test_bot_activation_security.py'
      - 'backend/tests/test_supervisor_workflow_contract.py'
      - 'skeleton/automation/supervisor.py'
      - 'skeleton/automation/build_authority.py'
      - 'skeleton/automation/builder_plane.py'
      - 'skeleton/automation/supervisor_runtime.py'
      - 'skeleton/automation/secretary.py'
      - 'skeleton/automation/specialist_bots.py'
      - 'skeleton/automation/advanced_bots.py'
      - 'skeleton/automation/bot_manager.py'
      - 'skeleton/automation/worker_health.py'
      - 'tests/test_autonomous_supervisor.py'
      - 'tests/test_build_authority.py'
      - 'tests/test_builder_plane.py'
      - 'tests/test_builder_plane_integration.py'
      - 'tests/test_supervisor_runtime.py'
      - 'tests/test_worker_health.py'
      - 'skeleton/testing/test_bot_manager.py'
      - 'core/activation_security.py'
      - 'skeleton/security/activation_security.py'
      - 'core/shift_supervisor/model_gateway.py'
      - 'skeleton/automation/chatgpt_adapter.py'
      - 'skeleton/testing/test_repair_intake.py'

concurrency:
  group: workflow-input-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-input-shell-boundary:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Workflow input shell boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install security-gate test runtime
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Run workflow security contract regression suite
        working-directory: backend
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          tests/test_workflow_input_security_gate.py
          tests/test_workflow_event_shell_security.py
          tests/test_workflow_action_allowlist.py
          tests/test_workflow_permissions_gate.py
          tests/test_workflow_trigger_fanout_gate.py
          tests/test_workflow_concurrency_gate.py
          tests/test_pr_close_tombstone_workflows.py
          tests/test_repo_attention_contract.py
          tests/test_branch_flow_contract.py
          tests/test_workflow_run_branch_completions_contract.py
          tests/test_bot_activation_security.py
          tests/test_supervisor_workflow_contract.py
          tests/test_traffic_manager_workflow_contract.py
      - name: Reject direct untrusted event interpolation in run shells
        run: python backend/scripts/check_workflow_input_security.py
      - name: Enforce reviewed action repository allowlist
        run: python backend/scripts/check_workflow_action_allowlist.py
      - name: Enforce least-privilege workflow token permissions
        run: python backend/scripts/check_workflow_permissions.py
      - name: Enforce workflow trigger-fanout audit
        run: python backend/scripts/check_workflow_trigger_fanout.py
      - name: Enforce workflow concurrency-key collision audit
        run: python backend/scripts/check_workflow_concurrency.py
      - name: Enforce Repository Attention contract
        run: python backend/scripts/check_repo_attention_contract.py
      - name: Enforce branch-flow mutation contract
        run: python backend/scripts/check_branch_flow_contract.py
      - name: Enforce workflow_run branch-completion contract
        run: python backend/scripts/check_workflow_run_branch_completions.py
      - name: Enforce bot activation security baseline
        run: python skeleton/security/activation_security.py
