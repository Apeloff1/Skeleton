name: P3 Expansion Closure

on:
  pull_request:
    paths:
      - "machine/ai_p3_expansion_closure.json"
      - "machine/ai_p3_execution_map.json"
      - "machine/ai_p3_task_backlog.json"
      - "scripts/check_p3_expansion_closure.py"
      - "tests/test_p3_expansion_closure.py"
      - ".github/workflows/p3-expansion-closure.yml"
  push:
    branches:
      - main
      - feat/p3-autonomous-intelligence-expansion-atomic
    paths:
      - "machine/ai_p3_expansion_closure.json"
      - "machine/ai_p3_execution_map.json"
      - "machine/ai_p3_task_backlog.json"
      - "scripts/check_p3_expansion_closure.py"
      - "tests/test_p3_expansion_closure.py"
      - ".github/workflows/p3-expansion-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-expansion-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused verifier runtime
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Validate bounded P3 closure
        run: python scripts/check_p3_expansion_closure.py --json
      - name: Run closure regressions
        run: python -m pytest -q tests/test_p3_expansion_closure.py
