# ============================================================================
# Tutolage CI/CD Pipeline (restored for #4104)
# ============================================================================
# ace886be (2026-10-16) archived this file to cut Actions queue load. That left
# Frontend, Backend Test, GameForge, Cockpit Smoke and Docker gates with no
# trigger at all. It is restored as a reusable workflow that the required
# "Merge Readiness" aggregate calls once per PR head / main push, so:
#   * there is exactly one run per head (no standalone pull_request/push
#     triggers here, so no duplicate fan-out next to Merge Readiness);
#   * superseded heads are cancelled by Merge Readiness' per-ref concurrency;
#   * a `changes` job skips lanes whose inputs did not change (skipped jobs
#     resolve as success for the caller, so required checks never go missing);
#     pushes to main, dispatches and CI-policy edits run everything.
name: CI/CD
on:
  workflow_call:
  workflow_dispatch:

# Repository-global key distinct from the caller's merge-readiness-* group, so
# a called run never deadlocks on its caller. In a reusable workflow
# github.event_name is the caller's event: PR heads are keyed by PR number and
# superseded heads are cancelled; main pushes and dispatches are keyed by SHA
# and never preempted, so every main tip keeps its CI/CD + GameForge evidence
# (restores the #2393 queue-not-cancel rule lost in the ace886be archive).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11.16"
  NODE_VERSION: "24.20.0"
  PYTHONPATH: "${{ github.workspace }}"
permissions:
  contents: read
jobs:
  changes:
    name: "Change Scope"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      python: ${{ steps.scope.outputs.python }}
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 2}
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci_change_scope.sh

  backend-lint:
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed'))
    needs: changes
    name: "Backend Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: ./backend}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true, cache-dependency-glob: backend/requirements*.txt}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: pyproject.toml}
      - name: Repository toolchain contract
        run: python ../scripts/check_toolchain_contract.py
      - name: Backend correctness lint
        run: uvx --from "ruff==0.17.2" ruff check . --output-format=github
      - name: Backend syntax compilation
        run: python -m compileall -q .
      - name: Process invocation safety gate
        run: python scripts/check_process_safety.py
  skeleton-test:
    if: needs.changes.outputs.python == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed'))
    needs: changes
    name: "Skeleton GameForge"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: pyproject.toml}
      - name: Install Skeleton runtime slice
        run: python -m pip install "pytest>=8,<9" "fastapi>=0.110,<1" "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3" "numpy>=2,<3" "httpx>=0.27,<1"
      - name: Test forge / jeeves / context
        env: {PYTHONPATH: "."}
        run: |
          set -euo pipefail
          python -m compileall -q skeleton
          python tests/run_unit.py
          python -m pytest -q \
            tests/test_run_unit_runner.py \
            tests/test_feature_unit_runner.py \
            tests/test_cortex_persistence_quality.py \
            skeleton/testing/test_swarm_ingress.py \
            skeleton/testing/test_swarm_policy_atomicity.py \
            skeleton/testing/test_swarm_policy_snapshots.py \
            skeleton/testing/test_swarm_tenant_broker.py \
            skeleton/testing/test_swarm_tenant_revival_guard.py \
            skeleton/testing/test_swarm_lease_rollback.py \
            skeleton/testing/test_swarm_hardened_numeric.py \
            skeleton/testing/test_swarm_rate_limit_refund.py \
            skeleton/testing/test_swarm_quota_validation.py \
            skeleton/testing/test_swarm_fairness_validation.py \
            skeleton/testing/test_swarm_checkpoint.py \
            skeleton/testing/test_swarm_checkpoint_integrity.py \
            skeleton/testing/test_swarm_tenant_checkpoint.py \
            skeleton/testing/test_swarm_recovery_manager.py \
            skeleton/testing/test_swarm_recovery_tenants.py \
            skeleton/testing/test_swarm_recovery_archive.py \
            skeleton/testing/test_swarm_recovery_archive_api.py \
            skeleton/testing/test_swarm_recovery_archive_publication.py \
            skeleton/testing/test_swarm_recovery_activation.py \
            skeleton/testing/test_swarm_restore_validation.py \
            skeleton/testing/test_swarm_restore_ordering.py \
            skeleton/testing/test_swarm_forget_retention.py \
            skeleton/testing/test_server_recovery_health.py \
            skeleton/testing/test_server_swarm_bundle.py \
            skeleton/testing/test_swarm_operator_tenant_recovery.py \
            skeleton/testing/test_swarm_operator_retention_api.py \
            skeleton/testing/test_swarm_operator_cutover_fencing.py
          python -m skeleton eras
          python -m skeleton plan "soulslike extraction with bonfire rest"
          python -m skeleton cockpit "BLEND ERA arcade_golden_age soulslike 0.5"
          python -m skeleton walk --era soulslike
      - name: GameForge walk -> materialise -> runnable Godot tree
        timeout-minutes: 6
        env: {PYTHONPATH: "."}
        run: |
          set -euo pipefail
          GF_TREE="$RUNNER_TEMP/gf-tree"
          python scripts/gameforge_materialise_smoke.py "$GF_TREE" --era soulslike --budget-ms 120000 --overwrite
          python scripts/check_godot_tree.py "$GF_TREE"
          python -m pytest -q \
            tests/test_check_godot_tree.py \
            tests/test_godot_materialiser_needs_files.py \
            skeleton/testing/test_godot_emit.py \
            skeleton/testing/test_materialise_e2e_acceptance.py \
            skeleton/testing/test_gameforge_http_e2e.py \
            skeleton/testing/test_omnifabric_routes.py
  java-accelerators:
    if: needs.changes.outputs.python == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed'))
    needs: changes
    name: "Java Batch Accelerators"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: pyproject.toml}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
      - name: Java source self-tests
        run: |
          java java-accelerators/observability/AcceleratorMain.java --self-test
          java java-accelerators/vector/VectorSearchMain.java --self-test
          java java-accelerators/physics/BroadPhaseMain.java --self-test
      - name: Python bridge and fallback tests
        env: {PYTHONPATH: "."}
        run: |
          python -m pip install \
            "pytest>=8,<9" \
            "pydantic>=2.5,<3" \
            "pydantic-settings>=2.1,<3"
          python -m compileall -q skeleton/observability skeleton/memory skeleton/simulation/physics skeleton/jvm_accelerators.py
          python -m pytest -q \
            skeleton/testing/test_jvm_observability_accelerator.py \
            skeleton/testing/test_jvm_vector_accelerator.py \
            skeleton/testing/test_jvm_physics_broadphase_accelerator.py \
            skeleton/testing/test_jvm_accelerator_registry.py \
            skeleton/testing/test_jvm_accelerator_runtime_status.py

  assembly-accelerators:
    if: needs.changes.outputs.python == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed'))
    needs: changes
    name: "Assembly Vector Accelerators"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: pyproject.toml}
      - name: Install focused Assembly runtime/test slice
        run: |
          python -m pip install \
            "pytest>=8,<9" \
            "pydantic>=2.5,<3" \
            "pydantic-settings>=2.1,<3"
      - name: Build and self-test x86-64 Assembly kernels
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          python scripts/build_asm_accelerator.py \
            --output-dir "$RUNNER_TEMP/skeleton-asm" \
            --self-test \
            --json
      - name: Python bridge, fallback, and real-kernel tests
        env:
          PYTHONPATH: "."
          SKELETON_ASM_CACHE_DIR: ${{ runner.temp }}/skeleton-asm
        run: |
          set -euo pipefail
          python -m compileall -q skeleton/native skeleton/memory
          python -m pytest -q \
            skeleton/testing/test_asm_vector_accelerator.py \
            skeleton/testing/test_asm_vector_store.py \
            skeleton/testing/test_asm_c_abi.py \
            skeleton/testing/test_native_accelerator_registry.py
          python scripts/benchmark_asm_vector_accelerator.py \
            --library "$SKELETON_ASM_CACHE_DIR/libskeleton_asm_v4_x86_64.so" \
            --dimensions 33 \
            --rows 32 \
            --queries 3 \
            --iterations 1 \
            --warmup 0 \
            --json

  school-jeeves-test:
    if: needs.changes.outputs.python == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed'))
    needs: changes
    name: "Jeeves School Reasoning"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: pyproject.toml}
      - name: Install focused test/runtime slice
        run: python -m pip install "pytest>=8,<9" "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Compile school package
        run: python -m compileall -q skeleton/school
      - name: Run focused reasoning suite
        env: {PYTHONPATH: "."}
        run: python -m pytest -q tests/test_jeeves_reasoning_stack.py
  cockpit-smoke:
    if: needs.changes.outputs.python == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed'))
    needs: changes
    name: "Cockpit Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: pyproject.toml}
      - name: Install Skeleton runtime slice
        run: python -m pip install "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - env: {PYTHONPATH: "."}
        run: chmod +x scripts/cockpit-smoke.sh && ./scripts/cockpit-smoke.sh
  backend-test:
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed'))
    name: "Backend Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, backend-lint]
    defaults: {run: {working-directory: ./backend}}
    services:
      mongodb:
        # Docker Official Image mongo:7.0.41, pinned to the multi-platform index digest.
        image: mongo@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0
        ports: [27017:27017]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true, cache-dependency-glob: backend/requirements*.txt}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: pyproject.toml}
      - run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install "pytest>=8,<9" pytest-asyncio pytest-cov pytest-xdist
      - name: Enforce live-service test boundary
        run: |
          uv run python scripts/check_live_service_test_boundaries.py
          uv run python -m pytest -q --noconftest tests/test_live_service_test_boundaries.py
      - name: Run in-process backend suite
        env: {MONGO_URL: mongodb://localhost:27017/test}
        run: |
          # Remote/deployed service regressions are explicitly marked live_service;
          # this job validates the checked-out backend without assuming a server
          # is already listening on localhost:8001 or a mutable preview deployment.
          uv run pytest tests/ -m "not live_service" -v --cov=. --cov-report=xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with: {files: ./backend/coverage.xml, fail_ci_if_error: false}
  backend-import-smoke:
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed'))
    name: "Backend Import Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, backend-lint]
    defaults: {run: {working-directory: ./backend}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {enable-cache: true, cache-dependency-glob: backend/requirements*.txt}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: pyproject.toml}
      - run: |
          uv venv
          uv pip install -r requirements.txt
      - env:
          MONGO_URL: mongodb://localhost:27017/test
          SKIP_HEAVY_SEED: "true"
        run: |
          uv run python -c "import server; assert server.app is not None; print('server import: OK')"
  frontend:
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed'))
    needs: changes
    name: "Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: ./frontend}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies without third-party lifecycle scripts
        run: yarn install --ignore-scripts
      - name: Apply reviewed local node_modules patches
        run: node ./scripts/patch-node-modules.js
      - run: yarn lint:ci
      - run: yarn typecheck
      - run: yarn test:operation-stream
      - run: yarn test:conversation
      - run: yarn test:product-journeys
      - name: App-foundation contract regressions (consolidated from Merge Readiness)
        shell: bash
        run: |
          shopt -s nullglob
          tests=(scripts/app-foundation/*.test.cjs)
          if [ -d scripts/app-foundation ] && [ ${#tests[@]} -eq 0 ]; then
            echo '::error::app-foundation test directory has no tests'
            exit 1
          fi
          if [ ${#tests[@]} -gt 0 ]; then
            node --test "${tests[@]}"
          else
            echo '::notice::app-foundation tests not yet present'
          fi
      - run: yarn test:build-lifecycle
      - run: yarn test:knowledge-experience
      - run: yarn test:world-workbench
      - run: yarn test:design-review
      - run: yarn test:skeleton-forge
      - run: yarn test:forge-operator
      - name: Reconciled startup safety regressions (from fast Merge Readiness)
        run: node --test scripts/test-reconciled-stability.cjs
      - name: Long-session lifecycle and network regressions (from fast Merge Readiness)
        run: node --test scripts/test-long-session-stability.cjs scripts/test-marathon-pressure.cjs scripts/test-session-transition-pressure.cjs scripts/test-offline-cache-integrity.cjs scripts/test-memory-pressure-runtime.cjs scripts/test-operation-stream-endurance.cjs scripts/test-persistent-preferences-endurance.cjs scripts/test-build-observer-endurance.cjs scripts/test-timer-resume-endurance.cjs scripts/test-connectivity-probe.cjs scripts/test-native-mirror-memory.cjs scripts/test-month-cycle-ledger.cjs scripts/test-month-cycle-recovery.cjs scripts/test-month-cycle-integration.cjs scripts/test-month-cycle-foreground.cjs
      - run: yarn export:web
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [skeleton-test, java-accelerators, assembly-accelerators, school-jeeves-test, cockpit-smoke, backend-test, backend-import-smoke, frontend]
    # Build-only image validation. Publishing belongs to the release workflows,
    # so this lane never pushes and needs no packages:write or secrets. Skipped
    # (change-scoped) upstream jobs are fine; any failure blocks the build.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 2}
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && git rev-parse --verify -q HEAD^2 >/dev/null \
            && ! git diff --name-only HEAD^1 HEAD | grep -Eq '(^|/)Dockerfile|^\.dockerignore|compose[^/]*\.ya?ml$|^\.github/workflows/ci\.yml$'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          target: production
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
