# ============================================================================
# Tutolage CI/CD Pipeline
# ============================================================================
name: CI/CD
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
permissions:
  contents: read
jobs:
  backend-lint:
    name: "Backend Lint"
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ./backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: uv tool install ruff
      - run: uvx ruff check .
      - run: uvx ruff format --check .
  skeleton-test:
    name: "Skeleton GameForge"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Test forge / jeeves / context
        env: {PYTHONPATH: "."}
        run: |
          python -m compileall -q skeleton
          python tests/run_unit.py
          python -m skeleton eras
          python -m skeleton plan "soulslike extraction with bonfire rest"
          python -m skeleton cockpit "BLEND ERA arcade_golden_age soulslike 0.5"
          python -m skeleton walk --era soulslike
  school-jeeves-test:
    name: "Jeeves School Reasoning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile school package
        run: python -m compileall -q skeleton/school
      - name: Run focused reasoning suite
        env: {PYTHONPATH: "."}
        run: python -m pytest -q tests/test_jeeves_reasoning_stack.py
  cockpit-smoke:
    name: "Cockpit Smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env: {PYTHONPATH: "."}
        run: chmod +x scripts/cockpit-smoke.sh && ./scripts/cockpit-smoke.sh
  backend-test:
    name: "Backend Test"
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults: {run: {working-directory: ./backend}}
    services:
      mongodb:
        image: mongo:7.0
        ports: [27017:27017]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          uv venv
          uv pip install -e ".[test]"
      - env: {MONGO_URL: mongodb://localhost:27017/test}
        run: uv run pytest tests/ -v --cov=. --cov-report=xml
      - uses: codecov/codecov-action@v4
        with: {files: ./backend/coverage.xml, fail_ci_if_error: false}
  frontend:
    name: "Frontend"
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ./frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: yarn install --frozen-lockfile || yarn install
      - run: yarn lint
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [skeleton-test]
    if: github.ref == 'refs/heads/main'
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE }}/backend:latest
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: ${{ env.IMAGE }}/frontend:latest
