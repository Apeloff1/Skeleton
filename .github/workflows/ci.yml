# ============================================================================
# Tutolage CI/CD Pipeline
# ============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ========================================
  # Backend: Lint
  # ========================================
  backend-lint:
    name: "Backend Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
        
      - name: Install ruff
        run: uv tool install ruff
        
      - name: Lint
        run: uvx ruff check .
        
      - name: Format check
        continue-on-error: true
        run: uvx ruff format --check . || true

  # ========================================
  # Backend: Test
  # ========================================
  backend-test:
    name: "Backend Test"
    runs-on: ubuntu-latest
    needs: backend-lint
    continue-on-error: true
    defaults:
      run:
        working-directory: ./backend
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
        
      - name: Install dependencies
        run: uv sync
        
      - name: Run tests
        env:
          MONGO_URL: mongodb://localhost:27017/test
        run: uv run pytest tests/ -v --cov=. --cov-report=xml
        
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false


  # ========================================
  # Skeleton GameForge (root package)
  # ========================================
  skeleton-test:
    name: "Skeleton GameForge"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test forge / jeeves / context
        env:
          PYTHONPATH: "."
        run: |
          python -m compileall -q skeleton
          python tests/run_unit.py
          python -m skeleton eras

  # ========================================
  # Frontend: Lint & Build
  # ========================================
  frontend:
    name: "Frontend"
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Lint
        run: yarn lint || true
        
      - name: Type check
        run: npx tsc --noEmit || true
        
      - name: Build web
        run: npx expo export --platform web || true

  # ========================================
  # Docker Build
  # ========================================
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
