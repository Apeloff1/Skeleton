# ============================================================================
# Tutolage CI/CD Pipeline
# ============================================================================
name: CI/CD
on:
  push:
    branches: [main, develop]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.github/workflows/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.github/workflows/**'
      - '.github/workflows/ci.yml'

# Collapse superseded validation for the same PR or branch so rapid pushes do
# not occupy runner capacity with stale commits. Workflow name keeps unrelated
# pipelines isolated while PR number/ref scopes cancellation to one change set.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11.16"
  NODE_VERSION: "24.20.0"
  PYTHONPATH: "${{ github.workspace }}"
permissions:
  contents: read
jobs:
  backend-lint:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: "Backend Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: ./backend}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Repository toolchain contract
        run: python ../scripts/check_toolchain_contract.py
      - name: Backend correctness lint
        run: uvx --from "ruff==0.9.10" ruff check . --output-format=github
      - name: Backend syntax compilation
        run: python -m compileall -q .
      - name: Process invocation safety gate
        run: python scripts/check_process_safety.py
  skeleton-test:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: "Skeleton GameForge"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Install Skeleton runtime slice
        run: python -m pip install "pytest>=8,<9" "fastapi>=0.110,<1" "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Test forge / jeeves / context
        env: {PYTHONPATH: "."}
        run: |
          set -euo pipefail
          python -m compileall -q skeleton
          python tests/run_unit.py
          python -m pytest -q \
            tests/test_run_unit_runner.py \
            tests/test_cortex_persistence_quality.py \
            skeleton/testing/test_swarm_ingress.py \
            skeleton/testing/test_swarm_policy_atomicity.py \
            skeleton/testing/test_swarm_policy_snapshots.py \
            skeleton/testing/test_swarm_tenant_broker.py \
            skeleton/testing/test_swarm_tenant_revival_guard.py \
            skeleton/testing/test_swarm_lease_rollback.py \
            skeleton/testing/test_swarm_hardened_numeric.py \
            skeleton/testing/test_swarm_rate_limit_refund.py \
            skeleton/testing/test_swarm_quota_validation.py \
            skeleton/testing/test_swarm_fairness_validation.py \
            skeleton/testing/test_swarm_checkpoint.py \
            skeleton/testing/test_swarm_checkpoint_integrity.py \
            skeleton/testing/test_swarm_tenant_checkpoint.py \
            skeleton/testing/test_swarm_recovery_manager.py \
            skeleton/testing/test_swarm_recovery_tenants.py \
            skeleton/testing/test_swarm_recovery_archive.py \
            skeleton/testing/test_swarm_recovery_archive_api.py \
            skeleton/testing/test_swarm_recovery_archive_publication.py \
            skeleton/testing/test_swarm_recovery_activation.py \
            skeleton/testing/test_swarm_restore_validation.py \
            skeleton/testing/test_swarm_restore_ordering.py \
            skeleton/testing/test_swarm_forget_retention.py \
            skeleton/testing/test_server_recovery_health.py \
            skeleton/testing/test_server_swarm_bundle.py \
            skeleton/testing/test_swarm_operator_tenant_recovery.py \
            skeleton/testing/test_swarm_operator_retention_api.py \
            skeleton/testing/test_swarm_operator_cutover_fencing.py
          python -m skeleton eras
          python -m skeleton plan "soulslike extraction with bonfire rest"
          python -m skeleton cockpit "BLEND ERA arcade_golden_age soulslike 0.5"
          python -m skeleton walk --era soulslike
  school-jeeves-test:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: "Jeeves School Reasoning"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Install focused test/runtime slice
        run: python -m pip install "pytest>=8,<9" "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Compile school package
        run: python -m compileall -q skeleton/school
      - name: Run focused reasoning suite
        env: {PYTHONPATH: "."}
        run: python -m pytest -q tests/test_jeeves_reasoning_stack.py
  cockpit-smoke:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: "Cockpit Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Install Skeleton runtime slice
        run: python -m pip install "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - env: {PYTHONPATH: "."}
        run: chmod +x scripts/cockpit-smoke.sh && ./scripts/cockpit-smoke.sh
  backend-test:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: "Backend Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-lint
    defaults: {run: {working-directory: ./backend}}
    services:
      mongodb:
        # Docker Official Image mongo:7.0.41, pinned to the multi-platform index digest.
        image: mongo@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0
        ports: [27017:27017]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: |
          uv venv
          uv pip install -r requirements.txt
          uv pip install "pytest>=8,<9" pytest-asyncio pytest-cov pytest-xdist
      - env: {MONGO_URL: mongodb://localhost:27017/test}
        run: uv run pytest tests/ -v --cov=. --cov-report=xml
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with: {files: ./backend/coverage.xml, fail_ci_if_error: false}
  backend-import-smoke:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: "Backend Import Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-lint
    defaults: {run: {working-directory: ./backend}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: |
          uv venv
          uv pip install -r requirements.txt
      - env:
          MONGO_URL: mongodb://localhost:27017/test
          SKIP_HEAVY_SEED: "true"
        run: |
          uv run python -c "import server; assert server.app is not None; print('server import: OK')"
  frontend:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: "Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: ./frontend}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies without third-party lifecycle scripts
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Apply reviewed local node_modules patches
        run: node ./scripts/patch-node-modules.js
      - run: yarn lint:ci
      - run: yarn typecheck
      - run: yarn export:web
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [skeleton-test, school-jeeves-test, cockpit-smoke, backend-test, backend-import-smoke, frontend]
    if: github.ref == 'refs/heads/main'
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}/backend:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          target: production
          push: true
          tags: ${{ env.IMAGE }}/frontend:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Verify published multi-arch manifests
        env:
          APP_IMAGE: ${{ env.IMAGE }}:latest
          BACKEND_IMAGE: ${{ env.IMAGE }}/backend:latest
          FRONTEND_IMAGE: ${{ env.IMAGE }}/frontend:latest
        run: |
          set -euo pipefail
          for image in "$APP_IMAGE" "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            docker buildx imagetools inspect "$image" | grep -q "linux/amd64"
            docker buildx imagetools inspect "$image" | grep -q "linux/arm64"
          done
