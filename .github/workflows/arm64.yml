name: ARM64 Ubuntu Validation

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/**"
      - "frontend/**"
      - "skeleton/**"
      - "!backend/tests/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - ".github/workflows/arm64.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
    paths:
      - "Dockerfile"
      - "backend/**"
      - "frontend/**"
      - "skeleton/**"
      - "!backend/tests/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - ".github/workflows/arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11.16"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  arm64:
    # Draft/close transitions are cancellation tombstones only. They still
    # enter the PR-number concurrency group so obsolete ARM work is evicted,
    # but they never consume the scarce recovery runner after cancellation.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       github.event.action != 'converted_to_draft' &&
       github.event.action != 'closed')
    name: Ubuntu ARM64 compatibility
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Verify native ARM64 userspace
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          python -c 'import platform; assert platform.machine() == "aarch64"'
          python --version

      - name: Install declared Skeleton runtime and test slice
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check . "pytest>=8,<9"

      - name: Compile ARM64 Python runtime
        run: python -m compileall -q skeleton

      - name: Build and self-test AArch64 Assembly kernels
        run: |
          set -euo pipefail
          python scripts/build_asm_accelerator.py \
            --output-dir "$RUNNER_TEMP/skeleton-asm" \
            --self-test \
            --json

      - name: Run AArch64 Assembly bridge tests
        env:
          SKELETON_ASM_CACHE_DIR: ${{ runner.temp }}/skeleton-asm
        run: |
          set -euo pipefail
          python -m pytest -q \
            skeleton/testing/test_asm_vector_accelerator.py \
            skeleton/testing/test_asm_vector_store.py \
            skeleton/testing/test_asm_c_abi.py \
            skeleton/testing/test_native_accelerator_registry.py
          python scripts/benchmark_asm_vector_accelerator.py \
            --library "$SKELETON_ASM_CACHE_DIR/libskeleton_asm_v4_aarch64.so" \
            --dimensions 33 \
            --rows 32 \
            --queries 3 \
            --iterations 1 \
            --warmup 0 \
            --json

      - name: Run ARM64 smoke tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python tests/run_unit.py
          python -m pytest -q \
            tests/test_run_unit_runner.py \
            tests/test_architecture_boundaries.py \
            tests/test_provider_runtime_boundary.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ARM64 Skeleton image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          tags: skeleton:arm64
          cache-from: type=gha,scope=arm64-skeleton
          cache-to: type=gha,mode=max,scope=arm64-skeleton

      - name: Build ARM64 backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./backend/Dockerfile
          target: production
          platforms: linux/arm64
          push: false
          tags: skeleton-backend:arm64
          cache-from: type=gha,scope=arm64-backend
          cache-to: type=gha,mode=max,scope=arm64-backend

      - name: Build ARM64 frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/arm64
          push: false
          tags: skeleton-frontend:arm64
          cache-from: type=gha,scope=arm64-frontend
          cache-to: type=gha,mode=max,scope=arm64-frontend
