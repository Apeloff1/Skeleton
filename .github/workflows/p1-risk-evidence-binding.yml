name: P1 Risk Evidence Binding Gate

on:
  push:
    branches:
      - main
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/ai_closure_evidence.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/contracts/risk_evidence.py"
      - "skeleton/ai/runtime/contracts/risk_evidence.py"
      - "skeleton/contracts/__init__.py"
      - "skeleton/ai/runtime/contracts/__init__.py"
      - "scripts/reconcile_p1_risk_evidence.py"
      - "skeleton/testing/test_risk_evidence.py"
      - "tests/test_p1_risk_evidence_reconciliation.py"
      - "tests/test_p1_release_gap_bindings_batch1.py"
      - "scripts/build_p1_control_plane_gap_evidence.py"
      - "tests/test_p1_control_plane_gap_evidence.py"
      - "tests/test_p1_control_plane_gap_bindings_batch2.py"
      - "scripts/build_p1_risk_classification_evidence_batch1.py"
      - "tests/test_p1_risk_classification_evidence_batch1.py"
      - "tests/test_p1_risk_classification_bindings_batch1.py"
      - ".github/workflows/p1-risk-evidence-binding.yml"
  pull_request:
    branches:
      - main
      - p1/release-lane-materialize-20260928
      - p1/risk-classification-evidence-batch1-20260930
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/ai_closure_evidence.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/contracts/risk_evidence.py"
      - "skeleton/ai/runtime/contracts/risk_evidence.py"
      - "skeleton/contracts/__init__.py"
      - "skeleton/ai/runtime/contracts/__init__.py"
      - "scripts/reconcile_p1_risk_evidence.py"
      - "skeleton/testing/test_risk_evidence.py"
      - "tests/test_p1_risk_evidence_reconciliation.py"
      - "tests/test_p1_release_gap_bindings_batch1.py"
      - "scripts/build_p1_control_plane_gap_evidence.py"
      - "tests/test_p1_control_plane_gap_evidence.py"
      - "tests/test_p1_control_plane_gap_bindings_batch2.py"
      - "scripts/build_p1_risk_classification_evidence_batch1.py"
      - "tests/test_p1_risk_classification_evidence_batch1.py"
      - "tests/test_p1_risk_classification_bindings_batch1.py"
      - ".github/workflows/p1-risk-evidence-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-risk-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate P1 risk and gap evidence binding
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused risk-evidence runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Validate canonical planning and closure inputs
        run: |
          set -euo pipefail
          python scripts/check_ai_master_plan.py
          python scripts/check_ai_p1_execution_map.py --print-summary
          python scripts/check_ai_adversarial_closure.py
          python scripts/verify_ai_accountability_closure_map.py

      - name: Run risk evidence regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_risk_evidence.py
          tests/test_p1_risk_evidence_reconciliation.py
          tests/test_p1_release_gap_bindings_batch1.py
          tests/test_p1_control_plane_gap_evidence.py
          tests/test_p1_control_plane_gap_bindings_batch2.py
          tests/test_p1_risk_classification_evidence_batch1.py
          tests/test_p1_risk_classification_bindings_batch1.py

      - name: Validate exact-head control-plane gap binding state
        run: |
          set -euo pipefail
          mkdir -p .p1-control-plane-gap
          python scripts/build_p1_control_plane_gap_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-control-plane-gap/report.json \
            --print-summary \
            --print-candidates
          python scripts/build_p1_control_plane_gap_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-control-plane-gap/replay.json
          cmp .p1-control-plane-gap/report.json .p1-control-plane-gap/replay.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".p1-control-plane-gap/report.json").read_text(encoding="utf-8")
          )
          if report["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("control-plane gap report is not exact-head bound")
          if report["covered_gap_count"] != 10:
              raise SystemExit("control-plane batch must cover exactly 10 gaps")
          if report["covered_volume_count"] != 5:
              raise SystemExit("control-plane batch must cover exactly 5 volumes")
          if report["already_bound_count"] != 10:
              raise SystemExit("control-plane batch must have exactly 10 governed bindings")
          if report["candidate_binding_count"] != 0:
              raise SystemExit("control-plane batch must have zero unbound candidates")
          if report["non_authoritative"] is not True:
              raise SystemExit("control-plane gap report became authoritative")
          for field in (
              "creates_bindings",
              "clears_masterplan_gaps",
              "signs_accountability",
              "promotes_maturity",
          ):
              if report[field] is not False:
                  raise SystemExit(f"authority-boundary drift: {field}")
          print("P1 control-plane gap binding state:", report["report_digest"])
          PY

      - name: Validate exact-head risk classification batch 1 binding state
        run: |
          set -euo pipefail
          mkdir -p .p1-risk-classification
          python scripts/build_p1_risk_classification_evidence_batch1.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-risk-classification/report.json \
            --print-summary \
            --print-candidates
          python scripts/build_p1_risk_classification_evidence_batch1.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-risk-classification/replay.json
          cmp .p1-risk-classification/report.json .p1-risk-classification/replay.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-risk-classification/report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["covered_risk_count"] != 12:
              raise SystemExit("classification batch must cover 12 risks")
          if report["covered_volume_count"] != 4:
              raise SystemExit("classification batch must cover 4 volumes")
          if report["already_bound_count"] != 12:
              raise SystemExit("classification batch must have 12 governed bindings")
          if report["candidate_binding_count"] != 0:
              raise SystemExit("classification batch must have zero candidates")
          if report["recommended_severity"] != "high":
              raise SystemExit("classification severity drifted")
          if report["recommended_disposition"] != "evidence":
              raise SystemExit("classification disposition drifted")
          for field in (
              "creates_bindings",
              "accepts_risk",
              "lowers_severity",
              "clears_source_risks",
              "promotes_maturity",
          ):
              if report[field] is not False:
                  raise SystemExit(f"classification authority drift: {field}")
          for row in report["records"]:
              if not row["binding_present"]:
                  raise SystemExit(
                      "classified risk binding missing: " + row["obligation_id"]
                  )
          print(
              "P1 risk classification batch 1:",
              report["report_digest"],
          )
          PY

      - name: Reconcile exact-head P1 risk evidence inventory
        run: |
          set -euo pipefail
          mkdir -p .p1-risk-evidence
          EVALUATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s' "$EVALUATED_AT" > .p1-risk-evidence/evaluated-at.txt
          python scripts/reconcile_p1_risk_evidence.py \
            --evaluated-at "$EVALUATED_AT" \
            --out .p1-risk-evidence/report.json \
            --print-summary

      - name: Assert non-authoritative inventory and deterministic replay
        run: |
          set -euo pipefail
          EVALUATED_AT="$(cat .p1-risk-evidence/evaluated-at.txt)"
          python scripts/reconcile_p1_risk_evidence.py \
            --evaluated-at "$EVALUATED_AT" \
            --out .p1-risk-evidence/replay.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".p1-risk-evidence/report.json").read_text(encoding="utf-8")
          )
          replay = json.loads(
              Path(".p1-risk-evidence/replay.json").read_text(encoding="utf-8")
          )
          if report != replay:
              raise SystemExit("risk reconciliation replay is not deterministic")
          if report["non_authoritative"] is not True:
              raise SystemExit("risk reconciliation became authoritative")
          if report["source_mutation_detected"] is not False:
              raise SystemExit("risk reconciliation mutated canonical sources")
          expected = {
              "p1_primary_volume_count": 107,
              "volume_risk_count": 281,
              "volume_gap_count": 208,
              "applicable_adversarial_axis_count": 24,
              "total_obligation_count": 513,
          }
          if report["inventory"] != expected:
              raise SystemExit(
                  "risk obligation inventory drift: "
                  + repr(report["inventory"])
              )
          if report["binding_count"] != 507:
              raise SystemExit("unexpected governed risk binding count")
          if report["resolved_count"] != 507:
              raise SystemExit("unexpected resolved risk obligation count")
          if report["unresolved_blocking_count"] != 6:
              raise SystemExit("unexpected unresolved blocking obligation count")
          if report["unclassified_count"] != 0:
              raise SystemExit("unexpected unclassified risk count")
          if report["disposition_counts"] != {
              "evidence": 507,
              "unbound": 6,
          }:
              raise SystemExit(
                  "unexpected risk disposition counts: "
                  + repr(report["disposition_counts"])
              )
          if len(report.get("report_digest", "")) != 64:
              raise SystemExit("invalid risk reconciliation report digest")
          if len(os.environ["EXPECTED_SHA"]) != 40:
              raise SystemExit("invalid exact-head identity")
          print(
              "P1 risk evidence inventory OK:",
              os.environ["EXPECTED_SHA"],
              report["report_digest"],
          )
          PY

      - name: Emit exact-head EVID-04 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  path = Path(name)
                  h.update(name.encode("utf-8"))
                  h.update(b"\0")
                  h.update(path.read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          report = json.loads(
              Path(".p1-risk-evidence/report.json").read_text(encoding="utf-8")
          )
          refs = [
              {
                  "source": "machine/p1_risk_evidence_policy.json",
                  "digest": hashlib.sha256(
                      Path("machine/p1_risk_evidence_policy.json").read_bytes()
                  ).hexdigest(),
                  "category": "risk_policy",
              },
              {
                  "source": "machine/p1_risk_evidence_bindings.json",
                  "digest": hashlib.sha256(
                      Path("machine/p1_risk_evidence_bindings.json").read_bytes()
                  ).hexdigest(),
                  "category": "risk_binding_registry",
              },
              {
                  "source": "p1:risk-reconciliation-report",
                  "digest": report["report_digest"],
                  "category": "risk_reconciliation",
              },
          ]
          Path(".p1-risk-evidence/refs.json").write_text(
              json.dumps(refs, sort_keys=True),
              encoding="utf-8",
          )
          Path(".p1-risk-evidence/config.digest").write_text(
              digest(
                  [
                      "machine/p1_risk_evidence_policy.json",
                      "machine/p1_risk_evidence_bindings.json",
                      "machine/ai_p1_execution_map.json",
                  ]
              ),
              encoding="utf-8",
          )
          Path(".p1-risk-evidence/environment.digest").write_text(
              hashlib.sha256(b"ubuntu-24.04|python-3.11.16").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-risk-evidence/verifier.digest").write_text(
              digest(
                  [
                      "scripts/reconcile_p1_risk_evidence.py",
                      "scripts/build_p1_control_plane_gap_evidence.py",
                      "scripts/build_p1_risk_classification_evidence_batch1.py",
                      "skeleton/contracts/risk_evidence.py",
                  ]
              ),
              encoding="utf-8",
          )
          Path(".p1-risk-evidence/tests.digest").write_text(
              digest(
                  [
                      "skeleton/testing/test_risk_evidence.py",
                      "tests/test_p1_risk_evidence_reconciliation.py",
                      "tests/test_p1_release_gap_bindings_batch1.py",
                      "tests/test_p1_control_plane_gap_evidence.py",
                      "tests/test_p1_control_plane_gap_bindings_batch2.py",
                      "tests/test_p1_risk_classification_evidence_batch1.py",
                      "tests/test_p1_risk_classification_bindings_batch1.py",
                  ]
              ),
              encoding="utf-8",
          )
          PY
          python scripts/emit_p1_promotion_evidence.py             --repository Apeloff1/Skeleton             --commit-sha "$EXPECTED_SHA"             --expected-head "$EXPECTED_SHA"             --task-id P1-EVID-04             --accountability-id ACC-P1-EVID-04             --configuration-digest "$(cat .p1-risk-evidence/config.digest)"             --environment-digest "$(cat .p1-risk-evidence/environment.digest)"             --verifier-id github-actions:p1-risk-evidence-binding             --verifier-digest "$(cat .p1-risk-evidence/verifier.digest)"             --test-manifest-digest "$(cat .p1-risk-evidence/tests.digest)"             --run-id "$RUN_IDENTITY"             --run-attempt "$RUN_ATTEMPT"             --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --evidence-file .p1-risk-evidence/refs.json             --out .p1-risk-evidence/receipt.json             > .p1-risk-evidence/stdout.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-risk-evidence/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("EVID-04 receipt does not bind exact head")
          if receipt["task_id"] != "P1-EVID-04":
              raise SystemExit("EVID-04 receipt task identity drift")
          if receipt["accountability_id"] != "ACC-P1-EVID-04":
              raise SystemExit("EVID-04 receipt accountability identity drift")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print(
              "P1-EVID-04 evidence receipt OK:",
              receipt["subject_digest"],
              receipt["receipt_digest"],
          )
          PY

      - name: Prove strict terminal mode fails closed while work is unresolved
        run: |
          set -euo pipefail
          EVALUATED_AT="$(cat .p1-risk-evidence/evaluated-at.txt)"
          if python scripts/reconcile_p1_risk_evidence.py \
            --evaluated-at "$EVALUATED_AT" \
            --require-resolved; then
            echo "strict risk promotion unexpectedly accepted unresolved work" >&2
            exit 1
          fi
          echo "Strict terminal mode correctly rejected unresolved P1 risk work."
