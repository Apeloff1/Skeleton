name: P0 Process Environment Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/sandbox/process.py"
      - "skeleton/ai/runtime/sandbox/process.py"
      - "skeleton/testing/test_sandbox_isolation.py"
      - "machine/ai_file_tree.json"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - "machine/backlog_registry.json"
      - ".github/workflows/p0-process-environment-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-environment-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify sandbox process mirror
        run: cmp skeleton/sandbox/process.py skeleton/ai/runtime/sandbox/process.py
      - name: Run process boundary regressions
        run: python -m pytest -q skeleton/testing/test_sandbox_isolation.py
