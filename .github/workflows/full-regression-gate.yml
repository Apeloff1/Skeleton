# Full regression and quality gate for the integrated app.
# New workflow only; does not edit merge-readiness.yml, ci.yml,
# backend-quality.yml, or queue-drain.yml.
#
# Verified against main c7e29744eb01e426c2cba8f1777a0ec785299ba3:
#   - Python 3.11.16 is the CI/tooling pin in merge-readiness.yml and ci.yml.
#     pyproject.toml and backend/pyproject.toml target 3.11 (requires-python >=3.11;
#     backend/pyproject.toml: "Canonical backend runtime/tooling baseline: Python 3.11").
#     backend/Dockerfile uses python:3.14-alpine for the production image only.
#   - Node 24.20.0 is the pin in merge-readiness.yml / ci.yml; no .nvmrc exists.
#     frontend/package.json engines.node is ">=24"; packageManager is yarn@1.22.22;
#     frontend/yarn.lock is the lockfile (no package-lock.json, no root package.json).
#   - Ruff 0.17.2 is configured in backend/pyproject.toml and requirements-dev.txt
#     (ruff>=0.17.2,<0.18) and is what existing gates install.
#   - live_service is registered in backend/pyproject.toml [tool.pytest.ini_options].markers.
#     No pytest.ini exists at the repo root.
#   - frontend lint:ci and test:* scripts exist in frontend/package.json.
#   - There is no root-level node --test suite (no root package.json).
name: Full Regression Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11.16"
  NODE_VERSION: "24.20.0"
  PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/backend"

jobs:
  head-sha:
    name: Head SHA pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert HEAD equals the candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "${EXPECTED_SHA}"
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${actual}"
          test "${actual}" = "${EXPECTED_SHA}"

  python-regression:
    name: Python regression
    needs: head-sha
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert HEAD equals the candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Set up Python 3.11.16
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            pyproject.toml
            backend/requirements.txt
      - name: Install dependencies from the repository requirements files
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check "ruff==0.17.2" "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
      - name: Ruff on skeleton, tests, and backend
        run: python -m ruff check skeleton tests backend
      - name: Pytest on tests, skeleton/testing, and backend/tests
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/backend"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # live_service is registered in backend/pyproject.toml; exclude it so
          # this gate does not require a separately running service. Register
          # the marker here because the root pyproject.toml does not list it.
          # Each tree has its own package namespace. Collecting all three in one
          # pytest process can import a different 'tests' package first and
          # make otherwise valid tests.* modules unimportable.
          # Keep the three scopes mandatory, with separate JUnit receipts.
          suite_failures=0
          for suite in tests skeleton/testing backend/tests; do
            report="${suite//\//-}"
            # backend/tests imports tests.* from backend/tests; root/tests also
            # owns the tests package. Give the backend tree precedence only for
            # that suite, without changing the root/skeleton import contract.
            suite_pythonpath="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/backend"
            if [[ "${suite}" == "backend/tests" ]]; then
              suite_pythonpath="${GITHUB_WORKSPACE}/backend:${GITHUB_WORKSPACE}"
            fi
            # Use the pytest console entrypoint: python -m pytest prepends the
            # root working directory to sys.path, defeating backend-first
            # PYTHONPATH when both root/tests and backend/tests exist.
            # Keep collecting independent trees even when one fails, so each
            # mandatory scope produces its own diagnostic and JUnit artifact.
            if ! PYTHONPATH="${suite_pythonpath}" pytest -q --tb=short \
              --junitxml="artifacts/python-regression-${report}.junit.xml" \
              -o "markers=live_service: requires a separately running or remote backend service" \
              -m "not live_service" \
              "${suite}"; then
              echo "::error title=Python regression failed::${suite} failed; see its JUnit report"
              suite_failures=$((suite_failures + 1))
            fi
          done
          if (( suite_failures > 0 )); then
            echo "::error title=Python regression suites failed::${suite_failures} suite(s) failed"
            exit 1
          fi
      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-regression-junit
          path: artifacts/python-regression-*.junit.xml
          if-no-files-found: error

  node-regression:
    name: Node regression
    needs: head-sha
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Check out the candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert HEAD equals the candidate SHA
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Set up Node 24.20.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies from yarn.lock
        run: yarn install --ignore-scripts --non-interactive --frozen-lockfile
      - name: Apply reviewed local node_modules patches
        run: node ./scripts/patch-node-modules.js
      - name: Frontend lint:ci
        run: yarn lint:ci
      - name: Frontend typecheck
        run: yarn typecheck
      - name: Frontend package.json test scripts
        run: |
          set -euo pipefail
          # Every test:* script declared in frontend/package.json on main.
          # Fail closed on the first failure; do not continue-on-error.
          scripts=(
            test:env
            test:known-advisories
            test:deepmerge-security
            test:foundation-tokens
            test:metro-env-cache
            test:canonical-theme
            test:accessibility
            test:localization
            test:operation-stream
            test:conversation
            test:auth-transport
            test:playable-preview
            test:private-media
            test:creator-identity
            test:product-projection
            test:product-journeys
            test:app-foundation
            test:app-foundation:render
            test:build-lifecycle
            test:knowledge-experience
            test:world-workbench
            test:design-review
            test:story-continuity
            test:jeeves
            test:skeleton-forge
            test:forge-operator
            test:dragon-wire
            test:dragon-companion
            test:dragon-native-editor
            test:frontier-nav
            test:stability:reconciliation
            test:stability
          )
          for script in "${scripts[@]}"; do
            echo "::group::yarn ${script}"
            yarn "${script}"
            echo "::endgroup::"
          done
      - name: Additional node --test contracts from Lint Type Security
        run: >-
          node --test
          scripts/test-secure-session-identifiers.cjs
          scripts/test-quickwins-prototype-guard.cjs
          scripts/test-telemetry-privacy.cjs
          scripts/test-telemetry-batch-admission.cjs
          scripts/test-wasm-origin-execution-boundary.cjs

  gate:
    name: Full regression gate
    needs: [head-sha, python-regression, node-regression]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          HEAD_SHA_RESULT: ${{ needs.head-sha.result }}
          PYTHON_RESULT: ${{ needs.python-regression.result }}
          NODE_RESULT: ${{ needs.node-regression.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys

          results = {
              "head-sha": os.environ["HEAD_SHA_RESULT"],
              "python-regression": os.environ["PYTHON_RESULT"],
              "node-regression": os.environ["NODE_RESULT"],
          }
          failures = {
              name: result
              for name, result in results.items()
              if result != "success"
          }
          for name, result in sorted(results.items()):
              print(f"{name}={result}")
          if failures:
              detail = ", ".join(f"{name}={result}" for name, result in failures.items())
              print(f"FULL REGRESSION GATE FAILED: {detail}", file=sys.stderr)
              print("skipped is not a pass", file=sys.stderr)
              raise SystemExit(1)
          print("FULL REGRESSION GATE PASSED: every required job succeeded")
          PY
