name: Game AI Reviewer Promotion
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-model-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  model-ladder:
    name: Exact-head promotion, rollback and fault injection (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      EXACT_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: No-credentials exact-head sparse checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_reviewer_promotion.py
            tests/test_game_builder_model_cli.py
            tests/test_game_builder_learning_challenges.py
            tests/test_game_builder_reviewer_v2.py
            tests/test_game_builder_optimizer_and_wisdom.py
            tests/test_game_builder_knowledge_rights_bridge.py
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Compile and verify source custody
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          python -m compileall -q skeleton/ai/game_builder
      - name: Evaluate actual isolated model, independent approvals, usage and idle cohorts
        shell: bash
        run: |
          python -m unittest tests.test_game_builder_reviewer_promotion tests.test_game_builder_model_cli tests.test_game_builder_learning_challenges tests.test_game_builder_reviewer_v2 tests.test_game_builder_optimizer_and_wisdom -v
