name: AI Mirror Room Core

on:
  pull_request:
    paths:
      - "skeleton/learning/mirror_room/**"
      - "skeleton/ai/learning/mirror_room/**"
      - "skeleton/testing/test_mirror_room_core.py"
      - "skeleton/eval/experiment_registry.py"
      - "skeleton/contracts/canonical.py"
      - ".github/workflows/mirror-room-core.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/learning/mirror_room/**"
      - "skeleton/ai/learning/mirror_room/**"
      - "skeleton/testing/test_mirror_room_core.py"
      - "skeleton/eval/experiment_registry.py"
      - "skeleton/contracts/canonical.py"
      - ".github/workflows/mirror-room-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-mirror-room-core-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mirror-room-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic>=2.6,<3"
          "pydantic-settings>=2.1,<3"
      - name: Verify canonical and AI mirrors
        run: |
          for name in __init__.py contracts.py sandbox.py evaluation.py curriculum.py integrity.py engine.py promotion.py; do
            cmp "skeleton/learning/mirror_room/$name" "skeleton/ai/learning/mirror_room/$name"
          done
      - name: Compile Mirror Room core
        run: >-
          python -m compileall -q
          skeleton/learning/mirror_room
          skeleton/ai/learning/mirror_room
      - name: Run bounded Mirror Room acceptance
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_mirror_room_core.py
