name: P1 Tenant Storage Boundary Gate

on:
  push:
    branches:
      - main
    paths:
      - "backend/core/tenant_storage_boundary.py"
      - "machine/ai_p1_task_backlog.json"
      - "backend/tests/test_tenant_storage_boundary.py"
      - "frontend/src/product/tenantStorageBoundary.ts"
      - "frontend/src/auth/gameforgeAuth.ts"
      - "frontend/scripts/test-tenant-storage-boundary.mjs"
      - ".github/workflows/p1-tenant-storage-boundary.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/core/tenant_storage_boundary.py"
      - "machine/ai_p1_task_backlog.json"
      - "backend/tests/test_tenant_storage_boundary.py"
      - "frontend/src/product/tenantStorageBoundary.ts"
      - "frontend/src/auth/gameforgeAuth.ts"
      - "frontend/scripts/test-tenant-storage-boundary.mjs"
      - ".github/workflows/p1-tenant-storage-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-tenant-storage-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Validate tenant and storage boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "pytest>=8,<9"

      - name: Compile PROD-05 contract
        run: >-
          python -m compileall -q
          backend/core/tenant_storage_boundary.py

      - name: Run tenant storage regressions
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_tenant_storage_boundary.py

      - name: Build accepted PROD-05 storage receipt
        run: |
          set -euo pipefail
          mkdir -p .p1-prod-05
          python - <<'PY'
          import json
          from pathlib import Path

          from core.tenant_storage_boundary import (
              StorageDataClass,
              StoragePermission,
              StorageSurface,
              TenantStorageContext,
              require_tenant_storage,
          )

          context = TenantStorageContext(
              tenant_id="ci-tenant",
              principal_id="ci-principal",
              granted_permissions=("read", "write", "delete"),
              data_class=StorageDataClass.TENANT_CACHE,
              surface=StorageSurface.DEVICE_CACHE,
              purpose="jeeves-workspace",
          )
          decision = require_tenant_storage(
              context=context,
              verified_tenant_id=context.tenant_id,
              requested_permission=StoragePermission.WRITE,
          )
          evidence = decision.accepted_evidence_ref()
          Path(".p1-prod-05/decision.json").write_text(
              json.dumps(decision.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-prod-05/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head PROD-05 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-prod-05/config.digest").write_text(
              hashlib.sha256(
                  b"p1-prod-05-tenant-storage-boundary-v1"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-prod-05/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|node-24|prod-05"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-prod-05/verifier.digest").write_text(
              digest([
                  "backend/core/tenant_storage_boundary.py",
                  "frontend/src/product/tenantStorageBoundary.ts",
                  "frontend/src/auth/gameforgeAuth.ts",
                  ".github/workflows/p1-tenant-storage-boundary.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-prod-05/tests.digest").write_text(
              digest([
                  "backend/tests/test_tenant_storage_boundary.py",
                  "frontend/scripts/test-tenant-storage-boundary.mjs",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-PROD-05 \
            --accountability-id ACC-P1-PROD-05 \
            --configuration-digest "$(cat .p1-prod-05/config.digest)" \
            --environment-digest "$(cat .p1-prod-05/environment.digest)" \
            --verifier-id github-actions:p1-tenant-storage-boundary \
            --verifier-digest "$(cat .p1-prod-05/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-prod-05/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-prod-05/refs.json \
            --out .p1-prod-05/receipt.json \
            > .p1-prod-05/stdout.json

      - name: Assert exact-head PROD-05 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-prod-05/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("PROD-05 receipt head mismatch")
          if receipt["task_id"] != "P1-PROD-05":
              raise SystemExit("PROD-05 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-PROD-05":
              raise SystemExit("PROD-05 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("PROD-05 exact-head receipt OK", receipt["receipt_digest"])
          PY

  frontend:
    name: Validate web and desktop tenant cache boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies without lifecycle scripts
        working-directory: frontend
        run: yarn install --ignore-scripts

      - name: Apply reviewed local patches
        working-directory: frontend
        run: node ./scripts/patch-node-modules.js

      - name: Run tenant cache isolation tests
        working-directory: frontend
        run: node --test scripts/test-tenant-storage-boundary.mjs

      - name: Typecheck tenant boundary integration
        working-directory: frontend
        run: yarn typecheck
