name: CS-300 Computer Science Authority

on:
  pull_request:
    branches: [main, codex/masterplan-frontier-96]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cs-300-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-cs-300:
    name: Validate CS-300 frontier ladder
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          "pytest>=8,<9"

      - name: Compile CS-300 validator
        run: >-
          python -m py_compile
          scripts/check_cs_300_ladder.py
          tests/test_cs_300_ladder.py

      - name: Validate CS-300 machine authority
        run: python scripts/check_cs_300_ladder.py

      - name: Run CS-300 regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_cs_300_ladder.py

      - name: Validate canonical masterplan and parse-index freshness
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          master_path = Path("machine/ai_master_plan.json")
          index_path = Path("machine/ai_masterplan_parse_index.json")

          master = json.loads(master_path.read_text(encoding="utf-8"))
          index = json.loads(index_path.read_text(encoding="utf-8"))
          assert tuple(int(part) for part in master["plan_version"].split(".")) >= (2, 5, 0)
          assert master["authority"]["cs_300_ladder"] == "machine/cs_300_computer_science_ladder.json"

          expected = index["sources"]["machine/ai_master_plan.json"]["git_blob_sha"]
          actual = subprocess.check_output(
              ["git", "hash-object", str(master_path)], text=True
          ).strip()
          assert actual == expected, (actual, expected)
          print("masterplan parse-index fresh", actual)
          PY

      - name: Confirm exact-head identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          ladder = json.loads(
              Path("machine/cs_300_computer_science_ladder.json").read_text(
                  encoding="utf-8"
              )
          )
          print(
              "cs-300",
              "layers=", len(ladder["layers"]),
              "strata=", len(ladder["strata"]),
              "signed_complete=", ladder["completion"]["signed_complete"],
              "head=", os.environ["EXPECTED_SHA"],
          )
          PY
