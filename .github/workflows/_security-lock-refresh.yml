name: Temporary security lock refresh

on:
  push:
    branches:
      - security/frontend-dependency-hardening-2026-09-15

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/frontend-dependency-hardening-2026-09-15
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Upgrade vulnerable packages within existing semver contracts
        working-directory: frontend
        run: yarn upgrade --pattern "shell-quote|tar|brace-expansion|postcss|form-data|undici|js-yaml|ws|axios|nanoid|browserslist|@xmldom/xmldom|node-fetch" --ignore-scripts --non-interactive
      - name: Verify lockfile
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/yarn.lock frontend/package.json
          git rm .github/workflows/_security-lock-refresh.yml
          git commit -m "security: refresh vulnerable frontend transitive dependencies" || exit 0
          git push origin HEAD:security/frontend-dependency-hardening-2026-09-15
