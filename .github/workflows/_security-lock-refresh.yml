name: Temporary security lock refresh

on:
  push:
    branches:
      - security/frontend-dependency-hardening-2026-09-15

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/frontend-dependency-hardening-2026-09-15
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Commit regenerated lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/yarn.lock
          git rm .github/workflows/_security-lock-refresh.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            git reset -- .github/workflows/_security-lock-refresh.yml
            exit 0
          fi
          git commit -m "security: refresh vulnerable frontend transitive dependencies"
          git push origin HEAD:security/frontend-dependency-hardening-2026-09-15
