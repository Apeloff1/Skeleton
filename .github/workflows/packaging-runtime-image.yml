name: Packaging and Runtime Image Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "pyproject.toml"
      - "setup.cfg"
      - "skeleton/developer/cli.py"
      - "skeleton/native/**"
      - "skeleton/testing/test_packaging_contract.py"
      - ".github/workflows/packaging-runtime-image.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "pyproject.toml"
      - "setup.cfg"
      - "skeleton/developer/cli.py"
      - "skeleton/native/**"
      - "skeleton/testing/test_packaging_contract.py"
      - ".github/workflows/packaging-runtime-image.yml"

permissions:
  contents: read

concurrency:
  group: packaging-runtime-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaging-contract:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install package and focused test dependency
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9"
      - name: Enforce packaging and runtime-image contracts
        run: python -m pytest -q skeleton/testing/test_packaging_contract.py
      - name: Verify native Assembly payload in wheel
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheel" .
          python - <<'PY'
          import glob
          import os
          import zipfile

          wheels = glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "wheel", "*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "skeleton/native/asm/x86_64.S",
              "skeleton/native/asm/aarch64.S",
              "skeleton/native/asm/skeleton_asm.h",
              "skeleton/native/asm/README.md",
          }
          missing = sorted(required - names)
          assert not missing, f"native package data missing from wheel: {missing}"
          print("native-wheel-payload: OK")
          PY

  docker-builds:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build root runtime image without publishing
        run: docker build --file Dockerfile .
      - name: Build backend production image without publishing
        run: docker build --file backend/Dockerfile --target production .
      - name: Build frontend production image without publishing
        run: docker build --file frontend/Dockerfile --target production frontend
