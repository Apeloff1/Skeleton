name: Packaging and Runtime Image Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "pyproject.toml"
      - "setup.cfg"
      - "skeleton/developer/cli.py"
      - "skeleton/testing/test_packaging_contract.py"
      - ".github/workflows/packaging-runtime-image.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "pyproject.toml"
      - "setup.cfg"
      - "skeleton/developer/cli.py"
      - "skeleton/testing/test_packaging_contract.py"
      - ".github/workflows/packaging-runtime-image.yml"

permissions:
  contents: read

concurrency:
  group: packaging-runtime-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Enforce packaging and runtime-image contracts
        run: python -m pytest -q skeleton/testing/test_packaging_contract.py

  docker-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build root runtime image without publishing
        run: docker build --file Dockerfile .
      - name: Build backend production image without publishing
        run: docker build --file backend/Dockerfile --target production .
      - name: Build frontend production image without publishing
        run: docker build --file frontend/Dockerfile --target production frontend
