name: AI Evidence Runtime Attestation Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/ai/learning/__init__.py"
      - "skeleton/learning/__init__.py"
      - "skeleton/ai/learning/audit_chain.py"
      - "skeleton/learning/audit_chain.py"
      - "skeleton/ai/learning/evidence.py"
      - "skeleton/learning/evidence.py"
      - "skeleton/ai/learning/school/decision_ledger.py"
      - "skeleton/learning/school/decision_ledger.py"
      - "skeleton/ai/learning/school/runtime_replay.py"
      - "skeleton/learning/school/runtime_replay.py"
      - "skeleton/ai/learning/school/runtime_capsule.py"
      - "skeleton/learning/school/runtime_capsule.py"
      - "skeleton/ai/learning/school/runtime_attestation.py"
      - "skeleton/learning/school/runtime_attestation.py"
      - "skeleton/testing/test_learning_audit_chain.py"
      - "skeleton/testing/test_learning_evidence.py"
      - "tests/test_runtime_replay.py"
      - "tests/test_runtime_capsule.py"
      - "tests/test_ai_evidence_runtime_attestation_integrity.py"
      - ".github/workflows/ai-evidence-runtime-attestation-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/ai/learning/__init__.py"
      - "skeleton/learning/__init__.py"
      - "skeleton/ai/learning/audit_chain.py"
      - "skeleton/learning/audit_chain.py"
      - "skeleton/ai/learning/evidence.py"
      - "skeleton/learning/evidence.py"
      - "skeleton/ai/learning/school/decision_ledger.py"
      - "skeleton/learning/school/decision_ledger.py"
      - "skeleton/ai/learning/school/runtime_replay.py"
      - "skeleton/learning/school/runtime_replay.py"
      - "skeleton/ai/learning/school/runtime_capsule.py"
      - "skeleton/learning/school/runtime_capsule.py"
      - "skeleton/ai/learning/school/runtime_attestation.py"
      - "skeleton/learning/school/runtime_attestation.py"
      - "skeleton/testing/test_learning_audit_chain.py"
      - "skeleton/testing/test_learning_evidence.py"
      - "tests/test_runtime_replay.py"
      - "tests/test_runtime_capsule.py"
      - "tests/test_ai_evidence_runtime_attestation_integrity.py"
      - ".github/workflows/ai-evidence-runtime-attestation-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-evidence-runtime-attestation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          "pytest>=8,<9"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"

      - name: Verify exact head and full PR diff
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          BASE="$(git merge-base HEAD origin/main)"
          test -n "$BASE"
          git diff --check "$BASE" HEAD

      - name: Compile evidence and runtime surfaces
        run: >-
          python -m py_compile
          skeleton/ai/learning/audit_chain.py
          skeleton/learning/audit_chain.py
          skeleton/ai/learning/evidence.py
          skeleton/learning/evidence.py
          skeleton/ai/learning/school/decision_ledger.py
          skeleton/learning/school/decision_ledger.py
          skeleton/ai/learning/school/runtime_replay.py
          skeleton/learning/school/runtime_replay.py
          skeleton/ai/learning/school/runtime_capsule.py
          skeleton/learning/school/runtime_capsule.py
          skeleton/ai/learning/school/runtime_attestation.py
          skeleton/learning/school/runtime_attestation.py
          skeleton/testing/test_learning_audit_chain.py
          skeleton/testing/test_learning_evidence.py
          tests/test_runtime_replay.py
          tests/test_runtime_capsule.py
          tests/test_ai_evidence_runtime_attestation_integrity.py

      - name: Verify canonical namespace parity
        run: |
          python - <<'PY'
          from pathlib import Path

          pairs = (
              ("skeleton/ai/learning/audit_chain.py", "skeleton/learning/audit_chain.py"),
              ("skeleton/ai/learning/evidence.py", "skeleton/learning/evidence.py"),
              ("skeleton/ai/learning/school/decision_ledger.py", "skeleton/learning/school/decision_ledger.py"),
              ("skeleton/ai/learning/school/runtime_replay.py", "skeleton/learning/school/runtime_replay.py"),
              ("skeleton/ai/learning/school/runtime_capsule.py", "skeleton/learning/school/runtime_capsule.py"),
              ("skeleton/ai/learning/school/runtime_attestation.py", "skeleton/learning/school/runtime_attestation.py"),
          )
          for canonical, compatibility in pairs:
              left = Path(canonical).read_bytes()
              right = Path(compatibility).read_bytes()
              assert left == right, f"namespace drift: {canonical} != {compatibility}"
              print("namespace parity", canonical, len(left), "bytes")
          PY

      - name: Run legacy evidence and runtime contracts
        run: >-
          python -m pytest -q
          skeleton/testing/test_learning_audit_chain.py
          skeleton/testing/test_learning_evidence.py
          tests/test_runtime_replay.py
          tests/test_runtime_capsule.py

      - name: Run cross-plane evidence attestation regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_ai_evidence_runtime_attestation_integrity.py

      - name: Assert fail-closed evidence drift path
        run: |
          python - <<'PY'
          from skeleton.ai.learning.school.decision_ledger import (
              DecisionDisposition,
              DecisionLedger,
              EvidenceKind,
              EvidenceRef,
          )
          from skeleton.ai.learning.school.runtime_replay import (
              RuntimeReplaySnapshot,
              audit_runtime,
          )
          from skeleton.ai.learning.school.session_runtime import (
              SessionEvent,
              SessionPhase,
          )

          ledger = DecisionLedger()
          ledger.register_evidence(
              EvidenceRef("e1", EvidenceKind.OBSERVATION, "skill", "before", 1.0, "ci")
          )
          ledger.append(
              session_id="ci",
              decision_id="ci:orient",
              domain="session_runtime",
              action="practice",
              evidence=("e1",),
              disposition=DecisionDisposition.ACCEPTED,
          )
          snapshot = RuntimeReplaySnapshot.capture_verified(
              session_id="ci",
              phase=SessionPhase.DIAGNOSE,
              events=(SessionEvent(1, SessionPhase.INTAKE, "session_opened"),),
              selected_policy="practice",
              selected_policy_decision_id="ci:orient",
              rejected_policies=(),
              ledger=ledger,
          )
          ledger.evidence["e1"] = EvidenceRef(
              "e1", EvidenceKind.OBSERVATION, "skill", "after", 1.0, "ci"
          )
          audit = audit_runtime(snapshot, ledger)
          if audit.valid:
              raise SystemExit("evidence drift unexpectedly preserved runtime validity")
          print("fail-closed evidence drift path verified")
          PY
