    branches:
      - feat/sealed-context-sandwich-v1-20261027
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sealed-context-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-inference-guard:
    name: Exact-head local inference and delivery contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install bounded regression dependencies
        run: python -m pip install --disable-pip-version-check -e . 'pytest>=8,<9' 'pytest-asyncio>=1.4,<2' 'PyJWT>=2,<3' 'python-dotenv>=1,<2' 'regex>=2026.9.29,<2027'
      - name: Compile changed production boundaries
        run: |
          python -m compileall -q skeleton/context skeleton/persistence skeleton/ai/runtime/inference backend/core/conversations.py
      - name: Verify AI-tree syntax and tracked-member integrity regressions
        run: python -m pytest -q tests/test_ai_tree_syntax_membership_fail_closed.py
      - name: Verify canonical metadata and AI-tree parity
        run: |
          python scripts/check_root_package_metadata_parity.py
          python -m unittest discover -s tests -p 'test_root_package_metadata_parity.py' -q
          python scripts/check_ai_file_tree.py
      - name: Verify canonical conversation and immutable workflow pin regressions
        env:
          PYTHONPATH: '.:backend'
        run: |
          python -m pytest -q \
            backend/tests/test_conversation_storage_admission.py \
            backend/tests/test_dragon_conversation_binding.py \
            backend/tests/test_supervisor_workflow_contract.py
      - name: Local model and guarded provider regression
        env:
          PYTHONPATH: '.:backend'
        run: |
          python -m pytest -q \
            skeleton/testing/test_local_inference.py \
            skeleton/testing/test_guarded_local_provider.py \
            skeleton/testing/test_guarded_composition.py \
            skeleton/testing/test_native_guard_binding.py \
            skeleton/testing/test_offline_runtime_admission.py \
            skeleton/testing/test_offline_execution_custody.py \
            skeleton/testing/test_offline_weight_inventory.py \
            skeleton/testing/test_weight_store_disk_owner.py \
            skeleton/testing/test_weight_store_recovery.py \
            skeleton/testing/test_weight_store_cli.py \
            skeleton/testing/test_weight_store_scrub.py \
            skeleton/testing/test_weight_store_range.py \
            skeleton/testing/test_managed_weight_custody.py \
            skeleton/testing/test_sealed_weight_pages.py \
            skeleton/testing/test_nvml_memory_probe.py \
            skeleton/testing/test_measured_jeeves_deployment.py \
            skeleton/testing/test_native_process_lease.py \
            skeleton/testing/test_guarded_application_startup.py \
            skeleton/testing/test_engine_submission_snapshot.py \
            skeleton/testing/test_engine_checkpoint_upgrade.py \
            skeleton/testing/test_canonical_source_custody.py \
            skeleton/testing/test_canonical_execution_source_factory.py \
            skeleton/testing/test_mongo_source_epoch.py \
            skeleton/testing/test_mongo_execution_source_binding.py \
            skeleton/testing/test_canonical_owner_source_loader.py \
            skeleton/testing/test_native_tokenizer_guard.py \
            skeleton/testing/test_guarded_registry_activation.py \
            skeleton/testing/test_guarded_local_service.py \
            skeleton/testing/test_pre_delivery_guard.py \
            skeleton/testing/test_delivery_schema.py \
            skeleton/testing/test_delivery_regex.py \
            skeleton/testing/test_mongo_memento_repository.py \
            skeleton/testing/test_sealed_*.py

      - name: Recovered installed command ownership regressions
        env:
          PYTHONPATH: '.:backend'
        run: |
          python -m pytest -q \
            skeleton/testing/test_recovered_installed_commands.py \
            skeleton/testing/test_recovered_runtime_commands.py \
            skeleton/testing/test_recovered_desktop_commands.py

      - name: Multi-cohort original game replay regressions
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_offline_portfolio.py skeleton/testing/test_offline_export_batch.py

      - name: Static orphan dependency planning regressions
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_orphan_source_graph.py skeleton/testing/test_recovered_flight_commands.py

      - name: Recovered asset and headless replay integration regressions
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_recovered_game_production.py tests/game_asset_ingest/test_asset_ingest.py tests/test_netcode_b064_headless_server.py

      - name: Recovered quest and seven-stage conductor execution
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_synthesized_quest_recovery.py skeleton/testing/test_quest_objective_runtime.py skeleton/testing/test_constraint_quest_synthesis.py skeleton/testing/test_genre_template_composition.py skeleton/gameforge/test_gameforge_conductor.py

      - name: Recovered fixed-step replay and local SQLite save custody
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_recovered_fixed_input.py skeleton/testing/test_recovered_sqlite_transactions.py tests/test_game_fixed_clock_v6.py tests/test_game_input_collision.py tests/game_builder/test_project_bundle_save.py tests/game_builder/test_project_bundle_history.py

      - name: Recovered AI source assurance and operator routes
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_recovered_assurance_routes.py

      - name: Recovered pressure-gated assurance and GGUF source custody
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_recovered_resource_assurance.py skeleton/testing/test_offline_cpu_budget.py skeleton/testing/test_offline_energy_budget.py tests/test_native_gguf_preflight.py

      - name: Recovered synthetic playtest, frame and scene custody qualification
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_recovered_playtest_qualification.py tests/game_analytics/test_analytics.py tests/test_game_frontier_art_acceptance.py skeleton/testing/test_scene_bytes.py

      - name: Recovered B038 B039 trace repair and provenance
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_recovered_quest_trace_repair.py skeleton/gameforge/batch_b039/test_self_repair.py skeleton/gameforge/batch_b039/test_route_adapter.py tests/test_gf_b038_provenance.py

      - name: Recovered signed route and navigation replay qualification
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_recovered_signed_navigation.py tests/test_frontier_nav_gf_h.py

      - name: Recovered frontier campaign and durable archive lifecycle
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_recovered_frontier_archive.py tests/test_game_frontier_session.py tests/test_game_frontier_campaign.py tests/test_game_frontier_milestone_9.py tests/test_game_frontier_milestone_14.py

      - name: Recovered metric identity and repair callback integrity
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_recovered_analytics_repair_integrity.py tests/game_analytics/test_analytics.py skeleton/gameforge/batch_b039/test_self_repair.py

      - name: Recovered emulator lens work and receipt custody
        env:
          PYTHONPATH: '.:backend'
        run: python -m pytest -q skeleton/testing/test_recovered_emulator_lens_queue.py skeleton/testing/test_jeeves_emulator_lens_campaign.py

      - name: Consumer share and Chroma custody regressions
        env:
          PYTHONPATH: '.:backend'
        run: |
          python -m pytest -q \
            backend/tests/test_share_page_security.py \
            skeleton/testing/test_chroma_backup.py
