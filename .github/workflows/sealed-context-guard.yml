name: Sealed Context Guard

# Additive exact-head regression for the draft security feature. Never a
# replacement for Backend Quality, Merge Readiness or release certification.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skeleton/ai/runtime/inference/local.py'
      - 'skeleton/ai/runtime/inference/guarded_service.py'
      - 'skeleton/ai/runtime/inference/guarded_composition.py'
      - 'skeleton/ai/runtime/inference/deployment.py'
      - 'skeleton/ai/runtime/inference/llama_cpp.py'
      - 'skeleton/ai/runtime/inference/catalog.py'
      - 'skeleton/ai/runtime/inference/native_transformer.py'
      - 'skeleton/provider_runtime.py'
      - 'skeleton/context/**'
      - 'skeleton/persistence/sealed_memento_*.py'
      - 'skeleton/persistence/mongo_memento_repository.py'
      - 'skeleton/testing/test_guarded_local_provider.py'
      - 'skeleton/testing/test_guarded_composition.py'
      - 'skeleton/testing/test_guarded_registry_activation.py'
      - 'skeleton/testing/test_guarded_local_service.py'
      - 'skeleton/testing/test_pre_delivery_guard.py'
      - 'skeleton/testing/test_delivery_*.py'
      - 'skeleton/testing/test_sealed_*.py'
      - 'pyproject.toml'
      - '.github/workflows/sealed-context-guard.yml'
  push:
    branches:
      - feat/sealed-context-sandwich-v1-20261027
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sealed-context-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-inference-guard:
    name: Exact-head local inference and delivery contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install bounded regression dependencies
        run: python -m pip install --disable-pip-version-check -e . 'pytest>=8,<9' 'pytest-asyncio>=1.4,<2'
      - name: Compile changed production boundaries
        run: |
          python -m compileall -q skeleton/context skeleton/persistence skeleton/ai/runtime/inference
      - name: Local model and guarded provider regression
        env:
          PYTHONPATH: '.:backend'
        run: |
          python -m pytest -q \
            skeleton/testing/test_local_inference.py \
            skeleton/testing/test_guarded_local_provider.py \
            skeleton/testing/test_guarded_composition.py \
            skeleton/testing/test_guarded_registry_activation.py \
            skeleton/testing/test_guarded_local_service.py \
            skeleton/testing/test_pre_delivery_guard.py \
            skeleton/testing/test_delivery_schema.py \
            skeleton/testing/test_delivery_regex.py

      - name: Legacy reference end-to-end compatibility
        env:
          PYTHONPATH: '.:backend'
        run: |
          # Explicitly acknowledged development-mode fixtures only.
          python -m pytest -q \
            skeleton/testing/test_engine_local_provider_binding.py \
            -k 'test_execution_descriptor_is_detached_content_only'
          python -m pytest -q \
            skeleton/testing/test_governed_model_engine_acceptance.py \
            -k 'reference and test_governed_training_artifact_served_by_authenticated_engine_and_reopened'
