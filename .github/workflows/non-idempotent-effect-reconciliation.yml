name: Non-idempotent Effect Reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/skills/tool_effect_reconciliation.py"
      - "skeleton/ai/runtime/skills/tool_effect_reconciliation.py"
      - "skeleton/skills/tool_saga.py"
      - "skeleton/ai/runtime/skills/tool_saga.py"
      - "skeleton/testing/test_tool_effect_reconciliation.py"
      - "skeleton/testing/test_tool_receipt_store.py"
      - "skeleton/testing/test_tool_saga.py"
      - "machine/ai_hostile_gap_disposition.json"
      - "machine/tool_effect_reconciliation_contract.json"
      - ".github/workflows/non-idempotent-effect-reconciliation.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/skills/tool_effect_reconciliation.py"
      - "skeleton/ai/runtime/skills/tool_effect_reconciliation.py"
      - "skeleton/skills/tool_saga.py"
      - "skeleton/ai/runtime/skills/tool_saga.py"
      - "skeleton/testing/test_tool_effect_reconciliation.py"
      - "skeleton/testing/test_tool_receipt_store.py"
      - "skeleton/testing/test_tool_saga.py"
      - "machine/ai_hostile_gap_disposition.json"
      - "machine/tool_effect_reconciliation_contract.json"
      - ".github/workflows/non-idempotent-effect-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g015-effect-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
          "pydantic>=2,<3" "pydantic-settings>=2,<3"
      - name: Compile recovery boundary
        run: >-
          python -m compileall -q
          skeleton/skills/tool_effect_reconciliation.py
          skeleton/ai/runtime/skills/tool_effect_reconciliation.py
          skeleton/skills/tool_saga.py
          skeleton/ai/runtime/skills/tool_saga.py
          skeleton/testing/test_tool_effect_reconciliation.py
      - name: Run G015 reconciliation regressions
        run: >-
          python -m pytest -q -p no:cacheprovider -p pytest_asyncio.plugin
          skeleton/testing/test_tool_effect_reconciliation.py
          skeleton/testing/test_tool_receipt_store.py
          skeleton/testing/test_tool_saga.py
      - name: Verify canonical AI mirror
        run: >-
          cmp
          skeleton/skills/tool_effect_reconciliation.py
          skeleton/ai/runtime/skills/tool_effect_reconciliation.py
          &&
          cmp
          skeleton/skills/tool_saga.py
          skeleton/ai/runtime/skills/tool_saga.py
      - name: Verify hostile-gap ledger
        run: python scripts/verify_ai_hostile_gap_disposition.py
