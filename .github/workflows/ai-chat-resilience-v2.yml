name: AI Chat Resilience v2

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/ai/assistant/model_placement.py"
      - "skeleton/ai/assistant/tool_recovery.py"
      - "skeleton/ai/assistant/__init__.py"
      - "skeleton/testing/test_ai_chat_resilience_v2.py"
      - "machine/ai_chat_resilience_v2_contract.json"
      - "scripts/verify_ai_chat_resilience_v2.py"
      - "docs/plan/AI_CHAT_MASTERPLAN_2026-10-06.md"
      - ".github/workflows/ai-chat-resilience-v2.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/ai/assistant/model_placement.py"
      - "skeleton/ai/assistant/tool_recovery.py"
      - "skeleton/ai/assistant/__init__.py"
      - "skeleton/testing/test_ai_chat_resilience_v2.py"
      - "machine/ai_chat_resilience_v2_contract.json"
      - "scripts/verify_ai_chat_resilience_v2.py"
      - "docs/plan/AI_CHAT_MASTERPLAN_2026-10-06.md"
      - ".github/workflows/ai-chat-resilience-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-chat-resilience-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resilience-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
      - name: Compile resilience surfaces
        run: >-
          python -m compileall -q
          skeleton/ai/assistant/model_placement.py
          skeleton/ai/assistant/tool_recovery.py
          skeleton/testing/test_ai_chat_resilience_v2.py
          scripts/verify_ai_chat_resilience_v2.py
      - name: Verify machine contract and isolation
        run: python scripts/verify_ai_chat_resilience_v2.py --json
      - name: Run focused regressions
        run: >-
          python -m pytest -q
          skeleton/testing/test_ai_chat_resilience_v2.py
      - name: Verify governed AI file tree
        run: python scripts/check_ai_file_tree.py
