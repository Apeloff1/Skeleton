name: Secret Lifecycle Taint Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/security/secret_lifecycle.py"
      - "skeleton/ai/runtime/security/secret_lifecycle.py"
      - "skeleton/security/secret_handles.py"
      - "skeleton/testing/test_secret_lifecycle_taint.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/secret-lifecycle-taint.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/security/secret_lifecycle.py"
      - "skeleton/ai/runtime/security/secret_lifecycle.py"
      - "skeleton/security/secret_handles.py"
      - "skeleton/testing/test_secret_lifecycle_taint.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/secret-lifecycle-taint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-lifecycle-taint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-lifecycle-taint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Compile lifecycle contract
        run: >-
          python -m compileall -q
          skeleton/security/secret_lifecycle.py
          skeleton/ai/runtime/security/secret_lifecycle.py
          skeleton/testing/test_secret_lifecycle_taint.py
      - name: Run secret handle and lifecycle regressions
        run: >-
          python -m unittest -q
          skeleton.testing.test_secret_lifecycle_taint
      - name: Run existing secret handle regressions
        run: >-
          python -m pip install --disable-pip-version-check "pytest>=8,<9"
          && python -m pytest -q --noconftest skeleton/testing/test_secret_security.py
      - name: Verify governed AI file-tree parity
        run: python scripts/check_ai_file_tree.py
      - name: Verify hostile-gap disposition
        run: python scripts/verify_ai_hostile_gap_disposition.py
