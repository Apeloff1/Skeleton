name: Product Kernel

on:
  push:
    branches: [main]
    paths:
      - "backend/core/charter_policy.py"
      - "backend/core/product_kernel.py"
      - "backend/core/product_control_plane.py"
      - "backend/core/product_executor_registry.py"
      - "backend/core/product_default_executors.py"
      - "backend/core/execution_receipts.py"
      - "backend/core/product_operations.py"
      - "backend/tests/test_charter_policy.py"
      - "backend/tests/test_product_kernel.py"
      - "backend/tests/test_product_executor_registry.py"
      - "backend/tests/test_execution_receipts.py"
      - "backend/tests/test_native_product_executors.py"
      - "frontend/src/product/productCatalog.ts"
      - "frontend/src/product/productControlClient.ts"
      - "frontend/app/product.tsx"
      - "frontend/app/capability.tsx"
      - "frontend/app/operation.tsx"
      - "frontend/app/control-plane.tsx"
      - "frontend/components/LaunchCascade.tsx"
      - "frontend/tsconfig.product.json"
      - ".github/workflows/product-kernel.yml"
  pull_request:
    paths:
      - "backend/core/charter_policy.py"
      - "backend/core/product_kernel.py"
      - "backend/core/product_control_plane.py"
      - "backend/core/product_executor_registry.py"
      - "backend/core/product_default_executors.py"
      - "backend/core/execution_receipts.py"
      - "backend/core/product_operations.py"
      - "backend/tests/test_charter_policy.py"
      - "backend/tests/test_product_kernel.py"
      - "backend/tests/test_product_executor_registry.py"
      - "backend/tests/test_execution_receipts.py"
      - "backend/tests/test_native_product_executors.py"
      - "frontend/src/product/productCatalog.ts"
      - "frontend/src/product/productControlClient.ts"
      - "frontend/app/product.tsx"
      - "frontend/app/capability.tsx"
      - "frontend/app/operation.tsx"
      - "frontend/app/control-plane.tsx"
      - "frontend/components/LaunchCascade.tsx"
      - "frontend/tsconfig.product.json"
      - ".github/workflows/product-kernel.yml"

permissions:
  contents: read

concurrency:
  group: product-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-product-kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<9"
      - name: Verify framework-free product kernel contracts
        run: >-
          python -m pytest -q --noconftest
          tests/test_charter_policy.py
          tests/test_product_kernel.py
          tests/test_product_executor_registry.py
          tests/test_execution_receipts.py
          tests/test_native_product_executors.py

  frontend-product-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Typecheck canonical product contract
        run: yarn tsc --noEmit -p tsconfig.product.json
