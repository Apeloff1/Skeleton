name: Idle Studio

on:
  schedule:
    - cron: '7,37 * * * *'
    - cron: '22,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan, review, and validate without publishing pull requests
        required: false
        default: false
        type: boolean

concurrency:
  group: idle-studio
  cancel-in-progress: false

permissions: {}

jobs:
  studio:
    if: >-
      github.repository == 'Apeloff1/Skeleton' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    name: 1000-worker idle control plane
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    env:
      IDLE_STUDIO_ACTIVE_WORKERS: ${{ vars.IDLE_STUDIO_ACTIVE_WORKERS }}
      IDLE_STUDIO_TASKS_PER_RUN: ${{ vars.IDLE_STUDIO_TASKS_PER_RUN }}
      IDLE_STUDIO_MAX_MODEL_CALLS: ${{ vars.IDLE_STUDIO_MAX_MODEL_CALLS }}
      IDLE_STUDIO_MAX_OPEN_PRS: ${{ vars.IDLE_STUDIO_MAX_OPEN_PRS }}

    steps:
      - name: Checkout trusted default-branch snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'

      - name: Install focused trusted runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "fastapi>=0.141.1,<1"
          "pydantic>=2.13.5,<3"
          "pydantic-settings>=2.15.0,<3"

      - name: Validate trusted idle-studio control plane
        run: >-
          python -m unittest -v
          skeleton.testing.test_idle_studio
          skeleton.testing.test_idle_studio_v2
          skeleton.testing.test_idle_studio_publisher

      - name: Snapshot live repository state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .idle-studio-tmp
          gh api "/repos/$REPO/actions/runs?per_page=50" --jq '.workflow_runs' > .idle-studio-tmp/runs.json
          gh api "/repos/$REPO/issues?state=open&per_page=50&sort=updated&direction=desc" > .idle-studio-tmp/issues.json
          gh api "/repos/$REPO/pulls?state=open&per_page=50&sort=updated&direction=desc" > .idle-studio-tmp/pulls.json
          base_sha=$(git rev-parse HEAD)
          BASE_SHA="$base_sha" CURRENT_RUN_ID="$GITHUB_RUN_ID" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('.idle-studio-tmp')
          issues = json.loads((root / 'issues.json').read_text(encoding='utf-8'))
          issues = [
              item for item in issues
              if not str(item.get('title', '')).strip().lower().startswith('bot:')
          ]
          state = {
              'runs': json.loads((root / 'runs.json').read_text(encoding='utf-8')),
              'issues': issues,
              'pulls': json.loads((root / 'pulls.json').read_text(encoding='utf-8')),
              'base_sha': os.environ['BASE_SHA'],
              'current_run_id': os.environ['CURRENT_RUN_ID'],
          }
          (root / 'repo-state.json').write_text(
              json.dumps(state, sort_keys=True, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Load canonical shift-supervisor plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.idle-studio-tmp')
          state_path = root / 'repo-state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          title = '[Shift Supervisor] Canonical Night + Idle Plan'
          status_titles = {
              '[Shift Supervisor] Idle Worker Status',
              '[Shift Supervisor] Night Worker Status',
          }
          issues = state.get('issues', [])
          canonical = next(
              (
                  issue for issue in issues
                  if isinstance(issue, dict) and issue.get('title') == title
              ),
              None,
          )
          ignored_titles = {title, *status_titles}
          state['issues'] = [
              issue for issue in issues
              if not (isinstance(issue, dict) and issue.get('title') in ignored_titles)
          ]

          plan = []
          status = 'missing'
          if canonical is not None:
              body = str(canonical.get('body', ''))
              match = re.search(
                  r'<!-- SHIFT_SUPERVISOR_STATE\n(.*?)\n-->',
                  body,
                  flags=re.DOTALL,
              )
              if match:
                  encoded = match.group(1).strip()
                  if encoded.startswith('gz:v1:'):
                      packed = base64.b64decode(encoded[len('gz:v1:'):], validate=True)
                      durable = json.loads(gzip.decompress(packed).decode('utf-8'))
                      if isinstance(durable, dict):
                          plan = durable.get('plan_items', [])
                          status = 'loaded'

          synthetic = []
          for item in plan[:32]:
              if not isinstance(item, dict):
                  continue
              if item.get('target_team') != 'idle' or item.get('status') in {'done', 'rejected'}:
                  continue
              item_title = str(item.get('title', '')).strip()
              description = str(item.get('description', '')).strip()
              if not item_title or not description:
                  continue
              stable = hashlib.sha256(
                  f"{item_title}\0{description}\0idle".encode('utf-8')
              ).hexdigest()
              number = -(int(stable[:12], 16) + 1)
              priority = item.get('priority', 50)
              evidence = {
                  'source': 'canonical-shift-supervisor',
                  'priority': priority,
                  'description': description,
                  'rationale': item.get('rationale', ''),
                  'expected_output': item.get('expected_output', ''),
                  'validation': item.get('validation', []),
                  'dependencies': item.get('dependencies', []),
                  'research_refs': item.get('research_refs', []),
              }
              text = f"{item_title} {description}".lower()
              labels = [{'name': 'shift-supervisor'}]
              if any(token in text for token in ('security', 'vulnerability', 'cve', 'secret', 'auth')):
                  labels.append({'name': 'security'})
              synthetic.append(
                  {
                      'number': number,
                      'title': f"[Supervisor P{priority}] {item_title}"[:300],
                      'body': json.dumps(evidence, sort_keys=True, default=str)[:12000],
                      'labels': labels,
                  }
              )

          state['shift_supervisor'] = {
              'source': 'canonical-plan-issue',
              'status': status,
              'issue_number': canonical.get('number') if canonical else None,
              'idle_plan_items': len(synthetic),
          }
          state.setdefault('issues', []).extend(synthetic)
          state_path.write_text(json.dumps(state, sort_keys=True, indent=2), encoding='utf-8')

          lines = ['## Shift supervisor', '']
          if canonical is None:
              lines.append('Canonical plan issue was not present; no supervisor tasks were promoted.')
          elif status != 'loaded':
              lines.append(f"Canonical issue #{canonical.get('number', '?')} was present but had no usable durable state.")
          else:
              lines.append(f"Canonical issue: #{canonical.get('number', '?')}")
              lines.append(f"Idle work items promoted into studio intake: {len(synthetic)}")
              for item in synthetic[:20]:
                  lines.append(f"- {item['title']}")
          (root / 'shift-supervisor-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Plan, build, and independently review bounded work
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m skeleton.automation.idle_studio_v2 propose \
            --state .idle-studio-tmp/repo-state.json \
            --package .idle-studio-tmp/package.json \
            --audit .idle-studio-tmp/audit.jsonl \
            --report .idle-studio-tmp/report.md
          sha256sum .idle-studio-tmp/package.json > .idle-studio-tmp/package.sha256
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(
              Path('.idle-studio-tmp/package.json').read_text(encoding='utf-8')
          )
          if package.get('status') == 'missing-api-key':
              raise SystemExit(
                  'OPENAI_API_KEY repository secret is required for Idle Studio'
              )
          PY

      - name: Record real idle workforce snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s .idle-studio-tmp/package.json && -s .idle-studio-tmp/audit.jsonl ]]; then
            python -m core.shift_supervisor.workforce_report idle \
              --package .idle-studio-tmp/package.json \
              --audit .idle-studio-tmp/audit.jsonl \
              --output .idle-studio-tmp/worker-status.json
          fi

      - name: Revalidate sealed proposals without model or GitHub credentials
        env:
          OPENAI_API_KEY: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c .idle-studio-tmp/package.sha256
          python -m skeleton.automation.idle_studio_v2 validate \
            --package .idle-studio-tmp/package.json

      - name: Persist append-only Idle Studio ledger and staffing status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .idle-studio-tmp

          if [[ -s .idle-studio-tmp/worker-status.json ]]; then
            worker_title='[Shift Supervisor] Idle Worker Status'
            worker_number=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$worker_title\") | .number" | head -n 1)
            if [[ -n "${worker_number:-}" ]]; then
              gh issue edit "$worker_number" --repo "$REPO" --body-file .idle-studio-tmp/worker-status.json >/dev/null
            else
              gh issue create --repo "$REPO" --title "$worker_title" --body-file .idle-studio-tmp/worker-status.json >/dev/null
            fi
          fi

          title='bot: idle studio ledger'
          number=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [[ -z "${number:-}" ]]; then
            issue_url=$(gh issue create --repo "$REPO" --title "$title" --body 'Append-only ledger for Idle Studio runs. Every scheduled/manual run records its human report and redacted machine audit here, including no-op and rejected runs.')
            number="${issue_url##*/}"
          fi
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [[ -s .idle-studio-tmp/shift-supervisor-summary.md ]]; then
              cat .idle-studio-tmp/shift-supervisor-summary.md
              echo
            fi
            if [[ -s .idle-studio-tmp/report.md ]]; then
              cat .idle-studio-tmp/report.md
            else
              echo '# Idle Studio run'
              echo
              echo 'Controller stopped before a report could be produced.'
            fi
            if [[ -s .idle-studio-tmp/audit.jsonl ]]; then
              echo
              echo '<details><summary>Redacted machine audit</summary>'
              echo
              echo '```jsonl'
              cat .idle-studio-tmp/audit.jsonl
              echo '```'
              echo '</details>'
            fi
          } > .idle-studio-tmp/ledger-comment.md
          gh issue comment "$number" --repo "$REPO" --body-file .idle-studio-tmp/ledger-comment.md >/dev/null

      - name: Publish independently approved work as reviewable pull requests
        if: >-
          success() &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          OPENAI_API_KEY: ''
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c .idle-studio-tmp/package.sha256
          python -m skeleton.automation.idle_studio_publisher \
            --package .idle-studio-tmp/package.json

      - name: Summarize idle studio run
        if: always()
        shell: bash
        run: |
          if [[ -s .idle-studio-tmp/shift-supervisor-summary.md ]]; then
            cat .idle-studio-tmp/shift-supervisor-summary.md >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -s .idle-studio-tmp/report.md ]]; then
            cat .idle-studio-tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Idle Studio did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
