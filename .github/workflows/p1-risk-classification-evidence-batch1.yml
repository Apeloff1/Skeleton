name: P1 Risk Classification Evidence Batch 1 Gate

on:
  pull_request:
    branches:
      - main
      - p1/risk-classification-evidence-batch1-20260930
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "skeleton/contracts/canonical.py"
      - "skeleton/contracts/evidence_ingestion.py"
      - "skeleton/contracts/promotion_evidence.py"
      - "skeleton/contracts/maturity_reconciliation.py"
      - "skeleton/contracts/risk_evidence.py"
      - "scripts/check_ai_master_plan.py"
      - "scripts/check_ai_build_accountability.py"
      - "scripts/check_ai_scope_freeze.py"
      - "scripts/reconcile_p1_maturity.py"
      - "scripts/reconcile_p1_risk_evidence.py"
      - "scripts/emit_p1_promotion_evidence.py"
      - "scripts/build_p1_risk_classification_evidence_batch1.py"
      - "skeleton/testing/test_ai_master_plan.py"
      - "skeleton/testing/test_architecture_scope_freeze.py"
      - "skeleton/testing/test_evidence_ingestion.py"
      - "skeleton/testing/test_promotion_evidence.py"
      - "skeleton/testing/test_risk_evidence.py"
      - "tests/test_p1_maturity_reconciliation.py"
      - "tests/test_p1_promotion_evidence_emitter.py"
      - "tests/test_p1_risk_evidence_reconciliation.py"
      - "tests/test_p1_risk_classification_evidence_batch1.py"
      - "tests/test_p1_risk_classification_bindings_batch1.py"
      - ".github/workflows/p1-risk-classification-evidence-batch1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-risk-classification-batch1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify P1 risk classification evidence batch 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Validate canonical governance inputs
        run: |
          set -euo pipefail
          python scripts/check_ai_master_plan.py
          python scripts/check_ai_build_accountability.py

      - name: Run focused classification regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_ai_master_plan.py
          skeleton/testing/test_architecture_scope_freeze.py
          skeleton/testing/test_evidence_ingestion.py
          skeleton/testing/test_promotion_evidence.py
          skeleton/testing/test_risk_evidence.py
          tests/test_p1_maturity_reconciliation.py
          tests/test_p1_promotion_evidence_emitter.py
          tests/test_p1_risk_evidence_reconciliation.py
          tests/test_p1_risk_classification_evidence_batch1.py
          tests/test_p1_risk_classification_bindings_batch1.py

      - name: Build exact-head classification candidates
        run: |
          set -euo pipefail
          mkdir -p .p1-risk-classification
          python scripts/build_p1_risk_classification_evidence_batch1.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-risk-classification/report.json \
            --print-summary \
            --print-candidates
          python scripts/build_p1_risk_classification_evidence_batch1.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-risk-classification/replay.json
          cmp .p1-risk-classification/report.json .p1-risk-classification/replay.json

      - name: Prove classification authority boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".p1-risk-classification/report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("classification report is not exact-head bound")
          if report["covered_risk_count"] != 12:
              raise SystemExit("batch must cover exactly 12 canonical risks")
          if report["covered_volume_count"] != 4:
              raise SystemExit("batch must cover exactly 4 volumes")
          if report["already_bound_count"] != 12:
              raise SystemExit("batch must have exactly 12 governed bindings")
          if report["candidate_binding_count"] != 0:
              raise SystemExit("batch must have zero unbound candidates")
          if report["recommended_severity"] != "high":
              raise SystemExit("batch severity must remain high")
          if report["recommended_disposition"] != "evidence":
              raise SystemExit("batch disposition must remain evidence")
          for field in (
              "creates_bindings",
              "accepts_risk",
              "lowers_severity",
              "clears_source_risks",
              "promotes_maturity",
          ):
              if report[field] is not False:
                  raise SystemExit(f"authority boundary drift: {field}")
          for row in report["records"]:
              if not row["binding_present"]:
                  raise SystemExit(
                      "classified risk binding is missing: "
                      + row["obligation_id"]
                  )
              if row["recommended_severity"] != "high":
                  raise SystemExit("risk severity downgrade detected")
              if row["candidate_evidence_ref"]["digest"] != row["packet_digest"]:
                  raise SystemExit("candidate evidence digest drift")
              if not row["candidate_evidence_ref"]["source"].endswith(
                  ":" + os.environ["EXPECTED_SHA"]
              ):
                  raise SystemExit("candidate is not exact-head bound")
          print("P1 risk classification batch 1:", report["report_digest"])
          PY

      - name: Reconcile governed registry remains unchanged
        run: |
          set -euo pipefail
          EVALUATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/reconcile_p1_risk_evidence.py \
            --evaluated-at "$EVALUATED_AT" \
            --out .p1-risk-classification/risk-report.json \
            --print-summary
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-risk-classification/risk-report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["binding_count"] != 492:
              raise SystemExit("classified-risk binding count drift")
          if report["resolved_count"] != 492:
              raise SystemExit("classified-risk resolution count drift")
          if report["unresolved_blocking_count"] != 21:
              raise SystemExit("classified-risk blocking frontier drift")
          if report["unclassified_count"] != 0:
              raise SystemExit("classified-risk unclassified frontier drift")
          if report["disposition_counts"] != {
              "evidence": 492,
              "unbound": 21,
          }:
              raise SystemExit("classified-risk disposition counts drift")
          print(
              "Governed risk frontier:",
              report["resolved_count"],
              report["unresolved_blocking_count"],
              report["unclassified_count"],
          )
          PY
