name: P1 Adversarial AC-10 AC-21 Evidence Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/kernel/keyholder.py"
      - "skeleton/testing/test_keyholder.py"
      - "skeleton/resilience/recovery_bootstrap.py"
      - "skeleton/ai/runtime/resilience/recovery_bootstrap.py"
      - "skeleton/testing/test_recovery_bootstrap.py"
      - "scripts/build_p1_adversarial_ac10_ac21_evidence.py"
      - "tests/test_p1_adversarial_ac10_ac21_evidence.py"
      - "machine/ai_adversarial_closure.json"
      - "machine/p1_risk_evidence_bindings.json"
      - ".github/workflows/p1-adversarial-ac10-ac21-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-adversarial-ac10-ac21-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify AC-10 key continuity and AC-21 recovery evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Run continuity recovery and evidence regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_keyholder.py
          skeleton/testing/test_recovery_bootstrap.py
          tests/test_p1_adversarial_ac10_ac21_evidence.py

      - name: Compile exact-head evidence twice
        run: |
          set -euo pipefail
          mkdir -p .p1-ac10-ac21
          python scripts/build_p1_adversarial_ac10_ac21_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-ac10-ac21/report.json \
            --print-summary \
            --print-candidates | tee .p1-ac10-ac21/stdout.log
          python scripts/build_p1_adversarial_ac10_ac21_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-ac10-ac21/replay.json
          cmp .p1-ac10-ac21/report.json .p1-ac10-ac21/replay.json

      - name: Prove two evidence-only closure candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".p1-ac10-ac21/report.json").read_text(encoding="utf-8")
          )
          expected = {
              "AC-10": {
                  "credential_rotation",
                  "revocation_replay",
                  "identity_restore",
                  "historical_signature_verify",
              },
              "AC-21": {
                  "recovery_dependency_graph",
                  "safe_mode_drill",
                  "control_plane_isolation",
                  "cold_restore",
              },
          }
          if report["axis_ids"] != ["AC-10", "AC-21"]:
              raise SystemExit("AC-10/AC-21 axis set drift")
          if report["already_bound_count"] != 0:
              raise SystemExit("AC-10/AC-21 unexpectedly already bound")
          if report["candidate_binding_count"] != 2:
              raise SystemExit("AC-10/AC-21 candidate count drift")
          if report["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("AC-10/AC-21 exact-head mismatch")
          for candidate in report["candidates"]:
              axis = candidate["axis_id"]
              if set(candidate["required_evidence_modes"]) != expected[axis]:
                  raise SystemExit(f"{axis} required evidence modes drift")
              if {row["category"] for row in candidate["evidence"]} != expected[axis]:
                  raise SystemExit(f"{axis} evidence incomplete")
              if candidate["recommended_severity"] != "high":
                  raise SystemExit(f"{axis} severity drift")
              if candidate["recommended_disposition"] != "evidence":
                  raise SystemExit(f"{axis} disposition drift")
              for field in (
                  "creates_binding",
                  "accepts_risk",
                  "lowers_severity",
                  "promotes_maturity",
              ):
                  if candidate[field] is not False:
                      raise SystemExit(f"{axis} authority drift: {field}")
          PY

      - name: Surface binding seeds
        run: grep '^P1_AC10_AC21_BINDING_SEEDS=' .p1-ac10-ac21/stdout.log
