name: Draft19 GGUF and source custody qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/local_ai/model_loader.py"
      - "backend/core/lazy_registry.py"
      - "skeleton/testing/test_local_ai_gguf_custody.py"
      - "machine/draft19_reconciliation.json"
      - "scripts/check_draft19_reconciliation.py"
      - "tests/test_draft19_reconciliation.py"
      - ".github/workflows/draft19-gguf-source-qualification.yml"

permissions:
  contents: read

concurrency:
  group: draft19-gguf-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  descriptor_custody_and_provenance:
    name: GGUF custody and draft admission-denial regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install supported Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Compile changed sources
        run: |
          python -m py_compile skeleton/local_ai/model_loader.py skeleton/testing/test_local_ai_gguf_custody.py
          python -m py_compile backend/core/lazy_registry.py
          python -m py_compile scripts/check_draft19_reconciliation.py tests/test_draft19_reconciliation.py
      - name: Verify complete held-source registry
        run: python scripts/check_draft19_reconciliation.py
      - name: Run adversarial ledger tests
        run: python -m unittest discover -s tests -p 'test_draft19_reconciliation.py' -v
      - name: Install approved local-AI import-chain test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6,<7" "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
          "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0"
          "fastapi>=0.142.2,<1" "pydantic>=2.14.1,<3"
          "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2"
          "numpy>=2,<3" "Pillow>=13.0.0,<14" "regex>=2026.9.29,<2027"
      - name: Run GGUF custody and prior compatibility tests
        run: python -m unittest skeleton.testing.test_local_ai_gguf_qualification skeleton.testing.test_local_ai_gguf_custody -v
      - name: Validate literal deferred-import inventory and storage diagnostics
        env:
          PYTHONPATH: ".:backend:tests"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q backend/tests/test_storage_lazy_registry.py
