name: Draft19 GGUF and source custody qualification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: draft19-gguf-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  descriptor_custody_and_provenance:
    name: GGUF custody and draft admission-denial regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install supported Python runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Compile changed sources
        run: |
          python -m py_compile skeleton/local_ai/model_loader.py skeleton/testing/test_local_ai_model_loader_custody.py
          python -m py_compile tests/test_local_ai_gguf_custody_v6.py tests/test_gguf_artifact_qualification_reconciliation.py
          python -m py_compile backend/core/lazy_registry.py
          python -m py_compile skeleton/app/offline_delivery_archive.py skeleton/testing/test_app_offline_delivery_archive.py
          python -m py_compile skeleton/testing/test_app_offline_archive_schema_parity.py skeleton/testing/test_repo_machine_inventory_budget.py
          python -m py_compile tests/test_repo_machine_budget_20261108.py
          python -m py_compile skeleton/testing/test_ai_next_model.py skeleton/testing/test_app_offline_mixed_game_library_continuity.py
          python -m py_compile skeleton/testing/test_app_offline_archive_schema_parity.py skeleton/testing/test_repo_machine_inventory_budget.py
          python -m py_compile scripts/check_draft19_reconciliation.py tests/test_draft19_reconciliation.py
      - name: Verify complete held-source registry
        run: python scripts/check_draft19_reconciliation.py
      - name: Admit literal Python source and pytest paths
        run: |
          python scripts/check_draft19_ci_paths.py
          python -m unittest discover -s tests -p 'test_draft19_ci_paths.py' -v
      - name: Run adversarial ledger tests
        run: python -m unittest discover -s tests -p 'test_draft19_reconciliation.py' -v
      - name: Install approved local-AI import-chain test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6,<7" "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
          "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0"
          "fastapi>=0.142.2,<1" "pydantic>=2.14.1,<3"
          "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2"
          "numpy>=2,<3" "Pillow>=13.0.0,<14" "regex>=2026.9.29,<2027"
      - name: Run maintained GGUF custody and prior compatibility tests
        run: |
          python -m unittest skeleton.testing.test_local_ai_model_loader_custody -v
          python -m unittest discover -s tests -p 'test_local_ai_gguf_custody_v6.py' -v
          python -m unittest discover -s tests -p 'test_gguf_artifact_qualification_reconciliation.py' -v
      - name: Validate literal deferred-import inventory and storage diagnostics
        env:
          PYTHONPATH: ".:backend:tests"
          PYTHONDONTWRITEBYTECODE: "1"
        # This independently imported storage module needs no backend/tests
        # conftest fixtures. The default conftest eagerly imports the entire
        # server (including bcrypt/JWT provider dependencies), obscuring the
        # actual lazy-registry assertions. Full backend CI is still mandatory.
        run: python -m pytest -q --noconftest backend/tests/test_storage_lazy_registry.py
      - name: Qualify Studio ZIP custody, deterministic inspection and preflight
        env:
          PYTHONPATH: ".:backend:tests"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_app_offline_delivery_archive.py::test_deterministic_game_archive_and_independent_read_only_inspection
          skeleton/testing/test_app_offline_delivery_archive.py::test_archive_rejects_source_tamper_without_publishing
          skeleton/testing/test_app_offline_delivery_archive.py::test_archive_postpublication_mutation_never_reports_success
          skeleton/testing/test_app_offline_delivery_archive.py::test_archive_source_mutation_after_publication_is_not_certified
          skeleton/testing/test_app_offline_install_preflight.py::test_preflight_does_not_reserve_and_installer_rechecks
      - name: Qualify repository scanner finite-budget semantics
        run: python -m unittest discover -s tests -p 'test_repo_machine_budget_20261108.py' -v
      - name: Qualify strict native generation receipt and circuit denial
        run: python -m unittest skeleton.testing.test_ai_next_model -v
      - name: Qualify collided quest/dialogue pytest module identities
        env:
          PYTHONPATH: ".:backend:tests"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/dialogue_sessions_v1/test_companions_rescue.py
          skeleton/testing/questflows_v1/test_questflows_companions_rescue.py
      - name: Qualify signed and unsigned first-playable continuity
        env:
          PYTHONPATH: ".:backend:tests"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_app_offline_archive_signature.py::test_valid_detached_signature_is_not_consumer_release
          skeleton/testing/test_app_consumer_first_run_readiness.py::test_real_installed_game_and_private_save_replayed_without_release_claim
          skeleton/testing/test_app_offline_mixed_game_library_continuity.py::test_real_signed_unsigned_progress_continuity_and_cli
      - name: Qualify source-bound Studio manifest resealing attacks
        env:
          PYTHONPATH: ".:backend:tests"
        run: python -m pytest -q --noconftest skeleton/testing/test_app_offline_archive_schema_parity.py
      - name: Qualify finite scanner boundaries from independent regression
        env:
          PYTHONPATH: ".:backend:tests"
        run: python -m pytest -q --noconftest skeleton/testing/test_repo_machine_inventory_budget.py
      - name: Verify complete repository scan without truncation
        run: python scripts/check_repo_machine.py
