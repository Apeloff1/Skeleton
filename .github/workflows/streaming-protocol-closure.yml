name: Streaming Protocol Closure Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/frontier/operation_stream.py"
      - "skeleton/frontier/operation_stream_store.py"
      - "skeleton/frontier/operation_stream_store_mongo.py"
      - "skeleton/ai/runtime/frontier/operation_stream.py"
      - "skeleton/ai/runtime/frontier/operation_stream_store.py"
      - "skeleton/ai/runtime/frontier/operation_stream_store_mongo.py"
      - "backend/core/operation_stream_transport.py"
      - "backend/routes/operation_stream.py"
      - "backend/tests/test_operation_stream_*.py"
      - "skeleton/testing/test_operation_stream*.py"
      - "frontend/services/operationStream*.ts"
      - "frontend/scripts/test-operation-stream-*.mjs"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "scripts/verify_streaming_protocol_closure.py"
      - "tests/test_streaming_protocol_independent_verifier.py"
      - "machine/ai_app_construction.json"
      - "machine/ai_implementation_handoff.json"
      - "machine/ai_closure_evidence.json"
      - ".github/workflows/streaming-protocol-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streaming-protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  streaming-backend:
    name: Streaming protocol backend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused stream dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "httpx==0.28.1"
          "bcrypt==4.3.0"

      - name: Run canonical stream contracts
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_operation_stream.py
          skeleton/testing/test_operation_stream_store.py
          skeleton/testing/test_operation_stream_store_mongo.py
          backend/tests/test_operation_stream_transport.py
          backend/tests/test_operation_stream_route.py
          backend/tests/test_operation_stream_multiworker.py

  streaming-frontend:
    name: Streaming protocol frontend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies without third-party lifecycle scripts
        working-directory: frontend
        run: yarn install --ignore-scripts

      - name: Apply reviewed local node_modules patches
        working-directory: frontend
        run: node ./scripts/patch-node-modules.js

      - name: Typecheck and run operation stream journeys
        working-directory: frontend
        run: |
          yarn typecheck
          yarn test:operation-stream

  streaming-independent:
    name: Independent streaming protocol verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install verifier dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Run independent verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_streaming_protocol_independent_verifier.py

      - name: Run independent exact-head streaming scan
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_streaming_protocol_closure.py
          --evidence-out .streaming-protocol-independent.json
          --print-evidence

      - name: Assert exact-head independent receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".streaming-protocol-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("streaming receipt does not match exact PR head")
          if receipt.get("verifier") != "independent-streaming-protocol-v1":
              raise SystemExit("unexpected streaming verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent streaming verification failed")
          if len(receipt.get("boundary_digests") or {}) < 9:
              raise SystemExit("streaming boundary coverage is incomplete")
          if len(receipt.get("mirror_pairs") or []) < 3:
              raise SystemExit("streaming mirror coverage is incomplete")
          if set(receipt.get("dependency_graph") or []) != {
              "gap-cognitive-execution-loop",
              "gap-engine-application-execution-boundary",
              "gap-state-authority-convergence",
          }:
              raise SystemExit("streaming dependency graph receipt is invalid")
          print(
              "independent streaming exact-head receipt:",
              expected,
              "boundaries=",
              len(receipt["boundary_digests"]),
          )
          PY
