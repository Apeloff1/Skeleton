name: Portable Truth Proofs

on:
  push:
    paths:
      - "backend/core/sparse_merkle.py"
      - "backend/core/epistemic_claim_index.py"
      - "backend/core/epistemic_checkpoint.py"
      - "backend/core/epistemic_transparency.py"
      - "backend/core/transparency_log.py"
      - "backend/core/transparency_witness.py"
      - "backend/core/transparency_finality.py"
      - "backend/core/transparency_finality_proof.py"
      - "backend/core/portable_claim_proof.py"
      - "backend/core/claim_proof.py"
      - "backend/core/epistemic_attestation.py"
      - "backend/tests/test_portable_claim_proof.py"
      - "backend/tests/test_portable_finality_proof.py"
      - "backend/tests/test_claim_proof_attestation.py"
      - "backend/tests/test_transparency_log.py"
      - ".github/workflows/portable-truth-proofs.yml"
  pull_request:
    paths:
      - "backend/core/sparse_merkle.py"
      - "backend/core/epistemic_claim_index.py"
      - "backend/core/epistemic_checkpoint.py"
      - "backend/core/epistemic_transparency.py"
      - "backend/core/transparency_log.py"
      - "backend/core/transparency_witness.py"
      - "backend/core/transparency_finality.py"
      - "backend/core/transparency_finality_proof.py"
      - "backend/core/portable_claim_proof.py"
      - "backend/core/claim_proof.py"
      - "backend/core/epistemic_attestation.py"
      - "backend/tests/test_portable_claim_proof.py"
      - "backend/tests/test_portable_finality_proof.py"
      - "backend/tests/test_claim_proof_attestation.py"
      - "backend/tests/test_transparency_log.py"
      - ".github/workflows/portable-truth-proofs.yml"

permissions:
  contents: read

jobs:
  portable-truth-proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install "pytest>=8,<9"
      - name: Verify membership publication finality and freshness
        run: >-
          python -m pytest -q
          tests/test_portable_claim_proof.py
          tests/test_portable_finality_proof.py
          tests/test_claim_proof_attestation.py
          tests/test_transparency_log.py
