name: Dragon Hoarder source qualification

on:
  pull_request:
    paths:
      - 'skeleton/ai/webcrawler/**'
      - 'backend/core/dragon_crawler.py'
      - 'backend/core/dragon_vault.py'
      - 'backend/core/dragon_deep_archive.py'
      - 'tests/test_ai_webcrawler_dragon_archive_scale.py'
      - 'backend/tests/test_dragon_deep_archive.py'
      - 'backend/core/dragon_checkpoint_replica.py'
      - 'backend/tests/test_dragon_checkpoint_replica.py'
      - 'frontend/scripts/test-dragon-vault-scan.cjs'
      - 'backend/tests/test_dragon_vault_boundary.py'
      - 'tests/test_ai_webcrawler_dragon_vault.py'
      - 'backend/routes/dragon_academy.py'
      - 'backend/tests/test_dragon_treasury_boundary.py'
      - 'tests/test_ai_webcrawler_dragon_treasury.py'
      - 'tests/test_ai_webcrawler_dragon_archive_grant.py'
      - 'tests/test_ai_webcrawler_dragon_temporal_expansion.py'
      - 'tests/test_ai_webcrawler_dragon_legacy_archive.py'
      - 'scripts/benchmark_dragon_revisit.py'
      - 'frontend/src/features/Jeeves/**'
      - 'frontend/src/product/crawlerClient.ts'
      - 'frontend/scripts/test-dragon-hoarder-motion.cjs'
      - 'frontend/scripts/test-dragon-treasury-wire.cjs'
      - 'scripts/dragon_treasury_wire_fixture.py'
      - '.github/workflows/dragon-hoarder-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-hoarder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hoarder_source:
    name: Temporal separation, revisit mathematics and source permission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.16"
      - name: Compile and run completed offline treasury tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile skeleton/ai/webcrawler/dragon_treasury.py skeleton/ai/webcrawler/dragon_archive_grant.py skeleton/ai/webcrawler/dragon_revisit_model.py scripts/benchmark_dragon_revisit.py
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_treasury.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_archive_grant.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_temporal_expansion.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_legacy_archive.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_vault.py' -v
          python -m unittest discover -s tests -p 'test_ai_webcrawler_dragon_archive_scale.py' -v
          python -m scripts.benchmark_dragon_revisit
  hoarder_backend:
    name: Actual canonical capture and historical passage boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.16"
      - name: Install existing approved adapter dependency set
        run: >-
          python -m pip install --disable-pip-version-check
          "pymongo==4.19.0" "motor==3.7.1" "httpx>=0.28.1,<1"
          "python-dotenv>=1,<2" "fastapi>=0.142.2,<1"
          "pydantic>=2.14.1,<3" "pydantic-settings>=2.15.0,<3"
          "cryptography>=50.0.2"
      - name: Compile adapter and exercise exact retained passage
        env:
          PYTHONPATH: ".:backend:tests"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile backend/core/dragon_crawler.py backend/routes/dragon_academy.py
          python -m unittest discover -s backend/tests -p 'test_dragon_treasury_boundary.py' -v
          python -m unittest discover -s backend/tests -p 'test_dragon_vault_boundary.py' -v
          python -m unittest discover -s backend/tests -p 'test_dragon_deep_archive.py' -v
          python -m unittest discover -s backend/tests -p 'test_dragon_checkpoint_replica.py' -v
  hoarder_motion:
    name: Level-based physical animation and cozy repertoire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install the existing TypeScript compiler version into an isolated test directory
        run: npm install --prefix "$RUNNER_TEMP/dragon-ts" --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Verify all completed 60-level motion profiles and 10 phases
        run: NODE_PATH="$RUNNER_TEMP/dragon-ts/node_modules" node frontend/scripts/test-dragon-hoarder-motion.cjs
      - name: Verify bounded archive-wide discovery aggregation and cancellation
        run: NODE_PATH="$RUNNER_TEMP/dragon-ts/node_modules" node frontend/scripts/test-dragon-vault-scan.cjs
      - name: Exercise actual Python treasury projections against real client parser
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m scripts.dragon_treasury_wire_fixture > "$RUNNER_TEMP/dragon-treasury-wire.json"
          NODE_PATH="$RUNNER_TEMP/dragon-ts/node_modules" node frontend/scripts/test-dragon-treasury-wire.cjs "$RUNNER_TEMP/dragon-treasury-wire.json"
