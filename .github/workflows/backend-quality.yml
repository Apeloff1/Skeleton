name: Backend Quality

# Fast, fail-closed backend/security gate: lint, syntax compilation,
# security-policy scanners, and focused regression tests.

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install quality dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "ruff==0.9.*" "pytest>=8,<9" "fastapi==0.136.1"

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Syntax check (full backend)
        run: python -m compileall -q .

      - name: Process invocation safety gate
        run: python scripts/check_process_safety.py

      - name: Unsafe deserialization safety gate
        run: python scripts/check_deserialization_safety.py

      - name: High-confidence Python and JavaScript SAST gate
        run: python scripts/check_sast_security.py

      - name: JavaScript child_process alias safety gate
        run: python scripts/check_js_process_alias_safety.py

      - name: GitHub Actions workflow security gate
        run: python scripts/check_workflow_security.py

      - name: Repository secret hygiene gate
        run: python scripts/check_secret_hygiene.py

      - name: Security scanner and request-boundary regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          tests/test_exec_guard.py
          tests/test_process_safety_gate.py
          tests/test_process_safety_destructuring.py
          tests/test_process_safety_partial.py
          tests/test_process_safety_namespace_get.py
          tests/test_process_safety_getattribute.py
          tests/test_deserialization_safety_gate.py
          tests/test_sast_security_gate.py
          tests/test_js_process_alias_safety.py
          tests/test_workflow_security_gate.py
          tests/test_secret_hygiene_gate.py
          tests/test_request_id_propagation.py
