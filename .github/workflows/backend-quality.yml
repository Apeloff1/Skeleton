name: Backend Quality

# Fast, fail-closed backend gate: lint + syntax + security guard regressions.
# Keep this independent from the heavier dependency-backed integration suite.

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: pip install "ruff==0.9.*" "pytest==8.*"

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Syntax check (full backend)
        run: python -m compileall -q .

      - name: Execution security regressions
        env:
          PYTHONPATH: "."
        # These tests intentionally use only the stdlib. Do not load the global
        # backend conftest, which imports the full application dependency stack.
        run: pytest -q --noconftest tests/test_exec_guard.py tests/test_execution_security_contract.py
