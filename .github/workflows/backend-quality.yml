name: Backend Quality

# Fast, fail-closed backend gate: lint, syntax compilation, critical
# security-boundary regression tests, dependency audit, and repository policy.

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
      - ".github/workflows/**"
      - ".gitattributes"
      - "frontend/package.json"
      - "frontend/yarn.lock"

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install quality dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "ruff==0.9.*" "pytest>=8,<9"
          "fastapi>=0.110,<1" "httpx>=0.27,<1"

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Syntax check (full backend)
        run: python -m compileall -q .

      - name: Process invocation safety gate
        run: python scripts/check_process_safety.py

      - name: Deserialization safety gate
        run: python scripts/check_deserialization_safety.py

      - name: High-confidence SAST gate
        run: python scripts/check_sast_security.py

      - name: GitHub Actions workflow security gate
        run: python scripts/check_workflow_security.py

      - name: Repository secret hygiene gate
        run: python scripts/check_secret_hygiene.py

      - name: Immutable dependency declaration policy
        run: python scripts/check_dependency_policy.py

      - name: Repository artifact policy
        run: python scripts/check_artifact_policy.py

      - name: Audit Python dependencies for known vulnerabilities
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: backend/requirements.txt
          vulnerability-service: OSV
          summary: true

      - name: Generate deterministic CycloneDX SBOM
        run: python scripts/generate_sbom.py --output ../artifacts/sbom.cdx.json

      - name: Generate build provenance
        run: >-
          python scripts/generate_build_provenance.py
          --sbom ../artifacts/sbom.cdx.json
          --output ../artifacts/build-provenance.json

      - name: Generate evidence checksums
        run: cd ../artifacts && sha256sum sbom.cdx.json build-provenance.json > SHA256SUMS

      - name: Upload security build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-build-evidence
          path: |
            artifacts/sbom.cdx.json
            artifacts/build-provenance.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Security boundary regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          tests/test_exec_guard.py
          tests/test_process_safety_gate.py
          tests/test_process_safety_destructuring.py
          tests/test_process_safety_partial.py
          tests/test_process_safety_namespace_get.py
          tests/test_process_safety_getattribute.py
          tests/test_deserialization_safety_gate.py
          tests/test_sast_security_gate.py
          tests/test_workflow_security_gate.py
          tests/test_secret_hygiene_gate.py
          tests/test_dependency_policy.py
          tests/test_artifact_policy.py
          tests/test_sbom_generator.py
          tests/test_build_provenance.py
          tests/test_security_config.py
          tests/test_security_middleware_config.py
          tests/test_security_parser_fuzz.py
          tests/test_security_middleware_hardening.py
          tests/test_client_ip_security.py
          tests/test_size_limit_security.py
          tests/test_rate_limit_state_security.py
          tests/test_request_id_security.py
          tests/test_import_export_security.py
          tests/test_live_scraper_security.py
