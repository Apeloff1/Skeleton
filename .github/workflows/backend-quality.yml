name: Backend Quality

# Fast, fail-closed backend gate: lint, syntax compilation, critical
# security-boundary regression tests, and process invocation policy.
# Keep this independent from the heavier dependency-backed integration suite.

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install quality dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "ruff==0.9.*" "pytest>=8,<9"

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Syntax check (full backend)
        run: python -m compileall -q .

      - name: Process invocation safety gate
        run: python scripts/check_process_safety.py

      - name: Security boundary regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          tests/test_exec_guard.py
          tests/test_process_safety_gate.py
          tests/test_process_safety_destructuring.py
