name: Backend Quality

# Fast, fail-closed backend/security gate: lint, syntax compilation,
# security-policy scanners, architecture boundaries, and focused regression tests.

on:
  push:
    # PR checks already validate application changes before merge. Keep a
    # narrow post-merge self-check for security gate/policy modifications.
    branches: [main]
    paths:
      - ".github/workflows/backend-quality.yml"
      - ".github/ci/security-exceptions.json"
      - "scripts/quality-gates.sh"
      - "scripts/check_repository_python_sast.py"
      - "scripts/check_quality_gate_parity.py"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".emergent/cron/**"
      - ".github/ci/security-exceptions.json"
      - "backend/**"
      - "skeleton/**"
      - "frontend/**"
      - "docs/ARCHITECTURE.md"
      - "docs/CANONICAL_MODULE_BOUNDARIES.md"
      - "docs/SECURITY_INCIDENT_RESPONSE.md"
      - "scripts/check_architecture_boundaries.py"
      - "scripts/check_provider_runtime_boundary.py"
      - "scripts/check_context_execution_boundary.py"
      - "scripts/check_instruction_policy_boundary.py"
      - "scripts/check_quality_gate_parity.py"
      - "scripts/check_repository_python_sast.py"
      - "scripts/container_digest_refresh.py"
      - "scripts/quality-gates.sh"
      - "tests/test_architecture_boundaries.py"
      - "tests/test_provider_runtime_boundary.py"
      - "tests/test_context_execution_boundary.py"
      - "tests/test_instruction_policy_boundary.py"
      - "backend/tests/test_conversation_governance.py"
      - ".github/workflows/**"
      - "!.github/workflows/branch-clean.yml"

  workflow_dispatch:

permissions:
  contents: read

# A PR's newer head supersedes only that PR; main SHA evidence is immutable.
concurrency:
  group: backend-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify backend-quality scope
        id: scope
        working-directory: ${{ github.workspace }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "plan_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          current_base="$(git rev-parse FETCH_HEAD)"
          mapfile -t changed < <(git diff --name-only "$current_base" "$HEAD_SHA")
          full=false
          for path in "${changed[@]}"; do
            case "$path" in
              docs/plan/*|machine/ai_master_plan.json|scripts/check_ai_master_plan.py|skeleton/testing/test_ai_master_plan.py) ;;
              *) full=true ;;
            esac
          done
          if [ "${#changed[@]}" -eq 0 ]; then full=true; fi
          if [ "$full" = true ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "plan_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "plan_only=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11.16"
      - name: Install full quality dependencies
        if: steps.scope.outputs.full == 'true'
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "fastapi==0.161.1"
          "pydantic-settings>=2.15.0,<3" "httpx==0.28.1" "pymongo>=4,<5" "motor>=3,<4"
          "bcrypt>=4,<5" "PyJWT>=2,<3" "email-validator>=2,<3" "python-dotenv>=1,<2"
      - name: Share-route origin and URL injection regressions
        if: steps.scope.outputs.full == 'true'
        working-directory: ${{ github.workspace }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "backend"
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_share_page_security.py
      - name: Install plan-only quality runtime
        if: steps.scope.outputs.plan_only == 'true'
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "pydantic>=2.14.1,<3"
      - name: Validate plan-only masterplan contract
        if: steps.scope.outputs.plan_only == 'true'
        working-directory: ${{ github.workspace }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "."
        run: |
          python scripts/check_ai_master_plan.py
          python -m pytest -q --noconftest skeleton/testing/test_ai_master_plan.py
      # Backend ruff and compileall belong to CI/CD Backend Lint in
      # .github/workflows/ci.yml. Repeating them here queued a second runner
      # on every backend pull request.
      # Deep suite remains available on explicit specialized dispatch.
      - name: Jeeves game development, fidelity and continuous production contracts
        if: steps.scope.outputs.full == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "."
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_jeeves_game_completion.py
          skeleton/testing/test_jeeves_game_multidomain_upscale.py
          tests/test_game_builder_story_direction_quality.py
          tests/test_game_builder_story_dramaturgy_graph.py
          tests/test_game_builder_story_direction_shots.py
          tests/test_game_builder_story_gameplay_bridge.py
          tests/test_game_builder_story_playthrough_segments.py
          tests/test_game_builder_p0_campaign.py
          tests/test_game_builder_story_playable_payoffs.py
          skeleton/testing/test_jeeves_game_direction.py
          skeleton/testing/test_jeeves_game_render.py
          skeleton/testing/test_jeeves_game_quality.py
          skeleton/testing/test_jeeves_game_authoring.py
          skeleton/testing/test_jeeves_game_cli.py
          skeleton/testing/test_game_creator_cli.py
      - name: Jeeves working memory, adversarial verifier and code quality release
        if: steps.scope.outputs.full == 'true'
        working-directory: .
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "."
        run: |
          python -m py_compile \
            skeleton/jeeves/agent/working_context_cycle.py \
            skeleton/jeeves/agent/adversarial_verifier_review.py \
            skeleton/jeeves/agent/code_scrutiny_loop.py \
            skeleton/jeeves/agent/code_delivery_quality.py \
            skeleton/jeeves/agent/final_delivery_reviews.py \
            skeleton/jeeves/agent/delivery_evidence_journal.py \
            skeleton/jeeves/agent/delivery_assurance_milestones.py \
            skeleton/jeeves/agent/delivery_milestone_workbench.py \
            skeleton/jeeves/agent/delivery_milestone_queue.py \
            skeleton/jeeves/agent/delivery_milestone_store.py \
            skeleton/jeeves/agent/delivery_milestone_driver.py \
            skeleton/jeeves/agent/runtime.py \
            skeleton/jeeves/agent/adaptive_runtime.py
          python -m pytest -q --noconftest \
            tests/test_jeeves_working_context_cycle.py \
            tests/test_jeeves_adversarial_verifier_review.py \
            tests/test_jeeves_code_delivery_quality.py \
            tests/test_jeeves_final_delivery_reviews.py \
            tests/test_jeeves_delivery_evidence_journal.py \
            tests/test_jeeves_delivery_assurance_milestones.py \
            tests/test_jeeves_delivery_milestone_workbench.py \
            tests/test_jeeves_delivery_milestone_queue.py \
            tests/test_jeeves_delivery_milestone_store.py \
            tests/test_jeeves_delivery_milestone_driver.py \
            tests/test_jeeves_durable_milestone_runtime.py \
            tests/test_ai_100_real_milestone_execution.py \
            tests/test_jeeves_agent_mirror.py \
            skeleton/testing/test_operation_runtime.py
          python scripts/check_jeeves_agent_mirror.py

      - name: Jeeves source-bound asset compilers and exact Godot candidate checks
        if: steps.scope.outputs.full == 'true'
        working-directory: .
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "."
        run: |
          python -m compileall -q \
            skeleton/jeeves/ai/studio_world_chunks.py \
            skeleton/jeeves/ai/studio_world_spatial_index.py \
            skeleton/jeeves/ai/studio_world_streamer_godot.py
          python -m pytest -q --noconftest \
            skeleton/testing/test_jeeves_studio_asset_compilers_2026.py \
            skeleton/testing/test_jeeves_studio_mesh_lod_2026.py \
            skeleton/testing/test_jeeves_studio_mesh_physics_2026.py \
            skeleton/testing/test_jeeves_studio_mesh_placements_2026.py \
            skeleton/testing/test_jeeves_studio_native_mesh_probe_2026.py \
            skeleton/testing/test_jeeves_studio_world_spatial_index_2026.py \
            skeleton/testing/test_jeeves_studio_world_chunks_2026.py \
            skeleton/testing/test_jeeves_studio_world_streamer_2026.py \
            skeleton/testing/test_jeeves_studio_world_streaming_activation_2026.py \
