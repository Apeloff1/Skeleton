name: Backend Quality

# Fast, fail-closed backend/security gate: lint, syntax compilation,
# security-policy scanners, architecture boundaries, and focused regression tests.

on:
  push:
    branches: [main, master]
    paths:
      - ".emergent/cron/**"
      - "backend/**"
      - "skeleton/**"
      - "frontend/**"
      - "docs/ARCHITECTURE.md"
      - "docs/CANONICAL_MODULE_BOUNDARIES.md"
      - "docs/SECURITY_INCIDENT_RESPONSE.md"
      - "scripts/check_architecture_boundaries.py"
      - "scripts/check_provider_runtime_boundary.py"
      - "scripts/check_quality_gate_parity.py"
      - "scripts/check_repository_python_sast.py"
      - "scripts/container_digest_refresh.py"
      - "scripts/quality-gates.sh"
      - "tests/test_architecture_boundaries.py"
      - "tests/test_provider_runtime_boundary.py"
      - ".github/workflows/**"
      - "!.github/workflows/branch-clean.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
    paths:
      - ".emergent/cron/**"
      - "backend/**"
      - "skeleton/**"
      - "frontend/**"
      - "docs/ARCHITECTURE.md"
      - "docs/CANONICAL_MODULE_BOUNDARIES.md"
      - "docs/SECURITY_INCIDENT_RESPONSE.md"
      - "scripts/check_architecture_boundaries.py"
      - "scripts/check_provider_runtime_boundary.py"
      - "scripts/check_quality_gate_parity.py"
      - "scripts/check_repository_python_sast.py"
      - "scripts/container_digest_refresh.py"
      - "scripts/quality-gates.sh"
      - "tests/test_architecture_boundaries.py"
      - "tests/test_provider_runtime_boundary.py"
      - ".github/workflows/**"
      - "!.github/workflows/branch-clean.yml"

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Install quality dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "ruff==0.9.10" "pytest>=8,<9" "fastapi==0.136.1"
          "pydantic-settings>=2.1,<3" "httpx==0.28.1"

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Syntax check (full backend)
        run: python -m compileall -q .

      - name: Canonical local/CI quality parity gate
        working-directory: .
        run: python scripts/check_quality_gate_parity.py

      - name: Canonical architecture boundary gate
        working-directory: .
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python scripts/check_architecture_boundaries.py
          PYTHONPATH=. python -m pytest -q --noconftest tests/test_architecture_boundaries.py

      - name: Provider runtime boundary gate
        working-directory: .
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python scripts/check_provider_runtime_boundary.py
          PYTHONPATH=. python -m pytest -q --noconftest tests/test_provider_runtime_boundary.py

      - name: Production layer boundary gate
        run: python scripts/check_architecture_boundaries.py

      - name: Security scanner surface preflight
        run: python scripts/check_security_scan_surface.py

      - name: Defense control-plane contract
        working-directory: .
        run: python scripts/check_defense_control_plane_contract.py

      - name: Security scanner and capability fail-closed contracts
        working-directory: .
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          PYTHONPATH=. python -m pytest -q --noconftest
          skeleton/testing/test_scanner_integrity.py
          skeleton/testing/test_defense_control_plane_contract.py
          skeleton/testing/test_automation_control_plane.py
          skeleton/testing/test_security_rooted_fs.py
          skeleton/testing/test_security_archive_sandbox.py
          skeleton/testing/test_security_outbound_http.py
          tests/test_container_digest_refresh.py
          tests/test_container_digest_refresh_workflow.py
          tests/test_generated_code_sandbox.py

      - name: Process invocation safety gate
        run: python scripts/check_process_safety.py

      - name: Unsafe deserialization safety gate
        run: python scripts/check_deserialization_safety.py

      - name: Dynamic import safety gate
        run: python scripts/check_dynamic_import_safety.py

      - name: Tar archive extraction safety gate
        run: python scripts/check_archive_extraction_safety.py

      - name: High-confidence Python and JavaScript SAST gate
        run: python scripts/check_sast_security.py

      - name: Core/tooling Python high-confidence SAST gate
        working-directory: .
        run: python scripts/check_repository_python_sast.py

      - name: JavaScript child_process alias safety gate
        run: python scripts/check_js_process_alias_safety.py

      - name: GitHub Actions workflow security gate
        run: python scripts/check_workflow_security.py

      - name: GitHub Actions repository allowlist
        run: python scripts/check_workflow_action_allowlist.py

      - name: GitHub Actions token permissions
        run: python scripts/check_workflow_permissions.py

      - name: GitHub Actions trigger-fanout audit
        run: python scripts/check_workflow_trigger_fanout.py

      - name: GitHub Actions concurrency collision audit
        run: python scripts/check_workflow_concurrency.py

      - name: GitHub Actions workflow_run branch-completion contract
        run: python scripts/check_workflow_run_branch_completions.py

      - name: Repository secret hygiene gate
        run: python scripts/check_secret_hygiene.py

      - name: Repository malware and IOC gate
        run: python scripts/check_malware_iocs.py

      - name: Live-service backend test boundary
        run: |
          python scripts/check_live_service_test_boundaries.py
          python -m pytest -q --noconftest tests/test_live_service_test_boundaries.py

      - name: Security, provider-chaos, and developer-tooling adversarial regression tests
        working-directory: ..
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          PYTHONPATH=. python -m pytest -q --noconftest
          tests/test_architecture_boundaries.py
          tests/test_ai_provider_reliability.py
          tests/test_exec_guard.py
          tests/test_auth_security.py
          tests/test_process_safety_gate.py
          tests/test_process_safety_destructuring.py
          tests/test_process_safety_partial.py
          tests/test_process_safety_namespace_get.py
          tests/test_process_safety_getattribute.py
          tests/test_process_safety_helper_aliases.py
          tests/test_process_safety_scanner_coverage.py
          tests/test_deserialization_safety_gate.py
          tests/test_dynamic_import_safety.py
          tests/test_dynamic_import_exception_policy.py
          tests/test_scanner_nonempty_contract.py
          tests/test_archive_extraction_safety.py
          tests/test_security_scan_surface.py
          tests/test_live_scraper_network_security.py
          tests/test_ai_reader_error_redaction.py
          tests/test_sast_security_gate.py
          tests/test_sast_scan_coverage.py
          tests/test_repository_python_sast_scope.py
          tests/test_js_process_alias_safety.py
          tests/test_workflow_security_gate.py
          tests/test_workflow_flow_style_security.py
          tests/test_workflow_event_context_security.py
          tests/test_workflow_quoted_key_security.py
          tests/test_workflow_flow_uses_security.py
          tests/test_workflow_trigger_security.py
          tests/test_workflow_security_checkout_credentials.py
          tests/test_workflow_input_security_gate.py
          tests/test_workflow_event_shell_security.py
          tests/test_workflow_action_allowlist.py
          tests/test_workflow_permissions_gate.py
          tests/test_workflow_trigger_fanout_gate.py
          tests/test_workflow_concurrency_gate.py
          tests/test_workflow_run_branch_completions_contract.py
          tests/test_pr_obsolete_run_from_workflow_run.py
          tests/test_pr_obsolete_run_workflow_run.py
          tests/test_pr_obsolete_run_sweep.py
          tests/test_pr_obsolete_run_drain.py
          tests/test_secret_hygiene_gate.py
          tests/test_malware_ioc_gate.py
          tests/test_malware_ioc_io_fail_closed.py
          tests/test_developer_tooling_security.py
          tests/test_dependency_security_workflow_contract.py
          tests/test_incident_response_runbook.py
          tests/test_api_middleware_adversarial.py
          tests/test_api_middleware_regression_gaps.py
          tests/test_proxy_header_bounds.py
          tests/test_request_identity_logging_security.py
          tests/test_security_middleware_properties.py
          tests/test_webhook_cron_security.py
          tests/test_traffic_manager.py
          backend/tests/test_traffic_manager_workflow_contract.py
          tests/test_actions_housekeeping_live_reaper.py
          tests/test_queue_drain_housekeeping_cooldown.py
          tests/test_arm64_workflow_trigger_scope.py
          tests/test_ci_java_accelerator_dependencies.py
