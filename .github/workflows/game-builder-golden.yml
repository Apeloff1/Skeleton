name: Game Builder Golden

# Brief → Godot project → headless boot for the three reference games.
# Godot is downloaded in the job; the binary is not committed.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/forge/game_design_spec.py"
      - "skeleton/forge/game_content.py"
      - "skeleton/forge/genre_project.py"
      - "skeleton/forge/game_builder.py"
      - "skeleton/ai/forge/game_design_spec.py"
      - "skeleton/ai/forge/game_content.py"
      - "skeleton/ai/forge/genre_project.py"
      - "skeleton/ai/forge/game_builder.py"
      - "skeleton/testing/test_game_builder_golden.py"
      - "skeleton/__main__.py"
      - "skeleton/api/routes.py"
      - "README.md"
      - ".github/workflows/game-builder-golden.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-builder-golden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Godot 4.4.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot-4.4.1.zip"
          curl -fsSL \
            'https://downloads.godotengine.org/?version=4.4.1&flavor=stable&slug=linux.x86_64.zip' \
            --output "$archive"
          printf '%s  %s\n' 'd6e382fb531019f85630c1f485a561a0d20c4a2344b6c3847735cfee7da812aa' "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/skeleton-godot"
          chmod +x "$RUNNER_TEMP/skeleton-godot/Godot_v4.4.1-stable_linux.x86_64"
          echo "SKELETON_GODOT_BIN=$RUNNER_TEMP/skeleton-godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Golden briefs boot headless
        env:
          SKELETON_GAME_BUILDER_REQUIRE_GODOT: "1"
        run: python -m pytest -q --noconftest skeleton/testing/test_game_builder_golden.py
