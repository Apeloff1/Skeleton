name: Emerald V5 proximal wingfold source and binary custody
on:
  pull_request:
    paths:
      - 'assets/emerald/evolution-v5/proximal-wingfold-*'
      - 'assets/emerald/evolution-v5/pathfinder/**'
      - 'assets/emerald/evolution-v5/archivist/**'
      - 'scripts/emerald_v5_proximal_wingfold.py'
      - 'scripts/verify_emerald_v5_proximal.py'
      - 'scripts/verify_emerald_v5_proximal_publication.py'
      - 'scripts/test_emerald_v5_proximal*.py'
      - '.github/workflows/emerald-v5-proximal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned numerical support
        run: python -m pip install --only-binary=:all: numpy==2.3.5
      - name: Check source syntax
        run: python -m py_compile scripts/emerald_v5_proximal_wingfold.py scripts/verify_emerald_v5_proximal.py scripts/verify_emerald_v5_proximal_publication.py scripts/test_emerald_v5_proximal.py scripts/test_emerald_v5_proximal_publication.py
      - name: Run source and synthetic custody regressions
        run: |
          python scripts/test_emerald_v5_proximal.py
          python scripts/test_emerald_v5_proximal_publication.py
      - name: Explicit qualification hold
        run: echo 'Source, synthetic and manifest only. Mesh-CCD, 3D visual art, Unreal, RTX and original remote bytes are NOT qualified.'
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: startsWith(github.head_ref, 'assets/emerald-v5-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify actual raw Git binary bytes
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            assets/emerald-v5-pathfinder-proximal-20261117) stage=pathfinder ;;
            assets/emerald-v5-archivist-proximal-20261117) stage=archivist ;;
            *) echo 'Unknown payload branch';exit 1 ;;
          esac
          python3 scripts/verify_emerald_v5_proximal_publication.py verify-tree --stage "$stage"
