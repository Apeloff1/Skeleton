name: P1 Model Placement Gate

on:
  push:
    branches:
      - main
    paths:
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/network/model_placement.py"
      - "skeleton/ai/runtime/distributed/network/model_placement.py"
      - "skeleton/network/remote_execution.py"
      - "skeleton/network/__init__.py"
      - "skeleton/ai/runtime/distributed/network/__init__.py"
      - "skeleton/shells/worker_affinity.py"
      - "skeleton/shells/worker_capacity.py"
      - "skeleton/shells/worker_topology.py"
      - "skeleton/shells/worker_reservations.py"
      - "skeleton/testing/test_model_placement.py"
      - ".github/workflows/p1-model-placement.yml"
  pull_request:
    branches:
      - main
      - p1/dist-01-remote-worker-trust-20260928
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/network/model_placement.py"
      - "skeleton/ai/runtime/distributed/network/model_placement.py"
      - "skeleton/network/remote_execution.py"
      - "skeleton/network/__init__.py"
      - "skeleton/ai/runtime/distributed/network/__init__.py"
      - "skeleton/shells/worker_affinity.py"
      - "skeleton/shells/worker_capacity.py"
      - "skeleton/shells/worker_topology.py"
      - "skeleton/shells/worker_reservations.py"
      - "skeleton/testing/test_model_placement.py"
      - ".github/workflows/p1-model-placement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-model-placement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate topology-aware model placement
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile DIST-02 contracts
        run: >-
          python -m compileall -q
          skeleton/network/model_placement.py
          skeleton/ai/runtime/distributed/network/model_placement.py

      - name: Run placement and capacity regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_model_placement.py
          skeleton/testing/test_remote_execution_protocol.py
          skeleton/testing/test_worker_capacity_admission_balancer.py
          skeleton/testing/test_worker_state_scaling_topology.py
          skeleton/testing/test_worker_pressure_quota_affinity.py
          skeleton/testing/test_worker_reservations_maintenance_routes.py

      - name: Validate canonical AI file tree parity
        run: python scripts/check_ai_file_tree.py

      - name: Build accepted DIST-02 placement
        run: |
          set -euo pipefail
          mkdir -p .p1-dist-02
          python - <<'PY'
          import json
          from pathlib import Path

          from skeleton.contracts.canonical import EvidenceRef
          from skeleton.network.model_placement import (
              ModelPlacementRequest,
              ModelWarmObservation,
              WarmReadiness,
              qualify_model_placement,
              qualify_model_warmup,
          )
          from skeleton.network.remote_execution import (
              RemoteExecutionRequest,
              WorkerAttestation,
              issue_remote_execution_fence,
              qualify_remote_execution,
              worker_identity_digest,
          )
          from skeleton.shells.leases import LeaseRegistry
          from skeleton.shells.worker_capacity import (
              CapacityDemand,
              WorkerCapacity,
              WorkerCapacityCatalog,
          )
          from skeleton.shells.worker_heartbeat import (
              HeartbeatPolicy,
              HeartbeatRegistry,
          )
          from skeleton.shells.worker_identity import (
              WorkerIdentity,
              WorkerRegistry,
              WorkerRole,
          )
          from skeleton.shells.worker_reservations import (
              CapacityReservation,
          )

          now = [100.0]

          def clock():
              return now[0]

          worker = WorkerIdentity(
              worker_id="ci-model-worker",
              generation=1,
              role=WorkerRole.EXECUTOR,
              labels={
                  "zone": "zone-a",
                  "data_boundary": "eu",
                  "accelerator": "cpu",
              },
              features=frozenset(
                  {"remote-exec", "model-host"}
              ),
              protocol_version=1,
          )
          workers = WorkerRegistry(clock=clock)
          registration = workers.register(worker)
          heartbeats = HeartbeatRegistry(
              workers=workers,
              policy=HeartbeatPolicy(
                  late_after_seconds=5.0,
                  stale_after_seconds=10.0,
              ),
              clock=clock,
          )
          heartbeats.beat(worker, sequence=1)

          placement_request = ModelPlacementRequest(
              placement_id="ci-placement",
              model_id="ci-model",
              model_version="v1",
              model_digest="a" * 64,
              runtime_digest="b" * 64,
              tenant_id="ci-tenant",
              data_class="internal",
              allowed_data_boundaries=("eu",),
              required_role=WorkerRole.EXECUTOR,
              required_features=("model-host",),
              required_labels=(("accelerator", "cpu"),),
              topology_label_key="zone",
              min_topology_domains=1,
              max_topology_skew=1,
              demand_inflight=1,
              demand_weight=2,
              max_worker_inflight=4,
          )
          remote_request = RemoteExecutionRequest(
              operation_id="ci-warmup-operation",
              execution_id="ci-warmup-execution",
              tenant_id=placement_request.tenant_id,
              request_id="ci-warmup-request",
              coordinator_id="ci-placement-coordinator",
              action_digest="c" * 64,
              authority_digest="d" * 64,
              payload_digest=placement_request.warmup_payload_digest,
              required_role=WorkerRole.EXECUTOR,
              required_features=("model-host", "remote-exec"),
              required_labels=(("accelerator", "cpu"),),
              protocol_version=1,
              max_tokens=100,
              max_cost_units=2.0,
              max_wall_time_s=30.0,
          )
          leases = LeaseRegistry(clock=clock)
          lease = leases.acquire(
              remote_request.lease_key,
              worker.key,
              ttl_seconds=30.0,
          )
          fence = issue_remote_execution_fence(
              request=remote_request,
              worker=worker,
              lease=lease,
          )
          attestation = WorkerAttestation(
              worker_id=worker.worker_id,
              generation=worker.generation,
              identity_digest=worker_identity_digest(worker),
              runtime_digest="e" * 64,
              image_digest="f" * 64,
              policy_digest="1" * 64,
              verifier_id="github-actions:dist-02-worker-attestation",
              verifier_digest="2" * 64,
              evidence_refs=(
                  EvidenceRef(
                      source="ci://dist-02-worker-attestation",
                      digest="3" * 64,
                      category="worker_attestation",
                  ),
              ),
              observed_at=90.0,
              expires_at=200.0,
          )
          remote_grant = qualify_remote_execution(
              request=remote_request,
              worker=worker,
              registration=registration,
              liveness=heartbeats.liveness(worker),
              attestation=attestation,
              lease=lease,
              fence=fence,
              observed_at=clock(),
          )
          if not remote_grant.accepted:
              raise SystemExit(
                  f"DIST-02 remote grant rejected: {remote_grant.reasons}"
              )

          warm_authorization = qualify_model_warmup(
              request=placement_request,
              remote_request=remote_request,
              remote_grant=remote_grant,
              worker=worker,
              observed_at=clock(),
          )
          if not warm_authorization.accepted:
              raise SystemExit(
                  "DIST-02 warm authorization rejected: "
                  f"{warm_authorization.reasons}"
              )
          warm = ModelWarmObservation(
              placement_request_digest=placement_request.request_digest,
              authorization_digest=warm_authorization.decision_digest,
              worker_id=worker.worker_id,
              generation=worker.generation,
              worker_identity_digest=worker_identity_digest(worker),
              model_digest=placement_request.model_digest,
              runtime_digest=placement_request.runtime_digest,
              readiness=WarmReadiness.READY,
              observed_at=clock(),
              expires_at=180.0,
              evidence_refs=(
                  EvidenceRef(
                      source="ci://dist-02-warm-ready",
                      digest="4" * 64,
                      category="model_warm_readiness",
                  ),
              ),
              verifier_id="github-actions:dist-02-warm-verifier",
              verifier_digest="5" * 64,
          )
          capacities = WorkerCapacityCatalog(
              WorkerCapacity(max_inflight=2, max_weight=4)
          )
          reservation = CapacityReservation(
              reservation_id="ci-reservation",
              worker=worker,
              demand=CapacityDemand(inflight=1, weight=2),
              created_at=clock(),
              expires_at=180.0,
          )
          decision = qualify_model_placement(
              request=placement_request,
              registrations=(registration,),
              liveness={
                  worker.worker_id: heartbeats.liveness(worker)
              },
              capacities=capacities,
              active_weight={},
              active_assignments={"zone-a": 0},
              warm_authorizations={
                  worker.worker_id: warm_authorization
              },
              warm_observations={worker.worker_id: warm},
              reservation=reservation,
              observed_at=clock(),
          )
          if not decision.accepted:
              raise SystemExit(
                  f"DIST-02 placement rejected: {decision.reasons}"
              )
          evidence = decision.accepted_evidence_ref()
          Path(".p1-dist-02/decision.json").write_text(
              json.dumps(decision.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-dist-02/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head DIST-02 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-dist-02/config.digest").write_text(
              hashlib.sha256(
                  b"p1-dist-02-model-placement-v1"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-dist-02/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|dist-02"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-dist-02/verifier.digest").write_text(
              digest([
                  "skeleton/network/model_placement.py",
                  "skeleton/network/remote_execution.py",
                  "skeleton/shells/worker_affinity.py",
                  "skeleton/shells/worker_capacity.py",
                  "skeleton/shells/worker_topology.py",
                  "skeleton/shells/worker_reservations.py",
                  ".github/workflows/p1-model-placement.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-dist-02/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_model_placement.py",
                  "skeleton/testing/test_remote_execution_protocol.py",
                  "skeleton/testing/test_worker_capacity_admission_balancer.py",
                  "skeleton/testing/test_worker_state_scaling_topology.py",
                  "skeleton/testing/test_worker_pressure_quota_affinity.py",
                  "skeleton/testing/test_worker_reservations_maintenance_routes.py",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-DIST-02 \
            --accountability-id ACC-P1-DIST-02 \
            --configuration-digest "$(cat .p1-dist-02/config.digest)" \
            --environment-digest "$(cat .p1-dist-02/environment.digest)" \
            --verifier-id github-actions:p1-model-placement \
            --verifier-digest "$(cat .p1-dist-02/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-dist-02/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-dist-02/refs.json \
            --out .p1-dist-02/receipt.json \
            > .p1-dist-02/stdout.json

      - name: Assert exact-head DIST-02 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-dist-02/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("DIST-02 receipt head mismatch")
          if receipt["task_id"] != "P1-DIST-02":
              raise SystemExit("DIST-02 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-DIST-02":
              raise SystemExit("DIST-02 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("DIST-02 exact-head receipt OK", receipt["receipt_digest"])
          PY
