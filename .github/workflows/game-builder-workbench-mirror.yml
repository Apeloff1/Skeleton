name: Game Studio Witness Mirror and Visual Workspace
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: studio-witness-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-evidence-and-workspace:
    name: Witness and visual studio live execution (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      EXACT_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Exact PR head and least privilege checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_npc_witness_quests.py
            tests/test_game_builder_competitive_mirror_training.py
            tests/test_game_builder_project_workspace.py
            tests/test_game_builder_prompt_learning.py
            tests/test_game_builder_npc_event_quest_runtime.py
            tests/test_game_builder_game_tester_almanac.py
            tests/test_game_builder_training_flow.py
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Confirm source origin and syntax
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          python -m compileall -q skeleton/ai/game_builder
      - name: Execute real witnesses, adversarial cases and local studio
        shell: bash
        run: |
          python -m unittest tests.test_game_builder_npc_witness_quests tests.test_game_builder_competitive_mirror_training tests.test_game_builder_project_workspace tests.test_game_builder_prompt_learning tests.test_game_builder_npc_event_quest_runtime tests.test_game_builder_game_tester_almanac tests.test_game_builder_training_flow -v
