name: AI Effect Pass
on:
  pull_request:
    paths:
      - 'skeleton/ai/runtime/effects/**'
      - 'tests/test_ai_effect_runtime.py'
      - 'scripts/run_ai_effect_qualification.py'
      - 'docs/ai/full_effect_pass.md'
      - '.github/workflows/ai-effect-pass.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-effect-pass-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install declared runtime and test slice
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile effect plane
        run: python -m compileall -q skeleton/ai/runtime/effects scripts/run_ai_effect_qualification.py
      - name: Focused effect regressions
        run: python -m pytest -q tests/test_ai_effect_runtime.py
      - name: Executable qualification
        run: python scripts/run_ai_effect_qualification.py
