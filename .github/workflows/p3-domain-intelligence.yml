name: P3 Domain Intelligence

on:
  pull_request:
    paths:
      - "skeleton/jeeves/domain_system.py"
      - "skeleton/ai/agents/jeeves/domain_system.py"
      - "skeleton/testing/test_p3_domain_intelligence.py"
      - "machine/ai_p3_execution_map.json"
      - "machine/ai_p3_task_backlog.json"
      - ".github/workflows/p3-domain-intelligence.yml"
  push:
    branches:
      - main
      - feat/p3-autonomous-intelligence-expansion-atomic
    paths:
      - "skeleton/jeeves/domain_system.py"
      - "skeleton/ai/agents/jeeves/domain_system.py"
      - "skeleton/testing/test_p3_domain_intelligence.py"
      - "machine/ai_p3_execution_map.json"
      - "machine/ai_p3_task_backlog.json"
      - ".github/workflows/p3-domain-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-domain-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  domain-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused P3 runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"
      - name: Execute domain custody and teaching contracts
        run: python -m unittest -q skeleton.testing.test_p3_domain_intelligence
      - name: Revalidate P3 authority
        run: python scripts/check_p3_execution_map.py --json
