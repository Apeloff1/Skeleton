name: Game Builder Native Godot Replay

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/game_builder/**"
      - "tests/test_game_builder_dual_runtime.py"
      - "tests/test_game_builder_authored_tiles.py"
      - "tests/test_game_builder_tile_editor.py"
      - "tests/test_game_builder_studio_pipeline.py"
      - ".github/workflows/game-builder-native-godot-replay.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/ai/game_builder/**"
      - "tests/test_game_builder_dual_runtime.py"
      - "tests/test_game_builder_authored_tiles.py"
      - "tests/test_game_builder_studio_pipeline.py"
      - ".github/workflows/game-builder-native-godot-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-builder-native-godot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-replay:
    name: Native Godot 4 replay of Python-proved game
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: "."
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install non-.NET Godot 4
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: "4.4.1"
          use-dotnet: false
          include-templates: true
          cache: true
      - name: Verify exact-head and installed engine
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          godot --version
      - name: Compile native exporter and integration tests
        run: >-
          python -m py_compile
          skeleton/ai/game_builder/dual_runtime_export.py
          skeleton/ai/game_builder/dual_runtime_cli.py
          skeleton/ai/game_builder/authored_tiles.py
          tests/test_game_builder_dual_runtime.py
          tests/test_game_builder_authored_tiles.py
          skeleton/ai/game_builder/studio_tool_fabric.py
          skeleton/ai/game_builder/mirror_room_runtime.py
          skeleton/ai/game_builder/original_game_studio.py
          skeleton/ai/game_builder/original_game_studio_cli.py
          tests/test_game_builder_studio_pipeline.py
      - name: Run actual Godot native winning replays
        run: |
          set -euo pipefail
          python -m unittest             tests.test_game_builder_dual_runtime             tests.test_game_builder_authored_tiles             tests.test_game_builder_tile_editor             tests.test_game_builder_studio_pipeline -v
      - name: Create reproducible native desktop release fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game-builder/builds"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'game-builder'
          body = {
              'project_id': 'skeleton-original-native-2026',
              'title': 'Original Orbit Labyrinth',
              'subtitle': 'Original multi-level offline homebrew.',
              'seed': 204611, 'width': 15, 'height': 13,
              'levels': 2, 'collectibles_per_level': 2,
              'hazards_per_level': 3, 'theme': 'space', 'starting_health': 4,
          }
          (root / 'intent.json').write_text(json.dumps(body), encoding='utf-8')
          PY
          python -m skeleton.ai.game_builder.dual_runtime_cli \
            --intent "$RUNNER_TEMP/game-builder/intent.json" \
            --output "$RUNNER_TEMP/game-builder/project" --trusted-local-operator
          test -s "$RUNNER_TEMP/game-builder/project/godot/export_presets.cfg"
      - name: Export runnable Linux and Windows desktop applications
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/game-builder/project/godot"
          builds="$RUNNER_TEMP/game-builder/builds"
          godot --headless --path "$project" --import
          godot --headless --path "$project" --export-release Linux "$builds/original-game.x86_64"
          godot --headless --path "$project" --export-release 'Windows Desktop' "$builds/original-game.exe"
          test -s "$builds/original-game.x86_64"
          test -s "$builds/original-game.exe"
          file "$builds/original-game.x86_64" "$builds/original-game.exe"
          chmod +x "$builds/original-game.x86_64"
          "$builds/original-game.x86_64" --headless --quit-after 200 -- --verify-proof | tee "$builds/linux-native-replay.txt"
          grep -q NATIVE_REPLAY_OK "$builds/linux-native-replay.txt"
          cp "$RUNNER_TEMP/game-builder/project/release.json" "$builds/source-release.json"
          (cd "$builds" && sha256sum original-game.x86_64 original-game.exe source-release.json > SHA256SUMS)
      - name: Preserve unsigned desktop release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skeleton-original-game-linux-windows
          path: ${{ runner.temp }}/game-builder/builds/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
