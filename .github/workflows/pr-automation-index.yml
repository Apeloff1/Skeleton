name: PR Automation Index

on:
  workflow_run:
    # Merge Readiness is the canonical event-driven convergence point.
    # Extra configured checks are still inspected fail-closed by the runner;
    # if they complete later, the scheduled reconciliation observes them.
    workflows:
      - Merge Readiness
    # Evaluate terminal workflow state only. Requested/in-progress transitions
    # multiplied Actions load without adding merge-readiness information.
    types: [completed]
    # Main completions already fan out through the watched workflows.
    # Keep PR/feature heads event-driven and reconcile default-branch state on
    # the existing schedule/manual paths instead of multiplying privileged runs.
    branches-ignore:
      - main
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional PR number; blank scans recently updated open PRs"
        required: false
        type: string
      mode:
        description: "observe evaluates only; apply may merge after every configured gate passes"
        required: true
        default: observe
        type: choice
        options: [observe, apply]

# Privileged evaluation is intentionally restricted to triggers whose workflow
# definition is loaded from the trusted default branch. PR-head events are not
# accepted. Automatic CI transitions arrive through workflow_run; review-only
# state changes are repaired by the scheduled sweep or an explicit dispatch.
permissions:
  contents: read

concurrency:
  group: pr-automation-index
  cancel-in-progress: false

jobs:
  evaluate:
    # A cancelled Merge Readiness completion is a tombstone for a superseded
    # PR generation, not useful merge evidence. Skip it before allocating a
    # runner. The scheduled reconciliation remains the durable fallback.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_AUTOMATION_INDEX: .pr-automation/index.sqlite3
      PR_AUTOMATION_EXPORT: .pr-automation/index.jsonl
      PR_AUTOMATION_ALLOWED_BASES: ${{ vars.PR_AUTOMATION_ALLOWED_BASES || 'main' }}
      PR_AUTOMATION_REQUIRED_CHECKS: ${{ vars.PR_AUTOMATION_REQUIRED_CHECKS || 'Merge Readiness' }}
      PR_AUTOMATION_REQUIRED_APPROVALS: ${{ vars.PR_AUTOMATION_REQUIRED_APPROVALS || '1' }}
      PR_AUTOMATION_REQUIRE_CHECKS: ${{ vars.PR_AUTOMATION_REQUIRE_CHECKS || 'true' }}
      PR_AUTOMATION_REQUIRE_NO_CHANGES_REQUESTED: ${{ vars.PR_AUTOMATION_REQUIRE_NO_CHANGES_REQUESTED || 'true' }}
      PR_AUTOMATION_REQUIRE_RESOLVED_THREADS: ${{ vars.PR_AUTOMATION_REQUIRE_RESOLVED_THREADS || 'true' }}
      PR_AUTOMATION_ALLOW_FORK_MERGE: ${{ vars.PR_AUTOMATION_ALLOW_FORK_MERGE || 'false' }}
      PR_AUTOMATION_MERGE_WHEN_READY: ${{ vars.PR_AUTOMATION_MERGE_WHEN_READY || 'false' }}
      PR_AUTOMATION_MERGE_METHOD: ${{ vars.PR_AUTOMATION_MERGE_METHOD || 'squash' }}
      PR_AUTOMATION_MAX_CHANGED_FILES: ${{ vars.PR_AUTOMATION_MAX_CHANGED_FILES || '250' }}
      PR_AUTOMATION_MAX_LINE_DELTA: ${{ vars.PR_AUTOMATION_MAX_LINE_DELTA || '20000' }}
      PR_AUTOMATION_MAX_MUTATIONS: "1"
      PR_AUTOMATION_MAX_QUEUED_ACTIONS_RUNS: "40"
      PR_AUTOMATION_RUNNER_V2: "true"
      PR_RUNNER_MAX_TARGETS: "250"
      PR_RUNNER_MAX_REQUESTS: "2000"
      PR_RUNNER_MAX_GRAPHQL_REQUESTS: "200"
      PR_RUNNER_MAX_PAGES: "20"
      PR_RUNNER_MAX_RESPONSE_BYTES: "8388608"
      PR_RUNNER_MAX_EVENTS_EXPORTED: "100000"
      PR_RUNNER_DEADLINE_SECONDS: "600"
      PR_RUNNER_PER_TARGET_REQUEST_BUDGET: "100"
      PR_RUNNER_MIN_RATE_REMAINING: "50"
      PR_RUNNER_RETRY_ATTEMPTS: "3"
      PR_RUNNER_RETRY_CEILING_SECONDS: "30"
      # main is currently not branch-protected; exact live base-head binding remains mandatory.
      # Set the repository variable to true when branch protection/rulesets are enforced.\n      PR_RUNNER_REQUIRE_PROTECTED_BASE: ${{ vars.PR_RUNNER_REQUIRE_PROTECTED_BASE || 'false' }}
      PR_RUNNER_REQUIRE_EXACT_BASE_HEAD: "true"
      PR_RUNNER_QUEUE_PRESSURE_HOLD: "true"
      PR_RUNNER_PUBLISH_GATE_STATUS: "true"
      PR_RUNNER_REQUIRE_SAME_REPOSITORY_HEAD: "true"
      PR_RUNNER_REQUIRE_LATEST_REVIEWS_ON_HEAD: "true"
      SKELETON_AUTOMATION_PAUSED: ${{ vars.SKELETON_AUTOMATION_PAUSED }}
      SKELETON_AUTOMATION_QUARANTINED: ${{ vars.SKELETON_AUTOMATION_QUARANTINED }}
      SKELETON_AUTOMATION_HOLD_REASON: ${{ vars.SKELETON_AUTOMATION_HOLD_REASON }}

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Stage isolated trusted automation package
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/trusted-pr-automation"
          rm -rf "$trusted_root"
          mkdir -p "$trusted_root"
          cp -R skeleton/pr_automation "$trusted_root/pr_automation"
          printf 'TRUSTED_PR_AUTOMATION_ROOT=%s\n' "$trusted_root" >> "$GITHUB_ENV"

      - name: Restore durable PR index
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pr-automation
          key: pr-automation-index-${{ github.run_id }}
          restore-keys: |
            pr-automation-index-

      - name: Resolve execution mode
        id: mode
        shell: bash
        env:
          DISPATCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
          DEFAULT_MODE: ${{ vars.PR_AUTOMATION_MODE || 'observe' }}
        run: |
          set -euo pipefail
          mode="${DISPATCH_MODE:-$DEFAULT_MODE}"
          case "$mode" in observe|apply) ;; *) echo "invalid mode: $mode" >&2; exit 2 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Evaluate pull request state
        shell: bash
        env:
          PR_AUTOMATION_MODE: ${{ steps.mode.outputs.mode }}
          WORKFLOW_RUN_PR_HINTS: ${{ github.event_name == 'workflow_run' && toJSON(github.event.workflow_run.pull_requests.*.number) || '[]' }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          WORKFLOW_RUN_HEAD_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
          WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || '' }}
          WORKFLOW_RUN_WORKFLOW_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.workflow_id || '' }}
          WORKFLOW_RUN_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || '' }}
          WORKFLOW_RUN_STATUS: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.status || '' }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || '' }}
          WORKFLOW_RUN_EVENT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || '' }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || '' }}
        run: |
          set -euo pipefail
          run_pr_automation() {
            python -I -c 'import sys; root=sys.argv.pop(1); sys.path.insert(0, root); from pr_automation.runner import main; raise SystemExit(main())' \
              "$TRUSTED_PR_AUTOMATION_ROOT" "$@"
          }

          args=(--repo "$GITHUB_REPOSITORY")
          pr="${INPUT_PR:-}"
          if [[ -n "$pr" ]]; then
            [[ "$pr" =~ ^[0-9]+$ ]] || { echo "invalid PR number: $pr" >&2; exit 2; }
            args+=(--pr="$pr")
          elif [[ -n "${WORKFLOW_RUN_HEAD_SHA}" || -n "${WORKFLOW_RUN_HEAD_REF}" ]]; then
            if [[ -z "${WORKFLOW_RUN_HEAD_SHA}" || -z "${WORKFLOW_RUN_HEAD_REF}" ]]; then
              echo "workflow_run completion is missing head SHA or branch" >&2
              exit 2
            fi
            args+=(--head-sha="$WORKFLOW_RUN_HEAD_SHA" --head-ref="$WORKFLOW_RUN_HEAD_REF")
            if [[ -n "${DEFAULT_BRANCH}" ]]; then
              args+=(--default-branch="$DEFAULT_BRANCH")
            fi
            args+=(--pr-hints-json="${WORKFLOW_RUN_PR_HINTS:-[]}")
          else
            args+=(--limit 25)
          fi
          run_pr_automation "${args[@]}"

      - name: Save durable PR index
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pr-automation
          key: pr-automation-index-${{ github.run_id }}

      - name: Upload human-readable index
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-automation-index-${{ github.run_id }}
          path: |
            .pr-automation/index.jsonl
            .pr-automation/runner-report.json
            .pr-automation/runner-transport.json
            .pr-automation/runner-checkpoint.json
          if-no-files-found: warn
          retention-days: 30
