name: PR Automation Index

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional PR number; blank scans recently updated open PRs"
        required: false
        type: string
      mode:
        description: "observe evaluates only; apply may merge after every configured gate passes"
        required: true
        default: observe
        type: choice
        options: [observe, apply]

permissions:
  contents: read
  pull-requests: write

# One writer protects the restored SQLite index from cross-run lost updates.
concurrency:
  group: pr-automation-index
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_AUTOMATION_INDEX: .pr-automation/index.sqlite3
      PR_AUTOMATION_EXPORT: .pr-automation/index.jsonl
      PR_AUTOMATION_ALLOWED_BASES: ${{ vars.PR_AUTOMATION_ALLOWED_BASES || 'main' }}
      PR_AUTOMATION_REQUIRED_CHECKS: ${{ vars.PR_AUTOMATION_REQUIRED_CHECKS }}
      PR_AUTOMATION_REQUIRED_APPROVALS: ${{ vars.PR_AUTOMATION_REQUIRED_APPROVALS || '0' }}
      PR_AUTOMATION_REQUIRE_CHECKS: ${{ vars.PR_AUTOMATION_REQUIRE_CHECKS || 'true' }}
      PR_AUTOMATION_REQUIRE_RESOLVED_THREADS: ${{ vars.PR_AUTOMATION_REQUIRE_RESOLVED_THREADS || 'true' }}
      PR_AUTOMATION_ALLOW_FORK_MERGE: ${{ vars.PR_AUTOMATION_ALLOW_FORK_MERGE || 'false' }}
      PR_AUTOMATION_MERGE_WHEN_READY: ${{ vars.PR_AUTOMATION_MERGE_WHEN_READY || 'false' }}
      PR_AUTOMATION_MERGE_METHOD: ${{ vars.PR_AUTOMATION_MERGE_METHOD || 'squash' }}
      PR_AUTOMATION_MAX_CHANGED_FILES: ${{ vars.PR_AUTOMATION_MAX_CHANGED_FILES || '250' }}
      PR_AUTOMATION_MAX_LINE_DELTA: ${{ vars.PR_AUTOMATION_MAX_LINE_DELTA || '20000' }}
      PR_AUTOMATION_MAX_MUTATIONS: "1"

    steps:
      # pull_request_target is privileged. Execute only trusted default-branch
      # automation code; never check out or run the pull request head here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Restore durable PR index
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pr-automation
          key: pr-automation-index-${{ github.run_id }}
          restore-keys: |
            pr-automation-index-

      - name: Resolve execution mode
        id: mode
        shell: bash
        env:
          DISPATCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
          DEFAULT_MODE: ${{ vars.PR_AUTOMATION_MODE || 'observe' }}
        run: |
          set -euo pipefail
          mode="${DISPATCH_MODE:-$DEFAULT_MODE}"
          case "$mode" in observe|apply) ;; *) echo "invalid mode: $mode" >&2; exit 2 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Evaluate pull request state
        shell: bash
        env:
          PR_AUTOMATION_MODE: ${{ steps.mode.outputs.mode }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || '' }}
        run: |
          set -euo pipefail
          pr="${INPUT_PR:-$EVENT_PR}"
          if [[ -n "$pr" ]]; then
            [[ "$pr" =~ ^[0-9]+$ ]] || { echo "invalid PR number: $pr" >&2; exit 2; }
            python -m skeleton.pr_automation.runner --repo "$GITHUB_REPOSITORY" --pr "$pr"
          else
            python -m skeleton.pr_automation.runner --repo "$GITHUB_REPOSITORY" --limit 25
          fi

      - name: Save durable PR index
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pr-automation
          key: pr-automation-index-${{ github.run_id }}

      - name: Upload human-readable index
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-automation-index-${{ github.run_id }}
          path: .pr-automation/index.jsonl
          if-no-files-found: warn
          retention-days: 30
