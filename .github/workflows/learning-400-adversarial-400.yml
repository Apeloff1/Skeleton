name: Learning-400 + Adversarial-400 Authority

on:
  pull_request:
    branches: [main, codex/masterplan-cs-300]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, codex/masterplan-learning-400-adversarial-400]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-400-adversarial-400-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate paired learning authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check --no-input "pytest>=8,<9"

      - name: Compile
        run: >-
          python -m py_compile
          scripts/check_learning_400_adversarial_400.py
          tests/test_learning_400_adversarial_400.py

      - name: Validate machine authority
        run: python scripts/check_learning_400_adversarial_400.py

      - name: Run paired learning regressions
        run: python -m pytest -q --noconftest tests/test_learning_400_adversarial_400.py

      - name: Validate masterplan identity and parse-index freshness
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          master_path = Path("machine/ai_master_plan.json")
          master = json.loads(master_path.read_text(encoding="utf-8"))
          index = json.loads(Path("machine/ai_masterplan_parse_index.json").read_text(encoding="utf-8"))
          assert master["plan_version"] == "2.0.0"
          assert master["authority"]["learning_400_adversarial_400"] == "machine/learning_400_adversarial_400.json"
          expected = index["sources"]["machine/ai_master_plan.json"]["git_blob_sha"]
          actual = subprocess.check_output(["git","hash-object",str(master_path)], text=True).strip()
          assert actual == expected, (actual, expected)
          print("masterplan identity fresh", actual)
          PY

      - name: Confirm exact-head identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path("machine/learning_400_adversarial_400.json").read_text(encoding="utf-8"))
          print(
              "learning-400-adversarial-400",
              "learning=", len(d["learning_layers"]),
              "adversarial=", len(d["adversarial_layers"]),
              "paired_complete=", d["completion"]["paired_system_qualified"],
              "head=", os.environ["EXPECTED_SHA"],
          )
          PY
