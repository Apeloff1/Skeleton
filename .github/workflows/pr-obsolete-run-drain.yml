name: Drain obsolete PR Actions

on:
  workflow_run:
    workflows: ["PR Lifecycle Signal"]
    types: [requested]
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-obsolete-run-drain.yml'
      - 'backend/scripts/pr_obsolete_run_drain.py'
      - 'backend/scripts/pr_obsolete_run_from_workflow_run.py'
      - 'backend/scripts/pr_obsolete_run_sweep.py'

# Privilege separation: pull-request code only emits a read-only lifecycle
# signal. Privileged cleanup is loaded from the default branch. The event-driven
# path drains one PR immediately; trusted main/scheduled runs reconcile backlog
# whose original lifecycle signal was missed.
permissions: {}

concurrency:
  # Lifecycle signals for the same PR may supersede one another immediately.
  # Main/scheduled backlog sweeps must not kill an active cleanup worker merely
  # because main advances again while the repository is under queue pressure.
  group: pr-run-drain-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  drain:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      EVENT_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
      EVENT_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
      EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out trusted default-branch control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Cancel obsolete live PR-linked runs
        shell: bash
        run: |
          set -euo pipefail
          python backend/scripts/pr_obsolete_run_from_workflow_run.py

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MAX_CANCELLATIONS: '250'
    steps:
      - name: Check out trusted default-branch control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Reconcile missed obsolete PR runs
        shell: bash
        run: |
          set -euo pipefail
          python backend/scripts/pr_obsolete_run_sweep.py
