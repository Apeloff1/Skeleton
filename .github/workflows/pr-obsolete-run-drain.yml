name: Drain obsolete PR Actions

on:
  pull_request_target:
    branches: [main]
    types: [synchronize, closed]

# Security boundary: pull_request_target loads this workflow from a trusted
# default-branch revision. Checkout is pinned to github.workflow_sha, the exact
# immutable commit that supplied this workflow, so the helper code and workflow
# stay version-locked and pull-request head code is never executed.
permissions: {}

concurrency:
  group: pr-run-drain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drain:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_ACTION: ${{ github.event.action }}
      EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_BEFORE_SHA: ${{ github.event.before }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out trusted workflow control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Cancel obsolete live PR-linked runs
        shell: bash
        run: |
          set -euo pipefail
          python backend/scripts/pr_obsolete_run_drain.py
