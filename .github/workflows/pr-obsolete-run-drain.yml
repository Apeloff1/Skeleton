name: Drain obsolete PR Actions

on:
  workflow_run:
    workflows: ['PR Lifecycle Signal']
    types: [completed]

# workflow_run executes this workflow from the trusted default branch. The
# triggering PR workflow is unprivileged, and this job never consumes artifacts
# or executes code from the pull-request head.
permissions: {}

concurrency:
  group: pr-run-drain-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  drain:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Cancel obsolete live PR-linked runs
        shell: bash
        run: |
          set -euo pipefail
          python backend/scripts/pr_obsolete_run_drain.py
