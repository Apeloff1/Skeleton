name: AI Model Rollback Compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/ai/learning/model_rollback.py"
      - "skeleton/learning/model_rollback.py"
      - "skeleton/testing/test_model_rollback_compatibility.py"
      - ".github/workflows/model-rollback-compatibility.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/ai/learning/model_rollback.py"
      - "skeleton/learning/model_rollback.py"
      - "skeleton/testing/test_model_rollback_compatibility.py"
      - ".github/workflows/model-rollback-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-model-rollback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused Skeleton runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
      - name: Run rollback compatibility contract
        run: python -m unittest -q skeleton.testing.test_model_rollback_compatibility
