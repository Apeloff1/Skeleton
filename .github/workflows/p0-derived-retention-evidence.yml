name: P0 Derived Retention Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/memory/projection.py"
      - "skeleton/testing/test_memory_projection.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-derived-retention-evidence.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/memory/projection.py"
      - "skeleton/testing/test_memory_projection.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-derived-retention-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derived-retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run derived retention regression
        run: >-
          python -m pytest -q
          skeleton/testing/test_memory_projection.py::test_derived_vector_retention_expires_with_source_memory
