name: Frontier Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'skeleton/frontier/**'
      - 'skeleton/testing/test_frontier_*.py'
      - 'pyproject.toml'
      - '.github/workflows/frontier-contracts.yml'
  push:
    branches:
      - 'frontier/**'
    paths:
      - 'skeleton/frontier/**'
      - 'skeleton/testing/test_frontier_*.py'
      - 'pyproject.toml'
      - '.github/workflows/frontier-contracts.yml'

concurrency:
  group: frontier-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install frontier test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest pytest-asyncio
      - name: Compile frontier package
        run: python -m compileall -q skeleton/frontier
      - name: Run frontier contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q skeleton/testing/test_frontier_*.py
