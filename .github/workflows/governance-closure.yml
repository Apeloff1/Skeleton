name: Governance Closure Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/vault/**"
      - "skeleton/artifact_plane/governance.py"
      - "skeleton/retrieval/governance.py"
      - "skeleton/memory/policy.py"
      - "skeleton/memory/writeback.py"
      - "skeleton/memory/projection.py"
      - "skeleton/persistence/memory_repository.py"
      - "skeleton/api/server.py"
      - "skeleton/ai/runtime/api/server.py"
      - "backend/core/route_privacy.py"
      - "backend/api_middleware.py"
      - "backend/core/engine_text.py"
      - "backend/core/conversations.py"
      - "backend/core/gameforge_artifact_builder.py"
      - "backend/services/tool_registry.py"
      - "backend/routes/gameforge_build.py"
      - "backend/routes/gameforge_studio.py"
      - "skeleton/testing/test_data_governance.py"
      - "skeleton/testing/test_data_lifecycle.py"
      - "skeleton/testing/test_governance_audit.py"
      - "skeleton/testing/test_lifecycle_adapters.py"
      - "skeleton/testing/test_governance_runtime_binding.py"
      - "skeleton/testing/test_memory_writeback.py"
      - "skeleton/testing/test_memory_projection.py"
      - "backend/tests/test_route_privacy.py"
      - "backend/tests/test_conversation_storage_admission.py"
      - "backend/tests/test_gameforge_artifact_builder.py"
      - "machine/ai_app_construction.json"
      - "machine/ai_closure_evidence.json"
      - "machine/ai_implementation_handoff.json"
      - ".github/workflows/governance-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-contracts:
    name: Governance contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused governance runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "httpx==0.28.1"
          "PyJWT==2.14.0"
          "python-dotenv==1.2.3"

      - name: Run canonical governance lifecycle contracts
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_data_governance.py
          skeleton/testing/test_data_lifecycle.py
          skeleton/testing/test_governance_audit.py
          skeleton/testing/test_lifecycle_adapters.py
          skeleton/testing/test_governance_runtime_binding.py

      - name: Run governed memory and projection contracts
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_memory_writeback.py
          skeleton/testing/test_memory_projection.py

      - name: Run backend route and durable-write governance contracts
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_route_privacy.py
          backend/tests/test_conversation_storage_admission.py
          backend/tests/test_gameforge_artifact_builder.py
