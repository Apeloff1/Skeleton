name: Governance Closure Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/vault/**"
      - "skeleton/artifact_plane/governance.py"
      - "skeleton/retrieval/governance.py"
      - "skeleton/memory/policy.py"
      - "skeleton/memory/writeback.py"
      - "skeleton/memory/projection.py"
      - "skeleton/persistence/memory_repository.py"
      - "skeleton/api/server.py"
      - "skeleton/ai/runtime/api/server.py"
      - "backend/core/route_privacy.py"
      - "backend/api_middleware.py"
      - "backend/core/engine_text.py"
      - "backend/core/conversations.py"
      - "backend/core/gameforge_artifact_builder.py"
      - "backend/services/tool_registry.py"
      - "backend/routes/gameforge_build.py"
      - "backend/routes/gameforge_studio.py"
      - "skeleton/testing/test_data_governance.py"
      - "skeleton/testing/test_data_lifecycle.py"
      - "skeleton/testing/test_governance_audit.py"
      - "skeleton/testing/test_lifecycle_adapters.py"
      - "skeleton/testing/test_governance_runtime_binding.py"
      - "skeleton/testing/test_memory_writeback.py"
      - "skeleton/testing/test_memory_projection.py"
      - "backend/tests/test_route_privacy.py"
      - "backend/tests/test_conversation_storage_admission.py"
      - "backend/tests/test_conversation_governance.py"
      - "backend/tests/test_gameforge_artifact_builder.py"
      - "scripts/verify_governance_closure.py"
      - "tests/test_governance_independent_verifier.py"
      - "machine/ai_app_construction.json"
      - "machine/ai_closure_evidence.json"
      - "machine/ai_implementation_handoff.json"
      - ".github/workflows/governance-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-contracts:
    name: Governance contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused governance runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "httpx==0.28.1"
          "PyJWT==2.14.0"
          "python-dotenv==1.2.3"

      - name: Run canonical governance lifecycle contracts
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_data_governance.py
          skeleton/testing/test_data_lifecycle.py
          skeleton/testing/test_governance_audit.py
          skeleton/testing/test_lifecycle_adapters.py
          skeleton/testing/test_governance_runtime_binding.py

      - name: Run governed memory and projection contracts
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_memory_writeback.py
          skeleton/testing/test_memory_projection.py

      - name: Run backend route and durable-write governance contracts
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_route_privacy.py
          backend/tests/test_conversation_storage_admission.py
          backend/tests/test_conversation_governance.py
          backend/tests/test_gameforge_artifact_builder.py

  governance-independent:
    name: Independent governance verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install independent verifier test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=7.0.0"

      - name: Run independent governance verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_governance_independent_verifier.py

      - name: Run independent exact-head governance scan
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_governance_closure.py
          --evidence-out .governance-independent.json
          --print-evidence

      - name: Assert independent exact-head receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".governance-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit(
                  "independent governance receipt does not match exact PR head"
              )
          if receipt.get("verifier") != "independent-governance-v1":
              raise SystemExit("unexpected independent governance verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent governance verification failed")
          if len(receipt.get("boundary_digests") or {}) < 12:
              raise SystemExit("independent governance boundary coverage is incomplete")
          if len(receipt.get("mirror_pairs") or []) < 9:
              raise SystemExit("independent governance mirror coverage is incomplete")
          if not receipt.get("blueprint_digest"):
              raise SystemExit("governance blueprint digest is missing")
          if not receipt.get("state_topology_digest"):
              raise SystemExit("governance state-topology digest is missing")
          print(
              "independent governance exact-head receipt:",
              expected,
              "boundaries=",
              len(receipt["boundary_digests"]),
              "mirrors=",
              len(receipt["mirror_pairs"]),
          )
          PY
