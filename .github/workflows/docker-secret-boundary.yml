name: Docker build-context secret boundary

on:
  pull_request:
    paths:
      - 'frontend/Dockerfile'
      - 'frontend/.dockerignore'
      - 'backend/scripts/check_docker_secret_boundary.py'
      - 'backend/tests/test_docker_secret_boundary.py'
      - '.github/workflows/docker-secret-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/Dockerfile'
      - 'frontend/.dockerignore'
      - 'backend/scripts/check_docker_secret_boundary.py'
      - 'backend/tests/test_docker_secret_boundary.py'
      - '.github/workflows/docker-secret-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Docker build-context secret boundary
        run: python backend/scripts/check_docker_secret_boundary.py
      - name: Regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q --noconftest backend/tests/test_docker_secret_boundary.py
