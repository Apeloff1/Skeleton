name: VOL-053 Import Architecture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/python_package_layers.json"
      - "machine/architecture_rule_registry.json"
      - "scripts/check_architecture_package_layers.py"
      - "scripts/check_architecture_packaged_wheel.py"
      - "scripts/verify_vol053_import_architecture.py"
      - "tests/test_architecture_package_layers.py"
      - "tests/test_architecture_packaged_wheel.py"
      - "tests/test_vol053_import_architecture_independent.py"
      - ".github/workflows/vol053-import-architecture.yml"
  push:
    branches: [main]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/python_package_layers.json"
      - "machine/architecture_rule_registry.json"
      - "scripts/check_architecture_package_layers.py"
      - "scripts/check_architecture_packaged_wheel.py"
      - "scripts/verify_vol053_import_architecture.py"
      - "tests/test_architecture_package_layers.py"
      - "tests/test_architecture_packaged_wheel.py"
      - "tests/test_vol053_import_architecture_independent.py"
      - ".github/workflows/vol053-import-architecture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol053-import-architecture-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaged-import-behavior:
    name: Canonical isolated packaged-wheel imports
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install pinned wheel tooling and focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          "setuptools==83.0.0"
          "wheel==0.48.0"
          "pytest>=8,<9"
      - name: Compile VOL-053 surfaces
        run: >-
          python -m compileall -q
          scripts/check_architecture_package_layers.py
          scripts/check_architecture_packaged_wheel.py
          scripts/verify_vol053_import_architecture.py
          tests/test_architecture_package_layers.py
          tests/test_architecture_packaged_wheel.py
          tests/test_vol053_import_architecture_independent.py
      - name: Execute canonical path-hack and import-direction validator
        run: python scripts/check_architecture_package_layers.py --json
      - name: Execute canonical isolated packaged-wheel validator
        run: python scripts/check_architecture_packaged_wheel.py --json
      - name: Run canonical import-architecture regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_architecture_package_layers.py
          tests/test_architecture_packaged_wheel.py

  import-architecture-independent:
    name: Independent exact-head VOL-053 verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
      - name: Run independent VOL-053 regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_vol053_import_architecture_independent.py
      - name: Emit independent exact-head receipt
        run: >-
          python scripts/verify_vol053_import_architecture.py
          --evidence-out .vol053-import-architecture.json
          --print-evidence
      - name: Assert exact-head receipt identity and coverage
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".vol053-import-architecture.json").read_text(encoding="utf-8")
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("VOL-053 receipt does not bind exact head")
          if receipt.get("volume") != "VOL-053":
              raise SystemExit("VOL-053 verifier bound wrong volume")
          if receipt.get("verifier") != "independent-vol053-import-architecture-v1":
              raise SystemExit("unexpected VOL-053 verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent VOL-053 verification failed")
          contract = receipt.get("source_contract") or {}
          if contract.get("probe_count", 0) < 15:
              raise SystemExit("VOL-053 packaged-wheel probe coverage is too small")
          critical = {"skeleton", "skeleton.kernel", "skeleton.jeeves", "skeleton.api"}
          if not critical.issubset(set(contract.get("probes") or [])):
              raise SystemExit("VOL-053 critical wheel probe coverage is incomplete")
          rules = {
              item.get("rule_id")
              for item in receipt.get("registry_bindings") or []
          }
          if rules != {"ARCH-PYTHON-LAYERS", "ARCH-PACKAGED-WHEEL"}:
              raise SystemExit("VOL-053 architecture rule bindings are incomplete")
          if len(receipt.get("receipt_digest") or "") != 64:
              raise SystemExit("VOL-053 receipt digest is invalid")
          print(
              "VOL-053 independent exact-head receipt:",
              expected,
              receipt["receipt_digest"],
          )
          PY
