name: Reproducible Release

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-build.txt"
      - "scripts/release_provenance.py"
      - "scripts/ai_release_evidence.py"
      - "scripts/testing/test_release_provenance.py"
      - "scripts/testing/test_ai_release_evidence.py"
      - "skeleton/release/evidence.py"
      - "skeleton/release/ai_journey_evidence.py"
      - "skeleton/testing/test_ai_journey_evidence.py"
      - "skeleton/testing/test_artifact_usage_meter.py"
      - "skeleton/release/ai_journey_evidence.py"
      - "skeleton/testing/test_ai_journey_evidence.py"
      - "skeleton/testing/test_artifact_usage_meter.py"
      - "skeleton/testing/test_release_evidence.py"
      - "backend/core/engine_client.py"
      - "backend/core/operation_stream_transport.py"
      - "backend/routes/operation_stream.py"
      - "backend/tests/test_ai_golden_journey.py"
      - "backend/tests/test_ai_chat_conversation_authority.py"
      - "backend/tests/test_operation_stream_transport.py"
      - "backend/tests/test_operation_stream_route.py"
      - "backend/tests/test_engine_client.py"
      - "backend/tests/test_engine_provider_adapter.py"
      - "frontend/services/operationStream.ts"
      - "frontend/services/operationStreamReducer.ts"
      - "frontend/scripts/test-operation-stream-reducer.mjs"
      - "skeleton/api/engine_*.py"
      - "skeleton/context/**"
      - "skeleton/intelligence/execution_runtime.py"
      - "skeleton/intelligence/verification_*.py"
      - "skeleton/persistence/execution_repository.py"
      - "skeleton/provider_contract.py"
      - "skeleton/provider_runtime.py"
      - "skeleton/skills/tool_*.py"
      - "skeleton/testing/test_provider_contract.py"
      - "skeleton/testing/test_verification_runtime.py"
      - "skeleton/testing/test_execution_repository.py"
      - "skeleton/testing/test_engine_execution_*.py"
      - "skeleton/testing/test_execution_runtime.py"
      - "skeleton/testing/test_tool_runtime.py"
      - ".github/workflows/reproducible-release.yml"
      - "docs/REPRODUCIBLE_RELEASES.md"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-build.txt"
      - "scripts/release_provenance.py"
      - "scripts/ai_release_evidence.py"
      - "scripts/testing/test_release_provenance.py"
      - "scripts/testing/test_ai_release_evidence.py"
      - "skeleton/release/evidence.py"
      - "skeleton/testing/test_release_evidence.py"
      - "backend/core/engine_client.py"
      - "backend/core/operation_stream_transport.py"
      - "backend/routes/operation_stream.py"
      - "backend/tests/test_ai_golden_journey.py"
      - "backend/tests/test_ai_chat_conversation_authority.py"
      - "backend/tests/test_operation_stream_transport.py"
      - "backend/tests/test_operation_stream_route.py"
      - "backend/tests/test_engine_client.py"
      - "backend/tests/test_engine_provider_adapter.py"
      - "frontend/services/operationStream.ts"
      - "frontend/services/operationStreamReducer.ts"
      - "frontend/scripts/test-operation-stream-reducer.mjs"
      - "skeleton/api/engine_*.py"
      - "skeleton/context/**"
      - "skeleton/intelligence/execution_runtime.py"
      - "skeleton/intelligence/verification_*.py"
      - "skeleton/persistence/execution_repository.py"
      - "skeleton/provider_contract.py"
      - "skeleton/provider_runtime.py"
      - "skeleton/skills/tool_*.py"
      - "skeleton/testing/test_provider_contract.py"
      - "skeleton/testing/test_verification_runtime.py"
      - "skeleton/testing/test_execution_repository.py"
      - "skeleton/testing/test_engine_execution_*.py"
      - "skeleton/testing/test_execution_runtime.py"
      - "skeleton/testing/test_tool_runtime.py"
      - ".github/workflows/reproducible-release.yml"
      - "docs/REPRODUCIBLE_RELEASES.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11.11"
  PYTHONHASHSEED: "0"
  TZ: "UTC"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

jobs:
  reproducible-release:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Reproducible Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source-a
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout clean build B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source-b
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: source-a/requirements-build.txt

      - name: Install pinned build toolchain
        run: python -m pip install --disable-pip-version-check -r source-a/requirements-build.txt

      - name: Run release evidence regression tests
        env:
          PYTHONPATH: source-a
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "pytest==8.4.2" \
            "pytest-asyncio==1.4.0" \
            "pydantic==2.13.5" \
            "pydantic-settings==2.15.0" \
            "fastapi>=0.110,<1" \
            "httpx>=0.27,<1"
          mkdir -p source-a/release-meta
          python -m pytest -q \
            source-a/scripts/testing/test_release_provenance.py \
            source-a/scripts/testing/test_ai_release_evidence.py \
            source-a/skeleton/testing/test_release_evidence.py \
            source-a/skeleton/testing/test_ai_journey_evidence.py \
            --junitxml=source-a/release-meta/release-tests.xml
          python -m pytest -q \
            source-a/backend/tests/test_ai_golden_journey.py \
            source-a/backend/tests/test_ai_chat_conversation_authority.py \
            source-a/backend/tests/test_operation_stream_transport.py \
            source-a/backend/tests/test_operation_stream_route.py \
            source-a/backend/tests/test_engine_client.py \
            source-a/backend/tests/test_engine_provider_adapter.py \
            source-a/skeleton/testing/test_provider_contract.py \
            source-a/skeleton/testing/test_verification_runtime.py \
            source-a/skeleton/testing/test_execution_repository.py \
            source-a/skeleton/testing/test_execution_runtime.py \
            source-a/skeleton/testing/test_tool_runtime.py \
            source-a/skeleton/testing/test_engine_execution_service.py \
            source-a/skeleton/testing/test_engine_execution_coordinator.py \
            source-a/skeleton/testing/test_artifact_usage_meter.py \
            --junitxml=source-a/release-meta/ai-runtime-eval.xml

      - name: Build release A
        working-directory: source-a
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build --no-isolation --outdir dist
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [[ ${#sdists[@]} -ne 1 ]]; then
            echo "expected exactly one source distribution, found ${#sdists[@]}" >&2
            exit 1
          fi
          python scripts/release_provenance.py normalize-sdist \
            --path "${sdists[0]}" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          python scripts/release_provenance.py sbom \
            --pyproject pyproject.toml \
            --output dist/release-sbom.cdx.json \
            --source-commit "$GITHUB_SHA"
          mkdir -p release-meta
          python scripts/release_provenance.py emit \
            --artifacts-dir dist \
            --output release-meta/release-provenance.json \
            --checksums release-meta/SHA256SUMS \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --input pyproject.toml \
            --input requirements-build.txt \
            --input requirements.txt \
            --sbom-ref dist/release-sbom.cdx.json

      - name: Build release B from clean checkout
        working-directory: source-b
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build --no-isolation --outdir dist
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [[ ${#sdists[@]} -ne 1 ]]; then
            echo "expected exactly one source distribution, found ${#sdists[@]}" >&2
            exit 1
          fi
          python scripts/release_provenance.py normalize-sdist \
            --path "${sdists[0]}" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          python scripts/release_provenance.py sbom \
            --pyproject pyproject.toml \
            --output dist/release-sbom.cdx.json \
            --source-commit "$GITHUB_SHA"
          mkdir -p release-meta
          python scripts/release_provenance.py emit \
            --artifacts-dir dist \
            --output release-meta/release-provenance.json \
            --checksums release-meta/SHA256SUMS \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --input pyproject.toml \
            --input requirements-build.txt \
            --input requirements.txt \
            --sbom-ref dist/release-sbom.cdx.json

      - name: Verify byte-for-byte reproducibility
        shell: bash
        run: |
          set -euo pipefail
          python source-a/scripts/release_provenance.py compare \
            source-a/release-meta/release-provenance.json \
            source-b/release-meta/release-provenance.json
          diff -u source-a/release-meta/SHA256SUMS source-b/release-meta/SHA256SUMS

      - name: Bind tests, evaluation and artifact bytes into release evidence
        working-directory: source-a
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ai_release_evidence.py \
            --record release-tests=release-meta/release-tests.xml \
            --stage7-report release-meta/ai-runtime-eval.xml \
            --stage7-lane test \
            --output release-meta/test-evidence.json
          python scripts/ai_release_evidence.py \
            --stage7-report release-meta/ai-runtime-eval.xml \
            --stage7-lane eval \
            --output release-meta/eval-evidence.json

          mapfile -t artifact_names < <(
            find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          if (( ${#artifact_names[@]} == 0 )); then
            echo "release artifact inventory is empty" >&2
            exit 1
          fi
          observed=()
          for name in "${artifact_names[@]}"; do
            observed+=(--observed "${name}=dist/${name}")
          done

          python scripts/release_provenance.py evidence \
            --provenance release-meta/release-provenance.json \
            --output release-meta/release-evidence.json \
            --source-commit "$GITHUB_SHA" \
            --test-evidence release-meta/test-evidence.json \
            --eval-evidence release-meta/eval-evidence.json \
            --gate \
            "${observed[@]}"

          python scripts/release_provenance.py gate \
            --evidence release-meta/release-evidence.json \
            --source-commit "$GITHUB_SHA" \
            "${observed[@]}"

      - name: Publish verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-release-${{ github.sha }}
          path: |
            source-a/dist/
            source-a/release-meta/
          if-no-files-found: error
          retention-days: 30
