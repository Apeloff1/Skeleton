name: Jeeves offline game custody qualification

on:
  pull_request:
    paths:
      - skeleton/app/offline_install_quarantine.py
      - skeleton/testing/test_app_offline_install_quarantine.py
      - skeleton/testing/test_app_offline_signed_game_library_audit.py
      - skeleton/testing/test_app_offline_signed_game_library_relocation.py
      - skeleton/ai/runtime/production_fabric/product/api.py
      - skeleton/ai/runtime/production_fabric/product/cli.py
      - .github/workflows/jeeves-offline-game-custody-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jeeves-offline-custody-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quarantine-and-signed-games:
    name: Read-only quarantine and signed-game replay qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install canonical Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install existing local-native fixture dependencies
        run: |
          python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "pytest>=8,<9" "pytest-asyncio>=0.24,<2" "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0" "fastapi>=0.142.2,<1" "pydantic>=2.14.1,<3" "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2" "numpy>=2,<3" "Pillow>=13.0.0,<14" "regex>=2026.9.29,<2027"
      - name: Compile all guarded custody entrypoints and tests
        run: |
          python -m compileall -q skeleton/app/offline_install_quarantine.py skeleton/app/offline_signed_game_library_audit.py skeleton/testing/test_app_offline_install_quarantine.py skeleton/testing/test_app_offline_signed_game_library_audit.py skeleton/testing/test_app_offline_signed_game_library_relocation.py skeleton/ai/runtime/production_fabric/product
      - name: Test actual private-custody and signed-game replay
        env:
          PYTHONPATH: .:backend
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          export TMPDIR="$HOME"
          python -m pytest -q --maxfail=1 \
            skeleton/testing/test_app_offline_install_quarantine.py \
            skeleton/testing/test_app_offline_signed_game_library_audit.py \
            skeleton/testing/test_app_offline_signed_game_library_relocation.py
      - name: Prove single offline API dispatcher compatibility
        env:
          PYTHONPATH: .:backend
          PYTHONNOUSERSITE: "1"
        run: |
          python -m unittest skeleton.testing.test_jeeves_architecture_and_evidence_window -v
