name: P1 Adversarial AC-02 Evidence Gate

on:
  push:
    branches:
      - "p1/adversarial-ac02-evidence-*"
  pull_request:
    branches:
      - main
      - p1/risk-classification-evidence-batch1-20260930
      - p1/closure-rollup-495-18-20260930
      - p1/adversarial-ac09-binding-live-20260930
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "skeleton/shells/worker_shutdown.py"
      - "skeleton/testing/test_worker_fairness_failover_shutdown.py"
      - "scripts/state_recovery_drill.py"
      - "skeleton/testing/test_state_recovery_drill.py"
      - "skeleton/testing/test_swarm_runtime_recovery.py"
      - "tests/test_runtime_replay_terminal_contract.py"
      - "scripts/build_p1_adversarial_ac02_evidence.py"
      - "tests/test_p1_adversarial_ac02_evidence.py"
      - ".github/workflows/p1-adversarial-ac02-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-adversarial-ac02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify AC-02 shutdown restart evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Run shutdown restart and recovery regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_worker_fairness_failover_shutdown.py
          skeleton/testing/test_state_recovery_drill.py
          skeleton/testing/test_swarm_runtime_recovery.py
          tests/test_runtime_replay_terminal_contract.py
          tests/test_p1_adversarial_ac02_evidence.py
          tests/test_p1_adversarial_ac09_binding.py
          tests/test_p1_risk_evidence_reconciliation.py

      - name: Compile exact-head AC-02 evidence twice
        run: |
          set -euo pipefail
          mkdir -p .p1-ac02
          python scripts/build_p1_adversarial_ac02_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-ac02/report.json \
            --print-summary
          python scripts/build_p1_adversarial_ac02_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-ac02/replay.json
          cmp .p1-ac02/report.json .p1-ac02/replay.json

      - name: Prove AC-02 mode completeness and emit binding seed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".p1-ac02/report.json").read_text(encoding="utf-8")
          )
          candidate = report["candidate"]
          expected_modes = {
              "shutdown_race",
              "restart_replay",
              "fault_injection",
              "state_machine_property",
          }
          if report["axis_id"] != "AC-02":
              raise SystemExit("wrong adversarial axis")
          if report["candidate_count"] != 1:
              raise SystemExit("AC-02 candidate count drift")
          if report["already_bound_count"] != 0:
              raise SystemExit("AC-02 unexpectedly already governed")
          if report["candidate_binding_count"] != 1:
              raise SystemExit("AC-02 candidate binding count drift")
          if set(candidate["required_evidence_modes"]) != expected_modes:
              raise SystemExit("AC-02 required evidence modes drift")
          if {
              row["category"] for row in candidate["evidence"]
          } != expected_modes:
              raise SystemExit("AC-02 evidence categories incomplete")
          if candidate["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("AC-02 candidate is not exact-head bound")
          if candidate["recommended_severity"] != "high":
              raise SystemExit("AC-02 severity must remain high")
          if candidate["recommended_disposition"] != "evidence":
              raise SystemExit("AC-02 disposition must remain evidence")
          for field in (
              "creates_binding",
              "accepts_risk",
              "lowers_severity",
              "promotes_maturity",
          ):
              if candidate[field] is not False:
                  raise SystemExit(
                      f"AC-02 authority boundary drift: {field}"
                  )
          print(
              "P1_AC02_BINDING_SEED "
              + json.dumps(
                  {
                      "obligation_id": candidate["obligation_id"],
                      "obligation_digest": candidate["obligation_digest"],
                      "owner_id": candidate["owner_id"],
                      "severity": candidate["recommended_severity"],
                      "disposition": candidate[
                          "recommended_disposition"
                      ],
                      "evidence": candidate["evidence"],
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

      - name: Confirm governed frontier remains 497 resolved and 16 blocking
        run: |
          set -euo pipefail
          python scripts/reconcile_p1_risk_evidence.py \
            --evaluated-at "2026-10-01T12:00:00+00:00" \
            --out .p1-ac02/reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-ac02/reconciliation.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["binding_count"] != 497:
              raise SystemExit("AC-02 verifier mutated binding count")
          if report["resolved_count"] != 497:
              raise SystemExit("AC-02 verifier mutated resolved count")
          if report["unresolved_blocking_count"] != 16:
              raise SystemExit("AC-02 verifier mutated blocking count")
          if report["unclassified_count"] != 0:
              raise SystemExit(
                  "AC-02 verifier reintroduced unclassified risks"
              )
          if report["disposition_counts"] != {
              "evidence": 497,
              "unbound": 16,
          }:
              raise SystemExit(
                  "AC-02 verifier mutated disposition counts"
              )
          PY
