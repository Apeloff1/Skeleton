name: P0 Data Lifecycle Erasure

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/memory/vector.py"
      - "skeleton/ai/runtime/memory/vector.py"
      - "skeleton/reliability/backup_restore.py"
      - "skeleton/ai/runtime/reliability/backup_restore.py"
      - "skeleton/testing/test_p0_data_lifecycle_erasure.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-data-lifecycle-erasure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-data-lifecycle-erasure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  data-lifecycle-erasure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify AI-tree mirrors
        run: |
          cmp skeleton/memory/vector.py skeleton/ai/runtime/memory/vector.py
          cmp skeleton/reliability/backup_restore.py skeleton/ai/runtime/reliability/backup_restore.py
      - name: Run lifecycle erasure regressions
        run: python -m pytest -q skeleton/testing/test_p0_data_lifecycle_erasure.py
