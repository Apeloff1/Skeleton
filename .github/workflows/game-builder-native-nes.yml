name: Game Builder Native NES ROM

on:
  pull_request:
    paths:
      - 'skeleton/ai/game_builder/**'
      - 'scripts/game_builder/native_nes_ci.py'
      - 'scripts/game_builder/nes_reproducibility_ci.py'
      - 'scripts/game_builder/nes_6502_boot.py'
      - 'scripts/game_builder/nes_6502_controller.py'
      - 'skeleton/testing/test_game_builder_nes_6502_controller.py'
      - 'skeleton/testing/test_game_builder_nes_6502_boot.py'
      - 'skeleton/testing/test_game_builder_nes_reproducibility.py'
      - '.github/workflows/game-builder-native-nes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-builder-nes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  original-nes-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /skeleton/__init__.py
            /skeleton/ai/__init__.py
            /skeleton/ai/capability_map.py
            /skeleton/ai/game_builder/
            /scripts/game_builder/native_nes_ci.py
            /scripts/game_builder/nes_reproducibility_ci.py
            /scripts/game_builder/nes_6502_boot.py
            /scripts/game_builder/nes_6502_controller.py
            /skeleton/testing/test_game_builder_nes_6502_controller.py
            /skeleton/testing/test_game_builder_nes_6502_boot.py
            /scripts/game_builder/sega_reproducibility_ci.py
            /skeleton/testing/test_game_builder_nes_reproducibility.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source real 6502 native assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cc65 make
          ca65 --version
          ld65 --version
      - name: Unit-check original NES source, mapper and two-build integrity
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8.4,<9" "py65==1.2.0"
          python -m pytest -q --noconftest skeleton/testing/test_game_builder_nes_reproducibility.py skeleton/testing/test_game_builder_nes_6502_boot.py skeleton/testing/test_game_builder_nes_6502_controller.py
      - name: Compile source-authored worlds to real NES iNES ROM
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          # Both generated originals derive from the same authored world,
          # but are produced into independent directories and compiled twice.
          python scripts/game_builder/native_nes_ci.py --emit nes-world-src > nes-source-evidence.json
          python scripts/game_builder/native_nes_ci.py --emit nes-world-second > nes-second-source-evidence.json
          make -C nes-world-src
          make -C nes-world-second
          test -s nes-world-src/build/skeleton-original.nes
          test -s nes-world-second/build/skeleton-original.nes
          python scripts/game_builder/native_nes_ci.py --verify-rom nes-world-src/build/skeleton-original.nes > nes-compiled-rom-verification.json
          FIRST_ROM_SHA="$(sha256sum nes-world-src/build/skeleton-original.nes | cut -d' ' -f1)"
          cmp nes-world-src/build/skeleton-original.nes nes-world-second/build/skeleton-original.nes
          python scripts/game_builder/nes_reproducibility_ci.py \
            --first-source nes-world-src --second-source nes-world-second \
            --first-rom nes-world-src/build/skeleton-original.nes \
            --second-rom nes-world-second/build/skeleton-original.nes \
            --first-evidence nes-source-evidence.json \
            --second-evidence nes-second-source-evidence.json \
            --expected-rom-sha256 "$FIRST_ROM_SHA" \
            --receipt-out nes-independent-rebuild-proof.json
          python - <<'PY'
          import json
          result=json.load(open("nes-compiled-rom-verification.json", encoding="utf-8"))
          assert result["ines_header_verified"] and result["mapper_0_prg_chr_verified"]
          assert not result["emulator_playthrough_verified"]
          proof=json.load(open("nes-independent-rebuild-proof.json", encoding="utf-8"))
          assert proof["two_distinct_source_directories_checked"] is True
          assert proof["identical_generated_source_bytes"] is True
          assert proof["exact_nrom_prg_chr_bytes_match"] is True
          assert proof["file_backed_interrupt_vectors_checked"] is True
          assert proof["rom_sha256"] == result["sha256"]
          assert proof["emulator_gameplay_verified"] is False
          assert proof["physical_hardware_verified"] is False
          assert proof["publication_authorized"] is False
          PY
          BG_SHA="$(python -c 'import json; print(json.load(open("nes-world-src/manifest.json",encoding="utf-8"))["original_stage_zero_bg_sha256"])')"
          python scripts/game_builder/nes_6502_boot.py \
            --rom nes-world-src/build/skeleton-original.nes \
            --expected-sha256 "$FIRST_ROM_SHA" \
            --expected-bg-sha256 "$BG_SHA" \
            --receipt-out nes-6502-observed-boot.json
          python - <<'PY'
          import json
          rom=json.load(open("nes-compiled-rom-verification.json",encoding="utf-8"))
          boot=json.load(open("nes-6502-observed-boot.json",encoding="utf-8"))
          assert boot["rom_sha256"]==rom["sha256"]
          assert boot["actual_6502_cpu_executed"] is True
          assert boot["original_ppu_palette_writes_observed"] >= 32
          assert boot["original_ppu_nametable_writes_observed"] >= 960
          assert boot["original_nametable_sha256"] == json.load(open("nes-world-src/manifest.json",encoding="utf-8"))["original_stage_zero_bg_sha256"]
          assert boot["actual_sprite_dma_transfers_observed"] >= 1
          assert boot["cycle_accurate_ppu_apu_verified"] is False
          assert boot["full_gameplay_playthrough_verified"] is False
          assert boot["publication_authorized"] is False
          PY
          SOURCE_SHA="$(python -c 'import json; print(json.load(open("nes-source-evidence.json",encoding="utf-8"))["source_digest"])')"
          python scripts/game_builder/nes_6502_controller.py \
            --rom nes-world-src/build/skeleton-original.nes \
            --source-dir nes-world-src \
            --rom-sha256 "$FIRST_ROM_SHA" \
            --source-sha256 "$SOURCE_SHA" \
            --receipt-out nes-6502-original-first-move.json
          python - <<'PY'
          import json
          move=json.load(open("nes-6502-original-first-move.json",encoding="utf-8"))
          assert move["original_6502_input_executed"] is True
          assert move["original_safe_first_move_matched"] is True
          assert move["actual_ppu_stage_zero_bg_sha256"] == move["original_stage_zero_bg_sha256"]
          assert move["native_input_port_reads"] >= 8
          assert move["native_sprite_dma_transfers"] >= 2
          assert move["full_controller_route_replayed"] is False
          assert move["cycle_accurate_ppu_apu_verified"] is False
          assert move["legal_distribution_authorized"] is False
          print("Compiled genuine native NES cartridge", rom["sha256"])
          PY
      - name: Save ROM with provenance and reproducible build source
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-original-playable-nes-cartridge
          path: |
            nes-world-src/build/skeleton-original.nes
            nes-world-src/manifest.json
            nes-compiled-rom-verification.json
            nes-source-evidence.json
            nes-second-source-evidence.json
            nes-independent-rebuild-proof.json
            nes-6502-observed-boot.json
            nes-6502-original-first-move.json
          if-no-files-found: error
          retention-days: 7
