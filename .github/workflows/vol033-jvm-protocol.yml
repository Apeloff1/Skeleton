name: VOL-033 JVM Protocol and Qualification Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/native/jvm_protocol.py"
      - "skeleton/ai/runtime/native/jvm_protocol.py"
      - "skeleton/native/jvm_registry.py"
      - "skeleton/ai/runtime/native/jvm_registry.py"
      - "machine/acceleration_policy.json"
      - "skeleton/native/selection.py"
      - "skeleton/native/profiling.py"
      - "scripts/profile_p2_acceleration.py"
      - "scripts/record_p2_acceleration_profile.py"
      - "skeleton/memory/jvm_vector_accelerator.py"
      - "skeleton/ai/runtime/memory/jvm_vector_accelerator.py"
      - "skeleton/observability/jvm_accelerator.py"
      - "skeleton/ai/runtime/observability/jvm_accelerator.py"
      - "skeleton/simulation/physics/jvm_broadphase_accelerator.py"
      - "java-accelerators/observability/AcceleratorMain.java"
      - "java-accelerators/vector/VectorSearchMain.java"
      - "java-accelerators/physics/BroadPhaseMain.java"
      - "skeleton/testing/test_vol033_jvm_protocol.py"
      - ".github/workflows/vol033-jvm-protocol.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/native/jvm_protocol.py"
      - "skeleton/ai/runtime/native/jvm_protocol.py"
      - "skeleton/native/jvm_registry.py"
      - "skeleton/ai/runtime/native/jvm_registry.py"
      - "machine/acceleration_policy.json"
      - "skeleton/native/selection.py"
      - "skeleton/native/profiling.py"
      - "scripts/profile_p2_acceleration.py"
      - "scripts/record_p2_acceleration_profile.py"
      - "java-accelerators/observability/AcceleratorMain.java"
      - "java-accelerators/vector/VectorSearchMain.java"
      - "java-accelerators/physics/BroadPhaseMain.java"
      - "skeleton/testing/test_vol033_jvm_protocol.py"
      - ".github/workflows/vol033-jvm-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol033-jvm-protocol-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jvm-protocol:
    name: JVM protocol and workload qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic>=2,<3"
          "pydantic-settings>=2,<3"

      - name: Compile JVM governance boundaries
        run: >-
          python -m py_compile
          skeleton/native/jvm_protocol.py
          skeleton/ai/runtime/native/jvm_protocol.py
          skeleton/native/jvm_registry.py
          skeleton/ai/runtime/native/jvm_registry.py
          skeleton/native/selection.py
          skeleton/native/profiling.py
          skeleton/memory/jvm_vector_accelerator.py
          skeleton/ai/runtime/memory/jvm_vector_accelerator.py
          skeleton/observability/jvm_accelerator.py
          skeleton/ai/runtime/observability/jvm_accelerator.py
          skeleton/simulation/physics/jvm_broadphase_accelerator.py
          skeleton/testing/test_jvm_accelerator_registry.py
          skeleton/testing/test_vol033_jvm_protocol.py

      - name: Run JVM qualification regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_vol033_jvm_protocol.py
          skeleton/testing/test_jvm_accelerator_registry.py

      - name: Profile JVM candidates against reference paths
        run: |
          set -euo pipefail
          mkdir -p .vol033-profile
          for candidate in ACCEL-JVM-VECTOR ACCEL-JVM-PHYSICS ACCEL-JVM-OBSERVABILITY; do
            slug="$(printf '%s' "$candidate" | tr '[:upper:]' '[:lower:]')"
            for run in 1 2; do
              python scripts/profile_p2_acceleration.py                 --candidate "$candidate"                 --repeat 5                 --evidence-id "vol033-${slug}-run-${run}-${EXPECTED_SHA:0:12}"                 --output ".vol033-profile/${slug}-${run}.json"
            done
          done

      - name: Evaluate JVM profile receipts without activation
        run: |
          set -euo pipefail
          cp machine/acceleration_policy.json .vol033-profile/policy.json
          for receipt in .vol033-profile/accel-jvm-*.json; do
            python scripts/record_p2_acceleration_profile.py               --receipt "$receipt"               --policy ".vol033-profile/policy.json"               --output ".vol033-profile/policy-next.json"
            mv .vol033-profile/policy-next.json .vol033-profile/policy.json
          done
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".vol033-profile")
          for receipt in sorted(root.glob("accel-jvm-*.json")):
              payload = json.loads(receipt.read_text(encoding="utf-8"))
              print(
                  "VOL-033 profile",
                  payload["candidate_id"],
                  payload["evidence_id"],
                  "speedup=",
                  round(
                      payload["reference_median_ns"]
                      / payload["candidate_median_ns"],
                      4,
                  ),
                  "correct=",
                  payload["correctness_passed"],
                  "crashes=",
                  payload["crash_count"],
                  "timeouts=",
                  payload["timeout_count"],
              )

          policy = json.loads(
              (root / "policy.json").read_text(encoding="utf-8")
          )
          for candidate in policy["candidates"]:
              if candidate.get("plane") != "jvm":
                  continue
              decision = candidate.get("selection_decision") or {}
              print(
                  "VOL-033 evaluated",
                  candidate["id"],
                  "state=",
                  candidate["state"],
                  "qualified=",
                  decision.get("qualified"),
                  "effective_route=",
                  decision.get("effective_route"),
                  "reasons=",
                  decision.get("reason_codes"),
              )
              if candidate.get("automatic_selection") is not False:
                  raise SystemExit(
                      f"CI profiling must not activate {candidate['id']}"
                  )
          PY

      - name: Audit Java headers against canonical protocol registry
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          from skeleton.native.jvm_protocol import canonical_jvm_capabilities

          root = Path(".")
          for capability in canonical_jvm_capabilities():
              source = root / capability.source_path
              text = source.read_text(encoding="utf-8")
              if f"public final class {capability.class_name}" not in text:
                  raise SystemExit(
                      f"class drift for {capability.capability_id}"
                  )
              magic = re.search(
                  r"static final int MAGIC = 0x([0-9A-Fa-f]+)",
                  text,
              )
              version = re.search(
                  r"static final short VERSION = ([0-9]+);",
                  text,
              )
              if magic is None or int(magic.group(1), 16) != capability.protocol_magic:
                  raise SystemExit(
                      f"magic drift for {capability.capability_id}"
                  )
              if version is None or int(version.group(1)) not in capability.protocol_versions:
                  raise SystemExit(
                      f"version drift for {capability.capability_id}"
                  )
              print(
                  capability.capability_id,
                  capability.capability_digest,
                  "version=",
                  version.group(1),
              )

          pairs = (
              (
                  root / "skeleton/native/jvm_protocol.py",
                  root / "skeleton/ai/runtime/native/jvm_protocol.py",
              ),
              (
                  root / "skeleton/native/jvm_registry.py",
                  root / "skeleton/ai/runtime/native/jvm_registry.py",
              ),
              (
                  root / "skeleton/memory/jvm_vector_accelerator.py",
                  root / "skeleton/ai/runtime/memory/jvm_vector_accelerator.py",
              ),
              (
                  root / "skeleton/observability/jvm_accelerator.py",
                  root / "skeleton/ai/runtime/observability/jvm_accelerator.py",
              ),
          )
          for source, mirror in pairs:
              if source.read_bytes() != mirror.read_bytes():
                  raise SystemExit(f"JVM governed mirror drift: {source}")

          contract = (
              root / "skeleton/native/jvm_protocol.py"
          ).read_text(encoding="utf-8")
          required = (
              '"protocol-version-incompatible"',
              '"semantic-equivalence-failed"',
              '"jvm-speedup-insufficient"',
              '"jvm-gc-pause-exceeded"',
              '"benchmark-evidence-stale"',
              '"request-negotiated-protocol-mismatch"',
              '"jvm-admission-only"',
              "production_authority: bool = False",
              "get_selected",
              "profile_selected_unpromoted",
              "automatic-selection-disabled",
          )
          for token in required:
              if token not in contract:
                  raise SystemExit(f"VOL-033 fail-closed token missing: {token}")

          for token in ("subprocess.", "os.system(", "requests.", "httpx."):
              if token in contract:
                  raise SystemExit(
                      f"VOL-033 admission contract gained execution surface: {token}"
                  )

          expected = os.environ["EXPECTED_SHA"].strip()
          if not expected:
              raise SystemExit("exact head SHA missing")
          print("VOL-033 exact head:", expected)
          PY
