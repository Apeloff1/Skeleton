name: P0 Canonical Signing Bytes

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/contracts/canonical.py"
      - "skeleton/ai/runtime/contracts/canonical.py"
      - "skeleton/testing/test_canonical_contract_security.py"
      - "skeleton/testing/test_contract_serialization_edges.py"
      - "skeleton/testing/test_contract_unicode_edges.py"
      - "skeleton/testing/test_contract_compatibility.py"
      - "machine/contract_conformance.json"
      - "machine/ai_runtime_schemas.json"
      - "machine/capability_interfaces.json"
      - "scripts/check_architecture_contract_conformance.py"
      - "machine/ai_file_tree.json"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-canonical-signing-current.yml"
  workflow_dispatch:


concurrency:
  group: p0-canonical-signing-current-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canonical-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: cmp skeleton/contracts/canonical.py skeleton/ai/runtime/contracts/canonical.py
      - run: python -m pytest -q skeleton/testing/test_canonical_contract_security.py skeleton/testing/test_contract_serialization_edges.py skeleton/testing/test_contract_unicode_edges.py skeleton/testing/test_contract_compatibility.py
      - run: python scripts/check_architecture_contract_conformance.py --json
      - run: python scripts/check_ai_file_tree.py
