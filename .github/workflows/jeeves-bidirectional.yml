name: Jeeves Bidirectional Historical

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skeleton/jeeves/historical_modes.py'
      - 'skeleton/jeeves/bidirectional_modes.py'
      - 'skeleton/jeeves/bidirectional_calibration.py'
      - 'skeleton/jeeves/__init__.py'
      - 'skeleton/learning/evidence.py'
      - 'skeleton/testing/test_jeeves_historical_modes.py'
      - 'skeleton/testing/test_jeeves_bidirectional_modes.py'
      - 'skeleton/testing/test_jeeves_bidirectional_calibration.py'
      - 'skeleton/testing/test_jeeves_historical_mode_exports.py'
      - 'skeleton/testing/test_learning_evidence.py'
      - '.github/workflows/jeeves-bidirectional.yml'
  push:
    branches: [main]
    paths:
      - 'skeleton/jeeves/historical_modes.py'
      - 'skeleton/jeeves/bidirectional_modes.py'
      - 'skeleton/jeeves/bidirectional_calibration.py'
      - 'skeleton/jeeves/__init__.py'
      - 'skeleton/learning/evidence.py'
      - 'skeleton/testing/test_jeeves_historical_modes.py'
      - 'skeleton/testing/test_jeeves_bidirectional_modes.py'
      - 'skeleton/testing/test_jeeves_bidirectional_calibration.py'
      - 'skeleton/testing/test_jeeves_historical_mode_exports.py'
      - 'skeleton/testing/test_learning_evidence.py'
      - '.github/workflows/jeeves-bidirectional.yml'

concurrency:
  group: jeeves-bidirectional-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11.16'
  PYTHONPATH: '.'

jobs:
  focused-regression:
    name: Bidirectional historical regression
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Install focused runtime
        run: >-
          python -m pip install
          "pytest>=8,<9"
          "fastapi>=0.110,<1"
          "pydantic>=2.5,<3"
          "pydantic-settings>=2.1,<3"

      - name: Compile historical and learning surfaces
        run: |
          python -m compileall -q \
            skeleton/jeeves/historical_modes.py \
            skeleton/jeeves/bidirectional_modes.py \
            skeleton/jeeves/bidirectional_calibration.py \
            skeleton/learning/evidence.py

      - name: Run forward backward calibration and evidence regressions
        run: |
          python -m pytest -q \
            skeleton/testing/test_jeeves_historical_modes.py \
            skeleton/testing/test_jeeves_bidirectional_modes.py \
            skeleton/testing/test_jeeves_bidirectional_calibration.py \
            skeleton/testing/test_jeeves_historical_mode_exports.py \
            skeleton/testing/test_learning_evidence.py
