name: P2 VS-001 Functional AI

on:
  pull_request:
    paths:
      - "skeleton/ai/runtime/functional_ai.py"
      - "skeleton/ai/runtime/inference/**"
      - "skeleton/testing/test_vs001_functional_ai.py"
      - ".github/workflows/p2-vs001-functional-ai.yml"
  push:
    branches:
      - main
      - feat/p2-functional-ai-closure-atomic
    paths:
      - "skeleton/ai/runtime/functional_ai.py"
      - "skeleton/ai/runtime/inference/**"
      - "skeleton/testing/test_vs001_functional_ai.py"
      - ".github/workflows/p2-vs001-functional-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-vs001-functional-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vs001:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"
      - name: Execute credential-free VS-001
        run: python -m pytest -q skeleton/testing/test_local_inference.py skeleton/testing/test_vs001_functional_ai.py
