name: P0 Information Flow Model Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/shells/ai/context_provenance.py"
      - "skeleton/shells/ai/context_policy.py"
      - "skeleton/testing/test_p0_information_flow_models.py"
      - "skeleton/testing/test_shell_ai_context_planner.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-information-flow-model-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  information-flow-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run confidentiality and integrity regressions
        run: >-
          python -m pytest -q
          skeleton/testing/test_p0_information_flow_models.py
          skeleton/testing/test_shell_ai_context_planner.py::test_context_planner_never_sends_secret_context
          skeleton/testing/test_shell_ai_context_planner.py::test_context_planner_can_reject_untrusted_context
