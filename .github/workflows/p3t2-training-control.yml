name: P3 T2 Training Control Candidate

on:
  pull_request:
    paths:
      - "skeleton/training/**"
      - "skeleton/ai/runtime/training/**"
      - "skeleton/testing/test_training_control.py"
      - "machine/ai_p3t2_training_candidate.json"
      - "scripts/check_p3t2_training_candidate.py"
      - "tests/test_p3t2_training_candidate.py"
      - ".github/workflows/p3t2-training-control.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/training/**"
      - "skeleton/ai/runtime/training/**"
      - "skeleton/testing/test_training_control.py"
      - "machine/ai_p3t2_training_candidate.json"
      - "scripts/check_p3t2_training_candidate.py"
      - "tests/test_p3t2_training_candidate.py"
      - ".github/workflows/p3t2-training-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3t2-training-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  training:
    name: Unsigned training control candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check "pytest>=7,<9"

      - name: Verify exact AI-runtime mirror
        run: |
          cmp skeleton/training/__init__.py skeleton/ai/runtime/training/__init__.py
          cmp skeleton/training/control.py skeleton/ai/runtime/training/control.py

      - name: Validate training candidate without closure
        run: python scripts/check_p3t2_training_candidate.py --json

      - name: Run training control regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_training_control.py
          tests/test_p3t2_training_candidate.py
