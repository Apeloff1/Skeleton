name: P2 Documentation Engine

on:
  pull_request:
    branches:
      - main
      - feat/p2-traceability-spine
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/generated_documentation.json"
      - "machine/ai_master_plan.json"
      - "machine/ai_p2_execution_map.json"
      - "machine/ai_p2_task_backlog.json"
      - "docs/generated/**"
      - "docs/plan/P2_DOCUMENTATION_ENGINE.md"
      - "scripts/generate_p2_documentation.py"
      - "scripts/check_p2_documentation.py"
      - "tests/test_p2_documentation.py"
      - ".github/workflows/p2-documentation.yml"
  push:
    branches:
      - main
      - feat/p2-documentation-engine
    paths:
      - "machine/generated_documentation.json"
      - "machine/ai_master_plan.json"
      - "machine/ai_p2_execution_map.json"
      - "machine/ai_p2_task_backlog.json"
      - "docs/generated/**"
      - "docs/plan/P2_DOCUMENTATION_ENGINE.md"
      - "scripts/generate_p2_documentation.py"
      - "scripts/check_p2_documentation.py"
      - "tests/test_p2_documentation.py"
      - ".github/workflows/p2-documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-generated-documentation:
    name: Validate deterministic documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Check clean regeneration
        run: python scripts/generate_p2_documentation.py --check --json

      - name: Validate documentation control
        run: python scripts/check_p2_documentation.py --json

      - name: Run documentation regressions
        run: python -m unittest -v tests.test_p2_documentation
