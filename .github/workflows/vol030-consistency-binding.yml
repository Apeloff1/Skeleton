name: VOL-030 Consistency-Bound Remote Execution Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/distributed/network/consistency_policy.py"
      - "skeleton/ai/runtime/distributed/network/consistency_policy.py"
      - "skeleton/distributed/network/remote_execution.py"
      - "skeleton/ai/runtime/distributed/network/remote_execution.py"
      - "skeleton/network/remote_execution.py"
      - "skeleton/testing/test_remote_execution_protocol.py"
      - ".github/workflows/vol030-consistency-binding.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/distributed/network/consistency_policy.py"
      - "skeleton/ai/runtime/distributed/network/consistency_policy.py"
      - "skeleton/distributed/network/remote_execution.py"
      - "skeleton/ai/runtime/distributed/network/remote_execution.py"
      - "skeleton/network/remote_execution.py"
      - "skeleton/testing/test_remote_execution_protocol.py"
      - ".github/workflows/vol030-consistency-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol030-consistency-binding-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consistency-bound-remote-execution:
    name: Data consistency and remote execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Compile distributed consistency boundaries
        run: >-
          python -m py_compile
          skeleton/distributed/network/consistency_policy.py
          skeleton/ai/runtime/distributed/network/consistency_policy.py
          skeleton/distributed/network/remote_execution.py
          skeleton/ai/runtime/distributed/network/remote_execution.py
          skeleton/testing/test_remote_execution_protocol.py

      - name: Run remote protocol and consistency regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_remote_execution_protocol.py

      - name: Assert exact mirrors and consistency binding
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(".")
          pairs = (
              (
                  root / "skeleton/distributed/network/consistency_policy.py",
                  root / "skeleton/ai/runtime/distributed/network/consistency_policy.py",
              ),
              (
                  root / "skeleton/distributed/network/remote_execution.py",
                  root / "skeleton/ai/runtime/distributed/network/remote_execution.py",
              ),
          )
          for source, mirror in pairs:
              left = source.read_bytes()
              right = mirror.read_bytes()
              if left != right:
                  raise SystemExit(f"VOL-030 mirror drift: {source}")
              print(source, hashlib.sha256(left).hexdigest())

          remote = (
              root / "skeleton/distributed/network/remote_execution.py"
          ).read_text(encoding="utf-8")
          required = (
              '"consistency-policy-digest-mismatch"',
              '"remote-execution-disallowed-for-data-class"',
              '"consistency-mode-too-weak"',
              '"consistency_policy_digest"',
              '"consistency_mode"',
              '"data_class"',
              "canonical_json_bytes",
          )
          for token in required:
              if token not in remote:
                  raise SystemExit(f"VOL-030 remote binding missing: {token}")

          policy = (
              root / "skeleton/distributed/network/consistency_policy.py"
          ).read_text(encoding="utf-8")
          for token in (
              "ConsistencyMode.EVENTUAL",
              "ConsistencyMode.READ_YOUR_WRITES",
              "ConsistencyMode.LINEARIZABLE",
              "DataClass.PUBLIC",
              "DataClass.INTERNAL",
              "DataClass.CONFIDENTIAL",
              "DataClass.RESTRICTED",
              'authority_scope": "consistency-policy-only"',
              '"production_authority": False',
          ):
              if token not in policy:
                  raise SystemExit(f"VOL-030 consistency policy missing: {token}")

          forbidden = ("subprocess.", "os.system(", "requests.", "httpx.")
          for target in (remote, policy):
              for token in forbidden:
                  if token in target:
                      raise SystemExit(
                          f"VOL-030 non-transport boundary gained execution surface: {token}"
                      )

          expected = os.environ["EXPECTED_SHA"].strip()
          if not expected:
              raise SystemExit("exact head SHA missing")
          print("VOL-030 exact head:", expected)
          PY
