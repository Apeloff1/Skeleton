name: Functional LLM Game Builder Masterplan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flgb-masterplan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate 10MB functional LLM/game-builder atlas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Compile validator
        run: python -m py_compile scripts/check_functional_llm_game_builder_10mb.py tests/test_functional_llm_game_builder_masterplan.py
      - name: Validate atlas
        run: python scripts/check_functional_llm_game_builder_10mb.py
      - name: Run focused regression
        run: python tests/test_functional_llm_game_builder_masterplan.py -q
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
