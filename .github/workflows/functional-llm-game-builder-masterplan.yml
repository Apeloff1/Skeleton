name: Functional LLM Game Builder Masterplan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flgb-masterplan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate 10MB functional LLM/game-builder atlas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Compile validator
        run: python -m py_compile scripts/check_functional_llm_game_builder_10mb.py scripts/check_functional_llm_game_builder_execution_backlog.py skeleton/__init__.py skeleton/inference/__init__.py skeleton/inference/flgb_runtime.py skeleton/ai/model_runtime/flgb_model_runtime.py skeleton/ai/model_runtime/__init__.py skeleton/ai/context/flgb_context_runtime.py skeleton/ai/context/__init__.py skeleton/ai/agents/flgb_agent_runtime.py skeleton/ai/agents/__init__.py skeleton/security/flgb_security_plane.py skeleton/ai/assurance/flgb_assurance_runtime.py skeleton/ai/assurance/__init__.py skeleton/ai/training/flgb_training_runtime.py skeleton/ai/training/__init__.py skeleton/ai/multimodal/flgb_multimodal_runtime.py skeleton/ai/multimodal/__init__.py skeleton/game/flgb_editor_runtime.py skeleton/game/simulation/flgb_simulation_runtime.py skeleton/game/simulation/__init__.py skeleton/security/activation_security.py tests/flgb/test_flgb_activation_security_timeout.py tests/test_functional_llm_game_builder_masterplan.py tests/test_functional_llm_game_builder_execution_backlog.py tests/flgb/test_flgb_01_*.py
      - name: Validate atlas
        run: python scripts/check_functional_llm_game_builder_10mb.py
      - name: Validate execution backlog
        run: python scripts/check_functional_llm_game_builder_execution_backlog.py
      - name: Run focused regressions
        run: |
          python tests/test_functional_llm_game_builder_masterplan.py -q
          python tests/test_functional_llm_game_builder_execution_backlog.py -q
      - name: Run FLGB-01 inference-plane regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_01_*.py' -v
      - name: Run FLGB-02 model-runtime regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_02_*.py' -v
      - name: Run FLGB-03 context-plane regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_03_*.py' -v
      - name: Run FLGB-04 agent-plane regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_04_*.py' -v
      - name: Run FLGB-05 security-plane regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_05_*.py' -v
      - name: Run FLGB-06 assurance-plane regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_06_*.py' -v
      - name: Run FLGB-07 training-plane regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_07_*.py' -v
      - name: Run FLGB-08 multimodal-plane regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_08_*.py' -v
      - name: Run FLGB-09 game-editor regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_09_*.py' -v
      - name: Run FLGB-10 simulation regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_10_*.py' -v
      - name: Run FLGB support regressions
        run: python -m unittest discover -s tests/flgb -p 'test_flgb_activation_security_timeout.py' -v
      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
