name: Dragon Atelier prototype source qualification
on:
  pull_request:
    paths:
      - 'scripts/dragon_atelier_admit.py'
      - 'scripts/emerald_asset_preflight.py'
      - 'scripts/stage_emerald_native.py'
      - 'scripts/test_emerald_native_gate.py'
      - 'frontend/scripts/install_emerald_assets.py'
      - 'frontend/scripts/test_emerald_assets.py'
      - 'frontend/src/features/Jeeves/companion/emeraldAssetPin.json'
      - 'scripts/recover_emerald_assets.py'
      - 'scripts/test_emerald_recovery.py'
      - 'scripts/qualify_emerald_retained_archives.py'
      - 'scripts/test_emerald_retained_archives.py'
      - 'scripts/rebuild_emerald_exact_binary.py'
      - 'scripts/test_emerald_exact_binary.py'
      - 'scripts/prepare_emerald_delivery.py'
      - 'scripts/test_emerald_delivery.py'
      - 'scripts/verify_emerald_native_stage.py'
      - 'scripts/test_emerald_native_stage_verifier.py'
      - 'scripts/emerald_v5_*.py'
      - 'scripts/emerald_v6_*.py'
      - 'scripts/test_emerald_v6_*.py'
      - 'scripts/verify_emerald_v6_*.py'
      - 'assets/emerald/evolution-v6/**'
      - 'scripts/test_emerald_v5_*.py'
      - 'assets/emerald/evolution-v5/**'
      - 'scripts/qualify_emerald_original.py'
      - 'scripts/test_emerald_original_qualification.py'
      - 'frontend/src/skeletonForge/**'
      - 'frontend/scripts/skeleton-forge/**'
      - 'frontend/src/features/GalaxyStudioFactory/**'
      - 'frontend/app/skeleton-forge.tsx'
      - 'frontend/app/skeleton-studio.tsx'
      - 'frontend/app/galaxy.tsx'
      - 'scripts/audit_emerald_animation.py'
      - 'scripts/audit_emerald_skin.py'
      - 'scripts/audit_emerald_materials.py'
      - 'scripts/test_emerald_material_audit.py'
      - 'scripts/test_emerald_skin_audit.py'
      - 'scripts/test_emerald_animation_audit.py'
      - 'scripts/test_emerald_asset_preflight.py'
      - 'tests/test_dragon_atelier_admit.py'
      - 'frontend/src/features/Jeeves/companion/atelier/**'
      - 'frontend/src/features/Jeeves/CrawlerWorkspace.tsx'
      - 'frontend/src/features/Jeeves/CrawlerReleasePrototype.tsx'
      - 'frontend/src/types/three-atelier.d.ts'
      - 'frontend/scripts/test-dragon-atelier*.cjs'
      - '.github/workflows/dragon-atelier-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dragon-atelier-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Exact-head Atelier source and synthetic structural qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout identity
        id: checkout_identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Offline GLB structure and rejection fixtures
        run: python3 -m unittest discover -s tests -p test_dragon_atelier_admit.py -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.20.0"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install reviewed lockfile without lifecycle scripts
        id: dependencies
        working-directory: frontend
        run: yarn install --ignore-scripts --frozen-lockfile --non-interactive
      - name: Apply approved local dependency patches
        id: patches
        working-directory: frontend
        run: node ./scripts/patch-node-modules.js
      - name: Test source and state transition contracts
        working-directory: frontend
        run: node --test scripts/test-dragon-atelier-runtime.cjs scripts/test-dragon-atelier-integration.cjs
      - name: Verify Emerald event projection and installer/native synthetic tests
        run: |
          python3 frontend/scripts/test_emerald_assets.py
          python3 scripts/test_emerald_native_gate.py
          python3 scripts/test_emerald_asset_preflight.py
          python3 scripts/test_emerald_recovery.py
          python3 scripts/test_emerald_retained_archives.py
          python3 scripts/test_emerald_exact_binary.py
          python3 scripts/test_emerald_delivery.py
          python3 scripts/test_emerald_native_stage_verifier.py
          python3 scripts/test_emerald_original_qualification.py
          python3 scripts/test_emerald_animation_audit.py
          python3 scripts/test_emerald_skin_audit.py
          python3 scripts/test_emerald_material_audit.py
          cd frontend && yarn test:emerald-integration
      - name: Verify recovered creator contracts
        if: ${{ !cancelled() && steps.checkout_identity.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.patches.outcome == 'success' }}
        working-directory: frontend
        run: yarn test:skeleton-forge
      - name: Preserve existing companion behavior
        if: ${{ !cancelled() && steps.checkout_identity.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.patches.outcome == 'success' }}
        working-directory: frontend
        run: yarn test:dragon-companion
      - name: Compile full frontend TypeScript
        if: ${{ !cancelled() && steps.checkout_identity.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.patches.outcome == 'success' }}
        working-directory: frontend
        run: yarn typecheck
      - name: Export existing web application
        if: ${{ !cancelled() && steps.checkout_identity.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.patches.outcome == 'success' }}
        working-directory: frontend
        run: yarn export:web
      - name: Qualification boundary
        run: echo 'Source and synthetic fixtures only. Original GLB, artistic quality, Unreal, physical RTX, and device acceptance are not qualified by this job.'

  v5_corrective_source:
    name: Exact-head original-donor V5 source and custody regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Pinned original donor numerical support
        run: python -m pip install --only-binary=:all: numpy==2.3.5
      - name: Reject malformed source, false receipts and unsafe byte publication
        run: |
          python scripts/test_emerald_v5_scholar.py
          python scripts/test_emerald_v5_publication.py
          python scripts/test_emerald_v5_contact_evidence.py
          python scripts/check_emerald_v5_contact_evidence.py
          python scripts/test_emerald_v5_proximal.py
          python scripts/test_emerald_v5_proximal_publication.py
      - name: Qualification boundary
        run: echo 'Synthetic and measured-receipt consistency only; full continuous collision, original binary remote publication, Unreal, RTX and artistic evidence not qualified.'
  v5_payload:
    name: Actual raw original-donor V5 binary custody
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.head_ref, 'assets/emerald-v5-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify SHA-bound published original bytes
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            assets/emerald-v5-scholar-wingfold-r1-20261117)
              python3 scripts/verify_emerald_v5_publication.py verify-tree ;;
            assets/emerald-v5-pathfinder-proximal-20261117)
              python3 scripts/verify_emerald_v5_proximal_publication.py verify-tree --stage pathfinder ;;
            assets/emerald-v5-archivist-proximal-20261117)
              python3 scripts/verify_emerald_v5_proximal_publication.py verify-tree --stage archivist ;;
            *) echo 'Unsupported binary publication branch'; exit 1 ;;
          esac


  v6_transition_source:
    name: Exact-head V6 tail and crossfade/source evidence qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact model-source SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bounded numerical dependencies
        run: python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.16.3 numba==0.62.1
      - name: Compile actual V6 exact-source transition tools
        run: |
          python -m py_compile scripts/emerald_v6_tail_clearance.py scripts/verify_emerald_v6_tail.py
          python -m py_compile scripts/publish_emerald_v6_tail.py scripts/emerald_v6_crossfade_screen.py
          python -m py_compile scripts/verify_emerald_v6_crossfade_evidence.py
          python -m py_compile scripts/test_emerald_v6_crossfade_screen.py scripts/test_emerald_v6_crossfade_evidence.py
      - name: Run V6 math, source authenticity and hostile receipt regressions
        run: |
          python scripts/test_emerald_v6_tail_clearance.py
          python scripts/test_emerald_v6_publication.py
          python scripts/test_emerald_v6_crossfade_screen.py
          python scripts/test_emerald_v6_crossfade_evidence.py
      - name: Keep all device, original binary and artist claims unqualified
        run: echo 'Source-only checks, no private GLB original bytes, real browser mixer, continuous CCD, Unreal, RTX, artistic acceptance or release.'
  v6_binary_custody:
    name: Exact-head V6 original binary payload (fail closed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.head_ref, 'assets/emerald-v6-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Deny missing or tampered raw model parts
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            assets/emerald-v6-pathfinder-tail-clearance-20261117) stage=pathfinder ;;
            assets/emerald-v6-archivist-tail-clearance-20261117) stage=archivist ;;
            *) echo 'Unapproved V6 branch'; exit 1 ;;
          esac
          python3 scripts/publish_emerald_v6_tail.py verify-tree --stage "$stage"
