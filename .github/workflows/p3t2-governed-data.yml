name: P3 T2 Governed Data Plane
on:
  pull_request:
    paths:
      - "skeleton/data/**"
      - "skeleton/ai/runtime/data/**"
      - "skeleton/ai/runtime/training/data.py"
      - "skeleton/testing/test_p3t2_data_candidate.py"
      - "skeleton/testing/test_data_ingestion.py"
      - "skeleton/testing/test_document_intelligence.py"
      - "skeleton/testing/test_data_lineage.py"
      - "skeleton/testing/test_data_quality.py"
      - "skeleton/testing/test_dataset_registry.py"
      - "skeleton/testing/test_p3_training_data.py"
      - "skeleton/testing/test_synthetic_data_factory.py"
      - "machine/ai_master_plan.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_p3t2_data_candidate.json"
      - "scripts/check_p3t2_data_candidate.py"
      - ".github/workflows/p3t2-governed-data.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/data/**"
      - "skeleton/ai/runtime/data/**"
      - "skeleton/ai/runtime/training/data.py"
      - "skeleton/testing/test_p3t2_data_candidate.py"
      - "skeleton/testing/test_data_ingestion.py"
      - "skeleton/testing/test_document_intelligence.py"
      - "skeleton/testing/test_data_lineage.py"
      - "skeleton/testing/test_data_quality.py"
      - "skeleton/testing/test_dataset_registry.py"
      - "skeleton/testing/test_p3_training_data.py"
      - "skeleton/testing/test_synthetic_data_factory.py"
      - "machine/ai_master_plan.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_p3t2_data_candidate.json"
      - "scripts/check_p3t2_data_candidate.py"
      - ".github/workflows/p3t2-governed-data.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p3t2-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: {PYTHONPATH: ".", PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}"}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11.16"}
      - run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"
      - run: python -m compileall -q skeleton/data skeleton/ai/runtime/data skeleton/ai/runtime/training/data.py
      - run: python scripts/check_ai_master_plan.py
      - run: python scripts/check_p3t2_data_candidate.py --head "$(git rev-parse HEAD)" --json
      - run: python -m pytest -q --noconftest tests/test_p3t2_data_candidate.py skeleton/testing/test_data_ingestion.py skeleton/testing/test_document_intelligence.py skeleton/testing/test_data_lineage.py skeleton/testing/test_data_quality.py skeleton/testing/test_dataset_registry.py skeleton/testing/test_p3_training_data.py skeleton/testing/test_synthetic_data_factory.py
