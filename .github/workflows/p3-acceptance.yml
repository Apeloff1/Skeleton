name: P3 Acceptance Frontier

on:
  pull_request:
    paths:
      - "machine/ai_p3_task_backlog.json"
      - "skeleton/eval/p3_acceptance.py"
      - "skeleton/ai/evaluation/p3_acceptance.py"
      - "skeleton/testing/test_p3_acceptance.py"
      - "skeleton/testing/test_vs002_engineering_agent.py"
      - "skeleton/testing/test_vs003_scientific_researcher.py"
      - "skeleton/testing/test_vs004_multi_agent_engineering.py"
      - "skeleton/testing/test_vs005_self_improvement.py"
      - "skeleton/testing/test_vs006_distributed_execution.py"
      - "skeleton/testing/test_vs007_desktop_product.py"
      - ".github/workflows/p3-acceptance.yml"
  push:
    branches:
      - main
      - feat/p3-autonomous-intelligence-expansion-atomic
    paths:
      - "machine/ai_p3_task_backlog.json"
      - "skeleton/eval/p3_acceptance.py"
      - "skeleton/ai/evaluation/p3_acceptance.py"
      - "skeleton/testing/test_p3_acceptance.py"
      - ".github/workflows/p3-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused acceptance runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"
      - name: Validate P3 authority
        run: python scripts/check_p3_execution_map.py --json
      - name: Execute vertical and acceptance regressions
        run: >-
          python -m unittest -v
          skeleton.testing.test_vs002_engineering_agent
          skeleton.testing.test_vs003_scientific_researcher
          skeleton.testing.test_vs004_multi_agent_engineering
          skeleton.testing.test_vs005_self_improvement
          skeleton.testing.test_vs006_distributed_execution
          skeleton.testing.test_vs007_desktop_product
          skeleton.testing.test_p3_acceptance
