name: Jeeves Mode Compatibility

on:
  pull_request:
    paths:
      - "skeleton/jeeves/llm_core.py"
      - "tests/test_jeeves_mode_compat.py"
      - ".github/workflows/jeeves-mode-compat.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/jeeves/llm_core.py"
      - "tests/test_jeeves_mode_compat.py"
      - ".github/workflows/jeeves-mode-compat.yml"

concurrency:
  group: jeeves-mode-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Session mode compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install focused runtime
        run: python -m pip install "pytest>=8,<9" "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Compile provider-backed Jeeves
        run: python -m compileall -q skeleton/jeeves
      - name: Run mode compatibility regressions
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/test_jeeves_mode_compat.py
