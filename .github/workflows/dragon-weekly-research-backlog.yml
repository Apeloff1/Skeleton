name: Dragon Weekly Research Backlog
on:
  schedule:
    - cron: "12 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Generate weekly Dragon notes from approved local receipts only
        env:
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          input_file=""
          # An operator's trusted worker may commit or stage an explicit
          # validated payload here. Its absence means zero VERIFIED events,
          # not a fabricated milestone or permission to acquire more data.
          if [ -f data/dragon/verified_weekly_receipts.json ]; then
            input_file="data/dragon/verified_weekly_receipts.json"
          fi
          if [ -n "$input_file" ]; then
            python scripts/dragon_weekly_export.py --root "$RUNNER_TEMP/dragon-weekly" --owner studio --input "$input_file"
          else
            python scripts/dragon_weekly_export.py --root "$RUNNER_TEMP/dragon-weekly" --owner studio
          fi
      - name: Upload dated notes and bookmark index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dragon-weekly-upgrade-backlog
          path: ${{ runner.temp }}/dragon-weekly/
          retention-days: 30
          if-no-files-found: error
