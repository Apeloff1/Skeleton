name: Jeeves atomic reviewed-source regression

on:
  pull_request:
    paths:
      - skeleton/jeeves/worlds/laptop_flow.py
      - skeleton/testing/test_jeeves_laptop_atomic_review.py
      - .github/workflows/jeeves-atomic-review-regression.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jeeves-atomic-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reviewed-source:
    name: Reviewed-source atomicity and stale-approval revocation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR merge contents
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install the repository's existing host-portable Python CI dependencies
        run: |
          python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "pytest>=8,<9" "pytest-asyncio>=0.24,<2" "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0" "fastapi>=0.142.2,<1" "pydantic>=2.14.1,<3" "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2" "numpy>=2,<3" "Pillow>=13.0.0,<14" "regex>=2026.9.29,<2027"
      - name: Compile reviewed-world implementation and regression
        run: |
          python -m compileall -q skeleton/jeeves/worlds skeleton/testing/test_jeeves_laptop_atomic_review.py
      - name: Run real filesystem review, interruption and stale-output regression
        env:
          PYTHONPATH: .
          PYTHONNOUSERSITE: "1"
        run: |
          python -m unittest skeleton.testing.test_jeeves_laptop_atomic_review -v
