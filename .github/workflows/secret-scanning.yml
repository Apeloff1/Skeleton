name: Secret scanning

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
  workflow_dispatch:

concurrency:
  # PR runs remain per-PR. Push runs are branch-keyed and cumulative, so the
  # newest push scan safely subsumes superseded queued/running scans.
  # workflow_dispatch remains SHA-keyed.
  group: secret-scanning-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref_name) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
  actions: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_CONFIG: ".gitleaks.toml"
  GITLEAKS_ENABLE_COMMENTS: "false"

jobs:
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Gitleaks
    # Scan every push, including tree-preserving consolidation commits. A
    # commit-message-only exemption is forgeable and would let an ordinary push
    # suppress the repository's secret gate simply by reusing a trusted prefix.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Install the scanner separately so this workflow controls the exact
      # revision range instead of relying on wrapper-generated first-parent
      # ranges that can become stale after PR history changes.
      - name: Install Gitleaks
        id: gitleaks
        uses: gacts/gitleaks@073b89c1d99411300246edfd0125a78edc80750b
        with:
          version: "${{ env.GITLEAKS_VERSION }}"
          run: "false"

      - name: Resolve secret scan range
        id: scan-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          validate_commit() {
            local sha="$1"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            git cat-file -e "${sha}^{commit}" 2>/dev/null
          }

          has_commits=true
          scan_range=""

          case "$EVENT_NAME" in
            pull_request)
              validate_commit "$PR_BASE_SHA" || {
                echo "Invalid or unavailable pull-request base SHA" >&2
                exit 1
              }
              validate_commit "$PR_HEAD_SHA" || {
                echo "Invalid or unavailable pull-request head SHA" >&2
                exit 1
              }
              scan_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              validate_commit "$CURRENT_SHA" || {
                echo "Invalid or unavailable push head SHA" >&2
                exit 1
              }
              if [[ "$REF_NAME" == "$DEFAULT_BRANCH" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
                # Main push scans are cumulative from the newest successful
                # trusted main Secret scanning head that is an ancestor of this
                # commit. That makes branch-keyed cancellation safe: a newer
                # run covers every commit since the last proven success.
                success_file="$RUNNER_TEMP/secret-scanning-main-successes.txt"
                if ! gh api "/repos/${REPOSITORY}/actions/workflows/secret-scanning.yml/runs?branch=${DEFAULT_BRANCH}&status=success&per_page=100" \
                  --jq '.workflow_runs[].head_sha' > "$success_file"; then
                  echo "Unable to load successful main Secret scanning history" >&2
                  exit 1
                fi

                success_base=""
                while IFS= read -r candidate; do
                  [[ -n "$candidate" ]] || continue
                  validate_commit "$candidate" || {
                    echo "Invalid successful Secret scanning head SHA" >&2
                    exit 1
                  }
                  if [[ "$candidate" != "$CURRENT_SHA" ]] && git merge-base --is-ancestor "$candidate" "$CURRENT_SHA"; then
                    success_base="$candidate"
                    break
                  fi
                done < "$success_file"

                if [[ -n "$success_base" ]]; then
                  scan_range="${success_base}..${CURRENT_SHA}"
                else
                  # Fail closed when no trustworthy cumulative baseline can be
                  # established. A full-history scan is expensive but cannot
                  # silently omit secret evidence.
                  echo "::warning::No successful ancestor Secret scanning baseline; falling back to full-history scan."
                  scan_range="$CURRENT_SHA"
                fi
              else
                # New branches and all non-default branch pushes scan the full
                # branch delta from the trusted default-branch merge base. The
                # newest feature push therefore subsumes every older push scan.
                [[ -n "$DEFAULT_BRANCH" ]] || {
                  echo "Default branch is unavailable for branch secret scan" >&2
                  exit 1
                }
                baseline_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
                baseline_sha="$(git rev-parse --verify --quiet "${baseline_ref}^{commit}")" || {
                  echo "Unable to resolve default-branch baseline for branch secret scan" >&2
                  exit 1
                }
                validate_commit "$baseline_sha" || {
                  echo "Invalid default-branch baseline for branch secret scan" >&2
                  exit 1
                }
                merge_base="$(git merge-base "$CURRENT_SHA" "$baseline_sha")" || {
                  echo "Unable to resolve merge base for branch secret scan" >&2
                  exit 1
                }
                validate_commit "$merge_base" || {
                  echo "Invalid merge base for branch secret scan" >&2
                  exit 1
                }
                if [[ "$merge_base" == "$CURRENT_SHA" ]]; then
                  has_commits=false
                else
                  scan_range="${merge_base}..${CURRENT_SHA}"
                fi
              fi
              ;;
            workflow_dispatch)
              validate_commit "$CURRENT_SHA" || {
                echo "Invalid or unavailable workflow-dispatch SHA" >&2
                exit 1
              }
              scan_range="$CURRENT_SHA"
              ;;
            *)
              echo "Unsupported event for secret scanning: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          printf 'range=%s\n' "$scan_range" >> "$GITHUB_OUTPUT"
          printf 'has_commits=%s\n' "$has_commits" >> "$GITHUB_OUTPUT"

      - name: Record empty new-branch scan
        if: steps.scan-range.outputs.has_commits == 'false'
        shell: bash
        run: echo "New branch introduces no commits beyond the trusted default-branch baseline; no commit range to scan."

      - name: Scan for committed secrets
        if: steps.scan-range.outputs.has_commits == 'true'
        shell: bash
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.gitleaks-bin }}
          GITLEAKS_CONFIG: "${{ env.GITLEAKS_CONFIG }}"
          SCAN_RANGE: ${{ steps.scan-range.outputs.range }}
        run: |
          set -euo pipefail
          [[ -x "$GITLEAKS_BIN" ]] || {
            echo "Gitleaks binary is unavailable" >&2
            exit 1
          }
          [[ -n "$SCAN_RANGE" ]] || {
            echo "Secret scan range is empty" >&2
            exit 1
          }

          "$GITLEAKS_BIN" detect \
            --source . \
            --redact \
            --verbose \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-opts="$SCAN_RANGE"
