name: Secret scanning

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
  workflow_dispatch:

concurrency:
  group: secret-scanning-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_CONFIG: ".gitleaks.toml"
  GITLEAKS_ENABLE_COMMENTS: "false"

jobs:
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Gitleaks
    # Scan every push, including tree-preserving consolidation commits. A
    # commit-message-only exemption is forgeable and would let an ordinary push
    # suppress the repository's secret gate simply by reusing a trusted prefix.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Install the scanner separately so this workflow controls the exact
      # revision range instead of relying on wrapper-generated first-parent
      # ranges that can become stale after PR history changes.
      - name: Install Gitleaks
        id: gitleaks
        uses: gacts/gitleaks@073b89c1d99411300246edfd0125a78edc80750b
        with:
          version: "${{ env.GITLEAKS_VERSION }}"
          run: "false"

      - name: Resolve secret scan range
        id: scan-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          validate_commit() {
            local sha="$1"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            git cat-file -e "${sha}^{commit}" 2>/dev/null
          }

          has_commits=true
          scan_range=""

          case "$EVENT_NAME" in
            pull_request)
              validate_commit "$PR_BASE_SHA" || {
                echo "Invalid or unavailable pull-request base SHA" >&2
                exit 1
              }
              validate_commit "$PR_HEAD_SHA" || {
                echo "Invalid or unavailable pull-request head SHA" >&2
                exit 1
              }
              scan_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              validate_commit "$CURRENT_SHA" || {
                echo "Invalid or unavailable push head SHA" >&2
                exit 1
              }
              if [[ "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                [[ -n "$DEFAULT_BRANCH" ]] || {
                  echo "Default branch is unavailable for new-branch secret scan" >&2
                  exit 1
                }
                baseline_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
                baseline_sha="$(git rev-parse --verify --quiet "${baseline_ref}^{commit}")" || {
                  echo "Unable to resolve default-branch baseline for new-branch secret scan" >&2
                  exit 1
                }
                validate_commit "$baseline_sha" || {
                  echo "Invalid default-branch baseline for new-branch secret scan" >&2
                  exit 1
                }
                merge_base="$(git merge-base "$CURRENT_SHA" "$baseline_sha")" || {
                  echo "Unable to resolve merge base for new-branch secret scan" >&2
                  exit 1
                }
                validate_commit "$merge_base" || {
                  echo "Invalid merge base for new-branch secret scan" >&2
                  exit 1
                }
                if [[ "$merge_base" == "$CURRENT_SHA" ]]; then
                  has_commits=false
                else
                  scan_range="${merge_base}..${CURRENT_SHA}"
                fi
              else
                validate_commit "$PUSH_BEFORE_SHA" || {
                  echo "Invalid or unavailable push base SHA" >&2
                  exit 1
                }
                scan_range="${PUSH_BEFORE_SHA}..${CURRENT_SHA}"
              fi
              ;;
            workflow_dispatch)
              validate_commit "$CURRENT_SHA" || {
                echo "Invalid or unavailable workflow-dispatch SHA" >&2
                exit 1
              }
              scan_range="$CURRENT_SHA"
              ;;
            *)
              echo "Unsupported event for secret scanning: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          printf 'range=%s\n' "$scan_range" >> "$GITHUB_OUTPUT"
          printf 'has_commits=%s\n' "$has_commits" >> "$GITHUB_OUTPUT"

      - name: Record empty new-branch scan
        if: steps.scan-range.outputs.has_commits == 'false'
        shell: bash
        run: echo "New branch introduces no commits beyond the trusted default-branch baseline; no commit range to scan."

      - name: Scan for committed secrets
        if: steps.scan-range.outputs.has_commits == 'true'
        shell: bash
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.gitleaks-bin }}
          GITLEAKS_CONFIG: "${{ env.GITLEAKS_CONFIG }}"
          SCAN_RANGE: ${{ steps.scan-range.outputs.range }}
        run: |
          set -euo pipefail
          [[ -x "$GITLEAKS_BIN" ]] || {
            echo "Gitleaks binary is unavailable" >&2
            exit 1
          }
          [[ -n "$SCAN_RANGE" ]] || {
            echo "Secret scan range is empty" >&2
            exit 1
          }

          "$GITLEAKS_BIN" detect \
            --source . \
            --redact \
            --verbose \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-opts="$SCAN_RANGE"
