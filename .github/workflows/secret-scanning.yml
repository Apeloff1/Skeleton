name: Secret scanning

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scanning-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Gitleaks
    # Scan every push, including tree-preserving consolidation commits. A
    # commit-message-only exemption is forgeable and would let an ordinary push
    # suppress the repository's secret gate simply by reusing a trusted prefix.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce frontend Docker secret boundary
        shell: bash
        run: |
          set -euo pipefail

          dockerfile="frontend/Dockerfile"
          ignorefile="frontend/.dockerignore"

          [[ -f "$dockerfile" ]] || {
            echo "Missing $dockerfile" >&2
            exit 1
          }
          [[ -f "$ignorefile" ]] || {
            echo "Missing $ignorefile: frontend Docker builds must exclude local secrets" >&2
            exit 1
          }

          # The frontend image copies the build context wholesale. Keep this
          # assertion coupled to the ignore policy so a future Dockerfile edit
          # cannot silently weaken the boundary without updating this gate.
          grep -Eiq '^[[:space:]]*(COPY|ADD)[[:space:]]+\.[[:space:]]+\.[[:space:]]*$' "$dockerfile" || {
            echo "$dockerfile no longer performs a broad context copy; review this guard with the Dockerfile change" >&2
            exit 1
          }

          mapfile -t rules < <(
            sed -e 's/\r$//' \
                -e 's/^[[:space:]]*//' \
                -e 's/[[:space:]]*$//' \
                "$ignorefile"
          )

          require_rule() {
            local expected="$1"
            local rule
            for rule in "${rules[@]}"; do
              [[ "$rule" == "$expected" ]] && return 0
            done
            echo "Missing required Docker ignore rule: $expected" >&2
            return 1
          }

          required_rules=(
            '.env'
            '.env.*'
            '*.pem'
            '*.key'
            '*.p12'
            '*.pfx'
            '*.crt'
            '*.cer'
            'credentials*.json'
            'service-account*.json'
          )

          failed=0
          for rule in "${required_rules[@]}"; do
            require_rule "$rule" || failed=1
          done

          # A committed template may be intentionally re-included, but only as
          # the narrow exception to the blanket .env.* exclusion.
          require_rule '!.env.example' || failed=1

          (( failed == 0 )) || {
            echo "Frontend Docker build-context secret policy is incomplete" >&2
            exit 1
          }

      # Install the scanner separately so this workflow controls the exact
      # revision range instead of relying on wrapper-generated first-parent
      # ranges that can become stale after PR history changes.
      - name: Install Gitleaks
        id: gitleaks
        uses: gacts/gitleaks@073b89c1d99411300246edfd0125a78edc80750b
        with:
          version: "8.24.3"
          run: "false"

      - name: Resolve secret scan range
        id: scan-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          validate_commit() {
            local sha="$1"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            git cat-file -e "${sha}^{commit}" 2>/dev/null
          }

          case "$EVENT_NAME" in
            pull_request)
              validate_commit "$PR_BASE_SHA" || {
                echo "Invalid or unavailable pull-request base SHA" >&2
                exit 1
              }
              validate_commit "$PR_HEAD_SHA" || {
                echo "Invalid or unavailable pull-request head SHA" >&2
                exit 1
              }
              scan_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              validate_commit "$CURRENT_SHA" || {
                echo "Invalid or unavailable push head SHA" >&2
                exit 1
              }
              if [[ "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                scan_range="$CURRENT_SHA"
              else
                validate_commit "$PUSH_BEFORE_SHA" || {
                  echo "Invalid or unavailable push base SHA" >&2
                  exit 1
                }
                scan_range="${PUSH_BEFORE_SHA}..${CURRENT_SHA}"
              fi
              ;;
            workflow_dispatch)
              validate_commit "$CURRENT_SHA" || {
                echo "Invalid or unavailable workflow-dispatch SHA" >&2
                exit 1
              }
              scan_range="$CURRENT_SHA"
              ;;
            *)
              echo "Unsupported event for secret scanning: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          printf 'range=%s\n' "$scan_range" >> "$GITHUB_OUTPUT"

      - name: Scan for committed secrets
        shell: bash
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.gitleaks-bin }}
          GITLEAKS_CONFIG: ".gitleaks.toml"
          SCAN_RANGE: ${{ steps.scan-range.outputs.range }}
        run: |
          set -euo pipefail
          [[ -x "$GITLEAKS_BIN" ]] || {
            echo "Gitleaks binary is unavailable" >&2
            exit 1
          }
          [[ -n "$SCAN_RANGE" ]] || {
            echo "Secret scan range is empty" >&2
            exit 1
          }

          "$GITLEAKS_BIN" detect \
            --source . \
            --redact \
            --verbose \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-opts="$SCAN_RANGE"
