name: Secret scanning

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # PR heads are scanned through the pull_request event; push scans are reserved
  # for the default branch so one feature-branch commit cannot enqueue duplicate
  # scans for the same tree. Default-branch pushes retain per-generation evidence.
  group: secret-scanning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_CONFIG: ".gitleaks.toml"
  GITLEAKS_ENABLE_COMMENTS: "false"

jobs:
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Gitleaks
    # PR commits are scanned cumulatively from the PR base; push execution is
    # limited to the default branch, where each generation keeps exact evidence.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Install the scanner separately so this workflow controls the exact
      # revision range instead of relying on wrapper-generated first-parent
      # ranges that can become stale after PR history changes.
      - name: Install Gitleaks
        id: gitleaks
        uses: gacts/gitleaks@5b59d55fe2d0048f552a22ca2e5c24c5b63c7ecf
        with:
          version: "${{ env.GITLEAKS_VERSION }}"
          run: "false"

      - name: Resolve secret scan range
        id: scan-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          validate_commit() {
            local sha="$1"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            git cat-file -e "${sha}^{commit}" 2>/dev/null
          }

          has_commits=true
          scan_range=""

          case "$EVENT_NAME" in
            pull_request)
              validate_commit "$PR_BASE_SHA" || {
                echo "Invalid or unavailable pull-request base SHA" >&2
                exit 1
              }
              validate_commit "$PR_HEAD_SHA" || {
                echo "Invalid or unavailable pull-request head SHA" >&2
                exit 1
              }
              scan_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              validate_commit "$CURRENT_SHA" || {
                echo "Invalid or unavailable push head SHA" >&2
                exit 1
              }
              [[ -n "$DEFAULT_BRANCH" ]] || {
                echo "Default branch is unavailable for push secret scan" >&2
                exit 1
              }
              default_ref="refs/heads/${DEFAULT_BRANCH}"
              if [[ "$CURRENT_REF" == "$default_ref" ]]; then
                validate_commit "$PUSH_BEFORE_SHA" || {
                  echo "Invalid or unavailable default-branch push base SHA" >&2
                  exit 1
                }
                scan_range="${PUSH_BEFORE_SHA}..${CURRENT_SHA}"
              else
                baseline_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
                baseline_sha="$(git rev-parse --verify --quiet "${baseline_ref}^{commit}")" || {
                  echo "Unable to resolve default-branch baseline for branch secret scan" >&2
                  exit 1
                }
                validate_commit "$baseline_sha" || {
                  echo "Invalid default-branch baseline for branch secret scan" >&2
                  exit 1
                }
                merge_base="$(git merge-base "$CURRENT_SHA" "$baseline_sha")" || {
                  echo "Unable to resolve merge base for branch secret scan" >&2
                  exit 1
                }
                validate_commit "$merge_base" || {
                  echo "Invalid merge base for branch secret scan" >&2
                  exit 1
                }
                if [[ "$merge_base" == "$CURRENT_SHA" ]]; then
                  has_commits=false
                else
                  scan_range="${merge_base}..${CURRENT_SHA}"
                fi
              fi
              ;;
            workflow_dispatch)
              validate_commit "$CURRENT_SHA" || {
                echo "Invalid or unavailable workflow-dispatch SHA" >&2
                exit 1
              }
              scan_range="$CURRENT_SHA"
              ;;
            *)
              echo "Unsupported event for secret scanning: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          printf 'range=%s\n' "$scan_range" >> "$GITHUB_OUTPUT"
          printf 'has_commits=%s\n' "$has_commits" >> "$GITHUB_OUTPUT"

      - name: Record empty new-branch scan
        if: steps.scan-range.outputs.has_commits == 'false'
        shell: bash
        run: echo "New branch introduces no commits beyond the trusted default-branch baseline; no commit range to scan."

      - name: Scan for committed secrets
        if: steps.scan-range.outputs.has_commits == 'true'
        shell: bash
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.gitleaks-bin }}
          GITLEAKS_CONFIG: "${{ env.GITLEAKS_CONFIG }}"
          SCAN_RANGE: ${{ steps.scan-range.outputs.range }}
        run: |
          set -euo pipefail
          [[ -x "$GITLEAKS_BIN" ]] || {
            echo "Gitleaks binary is unavailable" >&2
            exit 1
          }
          [[ -n "$SCAN_RANGE" ]] || {
            echo "Secret scan range is empty" >&2
            exit 1
          }

          "$GITLEAKS_BIN" detect \
            --source . \
            --redact \
            --verbose \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-opts="$SCAN_RANGE"

  jeeves-native-source:
    # This is an additive, credential-free SOURCE check, not a replacement
    # for Gitleaks or any required exact-head merge/release gate. It uses the
    # existing admitted workflow rather than adding another workflow trigger.
    name: Jeeves native source contracts (source-only)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/jeeves-native-operational-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install required Skeleton production and local-inference dependencies
        run: |
          python -m pip install --disable-pip-version-check -e '.[local-inference]'
      - name: Compile Jeeves native boundaries
        run: |
          python -m compileall -q skeleton/jeeves/agent/native_prompt_boundary.py skeleton/jeeves/agent/native_schema_boundary.py skeleton/jeeves/agent/native_receipt_boundary.py skeleton/jeeves/agent/native_provider.py skeleton/jeeves/agent/native_runtime.py skeleton/jeeves/agent/native_readiness.py skeleton/jeeves/agent/native_chat.py skeleton/jeeves/agent/native_repl.py skeleton/jeeves/agent/native_signed_evidence.py skeleton/jeeves/agent/native_source_tool.py skeleton/jeeves/agent/native_operator_preflight.py skeleton/jeeves/agent/native_source_preflight.py skeleton/jeeves/agent/native_acceptance_cli.py skeleton/jeeves/agent/native_quality_eval.py skeleton/jeeves/agent/native_eval_cli.py skeleton/jeeves/agent/native_cli.py skeleton/jeeves/agent/native_checkpoint_journal.py skeleton/jeeves/agent/native_durable_runtime.py skeleton/jeeves/agent/native_run_memory.py skeleton/jeeves/agent/native_cold_doctor.py skeleton/jeeves/agent/native_session_acceptance.py skeleton/jeeves/agent/native_session_cli.py skeleton/jeeves/agent/native_batch_runtime.py skeleton/jeeves/agent/native_batch_cli.py skeleton/jeeves/agent/native_fabric_supervisor.py skeleton/jeeves/agent/native_durable_batch.py skeleton/jeeves/agent/native_durable_batch_cli.py skeleton/jeeves/agent/native_operator_session.py skeleton/jeeves/agent/native_operator_session_cli.py
      - name: Execute real Python source-only contract tests
        run: |
          python -m unittest skeleton.testing.test_jeeves_native_prompt_and_schema -v
          python -m unittest skeleton.testing.test_jeeves_native_provider_bridge -v
          python -m unittest skeleton.testing.test_jeeves_native_chat -v
          python -m unittest skeleton.testing.test_jeeves_native_signed_evidence -v
          python -m unittest skeleton.testing.test_jeeves_native_repl -v
          python -m unittest skeleton.testing.test_jeeves_native_acceptance_cli -v
          python -m unittest skeleton.testing.test_jeeves_native_quality_eval -v
          python -m unittest skeleton.testing.test_jeeves_native_sqlite_integration -v
          python -m unittest skeleton.testing.test_jeeves_native_source_tool -v
          python -m unittest skeleton.testing.test_jeeves_native_operator_preflight -v
          python -m unittest skeleton.testing.test_jeeves_native_source_preflight -v
          python -m unittest skeleton.testing.test_jeeves_native_checkpoint_journal -v
          python -m unittest skeleton.testing.test_jeeves_native_durable_agent -v
          python -m unittest skeleton.testing.test_jeeves_native_durable_cli -v
          python -m unittest skeleton.testing.test_jeeves_native_run_memory -v
          python -m unittest skeleton.testing.test_jeeves_native_cold_doctor -v
          python -m unittest skeleton.testing.test_jeeves_native_session_acceptance -v
          python -m unittest skeleton.testing.test_jeeves_native_batch -v
          python -m unittest skeleton.testing.test_jeeves_native_fabric_integration -v
      - name: Qualify Jeeves native operational fabric (source only)
        run: |
          python -m compileall -q skeleton/jeeves/native_fabric
          python -m unittest skeleton.testing.test_jeeves_native_fabric_matrix -q
          python -m unittest skeleton.testing.test_jeeves_native_traffic -v
          python -m unittest skeleton.testing.test_jeeves_native_durable_queue -v
          python -m unittest skeleton.testing.test_jeeves_native_signed_retrieval -v
          python -m unittest skeleton.testing.test_jeeves_native_telemetry_store -v
          python -m unittest skeleton.testing.test_jeeves_native_durable_batch -v
          python -m unittest skeleton.testing.test_jeeves_native_delivery_outbox -v
          python -m unittest skeleton.testing.test_jeeves_native_durable_batch_cli -v
          python -m unittest skeleton.testing.test_jeeves_native_process_crash -v
          python -m unittest skeleton.testing.test_jeeves_native_cold_fabric -v
          python -m unittest skeleton.testing.test_jeeves_native_laptop_doctor -v
          python -m unittest skeleton.testing.test_jeeves_native_operator_session -v
