name: Exact-head full repository sweep
on:
  push:
    branches: [audit/full-repository-sweep-20261106]
permissions:
  contents: read
concurrency:
  group: audit-full-repository-sweep-20261106
  cancel-in-progress: false
env:
  SOURCE_SHA: e00bfb0809b34573c2df313ea16e17fd10bead38
  PYTHONPATH: .
jobs:
  full-tree:
    name: Full clone, Git integrity, every-file inventory, Python/JSON/TOML parse
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e00bfb0809b34573c2df313ea16e17fd10bead38
          fetch-depth: 0
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.11.16"}
      - name: Exact source identity, Git object consistency, and all tracked source files
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fsck --full --no-reflogs
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json, os, subprocess, sys, tokenize, tomllib
          names = subprocess.check_output(["git","ls-files","-z"]).decode("utf-8","surrogateescape").split("\0")
          names = [x for x in names if x]
          stats = Counter()
          errors = []
          for name in names:
              path = Path(name)
              stats["tracked"] += 1
              if path.is_symlink():
                  stats["symlink"] += 1
                  continue
              if not path.is_file():
                  errors.append((name,"missing tracked path"))
                  continue
              stats["bytes"] += path.stat().st_size
              try:
                  if name.endswith(".py"):
                      stats["python"] += 1
                      with tokenize.open(path) as f: compile(f.read(),name,"exec")
                  elif name.endswith(".json"):
                      stats["json"] += 1
                      with path.open(encoding="utf-8") as f: json.load(f)
                  elif name.endswith(".toml"):
                      stats["toml"] += 1
                      with path.open("rb") as f: tomllib.load(f)
              except (SyntaxError, ValueError, UnicodeError, OSError, TypeError) as e:
                  errors.append((name,str(e)))
          print("FILE_BY_FILE_SUMMARY",dict(stats),"ERRORS",len(errors))
          for path,err in errors[:1000]: print("SOURCE_ERROR",path,err)
          if len(errors)>1000: print("UNPRINTED_ERRORS",len(errors)-1000)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("Full clone checked exact source SHA. "+str(dict(stats))+"; failures="+str(len(errors))+"\n")
          if errors: sys.exit(1)
          PY
  python-tests:
    name: All repository and Skeleton Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: e00bfb0809b34573c2df313ea16e17fd10bead38, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.11.16"}
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9" "pytest-asyncio>=1,<2" pytest-cov "fastapi>=0.110,<1" "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3" "httpx>=0.27,<1" "numpy>=2,<3" "PyYAML>=6,<7" "python-dotenv>=1,<2"
      - name: Execute all tests even when other modules cannot collect
        run: python -m pytest -q --continue-on-collection-errors --tb=short tests skeleton/testing scripts
  backend-tests:
    name: All backend tests, syntax, lint and toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: e00bfb0809b34573c2df313ea16e17fd10bead38, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.11.16"}
      - name: Install backend and tests
        run: python -m pip install -r backend/requirements.txt "pytest>=8,<9" pytest-asyncio pytest-cov "ruff==0.17.2"
      - name: Backend compilation, lint and contract
        shell: bash
        run: |
          failed=0
          python -m compileall -q backend || failed=1
          python -m ruff check backend --output-format github || failed=1
          python scripts/check_toolchain_contract.py || failed=1
          exit "$failed"
      - name: Execute all backend tests excluding externally hosted live tests
        if: always()
        run: python -m pytest -q --continue-on-collection-errors backend/tests -m "not live_service"
  frontend-tests:
    name: Frontend lint, TypeScript, web export, every declared test script
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: e00bfb0809b34573c2df313ea16e17fd10bead38, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --ignore-scripts --frozen-lockfile
      - run: node scripts/patch-node-modules.js
      - name: Execute every test script and all source checks independently
        run: |
          node <<'JS'
          const { spawnSync } = require('node:child_process');
          const { scripts } = require('./package.json');
          const jobs = ['lint:ci','typecheck','check:expo-native-compat','export:web',...Object.keys(scripts).filter(x=>x.startsWith('test:')).sort()];
          let failed=0;
          for(const name of jobs){
            console.log('\n===== CHECK '+name+' =====');
            const result=spawnSync('yarn',[name],{stdio:'inherit',timeout:600000});
            if(result.error || result.status!==0){failed++;console.error('CHECK_FAILED',name,result.status,String(result.error||''));}
          }
          console.log('FRONTEND_SWEEP',JSON.stringify({checked:jobs.length,failed}));
          if(failed)process.exitCode=1;
          JS
  contracts-builds:
    name: Source contracts, native Java tests and both Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: e00bfb0809b34573c2df313ea16e17fd10bead38, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.11.16"}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with: {distribution: temurin, java-version: "21"}
      - name: Run every listed canonical contract independently
        shell: bash
        run: |
          failed=0
          for script in check_toolchain_contract check_architecture_map check_ai_app_construction check_capability_interfaces check_provider_bootstrap check_state_topology check_ai_file_tree check_ai_file_tree_ownership check_jeeves_training_modules check_app_assembly check_process_safety check_deserialization_safety check_sast_security check_workflow_security check_secret_hygiene check_malware_iocs; do
            if test -f "scripts/$script.py"; then
              echo "===== $script ====="
              python "scripts/$script.py" || failed=$((failed+1))
            fi
          done
          echo "FAILED_CONTRACTS=$failed"
          test "$failed" -eq 0
      - name: Java accelerator smoke tests
        if: always()
        shell: bash
        run: |
          failed=0
          java java-accelerators/observability/AcceleratorMain.java --self-test || failed=1
          java java-accelerators/vector/VectorSearchMain.java --self-test || failed=1
          java java-accelerators/physics/BroadPhaseMain.java --self-test || failed=1
          exit "$failed"
      - name: Check both Docker image builds
        if: always()
        shell: bash
        run: |
          failed=0
          docker build --progress=plain -f backend/Dockerfile --target development -t skeleton-audit-backend . || failed=1
          docker build --progress=plain -f Dockerfile -t skeleton-audit-runtime . || failed=1
          exit "$failed"
