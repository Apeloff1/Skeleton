name: Stage 6 Streaming Closure Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/contracts/operation.py"
      - "skeleton/frontier/operation_stream.py"
      - "skeleton/frontier/operation_stream_store.py"
      - "skeleton/frontier/operation_stream_store_mongo.py"
      - "skeleton/persistence/operation_store_mongo.py"
      - "skeleton/ai/runtime/contracts/operation.py"
      - "skeleton/ai/runtime/frontier/operation_stream.py"
      - "skeleton/ai/runtime/frontier/operation_stream_store.py"
      - "skeleton/ai/runtime/frontier/operation_stream_store_mongo.py"
      - "skeleton/ai/runtime/persistence/operation_store_mongo.py"
      - "backend/core/operation_stream_transport.py"
      - "backend/routes/operation_stream.py"
      - "backend/tests/test_operation_stream_transport.py"
      - "backend/tests/test_operation_stream_route.py"
      - "backend/tests/test_operation_stream_multiworker.py"
      - "frontend/services/operationStreamReducer.ts"
      - "frontend/services/operationStreamSession.ts"
      - "frontend/scripts/test-operation-stream-reducer.mjs"
      - "frontend/scripts/test-operation-stream-session.mjs"
      - "scripts/verify_stage6_streaming_closure.py"
      - "tests/test_stage6_streaming_independent_verifier.py"
      - "machine/ai_app_construction.json"
      - "machine/ai_implementation_handoff.json"
      - "machine/ai_closure_evidence.json"
      - ".github/workflows/stage6-streaming-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage6-streaming-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage6-runtime:
    name: Stage 6 operation stream contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused stream runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "httpx==0.28.1"
          "PyJWT==2.14.0"
          "python-dotenv==1.2.3"
          "bcrypt==4.3.0"

      - name: Run canonical operation and durable stream contracts
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_operation_stream.py
          skeleton/testing/test_operation_stream_store.py
          skeleton/testing/test_operation_stream_store_mongo.py
          backend/tests/test_operation_stream_transport.py
          backend/tests/test_operation_stream_route.py
          backend/tests/test_operation_stream_multiworker.py

  stage6-browser:
    name: Stage 6 browser reconnect contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run reducer and browser-session journeys
        working-directory: frontend
        run: >-
          node --test
          scripts/test-operation-stream-reducer.mjs
          scripts/test-operation-stream-session.mjs

  stage6-independent:
    name: Independent Stage 6 streaming verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install verifier dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=7.0.0"

      - name: Run independent verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_stage6_streaming_independent_verifier.py

      - name: Run independent exact-head Stage-6 scan
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_stage6_streaming_closure.py
          --evidence-out .stage6-streaming-independent.json
          --print-evidence

      - name: Assert exact-head Stage-6 receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".stage6-streaming-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          if receipt.get("head_sha") != os.environ["EXPECTED_SHA"].strip():
              raise SystemExit("Stage-6 receipt does not match exact PR head")
          if receipt.get("verifier") != "independent-stage6-streaming-v1":
              raise SystemExit("unexpected Stage-6 verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent Stage-6 verification failed")
          if len(receipt.get("boundary_digests") or {}) < 10:
              raise SystemExit("Stage-6 boundary coverage is incomplete")
          if len(receipt.get("mirror_pairs") or []) < 5:
              raise SystemExit("Stage-6 mirror coverage is incomplete")
          print("independent Stage-6 exact-head receipt: OK")
          PY
