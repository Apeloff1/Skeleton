name: AI 100 Large Delivery Milestone Authority

on:
  pull_request:
    paths:
      - 'machine/ai_100_large_delivery_milestones.json'
      - 'machine/ai_master_plan.json'
      - 'machine/ai_build_accountability.json'
      - 'machine/ai_masterplan_parse_index.json'
      - 'machine/advanced_ai_structure_100.json'
      - 'scripts/check_ai_100_large_milestones.py'
      - 'tests/test_ai_100_large_milestones.py'
      - '.github/workflows/ai-100-large-milestones.yml'
  workflow_dispatch:

permissions:
  contents: read

# Bound parallel authority checks to their own PR/ref; unrelated PRs must
# never cancel one another, while obsolete exact-head runs can be replaced.
concurrency:
  group: ai-100-large-milestones-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Verify 100 milestones and canonical source pins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Use Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Run adverse-boundary regression tests
        run: python -m unittest tests.test_ai_100_large_milestones -v
      - name: Validate every milestone and current authority
        run: python scripts/check_ai_100_large_milestones.py
      - name: Validate canonical masterplan
        run: python scripts/check_ai_master_plan.py
      - name: Validate advanced AI structure
        run: python scripts/check_advanced_ai_structure.py
