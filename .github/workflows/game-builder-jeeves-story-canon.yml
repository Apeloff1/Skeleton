name: Jeeves Story Canon Production

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/game_builder/story_canon_fabric.py"
      - "skeleton/ai/game_builder/story_workspace.py"
      - "skeleton/ai/game_builder/story_memory.py"
      - "skeleton/ai/game_builder/story_continuity_assurance.py"
      - "skeleton/ai/game_builder/story_chapter_context.py"
      - "skeleton/ai/game_builder/jeeves_chapter_chat.py"
      - "skeleton/ai/game_builder/jeeves_app_runtime.py"
      - "skeleton/ai/game_builder/jeeves_appwide_fabric.py"
      - "tests/test_game_builder_jeeves_app_runtime.py"
      - "tests/test_game_builder_jeeves_appwide_fabric.py"
      - "docs/JEEVES_APP_CAPABILITY_ATLAS.md"
      - "docs/JEEVES_WHOLE_REPO_INVENTORY_AND_GOVERNED_ACTIONS.md"
      - "skeleton/ai/game_builder/story_cinematic_review.py"
      - "skeleton/ai/game_builder/story_detail_history.py"
      - "skeleton/ai/game_builder/story_asset_pixels.py"
      - "tests/test_game_builder_story_asset_pixels.py"
      - "skeleton/ai/game_builder/jeeves_production_director.py"
      - "skeleton/ai/game_builder/game_project_workspace.py"
      - "skeleton/ai/game_builder/game_workspace_server.py"
      - "skeleton/ai/game_builder/game_workspace_ui.py"
      - "skeleton/ai/game_builder/game_prompt_router.py"
      - "tests/test_game_builder_story_canon_fabric.py"
      - "tests/test_game_builder_story_workspace.py"
      - "tests/test_game_builder_jeeves_production.py"
      - "tests/test_game_builder_story_continuity_assurance.py"
      - "tests/test_game_builder_story_chapter_context.py"
      - "tests/test_game_builder_jeeves_chapter_chat.py"
      - "docs/JEEVES_100_ACT_9999_SCENE_CONSISTENCY_LAW.md"
      - "docs/JEEVES_100_CHAPTER_1000_ACT_9999_SCENE_STUDIO_STANDARD.md"
      - ".github/workflows/game-builder-jeeves-story-canon.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jeeves-story-canon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  canonical-authoring:
    name: Canon consistency and supervised production (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Exact SHA checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            skeleton/ai/forge/universal.py
            skeleton/ai/forge/__init__.py
            skeleton/ai/webcrawler/__init__.py
            skeleton/ai/webcrawler/
            skeleton/kernel/
            frontend/features/
            backend/gameforge/__init__.py
            backend/gameforge/forges/
            skeleton/forge/
            skeleton/organism/
            apps/jeeves/
            packaging/windows/
            java-accelerators/
            tests/__init__.py
            tests/test_game_builder_story_canon_fabric.py
            tests/test_game_builder_story_workspace.py
            tests/test_game_builder_jeeves_production.py
            tests/test_game_builder_story_continuity_assurance.py
            tests/test_game_builder_story_chapter_context.py
            tests/test_game_builder_jeeves_chapter_chat.py
            tests/test_game_builder_jeeves_app_runtime.py
            tests/test_game_builder_jeeves_appwide_fabric.py
            tests/test_game_builder_story_asset_pixels.py
            tests/test_game_builder_system_editors.py
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify checked-out commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile project canon and editor glue
        shell: bash
        run: |
          python -m py_compile skeleton/ai/game_builder/story_canon_fabric.py skeleton/ai/game_builder/story_workspace.py skeleton/ai/game_builder/story_memory.py skeleton/ai/game_builder/story_continuity_assurance.py skeleton/ai/game_builder/story_chapter_context.py skeleton/ai/game_builder/jeeves_chapter_chat.py skeleton/ai/game_builder/jeeves_app_runtime.py skeleton/ai/game_builder/jeeves_appwide_fabric.py skeleton/ai/game_builder/story_cinematic_review.py skeleton/ai/game_builder/story_detail_history.py skeleton/ai/game_builder/story_asset_pixels.py skeleton/ai/game_builder/jeeves_production_director.py skeleton/ai/game_builder/game_project_workspace.py skeleton/ai/game_builder/game_workspace_ui.py skeleton/ai/game_builder/game_workspace_server.py skeleton/ai/game_builder/game_prompt_router.py
      - name: Check app-wide Jeeves tools, all system editors, forge graph, Dragon, learning and 9999-scene receipts
        shell: bash
        run: |
          python -m unittest tests.test_game_builder_story_canon_fabric tests.test_game_builder_story_workspace tests.test_game_builder_jeeves_production tests.test_game_builder_story_asset_pixels tests.test_game_builder_story_continuity_assurance tests.test_game_builder_story_chapter_context tests.test_game_builder_jeeves_chapter_chat tests.test_game_builder_jeeves_app_runtime tests.test_game_builder_jeeves_appwide_fabric -v
