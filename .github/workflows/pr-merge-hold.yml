name: PR Merge Hold Gate

# The privileged gate always executes the checker from the trusted base,
# never the untrusted PR head. A separate read-only PR job tests proposed code.
on:
  pull_request_target:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
      - review_requested
      - review_request_removed
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/pr-merge-hold.yml'
      - 'scripts/check_pr_merge_hold.py'
      - 'tests/test_pr_merge_hold_gate.py'
      - 'skeleton/pr_automation/**'
      - 'skeleton/ai/build/pr_automation/**'
      - 'machine/ai_file_tree.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-merge-hold-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  explicit_pr_merge_hold:
    if: github.event_name == 'pull_request_target'
    name: PR Merge Hold Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted target branch, never PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Verify current PR title/body against live GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_pr_merge_hold.py

  qualification:
    if: github.event_name == 'pull_request'
    name: PR Merge Hold Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed source for isolated read-only tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install isolated test runner
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Validate live PR hold gate regressions
        run: python -m unittest discover -s tests -p 'test_pr_merge_hold_gate.py' -v
      - name: Validate automerge policy hold regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --noconftest skeleton/testing/test_automerge_pr_text_holds_20261110.py
      - name: Validate canonical AI file tree
        run: python scripts/check_ai_file_tree.py
