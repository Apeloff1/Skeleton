name: P1 Agent Delegation Handoff Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/agents/delegation.py"
      - "skeleton/ai/agents/core/delegation.py"
      - "skeleton/agents/swarm_fencing.py"
      - "skeleton/ai/agents/core/swarm_fencing.py"
      - "skeleton/agents/__init__.py"
      - "skeleton/ai/agents/core/__init__.py"
      - "skeleton/testing/test_agent_delegation.py"
      - "skeleton/testing/test_swarm_fencing.py"
      - "skeleton/testing/test_swarm_fencing_concurrency.py"
      - "skeleton/testing/test_swarm_exact_lease_atomicity.py"
      - ".github/workflows/p1-agent-delegation-handoff.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/agents/delegation.py"
      - "skeleton/ai/agents/core/delegation.py"
      - "skeleton/agents/swarm_fencing.py"
      - "skeleton/ai/agents/core/swarm_fencing.py"
      - "skeleton/agents/__init__.py"
      - "skeleton/ai/agents/core/__init__.py"
      - "skeleton/testing/test_agent_delegation.py"
      - "skeleton/testing/test_swarm_fencing.py"
      - "skeleton/testing/test_swarm_fencing_concurrency.py"
      - "skeleton/testing/test_swarm_exact_lease_atomicity.py"
      - ".github/workflows/p1-agent-delegation-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-agent-delegation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate agent delegation handoff and fencing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Run delegation and fencing regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_agent_delegation.py
          skeleton/testing/test_swarm_fencing.py
          skeleton/testing/test_swarm_fencing_concurrency.py
          skeleton/testing/test_swarm_exact_lease_atomicity.py

      - name: Build canonical AUTO-02 delegation decision
        run: |
          set -euo pipefail
          mkdir -p .p1-auto-02
          python - <<'PY'
          import json
          from pathlib import Path

          from skeleton.agents.delegation import (
              AgentIdentity,
              DelegationBudget,
              DelegationGrant,
              DelegationUsage,
              HandoffPacket,
              qualify_agent_delegation,
          )
          from skeleton.agents.swarm_fencing import fence_for
          from skeleton.agents.swarm_hardened import HardenedSwarmRuntime
          from skeleton.agents.swarm_runtime import SwarmTask

          now = 100.0
          runtime = HardenedSwarmRuntime(
              default_lease_seconds=30.0,
              clock=lambda: now,
          )
          runtime.register_worker(
              "child-ci",
              capabilities=("repo:write", "tool:execute"),
          )
          runtime.submit(
              SwarmTask(
                  "task-ci",
                  {},
                  required_capabilities=frozenset({"repo:write"}),
              )
          )
          leased = runtime.lease("child-ci")[0]
          fence = fence_for(leased)

          parent = AgentIdentity(
              agent_id="parent-ci",
              tenant_id="tenant-ci",
              generation=4,
              authority_scopes=(
                  "repo:read",
                  "repo:write",
                  "tool:execute",
              ),
          )
          child = AgentIdentity(
              agent_id="child-ci",
              tenant_id="tenant-ci",
              generation=2,
              authority_scopes=("repo:read", "repo:write"),
          )
          handoff = HandoffPacket(
              handoff_id="handoff-ci",
              delegation_id="delegation-ci",
              task_id="task-ci",
              parent_agent_id="parent-ci",
              child_agent_id="child-ci",
              context_digest="a" * 64,
              payload_digest="b" * 64,
              checkpoint_ref="checkpoint:task-ci:v1",
              required_scopes=("repo:write",),
              created_at=now,
          )
          grant = DelegationGrant(
              delegation_id="delegation-ci",
              parent=parent,
              child=child,
              delegated_scopes=("repo:read", "repo:write"),
              parent_remaining_budget=DelegationBudget(
                  max_tool_calls=20,
                  max_tokens=20_000,
                  max_cost_units=50.0,
                  max_wall_time_s=600.0,
                  max_payload_bytes=1_000_000,
              ),
              child_budget=DelegationBudget(
                  max_tool_calls=5,
                  max_tokens=4_000,
                  max_cost_units=10.0,
                  max_wall_time_s=120.0,
                  max_payload_bytes=100_000,
              ),
              handoff_digest=handoff.digest,
              issued_at=now - 1.0,
              expires_at=now + 100.0,
          )
          decision = qualify_agent_delegation(
              runtime=runtime,
              grant=grant,
              handoff=handoff,
              fence=fence,
              usage=DelegationUsage(
                  tool_calls=1,
                  tokens=500,
                  cost_units=1.0,
                  wall_time_s=5.0,
                  payload_bytes=1000,
              ),
              observed_at=now + 1.0,
              checkpoint_persisted=True,
          )
          if not decision.accepted:
              raise SystemExit(f"AUTO-02 fixture rejected: {decision.reasons}")
          evidence = decision.accepted_evidence_ref()
          Path(".p1-auto-02/decision.json").write_text(
              json.dumps(
                  {
                      **decision.payload(),
                      "decision_digest": decision.decision_digest,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          Path(".p1-auto-02/refs.json").write_text(
              json.dumps(
                  [
                      {
                          "source": evidence.source,
                          "digest": evidence.digest,
                          "category": evidence.category,
                      }
                  ],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head AUTO-02 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-auto-02/config.digest").write_text(
              hashlib.sha256(b"p1-auto-02-policy-v1").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-auto-02/environment.digest").write_text(
              hashlib.sha256(b"ubuntu-24.04|python-3.11.16|auto-02").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-auto-02/verifier.digest").write_text(
              digest(
                  [
                      "skeleton/agents/delegation.py",
                      "skeleton/agents/swarm_fencing.py",
                      ".github/workflows/p1-agent-delegation-handoff.yml",
                  ]
              ),
              encoding="utf-8",
          )
          Path(".p1-auto-02/tests.digest").write_text(
              digest(
                  [
                      "skeleton/testing/test_agent_delegation.py",
                      "skeleton/testing/test_swarm_fencing.py",
                      "skeleton/testing/test_swarm_fencing_concurrency.py",
                      "skeleton/testing/test_swarm_exact_lease_atomicity.py",
                  ]
              ),
              encoding="utf-8",
          )
          PY
          python scripts/emit_p1_promotion_evidence.py             --repository Apeloff1/Skeleton             --commit-sha "$EXPECTED_SHA"             --expected-head "$EXPECTED_SHA"             --task-id P1-AUTO-02             --accountability-id ACC-P1-AUTO-02             --configuration-digest "$(cat .p1-auto-02/config.digest)"             --environment-digest "$(cat .p1-auto-02/environment.digest)"             --verifier-id github-actions:p1-agent-delegation-handoff             --verifier-digest "$(cat .p1-auto-02/verifier.digest)"             --test-manifest-digest "$(cat .p1-auto-02/tests.digest)"             --run-id "$RUN_IDENTITY"             --run-attempt "$RUN_ATTEMPT"             --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --evidence-file .p1-auto-02/refs.json             --out .p1-auto-02/receipt.json             > .p1-auto-02/stdout.json

      - name: Assert exact-head receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-auto-02/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("AUTO-02 receipt head mismatch")
          if receipt["task_id"] != "P1-AUTO-02":
              raise SystemExit("AUTO-02 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-AUTO-02":
              raise SystemExit("AUTO-02 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("AUTO-02 exact-head receipt OK", receipt["receipt_digest"])
          PY
