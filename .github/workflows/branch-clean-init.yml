name: Initialize branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-clean-init.yml'
  workflow_dispatch:

permissions: {}

jobs:
  initialize:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch branch cleanup on current main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run branch-clean.yml --ref main
