name: Emerald V7 nine-phase contact evidence
on:
  push:
    branches:
      - 'feat/emerald-v7-nine-phase-*'
    paths:
      - 'scripts/check_emerald_v7_nine_phase.py'
      - 'scripts/test_emerald_v7_nine_phase.py'
      - 'scripts/test_emerald_v7_nine_phase_contract.py'
      - 'assets/emerald/evolution-v7/nine-phase-complete-evidence.json'
      - '.github/workflows/emerald-v7-nine-phase.yml'
  pull_request:
    paths:
      - 'scripts/check_emerald_v7_nine_phase.py'
      - 'scripts/test_emerald_v7_nine_phase.py'
      - 'scripts/test_emerald_v7_nine_phase_contract.py'
      - 'assets/emerald/evolution-v7/nine-phase-complete-evidence.json'
      - '.github/workflows/emerald-v7-nine-phase.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-measured-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact source SHA
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Pinned source-only numerical library
        run: python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.16.3 numba==0.62.1
      - name: Verify source syntax and hostile receipt integrity
        run: |
          python -m py_compile scripts/check_emerald_v7_nine_phase.py scripts/test_emerald_v7_nine_phase.py scripts/test_emerald_v7_nine_phase_contract.py
          python scripts/test_emerald_v7_nine_phase.py
          python scripts/test_emerald_v7_nine_phase_contract.py
          python scripts/check_emerald_v7_nine_phase.py
      - name: Preserve clear evidence scope
        run: echo 'Measured receipt consistency only. Private original GLBs and external full reports not replayed in this CI. No continuous collision, real Three mixer, native RTX, artist or release acceptance.'
