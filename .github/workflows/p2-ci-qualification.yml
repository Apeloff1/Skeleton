name: P2 CI Qualification Evidence

on:
  workflow_run:
    workflows:
      - Backend Quality
      - P2 Repository Engineering Control
      - Provider Surface Closure Gate
      - Repository Hygiene Gate
      - State Recovery Drill
      - Workflow Input Security
    types: [completed]
    branches:
      - "*"
      - "**"

permissions:
  actions: read
  contents: read

concurrency:
  group: p2-ci-qualification-${{ github.event_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify exact-head P2 CI evidence
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      P2_CI_ATTESTATION_KEY: ${{ secrets.P2_CI_ATTESTATION_KEY }}
      SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Qualify complete exact-head required-check catalog
        id: qualification
        shell: bash
        run: |
          set -u -o pipefail
          if [[ -z "${P2_CI_ATTESTATION_KEY:-}" ]]; then
            echo "P2 CI attestation key is not configured; no live evidence emitted."
            echo "emitted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "${SOURCE_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "workflow_run head SHA must be a canonical 40-hex commit OID" >&2
            exit 2
          }
          mkdir -p .p2-evidence
          evidence=".p2-evidence/ci-$SOURCE_HEAD_SHA.json"
          set +e
          python scripts/qualify_spine_ci_live.py             --repository "$GITHUB_REPOSITORY"             --expected-head "$SOURCE_HEAD_SHA"             --evidence-out "$evidence"             --allow-incomplete
          status=$?
          set -e
          if [[ "$status" -eq 3 ]]; then
            echo "Required-check catalog is not complete and green yet."
            echo "emitted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$status" -eq 0 ]] || exit "$status"
          [[ -s "$evidence" ]] || {
            echo "CI qualifier returned success without evidence" >&2
            exit 2
          }
          echo "emitted=true" >> "$GITHUB_OUTPUT"

      - name: Upload P2 CI qualification evidence
        if: steps.qualification.outputs.emitted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p2-ci-qualification-${{ github.event.workflow_run.head_sha }}
          path: .p2-evidence/ci-${{ github.event.workflow_run.head_sha }}.json
          if-no-files-found: error
          retention-days: 30
