name: Foundation cache and realtime qualification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: foundation-cache-realtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Exact-head query cache and realtime lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up supported Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install isolated TypeScript test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/foundation-test" --no-package-lock --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Execute full query cache and realtime regression suites
        working-directory: frontend
        run: |
          export NODE_PATH="$RUNNER_TEMP/foundation-test/node_modules"
          node --test scripts/app-foundation/query-cache.test.cjs scripts/app-foundation/realtime.test.cjs
