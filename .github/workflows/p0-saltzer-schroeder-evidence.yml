name: P0 Saltzer Schroeder Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/jeeves/agent/tools.py"
      - "skeleton/jeeves/agent/epistemic_tool_gate.py"
      - "skeleton/shells/ai/mcp_authz.py"
      - "skeleton/shells/ai/approval.py"
      - "skeleton/skills/privileged_transaction.py"
      - "skeleton/sandbox/process.py"
      - "skeleton/security/policy_engine.py"
      - "skeleton/ai/runtime/security/policy_engine.py"
      - "skeleton/testing/test_security_policy_engine_fail_closed.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-saltzer-schroeder-evidence.yml"
  workflow_dispatch:


concurrency:
  group: p0-saltzer-schroeder-evidence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  principles:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify policy engine mirror
        run: cmp skeleton/security/policy_engine.py skeleton/ai/runtime/security/policy_engine.py
      - name: Run least privilege and fail-safe regressions
        run: |
          python -m pytest -q skeleton/testing/test_security_policy_engine_fail_closed.py
          python -m pytest -q skeleton/testing/test_jeeves_epistemic_tool_gate.py
          python -m pytest -q skeleton/testing/test_privileged_tool_transaction.py
          python -m pytest -q skeleton/testing/test_shell_ai_mcp_2026.py
          python -m pytest -q skeleton/testing/test_shell_ai_approval_budget_toolguards.py
