name: Repository Supervisor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: repository-supervisor-${{ github.repository }}
  cancel-in-progress: false

# No workflow-wide authority. Planning and mutation live in separate jobs.
permissions: {}

jobs:
  plan:
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      delegation_b64: ${{ steps.supervisor.outputs.delegation_b64 }}
      snapshot_fingerprint: ${{ steps.supervisor.outputs.snapshot_fingerprint }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MODEL_API_URL: ${{ vars.MODEL_API_URL }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Build bounded Supervisor delegation
        id: supervisor
        run: python -m skeleton.automation.supervisor --plan-only --emit-github-output "$GITHUB_OUTPUT"

  secretary:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.delegation_b64 != '' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MODEL_API_URL: ${{ vars.MODEL_API_URL }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
      SUPERVISOR_DELEGATION: "1"
      SUPERVISOR_SNAPSHOT_FINGERPRINT: ${{ needs.plan.outputs.snapshot_fingerprint }}
      SUPERVISOR_DELEGATION_B64: ${{ needs.plan.outputs.delegation_b64 }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Admit delegation and dispatch bounded workers
        run: python -m skeleton.automation.secretary --delegation-b64 "$SUPERVISOR_DELEGATION_B64"
