name: Overnight Studio

on:
  workflow_dispatch:
    inputs:
      cohort_size:
        description: 'Virtual roles considered this shift (1-64)'
        required: false
        default: '32'
      model_calls:
        description: 'Maximum model-backed workers this shift (1-8)'
        required: false
        default: '4'
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: overnight-studio-${{ github.repository }}
  cancel-in-progress: false

# The job needs write authority only for the final trusted publication step.
# The token is never exported to model generation or test execution.
permissions:
  contents: write
  pull-requests: write

jobs:
  studio-shift:
    if: github.repository == 'Apeloff1/Skeleton'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      STUDIO_COHORT_SIZE: ${{ inputs.cohort_size || '32' }}
      STUDIO_MAX_MODEL_CALLS: ${{ inputs.model_calls || '4' }}

    steps:
      - name: Checkout trusted default branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.1.0
        with:
          python-version: '3.11'

      - name: Generate bounded studio proposals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m skeleton.automation.studio_shift \
            --root . \
            --run-id "$run_id" \
            --cohort-size "$STUDIO_COHORT_SIZE" \
            --max-model-calls "$STUDIO_MAX_MODEL_CALLS" \
            --output-dir .studio-out

          cp .studio-out/report.json "$RUNNER_TEMP/studio-report.json"
          cp .studio-out/audit.jsonl "$RUNNER_TEMP/studio-audit.jsonl"

      - name: Enforce proposal-to-diff boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess

          with open('.studio-out/report.json', encoding='utf-8') as handle:
              report = json.load(handle)
          allowed = set(report.get('accepted_paths', []))
          changed = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit(f'unexpected changed paths: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'accepted paths missing from diff: {sorted(missing)}')
          print(f'validated {len(changed)} changed path(s) against studio report')
          PY
          git diff --check
          git diff --binary -- . ':!.studio-out' > "$RUNNER_TEMP/studio.patch"
          sha256sum "$RUNNER_TEMP/studio.patch" > "$RUNNER_TEMP/studio.patch.sha256"

      - name: Validate studio control contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            skeleton/testing/test_studio.py \
            skeleton/testing/test_studio_shift.py \
            -q --tb=short

      - name: Validate generated Python in a credential-free step
        shell: bash
        env:
          OPENAI_API_KEY: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          python -m compileall skeleton -q
          python -m pytest skeleton/testing -q --tb=short

      - name: Restore sealed proposal after test execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/studio.patch.sha256"
          git reset --hard HEAD
          git clean -fdx
          if [[ -s "$RUNNER_TEMP/studio.patch" ]]; then
            git apply --whitespace=nowarn "$RUNNER_TEMP/studio.patch"
          fi
          git diff --check

      - name: Record exhaustive shift evidence
        shell: bash
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence_dir="docs/studio-runs/${run_id}"
          mkdir -p "$evidence_dir"
          cp "$RUNNER_TEMP/studio-report.json" "$evidence_dir/report.json"
          cp "$RUNNER_TEMP/studio-audit.jsonl" "$evidence_dir/audit.jsonl"
          cp "$RUNNER_TEMP/studio.patch.sha256" "$evidence_dir/patch.sha256"
          {
            echo "# Studio shift ${run_id}"
            echo
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Base SHA: ${GITHUB_SHA}"
            echo "- Cohort size: ${STUDIO_COHORT_SIZE}"
            echo "- Maximum model calls: ${STUDIO_MAX_MODEL_CALLS}"
            echo "- Patch validated before tests, tests executed without API/GitHub tokens, then the sealed patch was restored."
            echo "- Full machine-readable decisions: report.json"
            echo "- Append-only action ledger: audit.jsonl"
          } > "$evidence_dir/README.md"

      - name: Publish review branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          branch="studio/run-${run_id}"

          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard docs/studio-runs/${run_id})" ]]; then
            echo 'No studio output to publish.'
            exit 0
          fi

          git switch -c "$branch"
          git config user.name 'skeleton-studio[bot]'
          git config user.email '122585327+Apeloff1@users.noreply.github.com'
          git add -A
          git commit -m "studio: bounded shift ${run_id}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## Autonomous studio shift ${run_id}

          This PR was produced by the bounded 1,000-role virtual studio.

          Safety boundary:
          - model output was limited to strict text-file proposals;
          - workflow/auth/security/dependency-control paths were blocked;
          - model-generated commands were never executed;
          - tests ran without the OpenAI key or GitHub token in their environment;
          - the pre-test patch was sealed by SHA-256 and restored after tests;
          - publication is PR-only; no direct write to main occurred;
          - exhaustive report/audit evidence is committed under docs/studio-runs/${run_id}/.

          Review the generated code and ordinary repository CI before merge.
          EOF

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "studio: autonomous build shift ${run_id}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
