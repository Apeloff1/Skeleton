name: Autonomous Studio Night Shift

on:
  schedule:
    # Four bounded overnight shifts. These land around midnight-06:00 in Norway
    # across CET/CEST without requiring timezone-aware cron support.
    - cron: '19 22,0,2,4 * * *'
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Maximum accepted engineering tasks in this run (1-3)'
        required: false
        default: '2'
      cohort_size:
        description: 'Virtual workers activated for planning context (3-50)'
        required: false
        default: '15'

concurrency:
  group: autonomous-studio-night-shift
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  studio:
    if: github.repository == 'Apeloff1/Skeleton'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.1.0
        with:
          python-version: '3.11.16'

      - name: Install trusted studio tooling
        run: python -m pip install -e '.[dev]'

      - name: Generate bounded model proposals
        id: proposal
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
          REQUESTED_MAX_TASKS: ${{ inputs.max_tasks }}
          REQUESTED_COHORT_SIZE: ${{ inputs.cohort_size }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo '::error::OPENAI_API_KEY repository secret is required for Autonomous Studio.'
            exit 1
          fi

          max_tasks="${REQUESTED_MAX_TASKS:-2}"
          cohort_size="${REQUESTED_COHORT_SIZE:-15}"
          mkdir -p .studio-tmp
          python -m skeleton.automation.studio_director propose \
            --patch-path .studio-tmp/studio.patch \
            --audit-path .studio-tmp/audit.jsonl \
            --max-tasks "$max_tasks" \
            --cohort-size "$cohort_size" \
            --seed "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          python -m skeleton.automation.studio_report \
            --audit .studio-tmp/audit.jsonl \
            --output .studio-tmp/report.md

          if [[ -s .studio-tmp/studio.patch ]]; then
            echo 'has_patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_patch=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate proposed diff without model credentials
        if: steps.proposal.outputs.has_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # OPENAI_API_KEY is step-scoped above and is intentionally absent here.
          test -z "${OPENAI_API_KEY:-}"
          git apply --check .studio-tmp/studio.patch
          git apply .studio-tmp/studio.patch
          git diff --check

          # Compile generated Python without importing project modules.
          python -m compileall skeleton backend -q

          mapfile -t changed_python < <(git diff --name-only --diff-filter=ACM | grep -E '\.py$' || true)
          if (( ${#changed_python[@]} > 0 )); then
            python -m ruff check "${changed_python[@]}"
          fi

      - name: Persist Studio Ledger entry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          title='bot: autonomous studio ledger'
          number=$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [[ -z "${number:-}" ]]; then
            issue_url=$(gh issue create --repo "$REPO" --title "$title" \
              --body 'Durable append-only human-readable ledger for Autonomous Studio runs. Every scheduled run comments here, including rejected/no-op runs. Source-of-truth machine events also live in the PR audit JSONL when a patch is published.')
            number="${issue_url##*/}"
          fi

          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat .studio-tmp/report.md
          } > .studio-tmp/ledger-comment.md
          gh issue comment "$number" --repo "$REPO" --body-file .studio-tmp/ledger-comment.md >/dev/null

      - name: Prepare validated branch payload
        if: steps.proposal.outputs.has_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .studio/audit
          cp .studio-tmp/audit.jsonl .studio/audit/latest.jsonl
          cp .studio-tmp/report.md .studio/audit/latest.md

          # Studio v1 only modifies existing model-selected files; stage tracked
          # modifications plus the two controlled audit artifacts explicitly.
          git add -u
          git add .studio/audit/latest.jsonl .studio/audit/latest.md
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.studio-tmp/'; then
            echo '::error::temporary proposal files must never be committed'
            exit 1
          fi

      - name: Publish reviewable studio PR
        if: steps.proposal.outputs.has_patch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="studio/night-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'skeleton-studio[bot]'
          git config user.email 'skeleton-studio[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -m "studio: bounded autonomous build run ${GITHUB_RUN_ID}"

          # Credentials are introduced only after proposal/static validation.
          gh auth setup-git
          git push --set-upstream origin "$branch"

          pr_url=$(gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "studio: autonomous build run ${GITHUB_RUN_ID}" \
            --body-file .studio/audit/latest.md)
          {
            echo '## Autonomous Studio publication'
            echo
            echo "PR: ${pr_url}"
            echo '- Direct main writes: disabled'
            echo '- Auto-merge: disabled'
            echo '- Model-generated shell execution: disabled'
            echo '- API key present during generated-code validation: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize no-op/rejected shift
        if: steps.proposal.outputs.has_patch != 'true'
        run: |
          {
            echo '## Autonomous Studio'
            echo
            echo 'No patch cleared planning, deterministic policy, git applicability, and senior review in this run.'
            echo 'The run is still recorded in the durable Studio Ledger.'
          } >> "$GITHUB_STEP_SUMMARY"
