name: P1 Risk Classification Evidence Batch 4 Gate

on:
  pull_request:
    branches:
      - main
      - p1/learning-eval-gap-bindings-batch3-mainline-20260930
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "machine/p1_required_gate_authority.json"
      - "machine/p1_reproducibility_policy.json"
      - "machine/ai_scope_freeze_adrs.json"
      - "skeleton/contracts/risk_evidence.py"
      - "skeleton/contracts/promotion_gates.py"
      - "skeleton/contracts/reproducibility.py"
      - "skeleton/eval/experiment_registry.py"
      - "skeleton/eval/benchmark_registry.py"
      - "skeleton/eval/shadow_traffic.py"
      - "skeleton/eval/champion_registry.py"
      - "skeleton/eval/failure_knowledge.py"
      - "scripts/reconcile_p1_risk_evidence.py"
      - "scripts/check_ai_scope_freeze.py"
      - "scripts/build_p1_risk_classification_evidence.py"
      - "skeleton/testing/test_risk_evidence.py"
      - "skeleton/testing/test_promotion_gates.py"
      - "tests/test_p1_required_gate_authority.py"
      - "skeleton/testing/test_reproducibility.py"
      - "tests/test_p1_reproducibility_bundle.py"
      - "skeleton/testing/test_architecture_scope_freeze.py"
      - "skeleton/testing/test_experiment_registry.py"
      - "skeleton/testing/test_benchmark_registry.py"
      - "skeleton/testing/test_shadow_traffic.py"
      - "skeleton/testing/test_champion_registry.py"
      - "skeleton/testing/test_failure_knowledge.py"
      - "tests/test_p1_risk_evidence_reconciliation.py"
      - "tests/test_p1_risk_classification_evidence_batch4.py"
      - ".github/workflows/p1-risk-evidence-binding.yml"
      - ".github/workflows/p1-risk-classification-evidence-batch4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-risk-classification-batch4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify P1 risk classification evidence batch 4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused verifier runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Validate canonical P1 inputs
        run: |
          set -euo pipefail
          python scripts/check_ai_master_plan.py
          python scripts/check_ai_p1_execution_map.py --print-summary
          python scripts/check_p1_required_gate_authority.py
          python scripts/check_p1_reproducibility.py
          python scripts/check_ai_scope_freeze.py

      - name: Run focused risk-classification regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_risk_evidence.py
          tests/test_p1_risk_evidence_reconciliation.py
          skeleton/testing/test_promotion_gates.py
          tests/test_p1_required_gate_authority.py
          skeleton/testing/test_reproducibility.py
          tests/test_p1_reproducibility_bundle.py
          skeleton/testing/test_architecture_scope_freeze.py
          skeleton/testing/test_experiment_registry.py
          skeleton/testing/test_benchmark_registry.py
          skeleton/testing/test_shadow_traffic.py
          skeleton/testing/test_champion_registry.py
          skeleton/testing/test_failure_knowledge.py
          tests/test_p1_risk_classification_evidence_batch4.py

      - name: Build exact-head risk classification candidates
        run: |
          set -euo pipefail
          mkdir -p .p1-risk-classification
          python scripts/build_p1_risk_classification_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-risk-classification/report.json \
            --print-summary \
            --print-candidates

      - name: Prove deterministic replay and authority boundaries
        run: |
          set -euo pipefail
          python scripts/build_p1_risk_classification_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-risk-classification/replay.json
          cmp .p1-risk-classification/report.json .p1-risk-classification/replay.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".p1-risk-classification/report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("batch 4 report is not exact-head bound")
          if report["covered_risk_count"] != 20:
              raise SystemExit("batch 4 must cover exactly 20 risks")
          if report["covered_volume_count"] != 11:
              raise SystemExit("batch 4 must cover exactly 11 volumes")
          if report["proposed_severity"] != "high":
              raise SystemExit("batch 4 must classify conservatively as high")
          if report["already_bound_count"] != 0:
              raise SystemExit("batch 4 unexpectedly overlaps governed bindings")
          if report["candidate_binding_count"] != 20:
              raise SystemExit("batch 4 must emit exactly 20 candidates")
          if report["non_authoritative"] is not True:
              raise SystemExit("batch 4 became authoritative")
          for field in (
              "creates_bindings",
              "accepts_risk",
              "signs_accountability",
              "promotes_maturity",
          ):
              if report[field] is not False:
                  raise SystemExit(f"authority-boundary drift: {field}")
          for row in report["records"]:
              if row["binding_present"]:
                  raise SystemExit(
                      "batch 4 candidate already has a governed binding: "
                      + row["obligation_id"]
                  )
              if row["proposed_severity"] != "high":
                  raise SystemExit("batch 4 risk severity downgrade detected")
              ref = row["candidate_evidence_ref"]
              if ref["digest"] != row["packet_digest"]:
                  raise SystemExit("batch 4 candidate digest drift")
              if ref["category"] != "risk_classification_evidence":
                  raise SystemExit("batch 4 evidence category drift")
              if not ref["source"].endswith(":" + os.environ["EXPECTED_SHA"]):
                  raise SystemExit("batch 4 evidence is not exact-head bound")
          print("P1 risk classification batch 4 OK:", report["report_digest"])
          PY

      - name: Prove governed EVID-04 registry is unchanged pre-binding
        run: |
          set -euo pipefail
          EVALUATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/reconcile_p1_risk_evidence.py \
            --evaluated-at "$EVALUATED_AT" \
            --out .p1-risk-classification/risk-report.json \
            --print-summary
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-risk-classification/risk-report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["binding_count"] != 34:
              raise SystemExit("batch 4 verifier mutated governed binding count")
          if report["resolved_count"] != 34:
              raise SystemExit("batch 4 verifier mutated governed resolution count")
          if report["unresolved_blocking_count"] != 479:
              raise SystemExit("batch 4 verifier mutated blocking obligation count")
          if report["unclassified_count"] != 281:
              raise SystemExit("batch 4 verifier mutated unclassified risk count")
          if report["disposition_counts"] != {
              "evidence": 34,
              "unbound": 479,
          }:
              raise SystemExit("batch 4 verifier mutated disposition counts")
          print("Governed EVID-04 registry unchanged during batch 4 verification.")
          PY
