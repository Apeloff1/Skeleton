name: Stage 7 Golden Journeys Closure Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/testing/test_ai_golden_journeys.py"
      - "skeleton/api/engine_service.py"
      - "skeleton/ai/runtime/api/engine_service.py"
      - "backend/tests/test_ai_chat_engine_cutover.py"
      - "frontend/services/operationStream.ts"
      - "frontend/services/operationStreamSession.ts"
      - "frontend/services/operationStreamReducer.ts"
      - "frontend/scripts/test-operation-stream-session.mjs"
      - "frontend/scripts/test-operation-stream-reducer.mjs"
      - "frontend/package.json"
      - "scripts/verify_stage7_golden_journeys.py"
      - "tests/test_stage7_golden_journeys_independent_verifier.py"
      - "machine/ai_app_construction.json"
      - "machine/ai_closure_evidence.json"
      - "machine/ai_implementation_handoff.json"
      - ".github/workflows/stage7-golden-journeys-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-golden-journeys-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11.16"
  NODE_VERSION: "24.20.0"

jobs:
  golden-journey-contracts:
    name: Stage 7 golden journey contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install focused Stage-7 dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "httpx==0.28.1"
          "PyJWT==2.14.0"
          "python-dotenv==1.2.3"

      - name: Run canonical Stage-7 deterministic journeys
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_ai_golden_journeys.py

      - name: Run engine-outage product boundary
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_ai_chat_engine_cutover.py
          -k "engine_outage"

  browser-session-journeys:
    name: Stage 7 browser session journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies without lifecycle scripts
        working-directory: frontend
        run: yarn install --ignore-scripts

      - name: Apply reviewed local node_modules patches
        working-directory: frontend
        run: node ./scripts/patch-node-modules.js

      - name: Typecheck browser operation-session runtime
        working-directory: frontend
        run: yarn typecheck

      - name: Run browser operation-stream journeys
        working-directory: frontend
        run: yarn test:operation-stream

  stage7-independent:
    name: Independent Stage 7 verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install independent verifier test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"

      - name: Run independent verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_stage7_golden_journeys_independent_verifier.py

      - name: Run independent exact-head Stage-7 scan
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_stage7_golden_journeys.py
          --evidence-out .stage7-independent.json
          --print-evidence

      - name: Assert exact-head independent receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".stage7-independent.json").read_text(encoding="utf-8")
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("Stage-7 receipt does not match exact PR head")
          if receipt.get("verifier") != "independent-stage7-golden-journeys-v1":
              raise SystemExit("unexpected Stage-7 verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent Stage-7 verification failed")
          if len(receipt.get("boundary_digests") or {}) < 5:
              raise SystemExit("Stage-7 boundary coverage is incomplete")
          if not receipt.get("machine_digest"):
              raise SystemExit("Stage-7 machine-contract digest is missing")
          print("independent Stage-7 exact-head receipt:", expected)
          PY
