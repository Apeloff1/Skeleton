      - "skeleton/testing/test_local_model_deployment.py"
      - "scripts/qualify_local_model_runtime.py"
      - ".github/workflows/p2-local-inference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-local-inference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Parse-check offline Python sources before dependency installation
        run: |
          python -m compileall -q \
            skeleton/app/offline_history.py \
            skeleton/app/offline_workspace.py \
            skeleton/app/offline_library.py \
            skeleton/app/offline_index_queue.py \
            skeleton/app/offline_snapshot.py \
            skeleton/app/offline_audit.py \
            skeleton/app/offline_sqlite_safety.py \
            skeleton/app/offline_readiness.py \
            skeleton/app/offline_qualification.py \
            skeleton/ai/training/offline_foundations.py \
            scripts/training/verify_offline_foundations.py \
            scripts/training/generate_offline_foundations.py \
            skeleton/testing/test_offline_foundations.py \
            skeleton/ai/training/sparse_capability.py \
            scripts/training/sparse_capability.py \
            scripts/training/probe_sparse_capabilities.py \
            skeleton/testing/test_sparse_capability.py \
            skeleton/testing/test_procedural_capabilities.py \
            skeleton/ai/training/capability_ledger.py \
            skeleton/ai/training/resource_admission.py \
            skeleton/ai/runtime/deterministic_capabilities.py \
            skeleton/ai/runtime/capability_graph.py \
            skeleton/ai/runtime/gameplay_capabilities.py \
            skeleton/ai/runtime/game_platform_catalog.py \
            skeleton/ai/runtime/game_rights.py \
            skeleton/ai/runtime/game_project_capsule.py \
            skeleton/ai/runtime/game_playability.py \
            skeleton/testing/test_game_playability.py \
            scripts/game/export_portable_c89.py \
            skeleton/testing/test_game_c89_export.py \
            scripts/game/game_project.py \
            skeleton/testing/test_cross_era_game_rights.py \
            skeleton/testing/test_gameplay_capabilities.py \
            skeleton/app/offline_game_preview.py \
            skeleton/testing/test_offline_game_preview.py \
            skeleton/testing/test_capability_graph.py \
            skeleton/testing/test_resource_admission.py \
            skeleton/testing/test_deterministic_capabilities.py \
            scripts/training/capability_ledger.py \
            skeleton/testing/test_capability_ledger.py \
            skeleton/app/offline_cli.py \
            skeleton/app/local_ai.py \
            skeleton/app/cli.py \
            scripts/offline_kit.py \
            skeleton/testing/test_offline_library.py \
            skeleton/testing/test_offline_index_queue.py \
            skeleton/testing/test_offline_snapshot.py \
            skeleton/testing/test_offline_audit.py
      - name: Independently regenerate and audit synthetic training data
        run: |
          python scripts/training/generate_offline_foundations.py
          python scripts/training/verify_offline_foundations.py
      - name: Check sparse capability breadth without adding training data
        run: |
          python scripts/training/sparse_capability.py --profile low-memory
          python scripts/training/probe_sparse_capabilities.py --per-mode 1
      - name: Require portable C89 compilation for actual original-game acceptance
        run: |
          command -v cc
          cc --version
      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pytest-asyncio>=1.4,<2"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi>=0.141.1"
          "numpy==2.4.6"
      - name: Run credential-free local inference acceptance
        env:
          OPENAI_API_KEY: ""
          XAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: >-
          python -m pytest -q -p pytest_asyncio.plugin
          skeleton/testing/test_local_inference.py
          skeleton/testing/test_native_neural_lm.py
          skeleton/testing/test_native_runtime_local_provider.py
          skeleton/testing/test_native_transformer_local_inference.py
          skeleton/testing/test_local_model_builder.py
          skeleton/testing/test_llama_cpp_local_inference.py
          skeleton/testing/test_local_model_deployment.py
          skeleton/testing/test_app_offline_gguf.py
          skeleton/testing/test_offline_history_backup.py
          skeleton/testing/test_offline_kit.py
          skeleton/testing/test_offline_console.py
          skeleton/testing/test_offline_workspace.py
          skeleton/testing/test_offline_readiness.py
          skeleton/testing/test_offline_library.py
          skeleton/testing/test_offline_index_queue.py
          skeleton/testing/test_offline_snapshot.py
          skeleton/testing/test_offline_audit.py
          skeleton/testing/test_offline_sqlite_safety.py
          skeleton/testing/test_offline_firewall_policy.py
          skeleton/testing/test_offline_foundations.py
          skeleton/testing/test_sparse_capability.py
          skeleton/testing/test_procedural_capabilities.py
          skeleton/testing/test_capability_ledger.py
          skeleton/testing/test_resource_admission.py
          skeleton/testing/test_deterministic_capabilities.py
          skeleton/testing/test_capability_graph.py
          skeleton/testing/test_gameplay_capabilities.py
          skeleton/testing/test_cross_era_game_rights.py
          skeleton/testing/test_game_playability.py
          skeleton/testing/test_game_c89_export.py
          skeleton/testing/test_offline_game_preview.py
          tests/flgb/test_desktop_offline_ai.py
