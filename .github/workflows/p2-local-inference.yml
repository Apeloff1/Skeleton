name: P2 Local Inference

on:
  pull_request:
    paths:
      - "skeleton/ai/runtime/inference/**"
      - "skeleton/app/local_ai.py"
      - "skeleton/app/cli.py"
      - "skeleton/testing/test_app_offline_gguf.py"
      - "skeleton/testing/test_offline_history_backup.py"
      - "skeleton/app/offline_history.py"
      - "scripts/offline_kit.py"
      - "skeleton/testing/test_offline_kit.py"
      - "skeleton/app/offline_cli.py"
      - "skeleton/app/offline_workspace.py"
      - "skeleton/app/offline_readiness.py"
      - "skeleton/testing/test_offline_readiness.py"
      - "skeleton/app/offline_library.py"
      - "skeleton/testing/test_offline_library.py"
      - "skeleton/app/offline_index_queue.py"
      - "skeleton/app/offline_snapshot.py"
      - "skeleton/testing/test_offline_index_queue.py"
      - "skeleton/testing/test_offline_snapshot.py"
      - "skeleton/testing/test_offline_firewall_policy.py"
      - "scripts/windows/offline_network_policy.ps1"
      - "skeleton/testing/test_offline_workspace.py"
      - "skeleton/testing/test_offline_console.py"
      - "tests/flgb/test_desktop_offline_ai.py"
      - "skeleton/testing/test_local_inference.py"
      - "skeleton/testing/test_native_neural_lm.py"
      - "skeleton/testing/test_native_runtime_local_provider.py"
      - "skeleton/testing/test_native_transformer_local_inference.py"
      - "skeleton/provider_runtime.py"
      - "skeleton/testing/test_local_model_builder.py"
      - "skeleton/testing/test_llama_cpp_local_inference.py"
      - "skeleton/testing/test_local_model_deployment.py"
      - "scripts/qualify_local_model_runtime.py"
      - ".github/workflows/p2-local-inference.yml"
  push:
    branches:
      - main
      - feat/p2-functional-ai-closure-atomic
    paths:
      - "skeleton/ai/runtime/inference/**"
      - "skeleton/app/local_ai.py"
      - "skeleton/app/cli.py"
      - "skeleton/testing/test_app_offline_gguf.py"
      - "skeleton/testing/test_offline_history_backup.py"
      - "skeleton/app/offline_history.py"
      - "scripts/offline_kit.py"
      - "skeleton/testing/test_offline_kit.py"
      - "skeleton/app/offline_cli.py"
      - "skeleton/app/offline_workspace.py"
      - "skeleton/app/offline_readiness.py"
      - "skeleton/testing/test_offline_readiness.py"
      - "skeleton/app/offline_library.py"
      - "skeleton/testing/test_offline_library.py"
      - "skeleton/app/offline_index_queue.py"
      - "skeleton/app/offline_snapshot.py"
      - "skeleton/testing/test_offline_index_queue.py"
      - "skeleton/testing/test_offline_snapshot.py"
      - "skeleton/testing/test_offline_firewall_policy.py"
      - "scripts/windows/offline_network_policy.ps1"
      - "skeleton/testing/test_offline_workspace.py"
      - "skeleton/testing/test_offline_console.py"
      - "tests/flgb/test_desktop_offline_ai.py"
      - "skeleton/testing/test_local_inference.py"
      - "skeleton/testing/test_llama_cpp_local_inference.py"
      - "skeleton/testing/test_native_runtime_local_provider.py"
      - "skeleton/testing/test_native_transformer_local_inference.py"
      - "skeleton/provider_runtime.py"
      - "skeleton/testing/test_local_model_deployment.py"
      - "scripts/qualify_local_model_runtime.py"
      - ".github/workflows/p2-local-inference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-local-inference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pytest-asyncio>=1.4,<2"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi>=0.141.1"
          "numpy==2.4.6"
      - name: Run credential-free local inference acceptance
        env:
          OPENAI_API_KEY: ""
          XAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: >-
          python -m pytest -q -p pytest_asyncio.plugin
          skeleton/testing/test_local_inference.py
          skeleton/testing/test_native_neural_lm.py
          skeleton/testing/test_native_runtime_local_provider.py
          skeleton/testing/test_native_transformer_local_inference.py
          skeleton/testing/test_local_model_builder.py
          skeleton/testing/test_llama_cpp_local_inference.py
          skeleton/testing/test_local_model_deployment.py
          skeleton/testing/test_app_offline_gguf.py
          skeleton/testing/test_offline_history_backup.py
          skeleton/testing/test_offline_kit.py
          skeleton/testing/test_offline_console.py
          skeleton/testing/test_offline_workspace.py
          skeleton/testing/test_offline_readiness.py
          skeleton/testing/test_offline_library.py
          skeleton/testing/test_offline_index_queue.py
          skeleton/testing/test_offline_snapshot.py
          skeleton/testing/test_offline_firewall_policy.py
          tests/flgb/test_desktop_offline_ai.py
