name: VOL-073 Simulation Intelligence

on:
  pull_request:
    paths:
      - "skeleton/simulation/world.py"
      - "skeleton/simulation/authority.py"
      - "skeleton/simulation/world_model.py"
      - "skeleton/simulation/environment.py"
      - "machine/ai_simulation_contract.json"
      - "machine/ai_master_plan.json"
      - "scripts/check_vol073_simulation_intelligence.py"
      - "tests/test_vol073_simulation_intelligence.py"
      - ".github/workflows/vol073-simulation-intelligence.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/simulation/world.py"
      - "skeleton/simulation/authority.py"
      - "skeleton/simulation/world_model.py"
      - "skeleton/simulation/environment.py"
      - "machine/ai_simulation_contract.json"
      - "machine/ai_master_plan.json"
      - "scripts/check_vol073_simulation_intelligence.py"
      - "tests/test_vol073_simulation_intelligence.py"
      - ".github/workflows/vol073-simulation-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol073-simulation-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Simulation state and authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Compile bounded implementation
        run: |
          python -m py_compile skeleton/simulation/world.py
          python -m py_compile skeleton/simulation/authority.py
          python -m py_compile scripts/check_vol073_simulation_intelligence.py
      - name: Verify simulation state and authority contracts
        run: python scripts/check_vol073_simulation_intelligence.py
      - name: Run adversarial VOL-073 regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --noconftest tests/test_vol073_simulation_intelligence.py
