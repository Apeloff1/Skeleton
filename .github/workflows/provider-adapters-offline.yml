name: Provider Adapter Offline Runtime

on:
  pull_request:
    paths:
      - "skeleton/tools/integrations/adapters/**"
      - "skeleton/integrations/adapters/**"
      - ".github/workflows/provider-adapters-offline.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/tools/integrations/adapters/**"
      - "skeleton/integrations/adapters/**"
      - ".github/workflows/provider-adapters-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-adapters-offline-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  provider-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=7.0.0"

      - name: Enforce canonical capsec authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          canonical = Path("skeleton/tools/integrations/adapters")
          compatibility = Path("skeleton/integrations/adapters")
          capsec = (canonical / "capsec.py").read_text(encoding="utf-8")
          tools = (canonical / "tools.py").read_text(encoding="utf-8")
          required = (
              "from skeleton.kernel.capsec import",
              "KernelToolAuthorizer",
          )
          if not all(token in (capsec + tools) for token in required):
              raise SystemExit("tool adapter does not bind to canonical kernel capsec")
          forbidden = (
              "class CapabilityChecker",
              "class AllowAllChecker",
              "class AllowListChecker",
              "class DenyAllChecker",
              "class CapsecGate",
              "CapabilityRequest(",
          )
          hits = [token for token in forbidden if token in capsec or token in tools]
          if hits:
              raise SystemExit(
                  "parallel capability authority reintroduced: " + ", ".join(hits)
              )

          for path in sorted(compatibility.glob("*.py")):
              source = path.read_text(encoding="utf-8")
              if "from skeleton.tools.integrations.adapters" not in source:
                  raise SystemExit(f"compatibility module owns implementation: {path}")
          if list(compatibility.glob("test_*.py")):
              raise SystemExit("compatibility namespace must not own adapter tests")
          PY

      - name: Compile provider runtime
        run: >-
          python -m compileall -q
          skeleton/tools/integrations/adapters
          skeleton/integrations/adapters

      - name: Run provider adapter acceptance
        run: >-
          python -m pytest -q --noconftest
          skeleton/tools/integrations/adapters/test_types.py
          skeleton/tools/integrations/adapters/test_errors.py
          skeleton/tools/integrations/adapters/test_deadline.py
          skeleton/tools/integrations/adapters/test_retry.py
          skeleton/tools/integrations/adapters/test_circuit.py
          skeleton/tools/integrations/adapters/test_provider_registry.py
          skeleton/tools/integrations/adapters/test_offline.py
          skeleton/tools/integrations/adapters/test_client.py
          skeleton/tools/integrations/adapters/test_schema.py
          skeleton/tools/integrations/adapters/test_capsec_kernel_bridge.py
          skeleton/tools/integrations/adapters/test_compat_facade.py
          skeleton/tools/integrations/adapters/test_tools_kernel_capsec.py
          skeleton/tools/integrations/adapters/test_tool_loop.py
