name: AI Game Builder 500 Levels

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_game_builder_500_levels.json"
      - "machine/ai_game_builder_dual_rival_forge.json"
      - "machine/ai_game_builder_levels_*.json"
      - "docs/architecture/AI_GAME_BUILDER_500_LEVELS.md"
      - "docs/plan/MASTER_PLAN.md"
      - "machine/ai_master_plan.json"
      - "scripts/check_ai_game_builder_500_levels.py"
      - "tests/test_ai_game_builder_500_levels.py"
      - ".github/workflows/ai-game-builder-500-levels.yml"
  push:
    branches: [main]
    paths:
      - "machine/ai_game_builder_500_levels.json"
      - "machine/ai_game_builder_dual_rival_forge.json"
      - "machine/ai_game_builder_levels_*.json"
      - "docs/architecture/AI_GAME_BUILDER_500_LEVELS.md"
      - "docs/plan/MASTER_PLAN.md"
      - "machine/ai_master_plan.json"
      - "scripts/check_ai_game_builder_500_levels.py"
      - "tests/test_ai_game_builder_500_levels.py"
      - ".github/workflows/ai-game-builder-500-levels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-game-builder-500-levels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate 500-level dual-rival game builder
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check --no-input "pytest>=8,<9"

      - name: Compile validator and tests
        run: >-
          python -m py_compile
          scripts/check_ai_game_builder_500_levels.py
          scripts/check_ai_master_plan.py
          tests/test_ai_game_builder_500_levels.py
          skeleton/testing/test_ai_master_plan.py

      - name: Validate 500-level authority
        run: python scripts/check_ai_game_builder_500_levels.py --json

      - name: Validate canonical masterplan binding
        run: python scripts/check_ai_master_plan.py

      - name: Run focused regression suite
        run: >-
          python -m pytest -q --noconftest
          tests/test_ai_game_builder_500_levels.py
          skeleton/testing/test_ai_master_plan.py

      - name: Validate masterplan JSON
        run: python -m json.tool machine/ai_master_plan.json >/dev/null

      - name: Confirm exact-head identity and topology
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("machine/ai_game_builder_500_levels.json").read_text())
          rows=[]
          for p in m["shards"]:
              rows += json.loads(Path(p).read_text())["levels"]
          assert len(rows) == 500
          assert rows[0]["id"] == "GBL-001"
          assert rows[-1]["id"] == "GBL-500"
          assert all(row["signed"] is False for row in rows)
          print("ai-game-builder", "families=50", "levels=500", "head=", __import__("os").environ["EXPECTED_SHA"])
          PY
