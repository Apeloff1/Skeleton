name: Dependabot Auto-Merge

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: dependabot-automerge-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  automerge:
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate and merge trusted Dependabot updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPENDABOT_REQUIRED_WORKFLOWS: >-
            CI/CD,Backend Quality,Merge Readiness,Secret scanning,Malware Gate,
            Repository Hygiene Gate,Artifact Policy,Provenance Policy
        shell: bash
        run: |
          set -euo pipefail
          python -m skeleton.automation.dependabot_merge_policy \
            --repo "$REPO" \
            --base "$DEFAULT_BRANCH"
