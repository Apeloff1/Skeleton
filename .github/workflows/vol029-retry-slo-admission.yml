name: VOL-029 Retry and SLO Admission Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/reliability/retry_admission.py"
      - "skeleton/ai/runtime/reliability/retry_admission.py"
      - "skeleton/distributed/mesh/capacity_qualification.py"
      - "skeleton/ai/runtime/distributed/mesh/capacity_qualification.py"
      - "skeleton/testing/test_vol029_retry_admission.py"
      - "skeleton/testing/test_capacity_qualification.py"
      - ".github/workflows/vol029-retry-slo-admission.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/reliability/retry_admission.py"
      - "skeleton/ai/runtime/reliability/retry_admission.py"
      - "skeleton/distributed/mesh/capacity_qualification.py"
      - "skeleton/ai/runtime/distributed/mesh/capacity_qualification.py"
      - "skeleton/testing/test_vol029_retry_admission.py"
      - "skeleton/testing/test_capacity_qualification.py"
      - ".github/workflows/vol029-retry-slo-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol029-retry-slo-admission-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retry-slo-admission:
    name: Retry budget and SLO admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Compile retry admission boundaries
        run: >-
          python -m py_compile
          skeleton/reliability/retry_admission.py
          skeleton/ai/runtime/reliability/retry_admission.py
          skeleton/distributed/mesh/capacity_qualification.py
          skeleton/ai/runtime/distributed/mesh/capacity_qualification.py
          skeleton/testing/test_vol029_retry_admission.py

      - name: Run focused reliability regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_vol029_retry_admission.py
          skeleton/testing/test_capacity_qualification.py

      - name: Assert exact mirror and fail-closed controls
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(".")
          source = root / "skeleton/reliability/retry_admission.py"
          mirror = root / "skeleton/ai/runtime/reliability/retry_admission.py"
          if source.read_bytes() != mirror.read_bytes():
              raise SystemExit("VOL-029 reliability mirror drift")

          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          text = source.read_text(encoding="utf-8")
          required = (
              '"prior-outcome-unknown-reconciliation-required"',
              '"retry-token-budget-exhausted"',
              '"retry-fraction-budget-exceeded"',
              '"error-budget-admission-closed"',
              '"error-budget-retry-closed"',
              '"error-budget-burn-rate-exceeded"',
              '"capacity-degraded-retry-denied"',
              '"capacity-saturated-retry-denied"',
              '"external-effect-retry-requires-idempotency"',
              'authority_scope: str = "reliability-admission-only"',
              "production_authority: bool = False",
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"VOL-029 fail-closed token missing: {token}")

          forbidden = ("subprocess.", "os.system(", "requests.", "httpx.")
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"VOL-029 admission plane gained execution surface: {token}")

          expected = os.environ["EXPECTED_SHA"].strip()
          if not expected:
              raise SystemExit("exact head SHA missing")
          print("VOL-029 exact head:", expected, "module_sha256=", digest)
          PY
