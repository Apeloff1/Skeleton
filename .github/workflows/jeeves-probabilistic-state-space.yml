name: Jeeves Probabilistic State Space

on:
  pull_request:
    branches: [main, jeeves/historical-mode-lab]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skeleton/jeeves/probabilistic_state_space.py'
      - 'skeleton/jeeves/bayesian_regime_shift.py'
      - 'skeleton/jeeves/gaussian_process.py'
      - 'skeleton/jeeves/__init__.py'
      - 'skeleton/testing/test_jeeves_probabilistic_state_space.py'
      - 'skeleton/testing/test_jeeves_bayesian_regime_shift.py'
      - 'skeleton/testing/test_jeeves_gaussian_process.py'
      - '.github/workflows/jeeves-probabilistic-state-space.yml'
  push:
    branches: [main]
    paths:
      - 'skeleton/jeeves/probabilistic_state_space.py'
      - 'skeleton/jeeves/bayesian_regime_shift.py'
      - 'skeleton/jeeves/gaussian_process.py'
      - 'skeleton/jeeves/__init__.py'
      - 'skeleton/testing/test_jeeves_probabilistic_state_space.py'
      - 'skeleton/testing/test_jeeves_bayesian_regime_shift.py'
      - 'skeleton/testing/test_jeeves_gaussian_process.py'
      - '.github/workflows/jeeves-probabilistic-state-space.yml'

concurrency:
  group: jeeves-probabilistic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11.16'
  PYTHONPATH: '.'

jobs:
  focused-regression:
    name: Probabilistic forecasting regression
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Install focused runtime
        run: >-
          python -m pip install
          "pytest>=8,<9"
          "fastapi>=0.110,<1"
          "pydantic>=2.5,<3"
          "pydantic-settings>=2.1,<3"

      - name: Compile probabilistic surfaces
        run: |
          python -m compileall -q \
            skeleton/jeeves/probabilistic_state_space.py \
            skeleton/jeeves/bayesian_regime_shift.py \
            skeleton/jeeves/gaussian_process.py

      - name: Run probabilistic forecasting regressions
        run: |
          python -m pytest -q \
            skeleton/testing/test_jeeves_probabilistic_state_space.py \
            skeleton/testing/test_jeeves_bayesian_regime_shift.py \
            skeleton/testing/test_jeeves_gaussian_process.py
