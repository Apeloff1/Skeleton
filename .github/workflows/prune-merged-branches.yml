name: Prune merged branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prune branches fully contained in main
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"

          mapfile -t OPEN_PR_HEADS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[].head.ref' | sort -u
          )

          is_open_pr_head() {
            local candidate="$1"
            local head
            for head in "${OPEN_PR_HEADS[@]}"; do
              if [[ "$candidate" == "$head" ]]; then
                return 0
              fi
            done
            return 1
          }

          deleted=0
          skipped_open=0
          skipped_preserved=0
          skipped_divergent=0

          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue

            case "$branch" in
              HEAD|"$DEFAULT_BRANCH"|frontier/max-workload*|release/reproducible-provenance-126-20260915)
                echo "preserve: $branch"
                skipped_preserved=$((skipped_preserved + 1))
                continue
                ;;
            esac

            if is_open_pr_head "$branch"; then
              echo "open-pr: $branch"
              skipped_open=$((skipped_open + 1))
              continue
            fi

            if git merge-base --is-ancestor "refs/remotes/origin/$branch" "refs/remotes/origin/$DEFAULT_BRANCH"; then
              echo "delete merged: $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "keep divergent: $branch"
              skipped_divergent=$((skipped_divergent + 1))
            fi
          done < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort
          )

          echo "deleted=$deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "open_pr_heads_preserved=$skipped_open" >> "$GITHUB_STEP_SUMMARY"
          echo "explicitly_preserved=$skipped_preserved" >> "$GITHUB_STEP_SUMMARY"
          echo "divergent_preserved=$skipped_divergent" >> "$GITHUB_STEP_SUMMARY"
