name: Prune merged branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches already contained in main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: main
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPOSITORY"]
          default = os.environ.get("DEFAULT_BRANCH", "main")
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "skeleton-branch-pruner",
          }

          def call(method, path):
              req = urllib.request.Request(api + path, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code} {detail}") from exc

          def paged(path):
              page = 1
              while True:
                  sep = "&" if "?" in path else "?"
                  batch = call("GET", f"{path}{sep}per_page=100&page={page}")
                  if not batch:
                      return
                  for item in batch:
                      yield item
                  if len(batch) < 100:
                      return
                  page += 1

          open_heads = set()
          for pr in paged(f"/repos/{repo}/pulls?state=open"):
              head = pr.get("head") or {}
              head_repo = head.get("repo") or {}
              if head_repo.get("full_name") == repo and head.get("ref"):
                  open_heads.add(head["ref"])

          branches = list(paged(f"/repos/{repo}/branches"))
          deleted = []
          kept = []

          for branch in branches:
              name = branch["name"]
              if name == default:
                  kept.append((name, "default"))
                  continue
              if branch.get("protected"):
                  kept.append((name, "protected"))
                  continue
              if name in open_heads:
                  kept.append((name, "open-pr"))
                  continue

              base_q = urllib.parse.quote(default, safe="")
              head_q = urllib.parse.quote(name, safe="")
              comparison = call("GET", f"/repos/{repo}/compare/{base_q}...{head_q}")
              ahead = int(comparison.get("ahead_by", 0))

              if ahead == 0:
                  ref_q = urllib.parse.quote(name, safe="")
                  call("DELETE", f"/repos/{repo}/git/refs/heads/{ref_q}")
                  deleted.append(name)
                  print(f"deleted: {name}")
              else:
                  kept.append((name, f"{ahead}-commit(s)-ahead"))

          print(f"\nDeleted {len(deleted)} merged branch(es).")
          print(f"Kept {len(kept)} branch(es) with a reason to remain.")
          for name, reason in kept:
              print(f"kept: {name} [{reason}]")
          PY
