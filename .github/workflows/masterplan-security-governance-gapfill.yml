name: Masterplan Security Governance Gapfill

on:
  pull_request:
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_security_governance_gapfill_candidate.json"
      - "skeleton/security/**"
      - "skeleton/ai/runtime/security/**"
      - "skeleton/supply_chain/**"
      - "skeleton/ai/runtime/extensions/supply_chain/**"
      - "skeleton/testing/test_policy_simulation.py"
      - "skeleton/testing/test_threat_model.py"
      - "skeleton/testing/test_security_boundaries.py"
      - "skeleton/testing/test_egress_control.py"
      - "skeleton/testing/test_secret_security.py"
      - "skeleton/testing/test_key_management.py"
      - "skeleton/testing/test_tenant_isolation_deep.py"
      - "skeleton/testing/test_privacy_engine.py"
      - "skeleton/testing/test_data_deletion.py"
      - "skeleton/testing/test_sbom.py"
      - "scripts/check_ai_security_governance_gapfill.py"
      - "tests/test_ai_security_governance_gapfill.py"
      - "docs/plan/SECURITY_GOVERNANCE_GAPFILL_166_178.md"
      - ".github/workflows/masterplan-security-governance-gapfill.yml"
  push:
    branches: [main]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_security_governance_gapfill_candidate.json"
      - "skeleton/security/**"
      - "skeleton/ai/runtime/security/**"
      - "skeleton/supply_chain/**"
      - "skeleton/ai/runtime/extensions/supply_chain/**"
      - "scripts/check_ai_security_governance_gapfill.py"
      - "tests/test_ai_security_governance_gapfill.py"
      - ".github/workflows/masterplan-security-governance-gapfill.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-governance-gapfill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"

      - name: Compile security and supply-chain surfaces
        run: >-
          python -m compileall -q
          skeleton/security
          skeleton/ai/runtime/security
          skeleton/supply_chain
          skeleton/ai/runtime/extensions/supply_chain
          scripts/check_ai_security_governance_gapfill.py

      - name: Validate masterplan and exact-head candidate
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python scripts/check_ai_master_plan.py
          python scripts/check_ai_security_governance_gapfill.py --head "$HEAD_SHA" --json

      - name: Validate candidate contract tests
        run: python -m pytest -q --noconftest tests/test_ai_security_governance_gapfill.py

      - name: Execute exact primary regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_policy_simulation.py
          skeleton/testing/test_threat_model.py
          skeleton/testing/test_security_boundaries.py
          skeleton/testing/test_egress_control.py
          skeleton/testing/test_secret_security.py
          skeleton/testing/test_key_management.py
          skeleton/testing/test_tenant_isolation_deep.py
          skeleton/testing/test_privacy_engine.py
          skeleton/testing/test_data_deletion.py
          skeleton/testing/test_sbom.py

      - name: Execute cross-plane security regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_outbound_url_resolution_security.py
          skeleton/testing/test_security_outbound_http.py
          skeleton/testing/test_secret_lifecycle_taint.py
          skeleton/testing/test_deletion_propagation.py
          skeleton/testing/test_privacy_deletion_authority.py
