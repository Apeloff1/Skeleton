name: AI Chat Model Routing Closure

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/core/model_router.py"
      - "backend/tests/test_model_router.py"
      - "skeleton/ai/compat/backend_core/model_router.py"
      - "machine/ai_chat_model_routing.json"
      - "scripts/check_ai_chat_model_routing.py"
      - "scripts/verify_ai_chat_model_routing.py"
      - "docs/plan/AI_CHAT_MASTERPLAN_2026-10-06.md"
      - ".github/workflows/ai-chat-model-routing-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-chat-model-routing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  routing:
    name: AI chat model routing contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate routing structure
        run: python scripts/check_ai_chat_model_routing.py

      - name: Compile routing surfaces
        run: >-
          python -m compileall -q
          backend/core/model_router.py
          skeleton/ai/compat/backend_core/model_router.py

      - name: Run routing regressions
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_model_router.py

      - name: Emit exact-head routing evidence
        env:
          ROUTING_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/check_ai_chat_model_routing.py
          --head-sha "$ROUTING_HEAD_SHA"
          --evidence-out .ai-chat-model-routing.json
          --print-evidence

      - name: Independently verify routing evidence
        env:
          ROUTING_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_ai_chat_model_routing.py
          .ai-chat-model-routing.json
          --head-sha "$ROUTING_HEAD_SHA"
          --evidence-out .ai-chat-model-routing-independent.json
          --print-evidence

      - name: Assert exact-head closure
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          structural = json.loads(
              Path(".ai-chat-model-routing.json").read_text(encoding="utf-8")
          )
          independent = json.loads(
              Path(".ai-chat-model-routing-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if structural.get("head_sha") != expected:
              raise SystemExit("routing structural receipt is not exact-head")
          if structural.get("valid") is not True or structural.get("errors"):
              raise SystemExit("routing structural validation failed")
          if len(structural.get("digests") or {}) != 7:
              raise SystemExit("routing structural digest coverage incomplete")
          if independent.get("expected_head") != expected:
              raise SystemExit("routing independent receipt is not exact-head")
          if independent.get("valid") is not True or independent.get("errors"):
              raise SystemExit("routing independent verification failed")
          if (
              independent.get("structural_evidence_digest")
              != independent.get("recomputed_structural_evidence_digest")
          ):
              raise SystemExit("routing evidence was not independently rehashed")
          print("AI chat model routing exact-head closure verified:", expected)
          PY
