name: P1 Evidence Identity Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/contracts/canonical.py"
      - "skeleton/contracts/evidence_ingestion.py"
      - "skeleton/contracts/promotion_evidence.py"
      - "skeleton/contracts/__init__.py"
      - "scripts/emit_p1_promotion_evidence.py"
      - "scripts/ai_accountability.py"
      - "scripts/check_ai_build_accountability.py"
      - "machine/ai_build_accountability.json"
      - "machine/ai_p1_task_backlog.json"
      - "docs/plan/BUILD_ACCOUNTABILITY_LEDGER.md"
      - "skeleton/testing/test_evidence_ingestion.py"
      - "skeleton/testing/test_promotion_evidence.py"
      - "tests/test_p1_promotion_evidence_emitter.py"
      - "tests/test_p1_accountability_materialization.py"
      - ".github/workflows/p1-evidence-identity.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/contracts/canonical.py"
      - "skeleton/contracts/evidence_ingestion.py"
      - "skeleton/contracts/promotion_evidence.py"
      - "skeleton/contracts/__init__.py"
      - "scripts/emit_p1_promotion_evidence.py"
      - "scripts/ai_accountability.py"
      - "scripts/check_ai_build_accountability.py"
      - "machine/ai_build_accountability.json"
      - "machine/ai_p1_task_backlog.json"
      - "docs/plan/BUILD_ACCOUNTABILITY_LEDGER.md"
      - "skeleton/testing/test_evidence_ingestion.py"
      - "skeleton/testing/test_promotion_evidence.py"
      - "tests/test_p1_promotion_evidence_emitter.py"
      - "tests/test_p1_accountability_materialization.py"
      - "machine/ai_master_plan.json"
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_p1_execution_map.json"
      - "skeleton/contracts/maturity_reconciliation.py"
      - "skeleton/contracts/maturity_reconciliation.py"
      - "skeleton/ai/runtime/contracts/maturity_reconciliation.py"
      - "skeleton/ai/runtime/contracts/maturity_reconciliation.py"
      - "scripts/reconcile_p1_maturity.py"
      - "scripts/reconcile_p1_maturity.py"
      - "skeleton/testing/test_maturity_reconciliation.py"
      - "skeleton/testing/test_maturity_reconciliation.py"
      - "tests/test_p1_maturity_reconciliation.py"
      - "tests/test_p1_maturity_reconciliation.py"
      - ".github/workflows/p1-evidence-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-evidence-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical P1 evidence identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Run evidence identity and accountability regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_promotion_evidence.py
          skeleton/testing/test_evidence_ingestion.py
          tests/test_p1_promotion_evidence_emitter.py
          tests/test_p1_accountability_materialization.py

      - name: Validate canonical accountability ledger
        run: python scripts/check_ai_build_accountability.py

      - name: Validate P1 execution map remains coherent
        run: python scripts/check_ai_p1_execution_map.py --print-summary

      - name: Validate P1 maturity reconciliation
        run: |
          set -euo pipefail
          python -m pytest -q --noconftest \
            skeleton/testing/test_maturity_reconciliation.py \
            tests/test_p1_maturity_reconciliation.py
          python scripts/reconcile_p1_maturity.py \
            --volume VOL-000 \
            --volume VOL-056 \
            --volume VOL-080 \
            --out .p1-maturity-premerge.json


      - name: Emit exact-head evidence receipt
        run: |
          set -euo pipefail
          mkdir -p .p1-evidence
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          files = [
              "skeleton/contracts/promotion_evidence.py",
              "skeleton/contracts/canonical.py",
              "skeleton/contracts/evidence_ingestion.py",
              "tests/test_p1_promotion_evidence_emitter.py",
              "tests/test_p1_accountability_materialization.py",
          ]
          refs = []
          for name in files:
              data = Path(name).read_bytes()
              refs.append(
                  {
                      "source": name,
                      "digest": hashlib.sha256(data).hexdigest(),
                      "category": "repository_state",
                  }
              )
          Path(".p1-evidence/refs.json").write_text(
              json.dumps(refs, sort_keys=True),
              encoding="utf-8",
          )

          def digest(names):
              h = hashlib.sha256()
              for name in names:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-evidence/config.digest").write_text(
              digest(["machine/ai_p1_task_backlog.json"]),
              encoding="utf-8",
          )
          Path(".p1-evidence/environment.digest").write_text(
              hashlib.sha256(b"ubuntu-24.04|python-3.11.16").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-evidence/verifier.digest").write_text(
              digest(
                  [
                      "scripts/emit_p1_promotion_evidence.py",
                      "scripts/check_ai_build_accountability.py",
                  ]
              ),
              encoding="utf-8",
          )
          Path(".p1-evidence/tests.digest").write_text(
              digest(
                  [
                      "skeleton/testing/test_promotion_evidence.py",
                      "skeleton/testing/test_evidence_ingestion.py",
                      "tests/test_p1_promotion_evidence_emitter.py",
                      "tests/test_p1_accountability_materialization.py",
                  ]
              ),
              encoding="utf-8",
          )
          PY
          python scripts/emit_p1_promotion_evidence.py             --repository Apeloff1/Skeleton             --commit-sha "$EXPECTED_SHA"             --expected-head "$EXPECTED_SHA"             --task-id P1-EVID-01             --accountability-id ACC-P1-EVID-01             --configuration-digest "$(cat .p1-evidence/config.digest)"             --environment-digest "$(cat .p1-evidence/environment.digest)"             --verifier-id github-actions:p1-evidence-identity             --verifier-digest "$(cat .p1-evidence/verifier.digest)"             --test-manifest-digest "$(cat .p1-evidence/tests.digest)"             --run-id "$RUN_IDENTITY"             --run-attempt "$RUN_ATTEMPT"             --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --evidence-file .p1-evidence/refs.json             --out .p1-evidence/receipt.json             > .p1-evidence/stdout.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-evidence/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("receipt does not bind exact head")
          for field in (
              "subject_digest",
              "evidence_digest",
              "receipt_digest",
          ):
              value = receipt.get(field, "")
              if len(value) != 64:
                  raise SystemExit(f"invalid {field}")
          print(
              "P1 evidence receipt OK:",
              receipt["subject_digest"],
              receipt["receipt_digest"],
          )
          PY
