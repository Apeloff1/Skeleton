name: P1 Migration Rollback Compatibility Gate

on:
  push:
    branches:
      - main
    paths:
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/release/migration.py"
      - "skeleton/release/lifecycle.py"
      - "skeleton/release/qualification.py"
      - "skeleton/release/__init__.py"
      - "skeleton/contracts/migration_tests.py"
      - "skeleton/config/**"
      - "skeleton/testing/test_migration_rollback_compatibility.py"
      - "skeleton/testing/test_installer_lifecycle.py"
      - "skeleton/testing/test_release_qualification.py"
      - ".github/workflows/p1-migration-rollback-compatibility.yml"
  pull_request:
    branches:
      - main
      - p1/rel-02-installer-lifecycle-20260928
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/release/migration.py"
      - "skeleton/release/lifecycle.py"
      - "skeleton/release/qualification.py"
      - "skeleton/release/__init__.py"
      - "skeleton/contracts/migration_tests.py"
      - "skeleton/config/**"
      - "skeleton/testing/test_migration_rollback_compatibility.py"
      - "skeleton/testing/test_installer_lifecycle.py"
      - "skeleton/testing/test_release_qualification.py"
      - ".github/workflows/p1-migration-rollback-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-migration-rollback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate migration and rollback compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile REL-01 through REL-03 contracts
        run: >-
          python -m compileall -q
          skeleton/release/qualification.py
          skeleton/release/lifecycle.py
          skeleton/release/migration.py
          skeleton/contracts/migration_tests.py
          skeleton/config

      - name: Run release migration regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_release_qualification.py
          skeleton/testing/test_installer_lifecycle.py
          skeleton/testing/test_migration_rollback_compatibility.py

      - name: Run canonical migration replay guard
        run: |
          python - <<'PY'
          from skeleton.contracts.migration_tests import validate_migration_chain

          task_id = validate_migration_chain()
          if not task_id:
              raise SystemExit("canonical migration chain returned empty identity")
          print("canonical migration replay guard OK", task_id)
          PY

      - name: Build accepted exact-head REL-03 migration evidence
        run: |
          set -euo pipefail
          mkdir -p .p1-rel-03
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from skeleton.contracts.canonical import EvidenceRef
          from skeleton.release.lifecycle import (
              InstallerLifecycleQualificationDecision,
          )
          from skeleton.release.migration import (
              MigrationCompatibilityReceipt,
              MigrationKind,
              MigrationPlan,
              MigrationSpec,
              qualify_migration_compatibility,
          )

          def sha(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          commit = os.environ["EXPECTED_SHA"]
          lifecycle = InstallerLifecycleQualificationDecision(
              accepted=True,
              reasons=(),
              source_commit=commit,
              release_qualification_digest=sha(b"rel-01-qualified"),
              installer_metadata_digest=sha(b"installer-metadata"),
              target_version="16.0.0",
              ownership_policy_digest=sha(b"ownership-policy"),
              retention_policy_digest=sha(b"retention-policy"),
              scenario_receipt_digests=(sha(b"rel-02-scenarios"),),
          )
          specs = tuple(
              MigrationSpec(
                  migration_id=migration_id,
                  kind=kind,
                  from_version="15.0.0",
                  to_version="16.0.0",
                  forward_migration_digest=sha(
                      f"{migration_id}:forward".encode()
                  ),
                  rollback_migration_digest=sha(
                      f"{migration_id}:rollback".encode()
                  ),
                  backward_reader_digest=sha(
                      f"{migration_id}:reader".encode()
                  ),
                  declared_reader_versions=("15.0.0", "16.0.0"),
              )
              for migration_id, kind in (
                  ("schema-main", MigrationKind.SCHEMA),
                  ("config-main", MigrationKind.CONFIG),
                  ("state-main", MigrationKind.STATE),
              )
          )
          window = sha(b"rollback-window:v15-v16")
          plan = MigrationPlan(
              plan_id="release-migrations-v16",
              source_commit=commit,
              lifecycle_qualification_digest=lifecycle.decision_digest,
              from_version="15.0.0",
              to_version="16.0.0",
              rollback_window_digest=window,
              migrations=specs,
          )

          receipts = []
          for spec in specs:
              pre = sha(f"{spec.migration_id}:pre".encode())
              upgraded = sha(f"{spec.migration_id}:upgraded".encode())
              receipts.append(
                  MigrationCompatibilityReceipt(
                      migration_id=spec.migration_id,
                      migration_digest=spec.digest,
                      source_commit=commit,
                      lifecycle_qualification_digest=lifecycle.decision_digest,
                      rollback_window_digest=window,
                      from_version=spec.from_version,
                      to_version=spec.to_version,
                      pre_migration_snapshot_digest=pre,
                      upgraded_snapshot_digest=upgraded,
                      rollback_snapshot_digest=pre,
                      backward_read_source_digest=upgraded,
                      forward_migration_digest=spec.forward_migration_digest,
                      rollback_migration_digest=spec.rollback_migration_digest,
                      backward_reader_digest=spec.backward_reader_digest,
                      reader_version=spec.from_version,
                      verifier_id=f"github-actions:{spec.migration_id}",
                      verifier_digest=sha(
                          f"{spec.migration_id}:verifier".encode()
                      ),
                      test_manifest_digest=sha(
                          f"{spec.migration_id}:tests".encode()
                      ),
                      evidence_refs=(
                          EvidenceRef(
                              source=f"ci://rel-03/{spec.migration_id}",
                              digest=sha(
                                  f"{spec.migration_id}:evidence".encode()
                              ),
                              category="migration_compatibility",
                          ),
                      ),
                      forward_applied=True,
                      rollback_succeeded=True,
                      backward_read_succeeded=True,
                      independent=True,
                      production_mutation_count=0,
                  )
              )

          decision = qualify_migration_compatibility(
              lifecycle_qualification=lifecycle,
              plan=plan,
              receipts=tuple(receipts),
          )
          if not decision.accepted:
              raise SystemExit(
                  f"REL-03 migration compatibility rejected: {decision.reasons}"
              )
          evidence = decision.accepted_evidence_ref()
          Path(".p1-rel-03/decision.json").write_text(
              json.dumps(decision.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-rel-03/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          Path(".p1-rel-03/config.digest").write_text(
              sha(b"p1-rel-03-migration-rollback-v1"),
              encoding="utf-8",
          )
          Path(".p1-rel-03/environment.digest").write_text(
              sha(b"ubuntu-24.04|python-3.11.16|rel-03"),
              encoding="utf-8",
          )
          Path(".p1-rel-03/verifier.digest").write_text(
              sha(
                  Path("skeleton/release/migration.py").read_bytes()
                  + Path(".github/workflows/p1-migration-rollback-compatibility.yml").read_bytes()
              ),
              encoding="utf-8",
          )
          Path(".p1-rel-03/tests.digest").write_text(
              sha(
                  Path("skeleton/testing/test_migration_rollback_compatibility.py").read_bytes()
                  + Path("skeleton/testing/test_installer_lifecycle.py").read_bytes()
              ),
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head REL-03 evidence receipt
        run: |
          set -euo pipefail
          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-REL-03 \
            --accountability-id ACC-P1-REL-03 \
            --configuration-digest "$(cat .p1-rel-03/config.digest)" \
            --environment-digest "$(cat .p1-rel-03/environment.digest)" \
            --verifier-id github-actions:p1-migration-rollback \
            --verifier-digest "$(cat .p1-rel-03/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-rel-03/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-rel-03/refs.json \
            --out .p1-rel-03/receipt.json \
            > .p1-rel-03/stdout.json

      - name: Assert exact-head REL-03 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-rel-03/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("REL-03 receipt head mismatch")
          if receipt["task_id"] != "P1-REL-03":
              raise SystemExit("REL-03 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-REL-03":
              raise SystemExit("REL-03 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("REL-03 exact-head receipt OK", receipt["receipt_digest"])
          PY
