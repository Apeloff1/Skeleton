name: Disaster Recovery Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "machine/state_topology.json"
      - "machine/state_backup_policy.json"
      - "machine/disaster_recovery_contract.json"
      - "skeleton/reliability/disaster_recovery_contract.py"
      - "skeleton/ai/runtime/reliability/disaster_recovery_contract.py"
      - "skeleton/testing/test_disaster_recovery_contract.py"
      - "scripts/verify_disaster_recovery_contract.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/disaster-recovery-contract.yml"
  push:
    branches:
      - main
    paths:
      - "machine/state_topology.json"
      - "machine/state_backup_policy.json"
      - "machine/disaster_recovery_contract.json"
      - "skeleton/reliability/disaster_recovery_contract.py"
      - "skeleton/ai/runtime/reliability/disaster_recovery_contract.py"
      - "skeleton/testing/test_disaster_recovery_contract.py"
      - "scripts/verify_disaster_recovery_contract.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/disaster-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disaster-recovery-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  disaster-recovery-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Compile G012 contract
        run: >-
          python -m compileall -q
          skeleton/reliability/disaster_recovery_contract.py
          skeleton/ai/runtime/reliability/disaster_recovery_contract.py
          scripts/verify_disaster_recovery_contract.py
          skeleton/testing/test_disaster_recovery_contract.py
      - name: Verify topology-wide recovery coverage
        run: python scripts/verify_disaster_recovery_contract.py --json
      - name: Run G012 regressions
        run: python -m unittest -q skeleton.testing.test_disaster_recovery_contract
      - name: Re-run existing backup and DR qualification regressions
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "pydantic>=2,<3"
          && python -m pytest -q --noconftest
          skeleton/testing/test_backup_restore_qualification.py
          skeleton/testing/test_disaster_recovery_qualification.py
      - name: Verify governed AI file-tree parity
        run: python scripts/check_ai_file_tree.py
      - name: Verify hostile-gap disposition
        run: python scripts/verify_ai_hostile_gap_disposition.py
