name: AI Chat Tool Recovery Closure

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/assistant/turn_runtime.py"
      - "skeleton/ai/assistant/tool_recovery.py"
      - "skeleton/ai/assistant/__init__.py"
      - "skeleton/skills/tool_receipt_store.py"
      - "skeleton/ai/runtime/skills/tool_receipt_store.py"
      - "skeleton/testing/test_ai_chat_tool_recovery.py"
      - "skeleton/testing/test_tool_receipt_store.py"
      - "machine/ai_chat_tool_recovery.json"
      - "scripts/check_ai_chat_tool_recovery.py"
      - "scripts/verify_ai_chat_tool_recovery.py"
      - "docs/plan/AI_CHAT_MASTERPLAN_2026-10-06.md"
      - ".github/workflows/ai-chat-tool-recovery-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-chat-tool-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: AI chat tool recovery contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate tool recovery structure
        run: python scripts/check_ai_chat_tool_recovery.py

      - name: Compile tool recovery surfaces
        run: >-
          python -m compileall -q
          skeleton/ai/assistant/turn_runtime.py
          skeleton/ai/assistant/tool_recovery.py
          skeleton/skills/tool_receipt_store.py
          skeleton/ai/runtime/skills/tool_receipt_store.py

      - name: Run tool recovery regressions
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin --import-mode=importlib
          skeleton/testing/test_ai_chat_tool_recovery.py
          skeleton/testing/test_tool_receipt_store.py
          skeleton/testing/test_ai_chat_turn_runtime.py

      - name: Emit exact-head tool recovery evidence
        env:
          RECOVERY_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/check_ai_chat_tool_recovery.py
          --head-sha "$RECOVERY_HEAD_SHA"
          --evidence-out .ai-chat-tool-recovery.json
          --print-evidence

      - name: Independently verify tool recovery evidence
        env:
          RECOVERY_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_ai_chat_tool_recovery.py
          .ai-chat-tool-recovery.json
          --head-sha "$RECOVERY_HEAD_SHA"
          --evidence-out .ai-chat-tool-recovery-independent.json
          --print-evidence

      - name: Assert exact-head closure
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          structural = json.loads(
              Path(".ai-chat-tool-recovery.json").read_text(encoding="utf-8")
          )
          independent = json.loads(
              Path(".ai-chat-tool-recovery-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if structural.get("head_sha") != expected:
              raise SystemExit("tool recovery structural receipt is not exact-head")
          if structural.get("valid") is not True or structural.get("errors"):
              raise SystemExit("tool recovery structural validation failed")
          if len(structural.get("digests") or {}) != 10:
              raise SystemExit("tool recovery digest coverage incomplete")
          if independent.get("expected_head") != expected:
              raise SystemExit("tool recovery independent receipt is not exact-head")
          if independent.get("valid") is not True or independent.get("errors"):
              raise SystemExit("tool recovery independent verification failed")
          if (
              independent.get("structural_evidence_digest")
              != independent.get("recomputed_structural_evidence_digest")
          ):
              raise SystemExit("tool recovery evidence was not independently rehashed")
          print("AI chat tool recovery exact-head closure verified:", expected)
          PY
