name: Emerald V7 orbit02 original-donor source qualification
on:
  push:
    branches:
      - 'feat/emerald-v7-orbit02-*'
    paths:
      - 'scripts/emerald_v7_*.py'
      - 'scripts/test_emerald_v7_*.py'
      - 'scripts/verify_emerald_v7_*.py'
      - 'scripts/check_emerald_v7_*.py'
      - 'assets/emerald/evolution-v7/**'
      - '.github/workflows/emerald-v7-orbit02.yml'
  pull_request:
    paths:
      - 'scripts/emerald_v7_*.py'
      - 'scripts/test_emerald_v7_*.py'
      - 'scripts/verify_emerald_v7_*.py'
      - 'scripts/check_emerald_v7_*.py'
      - 'assets/emerald/evolution-v7/**'
      - '.github/workflows/emerald-v7-orbit02.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact commit SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned geometry-source dependencies
        run: python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.16.3 numba==0.62.1
      - name: Check exporter, independent verifier and contact evidence code
        run: |
          python -m py_compile scripts/emerald_v7_orbit02.py scripts/verify_emerald_v7_orbit02.py
          python -m py_compile scripts/emerald_v7_crossfade_screen.py scripts/check_emerald_v7_evidence.py
          python -m py_compile scripts/test_emerald_v7_orbit02.py scripts/test_emerald_v7_evidence.py
      - name: Run source rejection and evidence integrity suites
        run: |
          python scripts/test_emerald_v7_orbit02.py
          python scripts/test_emerald_v7_evidence.py
          python scripts/check_emerald_v7_evidence.py
      - name: Qualification limits
        run: echo 'Synthetic/source ledger only; original V7 GLB bytes, arbitrary Three mixer, continuous CCD, artist, Unreal, RTX and release NOT qualified by this workflow.'
