name: P1 Feedback Release Closure Gate

on:
  pull_request:
    branches:
      - main
      - "masterplan/p1-provider-redundancy-close-20260927-chat"
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/learning/promotion.py"
      - "skeleton/learning/__init__.py"
      - "skeleton/release/slo_promotion.py"
      - "skeleton/release/__init__.py"
      - "skeleton/testing/test_feedback_promotion.py"
      - "skeleton/testing/test_release_slo_promotion.py"
      - "scripts/verify_p1_feedback_release_closure.py"
      - "tests/test_p1_feedback_release_independent_verifier.py"
      - "machine/ai_app_construction.json"
      - ".github/workflows/p1-feedback-release-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-feedback-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feedback-release-contracts:
    name: Feedback and release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=7.0.0"
          "pydantic>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Run feedback promotion contracts
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_feedback_promotion.py

      - name: Run release SLO promotion contracts
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_release_slo_promotion.py

  independent-p1-verifier:
    name: Independent P1 verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check "pytest>=7.0.0"

      - name: Run verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_p1_feedback_release_independent_verifier.py

      - name: Verify exact-head P1 closure surfaces
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_p1_feedback_release_closure.py
          --evidence-out .p1-feedback-release.json
          --print-evidence


  p1-ledger-closure:
    name: P1 feedback release ledger closure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Verify exact-head P1 surfaces and ledger
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_p1_feedback_release_closure.py
          --evidence-out .p1-feedback-release-ledger.json
          --print-evidence

      - name: Assert exact-head closed P1 gap state
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-feedback-release-ledger.json").read_text(
                  encoding="utf-8"
              )
          )
          if receipt.get("head_sha") != os.environ["EXPECTED_SHA"].strip():
              raise SystemExit("P1 closure receipt head mismatch")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("P1 feedback/release independent verifier failed")
          states = receipt.get("gap_state") or {}
          expected = {
              "gap-feedback-promotion": "closed",
              "gap-release-slo-loop": "closed",
          }
          if states != expected:
              raise SystemExit(
                  f"P1 feedback/release gaps are not closed: {states!r}"
              )
          print("P1 feedback/release closed at exact head", receipt["head_sha"])
          PY
