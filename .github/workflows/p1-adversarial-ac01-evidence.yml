name: P1 Adversarial AC-01 Evidence Gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_adversarial_closure.json"
      - "scripts/build_p1_adversarial_ac01_evidence.py"
      - "tests/test_p1_adversarial_ac01_evidence.py"
      - ".github/workflows/p1-adversarial-ac01-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p1-adversarial-ac01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify AC-01 bootstrap and root trust evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "pydantic[email]>=2.13.5" "pydantic-settings>=2.15.0"
      - name: Run AC-01 regressions
        run: python -m pytest -q --noconftest tests/test_p1_adversarial_ac01_evidence.py tests/test_p1_risk_evidence_reconciliation.py skeleton/testing/test_app_bootstrap.py skeleton/testing/test_shell_ai_runtime_trust.py skeleton/testing/test_shell_ai_runtime_trust_store.py skeleton/testing/test_state_recovery_drill.py
      - name: Compile evidence twice
        run: |
          set -euo pipefail
          mkdir -p .p1-ac01
          python scripts/build_p1_adversarial_ac01_evidence.py --expected-head "$EXPECTED_SHA" --out .p1-ac01/report.json
          python scripts/build_p1_adversarial_ac01_evidence.py --expected-head "$EXPECTED_SHA" --out .p1-ac01/replay.json
          cmp .p1-ac01/report.json .p1-ac01/replay.json
