name: P3 Execution Map

on:
  pull_request:
    paths:
      - "machine/ai_p3_tranche0_plan.json"
      - "machine/ai_p3_execution_map.json"
      - "machine/ai_p3_task_backlog.json"
      - "machine/ai_p2_execution_map.json"
      - "machine/ai_p2_functional_ai_closure.json"
      - "machine/ai_master_plan.json"
      - "scripts/check_p3_execution_map.py"
      - "tests/test_p3_execution_map.py"
      - ".github/workflows/p3-execution-map.yml"
  push:
    branches:
      - main
      - feat/p3-autonomous-intelligence-expansion-atomic
    paths:
      - "machine/ai_p3_tranche0_plan.json"
      - "machine/ai_p3_execution_map.json"
      - "machine/ai_p3_task_backlog.json"
      - "machine/ai_p2_execution_map.json"
      - "machine/ai_p2_functional_ai_closure.json"
      - "machine/ai_master_plan.json"
      - "scripts/check_p3_execution_map.py"
      - "tests/test_p3_execution_map.py"
      - ".github/workflows/p3-execution-map.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-execution-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Validate P3 machine authority
        run: python scripts/check_p3_execution_map.py --json
      - name: Run P3 authority regressions
        run: python -m unittest -q tests.test_p3_execution_map
