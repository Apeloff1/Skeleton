name: Masterplan Overlay Reconciliation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_build_accountability.json"
      - "machine/ai_masterplan_parse_index.json"
      - "machine/*100*.json"
      - "machine/*300*.json"
      - "machine/*400*.json"
      - "machine/*1000*.json"
      - "machine/competitive_ai_*.json"
      - "machine/ai_game_builder_*.json"
      - "docs/plan/**"
      - "docs/architecture/COMPETITIVE_AI_*.md"
      - "docs/architecture/AI_GAME_BUILDER_500_LEVELS.md"
      - "scripts/check_masterplan_overlay_reconciliation.py"
      - "tests/test_masterplan_overlay_reconciliation.py"
      - ".github/workflows/masterplan-overlay-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "machine/**"
      - "docs/plan/**"
      - "scripts/check_masterplan_overlay_reconciliation.py"
      - "tests/test_masterplan_overlay_reconciliation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masterplan-overlay-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Preserve cumulative AI authorities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check --no-input "pytest>=8,<9"
      - name: Compile
        run: python -m py_compile scripts/check_masterplan_overlay_reconciliation.py tests/test_masterplan_overlay_reconciliation.py
      - name: Validate cumulative authority union
        run: python scripts/check_masterplan_overlay_reconciliation.py --json
      - name: Run regression tests
        run: python -m pytest -q --noconftest tests/test_masterplan_overlay_reconciliation.py
