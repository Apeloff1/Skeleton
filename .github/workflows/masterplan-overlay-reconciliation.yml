name: Masterplan Overlay Reconciliation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_masterplan_parse_index.json"
      - "machine/ai_build_accountability.json"
      - "machine/advanced_ai_*.json"
      - "machine/frontier_96_ai_ladder.json"
      - "machine/cs_300_computer_science_ladder.json"
      - "machine/learning_400_adversarial_400.json"
      - "machine/project_self_improvement_*.json"
      - "machine/essentials_1000*.json"
      - "machine/competitive_ai_*.json"
      - "machine/ai_game_builder_*.json"
      - "docs/plan/MASTER_PLAN.md"
      - "docs/plan/MASTER_INDEX.md"
      - "scripts/check_masterplan_overlay_reconciliation.py"
      - "tests/test_masterplan_overlay_reconciliation.py"
      - ".github/workflows/masterplan-overlay-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "machine/**"
      - "docs/plan/MASTER_PLAN.md"
      - "docs/plan/MASTER_INDEX.md"
      - "scripts/check_masterplan_overlay_reconciliation.py"
      - "tests/test_masterplan_overlay_reconciliation.py"
      - ".github/workflows/masterplan-overlay-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masterplan-overlay-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate cumulative frontier authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check --no-input "pytest>=8,<9"

      - name: Compile reconciliation controls
        run: python -m py_compile scripts/check_masterplan_overlay_reconciliation.py tests/test_masterplan_overlay_reconciliation.py

      - name: Validate cumulative overlay authority
        run: python scripts/check_masterplan_overlay_reconciliation.py

      - name: Run focused regression suite
        run: python -m pytest -q --noconftest tests/test_masterplan_overlay_reconciliation.py

      - name: Confirm exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
