name: One-shot CodeQL sink remediation
on:
  push:
    branches:
      - security/code-scan-fixes-2026-09-15
permissions:
  contents: write
jobs:
  remediate:
    if: github.ref == 'refs/heads/security/code-scan-fixes-2026-09-15'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/code-scan-fixes-2026-09-15
      - name: Apply and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bv = Path('backend/core/build_vault.py')
          t = bv.read_text()
          old = '''    root = BUILDS_ROOT.resolve()\n    candidate = (BUILDS_ROOT / build_id).resolve()\n    if candidate.parent != root:\n'''
          new = '''    root = BUILDS_ROOT.resolve()\n    safe_id = os.path.basename(build_id)\n    if safe_id != build_id or not safe_id:\n        raise ValueError("build_id must be a single path component")\n    candidate = (BUILDS_ROOT / safe_id).resolve()\n    if candidate.parent != root:\n'''
          if old not in t: raise SystemExit('build_vault target not found')
          bv.write_text(t.replace(old,new,1))
          ai = Path('backend/routes/apk_inspector.py')
          t = ai.read_text()
          old = '''    safe_id = _validate_build_id(build_id)\n    root = os.path.realpath(os.fspath(binary_builder.ARTIFACTS_ROOT))\n    candidate = os.path.realpath(os.path.normpath(os.path.join(root, f"{safe_id}.{kind}")))\n'''
          new = '''    requested_id = str(build_id)\n    safe_id = os.path.basename(requested_id)\n    if safe_id != requested_id or not safe_id:\n        raise HTTPException(400, "invalid build_id")\n    safe_id = _validate_build_id(safe_id)\n    root = os.path.realpath(os.fspath(binary_builder.ARTIFACTS_ROOT))\n    candidate_name = os.path.basename(f"{safe_id}.{kind}")\n    if candidate_name != f"{safe_id}.{kind}":\n        raise HTTPException(400, "invalid artifact name")\n    candidate = os.path.realpath(os.path.normpath(os.path.join(root, candidate_name)))\n'''
          if old not in t: raise SystemExit('artifact target not found')
          t=t.replace(old,new,1)
          old = '''    root = os.path.realpath(os.fspath(binary_builder.ARTIFACTS_ROOT))\n    requested = os.fspath(apk_path)\n    candidate = requested if os.path.isabs(requested) else os.path.join(root, requested)\n    normalized = os.path.realpath(os.path.normpath(candidate))\n'''
          new = '''    root = os.path.realpath(os.fspath(binary_builder.ARTIFACTS_ROOT))\n    requested_name = os.path.basename(os.fspath(apk_path))\n    if not requested_name or requested_name in {".", ".."} or not requested_name.endswith(".apk"):\n        raise ValueError("invalid APK path")\n    candidate = os.path.join(root, requested_name)\n    normalized = os.path.realpath(os.path.normpath(candidate))\n'''
          if old not in t: raise SystemExit('confinement target not found')
          ai.write_text(t.replace(old,new,1))
          PY
          python3 -m compileall -q backend/core/build_vault.py backend/routes/apk_inspector.py
          git diff --check
          git rm .github/workflows/_oneshot_codeql_sink_remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add backend/core/build_vault.py backend/routes/apk_inspector.py
          git commit -m 'security: make CodeQL path boundaries explicit'
          git push origin HEAD:security/code-scan-fixes-2026-09-15
