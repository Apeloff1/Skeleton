name: Epistemic Transparency

on:
  push:
    paths:
      - "backend/core/transparency_log.py"
      - "backend/core/epistemic_transparency.py"
      - "backend/core/transparency_gossip.py"
      - "backend/core/curiosity_service.py"
      - "backend/core/product_control_plane.py"
      - "backend/core/system_assurance.py"
      - "backend/routes/nexus.py"
      - "backend/tests/test_transparency_log.py"
      - "backend/tests/test_epistemic_transparency_gossip.py"
      - "backend/tests/test_control_plane_transparency.py"
      - ".github/workflows/epistemic-transparency.yml"
  pull_request:
    paths:
      - "backend/core/transparency_log.py"
      - "backend/core/epistemic_transparency.py"
      - "backend/core/transparency_gossip.py"
      - "backend/core/curiosity_service.py"
      - "backend/core/product_control_plane.py"
      - "backend/core/system_assurance.py"
      - "backend/routes/nexus.py"
      - "backend/tests/test_transparency_log.py"
      - "backend/tests/test_epistemic_transparency_gossip.py"
      - "backend/tests/test_control_plane_transparency.py"
      - ".github/workflows/epistemic-transparency.yml"

permissions:
  contents: read

concurrency:
  group: epistemic-transparency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transparency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install "pytest>=8,<9"
      - name: Verify transparency and equivocation defenses
        run: >-
          python -m pytest -q --noconftest
          tests/test_transparency_log.py
          tests/test_epistemic_transparency_gossip.py
          tests/test_control_plane_transparency.py
