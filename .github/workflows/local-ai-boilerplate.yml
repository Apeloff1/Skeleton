name: Local AI Boilerplate

on:
  push:
    branches:
      - main
    paths:
      - 'skeleton/local_ai/**'
      - 'skeleton/testing/test_local_ai_boilerplate.py'
  pull_request:
    paths:
      - 'skeleton/local_ai/**'
      - 'skeleton/testing/test_local_ai_boilerplate.py'

permissions:
  contents: read

concurrency:
  group: local-ai-boilerplate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned focused test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.4.2'
      - name: Run focused local AI tests
        run: python -m pytest skeleton/testing/test_local_ai_boilerplate.py -q
