name: Local AI Boilerplate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ai-boilerplate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install project runtime and focused test runner
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9"
      - name: Run focused local AI tests
        run: python -m pytest skeleton/testing/test_local_ai_boilerplate.py -q
