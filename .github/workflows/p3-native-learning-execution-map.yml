name: P3 Native Learning Extension Authority

on:
  pull_request:
    paths:
      - "machine/ai_p3_native_learning_execution_map.json"
      - "machine/ai_p3_native_learning_task_backlog.json"
      - "machine/ai_p3_tranche2_plan.json"
      - "scripts/check_p3_native_learning_execution_map.py"
      - "tests/test_p3_native_learning_execution_map.py"
      - ".github/workflows/p3-native-learning-execution-map.yml"
  push:
    branches:
      - feat/p3-native-learning-research-frontier
    paths:
      - "machine/ai_p3_native_learning_execution_map.json"
      - "machine/ai_p3_native_learning_task_backlog.json"
      - "machine/ai_p3_tranche2_plan.json"
      - "scripts/check_p3_native_learning_execution_map.py"
      - "tests/test_p3_native_learning_execution_map.py"
      - ".github/workflows/p3-native-learning-execution-map.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-native-learning-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Validate T2 authority
        run: python scripts/check_p3_native_learning_execution_map.py --json
      - name: Run authority regressions
        run: python -m pytest -q tests/test_p3_native_learning_execution_map.py
