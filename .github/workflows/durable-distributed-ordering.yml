name: Durable Distributed Ordering

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/kernel/distributed_ordering.py"
      - "skeleton/ai/runtime/kernel/distributed_ordering.py"
      - "skeleton/testing/test_distributed_ordering_authority.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/durable-distributed-ordering.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/kernel/distributed_ordering.py"
      - "skeleton/ai/runtime/kernel/distributed_ordering.py"
      - "skeleton/testing/test_distributed_ordering_authority.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/durable-distributed-ordering.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-distributed-ordering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-distributed-ordering:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Run durable distributed ordering regressions
        run: python -m unittest -q skeleton.testing.test_distributed_ordering_authority
      - name: Verify governed AI file-tree parity
        run: python scripts/check_ai_file_tree.py
      - name: Verify hostile-gap disposition
        run: python scripts/verify_ai_hostile_gap_disposition.py
