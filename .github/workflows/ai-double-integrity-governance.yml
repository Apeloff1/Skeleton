name: AI Double Integrity Governance

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/ai/learning/training_integrity.py"
      - "skeleton/learning/training_integrity.py"
      - "skeleton/ai/learning/model_program.py"
      - "skeleton/learning/model_program.py"
      - "skeleton/ai/learning/break_glass.py"
      - "skeleton/learning/break_glass.py"
      - "skeleton/ai/learning/promotion_control.py"
      - "skeleton/learning/promotion_control.py"
      - "skeleton/testing/test_training_integrity.py"
      - "skeleton/testing/test_break_glass_authority.py"
      - "skeleton/testing/test_vs005_promotion_control.py"
      - "tests/test_ai_training_program_governance.py"
      - ".github/workflows/ai-double-integrity-governance.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/ai/learning/training_integrity.py"
      - "skeleton/learning/training_integrity.py"
      - "skeleton/ai/learning/model_program.py"
      - "skeleton/learning/model_program.py"
      - "skeleton/ai/learning/break_glass.py"
      - "skeleton/learning/break_glass.py"
      - "skeleton/ai/learning/promotion_control.py"
      - "skeleton/learning/promotion_control.py"
      - "skeleton/testing/test_training_integrity.py"
      - "skeleton/testing/test_break_glass_authority.py"
      - "skeleton/testing/test_vs005_promotion_control.py"
      - "tests/test_ai_training_program_governance.py"
      - ".github/workflows/ai-double-integrity-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-double-integrity-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused AI runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          "pytest>=8,<9"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"

      - name: Verify exact-head identity and clean full PR diff syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          BASE="$(git merge-base HEAD origin/main)"
          test -n "$BASE"
          git diff --check "$BASE" HEAD

      - name: Compile doubled governance surfaces
        run: >-
          python -m py_compile
          skeleton/ai/learning/training_integrity.py
          skeleton/learning/training_integrity.py
          skeleton/ai/learning/model_program.py
          skeleton/learning/model_program.py
          skeleton/ai/learning/break_glass.py
          skeleton/learning/break_glass.py
          skeleton/ai/learning/promotion_control.py
          skeleton/learning/promotion_control.py
          skeleton/testing/test_training_integrity.py
          skeleton/testing/test_break_glass_authority.py
          skeleton/testing/test_vs005_promotion_control.py
          tests/test_ai_training_program_governance.py

      - name: Verify canonical AI namespace parity
        run: |
          python - <<'PY'
          from pathlib import Path

          pairs = (
              ("skeleton/ai/learning/training_integrity.py", "skeleton/learning/training_integrity.py"),
              ("skeleton/ai/learning/model_program.py", "skeleton/learning/model_program.py"),
              ("skeleton/ai/learning/break_glass.py", "skeleton/learning/break_glass.py"),
              ("skeleton/ai/learning/promotion_control.py", "skeleton/learning/promotion_control.py"),
          )
          for canonical, compatibility in pairs:
              left = Path(canonical).read_bytes()
              right = Path(compatibility).read_bytes()
              assert left == right, f"namespace drift: {canonical} != {compatibility}"
              print("namespace parity", canonical, len(left), "bytes")
          PY

      - name: Run legacy and doubled adversarial governance regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_training_integrity.py
          skeleton/testing/test_break_glass_authority.py
          skeleton/testing/test_vs005_promotion_control.py
          tests/test_ai_training_program_governance.py

      - name: Assert critical fail-closed APIs
        run: |
          python - <<'PY'
          import hashlib

          from skeleton.ai.learning.break_glass import (
              BreakGlassAuthority,
              BreakGlassError,
          )
          from skeleton.ai.learning.model_program import (
              ModelDevelopmentRegistry,
          )
          from skeleton.ai.learning.promotion_control import (
              EvaluationBundle,
              ImprovementCandidate,
              ImprovementError,
              decide,
          )

          s = lambda value: hashlib.sha256(value.encode()).hexdigest()
          candidate = ImprovementCandidate(
              "CANDIDATE.CI",
              s("champion"),
              s("challenger"),
              "isolated:ci",
              ("METRIC.QUALITY",),
              "ACTOR.BUILDER",
          )
          evaluation = EvaluationBundle(
              candidate.digest,
              (("METRIC.QUALITY", 1.0),),
              True,
              True,
              True,
              s("evaluation"),
          )
          try:
              decide(
                  candidate,
                  evaluation,
                  "ACTOR.VERIFIER",
                  canary_digest=s("raw-canary"),
              )
          except ImprovementError:
              pass
          else:
              raise SystemExit("raw canary digest unexpectedly authorized promotion")

          try:
              BreakGlassAuthority(max_receipts=0)
          except BreakGlassError:
              pass
          else:
              raise SystemExit("zero-capacity break-glass authority unexpectedly constructed")

          try:
              ModelDevelopmentRegistry(
                  require_governed_promotion_decisions=1,
              )
          except TypeError:
              pass
          else:
              raise SystemExit("promotion governance boolean type confusion was accepted")

          print("critical fail-closed API assertions passed")
          PY
