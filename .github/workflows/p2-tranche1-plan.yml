name: P2 Tranche 1 State

on:
  pull_request:
    paths:
      - "machine/ai_p2_tranche1_plan.json"
      - "machine/ai_p2_execution_map.json"
      - "machine/ai_p2_task_backlog.json"
      - "scripts/check_p2_tranche1_plan.py"
      - "scripts/check_p2_tranche1_activated.py"
      - "scripts/prepare_p2_tranche1_activation.py"
      - "tests/test_p2_tranche1_plan.py"
      - "tests/test_p2_tranche1_activation.py"
      - "tests/test_p2_tranche1_activated.py"
      - ".github/workflows/p2-tranche1-plan.yml"
  push:
    branches:
      - main
      - feat/p2-functional-ai-closure-atomic
    paths:
      - "machine/ai_p2_tranche1_plan.json"
      - "machine/ai_p2_execution_map.json"
      - "machine/ai_p2_task_backlog.json"
      - "scripts/check_p2_tranche1_plan.py"
      - "scripts/check_p2_tranche1_activated.py"
      - "scripts/prepare_p2_tranche1_activation.py"
      - "tests/test_p2_tranche1_plan.py"
      - "tests/test_p2_tranche1_activation.py"
      - "tests/test_p2_tranche1_activated.py"
      - ".github/workflows/p2-tranche1-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-tranche1-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate activated T1 state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Validate activated tranche
        run: python scripts/check_p2_tranche1_plan.py --json
      - name: Run tranche-state regressions
        run: >-
          python -m pytest -q
          tests/test_p2_tranche1_plan.py
          tests/test_p2_tranche1_activation.py
          tests/test_p2_tranche1_activated.py
