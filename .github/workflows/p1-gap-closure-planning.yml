name: P1 Gap Closure Planning Gate

on:
  pull_request:
    branches:
      - main
      - p1/release-lane-materialize-20260928
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_p1_task_backlog.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "scripts/build_p1_gap_closure_plan.py"
      - "scripts/build_p1_volume_accountability_candidates.py"
      - "scripts/reconcile_p1_risk_evidence.py"
      - "tests/test_p1_gap_closure_plan.py"
      - ".github/workflows/p1-gap-closure-planning.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-gap-closure-planning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate non-authoritative P1 gap closure plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Compile closure planning engines
        run: |
          set -euo pipefail
          python -m py_compile             scripts/build_p1_gap_closure_plan.py             scripts/build_p1_volume_accountability_candidates.py             scripts/reconcile_p1_risk_evidence.py

      - name: Validate canonical planning and risk inputs
        run: |
          set -euo pipefail
          python scripts/check_ai_master_plan.py
          python scripts/check_ai_p1_execution_map.py --print-summary
          python scripts/reconcile_p1_volume_metadata.py --check

      - name: Run gap closure regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_p1_gap_closure_plan.py

      - name: Build review-only closure plan
        run: |
          set -euo pipefail
          mkdir -p .p1-gap-closure
          registry_before="$(sha256sum machine/p1_risk_evidence_bindings.json | awk '{print $1}')"
          master_before="$(sha256sum machine/ai_master_plan.json | awk '{print $1}')"
          python scripts/build_p1_gap_closure_plan.py             --out .p1-gap-closure/plan.json             --print-summary
          registry_after="$(sha256sum machine/p1_risk_evidence_bindings.json | awk '{print $1}')"
          master_after="$(sha256sum machine/ai_master_plan.json | awk '{print $1}')"
          test "$registry_before" = "$registry_after"
          test "$master_before" = "$master_after"

      - name: Assert governed closure boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-gap-closure/plan.json").read_text(encoding="utf-8")
          )
          assert report["gap_blocked_volume_count"] == 84
          assert report["gap_obligation_count"] == 168
          assert report["bound_gap_obligation_count"] == 12
          assert report["unbound_gap_obligation_count"] == 156
          assert report["target_counts"] == {
              "hardened": {
                  "volume_count": 70,
                  "gap_obligation_count": 140,
              },
              "production": {
                  "volume_count": 14,
                  "gap_obligation_count": 28,
              },
          }
          assert report["lane_gap_obligation_counts"] == {
              "P1-L1": 30,
              "P1-L2": 54,
              "P1-L4": 16,
              "P1-L5": 28,
              "P1-L6": 40,
          }
          assert report["non_authoritative"] is True
          assert report["mutates_gap_state"] is False
          assert report["mutates_risk_registry"] is False
          assert report["creates_bindings"] is False
          assert report["creates_accepted_risk"] is False
          assert report["human_signature_required_for_accepted_risk"] is True
          print(
              "P1 gap closure planning OK:",
              report["gap_blocked_volume_count"],
              report["gap_obligation_count"],
              report["report_digest"],
          )
          PY
