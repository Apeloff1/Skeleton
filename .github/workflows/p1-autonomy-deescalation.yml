name: P1 Autonomy De-escalation Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/agents/autonomy_control.py"
      - "skeleton/ai/agents/core/autonomy_control.py"
      - "skeleton/agents/delegation_qualification.py"
      - "skeleton/agents/__init__.py"
      - "skeleton/ai/agents/core/__init__.py"
      - "skeleton/testing/test_autonomy_deescalation.py"
      - ".github/workflows/p1-autonomy-deescalation.yml"
  pull_request:
    branches:
      - main
      - p1/auto-02-agent-delegation-qualification-v2-20260928
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/agents/autonomy_control.py"
      - "skeleton/ai/agents/core/autonomy_control.py"
      - "skeleton/agents/delegation_qualification.py"
      - "skeleton/agents/__init__.py"
      - "skeleton/ai/agents/core/__init__.py"
      - "skeleton/testing/test_autonomy_deescalation.py"
      - ".github/workflows/p1-autonomy-deescalation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-autonomy-deescalation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate autonomy de-escalation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Run autonomy/delegation regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_autonomy_deescalation.py
          skeleton/testing/test_agent_delegation_qualification.py

      - name: Build accepted AUTO-03 decision
        run: |
          set -euo pipefail
          mkdir -p .p1-auto-03
          python - <<'PY'
          import json
          from pathlib import Path

          from skeleton.agents.autonomy_control import (
              AutonomyAuthorization,
              AutonomyLevel,
              AutonomySignal,
              AutonomyState,
              evaluate_autonomy_transition,
          )
          from skeleton.agents.delegation_qualification import AgentDelegationDecision
          from skeleton.contracts.canonical import EvidenceRef

          now = 1_800_000_000.0
          delegation = AgentDelegationDecision(
              accepted=True,
              reasons=(),
              parent_authority_digest="a" * 64,
              child_authority_digest="b" * 64,
              handoff_digest="c" * 64,
              lease_fence_digest="d" * 64,
              live_lease_digest="e" * 64,
              observed_at=now - 10.0,
          )
          state = AutonomyState(
              operation_id="ci-operation",
              execution_id="ci-execution",
              agent_id="ci-agent",
              level=AutonomyLevel.DELEGATED,
              delegation_digest=delegation.decision_digest,
              version=1,
          )
          authorization = AutonomyAuthorization(
              operation_id=state.operation_id,
              execution_id=state.execution_id,
              agent_id=state.agent_id,
              from_level=state.level,
              to_level=AutonomyLevel.AUTONOMOUS,
              delegation_digest=delegation.decision_digest,
              issuer_id="ci:independent-authorizer",
              issuer_digest="f" * 64,
              expires_at=now + 300.0,
              evidence_refs=(
                  EvidenceRef(
                      source="ci://autonomy-authorization",
                      digest="1" * 64,
                      category="autonomy_authorization",
                  ),
              ),
              independent=True,
          )
          decision = evaluate_autonomy_transition(
              state=state,
              requested_level=AutonomyLevel.AUTONOMOUS,
              signal=AutonomySignal(),
              delegation=delegation,
              observed_at=now,
              authorization=authorization,
          )
          if not decision.accepted:
              raise SystemExit(f"AUTO-03 fixture rejected: {decision.reasons}")
          evidence = decision.accepted_evidence_ref()
          Path(".p1-auto-03/decision.json").write_text(
              json.dumps(decision.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-auto-03/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head AUTO-03 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-auto-03/config.digest").write_text(
              hashlib.sha256(b"p1-auto-03-policy-v1").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-auto-03/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|auto-03"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-auto-03/verifier.digest").write_text(
              digest([
                  "skeleton/agents/autonomy_control.py",
                  ".github/workflows/p1-autonomy-deescalation.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-auto-03/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_autonomy_deescalation.py",
                  "skeleton/testing/test_agent_delegation_qualification.py",
              ]),
              encoding="utf-8",
          )
          PY
          python scripts/emit_p1_promotion_evidence.py             --repository Apeloff1/Skeleton             --commit-sha "$EXPECTED_SHA"             --expected-head "$EXPECTED_SHA"             --task-id P1-AUTO-03             --accountability-id ACC-P1-AUTO-03             --configuration-digest "$(cat .p1-auto-03/config.digest)"             --environment-digest "$(cat .p1-auto-03/environment.digest)"             --verifier-id github-actions:p1-autonomy-deescalation             --verifier-digest "$(cat .p1-auto-03/verifier.digest)"             --test-manifest-digest "$(cat .p1-auto-03/tests.digest)"             --run-id "$RUN_IDENTITY"             --run-attempt "$RUN_ATTEMPT"             --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --evidence-file .p1-auto-03/refs.json             --out .p1-auto-03/receipt.json             > .p1-auto-03/stdout.json

      - name: Assert exact-head receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-auto-03/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("AUTO-03 receipt head mismatch")
          if receipt["task_id"] != "P1-AUTO-03":
              raise SystemExit("AUTO-03 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-AUTO-03":
              raise SystemExit("AUTO-03 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("AUTO-03 exact-head receipt OK", receipt["receipt_digest"])
          PY
