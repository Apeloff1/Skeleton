name: Emerald V7 real Three original operator source
on:
  push:
    branches:
      - 'feat/emerald-v7-three-execution-*'
    paths:
      - 'scripts/run_emerald_v7_real_three_qualification.py'
      - 'scripts/qualify_emerald_v7_three_trace_contacts.py'
      - 'scripts/test_emerald_v7_three_mixer_trace.py'
      - 'scripts/compare_emerald_v7_three_source_parity.py'
      - 'scripts/test_compare_emerald_v7_three_source_parity.py'
      - 'scripts/test_run_emerald_v7_real_three_qualification.py'
      - '.github/workflows/emerald-v7-three-operator.yml'
  pull_request:
    paths:
      - 'scripts/run_emerald_v7_real_three_qualification.py'
      - 'scripts/qualify_emerald_v7_three_trace_contacts.py'
      - 'scripts/test_emerald_v7_three_mixer_trace.py'
      - 'scripts/compare_emerald_v7_three_source_parity.py'
      - 'scripts/test_compare_emerald_v7_three_source_parity.py'
      - 'scripts/test_run_emerald_v7_real_three_qualification.py'
      - '.github/workflows/emerald-v7-three-operator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-operator-synthetic-negative-contracts:
    name: Exact-head dual model operator and no false original acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Exact original source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact Git revision
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install immutable source-compatible Python ABI
        run: python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.16.3 numba==0.62.1
      - name: Compile operator and hostile admission fixtures
        run: |
          python -m py_compile scripts/run_emerald_v7_real_three_qualification.py
          python -m py_compile scripts/test_run_emerald_v7_real_three_qualification.py
      - name: Reject lost source SHA, forged operator receipts, incomplete stage and release
        run: |
          python scripts/test_run_emerald_v7_real_three_qualification.py
          python scripts/test_compare_emerald_v7_three_source_parity.py
          python scripts/test_emerald_v7_three_mixer_trace.py
      - name: Preserve non-original source-only status
        run: echo 'This CI uses synthetic mocks and cannot assert original model actual Three execution, 108 contact evidence, continuous CCD, browser, artist, physical RTX, Git byte publication or release.'
