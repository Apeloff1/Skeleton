name: Provider Surface Closure Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/provider_runtime.py"
      - "skeleton/provider_contract.py"
      - "skeleton/providers/contract.py"
      - "skeleton/provider_governance.py"
      - "skeleton/intelligence/**"
      - "skeleton/api/**"
      - "skeleton/ai/runtime/**"
      - "backend/core/ai_provider_compat.py"
      - "backend/core/engine_text.py"
      - "backend/core/engine_chat.py"
      - "backend/emergentintegrations/llm/chat.py"
      - "backend/routes/lafs.py"
      - "backend/routes/jeeves_compose.py"
      - "backend/routes/code_intelligence.py"
      - "backend/routes/sota_2026.py"
      - "backend/tests/test_engine_chat.py"
      - "backend/tests/test_code_intelligence_engine_boundary.py"
      - "backend/tests/test_sota_2026_engine_boundary.py"
      - "tests/test_provider_runtime_boundary.py"
      - "backend/services/tool_registry.py"
      - "scripts/check_provider_bootstrap.py"
      - "scripts/check_provider_capability_matrix.py"
      - "scripts/check_provider_runtime_boundary.py"
      - "scripts/verify_provider_surface_closure.py"
      - "skeleton/testing/test_provider_contract.py"
      - "skeleton/testing/test_provider_context_binding.py"
      - "skeleton/testing/test_provider_context_budget.py"
      - "skeleton/testing/test_provider_runtime_schema_parity.py"
      - "skeleton/testing/test_provider_stream_reliability_profiles.py"
      - "skeleton/testing/test_provider_surface_inventory.py"
      - "skeleton/testing/test_engine_cross_service_boundary.py"
      - "tests/test_provider_capability_matrix.py"
      - "tests/test_provider_surface_independent_verifier.py"
      - "skeleton/persistence/spine_provider_surface_qualification.py"
      - "skeleton/persistence/spine_provider_surface_qualification_verify.py"
      - "skeleton/ai/runtime/persistence/spine_provider_surface_qualification.py"
      - "skeleton/ai/runtime/persistence/spine_provider_surface_qualification_verify.py"
      - "skeleton/testing/test_spine_provider_surface_qualification.py"
      - "skeleton/testing/test_spine_provider_live_qualification.py"
      - "skeleton/persistence/spine_provider_live_qualification*.py"
      - "skeleton/ai/runtime/persistence/spine_provider_live_qualification*.py"
      - "scripts/qualify_spine_provider_live.py"
      - "machine/provider_capability_matrix.json"
      - "machine/ai_app_construction.json"
      - "machine/ai_closure_evidence.json"
      - "machine/ai_implementation_handoff.json"
      - ".github/workflows/provider-surface-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-surface-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-surface-contracts:
    name: Provider surface contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      head_sha: ${{ steps.closure_summary.outputs.head_sha }}
      declared_digest: ${{ steps.closure_summary.outputs.declared_digest }}
      discovered_digest: ${{ steps.closure_summary.outputs.discovered_digest }}
      declared_count: ${{ steps.closure_summary.outputs.declared_count }}
      discovered_count: ${{ steps.closure_summary.outputs.discovered_count }}
      receipt_digest: ${{ steps.closure_summary.outputs.receipt_digest }}
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused provider runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "httpx==0.28.1"
          "PyJWT==2.14.0"
          "python-dotenv==1.2.3"

      - name: Audit canonical provider SDK boundary
        run: python scripts/check_provider_runtime_boundary.py

      - name: Validate provider bootstrap and emit exact-head inventory receipt
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/check_provider_bootstrap.py
          --evidence-out .provider-surface-evidence.json
          --print-evidence

      - name: Validate canonical provider capability matrix
        run: >-
          python scripts/check_provider_capability_matrix.py
          machine/provider_capability_matrix.json

      - name: Validate provider capability matrix contract
        run: >-
          python -m pytest -q --noconftest
          tests/test_provider_capability_matrix.py

      - name: Run provider inventory and schema boundary contracts
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_provider_surface_inventory.py
          skeleton/testing/test_provider_runtime_schema_parity.py
          skeleton/testing/test_provider_context_binding.py
          skeleton/testing/test_provider_context_budget.py

      - name: Run async sync and media provider contracts
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_provider_contract.py

      - name: Run provider streaming reliability contracts
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_provider_stream_reliability_profiles.py

      - name: Run engine provider isolation golden journey
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_engine_cross_service_boundary.py

      - name: Run product provider-isolation facade contracts
        run: |
          python -m pytest -q --noconftest -p pytest_asyncio.plugin \
            backend/tests/test_engine_chat.py \
            backend/tests/test_code_intelligence_engine_boundary.py \
            backend/tests/test_sota_2026_engine_boundary.py
          python -m pytest -q --noconftest -p pytest_asyncio.plugin \
            tests/test_provider_runtime_boundary.py

      - name: Assert exact-head provider evidence receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".provider-surface-evidence.json").read_text(encoding="utf-8")
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          actual = str(receipt.get("head_sha") or "").strip()
          if actual != expected:
              raise SystemExit(
                  f"provider evidence head mismatch: {actual!r} != {expected!r}"
              )
          if receipt.get("valid") is not True:
              raise SystemExit("provider evidence receipt is not valid")
          if receipt.get("validation_errors"):
              raise SystemExit("provider evidence receipt contains validation errors")
          if not receipt.get("declared_surfaces"):
              raise SystemExit("provider evidence has no declared surfaces")
          if not receipt.get("discovered_surfaces"):
              raise SystemExit("provider evidence has no discovered surfaces")
          print(
              "provider-surface exact-head receipt:",
              expected,
              "declared=",
              len(receipt["declared_surfaces"]),
              "discovered=",
              len(receipt["discovered_surfaces"]),
          )
          PY

      - name: Emit canonical provider closure summary
        id: closure_summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from skeleton.persistence.spine_provider_surface_qualification import (
              SpineProviderSurfaceQualification,
          )

          receipt = json.loads(
              Path(".provider-surface-evidence.json").read_text(encoding="utf-8")
          )
          summary = SpineProviderSurfaceQualification.canonical_summary(receipt)
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              for key in (
                  "head_sha",
                  "declared_digest",
                  "discovered_digest",
                  "declared_count",
                  "discovered_count",
                  "receipt_digest",
              ):
                  handle.write(f"{key}={summary[key]}\n")
          PY

  provider-surface-independent:
    name: Independent provider verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      head_sha: ${{ steps.closure_summary.outputs.head_sha }}
      declared_digest: ${{ steps.closure_summary.outputs.declared_digest }}
      discovered_digest: ${{ steps.closure_summary.outputs.discovered_digest }}
      declared_count: ${{ steps.closure_summary.outputs.declared_count }}
      discovered_count: ${{ steps.closure_summary.outputs.discovered_count }}
      scanned_python_files: ${{ steps.closure_summary.outputs.scanned_python_files }}
      declared_surface_digest: ${{ steps.closure_summary.outputs.declared_surface_digest }}
      receipt_digest: ${{ steps.closure_summary.outputs.receipt_digest }}
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install independent verifier test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=7.0.0"

      - name: Run independent provider verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_provider_surface_independent_verifier.py

      - name: Run independent exact-head provider ownership scan
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_provider_surface_closure.py
          --evidence-out .provider-surface-independent.json
          --print-evidence

      - name: Assert independent exact-head receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".provider-surface-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit(
                  "independent provider receipt does not match exact PR head"
              )
          if receipt.get("verifier") != "independent-provider-surface-v1":
              raise SystemExit("unexpected independent provider verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent provider verification failed")
          if int(receipt.get("scanned_python_files", 0)) < 1:
              raise SystemExit("independent provider scan covered no Python files")
          if not receipt.get("declared_surface_digest"):
              raise SystemExit("independent provider declaration digest is missing")
          print(
              "independent provider exact-head receipt:",
              expected,
              "scanned=",
              receipt["scanned_python_files"],
              "edges=",
              len(receipt["discovered_provider_edges"]),
          )
          PY

      - name: Emit independent provider closure summary
        id: closure_summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from skeleton.persistence.spine_provider_surface_qualification import (
              SpineProviderSurfaceQualification,
          )

          receipt = json.loads(
              Path(".provider-surface-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          summary = SpineProviderSurfaceQualification.independent_summary(receipt)
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              for key in (
                  "head_sha",
                  "declared_digest",
                  "discovered_digest",
                  "declared_count",
                  "discovered_count",
                  "scanned_python_files",
                  "declared_surface_digest",
                  "receipt_digest",
              ):
                  handle.write(f"{key}={summary[key]}\n")
          PY

  provider-surface-qualified:
    name: Paired exact-head provider closure
    needs:
      - provider-surface-contracts
      - provider-surface-independent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      CANONICAL_HEAD_SHA: "${{ needs.provider-surface-contracts.outputs.head_sha }}"
      CANONICAL_DECLARED_DIGEST: "${{ needs.provider-surface-contracts.outputs.declared_digest }}"
      CANONICAL_DISCOVERED_DIGEST: "${{ needs.provider-surface-contracts.outputs.discovered_digest }}"
      CANONICAL_DECLARED_COUNT: "${{ needs.provider-surface-contracts.outputs.declared_count }}"
      CANONICAL_DISCOVERED_COUNT: "${{ needs.provider-surface-contracts.outputs.discovered_count }}"
      CANONICAL_RECEIPT_DIGEST: "${{ needs.provider-surface-contracts.outputs.receipt_digest }}"
      INDEPENDENT_HEAD_SHA: "${{ needs.provider-surface-independent.outputs.head_sha }}"
      INDEPENDENT_DECLARED_DIGEST: "${{ needs.provider-surface-independent.outputs.declared_digest }}"
      INDEPENDENT_DISCOVERED_DIGEST: "${{ needs.provider-surface-independent.outputs.discovered_digest }}"
      INDEPENDENT_DECLARED_COUNT: "${{ needs.provider-surface-independent.outputs.declared_count }}"
      INDEPENDENT_DISCOVERED_COUNT: "${{ needs.provider-surface-independent.outputs.discovered_count }}"
      INDEPENDENT_SCANNED_PYTHON_FILES: "${{ needs.provider-surface-independent.outputs.scanned_python_files }}"
      INDEPENDENT_DECLARED_SURFACE_DIGEST: "${{ needs.provider-surface-independent.outputs.declared_surface_digest }}"
      INDEPENDENT_RECEIPT_DIGEST: "${{ needs.provider-surface-independent.outputs.receipt_digest }}"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Qualify paired exact-head provider closure
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from skeleton.persistence.spine_provider_surface_qualification import (
              SpineProviderSurfaceQualification,
          )
          from skeleton.persistence.spine_provider_surface_qualification_verify import (
              SpineProviderSurfaceQualificationVerify,
          )

          canonical = {
              "kind": "spine_provider_surface_canonical_summary",
              "head_sha": os.environ["CANONICAL_HEAD_SHA"],
              "declared_digest": os.environ["CANONICAL_DECLARED_DIGEST"],
              "discovered_digest": os.environ["CANONICAL_DISCOVERED_DIGEST"],
              "declared_count": int(os.environ["CANONICAL_DECLARED_COUNT"]),
              "discovered_count": int(os.environ["CANONICAL_DISCOVERED_COUNT"]),
              "receipt_digest": os.environ["CANONICAL_RECEIPT_DIGEST"],
          }
          independent = {
              "kind": "spine_provider_surface_independent_summary",
              "head_sha": os.environ["INDEPENDENT_HEAD_SHA"],
              "declared_digest": os.environ["INDEPENDENT_DECLARED_DIGEST"],
              "discovered_digest": os.environ["INDEPENDENT_DISCOVERED_DIGEST"],
              "declared_count": int(os.environ["INDEPENDENT_DECLARED_COUNT"]),
              "discovered_count": int(os.environ["INDEPENDENT_DISCOVERED_COUNT"]),
              "scanned_python_files": int(
                  os.environ["INDEPENDENT_SCANNED_PYTHON_FILES"]
              ),
              "declared_surface_digest": os.environ[
                  "INDEPENDENT_DECLARED_SURFACE_DIGEST"
              ],
              "receipt_digest": os.environ["INDEPENDENT_RECEIPT_DIGEST"],
          }
          card = SpineProviderSurfaceQualification().qualify(
              canonical=canonical,
              independent=independent,
              expected_head_sha=os.environ["EXPECTED_SHA"],
          )
          verified = SpineProviderSurfaceQualificationVerify().verify(card)
          if verified.get("provider_surface_closure_green") is not True:
              raise SystemExit("provider closure qualification is not green")
          if verified.get("provider_surface_live_green") is not False:
              raise SystemExit("provider closure overclaimed live provider health")
          if verified.get("provider_surface_green") is not False:
              raise SystemExit("provider closure overclaimed provider surface green")
          Path(".provider-surface-qualified.json").write_text(
              json.dumps(card, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              "provider closure qualified:",
              card["head_sha"],
              "declared=",
              card["declared_count"],
              "discovered=",
              card["discovered_count"],
          )
          PY

      - name: Run provider closure qualification regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pip install --disable-pip-version-check "pytest>=8,<9"
          && python -m pytest -q --noconftest
          skeleton/testing/test_spine_provider_surface_qualification.py \
          skeleton/testing/test_spine_provider_live_qualification.py

      - name: Detect live provider credential
        id: live_provider
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "live provider credential is available"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "live provider credential is unavailable; live-green remains false"
          fi

      - name: Install canonical live provider runtime
        if: steps.live_provider.outputs.enabled == 'true'
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"

      - name: Qualify credential-bearing live provider
        if: steps.live_provider.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          P2_PROVIDER_LIVE_ATTESTATION_KEY: ${{ github.token }}
          P2_PROVIDER_LIVE_MODEL: ${{ vars.P2_PROVIDER_LIVE_MODEL }}
        run: >-
          python scripts/qualify_spine_provider_live.py
          --closure .provider-surface-qualified.json
          --expected-head "$EXPECTED_SHA"
          --evidence-out .provider-live-qualified.json

      - name: Record provider live qualification status
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.live_provider.outputs.enabled }}" == "true" ]]; then
            if [[ ! -s .provider-live-qualified.json ]]; then
              echo "credential existed but live provider evidence was not produced" >&2
              exit 1
            fi
            echo "provider live qualification evidence produced"
          else
            echo "provider live qualification not attempted: OPENAI_API_KEY unavailable"
          fi

      - name: Upload provider live qualification evidence
        if: steps.live_provider.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-live-qualified-${{ github.run_id }}
          path: .provider-live-qualified.json
          if-no-files-found: error
          retention-days: 30
