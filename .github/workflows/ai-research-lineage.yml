name: AI Research Lineage Closure
on:
  pull_request:
    paths:
      - "skeleton/research/**"
      - "skeleton/ai/research/**"
      - "skeleton/testing/test_research_lineage.py"
      - "machine/ai_master_plan.json"
      - ".github/workflows/ai-research-lineage.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/research/**"
      - "skeleton/ai/research/**"
      - "skeleton/testing/test_research_lineage.py"
      - "machine/ai_master_plan.json"
      - ".github/workflows/ai-research-lineage.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-research-lineage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  research-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check . "pytest>=8,<9"
      - run: python -m compileall -q skeleton/research skeleton/ai/research
      - run: python scripts/check_ai_master_plan.py
      - run: python -m pytest -q --noconftest skeleton/testing/test_research_lineage.py
