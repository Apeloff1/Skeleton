name: One-shot frontend security lock regeneration

on:
  push:
    branches:
      - security/frontend-dependency-hardening-2026-09-15
    paths:
      - .github/workflows/_oneshot_frontend_security_lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/frontend-dependency-hardening-2026-09-15
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Upgrade vulnerable packages within existing semver contracts
        working-directory: frontend
        run: >-
          yarn upgrade
          --pattern "shell-quote|tar|brace-expansion|postcss|form-data|undici|js-yaml|ws|axios|nanoid|browserslist|@xmldom/xmldom"
          --ignore-scripts
          --non-interactive

      - name: Verify regenerated graph and image parser mitigation
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile --non-interactive
          node scripts/verify-image-size-security.js

      - name: Commit regenerated lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- frontend/package.json frontend/yarn.lock; then
            echo "No lock changes generated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/yarn.lock
          git commit -m "security: refresh vulnerable frontend transitive dependencies"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git push origin HEAD:security/frontend-dependency-hardening-2026-09-15
          git config --local --unset-all http.https://github.com/.extraheader || true
