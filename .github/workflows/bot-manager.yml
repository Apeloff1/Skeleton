name: Repository Bot Manager

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore bot health state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .skeleton-bot-state.json
          key: skeleton-bot-state-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            skeleton-bot-state-${{ github.repository_id }}-
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Inventory bot schedule and circuits
        run: python -m skeleton.automation.bot_manager
