name: Repository Bot Manager
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: bot-manager-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install bot-manager runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Inventory bot schedule
        run: python -m skeleton.automation.bot_manager
