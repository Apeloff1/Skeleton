name: Keep pull-request branches flowing

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]

# One trusted-base updater is enough. PR events intentionally do not execute
# this write-capable workflow; push/schedule cover main movement and the
# five-minute sweep catches newly opened or newly quiet pull requests.
concurrency:
  group: branch-flow-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  refresh-behind-branches:
    name: Refresh safe branches behind main
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Advance only stable same-repository PR branches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'skeleton-branch-flow-watchdog',
          }
          retryable = frozenset({0, 429, 500, 502, 503, 504})
          active_run_statuses = ('requested', 'waiting', 'pending', 'queued', 'in_progress')
          max_updates = 4
          min_head_age_seconds = 180

          def request(path, *, method='GET', payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
              elif method != 'GET':
                  data = b''
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      parsed = json.loads(body) if body else None
                  except json.JSONDecodeError:
                      parsed = {'message': body[:500]}
                  return exc.code, parsed
              except urllib.error.URLError as exc:
                  return 0, {'message': str(exc)}

          def retry(path, *, method='GET', payload=None, attempts=3):
              status = 0
              body = None
              for attempt in range(attempts):
                  status, body = request(path, method=method, payload=payload)
                  if status not in retryable:
                      return status, body
                  if attempt + 1 < attempts:
                      time.sleep(2 ** attempt)
              return status, body

          def list_open_prs():
              pulls = []
              for page in range(1, 11):
                  query = urllib.parse.urlencode({
                      'state': 'open',
                      'base': 'main',
                      'per_page': 100,
                      'page': page,
                  })
                  status, body = retry(f'/repos/{repo}/pulls?{query}')
                  if status != 200 or not isinstance(body, list):
                      raise SystemExit(f'failed to list open pull requests: HTTP {status}')
                  pulls.extend(body)
                  if len(body) < 100:
                      break
              return pulls

          def touches_workflows(number, expected_files):
              if not isinstance(expected_files, int) or expected_files < 0:
                  return None
              if expected_files == 0:
                  return False

              seen = 0
              # The PR file-list endpoint exposes at most 3,000 files. The PR's
              # changed_files field is the completeness contract: if the pages
              # cannot account for the whole diff, preserve the branch.
              for page in range(1, 31):
                  query = urllib.parse.urlencode({'per_page': 100, 'page': page})
                  status, body = retry(f'/repos/{repo}/pulls/{number}/files?{query}')
                  if status != 200 or not isinstance(body, list):
                      return None
                  if any(
                      any(
                          str(item.get(field) or '').startswith('.github/workflows/')
                          for field in ('filename', 'previous_filename')
                      )
                      for item in body
                  ):
                      return True
                  seen += len(body)
                  if seen >= expected_files:
                      return False
                  if len(body) < 100:
                      return None
              return None

          def live_validation(head_sha):
              for run_status in active_run_statuses:
                  query = urllib.parse.urlencode({
                      'head_sha': head_sha,
                      'status': run_status,
                      'per_page': 1,
                  })
                  status, body = retry(f'/repos/{repo}/actions/runs?{query}')
                  if status != 200 or not isinstance(body, dict):
                      # A transient Actions-read problem preserves the branch.
                      return True
                  if body.get('workflow_runs'):
                      return True
              return False

          def head_is_settled(head_sha):
              status, body = retry(f'/repos/{repo}/commits/{head_sha}')
              if status != 200 or not isinstance(body, dict):
                  return False
              commit = body.get('commit') or {}
              stamp = ((commit.get('committer') or {}).get('date') or
                       (commit.get('author') or {}).get('date') or '')
              if not stamp:
                  return False
              try:
                  committed = datetime.fromisoformat(stamp.replace('Z', '+00:00'))
              except ValueError:
                  return False
              return (datetime.now(timezone.utc) - committed).total_seconds() >= min_head_age_seconds

          status, main = retry(f'/repos/{repo}/branches/main')
          main_sha = ((main or {}).get('commit') or {}).get('sha', '')
          if status != 200 or not main_sha:
              raise SystemExit(f'failed to resolve main HEAD: HTTP {status}')

          candidates = []
          counts = {
              'open': 0,
              'fork': 0,
              'draft': 0,
              'workflow_change': 0,
              'recent_head': 0,
              'not_behind': 0,
              'conflicted_or_unknown': 0,
              'active_ci': 0,
              'updated': 0,
              'raced': 0,
              'permission_or_api_failure': 0,
          }

          for listed in list_open_prs():
              counts['open'] += 1
              number = int(listed.get('number') or 0)
              if not number:
                  continue

              status, pr = retry(f'/repos/{repo}/pulls/{number}')
              if status != 200 or not isinstance(pr, dict):
                  counts['conflicted_or_unknown'] += 1
                  continue

              head = pr.get('head') or {}
              head_repo = (head.get('repo') or {}).get('full_name')
              head_ref = head.get('ref') or ''
              head_sha = head.get('sha') or ''
              if head_repo != repo:
                  counts['fork'] += 1
                  continue
              if pr.get('draft'):
                  counts['draft'] += 1
                  continue

              workflow_change = touches_workflows(number, pr.get('changed_files'))
              if workflow_change is None:
                  counts['conflicted_or_unknown'] += 1
                  continue
              if workflow_change:
                  # GITHUB_TOKEN cannot be elevated with the Workflows write
                  # permission. More importantly, workflow PRs are privileged
                  # control-plane changes and should not be rewritten by a
                  # generic freshness bot.
                  counts['workflow_change'] += 1
                  continue

              state = pr.get('mergeable_state') or 'unknown'
              mergeable = pr.get('mergeable')
              if state != 'behind':
                  if state in {'dirty', 'unknown'} or mergeable is False:
                      counts['conflicted_or_unknown'] += 1
                  else:
                      counts['not_behind'] += 1
                  continue
              if mergeable is False or not head_ref or not head_sha:
                  counts['conflicted_or_unknown'] += 1
                  continue
              if live_validation(head_sha):
                  counts['active_ci'] += 1
                  continue
              if not head_is_settled(head_sha):
                  counts['recent_head'] += 1
                  continue

              candidates.append((number, head_ref, head_sha))

          # Oldest PR numbers first gives long-lived work a deterministic chance
          # to advance while bounding CI fanout from a single watchdog pass.
          candidates.sort(key=lambda item: item[0])
          attempted = []
          for number, head_ref, expected_head in candidates[:max_updates]:
              # Revalidate immediately before mutation. The five-minute sweep is
              # cheap; losing a pass is always preferable to racing a fresh push.
              status, fresh = retry(f'/repos/{repo}/pulls/{number}')
              if status != 200 or not isinstance(fresh, dict):
                  counts['raced'] += 1
                  attempted.append(f'#{number}: vanished/unreadable before refresh')
                  continue
              fresh_head = fresh.get('head') or {}
              if ((fresh_head.get('repo') or {}).get('full_name') != repo or
                      fresh_head.get('ref') != head_ref or
                      fresh_head.get('sha') != expected_head or
                      fresh.get('draft') or
                      fresh.get('mergeable_state') != 'behind' or
                      fresh.get('mergeable') is False):
                  counts['raced'] += 1
                  attempted.append(f'#{number}: changed before refresh; preserved')
                  continue
              if touches_workflows(number, fresh.get('changed_files')) is not False:
                  counts['raced'] += 1
                  attempted.append(f'#{number}: workflow diff changed/unknown; preserved')
                  continue
              if live_validation(expected_head) or not head_is_settled(expected_head):
                  counts['raced'] += 1
                  attempted.append(f'#{number}: became active/recent before refresh; preserved')
                  continue

              # Use the synchronous branch-merge endpoint rather than the
              # asynchronous update-branch endpoint. The server merges captured
              # main into the branch's live tip in one request, so a concurrent
              # normal push cannot be silently replaced by a delayed updater.
              status, body = retry(
                  f'/repos/{repo}/merges',
                  method='POST',
                  payload={
                      'base': head_ref,
                      'head': main_sha,
                      'commit_message': f'ci: refresh PR #{number} with current main',
                  },
              )
              if status == 201:
                  counts['updated'] += 1
                  merged_sha = (body or {}).get('sha', '') if isinstance(body, dict) else ''
                  attempted.append(
                      f'#{number}: synchronously merged main into {head_ref} '
                      f'({merged_sha[:12] or "new tip"})'
                  )
              elif status == 204:
                  counts['not_behind'] += 1
                  attempted.append(f'#{number}: already current at mutation time')
              elif status in {409, 422}:
                  counts['raced'] += 1
                  attempted.append(f'#{number}: raced/conflicted; preserved (HTTP {status})')
              else:
                  counts['permission_or_api_failure'] += 1
                  message = (body or {}).get('message', '') if isinstance(body, dict) else ''
                  attempted.append(f'#{number}: API failure HTTP {status} {message[:120]}')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## Continuous branch flow\n')
                  handle.write(f'- Captured main: `{main_sha}`\n')
                  handle.write(f'- Open PRs inspected: {counts["open"]}\n')
                  handle.write(f'- Safe behind branches refreshed: {counts["updated"]}\n')
                  handle.write(f'- Branches with active CI preserved: {counts["active_ci"]}\n')
                  handle.write(f'- Recently pushed branches preserved: {counts["recent_head"]}\n')
                  handle.write(f'- Workflow-changing PR branches preserved: {counts["workflow_change"]}\n')
                  handle.write(f'- Draft PRs preserved: {counts["draft"]}\n')
                  handle.write(f'- Fork PRs preserved: {counts["fork"]}\n')
                  handle.write(
                      '- Conflicted/unresolved branches preserved: '
                      f'{counts["conflicted_or_unknown"]}\n'
                  )
                  handle.write(f'- Compare/update races preserved: {counts["raced"]}\n')
                  handle.write(
                      '- API/permission failures: '
                      f'{counts["permission_or_api_failure"]}\n'
                  )
                  handle.write(f'- Head settle window: {min_head_age_seconds}s\n')
                  handle.write('- Per-pass refresh cap: 4 branches\n')
                  handle.write(
                      '- Safety: write permission is available only from trusted-base '
                      'push/schedule/manual-main runs; PR events do not execute this workflow.\n'
                  )
                  handle.write(
                      '- Workflow-changing PRs are deliberately never rewritten by this updater.\n'
                  )
                  handle.write(
                      '- Branch refresh is synchronous; delayed update-branch operations are not used.\n'
                  )
                  if attempted:
                      handle.write('\n### Update attempts\n')
                      for line in attempted:
                          handle.write(f'- {line}\n')

          if counts['permission_or_api_failure']:
              raise SystemExit(
                  'branch-flow watchdog encountered '
                  f'{counts["permission_or_api_failure"]} terminal API failure(s)'
              )
          PY
