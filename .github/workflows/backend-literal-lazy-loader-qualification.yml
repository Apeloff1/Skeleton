name: Backend Literal Lazy-Loader Inventory Qualification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: literal-lazy-loader-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  literal_loader:
    name: Exact-head literal loader inventory and import-safety regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable pull-request head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up canonical Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install backend contract test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -r backend/requirements.txt
          'PyYAML>=6,<7' 'pytest==8.4.2' 'pytest-asyncio>=0.24,<2'
          'httpx>=0.28.1,<1' 'motor==3.7.1' 'pymongo==4.19.0'
          'fastapi>=0.142.2,<1' 'pydantic>=2.14.1,<3'
          'pydantic-settings>=2.15.0,<3'
      - name: Compile literal registry, public route and regressions
        run: >-
          python -m compileall -q
          backend/core/lazy_registry.py
          backend/core/public_exception_route.py
          backend/tests/test_storage_lazy_registry.py
      - name: Replay full storage lazy-registry contract
        env:
          PYTHONPATH: ".:backend"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest --import-mode=importlib
          -p pytest_asyncio.plugin
          backend/tests/test_storage_lazy_registry.py
      - name: Verify static import and canonical source boundaries
        run: |
          python scripts/check_repository_dynamic_import_safety.py
          python scripts/check_ai_file_tree.py
