name: Masterplan Overlay Union

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_masterplan_parse_index.json"
      - "machine/ai_build_accountability.json"
      - "machine/masterplan_overlay_registry.json"
      - "machine/*frontier*"
      - "machine/*advanced_ai*"
      - "machine/*cs_300*"
      - "machine/*learning_400*"
      - "machine/*project_self_improvement*"
      - "machine/*essentials_1000*"
      - "machine/*competitive_ai*"
      - "machine/ai_game_builder*"
      - "docs/plan/MASTER_PLAN.md"
      - "docs/plan/MASTER_INDEX.md"
      - "scripts/check_masterplan_overlay_union.py"
      - "tests/test_masterplan_overlay_union.py"
      - ".github/workflows/masterplan-overlay-union.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masterplan-overlay-union-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate cumulative masterplan overlay union
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check --no-input "pytest>=8,<9"
      - name: Validate exact-head identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile union validator
        run: python -m py_compile scripts/check_masterplan_overlay_union.py tests/test_masterplan_overlay_union.py
      - name: Validate cumulative union
        run: python scripts/check_masterplan_overlay_union.py
      - name: Run anti-regression tests
        run: python -m pytest -q --noconftest tests/test_masterplan_overlay_union.py
