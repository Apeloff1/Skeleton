name: P3 Local Training and Evaluation

on:
  pull_request:
    paths:
      - "skeleton/ai/runtime/training/**"
      - "skeleton/testing/test_p3_local_training_evaluation.py"
      - ".github/workflows/p3-local-training-evaluation.yml"
  push:
    branches:
      - main
      - feat/p3-t2-training-plane-atomic
    paths:
      - "skeleton/ai/runtime/training/**"
      - "skeleton/testing/test_p3_local_training_evaluation.py"
      - ".github/workflows/p3-local-training-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-local-training-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-training-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: "."
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pytest-asyncio>=0.24,<1"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"
      - name: Train and independently evaluate local model
        run: python -m pytest -q skeleton/testing/test_p3_local_training_evaluation.py
