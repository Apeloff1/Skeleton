name: Game Frontier Focused Validation

# Specialized scope only; does not add broad expensive app checks.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/jeeves/game_frontier*.py"
      - "skeleton/forge/game_frontier_godot.py"
      - "skeleton/forge/game_frontier_studio.py"
      - "skeleton/forge/game_frontier_rpg_events.py"
      - "tests/test_game_frontier*.py"
      - "scripts/run_game_frontier_capture.py"
      - "scripts/qualify_game_frontier_godot.py"
      - "scripts/build_game_frontier_smoke.py"
      - "scripts/validate_game_frontier_native_smoke.py"
      - "skeleton/game/production_*.py"
      - "skeleton/jeeves/game_production_quality_tools.py"
      - "skeleton/jeeves/game_complete_studio_quality_tools.py"
      - "skeleton/jeeves/game_advanced_studio_quality_tools.py"
      - "skeleton/jeeves/game_expanded_studio_quality_tools.py"
      - "skeleton/jeeves/game_studio_tools.py"
      - "skeleton/jeeves/game_frontier_studio_authoring_tools.py"
      - "skeleton/forge/game_frontier_studio*.py"
      - "skeleton/testing/test_game_production_*.py"
      - "skeleton/testing/test_game_frontier_studio_authoring.py"
      - "skeleton/testing/test_game_frontier_studio_second_fifty.py"
      - "skeleton/testing/test_game_frontier_studio_authoring_next50.py"
      - "skeleton/testing/test_game_frontier_studio_authoring_hundred.py"
      - "skeleton/testing/test_game_frontier_studio_authoring_500.py"
      - "skeleton/testing/test_game_frontier_studio_production_5000.py"
      - "skeleton/testing/test_game_frontier_studio_production_50000.py"
      - "skeleton/testing/test_game_frontier_studio_production_500000.py"
      - "skeleton/testing/test_game_frontier_studio_production_5000000.py"
      - "skeleton/testing/test_game_frontier_studio_production_50000000.py"
      - "skeleton/testing/test_game_frontier_studio_production_500000000.py"
      - "skeleton/testing/test_game_frontier_studio_production_5000000000.py"
      - "skeleton/testing/test_game_frontier_studio_production_50000000000.py"
      - "skeleton/testing/test_game_frontier_studio_route_assurance.py"
      - "skeleton/testing/test_game_frontier_studio_production_500000000000.py"
      - "skeleton/testing/test_game_frontier_studio_production_5000000000000.py"
      - "skeleton/testing/test_game_frontier_studio_production_50000000000000.py"
      - "skeleton/testing/test_game_frontier_book_curriculum_operational.py"
      - "skeleton/jeeves/game_frontier_curriculum_path.py"
      - "frontend/src/features/Jeeves/GameFrontierCurriculumPanel.tsx"
      - "frontend/src/product/gameFrontierCurriculumClient.ts"
      - "skeleton/testing/test_game_frontier_studio_epic_routes.py"
      - "skeleton/testing/test_game_frontier_studio_epic_lod.py"
      - "skeleton/forge/game_frontier_studio_epic_lod.py"
      - "skeleton/forge/game_frontier_studio_terrain_runtime.py"
      - "skeleton/forge/game_frontier_studio_epic_route_graph.py"
      - "frontend/src/features/Jeeves/GameFrontierEpicRoutePanel.tsx"
      - "skeleton/forge/game_frontier_studio_epic_*.py"
      - "scripts/export_game_studio_epic_handbooks.py"
      - "skeleton/forge/game_frontier_studio_saga_*.py"
      - "scripts/export_game_studio_saga_handbooks.py"
      - "skeleton/forge/game_frontier_studio_epoch_*.py"
      - "scripts/export_game_studio_epoch_handbooks.py"
      - "skeleton/forge/game_frontier_studio_chronicle_*.py"
      - "skeleton/forge/game_frontier_studio_route_assurance.py"
      - "scripts/export_game_studio_chronicle_handbooks.py"
      - ".github/workflows/game-frontier-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-frontier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontier-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11.16"
      - name: Install focused runtime and test dependencies
        # Backend Game Frontier route imports pass through gameforge_auth, which
        # imports jwt during pytest collection. Keep the focused environment
        # aligned with the pinned backend authentication dependency so route
        # tests exercise real auth imports instead of failing before collection.
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9" "PyJWT==2.15.1"
      - name: Compile all frontier source and tests
        run: python -m compileall -q skeleton/jeeves/game_frontier*.py skeleton/jeeves/game_production_quality_tools.py skeleton/jeeves/game_complete_studio_quality_tools.py skeleton/jeeves/game_advanced_studio_quality_tools.py skeleton/jeeves/game_expanded_studio_quality_tools.py skeleton/jeeves/game_frontier_studio_authoring_tools.py skeleton/jeeves/game_studio_tools.py skeleton/forge/game_frontier_studio*.py skeleton/game/production_*.py skeleton/testing/test_game_production_*.py skeleton/testing/test_game_frontier_studio_authoring_next50.py skeleton/testing/test_game_frontier_studio_authoring_hundred.py skeleton/testing/test_game_frontier_studio_authoring_500.py skeleton/testing/test_game_frontier_studio_production_5000.py skeleton/testing/test_game_frontier_studio_production_50000.py skeleton/testing/test_game_frontier_studio_production_500000.py skeleton/testing/test_game_frontier_studio_production_5000000.py skeleton/testing/test_game_frontier_studio_production_50000000.py skeleton/testing/test_game_frontier_studio_production_500000000.py skeleton/testing/test_game_frontier_studio_production_5000000000.py skeleton/testing/test_game_frontier_studio_production_50000000000.py skeleton/testing/test_game_frontier_studio_route_assurance.py skeleton/forge/game_frontier_godot.py skeleton/forge/game_frontier_studio.py skeleton/forge/game_frontier_rpg_events.py scripts/run_game_frontier_capture.py scripts/qualify_game_frontier_godot.py scripts/build_game_frontier_smoke.py scripts/validate_game_frontier_native_smoke.py tests/test_game_frontier*.py
      - name: Focused regression proof
        run: |
          python -m pytest -q tests/test_game_frontier*.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest -q --noconftest \
            skeleton/testing/test_game_production_quality.py \
            skeleton/testing/test_game_production_deep_quality.py \
            skeleton/testing/test_game_production_frontier_quality.py \
            skeleton/testing/test_game_production_studio_quality.py \
            skeleton/testing/test_game_production_advanced_quality.py \
            skeleton/testing/test_game_production_expanded_quality.py \
            skeleton/testing/test_game_frontier_studio_authoring.py \
            skeleton/testing/test_game_frontier_studio_second_fifty.py \
            skeleton/testing/test_game_frontier_studio_authoring_next50.py \
            skeleton/testing/test_game_frontier_studio_authoring_hundred.py \
            skeleton/testing/test_game_frontier_studio_authoring_500.py \
            skeleton/testing/test_game_frontier_studio_production_5000.py \
            skeleton/testing/test_game_frontier_studio_production_50000.py \
            skeleton/testing/test_game_frontier_studio_production_500000.py \
            skeleton/testing/test_game_frontier_studio_production_5000000.py \
            skeleton/testing/test_game_frontier_studio_production_50000000.py \
            skeleton/testing/test_game_frontier_studio_production_500000000.py \
            skeleton/testing/test_game_frontier_studio_production_5000000000.py \
            skeleton/testing/test_game_frontier_studio_production_50000000000.py \
            skeleton/testing/test_game_frontier_studio_production_500000000000.py \
            skeleton/testing/test_game_frontier_studio_production_5000000000000.py \
            skeleton/testing/test_game_frontier_studio_production_50000000000000.py \
            skeleton/testing/test_game_frontier_book_curriculum_operational.py \
            skeleton/testing/test_game_frontier_studio_epic_routes.py \
            skeleton/testing/test_game_frontier_studio_epic_lod.py
