name: Game Frontier Focused Validation

# Specialized scope only; does not add broad expensive app checks.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/jeeves/game_frontier*.py"
      - "skeleton/forge/game_frontier_godot.py"
      - "skeleton/forge/game_frontier_studio.py"
      - "skeleton/forge/game_frontier_rpg_events.py"
      - "tests/test_game_frontier*.py"
      - "scripts/run_game_frontier_capture.py"
      - "scripts/qualify_game_frontier_godot.py"
      - "scripts/build_game_frontier_smoke.py"
      - "scripts/validate_game_frontier_native_smoke.py"
      - "skeleton/game/production_*.py"
      - "skeleton/jeeves/game_production_quality_tools.py"
      - "skeleton/jeeves/game_complete_studio_quality_tools.py"
      - "skeleton/jeeves/game_advanced_studio_quality_tools.py"
      - "skeleton/jeeves/game_expanded_studio_quality_tools.py"
      - "skeleton/jeeves/game_studio_tools.py"
      - "skeleton/jeeves/game_frontier_studio_authoring_tools.py"
      - "skeleton/forge/game_frontier_studio*.py"
      - "skeleton/testing/test_game_production_*.py"
      - "skeleton/testing/test_game_frontier_studio_authoring.py"
      - "skeleton/testing/test_game_frontier_studio_second_fifty.py"
      - "skeleton/testing/test_game_frontier_studio_authoring_next50.py"
      - "skeleton/testing/test_game_frontier_studio_authoring_hundred.py"
      - ".github/workflows/game-frontier-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-frontier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontier-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
      - name: Install focused runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9"
      - name: Compile all frontier source and tests
        run: python -m compileall -q skeleton/jeeves/game_frontier*.py skeleton/jeeves/game_production_quality_tools.py skeleton/jeeves/game_complete_studio_quality_tools.py skeleton/jeeves/game_advanced_studio_quality_tools.py skeleton/jeeves/game_expanded_studio_quality_tools.py skeleton/jeeves/game_frontier_studio_authoring_tools.py skeleton/jeeves/game_studio_tools.py skeleton/forge/game_frontier_studio*.py skeleton/game/production_*.py skeleton/testing/test_game_production_*.py skeleton/testing/test_game_frontier_studio_authoring_next50.py skeleton/testing/test_game_frontier_studio_authoring_hundred.py skeleton/forge/game_frontier_godot.py skeleton/forge/game_frontier_studio.py skeleton/forge/game_frontier_rpg_events.py scripts/run_game_frontier_capture.py scripts/qualify_game_frontier_godot.py scripts/build_game_frontier_smoke.py scripts/validate_game_frontier_native_smoke.py tests/test_game_frontier*.py
      - name: Focused regression proof
        run: |
          python -m pytest -q tests/test_game_frontier*.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest -q --noconftest \
            skeleton/testing/test_game_production_quality.py \
            skeleton/testing/test_game_production_deep_quality.py \
            skeleton/testing/test_game_production_frontier_quality.py \
            skeleton/testing/test_game_production_studio_quality.py \
            skeleton/testing/test_game_production_advanced_quality.py \
            skeleton/testing/test_game_production_expanded_quality.py \
            skeleton/testing/test_game_frontier_studio_authoring.py \
            skeleton/testing/test_game_frontier_studio_second_fifty.py \
            skeleton/testing/test_game_frontier_studio_authoring_next50.py \
            skeleton/testing/test_game_frontier_studio_authoring_hundred.py
