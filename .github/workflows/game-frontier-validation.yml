name: Game Frontier Focused Validation

# Specialized scope only; does not add broad expensive app checks.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/jeeves/game_frontier*.py"
      - "skeleton/forge/game_frontier_godot.py"
      - "skeleton/forge/game_frontier_studio.py"
      - "tests/test_game_frontier*.py"
      - ".github/workflows/game-frontier-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-frontier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontier-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
      - name: Install focused runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<9"
      - name: Compile all frontier source and tests
        run: python -m compileall -q skeleton/jeeves/game_frontier*.py skeleton/forge/game_frontier_godot.py skeleton/forge/game_frontier_studio.py tests/test_game_frontier*.py
      - name: Focused regression proof
        run: python -m pytest -q tests/test_game_frontier_milestones.py tests/test_game_frontier_qualification.py tests/test_game_frontier_timing.py tests/test_game_frontier_world_physics_lighting.py tests/test_game_frontier_godot.py tests/test_game_frontier_extensions.py tests/test_game_frontier_advanced_physics.py tests/test_game_frontier_advanced_scene.py tests/test_game_frontier_weather_physics.py
