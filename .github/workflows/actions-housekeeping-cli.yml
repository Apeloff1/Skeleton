name: Actions Housekeeping CLI

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-housekeeping-cli.yml'

concurrency:
  group: actions-housekeeping-cli-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup:
    name: Prune cold Actions state
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CACHE_RETENTION_DAYS: '14'
      ARTIFACT_RETENTION_DAYS: '14'
      FAILED_RUN_RETENTION_DAYS: '21'
      MAX_CACHE_DELETES: '500'
      MAX_RUN_DELETES: '1000'
    steps:
      - name: Verify GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          gh auth status

      - name: Prune only cold Actions caches
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${CACHE_RETENTION_DAYS} days ago" +%s)
          inventory="$RUNNER_TEMP/caches.tsv"
          deleted=0
          failed=0
          kept=0
          reclaimed=0

          fetch_inventory() {
            local attempt=1 delay=2 status tmp="${inventory}.candidate"
            while true; do
              : > "$tmp"
              if gh api --paginate "/repos/${REPO}/actions/caches?per_page=100" --jq '.actions_caches[] | [.id, .last_accessed_at, .created_at, .size_in_bytes] | @tsv' > "$tmp"; then
                mv "$tmp" "$inventory"
                return 0
              else
                status=$?
              fi
              if (( attempt >= 4 )); then
                rm -f "$tmp"
                echo "Failed to fetch cache inventory after ${attempt} attempts (exit ${status})." >&2
                return "$status"
              fi
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          fetch_inventory
          while IFS=$'\t' read -r id last_accessed created size; do
            [[ -n "${id:-}" ]] || continue
            accessed="${last_accessed:-$created}"
            accessed_epoch=$(date -u -d "$accessed" +%s)
            size=${size:-0}
            if (( accessed_epoch < cutoff && deleted < MAX_CACHE_DELETES )); then
              if gh api --method DELETE "/repos/${REPO}/actions/caches/${id}" >/dev/null 2>&1; then
                deleted=$((deleted + 1))
                reclaimed=$((reclaimed + size))
              else
                failed=$((failed + 1))
              fi
            else
              kept=$((kept + 1))
            fi
          done < "$inventory"

          reclaimed_mib=$((reclaimed / 1024 / 1024))
          {
            echo '## Actions housekeeping'
            echo "- Cold caches deleted: $deleted"
            echo "- Hot/recent caches preserved: $kept"
            echo "- Cache deletion failures: $failed"
            echo "- Approximate cache space reclaimed: ${reclaimed_mib} MiB"
            echo "- Cache inactivity threshold: ${CACHE_RETENTION_DAYS} days"
            echo '- Active caches are intentionally preserved to avoid CI cold starts.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete stale workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${ARTIFACT_RETENTION_DAYS} days ago" +%s)
          inventory="$RUNNER_TEMP/artifacts.tsv"
          deleted=0
          failed=0
          kept=0

          fetch_inventory() {
            local attempt=1 delay=2 status tmp="${inventory}.candidate"
            while true; do
              : > "$tmp"
              if gh api --paginate "/repos/${REPO}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .created_at, .expired] | @tsv' > "$tmp"; then
                mv "$tmp" "$inventory"
                return 0
              else
                status=$?
              fi
              if (( attempt >= 4 )); then
                rm -f "$tmp"
                echo "Failed to fetch artifact inventory after ${attempt} attempts (exit ${status})." >&2
                return "$status"
              fi
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          fetch_inventory
          while IFS=$'\t' read -r id created expired; do
            [[ -n "${id:-}" && -n "${created:-}" ]] || continue
            created_epoch=$(date -u -d "$created" +%s)
            if [[ "$expired" == 'true' || "$created_epoch" -lt "$cutoff" ]]; then
              if gh api --method DELETE "/repos/${REPO}/actions/artifacts/${id}" >/dev/null 2>&1; then
                deleted=$((deleted + 1))
              else
                failed=$((failed + 1))
              fi
            else
              kept=$((kept + 1))
            fi
          done < "$inventory"

          {
            echo "- Stale/expired artifacts deleted: $deleted"
            echo "- Recent artifacts preserved: $kept"
            echo "- Artifact deletion failures: $failed"
            echo "- Artifact retention threshold: ${ARTIFACT_RETENTION_DAYS} days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune stale unsuccessful workflow runs
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${FAILED_RUN_RETENTION_DAYS} days ago" +%s)
          cutoff_iso=$(date -u -d "${FAILED_RUN_RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          inventory="$RUNNER_TEMP/runs.tsv"
          : > "$inventory"

          fetch_status() {
            local status_name="$1"
            local attempt=1 delay=2 status tmp="$RUNNER_TEMP/runs-${status_name}.candidate.tsv"
            while true; do
              : > "$tmp"
              # Query the stale side of the retention boundary directly. Asking
              # for the newest 1,000 runs first can permanently starve older
              # runs in a busy repository before local age filtering sees them.
              if gh run list --repo "$REPO" \
                --limit "$MAX_RUN_DELETES" \
                --status "$status_name" \
                --created "<${cutoff_iso}" \
                --json databaseId,createdAt,conclusion,name \
                --jq '.[] | [.databaseId, .createdAt, .conclusion, .name] | @tsv' > "$tmp"; then
                cat "$tmp" >> "$inventory"
                rm -f "$tmp"
                return 0
              else
                status=$?
              fi
              if (( attempt >= 4 )); then
                rm -f "$tmp"
                echo "Failed to fetch ${status_name} runs after ${attempt} attempts (exit ${status})." >&2
                return "$status"
              fi
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          for status_name in failure cancelled timed_out action_required stale; do
            fetch_status "$status_name"
          done
          # Consume the global deletion cap oldest-first across conclusions so a
          # noisy recent status cannot monopolize every housekeeping pass.
          sort -t $'\t' -k2,2 -k1,1n -u -o "$inventory" "$inventory"

          deleted=0
          failed=0
          kept=0
          while IFS=$'\t' read -r id created conclusion name; do
            [[ -n "${id:-}" && -n "${created:-}" ]] || continue
            [[ "$id" != "$GITHUB_RUN_ID" ]] || continue
            created_epoch=$(date -u -d "$created" +%s)
            # Keep a local age guard even though the server query is already
            # bounded, so malformed or unexpectedly broad results cannot delete
            # a recent run.
            if (( created_epoch >= cutoff || deleted >= MAX_RUN_DELETES )); then
              kept=$((kept + 1))
              continue
            fi
            if gh run delete "$id" --repo "$REPO"; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < "$inventory"

          {
            echo "- Old unsuccessful runs deleted: $deleted"
            echo "- Recent/over-cap unsuccessful runs preserved: $kept"
            echo "- Run deletion failures: $failed"
            echo "- Unsuccessful-run retention threshold: ${FAILED_RUN_RETENTION_DAYS} days"
            echo "- Per-sweep run deletion cap: ${MAX_RUN_DELETES}"
            echo "- Server-side stale-run cutoff: <${cutoff_iso}"
          } >> "$GITHUB_STEP_SUMMARY"
