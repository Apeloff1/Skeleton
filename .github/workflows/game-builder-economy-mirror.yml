name: Original Economy Strategy Mirror
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/game_builder/advanced_economy_mirror.py"
      - "skeleton/ai/game_builder/advanced_economy_runtime.py"
      - "skeleton/ai/game_builder/advanced_gameplay_runtime.py"
      - "skeleton/ai/game_builder/advanced_level_scenes.py"
      - "skeleton/ai/game_builder/system_editor_cli.py"
      - "skeleton/ai/game_builder/game_workspace_server.py"
      - "skeleton/ai/game_builder/game_workspace_ui.py"
      - "tests/test_game_builder_advanced_economy_mirror.py"
      - ".github/workflows/game-builder-economy-mirror.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-economy-mirror-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-bound-economic-evidence:
    name: Finite mirror, forgery and adoption (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 12
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Exact-head checkout without persistent secrets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_advanced_economy_mirror.py
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Verify source identity, import and strategy engine contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile \
            skeleton/ai/game_builder/advanced_economy_mirror.py \
            skeleton/ai/game_builder/advanced_economy_runtime.py \
            skeleton/ai/game_builder/system_editor_cli.py \
            skeleton/ai/game_builder/game_workspace_server.py \
            skeleton/ai/game_builder/game_workspace_ui.py \
            tests/test_game_builder_advanced_economy_mirror.py
      - name: Independently replay real counterfactual markets and tamper attacks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_game_builder_advanced_economy_mirror -v
