name: First-install source qualification

# Source-only qualification runs on drafts; no Windows, Docker, GGUF or release claim.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/first-install-source-qualification.yml'
      # Every exercised source contract must retrigger exact-head qualification.
      - '.machine/repository.toml'
      - 'machine/ai_file_tree.json'
      - 'scripts/check_ai_file_tree.py'
      - 'backend/core/lazy_registry.py'
      - 'backend/routes/discourse.py'
      - 'backend/routes/galaxy_studio.py'
      - 'backend/tests/live_service_tests.json'
      - 'backend/tests/test_live_service_test_boundaries.py'
      - 'backend/tests/test_free_api_dns_pin.py'
      - 'backend/tests/test_galaxy_file_budget.py'
      - 'backend/tests/test_storage_lazy_registry.py'
      - 'backend/tests/test_discourse_judge_admission.py'
      - 'backend/tests/test_code_intelligence_engine_boundary.py'
      - 'backend/tests/test_engine_text_route_cutovers.py'
      - 'backend/scripts/check_live_service_test_boundaries.py'
      - 'frontend/scripts/guarded-expo-export.cjs'
      - 'frontend/scripts/test-guarded-expo-export.cjs'
      - 'tests/test_repo_machine_live_taxonomy.py'
      - 'tests/test_app_foundation_e2e_build_isolation.py'
      - 'tests/test_ops_router_source_contract.py'
      - 'tests/test_product_surface_specification.py'
      - 'skeleton/testing/test_ai_flight_process.py'
      - 'skeleton/testing/test_ai_real_model_qualification.py'
      - 'skeleton/testing/test_harbor_crafting_patrol_guidance.py'
      - 'skeleton/testing/test_app_offline_mixed_game_library_relocation.py'
      - 'skeleton/game/gameplay/harbor_crafting_patrol*.py'
      - 'skeleton/ai/runtime/operational_ai/**'
      - 'skeleton/app/offline_mixed_game_library_relocation.py'
      - '.env.example'
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - 'backend/Dockerfile'
      - 'backend/Dockerfile.dockerignore'
      - 'docker-compose.yml'
      - 'frontend/Dockerfile'
      - 'frontend/.dockerignore'
      - 'skeleton/app/**'
      - 'skeleton/install/loopback_readiness.py'
      - 'skeleton/install/wizard_10000x.py'
      - 'skeleton/install/first_run_probe_gate.py'
      - 'skeleton/testing/test_first_run_probe_gate.py'
      - 'skeleton/testing/test_loopback_readiness.py'
      - 'skeleton/game/gameplay/offline_grid_save_slot.py'
      - 'scripts/game/offline_grid_campaign.py'
      - 'tests/test_offline_grid_save_slot.py'
      - 'skeleton/simulation/game/golden_grid.py'
      - 'skeleton/simulation/game/fixed_clock.py'
      - 'skeleton/simulation/game/__init__.py'
      - 'skeleton/ai/simulation/game/fixed_clock.py'
      - 'skeleton/ai/simulation/game/__init__.py'
      - 'tests/test_game_fixed_clock_v6.py'
      - 'skeleton/game/flgb_editor_runtime.py'
      - 'tests/test_jeeves_deep_authoring_graph.py'
      - 'skeleton/godot_export/artifact_custody.py'
      - 'skeleton/godot_export/cli.py'
      - 'skeleton/testing/test_godot_export_cli_custody.py'
      - 'skeleton/testing/test_godot_export_artifact_custody.py'
      - 'tests/test_golden_grid_v6.py'
      - 'skeleton/jeeves/worlds/laptop_flow.py'
      - 'skeleton/jeeves/worlds/world_canon.py'
      - 'skeleton/testing/test_jeeves_laptop_atomic_review.py'
      - 'skeleton/testing/test_jeeves_browser_save.py'
      - 'skeleton/testing/test_jeeves_standalone_keyboard.py'
      - 'skeleton/testing/test_jeeves_world_source_custody.py'
      - 'skeleton/ai/research/causal_knowledge.py'
      - 'skeleton/ai/research/hypothesis_engine.py'
      - 'skeleton/ai/research/game_design_probes.py'
      - 'skeleton/testing/test_causal_knowledge.py'
      - 'skeleton/testing/test_hypothesis_engine.py'
      - 'skeleton/testing/test_game_design_probes.py'
      - 'skeleton/ai/webcrawler/dragon_campaign_stack/**'
      - 'skeleton/ai/webcrawler/opds_discovery.py'
      - 'skeleton/ai/webcrawler/iiif_discovery.py'
      - 'skeleton/ai/webcrawler/oai_pmh_discovery.py'
      - 'tests/test_ai_webcrawler_dragon_archive_catalogs.py'
      - 'tests/test_ai_webcrawler_dragon_campaign_stack.py'
      - 'tests/test_ai_webcrawler_dragon_atlas.py'
      - 'skeleton/ai/runtime/game_project_cli.py'
      - 'scripts/game/game_project.py'
      - 'skeleton/testing/test_packaging_contract.py'
      - 'skeleton/testing/test_game_project_cli_custody.py'
      - 'skeleton/testing/test_game_project_cli_input_budget.py'
      - 'skeleton/testing/test_app_assembly.py'
      - 'skeleton/testing/test_app_installer.py'
      - 'skeleton/testing/test_app_installer_epoch.py'
      - 'skeleton/testing/test_app_offline_install_quarantine.py'
      - 'skeleton/testing/test_app_offline_delivery_archive.py'
      - 'skeleton/app/offline_delivery_archive.py'
      - 'skeleton/testing/test_app_studio_journey.py'
      - 'skeleton/testing/test_studio_package_verifier_contract.py'
      - 'skeleton/testing/test_app_offline_signed_game_library_audit.py'
      - 'skeleton/testing/test_dual_runtime_verify.py'
      - 'skeleton/ai/game_builder/dual_runtime_verify.py'
      - 'skeleton/ai/game_builder/original_game_studio.py'
      - 'skeleton/testing/test_app_install_source_contracts.py'
      - 'skeleton/testing/test_app_compose_parity.py'
      - 'skeleton/testing/test_windows_installer.py'
      - 'scripts/check_app_assembly.py'
      - 'scripts/check_product_surface_specification.py'
      - 'machine/product_surface_specification.json'
      - 'tests/test_product_surface_delegated_backend_20261110.py'
      - 'tests/test_app_assembly_vertical_surface_custody.py'
      - 'scripts/check_app_compose_parity.py'

permissions:
  contents: read

concurrency:
  group: first-install-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  installer_source_contracts:
    name: Exact-head first-install source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact-head identity before qualification
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || {
            echo "First-install source qualification checkout mismatch"
            exit 1
          }
      - name: Set up canonical Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install source-test runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -e .
          "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
          "PyYAML>=6,<7" "numpy>=2,<3" "Pillow>=13.0.0,<14"
      - name: Verify Python syntax at the exact head
        run: |
          python -m compileall -q skeleton/app skeleton/install/wizard_10000x.py skeleton/install/first_run_probe_gate.py skeleton/testing/test_first_run_probe_gate.py
          python -m compileall -q skeleton/ai/runtime/game_project_cli.py scripts/game/game_project.py skeleton/testing/test_packaging_contract.py skeleton/testing/test_game_project_cli_custody.py skeleton/testing/test_game_project_cli_input_budget.py
          python -m compileall -q skeleton/testing/test_app_install_source_contracts.py skeleton/testing/test_app_assembly.py skeleton/testing/test_app_installer.py skeleton/testing/test_app_installer_epoch.py
          python -m compileall -q scripts/check_app_assembly.py scripts/check_app_compose_parity.py tests/test_app_assembly_vertical_surface_custody.py
          python -m compileall -q skeleton/testing/test_studio_package_verifier_contract.py skeleton/testing/test_app_offline_signed_game_library_audit.py
      - name: Qualify actual first-install assembly and required source inputs
        run: python scripts/check_app_assembly.py
      - name: Run focused host-portable first-install regressions
        run: |
          python -m pytest -q --maxfail=1 \
            skeleton/testing/test_app_install_source_contracts.py \
            skeleton/testing/test_app_assembly.py \
            skeleton/testing/test_first_run_probe_gate.py \
            tests/test_app_assembly_vertical_surface_custody.py \
            tests/test_product_surface_specification.py \
            tests/test_product_surface_delegated_backend_20261110.py \
            skeleton/testing/test_app_installer.py \
            skeleton/testing/test_app_installer_epoch.py \
            skeleton/testing/test_app_compose_parity.py \
            skeleton/testing/test_app_assembly_source_paths.py \
            skeleton/testing/test_app_offline_install_quarantine.py \
            skeleton/testing/test_app_offline_delivery_archive.py \
            skeleton/testing/test_dual_runtime_verify.py \
            skeleton/testing/test_studio_package_verifier_contract.py \
            skeleton/testing/test_app_offline_signed_game_library_audit.py \
            skeleton/testing/test_app_offline_mixed_game_library_relocation.py \
            skeleton/testing/test_harbor_crafting_patrol_guidance.py \
            skeleton/testing/test_ai_real_model_qualification.py \
            skeleton/testing/test_ai_flight_process.py \
            skeleton/testing/test_app_studio_journey.py \
            skeleton/testing/test_app_offline_install_preflight.py \
            skeleton/testing/test_app_offline_install_reconciliation.py \
            skeleton/testing/test_first_install_required_routes.py \
            skeleton/testing/test_windows_installer.py \
            skeleton/testing/test_packaging_contract.py \
            skeleton/testing/test_game_project_cli_custody.py \
            skeleton/testing/test_game_project_cli_input_budget.py
      - name: Verify construction and provider-owner contracts
        run: |
          python scripts/check_architecture_map.py
          python scripts/check_ai_app_construction.py
          python scripts/check_capability_interfaces.py
          python scripts/check_provider_bootstrap.py

  integrated_capability_contracts:
    name: Exact-head offline gameplay, reviewed worlds, research and Dragon source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ".:backend"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout exact integration PR head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact-head identity before test execution
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up canonical Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install pinned source-only testing dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -e .
          "pytest>=8,<9" "PyYAML>=6,<7" "numpy>=2,<3" "Pillow>=13.0.0,<14"
          "pypdf==7.0.0"
      - name: Compile all consolidated feature sources and negative tests
        run: |
          python -m compileall -q skeleton/install/loopback_readiness.py skeleton/game/gameplay/offline_grid_save_slot.py skeleton/simulation/game/golden_grid.py skeleton/simulation/game/fixed_clock.py skeleton/ai/simulation/game/fixed_clock.py skeleton/jeeves/worlds/laptop_flow.py skeleton/jeeves/worlds/world_canon.py skeleton/ai/research/causal_knowledge.py skeleton/ai/research/hypothesis_engine.py skeleton/ai/research/game_design_probes.py skeleton/ai/webcrawler/dragon_campaign_stack
          python -m compileall -q tests/test_offline_grid_save_slot.py tests/test_golden_grid_v6.py tests/test_game_fixed_clock_v6.py tests/test_ai_webcrawler_dragon_archive_catalogs.py tests/test_ai_webcrawler_dragon_campaign_stack.py tests/test_ai_webcrawler_dragon_atlas.py skeleton/testing/test_loopback_readiness.py skeleton/testing/test_jeeves_laptop_atomic_review.py skeleton/testing/test_jeeves_browser_save.py skeleton/testing/test_jeeves_standalone_keyboard.py skeleton/testing/test_jeeves_world_source_custody.py skeleton/testing/test_causal_knowledge.py skeleton/testing/test_hypothesis_engine.py skeleton/testing/test_game_design_probes.py
          python -m compileall -q skeleton/game/flgb_editor_runtime.py skeleton/godot_export/artifact_custody.py skeleton/godot_export/cli.py tests/test_jeeves_deep_authoring_graph.py skeleton/testing/test_godot_export_artifact_custody.py skeleton/testing/test_godot_export_cli_custody.py
      - name: Exercise committed features against real source and filesystem fixtures
        run: |
          python -m pytest -q --maxfail=1 --noconftest \
            skeleton/testing/test_loopback_readiness.py \
            tests/test_offline_grid_save_slot.py \
            tests/test_golden_grid_v6.py \
            tests/test_game_fixed_clock_v6.py \
            skeleton/testing/test_jeeves_laptop_atomic_review.py \
            skeleton/testing/test_jeeves_browser_save.py \
            skeleton/testing/test_jeeves_standalone_keyboard.py \
            skeleton/testing/test_jeeves_world_source_custody.py \
            skeleton/testing/test_causal_knowledge.py \
            skeleton/testing/test_hypothesis_engine.py \
            skeleton/testing/test_game_design_probes.py \
            tests/test_ai_webcrawler_dragon_archive_catalogs.py \
            tests/test_ai_webcrawler_dragon_campaign_stack.py \
            tests/test_ai_webcrawler_dragon_atlas.py \
            tests/test_jeeves_deep_authoring_graph.py \
            skeleton/testing/test_godot_export_artifact_custody.py \
            skeleton/testing/test_godot_export_cli_custody.py

  ci_convergence_source:
    name: Exact-head backend taxonomy, source custody and Expo export regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ".:backend"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require exact head before source qualification
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up canonical Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Set up Node for source-only Expo supervisor tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install bounded source test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -e .
          "pytest>=8,<9" "PyYAML>=6,<7" "numpy>=2,<3" "Pillow>=13.0.0,<14"
      - name: Verify exact canonical tree and backend live-service manifest
        run: |
          set -euo pipefail
          python scripts/check_ai_file_tree.py
          python backend/scripts/check_live_service_test_boundaries.py
      - name: Exercise source custody, product surfaces and workflow regression tests
        run: |
          set -euo pipefail
          # Repository and backend both have a tests package: do not import
          # same-name modules in one pytest collection namespace.
          python -m pytest -q --maxfail=12 --noconftest \
            tests/test_repo_machine_live_taxonomy.py \
            tests/test_app_foundation_e2e_build_isolation.py \
            tests/test_ops_router_source_contract.py \
            tests/test_product_surface_specification.py \
            tests/test_product_surface_delegated_backend_20261110.py
          python -m pytest -q --maxfail=12 --noconftest --import-mode=importlib \
            backend/tests/test_live_service_test_boundaries.py \
            backend/tests/test_queue_drain_workflow.py \
            backend/tests/test_workflow_concurrency_gate.py \
            backend/tests/test_free_api_dns_pin.py \
            backend/tests/test_galaxy_file_budget.py \
            backend/tests/test_storage_lazy_registry.py \
            backend/tests/test_discourse_judge_admission.py \
            backend/tests/test_code_intelligence_engine_boundary.py \
            backend/tests/test_engine_text_route_cutovers.py
      - name: Exercise bounded Expo export supervisor with live child-process fixtures
        run: node --test frontend/scripts/test-guarded-expo-export.cjs
