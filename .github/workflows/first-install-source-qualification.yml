name: First-install source qualification

# Source-only qualification runs on drafts; no Windows, Docker, GGUF or release claim.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: first-install-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer_source_contracts:
    name: Exact-head first-install source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact-head identity before qualification
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || {
            echo "First-install source qualification checkout mismatch"
            exit 1
          }
      - name: Set up canonical Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install source-test runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -e .
          "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
          "PyYAML>=6,<7" "numpy>=2,<3" "Pillow>=13.0.0,<14"
      - name: Verify Python syntax at the exact head
        run: |
          python -m compileall -q skeleton/app
          python -m compileall -q skeleton/testing/test_app_install_source_contracts.py skeleton/testing/test_app_assembly.py skeleton/testing/test_app_installer.py skeleton/testing/test_app_installer_epoch.py
          python -m compileall -q scripts/check_app_assembly.py scripts/check_app_compose_parity.py
          python -m compileall -q scripts/local_ai_image_bundle.py scripts/local_ai_image_transfer.py scripts/qualify_local_ai_image_transfer_docker.py skeleton/testing/test_local_ai_image_bundle.py skeleton/testing/test_local_ai_image_transfer.py scripts/local_ai_offline_compose.py scripts/qualify_local_ai_offline_compose_docker.py skeleton/testing/test_local_ai_offline_compose.py scripts/local_ai_offline_launch.py skeleton/testing/test_local_ai_offline_launch.py scripts/local_ai_data_rehydration.py scripts/local_ai_device_admission.py scripts/local_ai_readiness.py scripts/qualify_local_ai_internal_network_docker.py scripts/local_ai_release_attestation.py skeleton/testing/test_local_ai_release_attestation.py scripts/qualify_local_ai_four_service_docker.py skeleton/testing/test_local_ai_four_service_docker.py skeleton/testing/test_local_ai_data_rehydration.py skeleton/testing/test_local_ai_device_admission.py skeleton/testing/test_local_ai_readiness.py
          python -m compileall -q scripts/local_ai_docker.py scripts/local_ai_compose_boundary.py scripts/local_ai_runtime_attestation.py scripts/local_ai_recovery.py scripts/local_ai_volume_copy.py scripts/local_ai_cold_backup.py scripts/qualify_local_ai_cold_backup_docker.py skeleton/testing/test_local_ai_physical_cold_source.py skeleton/testing/test_local_ai_recovery.py skeleton/testing/test_local_ai_volume_copy.py skeleton/testing/test_local_ai_cold_backup.py skeleton/persistence/docker_epoch_preflight.py backend/core/local_guarded_epoch_startup.py backend/tests/test_local_guarded_epoch_startup.py skeleton/persistence/docker_engine_epoch_startup.py skeleton/testing/test_docker_engine_epoch_startup.py skeleton/persistence/docker_epoch_inventory.py skeleton/testing/test_docker_epoch_inventory.py skeleton/app/docker_local_ai.py skeleton/testing/test_docker_local_ai.py skeleton/testing/test_local_ai_compose_boundary.py skeleton/testing/test_local_ai_runtime_attestation.py skeleton/testing/test_docker_guard_epoch_capability.py
      - name: Qualify actual first-install assembly and required source inputs
        run: python scripts/check_app_assembly.py
      - name: Run focused host-portable first-install regressions
        run: |
          python -m pytest -q --maxfail=1 \
            skeleton/testing/test_local_ai_image_bundle.py \
            skeleton/testing/test_local_ai_image_transfer.py \
            skeleton/testing/test_local_ai_offline_compose.py \
            skeleton/testing/test_local_ai_offline_launch.py \
            skeleton/testing/test_local_ai_data_rehydration.py \
            skeleton/testing/test_local_ai_device_admission.py \
            skeleton/testing/test_local_ai_readiness.py \
            skeleton/testing/test_local_ai_release_attestation.py \
            skeleton/testing/test_local_ai_four_service_docker.py \
            skeleton/testing/test_docker_local_ai.py \
            skeleton/testing/test_local_ai_compose_boundary.py \
            skeleton/testing/test_local_ai_runtime_attestation.py \
            skeleton/testing/test_docker_guard_epoch_capability.py \
            backend/tests/test_local_guarded_epoch_startup.py \
            skeleton/testing/test_docker_engine_epoch_startup.py \
            skeleton/testing/test_docker_epoch_inventory.py \
            skeleton/testing/test_local_ai_recovery.py \
            skeleton/testing/test_local_ai_volume_copy.py \
            skeleton/testing/test_local_ai_cold_backup.py \
            skeleton/testing/test_local_ai_physical_cold_source.py \
            skeleton/testing/test_app_install_source_contracts.py \
            skeleton/testing/test_app_assembly.py \
            skeleton/testing/test_app_installer.py \
            skeleton/testing/test_app_installer_epoch.py \
            skeleton/testing/test_app_compose_parity.py \
            skeleton/testing/test_app_assembly_source_paths.py \
            skeleton/testing/test_app_offline_install_quarantine.py \
            skeleton/testing/test_app_offline_delivery_archive.py \
            skeleton/testing/test_dual_runtime_verify.py \
            skeleton/testing/test_app_studio_journey.py \
            skeleton/testing/test_app_offline_install_preflight.py \
            skeleton/testing/test_app_offline_install_reconciliation.py \
            skeleton/testing/test_first_install_required_routes.py \
            skeleton/testing/test_windows_installer.py
      - name: Verify guarded local activation and Mongo authority without live writes
        run: |
          python -m pytest -q --maxfail=1 -p pytest_asyncio.plugin \
            skeleton/testing/test_compose_activation_role_custody.py \
            skeleton/testing/test_compose_authentication_boundary_regression.py \
            skeleton/testing/test_compose_explicit_null_role_boundary.py \
            skeleton/testing/test_compose_final_observation_custody.py \
            skeleton/testing/test_compose_guarded_activation.py \
            skeleton/testing/test_compose_guarded_preflight.py \
            skeleton/testing/test_compose_guarded_service.py \
            skeleton/testing/test_compose_hello_message_boundary.py \
            skeleton/testing/test_compose_load_balanced_authority.py \
            skeleton/testing/test_compose_missing_role_inventory.py \
            skeleton/testing/test_compose_mongo_first_run_status.py \
            skeleton/testing/test_compose_mongo_topology_custody.py \
            skeleton/testing/test_compose_null_primary_role_boundary.py \
            skeleton/testing/test_compose_null_proxy_authority.py \
            skeleton/testing/test_compose_null_topology_authority.py \
            skeleton/testing/test_compose_primary_membership_regression.py \
            skeleton/testing/test_compose_primary_topology_scalar_boundaries.py \
            skeleton/testing/test_compose_revocation_window_regression.py \
            skeleton/testing/test_compose_router_ghost_topology_fencing.py \
            skeleton/testing/test_compose_terminal_authority_failures.py \
            skeleton/testing/test_compose_terminal_topology.py \
            skeleton/testing/test_mongo_epoch_document_shape.py \
            skeleton/testing/test_mongo_epoch_exact_scalar_boundaries.py \
            skeleton/testing/test_mongo_epoch_instance_writer_fence.py \
            skeleton/testing/test_mongo_epoch_int64_boundaries.py \
            skeleton/testing/test_mongo_epoch_lower_level_scope.py \
            skeleton/testing/test_mongo_epoch_migration_guard.py \
            skeleton/testing/test_mongo_epoch_operation_deadlines.py \
            skeleton/testing/test_mongo_epoch_revocation.py \
            skeleton/testing/test_mongo_epoch_writer_result_scope.py \
            skeleton/testing/test_mongo_source_epoch.py \
            skeleton/testing/test_reviewer_custody.py \
            skeleton/testing/test_signed_reviewer_client.py \
            skeleton/testing/test_guard_preflight_operator_cli.py
      - name: Verify construction and provider-owner contracts
        run: |
          python scripts/check_architecture_map.py
          python scripts/check_ai_app_construction.py
          python scripts/check_capability_interfaces.py
          python scripts/check_provider_bootstrap.py
