name: P3 Post Training and Curriculum

on:
  pull_request:
    paths:
      - "skeleton/ai/runtime/training/**"
      - "skeleton/testing/test_p3_post_training.py"
      - ".github/workflows/p3-post-training.yml"
  push:
    branches:
      - main
      - feat/p3-t2-training-plane-atomic
    paths:
      - "skeleton/ai/runtime/training/**"
      - "skeleton/testing/test_p3_post_training.py"
      - ".github/workflows/p3-post-training.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-post-training-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  post-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"
      - name: Run post-training acceptance
        run: python -m pytest -q skeleton/testing/test_p3_post_training.py
