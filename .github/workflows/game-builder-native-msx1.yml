name: Game Builder Native MSX1 Cartridge

on:
  pull_request:
    paths:
      - 'skeleton/ai/game_builder/**'
      - 'scripts/game_builder/native_msx1_ci.py'
      - '.github/workflows/game-builder-native-msx1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-msx1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  original-msx1-bios-z80-rom:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /skeleton/__init__.py
            /skeleton/ai/__init__.py
            /skeleton/ai/capability_map.py
            /skeleton/ai/game_builder/
            /scripts/game_builder/native_msx1_ci.py
            /skeleton/testing/test_game_builder_msx1_native.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine Z80 assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z80asm make
          z80asm -V
      - name: Compile actual original MSX1 Z80 cartridge and strictly validate 16KB format
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/game_builder/native_msx1_ci.py --emit original-msx1-source > msx1-source-receipt.json
          make -C original-msx1-source
          test -s original-msx1-source/build/skeleton-original.bin
          test -s original-msx1-source/build/skeleton-original.rom
          python scripts/game_builder/native_msx1_ci.py \
            --verify-rom original-msx1-source/build/skeleton-original.rom \
            --binary original-msx1-source/build/skeleton-original.bin > msx1-rom-attestation.json
          python - <<'PY'
          import json
          r=json.load(open("msx1-rom-attestation.json",encoding="utf-8"))
          assert r["native_z80_binary_compiled"] is True
          assert r["rom_header_integrity_verified"] is True
          assert r["entry_point"]>=0x4010
          assert r["bytes"]==16384
          assert r["msx1_emulator_playthrough_verified"] is False
          print("GENUINE_MSX1_Z80_AB_CARTRIDGE_COMPILED",r["sha256"])
          PY
      - name: Verify original MSX BIOS keyboard, joystick, screen, sound and rights
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8.4,<9"
          python -m pytest -q --noconftest skeleton/testing/test_game_builder_msx1_native.py
      - name: Upload real original MSX1 ROM and provenance
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-original-msx1-16kb-z80-cartridge
          path: |
            original-msx1-source/build/skeleton-original.rom
            original-msx1-source/build/skeleton-original.bin
            original-msx1-source/manifest.json
            original-msx1-source/README.txt
            msx1-rom-attestation.json
            msx1-source-receipt.json
          if-no-files-found: error
          retention-days: 7
