name: VOL-072 Jeeves Domain

on:
  pull_request:
    paths:
      - "skeleton/jeeves/evidence_response.py"
      - "skeleton/ai/agents/jeeves/evidence_response.py"
      - "machine/jeeves_custody.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_master_plan.json"
      - "scripts/check_vol072_jeeves_domain.py"
      - "tests/test_vol072_jeeves_domain.py"
      - ".github/workflows/vol072-jeeves-domain.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/jeeves/evidence_response.py"
      - "skeleton/ai/agents/jeeves/evidence_response.py"
      - "machine/jeeves_custody.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_master_plan.json"
      - "scripts/check_vol072_jeeves_domain.py"
      - "tests/test_vol072_jeeves_domain.py"
      - ".github/workflows/vol072-jeeves-domain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol072-jeeves-domain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Jeeves domain authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Compile bounded implementation
        run: |
          python -m py_compile skeleton/jeeves/evidence_response.py
          python -m py_compile skeleton/ai/agents/jeeves/evidence_response.py
          python -m py_compile scripts/check_vol072_jeeves_domain.py
      - name: Verify custody and parity
        run: python scripts/check_vol072_jeeves_domain.py
      - name: Run adversarial VOL-072 regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --noconftest tests/test_vol072_jeeves_domain.py
