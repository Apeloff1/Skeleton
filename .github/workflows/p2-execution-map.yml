name: P2 Execution Map

on:
  push:
    branches:
      - main
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_p2_execution_map.json"
      - "machine/ai_p2_task_backlog.json"
      - "docs/plan/P2_EXECUTION_MAP.md"
      - "scripts/check_p2_execution_map.py"
      - "tests/test_p2_execution_map.py"
      - ".github/workflows/p2-execution-map.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_p2_execution_map.json"
      - "machine/ai_p2_task_backlog.json"
      - "docs/plan/P2_EXECUTION_MAP.md"
      - "scripts/check_p2_execution_map.py"
      - "tests/test_p2_execution_map.py"
      - ".github/workflows/p2-execution-map.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-execution-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-p2-map:
    name: Validate P2 scope and dependency authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Validate P2 execution map
        run: python scripts/check_p2_execution_map.py --json

      - name: Run P2 map regressions
        run: python -m unittest -v tests.test_p2_execution_map
