# Evidence refresh trigger: VOL-016 current-head closure verification.
name: Agent Runtime Closure Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/automation/agents/agent_runtime.py"
      - "skeleton/ai/agents/core/agent_runtime.py"
      - "skeleton/agents/agent_runtime.py"
      - "skeleton/automation/agents/__init__.py"
      - "skeleton/ai/agents/core/__init__.py"
      - "skeleton/testing/test_agent_runtime_durable.py"
      - "scripts/verify_agent_runtime_closure.py"
      - "tests/test_agent_runtime_independent_verifier.py"
      - "machine/ai_master_plan.json"
      - ".github/workflows/p1-agent-delegation-qualification.yml"
      - ".github/workflows/agent-runtime-closure.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/automation/agents/agent_runtime.py"
      - "skeleton/ai/agents/core/agent_runtime.py"
      - "skeleton/agents/agent_runtime.py"
      - "skeleton/automation/agents/__init__.py"
      - "skeleton/ai/agents/core/__init__.py"
      - "skeleton/testing/test_agent_runtime_durable.py"
      - "scripts/verify_agent_runtime_closure.py"
      - "tests/test_agent_runtime_independent_verifier.py"
      - "machine/ai_master_plan.json"
      - ".github/workflows/p1-agent-delegation-qualification.yml"
      - ".github/workflows/agent-runtime-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-closure-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-agent-runtime:
    name: Independent agent runtime verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install verifier dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Run independent verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_agent_runtime_independent_verifier.py

      - name: Build independent exact-head receipt
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_agent_runtime_closure.py
          --evidence-out .agent-runtime-independent.json
          --print-evidence

      - name: Assert independent exact-head receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".agent-runtime-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("agent runtime receipt head mismatch")
          if receipt.get("verifier") != "independent-agent-runtime-v1":
              raise SystemExit("unexpected agent runtime verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent agent runtime verification failed")
          if receipt.get("canonical_digest") != receipt.get("mirror_digest"):
              raise SystemExit("agent runtime mirror digest mismatch")
          if len(receipt.get("boundary_digests") or {}) < 5:
              raise SystemExit("agent runtime evidence coverage is incomplete")
          print(
              "independent agent runtime exact-head receipt:",
              expected,
              "boundaries=",
              len(receipt["boundary_digests"]),
          )
          PY
