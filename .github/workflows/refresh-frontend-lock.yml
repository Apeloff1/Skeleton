name: Refresh frontend lockfile

on:
  push:
    branches:
      - fix/frontend-expo54-manifest-normalization-20260922
    paths:
      - .github/workflows/refresh-frontend-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/frontend-expo54-manifest-normalization-20260922

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Regenerate lockfile without lifecycle scripts
        working-directory: frontend
        run: yarn install --ignore-scripts --non-interactive

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- frontend/yarn.lock; then
            echo "frontend/yarn.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/yarn.lock
          git commit -m "fix(frontend): regenerate Expo 54 yarn lockfile"
          git push origin HEAD:fix/frontend-expo54-manifest-normalization-20260922
