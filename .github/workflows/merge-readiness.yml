name: Merge Readiness

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/branch-clean.yml'

permissions:
  contents: read

# An updated PR may supersede only its own prior checks. Main SHA runs keep
# independent immutable evidence: cancelling one must never erase a main
# verification required for provenance and rollback.
concurrency:
  group: merge-readiness-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11.16"
  NODE_VERSION: "24.20.0"

jobs:
  quarantine_policy:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: Quarantine Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Validate merge-readiness workflow contract
        run: python scripts/check_merge_readiness_contract.py
      - name: Validate required-check policy
        run: python scripts/check_required_checks_policy.py
      - name: Validate CI package floor parity
        run: python scripts/check_ci_runtime_dependency_parity.py
      - name: Regress CI package floor detection
        run: python -m unittest discover -s tests -p test_ci_runtime_dependency_parity.py -v
      - name: Validate root production dependency metadata parity
        run: python scripts/check_root_package_metadata_parity.py
      - name: Regress root production package metadata floor drift
        run: python -m unittest discover -s tests -p test_root_package_metadata_parity.py -v
      - name: Preserve immutable main commit CI concurrency custody
        run: python scripts/check_ci_concurrency_custody.py
      - name: Regress immutable main CI concurrency policy
        run: python -m unittest discover -s tests -p test_ci_concurrency_custody.py -v
      - name: Validate Expo SDK and native runtime pairing
        run: python scripts/check_expo_runtime_pairing.py
      - name: Validate Expo SDK 54 bundled native dependency lockfile
        run: node frontend/scripts/check-expo-native-compat.cjs
      - name: Regress Expo SDK 54 native dependency drift detection
        run: node --test frontend/scripts/test-expo-native-compat.cjs
      - name: Verify Expo CLI static path patch compatibility
        run: node --test frontend/scripts/test-expo-static-index-patch.cjs
      - name: Validate composed contract system
        run: python scripts/check_contract_system.py
      - name: Validate flaky-test quarantine registry
        run: python scripts/check_flaky_quarantine.py

  unit:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install focused unit-test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6,<7" "pytest>=8,<9" "pytest-asyncio>=0.24,<2" "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0" "fastapi>=0.142.2,<1"
          "pydantic>=2.14.1,<3" "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2" "numpy>=2,<3" "Pillow>=13.0.0,<14"
      - name: Compile canonical Python package
        run: python -m compileall -q skeleton
      - name: Verify native dependency update groups remain isolated
        run: python -m pytest -q --noconftest tests/test_dependabot_group_isolation.py
      - name: Verify year-scale Jeeves Builder Dragon SQLite recovery
        run: python -m unittest discover -s tests -p 'test_annual_*.py' -v
      - name: Run canonical unit runner
        env:
          PYTHONPATH: "."
        run: python tests/run_unit.py
      - name: Verify legacy tests preserve tracked source
        run: git diff --exit-code
      - name: Run complete canonical domain suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ".:backend"
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing --tb=short
          --ignore=skeleton/testing/test_engine_handoff_recovery.py

  integration_smoke:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: Integration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    services:
      mongodb:
        # Docker Official Image mongo:7.0.41, pinned to the multi-platform index digest.
        image: mongo@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0
        ports:
          - "27017:27017"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install backend and integration runtime
        run: >-
          uv venv && uv pip install -r requirements.txt
          "pytest>=8,<9" "httpx>=0.27,<1"
      - name: Import application with live Mongo service
        env:
          MONGO_URL: mongodb://localhost:27017/test
          SKIP_HEAVY_SEED: "true"
          PYTHONPATH: ".."
        run: >-
          uv run python -c "import server; assert server.app is not None;
          print('server import: OK')"
      - name: Run canonical cross-subsystem integration matrix
        working-directory: .
        env:
          PYTHONPATH: "."
          GF_SEAL_SECRET: "integration-matrix-ci-secret"
        run: >-
          backend/.venv/bin/python -m pytest -q --noconftest
          tests/test_cross_subsystem_integration.py
          tests/test_frontier_runtime_memory_retrieval.py
          tests/test_model_runtime.py
          tests/test_model_routing.py
          skeleton/testing/test_frontier_observability_correlation.py

  quality_security:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: Lint Type Security
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install focused quality dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "ruff==0.17.2" "pytest>=8,<9" "pytest-asyncio>=0.24,<2" "fastapi==0.161.1"
          "httpx>=0.28.1,<1" "pydantic-settings>=2.15.0,<3" "pymongo>=4,<5" "motor>=3,<4"
          "bcrypt>=4,<5" "PyJWT>=2,<3" "email-validator>=2,<3" "python-dotenv>=1,<2" "cryptography>=50.0.2"
      - name: Install frontend dependencies
        run: yarn --cwd frontend install --ignore-scripts --non-interactive
      # Full repository Ruff lint runs in the canonical quality gate below; avoid a second backend-only pass.
      - name: Canonical lint, type, and high-confidence security gates
        run: bash scripts/quality-gates.sh
      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_CONFIG: ".gitleaks.toml"
          GITLEAKS_ENABLE_COMMENTS: "false"

  pr_automation:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: PR Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "pytest-asyncio>=0.24,<2" "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0" "fastapi>=0.142.2,<1" "pydantic>=2.14.1,<3" "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2"
      - name: Compile automation package
        run: >-
          python -m compileall -q
          skeleton/pr_automation
          skeleton/automation
          skeleton/repo_machine
      # Run the isolated custody test before the long automation matrix.
      # The complete matrix may be cancelled by unrelated repository pressure.
      - name: Verify fail-closed traffic dispatch custody
        env:
          PYTHONPATH: "."
        run: python -m unittest discover -s tests -p "test_traffic_dispatch_workflow.py" -v
      - name: Validate auto-merge workflow contract
        run: python scripts/check_automerge_contract.py
      - name: Validate runner v2 privileged contract
        run: python scripts/check_runner_v2_contract.py
      - name: Validate machine repository organization contract
        run: python scripts/check_repo_machine.py
      - name: Run PR automation contracts
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_pr_automation.py
          skeleton/testing/test_pr_automation_ruleset.py
          skeleton/testing/test_pr_automation_sensitive_paths.py
          skeleton/testing/test_pr_automation_workflow.py
          skeleton/testing/test_pr_automation_branch_completions.py
          skeleton/testing/test_automerge_model.py
          skeleton/testing/test_automerge_evidence.py
          skeleton/testing/test_automerge_policy.py
          skeleton/testing/test_automerge_stack.py
          skeleton/testing/test_automerge_engine.py
          skeleton/testing/test_automerge_contract.py
          skeleton/testing/test_runner_v2_contracts.py
          skeleton/testing/test_runner_v2_evidence.py
          skeleton/testing/test_runner_v2_runtime.py
          skeleton/testing/test_runner_v2_transaction_report.py
          skeleton/testing/test_runner_v2_engine.py
          tests/test_required_checks_policy.py
          tests/test_repo_machine.py
          tests/test_repo_machine_advanced.py
          tests/test_repo_machine_growth.py
          tests/test_repo_machine_catalog.py
          tests/test_repo_machine_sota.py
          tests/test_repo_machine_atlas.py
          tests/test_repo_machine_live_taxonomy.py
          tests/test_app_workspace_taxonomy.py
          tests/test_research_lineage_taxonomy.py
          tests/test_repository_integration.py
          skeleton/testing/test_repository_runtime_repairs.py
          skeleton/testing/test_developer.py
          skeleton/testing/test_policy_commands.py
          skeleton/testing/test_operator_quality.py
          skeleton/testing/test_support.py
          skeleton/testing/test_contexts.py
          skeleton/testing/test_prefix_improve.py
          skeleton/testing/test_jeeves_checkpoint_audit_binding.py
          skeleton/testing/test_jeeves_scientific_compiler.py
          tests/test_command_deck.py
          tests/test_new_subsystems.py
          skeleton/testing/test_jeeves_context_mesh.py
          skeleton/testing/test_cortex_deck.py
          skeleton/testing/test_organismer_social.py
          tests/test_replication_module_layout.py
          tests/test_organism_persistence_paths.py
          skeleton/testing/test_mesh_handoff.py
          skeleton/testing/test_galaxy_bridge.py
          skeleton/testing/test_replication_rollback_contract.py
          tests/test_*namespace_migration*.py
          tests/test_autonomous_supervisor.py
          tests/test_autonomous_builder_e2e_contract.py
          tests/test_build_authority.py
          tests/test_builder_plane.py
          tests/test_builder_plane_integration.py
          tests/test_builder_repair_receipt.py
          tests/test_build_repair.py
          tests/test_supervisor_runtime.py
          tests/test_worker_health.py
          tests/test_traffic_manager.py
          tests/test_traffic_dispatch_workflow.py
          tests/test_codex_vm_parity.py
          skeleton/testing/test_codex_vm_parity.py
          skeleton/testing/test_bot_manager.py
          skeleton/testing/test_architecture_index_completeness.py
          skeleton/testing/test_consensus.py
          skeleton/testing/test_deep.py
          skeleton/testing/test_game_logic_repair.py
          skeleton/testing/test_jeeves_fabric_context_compiler.py
          skeleton/testing/test_jeeves_historical_authorization_integration.py
          skeleton/testing/test_jeeves_semantic_topology_learning.py
          skeleton/testing/test_jeeves_semantic_topology_research_bridge.py
          skeleton/testing/test_pipeline_npc_quality.py
          skeleton/testing/test_pipeline_repair.py
          skeleton/testing/test_plan_repair.py
          skeleton/testing/test_ready_wave_runner.py
          skeleton/testing/test_scanner_integrity.py
          skeleton/testing/test_simulation_physics_character.py
          skeleton/testing/test_simulation_physics_character_motor.py
          skeleton/testing/test_sota_wave2.py
          skeleton/testing/test_swarm_api_recovery.py
          skeleton/testing/test_swarm_dag.py
          skeleton/testing/test_swarm_gc.py
          skeleton/testing/test_swarm_hardened_health.py
          skeleton/testing/test_swarm_health_semantics.py
          skeleton/testing/test_swarm_ingress_server.py
          skeleton/testing/test_swarm_new_route_wiring.py
