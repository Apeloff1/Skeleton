name: Merge Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: merge-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quarantine-policy:
    name: Quarantine Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate flaky-test quarantine registry
        run: python scripts/check_flaky_quarantine.py

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install focused unit-test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "fastapi>=0.110,<1"
          "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Compile canonical Python package
        run: python -m compileall -q skeleton
      - name: Run canonical unit runner
        env:
          PYTHONPATH: "."
        run: python tests/run_unit.py

  integration-smoke:
    name: Integration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    services:
      mongodb:
        image: mongo:7.0
        ports: [27017:27017]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install backend runtime
        run: |
          uv venv
          uv pip install -r requirements.txt
      - name: Import application with live Mongo service
        env:
          MONGO_URL: mongodb://localhost:27017/test
          SKIP_HEAVY_SEED: "true"
        run: uv run python -c "import server; assert server.app is not None; print('server import: OK')"

  quality-security:
    name: Lint Type Security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install focused quality dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "ruff==0.9.*" "pytest>=8,<9" "fastapi==0.136.1"
          "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Install frontend dependencies
        run: yarn --cwd frontend install --frozen-lockfile
      - name: Backend correctness lint
        run: ruff check backend --output-format=github
      - name: Canonical lint, type, and high-confidence security gates
        run: bash scripts/quality-gates.sh
      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_CONFIG: ".gitleaks.toml"
          GITLEAKS_ENABLE_COMMENTS: "false"

  readiness:
    name: Merge Readiness
    if: ${{ always() }}
    needs:
      - quarantine-policy
      - unit
      - integration-smoke
      - quality-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          needs = json.loads(os.environ["NEEDS_JSON"])
          rows = []
          failures = []
          for name, payload in sorted(needs.items()):
              result = payload.get("result", "unknown")
              rows.append(f"| `{name}` | `{result}` |")
              if result != "success":
                  failures.append(f"{name}={result}")

          summary = [
              "# Merge readiness",
              "",
              "| Required gate | Result |",
              "| --- | --- |",
              *rows,
              "",
          ]
          if failures:
              summary.append("**NOT READY:** " + ", ".join(failures))
          else:
              summary.append("**READY:** all repository merge gates passed for this head SHA.")

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary) + "\n", encoding="utf-8")
          if failures:
              raise SystemExit("required merge gates failed: " + ", ".join(failures))
          PY
