        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest --import-mode=importlib
          backend/tests/test_supervisor_workflow_contract.py
          backend/tests/test_traffic_manager_workflow_contract.py

  ci:
    # Restored CI/CD gates (#4104): Frontend, Backend Lint/Test/Import Smoke,
    # Skeleton GameForge, Java/Assembly accelerators, Jeeves, Cockpit Smoke and
    # Docker Build. Called here so they run once per head under this
    # workflow's per-ref cancel-in-progress group and gate the required check.
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: CI/CD
    uses: ./.github/workflows/ci.yml

  advisory_known_reds:
    # NOT a Merge Readiness lane (deliberately absent from readiness.needs), so
    # it never gates merges. Keep only the unresolved #4131 Unit advisory;
    # retrieval startup (#4132) is restored to required Integration Smoke.
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: Advisory Known Reds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        # Docker Official Image mongo:7.0.41, pinned to the multi-platform index digest.
        image: mongo@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0
        ports:
          - "27017:27017"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install runtime
        run: >-
          uv venv --python "${{ env.PYTHON_VERSION }}" .advisory &&
          uv pip install --python .advisory -r backend/requirements.txt
          "pytest>=8,<9" "pytest-asyncio>=0.24,<2" "httpx>=0.27,<1"
      - name: "Advisory #4131: engine handoff recovery suite (Unit)"
        if: ${{ !cancelled() }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ".:backend"
        run: >-
          .advisory/bin/python -m pytest -q --noconftest -p pytest_asyncio.plugin
          skeleton/testing/test_engine_handoff_recovery.py --tb=short

  readiness:
    name: Merge Readiness
    # !cancelled() (not always()): a superseded/cancelled run must not queue this
    # summary job, or it holds the merge-readiness-<PR#> slot and starves the new head.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')) }}
    needs:
      - quarantine_policy
      - unit
      - integration_smoke
      - quality_security
      - pr_automation
      - ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize required checks
        env:
          QUARANTINE_RESULT: ${{ needs.quarantine_policy.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration_smoke.result }}
          QUALITY_RESULT: ${{ needs.quality_security.result }}
          PR_AUTOMATION_RESULT: ${{ needs.pr_automation.result }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          results = {
              "quarantine_policy": os.environ["QUARANTINE_RESULT"],
              "unit": os.environ["UNIT_RESULT"],
              "integration_smoke": os.environ["INTEGRATION_RESULT"],
              "quality_security": os.environ["QUALITY_RESULT"],
              "pr_automation": os.environ["PR_AUTOMATION_RESULT"],
              "ci": os.environ["CI_RESULT"],
          }
          failures = {
              name: result
              for name, result in results.items()
              if result != "success"
          }
          rows = [
              f"| `{name}` | `{result}` |"
              for name, result in sorted(results.items())
          ]
          summary = [
              "# Merge readiness",
              "",
              "| Required gate | Result |",
              "| --- | --- |",
              *rows,
              "",
          ]
          if failures:
              summary.append(
                  "**NOT READY:** "
                  + ", ".join(
                      f"{name}={result}" for name, result in failures.items()
                  )
              )
          else:
              summary.append(
                  "**READY:** all repository merge gates passed for this head SHA."
              )

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary) + "\n",
              encoding="utf-8",
          )
          if failures:
              raise SystemExit(
                  "required merge gates failed: "
                  + ", ".join(
                      f"{name}={result}" for name, result in failures.items()
                  )
              )
          PY
