name: Merge Readiness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Fast, bounded PR gate. Deep test suites are no longer triggered from this
# workflow. Dedicated backend, malware, secret, dependency and input-security
# workflows retain their own targeted validation.
jobs:
  readiness:
    name: Merge Readiness
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Compile canonical Python package
        run: python -m compileall -q skeleton
      - name: Verify top-level application entrypoint syntax
        run: python -m py_compile skeleton/__main__.py
      - name: Detect changed frontend
        id: frontend
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            if git diff --name-only HEAD^1 HEAD^2 | grep -q '^frontend/'; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node 24
        if: steps.frontend.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install isolated TypeScript syntax runner
        if: steps.frontend.outputs.run == 'true'
        run: npm install --prefix "$RUNNER_TEMP/stability-typescript" --ignore-scripts --no-audit --no-fund --no-save --no-package-lock typescript@5.9.3
      - name: Execute reconciled startup safety regressions
        if: steps.frontend.outputs.run == 'true'
        working-directory: frontend
        env:
          NODE_PATH: ${{ runner.temp }}/stability-typescript/node_modules
        run: node --test scripts/test-reconciled-stability.cjs
      - name: Execute long-session lifecycle and network regressions
        if: steps.frontend.outputs.run == 'true'
        working-directory: frontend
        env:
          NODE_PATH: ${{ runner.temp }}/stability-typescript/node_modules
        run: node --test scripts/test-long-session-stability.cjs scripts/test-marathon-pressure.cjs scripts/test-session-transition-pressure.cjs scripts/test-offline-cache-integrity.cjs
      - name: Record fast-gate policy
        run: |
          echo '## Fast Merge Readiness' >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical Python syntax compiled. Backend Quality, Secret scanning,' >> "$GITHUB_STEP_SUMMARY"
          echo 'Malware Gate, Dependency Review and Workflow Input Security' >> "$GITHUB_STEP_SUMMARY"
          echo 'remain separate targeted checks; extended E2E and release checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'are non-blocking and must be run for release qualification.' >> "$GITHUB_STEP_SUMMARY"
