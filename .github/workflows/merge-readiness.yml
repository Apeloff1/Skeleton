          skeleton/testing/test_swarm_public_recovery_api.py
          skeleton/testing/test_swarm_route_wiring.py
          skeleton/testing/test_swarm_runtime_persistence.py
          skeleton/testing/test_swarm_tenant_broker_server.py
          skeleton/testing/test_engine_cross_service_boundary.py
          skeleton/testing/test_app_runtime_contract.py
      - name: Validate Linux filesystem and tool transaction boundaries
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_security_rooted_fs.py
          skeleton/testing/test_security_archive_sandbox.py
