name: Merge Readiness

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/branch-clean.yml'

permissions:
  contents: read

# Merge Readiness validates the repository's current integration state while
# preserving one canonical result for every main head SHA. Superseded PR runs
# may cancel, but a newer main push must not erase verification evidence for an
# older main head. Secret/malware/provenance workflows retain their separate
# evidence policies.
concurrency:
  group: merge-readiness-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11.16"
  NODE_VERSION: "24.20.0"

jobs:
  quarantine_policy:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: Quarantine Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Validate merge-readiness workflow contract
        run: python scripts/check_merge_readiness_contract.py
      - name: Validate flaky-test quarantine registry
        run: python scripts/check_flaky_quarantine.py

  unit:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install focused unit-test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "fastapi>=0.110,<1"
          "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Compile canonical Python package
        run: python -m compileall -q skeleton
      - name: Run canonical unit runner
        env:
          PYTHONPATH: "."
        run: python tests/run_unit.py

  integration_smoke:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: Integration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    services:
      mongodb:
        # Docker Official Image mongo:7.0.41, pinned to the multi-platform index digest.
        image: mongo@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0
        ports:
          - "27017:27017"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install backend and integration runtime
        run: >-
          uv venv && uv pip install -r requirements.txt
          "pytest>=8,<9" "httpx>=0.27,<1"
      - name: Import application with live Mongo service
        env:
          MONGO_URL: mongodb://localhost:27017/test
          SKIP_HEAVY_SEED: "true"
          PYTHONPATH: ".."
        run: >-
          uv run python -c "import server; assert server.app is not None;
          print('server import: OK')"
      - name: Run canonical cross-subsystem integration matrix
        working-directory: .
        env:
          PYTHONPATH: "."
          GF_SEAL_SECRET: "integration-matrix-ci-secret"
        run: >-
          backend/.venv/bin/python -m pytest -q --noconftest
          tests/test_cross_subsystem_integration.py
          tests/test_frontier_runtime_memory_retrieval.py
          tests/test_model_runtime.py
          tests/test_model_routing.py
          skeleton/testing/test_frontier_observability_correlation.py

  quality_security:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: Lint Type Security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install focused quality dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "ruff==0.9.10" "pytest>=8,<9" "pytest-asyncio>=0.24,<2" "fastapi==0.136.1"
          "httpx>=0.27,<1" "pydantic-settings>=2.1,<3" "pymongo>=4,<5"
      - name: Install frontend dependencies
        run: yarn --cwd frontend install --ignore-scripts --non-interactive
      - name: Backend correctness lint
        run: ruff check backend --output-format=github
      - name: Canonical lint, type, and high-confidence security gates
        run: bash scripts/quality-gates.sh
      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_CONFIG: ".gitleaks.toml"
          GITLEAKS_ENABLE_COMMENTS: "false"

  pr_automation:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')
    name: PR Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install focused test dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Compile automation package
        run: >-
          python -m compileall -q
          skeleton/pr_automation
          skeleton/automation
          skeleton/repo_machine
      - name: Validate auto-merge workflow contract
        run: python scripts/check_automerge_contract.py
      - name: Validate runner v2 privileged contract
        run: python scripts/check_runner_v2_contract.py
      - name: Validate machine repository organization contract
        run: python scripts/check_repo_machine.py
      - name: Run PR automation contracts
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_pr_automation.py
          skeleton/testing/test_pr_automation_ruleset.py
          skeleton/testing/test_pr_automation_sensitive_paths.py
          skeleton/testing/test_pr_automation_workflow.py
          skeleton/testing/test_pr_automation_branch_completions.py
          skeleton/testing/test_automerge_model.py
          skeleton/testing/test_automerge_evidence.py
          skeleton/testing/test_automerge_policy.py
          skeleton/testing/test_automerge_stack.py
          skeleton/testing/test_automerge_engine.py
          skeleton/testing/test_automerge_contract.py
          skeleton/testing/test_runner_v2_contracts.py
          skeleton/testing/test_runner_v2_evidence.py
          skeleton/testing/test_runner_v2_runtime.py
          skeleton/testing/test_runner_v2_transaction_report.py
          skeleton/testing/test_runner_v2_engine.py
          tests/test_repo_machine.py
          tests/test_repo_machine_advanced.py
          tests/test_repo_machine_growth.py
          tests/test_repo_machine_catalog.py
          tests/test_repo_machine_sota.py
          tests/test_autonomous_supervisor.py
          tests/test_build_authority.py
          tests/test_builder_plane.py
          tests/test_builder_plane_integration.py
          tests/test_supervisor_runtime.py
          tests/test_worker_health.py
          tests/test_traffic_manager.py
          skeleton/testing/test_bot_manager.py
      - name: Run supervisor workflow contract in isolated import namespace
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest --import-mode=importlib
          backend/tests/test_supervisor_workflow_contract.py
          backend/tests/test_traffic_manager_workflow_contract.py

  readiness:
    name: Merge Readiness
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed')) }}
    needs:
      - quarantine_policy
      - unit
      - integration_smoke
      - quality_security
      - pr_automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize required checks
        env:
          QUARANTINE_RESULT: ${{ needs.quarantine_policy.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration_smoke.result }}
          QUALITY_RESULT: ${{ needs.quality_security.result }}
          PR_AUTOMATION_RESULT: ${{ needs.pr_automation.result }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          results = {
              "quarantine_policy": os.environ["QUARANTINE_RESULT"],
              "unit": os.environ["UNIT_RESULT"],
              "integration_smoke": os.environ["INTEGRATION_RESULT"],
              "quality_security": os.environ["QUALITY_RESULT"],
              "pr_automation": os.environ["PR_AUTOMATION_RESULT"],
          }
          failures = {
              name: result
              for name, result in results.items()
              if result != "success"
          }
          rows = [
              f"| `{name}` | `{result}` |"
              for name, result in sorted(results.items())
          ]
          summary = [
              "# Merge readiness",
              "",
              "| Required gate | Result |",
              "| --- | --- |",
              *rows,
              "",
          ]
          if failures:
              summary.append(
                  "**NOT READY:** "
                  + ", ".join(
                      f"{name}={result}" for name, result in failures.items()
                  )
              )
          else:
              summary.append(
                  "**READY:** all repository merge gates passed for this head SHA."
              )

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary) + "\n",
              encoding="utf-8",
          )
          if failures:
              raise SystemExit(
                  "required merge gates failed: "
                  + ", ".join(
                      f"{name}={result}" for name, result in failures.items()
                  )
              )
          PY
