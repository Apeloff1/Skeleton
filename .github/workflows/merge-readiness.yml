name: Merge Readiness

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11.16"
  NODE_VERSION: "24.20.0"

jobs:
  quarantine_policy:
    name: Quarantine Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Validate flaky-test quarantine registry
        run: python scripts/check_flaky_quarantine.py

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install focused unit-test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "fastapi>=0.110,<1"
          "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Compile canonical Python package
        run: python -m compileall -q skeleton
      - name: Run canonical unit runner
        env:
          PYTHONPATH: "."
        run: python tests/run_unit.py

  integration_smoke:
    name: Integration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm integration job schedules
        run: echo "integration job scheduled"
