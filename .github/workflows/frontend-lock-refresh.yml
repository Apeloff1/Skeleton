name: Frontend lock refresh

on:
  push:
    branches:
      - fix/frontend-sdk54-worklets-lock-20260922

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Refresh frontend lockfile
        working-directory: frontend
        run: yarn install --ignore-scripts --non-interactive

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- frontend/yarn.lock; then
            echo "frontend/yarn.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/yarn.lock
          git commit -m "chore(frontend): refresh Expo 54 lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
