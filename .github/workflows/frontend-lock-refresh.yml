name: Frontend SDK54 validation

on:
  push:
    branches:
      - fix/frontend-sdk54-worklets-lock-20260922

permissions:
  contents: read

concurrency:
  group: frontend-sdk54-validation-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frozen frontend graph
        working-directory: frontend
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Apply reviewed local node_modules patches
        working-directory: frontend
        run: node ./scripts/patch-node-modules.js

      - name: Typecheck
        working-directory: frontend
        run: yarn typecheck

      - name: Operation stream regression
        working-directory: frontend
        run: yarn test:operation-stream

      - name: Export web
        working-directory: frontend
        run: yarn export:web
