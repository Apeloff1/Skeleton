name: Original NPC Waypoint Missions
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/game_builder/advanced_npc_waypoint_mission.py"
      - "skeleton/ai/game_builder/advanced_npc_dynamic_route_planner.py"
      - "skeleton/ai/game_builder/advanced_chunked_npc_world.py"
      - "skeleton/ai/game_builder/system_editor_cli.py"
      - "skeleton/ai/game_builder/game_workspace_server.py"
      - "skeleton/ai/game_builder/game_workspace_ui.py"
      - "tests/test_game_builder_npc_waypoint_mission.py"
      - ".github/workflows/game-builder-npc-waypoint-missions.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npc-waypoint-missions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-physical-missions:
    name: Actual original NPC quest expedition (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: "."
      PR_SOURCE_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Exact source checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_npc_waypoint_mission.py
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Compile and pin original source-head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_SOURCE_HEAD"
          python -m py_compile \
            skeleton/ai/game_builder/advanced_npc_waypoint_mission.py \
            skeleton/ai/game_builder/advanced_npc_dynamic_route_planner.py \
            skeleton/ai/game_builder/system_editor_cli.py \
            skeleton/ai/game_builder/game_workspace_server.py \
            skeleton/ai/game_builder/game_workspace_ui.py \
            tests/test_game_builder_npc_waypoint_mission.py
      - name: Real physical nine-stage quest, source validation and forgery rejection
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_game_builder_npc_waypoint_mission -v
      - name: Eight cross-seed physical authored harvest and waypoint replay proofs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from skeleton.ai.game_builder.advanced_chunked_npc_world import run_chunked_npc_world
          from skeleton.ai.game_builder.advanced_npc_waypoint_mission import (
              run_original_npc_waypoint_mission, verify_original_npc_waypoint_mission)
          for seed in (0,1,5,9):
              for chunks in (3,5):
                  source=run_chunked_npc_world([],seed=seed,options={
                      "chunks_per_side":chunks,"citizens":64,
                      "active_limit":8,"chunk_radius":1,"lod_policy":"fair"})
                  goals=[{"kind":"site","index":0,"action":"harvest"},
                         {"kind":"site","index":0,"action":"approach"}]
                  actual=run_original_npc_waypoint_mission(
                      source,goals,max_steps_per_leg=12)
                  assert verify_original_npc_waypoint_mission(actual)
                  assert actual["completed_waypoint_count"]==2
                  assert actual["final_world_summary"]["real_physical_events"]==1
                  assert not actual["model_weights_promoted"]
                  print("ORIGINAL_MISSION_SOURCE_REPLAY_OK",seed,chunks,actual["digest"])
          PY
