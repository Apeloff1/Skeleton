name: Adversarial Game Learning Promotion
on:
  pull_request:
    paths:
      - "skeleton/ai/game_builder/game_model_promotion.py"
      - "skeleton/ai/game_builder/game_reviewer_registry.py"
      - "skeleton/ai/game_builder/game_learning_feedback.py"
      - "skeleton/ai/game_builder/game_idle_review_scheduler.py"
      - "skeleton/ai/game_builder/game_tester_almanac.py"
      - "skeleton/ai/game_builder/game_model_cli.py"
      - "tests/test_game_builder_reviewer_promotion.py"
      - "tests/test_game_builder_learning_feedback.py"
      - ".github/workflows/game-builder-learning-feedback.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adversarial-game-learning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-safe-learning:
    name: Exact-head independent model qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      EXACT_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Exact-head no-credentials checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_learning_feedback.py
            tests/test_game_builder_reviewer_promotion.py
            tests/test_game_builder_learning_challenges.py
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Verify exact source and compile
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          python -m compileall -q skeleton/ai/game_builder
      - name: Independent source and adversarial promotion tests
        shell: bash
        run: |
          python -m unittest tests.test_game_builder_learning_feedback tests.test_game_builder_reviewer_promotion tests.test_game_builder_learning_challenges -v
