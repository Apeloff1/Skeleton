name: Dependency Surface Guard

on:
  push:
    branches: [main, master]
    paths:
      - "pyproject.toml"
      - ".github/dependabot.yml"
      - "satellites/branch-snapshots/**"
      - ".github/workflows/dependency-surface-guard.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/dependabot.yml"
      - "satellites/branch-snapshots/**"
      - ".github/workflows/dependency-surface-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-surface-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject installable Python manifests in archived snapshots
        shell: bash
        run: |
          set -euo pipefail
          if find satellites/branch-snapshots -type f -name requirements.txt -print -quit | grep -q .; then
            echo "Archived branch snapshots must not expose installable requirements.txt manifests." >&2
            find satellites/branch-snapshots -type f -name requirements.txt -print >&2
            echo "Preserve historical dependency text as requirements.snapshot and promote code before execution." >&2
            exit 1
          fi

      - name: Verify archived dependency evidence remains non-installable
        shell: bash
        run: |
          set -euo pipefail
          count=$(find satellites/branch-snapshots -type f -name requirements.snapshot -print | wc -l)
          test "$count" -ge 3 || {
            echo "Expected archived dependency evidence is missing; found $count snapshot manifests." >&2
            exit 1
          }
