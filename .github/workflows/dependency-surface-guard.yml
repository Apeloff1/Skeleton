name: Dependency Surface Guard

on:
  push:
    branches: [main, master]
    paths:
      - "pyproject.toml"
      - ".github/dependabot.yml"
      - "satellites/branch-snapshots/**"
      - "scripts/check_archived_dependency_surface.py"
      - "tests/test_archived_dependency_surface.py"
      - ".github/workflows/dependency-surface-guard.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "pyproject.toml"
      - ".github/dependabot.yml"
      - "satellites/branch-snapshots/**"
      - "scripts/check_archived_dependency_surface.py"
      - "tests/test_archived_dependency_surface.py"
      - ".github/workflows/dependency-surface-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-surface-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify archived dependency quarantine and provenance map
        run: python scripts/check_archived_dependency_surface.py

      - name: Verify quarantined bytes retain recorded Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.entries[] | [.archive_path, .blob_sha] | @tsv' \
            satellites/branch-snapshots/DEPENDENCY_ARCHIVE_MAP.json |
          while IFS=\t' read -r path expected; do
            observed="$(git hash-object -- "$path")"
            if [[ "$observed" != "$expected" ]]; then
              echo "Archived dependency evidence changed bytes: $path" >&2
              echo "Expected blob: $expected" >&2
              echo "Observed blob: $observed" >&2
              exit 1
            fi
          done
