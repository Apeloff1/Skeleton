name: AI Chat Evidence Closure

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/core/chat_evidence.py"
      - "backend/tests/test_ai_chat_evidence.py"
      - "machine/ai_chat_evidence.json"
      - "scripts/check_ai_chat_evidence.py"
      - "scripts/verify_ai_chat_evidence.py"
      - "docs/plan/AI_CHAT_MASTERPLAN_2026-10-06.md"
      - ".github/workflows/ai-chat-evidence-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-chat-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: AI chat evidence acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate evidence structure
        run: python scripts/check_ai_chat_evidence.py

      - name: Compile evidence surface
        run: python -m compileall -q backend/core/chat_evidence.py

      - name: Run evidence regressions
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_ai_chat_evidence.py
          backend/tests/test_citation_gate_adversarial.py
          backend/tests/test_citation_structural_laundering.py

      - name: Emit exact-head evidence receipt
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/check_ai_chat_evidence.py
          --head-sha "$EVIDENCE_HEAD_SHA"
          --evidence-out .ai-chat-evidence.json
          --print-evidence

      - name: Independently verify evidence receipt
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_ai_chat_evidence.py
          .ai-chat-evidence.json
          --head-sha "$EVIDENCE_HEAD_SHA"
          --evidence-out .ai-chat-evidence-independent.json
          --print-evidence

      - name: Assert exact-head closure
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          structural = json.loads(
              Path(".ai-chat-evidence.json").read_text(encoding="utf-8")
          )
          independent = json.loads(
              Path(".ai-chat-evidence-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if structural.get("head_sha") != expected:
              raise SystemExit("evidence structural receipt is not exact-head")
          if structural.get("valid") is not True or structural.get("errors"):
              raise SystemExit("evidence structural validation failed")
          if len(structural.get("digests") or {}) != 6:
              raise SystemExit("evidence digest coverage incomplete")
          if independent.get("expected_head") != expected:
              raise SystemExit("evidence independent receipt is not exact-head")
          if independent.get("valid") is not True or independent.get("errors"):
              raise SystemExit("evidence independent verification failed")
          if (
              independent.get("structural_evidence_digest")
              != independent.get("recomputed_structural_evidence_digest")
          ):
              raise SystemExit("evidence receipt was not independently rehashed")
          print("AI chat evidence exact-head closure verified:", expected)
          PY
