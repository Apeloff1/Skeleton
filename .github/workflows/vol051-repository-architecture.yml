name: VOL-051 Repository Architecture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_file_tree.json"
      - "machine/architecture.json"
      - "scripts/check_ai_file_tree.py"
      - "scripts/check_ai_file_tree_ownership.py"
      - "skeleton/testing/test_ai_file_tree.py"
      - "skeleton/testing/test_ai_file_tree_ownership.py"
      - ".github/workflows/vol051-repository-architecture.yml"
  push:
    branches: [main]
    paths:
      - "machine/ai_file_tree.json"
      - "machine/architecture.json"
      - "scripts/check_ai_file_tree.py"
      - "scripts/check_ai_file_tree_ownership.py"
      - "skeleton/testing/test_ai_file_tree.py"
      - "skeleton/testing/test_ai_file_tree_ownership.py"
      - ".github/workflows/vol051-repository-architecture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol051-repository-architecture-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  relocation-parity:
    name: Canonical AI-tree relocation parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Compile relocation surfaces
        run: >-
          python -m compileall -q
          scripts/check_ai_file_tree.py
          scripts/check_ai_file_tree_ownership.py
          skeleton/testing/test_ai_file_tree.py
          skeleton/testing/test_ai_file_tree_ownership.py

      - name: Run canonical relocation parity validator
        run: python scripts/check_ai_file_tree.py

      - name: Run canonical AI-tree regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_ai_file_tree.py

  ownership-independent:
    name: Independent exact-head ownership graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Run ownership graph regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_ai_file_tree_ownership.py

      - name: Emit independent ownership receipt
        run: >-
          python scripts/check_ai_file_tree_ownership.py
          --evidence-out .vol051-repository-architecture.json
          --print-evidence

      - name: Assert exact-head ownership identity and coverage
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".vol051-repository-architecture.json")
              .read_text(encoding="utf-8")
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("VOL-051 receipt does not bind exact head")
          if receipt.get("volume") != "VOL-051":
              raise SystemExit("ownership verifier bound wrong volume")
          if receipt.get("verifier") != "independent-ai-file-tree-ownership-v1":
              raise SystemExit("unexpected VOL-051 verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent VOL-051 ownership verification failed")
          tracked = receipt.get("tracked_file_count", 0)
          owned = receipt.get("owned_file_count", -1)
          if tracked <= 0 or tracked != owned:
              raise SystemExit("AI-tree ownership coverage is incomplete")
          if receipt.get("mapping_owner_count", 0) <= 0:
              raise SystemExit("mapping ownership set is empty")
          if receipt.get("native_owner_count", 0) <= 0:
              raise SystemExit("native ownership set is empty")
          if not receipt.get("direct_ai_roots"):
              raise SystemExit("AI-tree root coverage is empty")
          if len(receipt.get("ownership_graph_digest") or "") != 64:
              raise SystemExit("ownership graph digest is invalid")
          if len(receipt.get("receipt_digest") or "") != 64:
              raise SystemExit("ownership receipt digest is invalid")
          print(
              "VOL-051 independent exact-head ownership receipt:",
              expected,
              receipt["receipt_digest"],
          )
          PY
