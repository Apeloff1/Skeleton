name: P1 Routing Context Quality Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/intelligence/routing_context_receipt.py"
      - "skeleton/ai/runtime/intelligence/routing_context_receipt.py"
      - "skeleton/intelligence/__init__.py"
      - "skeleton/ai/runtime/intelligence/__init__.py"
      - "skeleton/frontier/model_routing.py"
      - "skeleton/frontier/runtime/model_routing.py"
      - "skeleton/intelligence/admission.py"
      - "skeleton/intelligence/quality.py"
      - "skeleton/context/compiler.py"
      - "skeleton/context/policy.py"
      - "skeleton/testing/test_routing_context_receipt.py"
      - "tests/test_model_routing.py"
      - "skeleton/testing/test_context_compiler.py"
      - "machine/ai_p1_task_backlog.json"
      - "scripts/emit_p1_promotion_evidence.py"
      - ".github/workflows/p1-intel-routing-context.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/intelligence/routing_context_receipt.py"
      - "skeleton/ai/runtime/intelligence/routing_context_receipt.py"
      - "skeleton/intelligence/__init__.py"
      - "skeleton/ai/runtime/intelligence/__init__.py"
      - "skeleton/frontier/model_routing.py"
      - "skeleton/frontier/runtime/model_routing.py"
      - "skeleton/intelligence/admission.py"
      - "skeleton/intelligence/quality.py"
      - "skeleton/context/compiler.py"
      - "skeleton/context/policy.py"
      - "skeleton/testing/test_routing_context_receipt.py"
      - "tests/test_model_routing.py"
      - "skeleton/testing/test_context_compiler.py"
      - "machine/ai_p1_task_backlog.json"
      - "scripts/emit_p1_promotion_evidence.py"
      - ".github/workflows/p1-intel-routing-context.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-intel-routing-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate P1 routing/context receipt spine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"
          "pytest-asyncio>=0.24,<2"

      - name: Verify canonical AI mirror parity
        run: >-
          cmp
          skeleton/intelligence/routing_context_receipt.py
          skeleton/ai/runtime/intelligence/routing_context_receipt.py

      - name: Compile receipt and routing surfaces
        run: >-
          python -m compileall -q
          skeleton/intelligence/routing_context_receipt.py
          skeleton/ai/runtime/intelligence/routing_context_receipt.py
          skeleton/frontier/runtime/model_routing.py
          skeleton/context
          skeleton/intelligence/admission.py
          skeleton/intelligence/quality.py

      - name: Run INTEL-01 focused regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_routing_context_receipt.py
          tests/test_model_routing.py
          skeleton/testing/test_context_compiler.py

      - name: Emit exact-head INTEL-01 evidence receipt
        run: |
          set -euo pipefail
          mkdir -p .p1-intel-01
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          evidence_files = [
              "skeleton/intelligence/routing_context_receipt.py",
              "skeleton/ai/runtime/intelligence/routing_context_receipt.py",
              "skeleton/testing/test_routing_context_receipt.py",
              "tests/test_model_routing.py",
              "skeleton/testing/test_context_compiler.py",
          ]

          def digest_files(names):
              h = hashlib.sha256()
              for name in names:
                  data = Path(name).read_bytes()
                  h.update(name.encode("utf-8"))
                  h.update(b"\0")
                  h.update(data)
                  h.update(b"\0")
              return h.hexdigest()

          refs = [
              {
                  "source": name,
                  "digest": hashlib.sha256(Path(name).read_bytes()).hexdigest(),
                  "category": "repository_state",
              }
              for name in evidence_files
          ]
          Path(".p1-intel-01/refs.json").write_text(
              json.dumps(refs, sort_keys=True),
              encoding="utf-8",
          )
          Path(".p1-intel-01/config.digest").write_text(
              digest_files(["machine/ai_p1_task_backlog.json"]),
              encoding="utf-8",
          )
          Path(".p1-intel-01/environment.digest").write_text(
              hashlib.sha256(b"ubuntu-24.04|python-3.11.16").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-intel-01/verifier.digest").write_text(
              digest_files(
                  [
                      "skeleton/intelligence/routing_context_receipt.py",
                      ".github/workflows/p1-intel-routing-context.yml",
                      "scripts/emit_p1_promotion_evidence.py",
                  ]
              ),
              encoding="utf-8",
          )
          Path(".p1-intel-01/tests.digest").write_text(
              digest_files(
                  [
                      "skeleton/testing/test_routing_context_receipt.py",
                      "tests/test_model_routing.py",
                      "skeleton/testing/test_context_compiler.py",
                  ]
              ),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py             --repository Apeloff1/Skeleton             --commit-sha "$EXPECTED_SHA"             --expected-head "$EXPECTED_SHA"             --task-id P1-INTEL-01             --accountability-id ACC-P1-INTEL-01             --configuration-digest "$(cat .p1-intel-01/config.digest)"             --environment-digest "$(cat .p1-intel-01/environment.digest)"             --verifier-id github-actions:p1-intel-routing-context             --verifier-digest "$(cat .p1-intel-01/verifier.digest)"             --test-manifest-digest "$(cat .p1-intel-01/tests.digest)"             --run-id "$RUN_IDENTITY"             --run-attempt "$RUN_ATTEMPT"             --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --evidence-file .p1-intel-01/refs.json             --out .p1-intel-01/receipt.json             > .p1-intel-01/stdout.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-intel-01/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("INTEL-01 receipt does not bind exact head")
          if receipt["task_id"] != "P1-INTEL-01":
              raise SystemExit("INTEL-01 task identity drift")
          if receipt["accountability_id"] != "ACC-P1-INTEL-01":
              raise SystemExit("INTEL-01 accountability identity drift")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print(
              "P1 INTEL-01 evidence receipt OK:",
              receipt["subject_digest"],
              receipt["receipt_digest"],
          )
          PY
