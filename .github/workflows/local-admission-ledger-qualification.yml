name: Local admission ledger qualification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: local-admission-ledger-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  local_ledger:
    name: Exact-head SQLite admission ledger regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.16'
      - name: Install focused runner
        run: python -m pip install --disable-pip-version-check --no-input 'pytest==8.4.2'
      - name: Compile and test local ledger custody
        run: |
          python -m compileall -q skeleton/admission
          python -m pytest -q --noconftest --import-mode=importlib skeleton/testing/test_admission_lease.py
