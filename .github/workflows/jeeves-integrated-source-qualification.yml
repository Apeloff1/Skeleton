name: Jeeves integrated mirror and local-AI CI qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_file_tree.json"
      - "skeleton/jeeves/**"
      - "skeleton/ai/agents/jeeves/**"
      - "skeleton/ai/runtime/production_fabric/product/cli.py"
      - "skeleton/testing/test_ai_flight_http.py"
      - "skeleton/testing/test_ai_knowledge_plane.py"
      - "skeleton/testing/test_ai_flight_context_admission.py"
      - "skeleton/testing/test_ai_git_knowledge.py"
      - "skeleton/testing/test_ai_native_daemon.py"
      - "skeleton/testing/test_ai_native_daemon_ops.py"
      - "skeleton/testing/test_jeeves_native_durable_cli.py"
      - "skeleton/testing/test_offline_cognition_duplicate_filter_evidence.py"
      - "tests/test_ci_portable_native_ai_fixtures.py"
      - ".github/workflows/jeeves-integrated-source-qualification.yml"

permissions:
  contents: read

concurrency:
  group: jeeves-integrated-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  canonical_parity_and_architecture:
    name: Jeeves canonical mirror, source index and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install canonical Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Verify canonical AI mirror and exact source object identities
        run: python scripts/check_ai_file_tree.py
      - name: Deny upward API and architecture dependency violations
        run: python scripts/check_architecture_boundaries.py
      - name: Verify committed tree source identities and portable test roots
        run: |
          python -m pip install --disable-pip-version-check \
            "PyYAML>=6,<7" "pytest>=8,<9" "pytest-asyncio>=0.24,<2" \
            "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0" \
            "fastapi>=0.142.2,<1" "pydantic>=2.14.1,<3" \
            "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2" \
            "numpy>=2,<3" "Pillow>=13.0.0,<14" "regex>=2026.9.29,<2027"
          python -m pytest -q tests/test_repository_integration.py tests/test_ci_portable_native_ai_fixtures.py

  native_sqlite_ci_fixture_regressions:
    name: Host-portable offline native AI and SQLite acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install canonical Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install existing local-native fixture dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6,<7" "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
          "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0"
          "fastapi>=0.142.2,<1" "pydantic>=2.14.1,<3"
          "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2"
          "numpy>=2,<3" "Pillow>=13.0.0,<14" "regex>=2026.9.29,<2027"
      - name: Compile changed local AI and replay fixtures
        run: |
          python -m compileall -q skeleton/testing/test_ai_flight_http.py skeleton/testing/test_ai_knowledge_plane.py skeleton/testing/test_ai_flight_context_admission.py skeleton/testing/test_ai_git_knowledge.py skeleton/testing/test_ai_native_daemon.py skeleton/testing/test_ai_native_daemon_ops.py skeleton/testing/test_jeeves_native_durable_cli.py skeleton/testing/test_offline_cognition_duplicate_filter_evidence.py
      - name: Verify host-portable actual SQLite and flight fixture semantics
        env:
          PYTHONPATH: ".:backend"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q --maxfail=1 \
            skeleton/testing/test_ai_flight_http.py \
            skeleton/testing/test_ai_knowledge_plane.py \
            skeleton/testing/test_ai_flight_context_admission.py \
            skeleton/testing/test_ai_git_knowledge.py \
            skeleton/testing/test_ai_native_daemon.py \
            skeleton/testing/test_ai_native_daemon_ops.py \
            skeleton/testing/test_jeeves_native_durable_cli.py \
            skeleton/testing/test_offline_cognition_duplicate_filter_evidence.py
