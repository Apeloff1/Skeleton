name: Native Qualification Report Custody

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-report-custody-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report_custody:
    name: Bounded canonical native report and ancestry regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.16'
      - name: Install existing portable native qualification dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6,<7" "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
          "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0"
          "fastapi>=0.142.2,<1" "pydantic>=2.14.1,<3"
          "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2,<51"
          "numpy>=2,<3" "Pillow>=13.0.0,<14" "regex>=2026.9.29,<2027"
      - name: Compile and execute actual native report regression suite
        env:
          PYTHONPATH: '.'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m compileall -q skeleton/ai/runtime/operational_ai/deployment/qualification/paths.py skeleton/ai/runtime/operational_ai/deployment/qualification/proof.py skeleton/ai/runtime/operational_ai/deployment/qualification/verification.py skeleton/testing/test_ai_real_model_qualification.py skeleton/testing/test_ai_qualification_proof_boundaries_20261111.py
          python -m pytest -q --noconftest skeleton/testing/test_ai_real_model_qualification.py skeleton/testing/test_ai_qualification_proof_boundaries_20261111.py
          python scripts/check_ai_file_tree.py
