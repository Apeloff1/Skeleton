name: AI Closure Evidence Contract

on:
  pull_request:
    paths:
      - "machine/ai_closure_evidence.json"
      - "machine/ai_app_construction.json"
      - "scripts/check_ai_closure_evidence.py"
      - "skeleton/testing/test_ai_closure_evidence.py"
      - ".github/workflows/ai-closure-evidence.yml"
  push:
    branches: [main]
    paths:
      - "machine/ai_closure_evidence.json"
      - "machine/ai_app_construction.json"
      - "scripts/check_ai_closure_evidence.py"
      - "skeleton/testing/test_ai_closure_evidence.py"
      - ".github/workflows/ai-closure-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-closure-evidence-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - run: python scripts/check_ai_closure_evidence.py
      - run: python -m pytest -q --noconftest skeleton/testing/test_ai_closure_evidence.py
