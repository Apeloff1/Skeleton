name: Independent reviewer TLS and scoped execution qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/independent-reviewer-qualification.yml'
      - 'scripts/independent_reviewer_policy.py'
      - 'skeleton/app/reviewer_client_configuration.py'
      - 'scripts/serve_independent_reviewer.py'
      - 'skeleton/ai/runtime/inference/*reviewer*.py'
      - 'skeleton/ai/runtime/inference/engine_submission_snapshot.py'
      - 'skeleton/ai/runtime/inference/guarded_service.py'
      - 'skeleton/ai/runtime/inference/native_guard_binding.py'
      - 'skeleton/testing/test_independent_reviewer_service.py'
      - 'skeleton/testing/test_scoped_reviewer_attestation.py'

permissions:
  contents: read

concurrency:
  group: independent-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated_tls:
    name: Exact-head real loopback mTLS reviewer and scoped execution custody
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install existing canonical source dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e . 'pytest>=8,<9' 'numpy>=2,<3' 'Pillow>=13.0.0,<14'
      - name: Syntax and focused independent reviewer qualification
        run: |
          python -m py_compile scripts/independent_reviewer_policy.py scripts/serve_independent_reviewer.py
          python -m pytest -q --noconftest --maxfail=1 skeleton/testing/test_independent_reviewer_service.py skeleton/testing/test_scoped_reviewer_attestation.py skeleton/testing/test_signed_reviewer_client.py skeleton/testing/test_reviewer_custody.py
          echo "Ephemeral loopback mutual TLS and source custody tests only; no production signer or data migration."
