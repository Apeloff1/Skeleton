name: P1 Terminal Evidence Bundle Gate

on:
  push:
    branches:
      - main
    paths:
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/contracts/p1_terminal_evidence.py"
      - "skeleton/ai/runtime/contracts/p1_terminal_evidence.py"
      - "machine/p1_terminal_evidence_policy.json"
      - "scripts/check_p1_terminal_evidence_policy.py"
      - "scripts/build_p1_terminal_evidence.py"
      - "scripts/reconcile_p1_maturity.py"
      - "skeleton/testing/test_p1_terminal_evidence.py"
      - "tests/test_p1_terminal_evidence_policy.py"
      - ".github/workflows/p1-terminal-evidence-bundle.yml"
  pull_request:
    branches:
      - main
      - p1/distributed-lane-materialize-20260928
      - p1/dist-06-forecast-anomaly-loop-20260928
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/contracts/p1_terminal_evidence.py"
      - "skeleton/ai/runtime/contracts/p1_terminal_evidence.py"
      - "machine/p1_terminal_evidence_policy.json"
      - "scripts/check_p1_terminal_evidence_policy.py"
      - "scripts/build_p1_terminal_evidence.py"
      - "scripts/reconcile_p1_maturity.py"
      - "skeleton/testing/test_p1_terminal_evidence.py"
      - "tests/test_p1_terminal_evidence_policy.py"
      - ".github/workflows/p1-terminal-evidence-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-terminal-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate terminal exact-head P1 evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install terminal verification runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "pytest>=8,<9"

      - name: Compile PROM-01 contracts and builders
        run: >-
          python -m compileall -q
          skeleton/contracts/p1_terminal_evidence.py
          skeleton/ai/runtime/contracts/p1_terminal_evidence.py
          scripts/check_p1_terminal_evidence_policy.py
          scripts/build_p1_terminal_evidence.py

      - name: Validate terminal evidence policy
        run: >-
          python scripts/check_p1_terminal_evidence_policy.py
          --print-summary

      - name: Run PROM-01 contract and policy mutations
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_p1_terminal_evidence.py
          tests/test_p1_terminal_evidence_policy.py

      - name: Run canonical skeleton dependency slices
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_architecture_scope_freeze.py
          skeleton/testing/test_shadow_traffic.py
          skeleton/testing/test_failure_knowledge.py
          skeleton/testing/test_disaster_recovery_qualification.py
          skeleton/testing/test_release_attribution.py
          skeleton/testing/test_forecasting_engine.py
          skeleton/testing/test_cost_anomaly_detection.py
          skeleton/testing/test_core_intelligence_bundle.py
          skeleton/testing/test_safe_autonomy_bundle.py

      - name: Run backend dependency slices separately
        run: |
          python -m pytest -q --noconftest backend/tests/test_durable_user_control_receipts.py
          python -m pytest -q --noconftest backend/tests/test_tenant_storage_boundary.py

      - name: Run repository-root dependency slices separately
        run: |
          python -m pytest -q --noconftest tests/test_p1_failure_knowledge.py
          python -m pytest -q --noconftest tests/test_p1_release_attribution.py

      - name: Validate canonical AI file tree parity
        run: python scripts/check_ai_file_tree.py

      - name: Generate non-mutating P1 maturity report
        run: |
          mkdir -p .p1-prom-01
          python scripts/reconcile_p1_maturity.py \
            --out .p1-prom-01/maturity.json \
            --print-report \
            > .p1-prom-01/maturity.stdout.txt

      - name: Build ten exact-head terminal dependency receipts
        run: |
          python scripts/build_p1_terminal_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --maturity-report .p1-prom-01/maturity.json \
            --out .p1-prom-01/bundle.json \
            --refs-out .p1-prom-01/refs.json

      - name: Assert structural bundle and expose promotion blockers
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          bundle = json.loads(
              Path(".p1-prom-01/bundle.json").read_text(encoding="utf-8")
          )
          if bundle["accepted"] is not True:
              raise SystemExit("PROM-01 structural bundle rejected")
          if bundle["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("PROM-01 bundle exact-head mismatch")
          if bundle["receipt_count"] != 10:
              raise SystemExit("PROM-01 terminal receipt count mismatch")
          if bundle["primary_volume_count"] < 1:
              raise SystemExit("PROM-01 primary volume coverage empty")
          if bundle["promotion_authority"] is not False:
              raise SystemExit("PROM-01 cannot carry promotion authority")
          if bundle["signed_promotion"] is not False:
              raise SystemExit("PROM-01 cannot sign promotion")
          print(
              "PROM-01 bundle accepted",
              "promotion_ready=", bundle["promotion_ready"],
              "blocking_volumes=", len(bundle["blocking_volume_keys"]),
              "blockers=", len(bundle["promotion_blockers"]),
          )
          PY

      - name: Emit exact-head PROM-01 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-prom-01/config.digest").write_text(
              hashlib.sha256(
                  Path("machine/p1_terminal_evidence_policy.json").read_bytes()
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-prom-01/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|prom-01"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-prom-01/verifier.digest").write_text(
              digest([
                  "skeleton/contracts/p1_terminal_evidence.py",
                  "scripts/check_p1_terminal_evidence_policy.py",
                  "scripts/build_p1_terminal_evidence.py",
                  "scripts/reconcile_p1_maturity.py",
                  "machine/p1_terminal_evidence_policy.json",
                  ".github/workflows/p1-terminal-evidence-bundle.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-prom-01/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_p1_terminal_evidence.py",
                  "tests/test_p1_terminal_evidence_policy.py",
                  "skeleton/testing/test_architecture_scope_freeze.py",
                  "backend/tests/test_durable_user_control_receipts.py",
                  "backend/tests/test_tenant_storage_boundary.py",
                  "skeleton/testing/test_shadow_traffic.py",
                  "skeleton/testing/test_failure_knowledge.py",
                  "tests/test_p1_failure_knowledge.py",
                  "skeleton/testing/test_disaster_recovery_qualification.py",
                  "skeleton/testing/test_release_attribution.py",
                  "tests/test_p1_release_attribution.py",
                  "skeleton/testing/test_forecasting_engine.py",
                  "skeleton/testing/test_cost_anomaly_detection.py",
                  "skeleton/testing/test_core_intelligence_bundle.py",
                  "skeleton/testing/test_safe_autonomy_bundle.py",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-PROM-01 \
            --accountability-id ACC-P1-PROM-01 \
            --configuration-digest "$(cat .p1-prom-01/config.digest)" \
            --environment-digest "$(cat .p1-prom-01/environment.digest)" \
            --verifier-id github-actions:p1-terminal-evidence-bundle \
            --verifier-digest "$(cat .p1-prom-01/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-prom-01/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-prom-01/refs.json \
            --out .p1-prom-01/receipt.json \
            > .p1-prom-01/receipt.stdout.json

      - name: Assert exact-head PROM-01 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-prom-01/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("PROM-01 receipt head mismatch")
          if receipt["task_id"] != "P1-PROM-01":
              raise SystemExit("PROM-01 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-PROM-01":
              raise SystemExit("PROM-01 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("PROM-01 exact-head receipt OK", receipt["receipt_digest"])
          PY
