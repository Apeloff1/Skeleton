name: Drain superseded Actions queue

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

# Keep one cleanup run alive while main is moving rapidly. GitHub still keeps
# at most one pending run for this group, so newer pushes coalesce without
# killing the active drainer before it can finish its multi-pass sweep.
concurrency:
  group: queue-drain-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  drain:
    # Run cleanup off the normal x64 pool. The write token exists only for this
    # job and is used only to cancel obsolete or duplicate Actions runs.
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel obsolete and superseded Actions runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          api = 'https://api.github.com'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'skeleton-queue-drainer',
          }
          RETRYABLE_STATUSES = frozenset({0, 429, 500, 502, 503, 504})

          def request(path, *, method='GET'):
              req = urllib.request.Request(
                  api + path,
                  data=b'' if method != 'GET' else None,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  return exc.code, None
              except urllib.error.URLError:
                  # Treat transport failures as retryable by mutation callers
                  # instead of crashing the whole queue-drain process.
                  return 0, None

          def cancel_run(run_id):
              status = 0
              for attempt in range(1, 4):
                  status, _ = request(
                      f'/repos/{repo}/actions/runs/{run_id}/cancel',
                      method='POST',
                  )
                  if status not in RETRYABLE_STATUSES:
                      return status
                  if attempt < 3:
                      delay = 2 ** (attempt - 1)
                      print(
                          f'cancel retry: id={run_id} status={status} '
                          f'attempt={attempt}/3 sleep={delay}s'
                      )
                      time.sleep(delay)
              return status

          def resolve_main_sha():
              status, branch = request(f'/repos/{repo}/branches/main')
              if status != 200 or not isinstance(branch, dict):
                  raise SystemExit(f'failed to resolve main HEAD: HTTP {status}')
              sha = ((branch.get('commit') or {}).get('sha') or '').strip()
              if not sha:
                  raise SystemExit('failed to resolve main HEAD SHA')
              return sha

          def list_runs(run_status):
              runs = []
              for page in range(1, 11):
                  query = urllib.parse.urlencode({
                      'status': run_status,
                      'per_page': 100,
                      'page': page,
                  })
                  status, payload = request(f'/repos/{repo}/actions/runs?{query}')
                  if status != 200 or not isinstance(payload, dict):
                      raise SystemExit(
                          f'failed to list {run_status} runs: HTTP {status}'
                      )
                  batch = payload.get('workflow_runs') or []
                  runs.extend(batch)
                  if len(batch) < 100:
                      break
              return runs

          def list_head_runs(head_sha):
              runs = []
              for page in range(1, 11):
                  query = urllib.parse.urlencode({
                      'head_sha': head_sha,
                      'per_page': 100,
                      'page': page,
                  })
                  status, payload = request(f'/repos/{repo}/actions/runs?{query}')
                  if status != 200 or not isinstance(payload, dict):
                      raise SystemExit(
                          f'failed to list current-head runs: HTTP {status}'
                      )
                  batch = payload.get('workflow_runs') or []
                  runs.extend(batch)
                  if len(batch) < 100:
                      break
              return runs

          def workflow_event_key(run):
              return (
                  int(run.get('workflow_id') or 0),
                  run.get('event') or '',
              )

          def queue_key(run):
              return (
                  int(run.get('workflow_id') or 0),
                  run.get('head_branch') or '',
                  run.get('event') or '',
              )

          def is_usable_replacement(run):
              # A failed current-head validation is still authoritative and
              # supersedes older code. A cancelled run produced no usable
              # validation result and therefore must not evict the last one.
              return not (
                  run.get('status') == 'completed'
                  and run.get('conclusion') == 'cancelled'
              )

          attempted = set()
          transient_pending = set()
          totals = {
              'queued_inspected': 0,
              'active_inspected': 0,
              'selected': 0,
              'obsolete_main': 0,
              'duplicate': 0,
              'stale_dynamic_active': 0,
              'preserved_last_validation': 0,
              'preserved_dynamic_without_replacement': 0,
              'accepted': 0,
              'moved': 0,
              'deferred': 0,
              'failed': 0,
          }
          pass_lines = []
          latest_main_sha = ''

          # GitHub-managed security and dependency runs can arrive several
          # seconds after a push. Sweep repeatedly so delayed fanout is folded
          # into one cleanup run. Path-filtered workflows need extra care: an
          # older SHA is cancellable only when current HEAD has a replacement
          # run for that workflow/event. Otherwise preserve the newest pending
          # validation so a test/docs-only push cannot erase the last relevant
          # code validation merely by advancing main.
          for pass_number in range(1, 5):
              main_sha = resolve_main_sha()
              latest_main_sha = main_sha
              head_runs = list_head_runs(main_sha)
              replacement_keys = {
                  workflow_event_key(run)
                  for run in head_runs
                  if is_usable_replacement(run)
              }
              queued = list_runs('queued')
              active = list_runs('in_progress')
              live_ids = {
                  int(run.get('id') or 0)
                  for run in [*queued, *active]
                  if int(run.get('id') or 0)
              }
              # If a previously deferred run left the queue between passes,
              # GitHub already moved or completed it; it is no longer unresolved.
              transient_pending.intersection_update(live_ids)
              totals['queued_inspected'] += len(queued)
              totals['active_inspected'] += len(active)

              seen = set()
              selected = []
              obsolete_main = 0
              duplicate = 0
              stale_dynamic_active = 0
              preserved_last_validation = 0
              preserved_dynamic_without_replacement = 0

              for run in sorted(
                  queued,
                  key=lambda item: item.get('created_at') or '',
                  reverse=True,
              ):
                  run_id = int(run.get('id') or 0)
                  if not run_id or run_id == current or run_id in attempted:
                      continue

                  key = queue_key(run)
                  replacement_key = workflow_event_key(run)
                  branch = run.get('head_branch') or ''
                  old_main = (
                      branch == 'main'
                      and (run.get('head_sha') or '') != main_sha
                  )

                  if old_main:
                      if replacement_key in replacement_keys:
                          selected.append(run)
                          obsolete_main += 1
                          continue

                      # No current-head replacement exists. Preserve the newest
                      # outstanding run for this workflow/ref/event and cancel
                      # only older copies of that same validation lane.
                      if key in seen:
                          selected.append(run)
                          duplicate += 1
                      else:
                          seen.add(key)
                          preserved_last_validation += 1
                      continue

                  if key in seen:
                      selected.append(run)
                      duplicate += 1
                  else:
                      seen.add(key)

              for run in active:
                  run_id = int(run.get('id') or 0)
                  path = run.get('path') or ''
                  if not run_id or run_id == current or run_id in attempted:
                      continue
                  if (
                      (run.get('head_branch') or '') == 'main'
                      and (run.get('head_sha') or '') != main_sha
                      and path.startswith('dynamic/')
                  ):
                      if workflow_event_key(run) in replacement_keys:
                          selected.append(run)
                          stale_dynamic_active += 1
                      else:
                          preserved_dynamic_without_replacement += 1

              accepted = moved = deferred = failed = 0
              for run in selected:
                  run_id = int(run['id'])
                  status = cancel_run(run_id)
                  if status in {200, 202}:
                      attempted.add(run_id)
                      transient_pending.discard(run_id)
                      accepted += 1
                  elif status in {404, 409, 422}:
                      attempted.add(run_id)
                      transient_pending.discard(run_id)
                      moved += 1
                  elif status in RETRYABLE_STATUSES:
                      # Keep the run eligible for a later sweep. A short-lived
                      # GitHub API outage is not a permanent cancellation error.
                      transient_pending.add(run_id)
                      deferred += 1
                      print(
                          f'cancel deferred: id={run_id} status={status} '
                          f'pass={pass_number}'
                      )
                  else:
                      attempted.add(run_id)
                      transient_pending.discard(run_id)
                      failed += 1
                      print(f'cancel failed: id={run_id} status={status}')

              totals['selected'] += len(selected)
              totals['obsolete_main'] += obsolete_main
              totals['duplicate'] += duplicate
              totals['stale_dynamic_active'] += stale_dynamic_active
              totals['preserved_last_validation'] += preserved_last_validation
              totals['preserved_dynamic_without_replacement'] += (
                  preserved_dynamic_without_replacement
              )
              totals['accepted'] += accepted
              totals['moved'] += moved
              totals['deferred'] += deferred
              totals['failed'] += failed

              line = (
                  f'pass={pass_number} main_sha={main_sha} queued={len(queued)} '
                  f'active={len(active)} selected={len(selected)} '
                  f'obsolete_main={obsolete_main} duplicate={duplicate} '
                  f'stale_dynamic_active={stale_dynamic_active} '
                  f'preserved_last_validation={preserved_last_validation} '
                  'preserved_dynamic_without_replacement='
                  f'{preserved_dynamic_without_replacement} '
                  f'accepted={accepted} moved={moved} deferred={deferred} '
                  f'failed={failed}'
              )
              print(line)
              pass_lines.append(line)

              if pass_number < 4:
                  time.sleep(8)

          unresolved_transient = len(transient_pending)
          print(
              'totals '
              + ' '.join(f'{key}={value}' for key, value in totals.items())
              + f' unresolved_transient={unresolved_transient}'
          )

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## Actions queue drain\n')
                  handle.write(f'- Latest live main SHA: `{latest_main_sha}`\n')
                  handle.write('- Sweep passes: 4 over ~24 seconds\n')
                  handle.write(
                      f'- Queued observations: {totals["queued_inspected"]}\n'
                  )
                  handle.write(
                      f'- Active observations: {totals["active_inspected"]}\n'
                  )
                  handle.write(
                      f'- Obsolete main selections: {totals["obsolete_main"]}\n'
                  )
                  handle.write(
                      f'- Duplicate selections: {totals["duplicate"]}\n'
                  )
                  handle.write(
                      '- Stale dynamic in-progress selections: '
                      f'{totals["stale_dynamic_active"]}\n'
                  )
                  handle.write(
                      '- Last path-filtered validations preserved: '
                      f'{totals["preserved_last_validation"]}\n'
                  )
                  handle.write(
                      '- Dynamic active runs preserved without replacement: '
                      f'{totals["preserved_dynamic_without_replacement"]}\n'
                  )
                  handle.write(
                      f'- Cancel requests accepted: {totals["accepted"]}\n'
                  )
                  handle.write(
                      f'- Already moved/completed: {totals["moved"]}\n'
                  )
                  handle.write(
                      f'- Transient cancellations deferred: {totals["deferred"]}\n'
                  )
                  handle.write(
                      f'- Transient cancellations still live: {unresolved_transient}\n'
                  )
                  handle.write(
                      f'- Terminal cancellation failures: {totals["failed"]}\n'
                  )
                  handle.write(
                      '- Safety: current main HEAD, the newest outstanding '
                      'validation for path-filtered workflows without a HEAD '
                      'replacement, normal in-progress CI/deployments, and PR '
                      'work are preserved.\n'
                  )
                  handle.write('\n### Passes\n')
                  for line in pass_lines:
                      handle.write(f'- `{line}`\n')

          if totals['failed']:
              raise SystemExit(
                  f'queue drain had {totals["failed"]} terminal cancellation failure(s)'
              )
          PY