name: Drain superseded Actions queue

on:
  workflow_dispatch:

concurrency:
  group: queue-drain-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  drain:
    # Recovery stays manual and off the normal x64 pool. The write token exists
    # only for this job and is used only to cancel older queued duplicates.
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel only superseded queued duplicates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          api = 'https://api.github.com'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'skeleton-queue-drainer',
          }

          def request(path, *, method='GET'):
              req = urllib.request.Request(
                  api + path,
                  data=b'' if method != 'GET' else None,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  return exc.code, None

          queued = []
          for page in range(1, 11):
              query = urllib.parse.urlencode({
                  'status': 'queued',
                  'per_page': 100,
                  'page': page,
              })
              status, payload = request(f'/repos/{repo}/actions/runs?{query}')
              if status != 200 or not isinstance(payload, dict):
                  raise SystemExit(f'failed to list queued runs: HTTP {status}')
              batch = payload.get('workflow_runs') or []
              queued.extend(batch)
              if len(batch) < 100:
                  break

          # Newest run for each workflow/ref/event tuple is always preserved.
          # Only older runs that are still queued are eligible for cancellation.
          seen = set()
          selected = []
          for run in sorted(queued, key=lambda item: item.get('created_at') or '', reverse=True):
              run_id = int(run.get('id') or 0)
              if run_id == current:
                  continue
              key = (
                  int(run.get('workflow_id') or 0),
                  run.get('head_branch') or '',
                  run.get('event') or '',
              )
              if key in seen:
                  selected.append(run)
              else:
                  seen.add(key)

          accepted = moved = failed = 0
          for run in selected:
              run_id = int(run['id'])
              status, _ = request(
                  f'/repos/{repo}/actions/runs/{run_id}/cancel',
                  method='POST',
              )
              if status in {200, 202}:
                  accepted += 1
              elif status in {404, 409, 422}:
                  moved += 1
              else:
                  failed += 1
                  print(f'cancel failed: id={run_id} status={status}')

          print(
              f'inspected={len(queued)} selected={len(selected)} '
              f'accepted={accepted} moved={moved} failed={failed}'
          )

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## Actions queue drain\n')
                  handle.write(f'- Queued runs inspected: {len(queued)}\n')
                  handle.write(f'- Older duplicate runs selected: {len(selected)}\n')
                  handle.write(f'- Cancel requests accepted: {accepted}\n')
                  handle.write(f'- Already moved/completed: {moved}\n')
                  handle.write(f'- Cancellation failures: {failed}\n')
                  handle.write('- Safety: in-progress work is never cancelled; the newest queued run for every workflow/ref/event tuple is always preserved.\n')

          if failed:
              raise SystemExit(f'queue drain had {failed} cancellation failure(s)')
          PY
