name: Drain superseded Actions queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/queue-drain.yml'

concurrency:
  group: queue-drain-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  drain:
    # Keep recovery off the saturated x64 pool.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel stale active runs and superseded queued runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          api = 'https://api.github.com'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'skeleton-queue-drainer',
          }

          def request_json(path, *, method='GET', attempts=5):
              url = api + path
              for attempt in range(1, attempts + 1):
                  req = urllib.request.Request(
                      url,
                      data=b'' if method != 'GET' else None,
                      headers=headers,
                      method=method,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          raw = response.read()
                          return response.status, json.loads(raw) if raw else None
                  except urllib.error.HTTPError as exc:
                      if exc.code in {403, 429, 500, 502, 503, 504} and attempt < attempts:
                          retry_after = exc.headers.get('Retry-After')
                          delay = float(retry_after) if retry_after else min(10.0, 0.75 * (2 ** (attempt - 1)))
                          time.sleep(delay)
                          continue
                      return exc.code, None
                  except (urllib.error.URLError, TimeoutError):
                      if attempt < attempts:
                          time.sleep(min(10.0, 0.75 * (2 ** (attempt - 1))))
                          continue
                      return 0, None
              return 0, None

          def list_collection(path, key=None, max_pages=100):
              out = []
              for page in range(1, max_pages + 1):
                  sep = '&' if '?' in path else '?'
                  status, payload = request_json(f'{path}{sep}per_page=100&page={page}')
                  if status != 200:
                      raise RuntimeError(f'failed listing {path} page {page}: HTTP {status}')
                  items = payload if isinstance(payload, list) else (payload.get(key) or [])
                  out.extend(items)
                  if len(items) < 100:
                      break
              return out

          def live_state():
              branches = {
                  item.get('name')
                  for item in list_collection(f'/repos/{repo}/branches', max_pages=20)
                  if item.get('name')
              }
              pulls = list_collection(f'/repos/{repo}/pulls?state=open', max_pages=10)
              open_numbers = {int(pr['number']) for pr in pulls if pr.get('number') is not None}
              open_heads = {
                  (pr.get('head') or {}).get('ref')
                  for pr in pulls
                  if (pr.get('head') or {}).get('ref')
              }
              return branches, open_numbers, open_heads

          def list_runs(status_name, max_pages=10):
              runs = []
              for page in range(1, max_pages + 1):
                  query = urllib.parse.urlencode({
                      'status': status_name,
                      'per_page': 100,
                      'page': page,
                  })
                  status, payload = request_json(f'/repos/{repo}/actions/runs?{query}')
                  if status != 200 or not isinstance(payload, dict):
                      raise RuntimeError(f'failed listing {status_name} runs page {page}: HTTP {status}')
                  batch = payload.get('workflow_runs') or []
                  runs.extend(batch)
                  if len(batch) < 100:
                      break
              return runs

          def pull_number_from_ref(branch):
              match = re.fullmatch(r'refs/pull/(\d+)/(?:head|merge)', branch or '')
              return int(match.group(1)) if match else None

          def stale_reason(run, branches, open_numbers, open_heads):
              if int(run['id']) == current:
                  return None
              event = run.get('event') or ''
              branch = run.get('head_branch') or ''
              linked_prs = {
                  int(pr['number'])
                  for pr in (run.get('pull_requests') or [])
                  if pr.get('number') is not None
              }
              if event in {'pull_request', 'pull_request_target'}:
                  stale = linked_prs.isdisjoint(open_numbers) if linked_prs else branch not in open_heads
                  return 'closed-pr' if stale else None
              if event == 'dynamic':
                  pr_number = pull_number_from_ref(branch)
                  if pr_number is not None and pr_number not in open_numbers:
                      return 'closed-dynamic-pr'
              if event == 'push' and branch and branch != 'main' and branch not in branches:
                  return 'deleted-branch'
              return None

          def cancel_one(run):
              run_id = int(run['id'])
              status, _ = request_json(
                  f'/repos/{repo}/actions/runs/{run_id}/cancel',
                  method='POST',
              )
              return run_id, status, run.get('_drain_reason') or '', run.get('name') or '', run.get('head_branch') or ''

          def cancel_batch(runs, label):
              accepted = moved = failed = 0
              if not runs:
                  print(f'{label}: nothing selected')
                  return accepted, moved, failed
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  futures = [pool.submit(cancel_one, run) for run in runs]
                  for index, future in enumerate(concurrent.futures.as_completed(futures), 1):
                      run_id, status, reason, name, branch = future.result()
                      if status in {200, 202}:
                          accepted += 1
                      elif status in {404, 409, 422}:
                          moved += 1
                      else:
                          failed += 1
                          print(f'cancel failed: id={run_id} status={status} reason={reason} name={name} branch={branch}')
                      if index % 100 == 0 or index == len(futures):
                          print(f'{label}: processed {index}/{len(futures)} accepted={accepted} moved={moved} failed={failed}')
              return accepted, moved, failed

          branches, open_numbers, open_heads = live_state()
          print(f'live state: branches={len(branches)} open_prs={len(open_numbers)}')

          totals = {
              'active_selected': 0,
              'queued_selected': 0,
              'accepted': 0,
              'moved': 0,
              'failed': 0,
          }
          reasons = {}

          # First free execution slots. Only stale active runs are cancelled;
          # live main/existing-branch work is never cancelled here.
          active = list_runs('in_progress', max_pages=10)
          stale_active = []
          for run in active:
              reason = stale_reason(run, branches, open_numbers, open_heads)
              if reason:
                  run['_drain_reason'] = 'active-' + reason
                  stale_active.append(run)
                  reasons['active-' + reason] = reasons.get('active-' + reason, 0) + 1
          totals['active_selected'] = len(stale_active)
          a, m, f = cancel_batch(stale_active, 'active')
          totals['accepted'] += a
          totals['moved'] += m
          totals['failed'] += f
          time.sleep(2)

          # Then peel the newest 1,000 queued runs repeatedly. Preserve the
          # newest run for each workflow/ref/event tuple, plus all live PR and
          # existing-branch work.
          for sweep in range(1, 9):
              if sweep in {1, 5}:
                  branches, open_numbers, open_heads = live_state()
              queued = list_runs('queued', max_pages=10)
              if not queued:
                  print(f'queue sweep {sweep}: queue empty')
                  break

              seen = set()
              selected = []
              preserved = 0
              for run in sorted(queued, key=lambda r: r.get('created_at') or '', reverse=True):
                  if int(run['id']) == current:
                      preserved += 1
                      continue
                  workflow_id = int(run.get('workflow_id') or 0)
                  branch = run.get('head_branch') or ''
                  event = run.get('event') or ''
                  key = (workflow_id, branch, event)
                  reason = stale_reason(run, branches, open_numbers, open_heads)
                  if reason:
                      run['_drain_reason'] = reason
                      selected.append(run)
                      reasons[reason] = reasons.get(reason, 0) + 1
                  elif key in seen:
                      run['_drain_reason'] = 'superseded-duplicate'
                      selected.append(run)
                      reasons['superseded-duplicate'] = reasons.get('superseded-duplicate', 0) + 1
                  else:
                      seen.add(key)
                      preserved += 1

              print(f'queue sweep {sweep}: inspected={len(queued)} preserved={preserved} selected={len(selected)}')
              if not selected:
                  break
              totals['queued_selected'] += len(selected)
              a, m, f = cancel_batch(selected, f'queue sweep {sweep}')
              totals['accepted'] += a
              totals['moved'] += m
              totals['failed'] += f
              if f > max(10, len(selected) // 20):
                  raise SystemExit(f'too many cancellation failures in sweep {sweep}: {f}')
              time.sleep(2)

          status, payload = request_json(
              f'/repos/{repo}/actions/runs?' + urllib.parse.urlencode({'status': 'queued', 'per_page': 1})
          )
          remaining = payload.get('total_count') if status == 200 and isinstance(payload, dict) else None
          status, active_payload = request_json(
              f'/repos/{repo}/actions/runs?' + urllib.parse.urlencode({'status': 'in_progress', 'per_page': 1})
          )
          active_remaining = active_payload.get('total_count') if status == 200 and isinstance(active_payload, dict) else None

          print(f'totals: {json.dumps(totals, sort_keys=True)}')
          print(f'reasons: {json.dumps(reasons, sort_keys=True)}')
          print(f'queued remaining: {remaining}')
          print(f'in-progress remaining: {active_remaining}')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write('## Actions backlog recovery\n')
                  fh.write(f"- Stale in-progress runs selected: {totals['active_selected']}\n")
                  fh.write(f"- Queued stale/superseded runs selected: {totals['queued_selected']}\n")
                  fh.write(f"- Cancel requests accepted: {totals['accepted']}\n")
                  fh.write(f"- Already moved/completed: {totals['moved']}\n")
                  fh.write(f"- Cancellation failures: {totals['failed']}\n")
                  fh.write(f'- Queued runs remaining: {remaining}\n')
                  fh.write(f'- In-progress runs remaining: {active_remaining}\n')
                  fh.write(f'- Reasons: `{json.dumps(reasons, sort_keys=True)}`\n')
                  fh.write('- Safety: open PRs, existing branches, current main work, and newest workflow/ref/event runs are preserved.\n')

          if totals['failed'] > max(10, (totals['active_selected'] + totals['queued_selected']) // 20):
              raise SystemExit(f"too many cancellation failures: {totals['failed']}")
          PY
