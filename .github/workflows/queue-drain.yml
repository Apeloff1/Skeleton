name: Drain superseded Actions queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/queue-drain.yml'

concurrency:
  group: queue-drain-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  drain:
    # Use the ARM hosted pool so this recovery job is not competing only with
    # the saturated ubuntu-latest queue it is intended to repair.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel only superseded queued runs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          api = 'https://api.github.com'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'skeleton-queue-drainer',
          }

          def request_json(path, *, method='GET', attempts=4):
              url = api + path
              for attempt in range(1, attempts + 1):
                  req = urllib.request.Request(
                      url,
                      data=b'' if method != 'GET' else None,
                      headers=headers,
                      method=method,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          raw = response.read()
                          return response.status, json.loads(raw) if raw else None
                  except urllib.error.HTTPError as exc:
                      if exc.code in {403, 429, 500, 502, 503, 504} and attempt < attempts:
                          retry_after = exc.headers.get('Retry-After')
                          delay = float(retry_after) if retry_after else min(8.0, 0.75 * (2 ** (attempt - 1)))
                          time.sleep(delay)
                          continue
                      return exc.code, None
                  except (urllib.error.URLError, TimeoutError):
                      if attempt < attempts:
                          time.sleep(min(8.0, 0.75 * (2 ** (attempt - 1))))
                          continue
                      return 0, None
              return 0, None

          queued = []
          page = 1
          while True:
              query = urllib.parse.urlencode({'status': 'queued', 'per_page': 100, 'page': page})
              status, payload = request_json(f'/repos/{repo}/actions/runs?{query}')
              if status != 200 or not isinstance(payload, dict):
                  raise SystemExit(f'failed to list queued runs on page {page}: HTTP {status}')
              runs = payload.get('workflow_runs') or []
              queued.extend(runs)
              if len(runs) < 100:
                  break
              page += 1

          # Preserve the newest queued run for every workflow/ref/event tuple.
          # This removes legacy duplicates without cancelling the current useful
          # attempt for a branch, pull request, scheduled task, or workflow.
          seen = set()
          keep = []
          cancel = []
          for run in sorted(queued, key=lambda r: r.get('created_at') or '', reverse=True):
              run_id = int(run['id'])
              key = (
                  int(run.get('workflow_id') or 0),
                  run.get('head_branch') or '',
                  run.get('event') or '',
              )
              if run_id == current:
                  keep.append(run)
                  seen.add(key)
              elif key in seen:
                  cancel.append(run)
              else:
                  seen.add(key)
                  keep.append(run)

          print(f'queued discovered: {len(queued)}')
          print(f'newest runs preserved: {len(keep)}')
          print(f'superseded duplicates selected: {len(cancel)}')

          def cancel_one(run):
              run_id = int(run['id'])
              status, _ = request_json(
                  f'/repos/{repo}/actions/runs/{run_id}/cancel',
                  method='POST',
                  attempts=5,
              )
              return run_id, status, run.get('name') or '', run.get('head_branch') or ''

          accepted = 0
          moved = 0
          failed = 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(cancel_one, run) for run in cancel]
              for index, future in enumerate(concurrent.futures.as_completed(futures), 1):
                  run_id, status, name, branch = future.result()
                  if status in {202, 200}:
                      accepted += 1
                  elif status in {404, 409, 422}:
                      moved += 1
                  else:
                      failed += 1
                      print(f'cancel failed: id={run_id} status={status} name={name} branch={branch}')
                  if index % 100 == 0 or index == len(futures):
                      print(f'processed {index}/{len(futures)} cancel candidates; accepted={accepted} moved={moved} failed={failed}')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write('## Actions queue drain\n')
                  fh.write(f'- Queued runs inspected: {len(queued)}\n')
                  fh.write(f'- Newest runs preserved: {len(keep)}\n')
                  fh.write(f'- Superseded duplicate runs selected: {len(cancel)}\n')
                  fh.write(f'- Cancel requests accepted: {accepted}\n')
                  fh.write(f'- Already moved/completed: {moved}\n')
                  fh.write(f'- Cancellation failures after retries: {failed}\n')
                  fh.write('- Safety rule: newest queued run per workflow/ref/event is always preserved.\n')

          # Fail only if the cancellation mechanism itself materially failed.
          if failed and failed > max(10, len(cancel) // 20):
              raise SystemExit(f'too many cancellation failures: {failed}')
          PY
