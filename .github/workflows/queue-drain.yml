name: Drain superseded Actions queue

on:
  workflow_dispatch:
  workflow_run:
    # Wake on terminal critical validation runs as well as the canonical merge
    # gate. The drainer independently proves every cancellation candidate, so
    # extra wakeups improve recovery latency without weakening fail-closed rules.
    workflows: ["Merge Readiness", "CI/CD", "Backend Quality", "Frontier Contracts"]
    types: [completed]
    branches: [main]
  schedule:
    # Avoid top-of-five-minute scheduler hotspots while preserving 5-minute cadence.
    - cron: "2-57/5 * * * *"
  push:
    branches: [main]
    paths: ['.github/workflows/queue-drain.yml']

# v3 escapes the queued v2 recovery generation while keeping one live run plus
# one coalesced pending run. Future triggers remain non-preemptive.
concurrency:
  group: queue-drain-v3-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  drain:
    # Any trusted terminal main Merge Readiness completion may wake recovery.
    # Requiring success starves the drainer precisely when queue pressure causes
    # canonical validation to fail, cancel, or time out. The drainer classifies
    # live state independently and remains fail-closed before mutation.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    permissions:
      actions: write
      contents: read
    # Queue recovery must not depend on the scarcer ARM lane it may be trying
    # to recover when repository-wide workflow fanout is saturated.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel obsolete workload runs without killing the control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          api = 'https://api.github.com'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'skeleton-queue-drainer',
          }
          retryable = frozenset({0, 429, 500, 502, 503, 504})

          # These workflows form the branch-flow / queue-recovery control plane.
          # They are designed either to follow a moving main, provide canonical
          # post-merge evidence, or reclaim stale queue capacity. They must never
          # be garbage-collected as stale workload merely because a newer commit
          # appears while they are queued.
          control_plane_paths = frozenset({
              '.github/workflows/actions-housekeeping-cli.yml',
              '.github/workflows/branch-clean.yml',
              '.github/workflows/branch-archive.yml',
              '.github/workflows/branch-flow.yml',
              '.github/workflows/branch-repair-100.yml',
              '.github/workflows/merge-readiness.yml',
              '.github/workflows/pr-obsolete-run-drain.yml',
              '.github/workflows/queue-drain.yml',
          })

          def request(path, *, method='GET'):
              req = urllib.request.Request(
                  api + path,
                  data=b'' if method != 'GET' else None,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  return exc.code, None
              except urllib.error.URLError:
                  return 0, None

          def post_with_retry(path):
              status = 0
              for attempt in range(3):
                  status, _ = request(path, method='POST')
                  if status not in retryable:
                      return status
                  if attempt < 2:
                      time.sleep(2 ** attempt)
              return status

          def run_completed(run_id):
              status, payload = request(f'/repos/{repo}/actions/runs/{run_id}')
              return (
                  status == 200
                  and isinstance(payload, dict)
                  and payload.get('status') == 'completed'
              )

          def cancel(run_id):
              status = post_with_retry(
                  f'/repos/{repo}/actions/runs/{run_id}/cancel'
              )
              if status in {200, 202, 404}:
                  return status
              if status in {409, 422} and run_completed(run_id):
                  return status
              if status in {409, 422} or status in retryable:
                  forced = post_with_retry(
                      f'/repos/{repo}/actions/runs/{run_id}/force-cancel'
                  )
                  if forced in {200, 202, 404}:
                      return forced
                  if forced in {409, 422} and run_completed(run_id):
                      return forced
                  return forced
              return status

          def main_sha():
              status, payload = request(f'/repos/{repo}/branches/main')
              sha = ((payload or {}).get('commit') or {}).get('sha', '')
              if status != 200 or not sha:
                  raise SystemExit(f'failed to resolve main HEAD: HTTP {status}')
              return sha

          def list_runs(run_status=None, head_sha=None):
              out = []
              for page in range(1, 11):
                  params = {'per_page': 100, 'page': page}
                  if run_status:
                      params['status'] = run_status
                  if head_sha:
                      params['head_sha'] = head_sha
                  query = urllib.parse.urlencode(params)
                  status, payload = request(f'/repos/{repo}/actions/runs?{query}')
                  if status != 200 or not isinstance(payload, dict):
                      raise SystemExit(f'failed to list Actions runs: HTTP {status}')
                  batch = payload.get('workflow_runs') or []
                  out.extend(batch)
                  if len(batch) < 100:
                      break
              return out

          def current_workflow_paths(head_sha):
              query = urllib.parse.urlencode({'ref': head_sha})
              status, payload = request(
                  f'/repos/{repo}/contents/.github/workflows?{query}'
              )
              if status != 200 or not isinstance(payload, list):
                  raise SystemExit(
                      f'failed to list current workflow files: HTTP {status}'
                  )
              paths = {
                  item.get('path')
                  for item in payload
                  if isinstance(item, dict)
                  and item.get('type') == 'file'
                  and str(item.get('path') or '').startswith('.github/workflows/')
              }
              if not paths:
                  raise SystemExit('current workflow file inventory is empty')
              return paths

          def orphaned_main_workflow_run(run, current_paths):
              workflow_path = run.get('path') or ''
              return (
                  (run.get('head_branch') or '') == 'main'
                  and workflow_path.startswith('.github/workflows/')
                  and workflow_path not in current_paths
              )

          def list_open_pr_heads():
              heads = {}
              numbered_heads = {}
              for page in range(1, 11):
                  query = urllib.parse.urlencode({
                      'state': 'open',
                      'per_page': 100,
                      'page': page,
                  })
                  status, payload = request(f'/repos/{repo}/pulls?{query}')
                  if status != 200 or not isinstance(payload, list):
                      raise SystemExit(f'failed to list open pull requests: HTTP {status}')
                  for pull in payload:
                      if not isinstance(pull, dict):
                          raise SystemExit('malformed open pull-request payload')
                      head = pull.get('head') or {}
                      head_repo = (head.get('repo') or {}).get('full_name') or ''
                      if head_repo != repo:
                          continue
                      branch = head.get('ref') or ''
                      sha = head.get('sha') or ''
                      number = int(pull.get('number') or 0)
                      if not branch or not sha or number <= 0:
                          raise SystemExit('same-repository open PR has incomplete head identity')
                      heads.setdefault(branch, set()).add(sha)
                      numbered_heads[number] = sha
                  if len(payload) < 100:
                      break
              return heads, numbered_heads

          def stale_pr_run(run, open_pr_heads):
              if run.get('event') != 'pull_request':
                  return False
              run_repo = ((run.get('head_repository') or {}).get('full_name') or '')
              branch = run.get('head_branch') or ''
              sha = run.get('head_sha') or ''
              if run_repo != repo or not branch or branch == 'main' or not sha:
                  return False
              return sha not in open_pr_heads.get(branch, set())

          def stale_dynamic_pr_run(run, open_pr_numbered_heads):
              if (
                  run.get('event') != 'dynamic'
                  or (run.get('path') or '') != 'dynamic/github-code-scanning/codeql'
              ):
                  return False
              run_repo = ((run.get('head_repository') or {}).get('full_name') or '')
              branch = run.get('head_branch') or ''
              sha = run.get('head_sha') or ''
              prefix = 'refs/pull/'
              suffix = '/head'
              if (
                  run_repo != repo
                  or not branch.startswith(prefix)
                  or not branch.endswith(suffix)
                  or not sha
              ):
                  return False
              number_text = branch[len(prefix):-len(suffix)]
              if not number_text.isdigit() or int(number_text) <= 0:
                  return False
              return sha != open_pr_numbered_heads.get(int(number_text), '')

          def obsolete_dynamic_ai_pr_run(run):
              if (
                  run.get('event') != 'dynamic'
                  or (run.get('path') or '') != 'dynamic/agents/github-advanced-security'
              ):
                  return False
              run_repo = ((run.get('head_repository') or {}).get('full_name') or '')
              branch = run.get('head_branch') or ''
              sha = run.get('head_sha') or ''
              prefix = 'Code scanning AI findings on PR #'
              name = run.get('name') or ''
              if (
                  run_repo != repo
                  or not branch
                  or branch == 'main'
                  or not sha
                  or not name.startswith(prefix)
              ):
                  return False
              number_text = name[len(prefix):]
              if not number_text.isdigit() or int(number_text) <= 0:
                  return False
              number = int(number_text)
              status, payload = request(f'/repos/{repo}/pulls/{number}')
              if status != 200 or not isinstance(payload, dict):
                  return False
              head = payload.get('head') or {}
              state = str(payload.get('state') or '')
              head_repo = ((head.get('repo') or {}).get('full_name') or '')
              head_ref = head.get('ref') or ''
              head_sha = head.get('sha') or ''
              if head_repo != repo or head_ref != branch:
                  return False
              if state == 'closed':
                  return True
              if state != 'open' or not head_sha:
                  return False
              return sha != head_sha

          def closed_dynamic_ai_pr_run(run):
              if (
                  run.get('event') != 'dynamic'
                  or (run.get('path') or '') != 'dynamic/agents/github-advanced-security'
              ):
                  return False
              run_repo = ((run.get('head_repository') or {}).get('full_name') or '')
              branch = run.get('head_branch') or ''
              name = run.get('name') or ''
              prefix = 'Code scanning AI findings on PR #'
              if (
                  run_repo != repo
                  or not branch
                  or branch == 'main'
                  or not name.startswith(prefix)
              ):
                  return False
              number_text = name[len(prefix):]
              if not number_text.isdigit() or int(number_text) <= 0:
                  return False
              number = int(number_text)
              status, payload = request(f'/repos/{repo}/pulls/{number}')
              if status != 200 or not isinstance(payload, dict):
                  return False
              head = payload.get('head') or {}
              state = str(payload.get('state') or '')
              head_repo = ((head.get('repo') or {}).get('full_name') or '')
              head_ref = head.get('ref') or ''
              return state == 'closed' and head_repo == repo and head_ref == branch

          def path(run):
              return run.get('path') or ''

          def is_control_plane(run):
              return path(run) in control_plane_paths

          def workflow_event_key(run):
              return (int(run.get('workflow_id') or 0), run.get('event') or '')

          def lane_key(run):
              return (
                  int(run.get('workflow_id') or 0),
                  run.get('head_branch') or '',
                  run.get('event') or '',
              )

          def usable_replacement(run):
              return not (
                  run.get('status') == 'completed'
                  and run.get('conclusion') == 'cancelled'
              )

          attempted = set()
          transient = set()
          totals = {
              'queued_seen': 0,
              'active_seen': 0,
              'control_plane_preserved': 0,
              'obsolete_main': 0,
              'duplicates': 0,
              'stale_dynamic_active': 0,
              'closed_dynamic_ai_queued': 0,
              'closed_dynamic_ai_active': 0,
              'obsolete_pr_queued': 0,
              'obsolete_pr_active': 0,
              'obsolete_dynamic_pr_queued': 0,
              'obsolete_dynamic_pr_active': 0,
              'obsolete_dynamic_ai_queued': 0,
              'obsolete_dynamic_ai_active': 0,
              'orphaned_main_queued': 0,
              'orphaned_main_active': 0,
              'last_validation_preserved': 0,
              'accepted': 0,
              'moved': 0,
              'deferred': 0,
              'failed': 0,
          }
          pass_lines = []
          latest_main = ''

          # Four passes catch GitHub-managed fanout that arrives seconds after a
          # push. Each pass resolves main again, so the drainer follows the live
          # repository rather than a stale workflow-event SHA.
          for pass_no in range(1, 5):
              head = main_sha()
              latest_main = head
              head_runs = list_runs(head_sha=head)
              current_paths = current_workflow_paths(head)
              replacement_keys = {
                  workflow_event_key(run)
                  for run in head_runs
                  if usable_replacement(run)
              }
              queued = list_runs(run_status='queued')
              active = list_runs(run_status='in_progress')
              open_pr_heads, open_pr_numbered_heads = list_open_pr_heads()
              live_ids = {
                  int(run.get('id') or 0)
                  for run in (*queued, *active)
                  if int(run.get('id') or 0)
              }
              transient.intersection_update(live_ids)
              totals['queued_seen'] += len(queued)
              totals['active_seen'] += len(active)

              selected = []
              seen = set()
              local = {key: 0 for key in totals}

              for run in sorted(
                  queued,
                  key=lambda item: item.get('created_at') or '',
                  reverse=True,
              ):
                  run_id = int(run.get('id') or 0)
                  if not run_id or run_id == current or run_id in attempted:
                      continue
                  if stale_pr_run(run, open_pr_heads):
                      selected.append(run)
                      totals['obsolete_pr_queued'] += 1
                      local['obsolete_pr_queued'] += 1
                      continue
                  if stale_dynamic_pr_run(run, open_pr_numbered_heads):
                      selected.append(run)
                      totals['obsolete_dynamic_pr_queued'] += 1
                      local['obsolete_dynamic_pr_queued'] += 1
                      continue
                  if obsolete_dynamic_ai_pr_run(run):
                      selected.append(run)
                      totals['obsolete_dynamic_ai_queued'] += 1
                      local['obsolete_dynamic_ai_queued'] += 1
                      continue
                  if closed_dynamic_ai_pr_run(run):
                      selected.append(run)
                      totals['closed_dynamic_ai_queued'] += 1
                      local['closed_dynamic_ai_queued'] += 1
                      continue
                  if orphaned_main_workflow_run(run, current_paths):
                      selected.append(run)
                      totals['orphaned_main_queued'] += 1
                      local['orphaned_main_queued'] += 1
                      continue
                  if is_control_plane(run):
                      totals['control_plane_preserved'] += 1
                      local['control_plane_preserved'] += 1
                      continue

                  lane = lane_key(run)
                  replacement = workflow_event_key(run)
                  old_main = (
                      (run.get('head_branch') or '') == 'main'
                      and (run.get('head_sha') or '') != head
                  )

                  if old_main:
                      if replacement in replacement_keys:
                          selected.append(run)
                          totals['obsolete_main'] += 1
                          local['obsolete_main'] += 1
                          continue

                      # For path-filtered validation lanes with no current-head
                      # replacement, keep the newest outstanding result source.
                      if lane in seen:
                          selected.append(run)
                          totals['duplicates'] += 1
                          local['duplicates'] += 1
                      else:
                          seen.add(lane)
                          totals['last_validation_preserved'] += 1
                          local['last_validation_preserved'] += 1
                      continue

                  if lane in seen:
                      selected.append(run)
                      totals['duplicates'] += 1
                      local['duplicates'] += 1
                  else:
                      seen.add(lane)

              # Only dynamic generated workflows are cancelled while already
              # running. Ordinary CI and all branch control-plane workflows finish.
              for run in active:
                  run_id = int(run.get('id') or 0)
                  if not run_id or run_id == current or run_id in attempted:
                      continue
                  if stale_pr_run(run, open_pr_heads):
                      selected.append(run)
                      totals['obsolete_pr_active'] += 1
                      local['obsolete_pr_active'] += 1
                      continue
                  if stale_dynamic_pr_run(run, open_pr_numbered_heads):
                      selected.append(run)
                      totals['obsolete_dynamic_pr_active'] += 1
                      local['obsolete_dynamic_pr_active'] += 1
                      continue
                  if obsolete_dynamic_ai_pr_run(run):
                      selected.append(run)
                      totals['obsolete_dynamic_ai_active'] += 1
                      local['obsolete_dynamic_ai_active'] += 1
                      continue
                  if closed_dynamic_ai_pr_run(run):
                      selected.append(run)
                      totals['closed_dynamic_ai_active'] += 1
                      local['closed_dynamic_ai_active'] += 1
                      continue
                  if orphaned_main_workflow_run(run, current_paths):
                      selected.append(run)
                      totals['orphaned_main_active'] += 1
                      local['orphaned_main_active'] += 1
                      continue
                  if is_control_plane(run):
                      totals['control_plane_preserved'] += 1
                      local['control_plane_preserved'] += 1
                      continue
                  if (
                      (run.get('head_branch') or '') == 'main'
                      and (run.get('head_sha') or '') != head
                      and path(run).startswith('dynamic/')
                      and workflow_event_key(run) in replacement_keys
                  ):
                      selected.append(run)
                      totals['stale_dynamic_active'] += 1
                      local['stale_dynamic_active'] += 1

              accepted = moved = deferred = failed = 0
              for run in selected:
                  run_id = int(run['id'])
                  status = cancel(run_id)
                  if status in {200, 202}:
                      attempted.add(run_id)
                      transient.discard(run_id)
                      accepted += 1
                  elif status == 404 or (
                      status in {409, 422} and run_completed(run_id)
                  ):
                      attempted.add(run_id)
                      transient.discard(run_id)
                      moved += 1
                  elif status in retryable or status in {409, 422}:
                      # GitHub can return conflict while a queued run is being
                      # scheduled/cancelled internally. Keep it retryable so a
                      # later sweep or scheduled invocation can reclaim it;
                      # only terminally classify once GitHub reports completion.
                      transient.add(run_id)
                      deferred += 1
                  else:
                      attempted.add(run_id)
                      transient.discard(run_id)
                      failed += 1
                      print(
                          f'cancel failed: id={run_id} status={status} '
                          'run remains non-terminal'
                      )

              totals['accepted'] += accepted
              totals['moved'] += moved
              totals['deferred'] += deferred
              totals['failed'] += failed

              line = (
                  f'pass={pass_no} main={head} queued={len(queued)} '
                  f'active={len(active)} selected={len(selected)} '
                  f'control_plane_preserved={local["control_plane_preserved"]} '
                  f'obsolete_main={local["obsolete_main"]} '
                  f'obsolete_pr_queued={local["obsolete_pr_queued"]} '
                  f'obsolete_pr_active={local["obsolete_pr_active"]} '
                  f'obsolete_dynamic_pr_queued={local["obsolete_dynamic_pr_queued"]} '
                  f'obsolete_dynamic_pr_active={local["obsolete_dynamic_pr_active"]} '
                  f'obsolete_dynamic_ai_queued={local["obsolete_dynamic_ai_queued"]} '
                  f'obsolete_dynamic_ai_active={local["obsolete_dynamic_ai_active"]} '
                  f'closed_dynamic_ai_queued={local["closed_dynamic_ai_queued"]} '
                  f'closed_dynamic_ai_active={local["closed_dynamic_ai_active"]} '
                  f'orphaned_main_queued={local["orphaned_main_queued"]} '
                  f'orphaned_main_active={local["orphaned_main_active"]} '
                  f'duplicates={local["duplicates"]} '
                  f'last_validation_preserved={local["last_validation_preserved"]} '
                  f'accepted={accepted} moved={moved} deferred={deferred} '
                  f'failed={failed}'
              )
              print(line)
              pass_lines.append(line)
              if pass_no < 4:
                  time.sleep(8)

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## Actions queue drain\n')
                  handle.write(f'- Latest live main SHA: `{latest_main}`\n')
                  handle.write('- Sweep passes: 4 over ~24 seconds\n')
                  handle.write(
                      '- Branch control-plane observations preserved: '
                      f'{totals["control_plane_preserved"]}\n'
                  )
                  handle.write(
                      f'- Obsolete main selections: {totals["obsolete_main"]}\n'
                  )
                  handle.write(
                      f'- Obsolete queued PR selections: {totals["obsolete_pr_queued"]}\n'
                  )
                  handle.write(
                      f'- Obsolete active PR selections: {totals["obsolete_pr_active"]}\n'
                  )
                  handle.write(
                      f'- Obsolete queued dynamic PR selections: {totals["obsolete_dynamic_pr_queued"]}\n'
                  )
                  handle.write(
                      f'- Obsolete active dynamic PR selections: {totals["obsolete_dynamic_pr_active"]}\n'
                  )
                  handle.write(
                      f'- Obsolete queued GHAS AI selections: {totals["obsolete_dynamic_ai_queued"]}\n'
                  )
                  handle.write(
                      f'- Obsolete active GHAS AI selections: {totals["obsolete_dynamic_ai_active"]}\n'
                  )
                  handle.write(
                      f'- Orphaned main queued selections: {totals["orphaned_main_queued"]}\n'
                  )
                  handle.write(
                      f'- Orphaned main active selections: {totals["orphaned_main_active"]}\n'
                  )
                  handle.write(
                      f'- Duplicate selections: {totals["duplicates"]}\n'
                  )
                  handle.write(
                      '- Last path-filtered validations preserved: '
                      f'{totals["last_validation_preserved"]}\n'
                  )
                  handle.write(
                      f'- Cancel requests accepted: {totals["accepted"]}\n'
                  )
                  handle.write(
                      f'- Terminal cancellation failures: {totals["failed"]}\n'
                  )
                  handle.write(
                      '- Safety: `actions-housekeeping-cli.yml`, `branch-clean.yml`, `branch-flow.yml`, '
                      '`branch-repair-100.yml`, `merge-readiness.yml`, '
                      '`pr-obsolete-run-drain.yml`, and `queue-drain.yml` are '
                      'never cancellation targets unless a pull_request run is proven '
                      'obsolete against the fresh same-repository open-PR head map; '
                      'current main, authoritative open-PR heads, cross-repository PRs, '
                      'and the newest path-filtered validation without a live-head '
                      'replacement are preserved.\n\n'
                  )
                  handle.write('### Passes\n')
                  for line in pass_lines:
                      handle.write(f'- `{line}`\n')

          if totals['failed']:
              raise SystemExit(
                  f'queue drain had {totals["failed"]} terminal cancellation failure(s)'
              )
          PY

  wake-housekeeping:
    # This tiny recovery wake uses a different runner pool from the broad x64
    # drainer so a saturated x64 queue cannot prevent exact stale-PR cleanup.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    permissions:
      actions: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - name: Wake exact stale-PR housekeeping when needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HOUSEKEEPING_WORKFLOW: actions-housekeeping-cli.yml
          HOUSEKEEPING_WAKE_STALE_MINUTES: '1440'
          HOUSEKEEPING_RECENT_SUCCESS_COOLDOWN_MINUTES: '360'
        shell: bash
        run: |
          set -euo pipefail

          cutoff=$(date -u -d "${HOUSEKEEPING_WAKE_STALE_MINUTES} minutes ago" +%s)
          stale_candidate=''
          scan_complete=false

          for page in $(seq 1 10); do
            page_json="$RUNNER_TEMP/housekeeping-wake-queued-${page}.json"
            gh api "/repos/${REPO}/actions/runs?status=queued&per_page=100&page=${page}" > "$page_json"
            count=$(jq -r '.workflow_runs | length' "$page_json")
            [[ "$count" =~ ^[0-9]+$ ]] || {
              echo '::error::Housekeeping wake received malformed queued-run inventory.'
              exit 1
            }

            while IFS=$'\t' read -r id name event created; do
              [[ -n "${id:-}" && -n "${created:-}" ]] || continue
              [[ "$event" == 'pull_request' ]] || continue
              case "$name" in
                *Malware*|*Secret*|*Security*|*CodeQL*|*Provenance*|*Artifact\ Policy*|*Dependency*|*Repository\ Hygiene*|*Workflow\ Input\ Security*)
                  continue
                  ;;
              esac
              created_epoch=$(date -u -d "$created" +%s)
              if (( created_epoch < cutoff )); then
                stale_candidate="$id"
                break
              fi
            done < <(jq -r '.workflow_runs[] | [.id, .name, .event, .created_at] | @tsv' "$page_json")

            [[ -n "$stale_candidate" ]] && {
              scan_complete=true
              break
            }
            if (( count < 100 )); then
              scan_complete=true
              break
            fi
          done

          if [[ "$scan_complete" != 'true' ]]; then
            echo '::error::Housekeeping wake exceeded its bounded 1,000-run queued inventory scan.'
            exit 1
          fi

          if [[ -z "$stale_candidate" ]]; then
            {
              echo '## Housekeeping wake'
              echo '- Dispatch: no'
              echo "- Reason: no eligible queued pull_request run older than ${HOUSEKEEPING_WAKE_STALE_MINUTES} minutes"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          housekeeping_live=0
          housekeeping_status=''
          for status_name in requested waiting pending queued in_progress; do
            status_count=$(gh api "/repos/${REPO}/actions/workflows/${HOUSEKEEPING_WORKFLOW}/runs?status=${status_name}&per_page=1" --jq '.total_count')
            if ! [[ "$status_count" =~ ^[0-9]+$ ]]; then
              echo "::error::Housekeeping wake received invalid ${status_name} run count."
              exit 1
            fi
            if (( status_count > 0 )); then
              housekeeping_live=1
              housekeeping_status="$status_name"
              break
            fi
          done

          if (( housekeeping_live > 0 )); then
            {
              echo '## Housekeeping wake'
              echo '- Dispatch: no'
              echo "- Reason: existing Housekeeping run is ${housekeeping_status}"
              echo "- Old queued candidate observed: ${stale_candidate}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          recent_success=$(gh api \
            "/repos/${REPO}/actions/workflows/${HOUSEKEEPING_WORKFLOW}/runs?status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success") | .updated_at][0] // ""')
          if [[ -n "$recent_success" ]]; then
            recent_epoch=$(date -u -d "$recent_success" +%s)
            cooldown_cutoff=$(date -u -d "${HOUSEKEEPING_RECENT_SUCCESS_COOLDOWN_MINUTES} minutes ago" +%s)
            if (( recent_epoch >= cooldown_cutoff )); then
              {
                echo '## Housekeeping wake'
                echo '- Dispatch: no'
                echo "- Reason: successful Housekeeping run is inside ${HOUSEKEEPING_RECENT_SUCCESS_COOLDOWN_MINUTES}-minute cooldown"
                echo "- Last successful completion: ${recent_success}"
                echo "- Old queued candidate observed: ${stale_candidate}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          gh workflow run "$HOUSEKEEPING_WORKFLOW" --repo "$REPO" --ref main
          {
            echo '## Housekeeping wake'
            echo '- Dispatch: yes'
            echo "- Old queued candidate observed: ${stale_candidate}"
            echo "- Stale threshold: ${HOUSEKEEPING_WAKE_STALE_MINUTES} minutes"
            echo '- Safety: dispatch only; Housekeeping independently re-proves PR/run identity before any cancellation.'
          } >> "$GITHUB_STEP_SUMMARY"
