name: Ecosystem API Production Import Qualification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ecosystem-api-import-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  flat_runtime:
    name: Exact-head flattened backend import and session smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          'fastapi>=0.142.2,<1' 'pydantic>=2.14.1,<3' 'pydantic-settings==2.16.2'
      - name: Compile and test both layouts
        run: |
          python -m compileall -q backend/routes/ecosystem_api.py backend/core/ecosystem_orchestrator.py backend/tests/test_ecosystem_import_layout_20261111.py
          python -m unittest discover -s backend/tests -p test_ecosystem_import_layout_20261111.py -v
          python -m unittest discover -s tests -p test_ci_regression_suite_contract_20261111.py -q
      - name: Verify dynamic-import safety and canonical AI-tree
        run: |
          python scripts/check_repository_dynamic_import_safety.py
          python scripts/check_ai_file_tree.py
