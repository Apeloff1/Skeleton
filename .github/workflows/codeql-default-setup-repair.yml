name: CodeQL Default Setup Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codeql-default-setup-repair.yml
  schedule:
    - cron: "41 5 * * *"

permissions: {}

concurrency:
  group: codeql-default-setup-guard
  cancel-in-progress: false

jobs:
  verify:
    name: Verify CodeQL maintained-language coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TRACKING_ISSUE: "2459"
    steps:
      - name: Verify default setup coverage
        shell: bash
        run: |
          set -euo pipefail

          api_error_file="$(mktemp)"
          trap 'rm -f "${api_error_file}"' EXIT

          if current="$(gh api "repos/${GH_REPO}/code-scanning/default-setup" 2>"${api_error_file}")"; then
            echo "CodeQL default setup:"
            jq '{state, languages, query_suite, schedule, updated_at}' <<<"${current}"
          elif grep -Eq 'HTTP 403|Resource not accessible by integration' "${api_error_file}"; then
            echo "::warning::CodeQL default-setup state is not readable by this integration; issue #${TRACKING_ISSUE} remains the admin boundary."
            {
              echo "## CodeQL admin setting remains externally unverifiable"
              echo
              echo "GitHub denied this integration read access to the CodeQL default-setup endpoint."
              echo "This is the known admin-permission boundary tracked by issue #${TRACKING_ISSUE}; the guard will not create a red CI loop for this expected 403."
              echo
              echo "Required state:"
              echo "- actions"
              echo "- python"
              echo "- javascript-typescript"
              echo "- query suite: extended"
              echo
              echo "Tracking issue: #${TRACKING_ISSUE}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          else
            echo "::error::Unable to read CodeQL default setup from GitHub API for an unexpected reason."
            exit 1
          fi

          configured=0
          if [[ "$(jq -r '.state // ""' <<<"${current}")" == "configured" ]] && \
             [[ "$(jq -r '.query_suite // ""' <<<"${current}")" == "extended" ]] && \
             jq -e '
               (.languages // []) as $languages
               | ($languages | index("actions")) != null
               and ($languages | index("python")) != null
               and ($languages | index("javascript-typescript")) != null
             ' <<<"${current}" >/dev/null; then
            configured=1
          fi

          if [[ "${configured}" == "1" ]]; then
            {
              echo "## CodeQL default setup"
              echo
              echo "Maintained-language coverage is configured:"
              echo "- actions"
              echo "- python"
              echo "- javascript-typescript"
              echo "- query suite: extended"
            } >> "${GITHUB_STEP_SUMMARY}"

            if gh issue view "${TRACKING_ISSUE}" --repo "${GH_REPO}" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
              gh issue close "${TRACKING_ISSUE}" --repo "${GH_REPO}" \
                --comment "CodeQL default setup now reports actions + python + javascript-typescript with the extended query suite. Closing the admin-setting blocker; fresh scans can now reconcile canonical findings."
            fi
            exit 0
          fi

          echo "::warning::CodeQL default setup is still missing maintained Python/JavaScript coverage; see issue #${TRACKING_ISSUE}."

          {
            echo "## CodeQL admin setting still required"
            echo
            echo "The repository token cannot mutate CodeQL default-setup settings (GitHub returned HTTP 403)."
            echo
            echo "Required state:"
            echo "- actions"
            echo "- python"
            echo "- javascript-typescript"
            echo "- query suite: extended"
            echo
            echo "Tracking issue: #${TRACKING_ISSUE}"
          } >> "${GITHUB_STEP_SUMMARY}"
