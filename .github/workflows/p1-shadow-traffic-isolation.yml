name: P1 Shadow Traffic Isolation Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/eval/shadow_traffic.py"
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/ai/evaluation/shadow_traffic.py"
      - "skeleton/eval/champion_registry.py"
      - "skeleton/agents/blast_radius.py"
      - "backend/core/operation_projection.py"
      - "skeleton/eval/__init__.py"
      - "skeleton/ai/evaluation/__init__.py"
      - "skeleton/testing/test_shadow_traffic.py"
      - ".github/workflows/p1-shadow-traffic-isolation.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/eval/shadow_traffic.py"
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/ai/evaluation/shadow_traffic.py"
      - "skeleton/eval/champion_registry.py"
      - "skeleton/agents/blast_radius.py"
      - "backend/core/operation_projection.py"
      - "skeleton/eval/__init__.py"
      - "skeleton/ai/evaluation/__init__.py"
      - "skeleton/testing/test_shadow_traffic.py"
      - ".github/workflows/p1-shadow-traffic-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-shadow-traffic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate isolated shadow traffic
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "pytest>=8,<9"

      - name: Compile LEARN-04 contracts
        run: >-
          python -m compileall -q
          skeleton/eval/shadow_traffic.py
          skeleton/ai/evaluation/shadow_traffic.py

      - name: Run LEARN-03, AUTO-05, PROD-02 and LEARN-04 regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_champion_registry.py
          skeleton/testing/test_blast_radius_alignment.py
          backend/tests/test_operation_projection.py
          skeleton/testing/test_shadow_traffic.py

      - name: Validate canonical AI file tree parity
        run: python scripts/check_ai_file_tree.py

      - name: Build accepted isolated shadow observation
        run: |
          set -euo pipefail
          mkdir -p .p1-learn-04
          python - <<'PY'
          import json
          from pathlib import Path

          from skeleton.agents.blast_radius import (
              ActionRiskProfile,
              BlastRadiusDecision,
              ImpactClass,
              ReversibilityClass,
          )
          from skeleton.contracts.canonical import EvidenceRef
          from skeleton.eval.champion_registry import (
              CandidateArtifact,
              ChampionRegistry,
          )
          from skeleton.eval.experiment_registry import (
              ExperimentBudget,
              ExperimentEligibility,
              ExperimentManifest,
              ExperimentMetric,
              MetricDirection,
              TrafficMode,
          )
          from skeleton.eval.shadow_traffic import (
              PairedShadowObservation,
              ShadowInputReceipt,
              ShadowPolicy,
              ShadowSourceAuthority,
              qualify_shadow_traffic,
          )

          experiment = ExperimentManifest(
              experiment_id="ci-shadow-experiment",
              hypothesis="Shadow challenger improves quality without interference.",
              owner="p1-eval",
              source_commit="a" * 40,
              environment_id="ci-shadow-env",
              candidate_ref="challenger-v2",
              eligibility=ExperimentEligibility(
                  traffic_mode=TrafficMode.SHADOW,
                  max_traffic_fraction=0.10,
                  allowed_data_classes=("public",),
                  tenant_ids=("ci-tenant",),
                  external_side_effects_allowed=False,
              ),
              budget=ExperimentBudget(
                  max_samples=1000,
                  max_tokens=100000,
                  max_cost_units=100.0,
                  max_wall_time_s=3600.0,
              ),
              metrics=(
                  ExperimentMetric(
                      metric_id="quality",
                      direction=MetricDirection.MAXIMIZE,
                      minimum_samples=100,
                      source="independent-evaluator",
                  ),
              ),
          )
          champion = CandidateArtifact(
              candidate_id="champion",
              version="v1",
              candidate_ref="champion-v1",
              artifact_digest="1" * 64,
              source_commit="1" * 40,
              experiment_manifest_digest="3" * 64,
              benchmark_manifest_digest="4" * 64,
              benchmark_qualification_digest="5" * 64,
              reproducibility_bundle_digest="6" * 64,
              tags=("shadow",),
          )
          challenger = CandidateArtifact(
              candidate_id="challenger",
              version="v2",
              candidate_ref="challenger-v2",
              artifact_digest="2" * 64,
              source_commit="2" * 40,
              experiment_manifest_digest=experiment.manifest_digest,
              benchmark_manifest_digest="4" * 64,
              benchmark_qualification_digest="5" * 64,
              reproducibility_bundle_digest="6" * 64,
              parent_candidate_digest=champion.candidate_digest,
              tags=("shadow",),
          )
          registry = ChampionRegistry(
              registry_id="ci-shadow-registry",
              candidates=(champion, challenger),
              initial_champion_digest=champion.candidate_digest,
          )
          source = ShadowSourceAuthority(
              operation_id="ci-operation",
              tenant_id="ci-tenant",
              operation_projection_digest="7" * 64,
              projection_decision_digest="8" * 64,
              operation_version=5,
              cursor_sequence=5,
              evidence=EvidenceRef(
                  source="p1:prod-02:streaming-projection",
                  digest="8" * 64,
                  category="streaming_projection_authority",
              ),
          )
          shadow_input = ShadowInputReceipt(
              original_input_digest="9" * 64,
              redacted_input_digest="a" * 64,
              redaction_policy_digest="b" * 64,
              data_class="public",
              sensitive_input=True,
              removed_classes=("credential",),
          )
          profile = ActionRiskProfile(
              operation_id=source.operation_id,
              execution_id="ci-shadow-execution",
              agent_id="ci-shadow-agent",
              action_digest="c" * 64,
              authority_digest="d" * 64,
              affected_tenants=1,
              affected_resources=1,
              reversibility=ReversibilityClass.REVERSIBLE,
              writes_persistent_state=False,
              externally_observable=False,
              privileged=False,
              destructive=False,
              sensitive_data=False,
          )
          blast = BlastRadiusDecision(
              accepted=True,
              impact=ImpactClass.LOW,
              reasons=(),
              operation_id=profile.operation_id,
              execution_id=profile.execution_id,
              agent_id=profile.agent_id,
              action_digest=profile.action_digest,
              authority_digest=profile.authority_digest,
              profile_digest=profile.digest,
              alignment_digest="e" * 64,
              policy_digest="f" * 64,
              risk_evaluation_digest=None,
              human_receipt_digest=None,
          )
          observation = PairedShadowObservation(
              experiment_manifest_digest=experiment.manifest_digest,
              candidate_digest=challenger.candidate_digest,
              source_authority_digest=source.digest,
              shadow_input_digest=shadow_input.digest,
              champion_output_digest="1" * 64,
              challenger_output_digest="2" * 64,
              comparator_id="ci-paired-comparator",
              comparator_digest="3" * 64,
              champion_latency_ms=20.0,
              challenger_latency_ms=18.0,
              registry_digest_before=registry.registry_digest,
              registry_digest_after=registry.registry_digest,
              champion_digest_before=registry.current_champion_digest,
              champion_digest_after=registry.current_champion_digest,
              production_response_before_digest="4" * 64,
              production_response_after_digest="4" * 64,
              evaluator_id="verifier:shadow-independent",
              evaluator_digest="5" * 64,
              independent=True,
              persistent_write_count=0,
              external_side_effect_count=0,
              shadow_selected_for_production=False,
              user_visible_output=False,
              canonical_write_count=0,
          )
          decision = qualify_shadow_traffic(
              experiment=experiment,
              registry=registry,
              candidate=challenger,
              source=source,
              shadow_input=shadow_input,
              action_profile=profile,
              blast_radius=blast,
              observation=observation,
              policy=ShadowPolicy(
                  policy_id="ci-shadow-policy",
                  version=1,
                  max_traffic_fraction=0.10,
              ),
              requested_fraction=0.05,
          )
          if not decision.accepted:
              raise SystemExit(
                  f"LEARN-04 fixture rejected: {decision.reasons}"
              )
          evidence = decision.accepted_evidence_ref()
          Path(".p1-learn-04/decision.json").write_text(
              json.dumps(decision.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-learn-04/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head LEARN-04 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-learn-04/config.digest").write_text(
              hashlib.sha256(
                  b"p1-learn-04-shadow-isolation-v1"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-learn-04/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|learn-04"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-learn-04/verifier.digest").write_text(
              digest([
                  "skeleton/eval/shadow_traffic.py",
                  "skeleton/eval/champion_registry.py",
                  "skeleton/agents/blast_radius.py",
                  "backend/core/operation_projection.py",
                  ".github/workflows/p1-shadow-traffic-isolation.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-learn-04/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_champion_registry.py",
                  "skeleton/testing/test_blast_radius_alignment.py",
                  "backend/tests/test_operation_projection.py",
                  "skeleton/testing/test_shadow_traffic.py",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-LEARN-04 \
            --accountability-id ACC-P1-LEARN-04 \
            --configuration-digest "$(cat .p1-learn-04/config.digest)" \
            --environment-digest "$(cat .p1-learn-04/environment.digest)" \
            --verifier-id github-actions:p1-shadow-traffic-isolation \
            --verifier-digest "$(cat .p1-learn-04/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-learn-04/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-learn-04/refs.json \
            --out .p1-learn-04/receipt.json \
            > .p1-learn-04/stdout.json

      - name: Assert exact-head LEARN-04 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-learn-04/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("LEARN-04 receipt head mismatch")
          if receipt["task_id"] != "P1-LEARN-04":
              raise SystemExit("LEARN-04 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-LEARN-04":
              raise SystemExit("LEARN-04 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("LEARN-04 exact-head receipt OK", receipt["receipt_digest"])
          PY
