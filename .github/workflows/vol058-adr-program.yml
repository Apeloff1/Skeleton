name: VOL-058 ADR Program

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/adr_index.json"
      - "machine/architecture_rule_registry.json"
      - "docs/adr/**"
      - "scripts/check_architecture_adr_index.py"
      - "scripts/verify_vol058_adr_program.py"
      - "tests/test_architecture_adr_index.py"
      - "tests/test_vol058_adr_program_independent.py"
      - ".github/workflows/vol058-adr-program.yml"
  push:
    branches: [main]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/adr_index.json"
      - "machine/architecture_rule_registry.json"
      - "docs/adr/**"
      - "scripts/check_architecture_adr_index.py"
      - "scripts/verify_vol058_adr_program.py"
      - "tests/test_architecture_adr_index.py"
      - "tests/test_vol058_adr_program_independent.py"
      - ".github/workflows/vol058-adr-program.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol058-adr-program-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adr-program:
    name: Canonical ADR index behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
      - name: Compile VOL-058 surfaces
        run: >-
          python -m compileall -q
          scripts/check_architecture_adr_index.py
          scripts/verify_vol058_adr_program.py
          tests/test_architecture_adr_index.py
          tests/test_vol058_adr_program_independent.py
      - name: Execute canonical ADR index validator
        run: python scripts/check_architecture_adr_index.py --json
      - name: Run canonical ADR regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_architecture_adr_index.py

  adr-program-independent:
    name: Independent exact-head VOL-058 verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
      - name: Run independent VOL-058 regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_vol058_adr_program_independent.py
      - name: Emit independent exact-head receipt
        run: >-
          python scripts/verify_vol058_adr_program.py
          --evidence-out .vol058-adr-program.json
          --print-evidence
      - name: Assert exact-head receipt identity and coverage
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".vol058-adr-program.json").read_text(encoding="utf-8")
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("VOL-058 receipt does not bind exact head")
          if receipt.get("volume") != "VOL-058":
              raise SystemExit("VOL-058 verifier bound wrong volume")
          if receipt.get("verifier") != "independent-vol058-adr-program-v1":
              raise SystemExit("unexpected VOL-058 verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent VOL-058 verification failed")
          binding = receipt.get("index_binding") or {}
          if binding.get("record_count", 0) <= 0:
              raise SystemExit("VOL-058 ADR record set is empty")
          if binding.get("record_count") != binding.get("document_count"):
              raise SystemExit("VOL-058 ADR document/index coverage is incomplete")
          if binding.get("governed_pattern_count", 0) < 5:
              raise SystemExit("VOL-058 governed architecture coverage is too small")
          registry = receipt.get("registry_binding") or {}
          if registry.get("rule_id") != "ARCH-ADR-INDEX":
              raise SystemExit("VOL-058 ADR architecture rule is missing")
          if registry.get("waivable") is not False:
              raise SystemExit("VOL-058 ADR architecture rule became waivable")
          if len(receipt.get("receipt_digest") or "") != 64:
              raise SystemExit("VOL-058 receipt digest is invalid")
          print(
              "VOL-058 independent exact-head receipt:",
              expected,
              receipt["receipt_digest"],
          )
          PY
