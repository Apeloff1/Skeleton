name: AI Memory Trinity Scope

on:
  pull_request:
    paths:
      - "skeleton/memory/trinity.py"
      - "skeleton/ai/runtime/memory/trinity.py"
      - "skeleton/testing/test_ai_memory_trinity_scope.py"
      - ".github/workflows/ai-memory-trinity-scope.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/memory/trinity.py"
      - "skeleton/ai/runtime/memory/trinity.py"
      - "skeleton/testing/test_ai_memory_trinity_scope.py"
      - ".github/workflows/ai-memory-trinity-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-memory-trinity-scope-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scoped-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - run: cmp skeleton/memory/trinity.py skeleton/ai/runtime/memory/trinity.py
      - run: python -m pytest -q --noconftest skeleton/testing/test_ai_memory_trinity_scope.py
