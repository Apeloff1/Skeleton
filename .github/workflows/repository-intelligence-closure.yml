name: Repository Intelligence Closure Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/repo_intelligence/repository_graph.py"
      - "skeleton/repo_intelligence/source_extraction.py"
      - "skeleton/repo_intelligence/change_planner.py"
      - "skeleton/ai/build/repo_intelligence/repository_graph.py"
      - "skeleton/ai/build/repo_intelligence/source_extraction.py"
      - "skeleton/ai/build/repo_intelligence/change_planner.py"
      - "skeleton/testing/test_repo_intelligence_git_index.py"
      - "skeleton/testing/test_vol021_repository_graph.py"
      - "skeleton/testing/test_vol021_source_extraction.py"
      - "scripts/verify_repository_intelligence_closure.py"
      - "tests/test_repository_intelligence_independent_verifier.py"
      - "machine/ai_master_plan.json"
      - ".github/workflows/repository-intelligence-closure.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/repo_intelligence/repository_graph.py"
      - "skeleton/repo_intelligence/source_extraction.py"
      - "skeleton/repo_intelligence/change_planner.py"
      - "skeleton/ai/build/repo_intelligence/repository_graph.py"
      - "skeleton/ai/build/repo_intelligence/source_extraction.py"
      - "skeleton/ai/build/repo_intelligence/change_planner.py"
      - "skeleton/testing/test_repo_intelligence_git_index.py"
      - "skeleton/testing/test_vol021_repository_graph.py"
      - "skeleton/testing/test_vol021_source_extraction.py"
      - "scripts/verify_repository_intelligence_closure.py"
      - "tests/test_repository_intelligence_independent_verifier.py"
      - "machine/ai_master_plan.json"
      - ".github/workflows/repository-intelligence-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-intelligence-closure-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-repository-intelligence:
    name: Independent repository intelligence verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused verifier dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Run repository intelligence regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_vol021_repository_graph.py
          skeleton/testing/test_vol021_source_extraction.py
          skeleton/testing/test_repo_intelligence_git_index.py
          tests/test_repository_intelligence_independent_verifier.py

      - name: Build independent exact-head receipt
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_repository_intelligence_closure.py
          --evidence-out .repository-intelligence-independent.json
          --print-evidence

      - name: Assert independent exact-head receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".repository-intelligence-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if receipt.get("head_sha") != expected:
              raise SystemExit("repository intelligence receipt head mismatch")
          if receipt.get("verifier") != "independent-repository-intelligence-v1":
              raise SystemExit("unexpected repository intelligence verifier identity")
          if receipt.get("valid") is not True or receipt.get("errors"):
              raise SystemExit("independent repository intelligence verification failed")

          mirrors = receipt.get("mirror_digests") or {}
          if len(mirrors) != 3:
              raise SystemExit("repository intelligence mirror coverage is incomplete")
          for pair in mirrors.values():
              if pair.get("canonical") != pair.get("mirror"):
                  raise SystemExit("repository intelligence mirror digest mismatch")

          fixture = receipt.get("fixture") or {}
          if len(fixture.get("edges") or []) != 6:
              raise SystemExit("cross-language edge coverage is incomplete")
          if fixture.get("authority_scope") != "change-plan-only":
              raise SystemExit("change planner authority widened")
          if fixture.get("impacted_paths") != [
              "pkg/core.py",
              "pkg/use.ts",
              "tests/test_core.py",
              "tests/test_ui.py",
          ]:
              raise SystemExit("impact closure mismatch")
          if fixture.get("required_tests") != [
              "tests/test_core.py",
              "tests/test_ui.py",
          ]:
              raise SystemExit("test-impact closure mismatch")
          if fixture.get("owners") != ["core", "qa", "ui"]:
              raise SystemExit("owner-impact closure mismatch")

          print(
              "independent repository intelligence exact-head receipt:",
              expected,
              "boundaries=",
              len(receipt.get("boundary_digests") or {}),
              "edges=",
              len(fixture["edges"]),
          )
          PY
