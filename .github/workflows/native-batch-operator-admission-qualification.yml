name: Native Batch Operator Admission Qualification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-batch-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native_batch_admission:
    name: Native batch wall-time and typed-policy source regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact source-head identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install canonical Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install hermetic native fixture dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6,<7" "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
          "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0"
          "fastapi>=0.142.2,<1" "pydantic>=2.14.1,<3"
          "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2"
          "numpy>=2,<3" "Pillow>=13.0.0,<14" "regex>=2026.9.29,<2027"
      - name: Compile exact-head native batch source and regressions
        run: |
          python -m compileall -q \
            skeleton/jeeves/agent/native_batch_runtime.py \
            skeleton/jeeves/agent/native_batch_cli.py \
            skeleton/testing/test_jeeves_native_batch.py
      - name: Execute actual SQLite and source-only native batch regressions
        env:
          PYTHONPATH: ".:backend"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --maxfail=1 --noconftest
          skeleton/testing/test_jeeves_native_batch.py
      - name: Preserve canonical AI-tree parity
        run: python scripts/check_ai_file_tree.py
      - name: Preserve architecture boundaries
        run: python scripts/check_architecture_boundaries.py
