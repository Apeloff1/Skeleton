name: P1 AC-17 Binding Gate

on:
  pull_request:
    branches:
      - main
      - p1/closure-current-main-505-8-20260930
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/p1_risk_evidence_bindings.json"
      - "tests/test_p1_adversarial_ac17_binding.py"
      - "tests/test_p1_adversarial_wave2_bindings.py"
      - "tests/test_p1_adversarial_wave3_bindings.py"
      - "tests/test_p1_risk_evidence_reconciliation.py"
      - "tests/test_p1_adversarial_ac20_binding.py"
      - "tests/test_p1_bulk_volume_obligation_bindings.py"
      - ".github/workflows/p1-ac17-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-ac17-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify governed AC-17 isolation binding
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Run AC-17 governed binding regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_p1_adversarial_ac17_binding.py
          tests/test_p1_adversarial_wave2_bindings.py
          tests/test_p1_adversarial_wave3_bindings.py
          tests/test_p1_adversarial_ac20_binding.py
          tests/test_p1_bulk_volume_obligation_bindings.py
          tests/test_p1_risk_evidence_reconciliation.py

      - name: Reconcile exact 513 resolved 0 blocking frontier
        run: |
          set -euo pipefail
          mkdir -p .p1-ac17
          python scripts/reconcile_p1_risk_evidence.py             --evaluated-at "2026-10-01T12:00:00+00:00"             --out .p1-ac17/reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-ac17/reconciliation.json").read_text(encoding="utf-8")
          )
          if report["binding_count"] != 513:
              raise SystemExit("AC-17 binding count drift")
          if report["resolved_count"] != 513:
              raise SystemExit("AC-17 resolved count drift")
          if report["unresolved_blocking_count"] != 0:
              raise SystemExit("AC-17 blocking frontier drift")
          if report["unclassified_count"] != 0:
              raise SystemExit("AC-17 reintroduced unclassified risks")
          if report["disposition_counts"] != {
              "evidence": 513,

          }:
              raise SystemExit("AC-17 disposition frontier drift")

          residual = {
              row["obligation"]["source_ref"]
              for row in report["records"]
              if not row["evaluation"]["resolved"]
              and row["obligation"]["kind"] == "adversarial"
          }
          expected = {
              "AC-01",
              "AC-08",
              "AC-10",
              "AC-16",
              "AC-19",
              "AC-21",
              "AC-23",
          }
          if residual != expected:
              raise SystemExit(
                  f"AC-17 residual axis drift: {sorted(residual)!r}"
              )
          PY
