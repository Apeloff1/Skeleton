name: Repository Secretary

on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:

concurrency:
  group: repository-secretary-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  secretary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MODEL_API_URL: ${{ vars.MODEL_API_URL }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Restore bot health state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .skeleton-bot-state.json
          key: skeleton-bot-state-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            skeleton-bot-state-${{ github.repository_id }}-
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Run secretary
        run: python -m skeleton.automation.secretary
      - name: Persist bot health state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .skeleton-bot-state.json
          key: skeleton-bot-state-${{ github.repository_id }}-${{ github.run_id }}
