name: Masterplan Observability Economics Gapfill

on:
  pull_request:
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_observability_economics_gapfill_candidate.json"
      - "skeleton/observability/**"
      - "skeleton/ai/runtime/observability/**"
      - "skeleton/testing/test_slo_registry.py"
      - "skeleton/testing/test_error_budgets.py"
      - "skeleton/testing/test_observability_cardinality.py"
      - "skeleton/testing/test_trace_model.py"
      - "skeleton/testing/test_profile_records.py"
      - "skeleton/testing/test_latency_budgets.py"
      - "skeleton/testing/test_cost_governor.py"
      - "skeleton/testing/test_efficiency_metrics.py"
      - "skeleton/testing/test_operations_review.py"
      - "scripts/check_ai_observability_economics_gapfill.py"
      - "tests/test_ai_observability_economics_gapfill.py"
      - "docs/plan/OBSERVABILITY_ECONOMICS_GAPFILL_180_187.md"
      - ".github/workflows/masterplan-observability-economics-gapfill.yml"
  push:
    branches: [main]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_observability_economics_gapfill_candidate.json"
      - "skeleton/observability/**"
      - "skeleton/ai/runtime/observability/**"
      - "scripts/check_ai_observability_economics_gapfill.py"
      - "tests/test_ai_observability_economics_gapfill.py"
      - ".github/workflows/masterplan-observability-economics-gapfill.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-economics-gapfill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"

      - name: Compile observability surfaces
        run: >-
          python -m compileall -q
          skeleton/observability
          skeleton/ai/runtime/observability
          scripts/check_ai_observability_economics_gapfill.py

      - name: Validate masterplan and exact-head candidate
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python scripts/check_ai_master_plan.py
          python scripts/check_ai_observability_economics_gapfill.py --head "$HEAD_SHA" --json

      - name: Validate candidate contract tests
        run: python -m pytest -q --noconftest tests/test_ai_observability_economics_gapfill.py

      - name: Execute exact primary regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_slo_registry.py
          skeleton/testing/test_error_budgets.py
          skeleton/testing/test_observability_cardinality.py
          skeleton/testing/test_trace_model.py
          skeleton/testing/test_profile_records.py
          skeleton/testing/test_latency_budgets.py
          skeleton/testing/test_cost_governor.py
          skeleton/testing/test_efficiency_metrics.py
          skeleton/testing/test_operations_review.py

      - name: Execute cross-plane durability and release regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_cost_governor_recovery.py
          skeleton/testing/test_cost_governor_reattach.py
          skeleton/testing/test_cost_governor_admission_intent_recovery.py
          skeleton/testing/test_release_slo_promotion.py
