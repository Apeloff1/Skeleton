name: Original Dynamic NPC Route Planner
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/game_builder/advanced_npc_dynamic_route_planner.py"
      - "skeleton/ai/game_builder/advanced_chunked_npc_world.py"
      - "skeleton/ai/game_builder/advanced_chunk_residency_index.py"
      - "skeleton/ai/game_builder/system_editor_cli.py"
      - "skeleton/ai/game_builder/game_workspace_server.py"
      - "skeleton/ai/game_builder/game_workspace_ui.py"
      - "tests/test_game_builder_npc_dynamic_route_planner.py"
      - ".github/workflows/game-builder-npc-dynamic-route-planner.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-npc-dynamic-route-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  actual-physical-replay:
    name: NPC-aware original world navigation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 22
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: "."
      SOURCE_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Exact source checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_npc_dynamic_route_planner.py
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Confirm exact source and compile original plan/rules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python -m py_compile \
            skeleton/ai/game_builder/advanced_npc_dynamic_route_planner.py \
            skeleton/ai/game_builder/advanced_chunked_npc_world.py \
            skeleton/ai/game_builder/system_editor_cli.py \
            skeleton/ai/game_builder/game_workspace_server.py \
            skeleton/ai/game_builder/game_workspace_ui.py \
            tests/test_game_builder_npc_dynamic_route_planner.py
      - name: Execute actual stamina- and actor-bound paths and forged-route tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_game_builder_npc_dynamic_route_planner -v
      - name: Reprove authored source quests through physical navigation on 3 and 5 chunk worlds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from skeleton.ai.game_builder.advanced_chunked_npc_world import run_chunked_npc_world
          from skeleton.ai.game_builder.advanced_npc_dynamic_route_planner import (
              plan_original_dynamic_route,verify_original_dynamic_route)
          for seed in (0,1,5,9):
              for chunks in (3,5):
                  game=run_chunked_npc_world([],seed=seed,options={
                      "chunks_per_side":chunks,"citizens":64,
                      "active_limit":8,"chunk_radius":1,"lod_policy":"fair"})
                  record=plan_original_dynamic_route(game,{
                      "kind":"site","index":0,"action":"harvest"},max_steps=12)
                  assert verify_original_dynamic_route(record)
                  assert record["performed_optional_real_interaction"]
                  assert record["arrived_at_source_objective"]
                  assert record["result_summary"]["source_events"]==1
                  assert not record["hardware_performance_certified"]
                  print("SOURCE_DYNAMIC_NPC_ROUTE_OK",seed,chunks,record["digest"])
          PY
