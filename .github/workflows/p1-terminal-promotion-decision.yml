name: P1 Terminal Promotion Decision Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/contracts/p1_terminal_promotion.py"
      - "skeleton/ai/runtime/contracts/p1_terminal_promotion.py"
      - "machine/p1_terminal_promotion_policy.json"
      - "scripts/check_p1_terminal_promotion_policy.py"
      - "scripts/build_p1_terminal_promotion.py"
      - "skeleton/testing/test_p1_terminal_promotion.py"
      - "tests/test_p1_terminal_promotion_policy.py"
      - ".github/workflows/p1-terminal-promotion-decision.yml"
  pull_request:
    branches:
      - main
      - p1/prom-02-terminal-failure-journeys-20260928
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/contracts/p1_terminal_promotion.py"
      - "skeleton/ai/runtime/contracts/p1_terminal_promotion.py"
      - "machine/p1_terminal_promotion_policy.json"
      - "scripts/check_p1_terminal_promotion_policy.py"
      - "scripts/build_p1_terminal_promotion.py"
      - "skeleton/testing/test_p1_terminal_promotion.py"
      - "tests/test_p1_terminal_promotion_policy.py"
      - ".github/workflows/p1-terminal-promotion-decision.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-terminal-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate independent terminal promotion decision
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install terminal decision runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev]"
          "pytest>=8,<9"

      - name: Compile PROM-03 contracts and builders
        run: >-
          python -m compileall -q
          skeleton/contracts/p1_terminal_promotion.py
          skeleton/ai/runtime/contracts/p1_terminal_promotion.py
          scripts/check_p1_terminal_promotion_policy.py
          scripts/build_p1_terminal_promotion.py

      - name: Validate terminal policies
        run: |
          python scripts/check_p1_terminal_evidence_policy.py --print-summary
          python scripts/check_p1_terminal_failure_journeys.py --print-summary
          python scripts/check_p1_terminal_promotion_policy.py --print-summary

      - name: Assert canonical contract mirror parity
        run: >-
          cmp
          skeleton/contracts/p1_terminal_promotion.py
          skeleton/ai/runtime/contracts/p1_terminal_promotion.py

      - name: Run PROM-03 contract and policy mutations
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_p1_terminal_promotion.py
          tests/test_p1_terminal_promotion_policy.py

      - name: Rerun canonical PROM-02 skeleton failure families
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_state_recovery_drill.py
          skeleton/testing/test_installer_lifecycle.py
          skeleton/testing/test_backup_restore_qualification.py
          skeleton/testing/test_jeeves_durable_side_effect_quarantine.py
          skeleton/testing/test_provider_stream_reliability_profiles.py
          skeleton/testing/test_human_control.py
          skeleton/testing/test_autonomy_deescalation.py
          skeleton/testing/test_migration_rollback_compatibility.py
          skeleton/testing/test_release_qualification.py
          skeleton/testing/test_capacity_qualification.py
          skeleton/testing/test_swarm_exact_lease_atomicity.py
          skeleton/testing/test_swarm_failover.py
          skeleton/testing/test_benchmark_registry.py
          skeleton/testing/test_blast_radius_alignment.py
          skeleton/testing/test_risk_evidence.py
          skeleton/testing/test_memory_retrieval_knowledge_quality.py
          skeleton/testing/test_agent_delegation_qualification.py

      - name: Rerun PROM-02 backend failure families
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          backend/tests/test_operation_projection.py
          backend/tests/test_operation_stream_transport.py
          backend/tests/test_operation_stream_route.py
          backend/tests/test_ai_provider_reliability.py

      - name: Rerun PROM-02 repository failure families
        run: |
          python -m pytest -q --noconftest tests/application/test_runtime_lifecycle_failure_contract.py
          python -m pytest -q --noconftest tests/test_control_plane_queue_backpressure.py
          python -m pytest -q --noconftest tests/test_p1_required_gate_authority.py

      - name: Rebuild exact-head PROM-01 and PROM-02 evidence
        run: |
          set -euo pipefail
          mkdir -p .p1-prom-03
          python scripts/reconcile_p1_maturity.py \
            --out .p1-prom-03/maturity.json
          python scripts/build_p1_terminal_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --maturity-report .p1-prom-03/maturity.json \
            --out .p1-prom-03/prom01.json \
            --refs-out .p1-prom-03/prom01-refs.json
          python scripts/build_p1_terminal_failure_journeys.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --prom01-bundle .p1-prom-03/prom01.json \
            --out .p1-prom-03/prom02.json \
            --refs-out .p1-prom-03/prom02-refs.json

      - name: Build PROM-03 without manufacturing a signature
        run: |
          set -euo pipefail
          python scripts/build_p1_terminal_promotion.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --prom01-bundle .p1-prom-03/prom01.json \
            --prom02-bundle .p1-prom-03/prom02.json \
            --out .p1-prom-03/decision.json \
            --refs-out .p1-prom-03/refs.json

      - name: Assert explicit rejection or externally signed promotion semantics
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          prom01 = json.loads(
              Path(".p1-prom-03/prom01.json").read_text(encoding="utf-8")
          )
          prom02 = json.loads(
              Path(".p1-prom-03/prom02.json").read_text(encoding="utf-8")
          )
          decision = json.loads(
              Path(".p1-prom-03/decision.json").read_text(encoding="utf-8")
          )
          if decision["valid"] is not True:
              raise SystemExit("PROM-03 terminal decision is structurally invalid")
          if decision["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("PROM-03 exact-head mismatch")
          if decision["prom01_bundle_digest"] != prom01["decision_digest"]:
              raise SystemExit("PROM-03 PROM-01 digest mismatch")
          if decision["prom02_bundle_digest"] != prom02["decision_digest"]:
              raise SystemExit("PROM-03 PROM-02 digest mismatch")

          # This CI workflow never supplies an independent signing attestation.
          # Therefore it must never create promotion authority by itself.
          if decision["outcome"] != "rejected":
              raise SystemExit(
                  "CI cannot self-promote without external independent signature"
              )
          if decision["signed_promotion"] is not False:
              raise SystemExit("CI manufactured a signed promotion")
          if decision["promotion_authority"] is not False:
              raise SystemExit("CI manufactured promotion authority")
          if prom01["promotion_ready"] is True:
              if "independent-signature-missing" not in decision["reasons"]:
                  raise SystemExit(
                      "promotion-ready head did not fail closed on missing signature"
                  )
          else:
              if "prom01-not-promotion-ready" not in decision["reasons"]:
                  raise SystemExit(
                      "blocked head did not materialize terminal rejection"
                  )
          print(
              "PROM-03 explicit terminal rejection recorded",
              decision["decision_digest"],
              "blockers=", decision["blocker_count"],
          )
          PY

      - name: Emit exact-head PROM-03 decision evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-prom-03/config.digest").write_text(
              hashlib.sha256(
                  Path("machine/p1_terminal_promotion_policy.json").read_bytes()
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-prom-03/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|prom-03"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-prom-03/verifier.digest").write_text(
              digest([
                  "skeleton/contracts/p1_terminal_promotion.py",
                  "scripts/check_p1_terminal_promotion_policy.py",
                  "scripts/build_p1_terminal_promotion.py",
                  "machine/p1_terminal_promotion_policy.json",
                  "scripts/build_p1_terminal_evidence.py",
                  "scripts/build_p1_terminal_failure_journeys.py",
                  ".github/workflows/p1-terminal-promotion-decision.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-prom-03/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_p1_terminal_promotion.py",
                  "tests/test_p1_terminal_promotion_policy.py",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-PROM-03 \
            --accountability-id ACC-P1-PROM-03 \
            --configuration-digest "$(cat .p1-prom-03/config.digest)" \
            --environment-digest "$(cat .p1-prom-03/environment.digest)" \
            --verifier-id github-actions:p1-terminal-promotion-decision \
            --verifier-digest "$(cat .p1-prom-03/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-prom-03/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-prom-03/refs.json \
            --out .p1-prom-03/receipt.json \
            > .p1-prom-03/receipt.stdout.json

      - name: Assert exact-head PROM-03 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-prom-03/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("PROM-03 receipt head mismatch")
          if receipt["task_id"] != "P1-PROM-03":
              raise SystemExit("PROM-03 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-PROM-03":
              raise SystemExit("PROM-03 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("PROM-03 exact-head receipt OK", receipt["receipt_digest"])
          PY
