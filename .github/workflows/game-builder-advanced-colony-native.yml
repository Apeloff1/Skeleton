name: Advanced Godot Native Colony Replay
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/ai/game_builder/advanced_colony_godot.py"
      - "skeleton/ai/game_builder/advanced_colony_runtime.py"
      - "skeleton/ai/game_builder/advanced_godot_export.py"
      - "docs/GAME_BUILDER_SYSTEM_EDITOR_FABRIC.md"
      - ".github/workflows/game-builder-advanced-system-engines.yml"
      - "skeleton/ai/game_builder/advanced_gameplay_runtime.py"
      - "skeleton/ai/game_builder/advanced_level_scenes.py"
      - "skeleton/ai/game_builder/advanced_genre_engines.py"
      - "skeleton/ai/game_builder/system_editor_cli.py"
      - "skeleton/ai/game_builder/game_workspace_server.py"
      - "skeleton/ai/game_builder/game_workspace_ui.py"
      - "tests/test_game_builder_advanced_colony.py"
      - ".github/workflows/game-builder-advanced-colony-native.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: advanced-native-colony-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independently-execute-colony:
    name: Python/Godot colony parity on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 23
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Checkout exact PR head with safe source scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_advanced_colony.py
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Godot 4.4.1 native runtime and export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: "4.4.1"
          use-dotnet: false
          include-templates: true
          cache: true
      - name: Validate exact source and Python proof contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          godot --version
          python -m py_compile skeleton/ai/game_builder/advanced_gameplay_runtime.py skeleton/ai/game_builder/advanced_colony_runtime.py skeleton/ai/game_builder/advanced_godot_export.py skeleton/ai/game_builder/advanced_colony_godot.py
          python -m unittest tests.test_game_builder_advanced_colony -v
      - name: Build eight real authored colony production chains and resource scenarios
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from skeleton.ai.game_builder.advanced_level_scenes import make_advanced_scene
          from skeleton.ai.game_builder.advanced_gameplay_runtime import run_advanced_session
          from skeleton.ai.game_builder.advanced_colony_godot import render_colony_godot_package
          from skeleton.ai.game_builder.advanced_godot_export import write_advanced_godot_package
          root=Path(os.environ["RUNNER_TEMP"])/"advanced-native-colony"
          root.mkdir()
          cases=(
              ("original",{},["build:farm","build:well","assign:farmers",
                              "assign:gatherers","tick"],0),
              ("self_sufficient",{},["build:farm","build:well",
                                     "assign:farmers","assign:farmers","assign:farmers",
                                     "tick:4","expedition","tick:4"],1),
              ("crisis",{"raid_interval":3,"disease_pressure":3},
                          ["tick","tick","assign:guards","assign:guards",
                           "fortify","tick:4","scavenge"],2),
              ("productive",{"worker_productivity":4,"disasters":"off",
                              "threats":"off"},
                             ["build:farm","build:well","assign:farmers",
                              "assign:gatherers","assign:miners","tick:4"],3),
              ("civic",{},["build:farm","build:clinic","gather_wood","quarry",
                            "fortify","assign:medics","tick:4"],4),
              ("migrate",{"starting_credits":30},
                          ["build:house","recruit","recruit","ration",
                           "feast","tick"],5),
              ("scarcity",{"settlers":1,"jobs":1,"need_decay":20,
                           "threats":"off"},["tick:4","tick:4"],6),
              ("exploration",{"food_policy":"frugal","disasters":"frequent"},
                             ["expedition","forage","expedition","quarry",
                              "draw_water","trade","tick:4"],7),
          )
          observed=set()
          for name,settings,actions,seed in cases:
              scene=make_advanced_scene("colony",settings,seed=seed)
              game=run_advanced_session("colony",settings,actions,seed=seed,scene=scene)
              if name=="self_sufficient":
                  assert "self_sufficient_settlement" in game["state"]["milestones"]
                  assert not game["terminal"],"endless settlement must remain playable"
              if name=="scarcity":
                  assert game["state"]["failed"],"finite resource loss must end a colony"
              observed.update(event for step in game["trace"] for event in step["events"])
              package=render_colony_godot_package(game,settings,authorized=True)
              write_advanced_godot_package(package,root/name,authorized=True)
              print("NATIVE_COLONY_SOURCE",name,"actions",len(actions),
                    "survivors",game["state"]["population"],
                    "digest",game["digest"])
          assert {"settler_assigned_to_real_job","civic_structure_constructed",
                  "assigned_labor_produced_finite_goods","colony_raid_breached_defenses",
                  "self_sufficient_colony_milestone","colony_population_lost",
                  "finite_caravan_trade","new_original_colonist_recruited",
                  "temporary_consumption_rationing"}<=observed,observed
          PY
      - name: Independently execute eight original colony settlement histories
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/advanced-native-colony"
          python - "$root" <<'PY'
          import os, pathlib, subprocess, sys
          root=pathlib.Path(sys.argv[1])
          cases=("original","self_sufficient","crisis","productive",
                 "civic","migrate","scarcity","exploration")
          for case in cases:
              project=root/case/"godot"
              print("NATIVE_ADVANCED_COLONY_CASE",case,flush=True)
              for args in (["--headless","--path",str(project),"--import"],
                           ["--headless","--path",str(project),"--","--verify-colony"]):
                  try:
                      # Git Bash provides the Godot launcher on Windows, but
                      # CreateProcess cannot resolve that shell-only command.
                      # Use the exact Git Bash installed by actions' bash shell.
                      cmd=(["godot",*args] if sys.platform!="win32" else [
                          str(pathlib.Path(os.environ["ProgramFiles"])/"Git"/"bin"/"bash.exe"),
                          "-c",'godot "$@"',"godot",*args])
                      result=subprocess.run(cmd,stdout=subprocess.PIPE,
                                            stderr=subprocess.STDOUT,text=True,
                                            encoding="utf-8",errors="replace",timeout=45)
                  except subprocess.TimeoutExpired as exc:
                      print("NATIVE_ADVANCED_COLONY_TIMEOUT",case,args,flush=True)
                      if exc.stdout:
                          print(exc.stdout.decode("utf-8","replace") if isinstance(exc.stdout,bytes) else exc.stdout)
                      raise
                  print(result.stdout,flush=True)
                  if "--verify-colony" in args:
                      (root/case/"native-replay.log").write_text(result.stdout,encoding="utf-8")
                      if "NATIVE_ADVANCED_COLONY_OK" not in result.stdout:
                          raise SystemExit("native gameplay proof marker absent: "+case)
                  if result.returncode:
                      raise SystemExit(f"Godot returned {result.returncode} on {case} {args}")
          PY
      - name: Export Linux desktop colony executable and execute the actual binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/advanced-native-colony/self_sufficient/godot"
          executable="$RUNNER_TEMP/advanced-native-colony/original-advanced-colony.x86_64"
          godot --headless --path "$project" --export-release Linux "$executable"
          test -s "$executable"
          chmod +x "$executable"
          "$executable" --headless -- --verify-colony | tee "$RUNNER_TEMP/advanced-native-colony/linux-export-replay.log"
          grep -q "NATIVE_ADVANCED_COLONY_OK" "$RUNNER_TEMP/advanced-native-colony/linux-export-replay.log"
      - name: Export actual Windows game and verify native console executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'advanced-native-colony'
          $project = Join-Path $root 'self_sufficient/godot'
          $binary = Join-Path $root 'original-advanced-colony.exe'
          # The setup-godot Windows GUI editor can detach without a reliable
          # synchronous exit code. Use the same pinned official console engine
          # already required by the repository's Windows native integration.
          $archive = Join-Path $env:USERPROFILE 'downloads/Godot_v4.4.1-stable_win64.exe.zip'
          $engineDir = Join-Path $root 'pinned-godot-console'
          if (-not (Test-Path $archive)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $archive) | Out-Null
            Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip' -OutFile $archive -MaximumRedirection 5
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $engineDir -Force
          $nativeEditor = Get-ChildItem $engineDir -Recurse -Filter '*_console.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nativeEditor) {
            throw "Version-pinned official Godot Windows console editor unavailable"
          }
          & $nativeEditor.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows console startup failed" }
          & $nativeEditor.FullName --headless --path $project --import
          if ($LASTEXITCODE -ne 0) { throw "Advanced colony Windows resource import failed" }
          & $nativeEditor.FullName --headless --path $project --export-release 'Windows Desktop' $binary
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $binary)) {
            throw "Advanced Godot Windows console game executable export failed"
          }
          if ((Get-Item $binary).Length -le 1024) {
            throw "Advanced Godot Windows game executable is empty"
          }
          $console = Join-Path $root 'original-advanced-colony.console.exe'
          if (-not (Test-Path $console)) {
            throw "Exported original colony lacks an observable Windows console binary"
          }
          $python = @'
          import subprocess,sys
          result=subprocess.run(
              [sys.argv[1],"--headless","--","--verify-colony"],
              capture_output=True,text=True,timeout=90)
          print(result.stdout)
          print(result.stderr)
          sys.exit(0 if result.returncode==0 and
              "NATIVE_ADVANCED_COLONY_OK" in result.stdout+result.stderr else 1)
          '@
          $proofScript = Join-Path $root 'verify_windows_native.py'
          [IO.File]::WriteAllText($proofScript, $python)
          & python $proofScript $console
          if ($LASTEXITCODE -ne 0) {
            throw "Exported Windows homebrew colony gameplay diverged from reviewed Python"
          }
          Write-Host "Native Windows executable SHA256:"
          Get-FileHash -Algorithm SHA256 $binary | Format-List
          Get-FileHash -Algorithm SHA256 $console | Format-List
      - name: Upload native gameplay proof logs and source release manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-advanced-colony-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/advanced-native-colony/*/native-replay.log
            ${{ runner.temp }}/advanced-native-colony/*/release.json
            ${{ runner.temp }}/advanced-native-colony/linux-export-replay.log
            ${{ runner.temp }}/advanced-native-colony/original-advanced-colony.exe
            ${{ runner.temp }}/advanced-native-colony/original-advanced-colony.console.exe
            ${{ runner.temp }}/advanced-native-colony/original-advanced-colony.x86_64
          if-no-files-found: warn
          retention-days: 7
