name: Execution Evidence Gates

on:
  push:
    branches: [main]
    paths:
      - "backend/core/execution_evidence.py"
      - "backend/core/execution_receipts.py"
      - "backend/core/product_control_plane.py"
      - "backend/core/product_operations.py"
      - "backend/routes/ops.py"
      - "backend/tests/test_execution_evidence.py"
      - "backend/tests/test_control_plane_evidence_integration.py"
      - ".github/workflows/execution-evidence.yml"
  pull_request:
    paths:
      - "backend/core/execution_evidence.py"
      - "backend/core/execution_receipts.py"
      - "backend/core/product_control_plane.py"
      - "backend/core/product_operations.py"
      - "backend/routes/ops.py"
      - "backend/tests/test_execution_evidence.py"
      - "backend/tests/test_control_plane_evidence_integration.py"
      - ".github/workflows/execution-evidence.yml"

permissions:
  contents: read

concurrency:
  group: execution-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - run: python -m pip install "pytest>=8,<9"
      - name: Verify execution evidence reconstruction
        run: >-
          python -m pytest -q --noconftest
          tests/test_execution_evidence.py
          tests/test_control_plane_evidence_integration.py
          tests/test_execution_receipts.py
          tests/test_native_product_executors.py
          tests/test_product_executor_registry.py
