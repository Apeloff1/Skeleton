name: Dragon Native ROM Build

on:
  pull_request:
    paths:
      - 'skeleton/ai/webcrawler/dragon_native_*.py'
      - 'skeleton/ai/webcrawler/dragon_game_blueprints.py'
      - 'skeleton/ai/webcrawler/dragon_game_design.py'
      - 'skeleton/ai/webcrawler/dragon_playtest_planner.py'
      - 'skeleton/ai/webcrawler/dragon_build_evidence.py'
      - 'skeleton/ai/webcrawler/dragon_native_raycaster.py'
      - 'skeleton/ai/webcrawler/dragon_native_3d_era.py'
      - 'skeleton/ai/webcrawler/dragon_native_puzzle.py'
      - 'skeleton/ai/webcrawler/dragon_hw_graphics.py'
      - 'skeleton/ai/webcrawler/dragon_hardware_budget.py'
      - 'skeleton/ai/webcrawler/dragon_game_fitness.py'
      - 'skeleton/ai/webcrawler/dragon_native_gbc.py'
      - 'skeleton/ai/webcrawler/dragon_native_save_system.py'
      - 'skeleton/ai/webcrawler/dragon_native_replay_system.py'
      - 'skeleton/ai/webcrawler/dragon_gb_platformer.py'
      - 'skeleton/ai/webcrawler/dragon_campaign_quests.py'
      - 'skeleton/ai/webcrawler/dragon_chip_music.py'
      - 'skeleton/ai/webcrawler/dragon_gb_sound.py'
      - 'tests/test_ai_webcrawler_dragon_game_fitness.py'
      - 'tests/test_ai_webcrawler_dragon_native_3d_design.py'
      - 'tests/test_ai_webcrawler_dragon_native_3d_era.py'
      - 'tests/test_ai_webcrawler_dragon_platform_matrix.py'
      - 'tests/test_ai_webcrawler_dragon_native_puzzle.py'
      - 'tests/test_ai_webcrawler_dragon_playtest_planner.py'
      - 'tests/test_ai_webcrawler_dragon_build_evidence.py'
      - 'tests/test_ai_webcrawler_dragon_game_design_effects.py'
      - 'tests/test_ai_webcrawler_dragon_native_curriculum.py'
      - 'tests/test_ai_webcrawler_dragon_adaptive_cycles.py'
      - 'backend/tests/test_dragon_academy_routes.py'
      - 'tests/test_ai_webcrawler_dragon_hw_graphics.py'
      - 'tests/test_ai_webcrawler_dragon_native_gbc.py'
      - 'tests/test_ai_webcrawler_dragon_native_save.py'
      - 'tests/test_ai_webcrawler_dragon_native_replay.py'
      - 'tests/test_ai_webcrawler_dragon_native_platformer.py'
      - 'tests/test_ai_webcrawler_dragon_campaign_quests.py'
      - 'tests/test_ai_webcrawler_dragon_native_sega_snes.py'
      - 'tests/test_ai_webcrawler_dragon_chip_music.py'
      - 'skeleton/ai/webcrawler/dragon_retro_assets.py'
      - 'tests/test_ai_webcrawler_dragon_game_blueprints.py'
      - 'tests/test_ai_webcrawler_dragon_retro_assets.py'
      - 'skeleton/ai/webcrawler/dragon_practice_lab.py'
      - 'skeleton/ai/webcrawler/dragon_practice_cycles.py'
      - 'tests/test_ai_webcrawler_dragon_native_*.py'
      - '.github/workflows/dragon-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-native-rom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-gb-and-nes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native ROM toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 build-essential bison flex libpng-dev pkg-config
          python -m pip install --disable-pip-version-check pytest
      - name: Install RGBDS version 1.0.0
        run: |
          git clone --depth 1 --branch v1.0.0 https://github.com/gbdev/rgbds.git /tmp/dragon-rgbds
          make -C /tmp/dragon-rgbds -j 2
          sudo make -C /tmp/dragon-rgbds install
          rgbasm --version
          ca65 --version
      - name: Execute real native ROM compilation tests
        run: |
          python -m pytest -q \
            tests/test_ai_webcrawler_dragon_native_projects.py \
            tests/test_ai_webcrawler_dragon_native_compile.py \
            tests/test_ai_webcrawler_dragon_native_cycles.py \
            tests/test_ai_webcrawler_dragon_native_3d_design.py \
            tests/test_ai_webcrawler_dragon_native_3d_era.py \
            tests/test_ai_webcrawler_dragon_platform_matrix.py \
            tests/test_ai_webcrawler_dragon_native_puzzle.py \
            tests/test_ai_webcrawler_dragon_native_rpg.py \
            tests/test_ai_webcrawler_dragon_native_rhythm.py \
            tests/test_ai_webcrawler_dragon_playtest_planner.py \
            tests/test_ai_webcrawler_dragon_build_evidence.py \
            tests/test_ai_webcrawler_dragon_native_curriculum.py \
            tests/test_ai_webcrawler_dragon_adaptive_cycles.py \
            tests/test_ai_webcrawler_dragon_game_design_effects.py \
            tests/test_ai_webcrawler_dragon_hw_graphics.py \
            tests/test_ai_webcrawler_dragon_native_variants.py \
            tests/test_ai_webcrawler_dragon_retro_assets.py \
            tests/test_ai_webcrawler_dragon_native_c64.py \
            tests/test_ai_webcrawler_dragon_native_gbc.py \
            tests/test_ai_webcrawler_dragon_native_platformer.py
      - name: Build original Game Boy ROM
        run: |
          python -m skeleton.ai.webcrawler.dragon_native_cli \
            --target game_boy --out /tmp/dragon-gameboy --compile
          test -s /tmp/dragon-gameboy/build/dragon.gb
      - name: Compile original Game Boy Color cartridge
        run: |
          python -m skeleton.ai.webcrawler.dragon_native_cli \
            --target game_boy_color --out /tmp/dragon-gameboy-color --compile
          test -s /tmp/dragon-gameboy-color/build/dragon.gbc
      - name: Compile actual Game Boy scrolling platformer ROM
        run: |
          python -m skeleton.ai.webcrawler.dragon_native_cli \
            --target game_boy --style side_scrolling_platformer \
            --out /tmp/dragon-gameboy-platform --compile
          test -s /tmp/dragon-gameboy-platform/build/dragon.gb
      - name: Build original NES ROM
        run: |
          python -m skeleton.ai.webcrawler.dragon_native_cli \
            --target nes --out /tmp/dragon-nes --compile
          test -s /tmp/dragon-nes/build/dragon.nes
      - name: Build original Commodore 64 executable
        run: |
          python -m skeleton.ai.webcrawler.dragon_native_cli \
            --target commodore_64 --out /tmp/dragon-c64 --compile
          test -s /tmp/dragon-c64/build/dragon.prg
      - name: Publish original homebrew ROM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dragon-native-homebrew-roms
          path: |
            /tmp/dragon-gameboy/build/dragon.gb
            /tmp/dragon-nes/build/dragon.nes
            /tmp/dragon-c64/build/dragon.prg
            /tmp/dragon-gameboy-color/build/dragon.gbc
            /tmp/dragon-gameboy-platform/build/dragon.gb
          if-no-files-found: error
          retention-days: 7

  native-sdl-multi-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native SDL2 C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libsdl2-dev
          python -m pip install --disable-pip-version-check pytest
          pkg-config --modversion sdl2
      - name: Deterministic stage-generation proof and native SDL headless builds
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m pytest -q \
            tests/test_ai_webcrawler_dragon_game_blueprints.py \
            tests/test_ai_webcrawler_dragon_game_fitness.py \
            tests/test_ai_webcrawler_dragon_native_save.py \
            tests/test_ai_webcrawler_dragon_native_replay.py \
            tests/test_ai_webcrawler_dragon_campaign_quests.py \
            tests/test_ai_webcrawler_dragon_native_sega_snes.py \
            tests/test_ai_webcrawler_dragon_chip_music.py \
            tests/test_ai_webcrawler_dragon_native_variants.py
