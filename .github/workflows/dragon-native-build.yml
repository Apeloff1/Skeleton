        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,sqlite3
          from skeleton.ai.webcrawler.dragon_original_candidate_spool import (
              materialize_batch,audit_batch,
          )
          path=Path('/tmp/dragon-original-mechanic-evidence/original-candidates.sqlite')
          with sqlite3.connect(path) as db:
              produced=materialize_batch(db,start=500,count=4,
                                          routes=2,steps=12,branch_seed=1977)
              assert produced['new_original_source_candidates']==4
              assert (produced['new_original_playable_prototypes']+
                      produced['new_underbuilt_drafts']==4)
              assert produced['genuinely_finished_licensed_games']==0
              recheck=materialize_batch(db,start=500,count=4,
                                         routes=2,steps=12,branch_seed=1977)
              assert recheck['new_original_playable_prototypes']==0
              assert recheck['independently_verified_existing_prototypes']==4
              audit=audit_batch(db,start=500,count=4,branch_seed=1977)
              assert audit['all_actual_original_gameplay_replayed']
          path.with_suffix('.json').write_text(
              json.dumps({'source_materialization':produced,
                          'idempotent_recheck':recheck,
                          'independent_audit':audit},
                         sort_keys=True,indent=2)+'\n',
              encoding='utf-8')
          PY
