              GLOBAL_CHOICE_PATH_COUNT,PROGRAM_COUNT,materialize_path,
              verify_path,sample_paths,
          )
          root=Path("/tmp/dragon-genomic-world-proof")
          for name,index in (
              ("first_world","0"),
              ("largest_world",str(GENOMIC_WORLD_COUNT-1)),
          ):
              address=unrank_genome_address(index)
              current=initial_genomic_state(address)
              assert len(AXIS_ACTIONS)==len(AXIS_NAMES)==24
              beginning=current
              for action in AXIS_ACTIONS[:12]:
                  current=play(address,current,action)
              assert current.history_digest!=beginning.history_digest
              assert current.base.turn==12
              exact_path_index=str(int(index)*PROGRAM_COUNT)
              proof=materialize_path(exact_path_index)
              assert verify_path(proof)["verified"]
              data={
                  "schema":"skeleton.ai.dragon.genomic_release_gate.v1",
                  "world":name,
                  "exact_world_decimal_index":index,
                  "genome":address.genome_digest,
                  "physical":report(address,current,radius=1),
                  "real_path":asdict(proof),
                  "path_verification":verify_path(proof),
                  "world_count_exact_decimal":str(GENOMIC_WORLD_COUNT),
                  "path_count_exact_decimal":str(GLOBAL_CHOICE_PATH_COUNT),
                  "disclaimer":"sampled original state machines, not billions of compiled games",
              }
