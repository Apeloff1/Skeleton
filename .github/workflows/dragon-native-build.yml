            tests/test_ai_dragon_original_candidate_spool.py
      - name: Generate signed gameplay evidence for 16.7m nuclei and quintillion rulebook capacity
        run: |
          set -euo pipefail
          mkdir -p /tmp/dragon-original-mechanic-evidence
          python - <<'PY'
          from pathlib import Path
          import json
          from dataclasses import asdict
          from skeleton.ai.webcrawler.dragon_original_mechanic_forge import (
              PROGRAM_COUNT,MILLION_DISTINCT_ENABLE_PROFILES,
              make_program,binary_nucleus,capabilities,distinguish,
              prove_mechanic,initial,choices,perform,
          )
          from skeleton.ai.webcrawler.dragon_original_campaign_forge import (
              sample_experiences,compose_journey,verify_journey,
          )
          assert PROGRAM_COUNT==2**64
          assert MILLION_DISTINCT_ENABLE_PROFILES==2**24
          directory=Path('/tmp/dragon-original-mechanic-evidence')
          cases={
              'zero_program':make_program('0'),
              'single_rule':make_program('1'),
              'millionth_nucleus':binary_nucleus(1_000_000),
              'largest_nucleus':binary_nucleus(2**24-1),
              'highest_quintillion_program':make_program(str(2**64-1)),
          }
          sampled=[]
          for name,program in cases.items():
              portfolio=sample_experiences(
                  program,seed=1977,limit=16,steps=24)
              assert portfolio['sampled']==16
              assert portfolio['programs_materialized_as_finished_games']==0
              filename=directory/(name+'.json')
              filename.write_text(
                  json.dumps({
                      'kind':'actual_original_replayed_mechanic_program',
                      'program':asdict(program),
                      'replay_portfolio':portfolio,
                  },sort_keys=True,indent=2)+'\n',encoding='utf-8')
              sampled.append(name)
          for axis in range(32):
              from skeleton.ai.webcrawler.dragon_original_mechanic_forge import (
                  program_from_levels,
              )
              old=[0]*32
              old[axis]=1
              first=program_from_levels(tuple(old))
              old[axis]=3
              advanced=program_from_levels(tuple(old))
              assert distinguish(first,advanced)['distinguishable']
          assert len(sampled)==5
          print('ORIGINAL_MECHANIC_PROOFS_READY',len(sampled),
                'NATIVE_READY_FALSE',capabilities()['finished_unique_cleared_games'])
          PY
