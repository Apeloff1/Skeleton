name: Dragon Native ROM Build

on:
  pull_request:
    paths:
      - 'skeleton/ai/webcrawler/dragon_native_*.py'
      - 'skeleton/ai/webcrawler/dragon_living_world*.py'
      - 'skeleton/ai/webcrawler/dragon_original_mechanic_forge.py'
      - 'skeleton/ai/webcrawler/dragon_original_campaign_forge.py'
      - 'skeleton/ai/webcrawler/dragon_original_prototype_factory.py'
      - 'skeleton/ai/webcrawler/dragon_original_candidate_spool.py'
      - 'tests/test_ai_dragon_original_mechanic_forge.py'
      - 'tests/test_ai_dragon_original_campaign_forge.py'
      - 'tests/test_ai_dragon_original_mechanic_fusions.py'
      - 'tests/test_ai_dragon_original_prototype_factory.py'
      - 'tests/test_ai_dragon_original_candidate_spool.py'
      - 'backend/tests/test_dragon_original_prototype_routes.py'
      - 'backend/tests/test_dragon_original_mechanics_routes.py'
      - 'frontend/app/dragon-originals-forge.tsx'
      - 'skeleton/ai/webcrawler/dragon_world_genome.py'
      - 'skeleton/ai/webcrawler/dragon_world_codex.py'
      - 'skeleton/ai/webcrawler/dragon_world_codex_runtime.py'
      - 'skeleton/ai/webcrawler/dragon_codex_access_matrix.py'
      - 'skeleton/ai/webcrawler/dragon_codex_tiles.py'
      - 'skeleton/ai/webcrawler/dragon_world_story_grammar.py'
      - 'skeleton/ai/webcrawler/dragon_codex_*.py'
      - 'tests/test_ai_dragon_world_codex.py'
      - 'tests/test_ai_dragon_codex_access_matrix.py'
      - 'tests/test_ai_dragon_codex_tiles.py'
      - 'backend/tests/test_dragon_codex_tiles_routes.py'
      - 'tests/test_ai_dragon_world_story_grammar.py'
      - 'tests/test_ai_dragon_codex_desktop.py'
      - 'backend/tests/test_dragon_world_codex_routes.py'
      - 'frontend/app/dragon-world-codex.tsx'
      - 'skeleton/ai/webcrawler/dragon_genomic_world.py'
      - 'skeleton/ai/webcrawler/dragon_genomic_paths.py'
      - 'tests/test_ai_dragon_world_genome.py'
      - 'backend/tests/test_dragon_genomic_world_routes.py'
      - 'frontend/app/dragon-genomic-universe.tsx'
      - 'skeleton/ai/webcrawler/dragon_living_maze_solvers.py'
      - 'skeleton/ai/webcrawler/dragon_route_*.py'
      - 'tests/test_ai_dragon_living_world*.py'
      - 'tests/test_ai_dragon_living_maze_solvers.py'
      - 'tests/test_ai_dragon_route_*.py'
      - 'backend/tests/test_dragon_living_world*.py'
      - 'backend/tests/test_dragon_living_maze_routes.py'
      - 'backend/tests/test_dragon_route_*.py'
      - 'frontend/app/dragon-living-world.tsx'
      - 'frontend/app/dragon-maze-world.tsx'
      - 'frontend/app/dragon-route-atlas.tsx'
      - 'frontend/src/product/productCatalog.ts'
      - 'skeleton/ai/webcrawler/dragon_game_blueprints.py'
      - 'skeleton/ai/webcrawler/dragon_game_design.py'
      - 'skeleton/ai/webcrawler/dragon_playtest_planner.py'
      - 'skeleton/ai/webcrawler/dragon_build_evidence.py'
      - 'skeleton/ai/webcrawler/dragon_native_raycaster.py'
      - 'skeleton/ai/webcrawler/dragon_native_3d_era.py'
      - 'skeleton/ai/webcrawler/dragon_native_puzzle.py'
      - 'skeleton/ai/webcrawler/dragon_native_artforge.py'
      - 'skeleton/ai/webcrawler/dragon_hw_graphics.py'
      - 'skeleton/ai/webcrawler/dragon_hardware_budget.py'
      - 'skeleton/ai/webcrawler/dragon_game_fitness.py'
      - 'skeleton/ai/webcrawler/dragon_native_gbc.py'
      - 'skeleton/ai/webcrawler/dragon_native_save_system.py'
      - 'skeleton/ai/webcrawler/dragon_native_replay_system.py'
      - 'skeleton/ai/webcrawler/dragon_gb_platformer.py'
      - 'skeleton/ai/webcrawler/dragon_campaign_quests.py'
      - 'skeleton/ai/webcrawler/dragon_chip_music.py'
      - 'skeleton/ai/webcrawler/dragon_gb_sound.py'
      - 'tests/test_ai_webcrawler_dragon_game_fitness.py'
      - 'tests/test_ai_webcrawler_dragon_native_3d_design.py'
      - 'tests/test_ai_webcrawler_dragon_native_3d_era.py'
      - 'tests/test_ai_webcrawler_dragon_platform_matrix.py'
      - 'tests/test_ai_webcrawler_dragon_native_puzzle.py'
      - 'tests/test_ai_webcrawler_dragon_playtest_planner.py'
      - 'tests/test_ai_webcrawler_dragon_build_evidence.py'
      - 'tests/test_ai_webcrawler_dragon_game_design_effects.py'
      - 'tests/test_ai_webcrawler_dragon_native_curriculum.py'
      - 'tests/test_ai_webcrawler_dragon_adaptive_cycles.py'
      - 'backend/tests/test_dragon_academy_routes.py'
      - 'tests/test_ai_webcrawler_dragon_hw_graphics.py'
      - 'tests/test_ai_webcrawler_dragon_native_gbc.py'
      - 'tests/test_ai_webcrawler_dragon_native_save.py'
      - 'tests/test_ai_webcrawler_dragon_native_replay.py'
      - 'tests/test_ai_webcrawler_dragon_native_platformer.py'
      - 'tests/test_ai_webcrawler_dragon_campaign_quests.py'
      - 'tests/test_ai_webcrawler_dragon_native_sega_snes.py'
      - 'tests/test_ai_webcrawler_dragon_chip_music.py'
      - 'skeleton/ai/webcrawler/dragon_retro_assets.py'
      - 'tests/test_ai_webcrawler_dragon_game_blueprints.py'
      - 'tests/test_ai_webcrawler_dragon_retro_assets.py'
      - 'skeleton/ai/webcrawler/dragon_practice_lab.py'
      - 'skeleton/ai/webcrawler/dragon_practice_cycles.py'
      - 'tests/test_ai_webcrawler_dragon_native_*.py'
      - 'tests/test_ai_dragon_native_*.py'
      - '.github/workflows/dragon-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-native-rom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-gb-and-nes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native game sources and creator script syntax before toolchain installation
        run: |
          set -euo pipefail
          python -m compileall -q skeleton/ai/webcrawler/dragon_native_*.py
          python -m compileall -q backend/routes/dragon_academy.py
          node --check frontend/scripts/test-dragon-native-puzzle-preview.mjs
      - name: Install native ROM toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 build-essential bison flex libpng-dev pkg-config
          python -m pip install --disable-pip-version-check pytest
      - name: Install RGBDS version 1.0.0
        run: |
          git clone --depth 1 --branch v1.0.0 https://github.com/gbdev/rgbds.git /tmp/dragon-rgbds
          make -C /tmp/dragon-rgbds -j 2
          sudo make -C /tmp/dragon-rgbds install
          rgbasm --version
          ca65 --version
      - name: Execute real native ROM compilation tests
        run: |
          python -m pytest -q \
            tests/test_ai_dragon_native_production.py \
            tests/test_ai_dragon_native_desktop.py \
            tests/test_ai_dragon_native_artforge.py \
            tests/test_ai_dragon_native_evolution.py \
            tests/test_ai_dragon_native_puzzle_hints.py \
            tests/test_ai_dragon_native_puzzle_trace.py \
            tests/test_ai_dragon_native_puzzle_variants.py \
            tests/test_ai_dragon_native_puzzle_authoring.py \
            tests/test_ai_dragon_native_puzzle_challenge.py \
            tests/test_ai_dragon_native_puzzle_save.py \
            tests/test_ai_dragon_native_multipath.py \
            tests/test_ai_dragon_native_campaign_paths.py \
            tests/test_ai_dragon_native_challenge_director.py \
            tests/test_ai_dragon_native_level_curation.py \
            tests/test_ai_dragon_route_world.py \
            tests/test_ai_dragon_route_native_game.py \
            tests/test_ai_dragon_route_native_integration.py \
            tests/test_ai_dragon_route_world_assurance.py \
            tests/test_ai_dragon_route_world_batch.py \
            tests/test_ai_dragon_route_maze.py \
            tests/test_ai_dragon_route_maze_native.py \
            tests/test_ai_dragon_route_maze_integration.py \
            tests/test_ai_dragon_route_atlas.py \
            tests/test_ai_dragon_route_world_assurance.py \
            tests/test_ai_dragon_native_puzzle_graphics.py \
            tests/test_ai_webcrawler_dragon_native_projects.py \
            tests/test_ai_webcrawler_dragon_native_compile.py \
            tests/test_ai_webcrawler_dragon_native_cycles.py \
            tests/test_ai_webcrawler_dragon_native_3d_design.py \
            tests/test_ai_webcrawler_dragon_native_3d_era.py \
            tests/test_ai_webcrawler_dragon_platform_matrix.py \
            tests/test_ai_webcrawler_dragon_native_puzzle.py \
            tests/test_ai_webcrawler_dragon_native_rpg.py \
            tests/test_ai_webcrawler_dragon_native_rhythm.py \
            tests/test_ai_webcrawler_dragon_playtest_planner.py \
            tests/test_ai_webcrawler_dragon_build_evidence.py \
            tests/test_ai_webcrawler_dragon_native_curriculum.py \
            tests/test_ai_webcrawler_dragon_adaptive_cycles.py \
            tests/test_ai_webcrawler_dragon_game_design_effects.py \
            tests/test_ai_webcrawler_dragon_hw_graphics.py \
            tests/test_ai_webcrawler_dragon_native_variants.py \
            tests/test_ai_webcrawler_dragon_retro_assets.py \
            tests/test_ai_webcrawler_dragon_native_c64.py \
            tests/test_ai_webcrawler_dragon_native_gbc.py \
            tests/test_ai_webcrawler_dragon_native_platformer.py
      - name: Compile authored hero art and movement animations in actual GB CGB NES ROMs
        run: |
          set -euo pipefail
          cat > /tmp/dragon-authored-game.json <<'JSON'
          {
            "schema":"skeleton.ai.dragon.portable_game_design.v1",
            "palette":"dmg_green",
            "hero":"robot",
            "quest_theme":"space",
            "difficulty":7,
            "stages":5,
            "candidates":8,
            "project_notes":"Original art-directed homebrew with input-driven sprite motion"
          }
          JSON
          python -m skeleton.ai.webcrawler.dragon_native_production build \
            --title "Original Sprite and World Campaign" \
            --style arcade_score_attack \
            --targets game_boy,game_boy_color,nes \
            --portable-design /tmp/dragon-authored-game.json \
            --attest-original-rights --compile-roms --require-compiled \
            --out /tmp/dragon-original-art-roms \
            > /tmp/dragon-original-art-build.json
          python -m skeleton.ai.webcrawler.dragon_native_production build \
            --title "Original Scrolling Pixel Quest" \
            --style side_scrolling_platformer \
            --targets game_boy --portable-design /tmp/dragon-authored-game.json \
            --attest-original-rights --compile-roms --require-compiled \
            --out /tmp/dragon-original-art-platformer \
            > /tmp/dragon-original-art-platformer.json
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from skeleton.ai.webcrawler.dragon_native_production import (
              verify_published_production, verify_source_release,
          )
          runs = (
              ("/tmp/dragon-original-art-build.json", "/tmp/dragon-original-art-roms", 3),
              ("/tmp/dragon-original-art-platformer.json", "/tmp/dragon-original-art-platformer", 1),
          )
          for receipt_path, root_path, count in runs:
              result = json.loads(Path(receipt_path).read_text())
              assert result["status"] == "published"
              audit = verify_published_production(Path(root_path), result["index"])
              assert audit["archives_verified"] == count
              for item in result["artifacts"]:
                  assert item["binary_sha256"] and item["original_art_sha256"]
                  archive = (Path(root_path) / item["archive_name"]).read_bytes()
                  proof = verify_source_release(archive)
                  assert proof["port_plan"]["portable_profile"]["hero"] == "robot"
                  assert proof["original_art_sha256"] == item["original_art_sha256"]
                  with ZipFile(BytesIO(archive)) as native:
                      assert "source/dragon-native-art.json" in native.namelist()
              print("ORIGINAL_GAME_ROM_AND_ART_APPLIED", audit["request_id"])
          PY
      - name: Prove multi-game evolution produces distinct verified native cartridges
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from skeleton.ai.webcrawler.dragon_native_production import ProductionRequest, PortableGameDesign
          from skeleton.ai.webcrawler.dragon_native_evolution import (
              EvolutionSeriesRequest, build_evolution_series, verify_evolution_series,
          )
          specification = EvolutionSeriesRequest(
              base=ProductionRequest(
                  title="Original Evolving Crystal Expedition",
                  style="arcade_score_attack", targets=("game_boy", "nes"),
                  seed=1977, original_work_attested=True,
                  portable_design=PortableGameDesign(
                      hero="robot", quest_theme="crystals", palette="dmg_green",
                      stages=4, candidates=6, difficulty=3,
                  ),
              ),
              editions=3,
          )
          root = Path("/tmp/dragon-evolution-series")
          release = build_evolution_series(specification, root, authorized=True)
          assert release["status"] == "published"
          audit = verify_evolution_series(root, release["index"])
          assert audit["source_projects_verified"] == 6
          assert audit["editions_verified"] == 3
          print("DRAGON_NATIVE_GAME_EVOLUTION_VERIFIED",audit["index_sha256"])
          PY
      - name: Compile and verify player-authored original puzzle campaigns
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from skeleton.ai.webcrawler.dragon_native_puzzle_authoring import (
              authored_document, starter_authored_levels,
          )
          from skeleton.ai.webcrawler.dragon_native_puzzle import BASE_LEVELS
          from skeleton.ai.webcrawler.dragon_native_production import (
              ProductionRequest, PortableGameDesign,
          )
          from skeleton.ai.webcrawler.dragon_native_desktop import (
              build_native_puzzle_executable, verify_native_puzzle_executable,
          )
          from zipfile import ZipFile
          from io import BytesIO
          import json

          layouts = (BASE_LEVELS[0], BASE_LEVELS[3])
          spec = ProductionRequest(
              title="Original Authored Level Creator",
              style="fixed_screen_puzzle", targets=("pc_linux",),
              seed=1923, original_work_attested=True,
              authored_puzzles=layouts,
              portable_design=PortableGameDesign(stages=2, difficulty=6),
          )
          package, report = build_native_puzzle_executable(spec, authorized=True)
          assert report["independent_replays_verified"] == 8
          audit = verify_native_puzzle_executable(package)
          assert audit["source_level_proofs"] == 2
          with ZipFile(BytesIO(package)) as released:
              with ZipFile(BytesIO(released.read("source/native-source-release.zip"))) as sources:
                  game = json.loads(sources.read("source/dragon-puzzle-proof.json"))
                  assert game["authoring_mode"] == "authored"
                  assert game["authored_level_rows"] == [list(x) for x in layouts]
          print("NATIVE_USER_AUTHORED_GAME_REPLAYED", audit["executable_sha256"])
          PY
      - name: Build original Game Boy ROM
        run: |
          python -m skeleton.ai.webcrawler.dragon_native_cli \
            --target game_boy --out /tmp/dragon-gameboy --compile
          test -s /tmp/dragon-gameboy/build/dragon.gb
      - name: Compile original Game Boy Color cartridge
        run: |
          python -m skeleton.ai.webcrawler.dragon_native_cli \
            --target game_boy_color --out /tmp/dragon-gameboy-color --compile
          test -s /tmp/dragon-gameboy-color/build/dragon.gbc
      - name: Compile actual Game Boy scrolling platformer ROM
        run: |
          python -m skeleton.ai.webcrawler.dragon_native_cli \
            --target game_boy --style side_scrolling_platformer \
            --out /tmp/dragon-gameboy-platform --compile
          test -s /tmp/dragon-gameboy-platform/build/dragon.gb
      - name: Build original NES ROM
        run: |
          python -m skeleton.ai.webcrawler.dragon_native_cli \
            --target nes --out /tmp/dragon-nes --compile
          test -s /tmp/dragon-nes/build/dragon.nes
      - name: Verify complete Dragon production pipeline with real GB and NES binaries
        run: |
          set -euo pipefail
          python -m skeleton.ai.webcrawler.dragon_native_production build \
            --title "Original Dragon Campaign" \
            --style arcade_score_attack \
            --targets game_boy,nes \
            --attest-original-rights --compile-roms --require-compiled \
            --out /tmp/dragon-production \
            > /tmp/dragon-production-build.json
          python - <<'PY'
          import json
          from pathlib import Path
          from skeleton.ai.webcrawler.dragon_native_production import (
              verify_published_production, verify_source_release,
          )
          from zipfile import ZipFile
          from io import BytesIO
          result = json.loads(Path("/tmp/dragon-production-build.json").read_text())
          assert result["status"] == "published"
          assert {a["target"] for a in result["artifacts"]} == {"game_boy", "nes"}
          assert all(a["binary_sha256"] and
                     a["compiler_state"] == "compiled_native"
                     for a in result["artifacts"])
          report = verify_published_production(
              Path("/tmp/dragon-production"), result["index"])
          assert report["archives_verified"] == 2
          for artifact in result["artifacts"]:
              path = Path("/tmp/dragon-production") / artifact["archive_name"]
              with ZipFile(BytesIO(path.read_bytes())) as archive:
                  receipt = verify_source_release(path.read_bytes())
                  assert receipt["evidence"] == "rom_structural_verified"
                  assert receipt["binary_member"] in archive.namelist()
          print("DRAGON_PRODUCTION_REAL_ROM_VERIFIED", report["request_id"])
          PY
      - name: Build real standalone Linux C99 original puzzle game and selftest
        run: |
          set -euo pipefail
          python -m skeleton.ai.webcrawler.dragon_native_desktop build \
            --title "Original Dragon Puzzle Campaign" --seed 1977 \
            --stages 6 --difficulty 8 --attest-original-rights \
            --authorize-local-build --out /tmp/dragon-native-puzzle \
            > /tmp/dragon-native-puzzle-build.json
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from skeleton.ai.webcrawler.dragon_native_desktop import verify_native_puzzle_executable
          result = json.loads(Path("/tmp/dragon-native-puzzle-build.json").read_text())
          assert result["status"] == "native_linux_executable_built_and_selftested"
          package = (Path("/tmp/dragon-native-puzzle") / result["filename"]).read_bytes()
          receipt = verify_native_puzzle_executable(package)
          assert receipt["source_level_proofs"] == 6
          assert receipt["runtime_stages_claimed_by_builder"] == 6
          assert result["evidence"]["native_hint_selftest"] == "current_position_bfs_all_stages_passed"
          assert result["evidence"]["native_branch_selftest"] == "all_actual_branch_transitions_and_endings_replayed"
          assert result["evidence"]["branch_endings_verified"] == 2
          assert result["evidence"]["branch_transitions_verified"] >= 6
          assert result["evidence"]["branch_endings_verified"] == 2
          assert result["evidence"]["independent_replays_verified"] == 24
          assert result["evidence"]["native_challenge_selftest"] == "optimal_route_three_stars_all_stages"
          with ZipFile(BytesIO(package)) as archive:
              executable = archive.read("binary/dragon_game")
          assert executable[:4] == b"\x7fELF"
          print("DRAGON_NATIVE_LINUX_PUZZLE_EXECUTED", receipt["executable_sha256"])
          PY
      - name: Compile and replay original Steam Deck-target Linux game
        run: |
          set -euo pipefail
          python -m skeleton.ai.webcrawler.dragon_native_desktop build \
            --title "Original Dragon Deck Expedition" --target steam_deck \
            --seed 2026 --stages 3 --difficulty 8 \
            --attest-original-rights --authorize-local-build \
            --out /tmp/original-dragon-deck > /tmp/dragon-deck-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          from skeleton.ai.webcrawler.dragon_native_desktop import verify_native_puzzle_executable
          result=json.loads(Path("/tmp/dragon-deck-result.json").read_text())
          assert result["status"]=="native_linux_executable_built_and_selftested"
          assert result["evidence"]["native_target"]=="steam_deck"
          assert result["evidence"]["independent_replays_verified"]==12
          audit=verify_native_puzzle_executable(
              (Path("/tmp/original-dragon-deck")/result["filename"]).read_bytes())
          assert audit["source_level_proofs"]==3
          print("ORIGINAL_STEAM_DECK_LINUX_HOST_GAME_PASS",audit["executable_sha256"])
          PY
      - name: Publish original Linux executable and runtime replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: dragon-original-native-linux-puzzle
          path: /tmp/dragon-native-puzzle/dragon-native-puzzle-*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish original homebrew ROM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dragon-native-homebrew-roms
          path: |
            /tmp/dragon-gameboy/build/dragon.gb
            /tmp/dragon-nes/build/dragon.nes
            /tmp/dragon-gameboy-color/build/dragon.gbc
            /tmp/dragon-gameboy-platform/build/dragon.gb
          if-no-files-found: error
          retention-days: 7

  native-sdl-multi-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native SDL2 C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libsdl2-dev
          python -m pip install --disable-pip-version-check pytest
          pkg-config --modversion sdl2
      - name: Deterministic stage-generation proof and native SDL headless builds
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m pytest -q \
            tests/test_ai_webcrawler_dragon_game_blueprints.py \
            tests/test_ai_webcrawler_dragon_game_fitness.py \
            tests/test_ai_webcrawler_dragon_native_save.py \
            tests/test_ai_webcrawler_dragon_native_replay.py \
            tests/test_ai_webcrawler_dragon_campaign_quests.py \
            tests/test_ai_webcrawler_dragon_native_sega_snes.py \
            tests/test_ai_webcrawler_dragon_chip_music.py \
            tests/test_ai_webcrawler_dragon_native_variants.py \
            tests/test_ai_dragon_native_puzzle_graphics.py \
            tests/test_ai_dragon_native_capture_operator.py \
            tests/test_ai_dragon_native_media_storyboard.py


      - name: Record and audit genuine original game pixels from native SDL
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          python -m skeleton.ai.webcrawler.dragon_native_capture_operator capture \
            --title "Original Dragon Game Preview" \
