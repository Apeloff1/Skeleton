    branches: [main]
    paths:
      - "skeleton/jeeves/game_engine_lab.py"
      - "skeleton/jeeves/core.py"
      - "skeleton/jeeves/game_engine_legacy.py"
      - "skeleton/jeeves/game_engine_3d.py"
