name: Jeeves Game Engine Era Lab

on:
  pull_request:
    paths:
      - "skeleton/jeeves/game_engine_lab.py"
      - "skeleton/jeeves/__init__.py"
      - "skeleton/testing/test_jeeves_game_engine_lab.py"
      - ".github/workflows/jeeves-game-engine-era-lab.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/jeeves/game_engine_lab.py"
      - "skeleton/jeeves/__init__.py"
      - "skeleton/testing/test_jeeves_game_engine_lab.py"
      - ".github/workflows/jeeves-game-engine-era-lab.yml"

permissions:
  contents: read

jobs:
  era-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
          cache: "pip"
      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Compile game-engine lab
        run: python -m compileall -q skeleton/jeeves/game_engine_lab.py
      - name: Run Pong-to-next sandbox regressions
        run: python -m pytest -q skeleton/testing/test_jeeves_game_engine_lab.py
