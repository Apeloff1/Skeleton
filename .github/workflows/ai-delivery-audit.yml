name: AI Delivery Integrity Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/report_ai_completion.py"
      - "scripts/check_ai_masterplan_parse_index.py"
      - "tests/test_ai_delivery_audit.py"
      - "machine/ai_master_plan.json"
      - "machine/ai_build_accountability.json"
      - "machine/ai_masterplan_parse_index.json"
      - "machine/ai_p1_task_backlog.json"
      - "machine/ai_p3_learning_closure.json"
      - "machine/ai_p3_training_closure.json"
      - ".github/workflows/ai-delivery-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/report_ai_completion.py"
      - "scripts/check_ai_masterplan_parse_index.py"
      - "tests/test_ai_delivery_audit.py"
      - "machine/ai_master_plan.json"
      - "machine/ai_build_accountability.json"
      - "machine/ai_masterplan_parse_index.json"
      - "machine/ai_p1_task_backlog.json"
      - "machine/ai_p3_learning_closure.json"
      - "machine/ai_p3_training_closure.json"
      - ".github/workflows/ai-delivery-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-delivery-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delivery-integrity:
    name: Separate signed plan from executed AI delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused tests
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Verify current masterplan index
        run: python scripts/check_ai_masterplan_parse_index.py
      - name: Check audited percentages and fail-closed edge cases
        run: python -m pytest -q --noconftest tests/test_ai_delivery_audit.py
      - name: Publish exact-head delivery claims without falsely signing product completion
        run: python scripts/report_ai_completion.py --json
