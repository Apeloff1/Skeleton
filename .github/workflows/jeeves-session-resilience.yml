name: Jeeves Session Resilience

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/jeeves/core.py"
      - "tests/test_jeeves_session_resilience.py"
      - "tests/test_jeeves_session_resilience_followup.py"
      - ".github/workflows/jeeves-session-resilience.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/jeeves/core.py"
      - "tests/test_jeeves_session_resilience.py"
      - "tests/test_jeeves_session_resilience_followup.py"
      - ".github/workflows/jeeves-session-resilience.yml"

concurrency:
  group: jeeves-session-resilience-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resilience:
    name: Session rollback and resource bounds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install focused runtime
        run: python -m pip install "pytest>=8,<9" "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Compile Jeeves session slice
        run: python -m compileall -q skeleton/jeeves
      - name: Run session resilience suites
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q
          tests/test_jeeves_session_resilience.py
          tests/test_jeeves_session_resilience_followup.py
