name: Automation Traffic Manager

on:
  schedule:
    # Six-hour admission cadence; manual override remains available.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass soft cooldown/no-demand suppression (hard capacity still applies)"
        required: false
        default: false
        type: boolean

# Deny authority by default. Admission is read-only; the dispatch job receives
# only actions:write so it can queue the already-reviewed Supervisor workflow.
permissions: {}

concurrency:
  group: automation-traffic-manager-${{ github.repository }}
  cancel-in-progress: false

jobs:
  admission:
    name: Measure pressure and admit one automation lane
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      admit: ${{ steps.traffic.outputs.admit }}
      reason: ${{ steps.traffic.outputs.reason }}
      lane: ${{ steps.traffic.outputs.lane }}
      active_runs: ${{ steps.traffic.outputs.active_runs }}
      queued_runs: ${{ steps.traffic.outputs.queued_runs }}
      critical_active: ${{ steps.traffic.outputs.critical_active }}
      stale_queued_runs: ${{ steps.traffic.outputs.stale_queued_runs }}
      provider_tombstones: ${{ steps.traffic.outputs.provider_tombstones }}
      oldest_queued_age_seconds: ${{ steps.traffic.outputs.oldest_queued_age_seconds }}
      inventory_saturated: ${{ steps.traffic.outputs.inventory_saturated }}
      relieve: ${{ steps.traffic.outputs.relieve }}
      relief_reason: ${{ steps.traffic.outputs.relief_reason }}
      decision_json: ${{ steps.traffic.outputs.decision_json }}
      admitted_base_sha: ${{ steps.identity.outputs.base_sha }}
      decision_base_sha: ${{ steps.traffic.outputs.base_sha }}
      decision_observed_at: ${{ steps.traffic.outputs.observed_at }}
      decision_fingerprint: ${{ steps.traffic.outputs.decision_fingerprint }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
      TRAFFIC_EVENT_REF: ${{ github.ref }}
      TRAFFIC_EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
      TRAFFIC_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
    steps:
      - name: Require default-branch traffic control
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TRAFFIC_EXPECTED_REF"
          test "$TRAFFIC_EVENT_REF" = "$TRAFFIC_EXPECTED_REF"

      - name: Capture immutable admission identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Traffic manager did not receive a full commit SHA."
            exit 1
          }
          echo "base_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable traffic policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"

      - name: Install traffic manager runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'pydantic>=2,<3' \
            'pydantic-settings>=2,<3'

      - name: Evaluate bounded automation pressure
        id: traffic
        run: >-
          python -m skeleton.automation.traffic_manager
          --emit-github-output "$GITHUB_OUTPUT"

  relief:
    name: Queue bounded Actions relief
    needs: admission
    if: ${{ needs.admission.outputs.relieve == 'true' }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TRAFFIC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Dispatch queue drain when no recovery run is live
        shell: bash
        run: |
          set -euo pipefail
          live=0
          for status_name in requested waiting pending queued in_progress; do
            count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/queue-drain.yml/runs?status=${status_name}&per_page=1" --jq '.total_count')
            [[ "$count" =~ ^[0-9]+$ ]] || {
              echo "::error::Invalid queue-drain run count for ${status_name}."
              exit 1
            }
            if (( count > 0 )); then
              live=1
              break
            fi
          done
          if (( live > 0 )); then
            echo "Queue drain already live; coalescing recovery request."
            exit 0
          fi
          gh workflow run queue-drain.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TRAFFIC_DEFAULT_BRANCH"

      # Do not auto-convert ready PRs into drafts under queue pressure.
      # Draft conversion destroys merge throughput and produces new PR events.
      # Controller relief is limited to a single coalesced queue-drain wake.
      - name: Preserve ready PR mergeability
        run: echo 'Queue relief did not modify PR draft/ready state.'

  dispatch:
    name: Queue admitted repository supervisor
    needs: admission
    if: ${{ needs.admission.outputs.admit == 'true' }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TRAFFIC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      TRAFFIC_ADMITTED_BASE_SHA: ${{ needs.admission.outputs.admitted_base_sha }}
      TRAFFIC_DECISION_BASE_SHA: ${{ needs.admission.outputs.decision_base_sha }}
      TRAFFIC_DECISION_OBSERVED_AT: ${{ needs.admission.outputs.decision_observed_at }}
      TRAFFIC_DECISION_FINGERPRINT: ${{ needs.admission.outputs.decision_fingerprint }}
    steps:
      - name: Revalidate admission and dispatch reviewed supervisor workflow
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRAFFIC_ADMITTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Admission did not provide a full commit SHA."
            exit 1
          }
          [[ "$TRAFFIC_DECISION_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Traffic decision did not bind a full base SHA."
            exit 1
          }
          [[ "$TRAFFIC_DECISION_OBSERVED_AT" =~ ^[1-9][0-9]{0,11}$ ]] || {
            echo "::error::Traffic decision observation epoch is malformed."
            exit 1
          }
          [[ "$TRAFFIC_DECISION_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Traffic decision fingerprint is malformed."
            exit 1
          }
          [[ "$TRAFFIC_ADMITTED_BASE_SHA" = "$TRAFFIC_DECISION_BASE_SHA" ]] || {
            echo "::error::Admission identity differs from traffic decision custody."
            exit 1
          }
          # Keep the actions:write dispatch runner checkout-free. Verify the
          # admission fingerprint with the standard library and the exact
          # canonical format used by traffic_manager.decision_identity_fingerprint.
          expected_fingerprint=$(python - <<'PY'
          import hashlib
          import json
          import os

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "base_sha": os.environ["TRAFFIC_DECISION_BASE_SHA"].lower(),
              "observed_at": int(os.environ["TRAFFIC_DECISION_OBSERVED_AT"]),
          }
          canonical = json.dumps(
              payload, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          print(hashlib.sha256(canonical).hexdigest())
          PY
          )
          test "$expected_fingerprint" = "$TRAFFIC_DECISION_FINGERPRINT" || {
            echo "::error::Traffic decision fingerprint failed independent verification."
            exit 1
          }
          [[ "$TRAFFIC_DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::Default branch contains unexpected characters."
            exit 1
          }

          live_sha=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TRAFFIC_DEFAULT_BRANCH}" \
            --jq '.object.sha')
          [[ "$live_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub returned an invalid default-branch head."
            exit 1
          }

          if [[ "$live_sha" != "$TRAFFIC_ADMITTED_BASE_SHA" ]]; then
            echo "Admission became stale (${TRAFFIC_ADMITTED_BASE_SHA} != ${live_sha}); coalescing this dispatch."
            exit 0
          fi

          gh workflow run supervisor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TRAFFIC_DEFAULT_BRANCH" \
            -f "expected_base_sha=$TRAFFIC_ADMITTED_BASE_SHA"
