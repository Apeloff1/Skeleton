name: Homebrew Historical Archive

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/ai/game_builder/platform_catalog.json"
      - "skeleton/ai/game_builder/platform_registry.py"
      - "skeleton/ai/game_builder/port_planner.py"
      - "skeleton/ai/game_builder/editor_platforms.py"
      - "skeleton/ai/game_builder/archive_import.py"
      - "skeleton/ai/game_builder/evolution_lineages.json"
      - "skeleton/ai/game_builder/evolution_archive.py"
      - "skeleton/ai/game_builder/evolution_practice.py"
      - "skeleton/ai/game_builder/desktop_native_export.py"
      - "skeleton/ai/game_builder/archive_cli.py"
      - "skeleton/ai/game_builder/legal_authorities.json"
      - "skeleton/ai/game_builder/legal_paths.py"
      - "skeleton/ai/game_builder/legal_port_bridge.py"
      - "skeleton/ai/game_builder/legal_census.py"
      - "skeleton/ai/game_builder/legal_native_export.py"
      - "skeleton/ai/game_builder/plagiarism_guard.py"
      - "skeleton/ai/game_builder/media_similarity.py"
      - "skeleton/ai/game_builder/release_assurance.py"
      - "skeleton/ai/game_builder/release_trust_anchor.py"
      - "skeleton/testing/test_game_builder_release_trust_anchor.py"
      - "skeleton/testing/test_game_builder_release_adversarial_matrix.py"
      - "skeleton/testing/test_game_builder_originality_adversarial.py"
      - "skeleton/ai/game_builder/asset_credits.py"
      - "skeleton/ai/game_builder/native_release_intake.py"
      - "skeleton/ai/game_builder/native_binary_structure.py"
      - "skeleton/ai/game_builder/native_retro_artifact.py"
      - "skeleton/testing/test_game_builder_native_retro_artifact.py"
      - "skeleton/testing/test_game_builder_native_binary_structure.py"
      - "skeleton/testing/test_game_builder_strict_release_pipeline.py"
      - "skeleton/ai/game_builder/release_pipeline.py"
      - "skeleton/ai/game_builder/sega_8bit_native_export.py"
      - "skeleton/ai/game_builder/sega_8bit_rom.py"
      - "skeleton/testing/test_game_builder_sega_8bit_native.py"
      - "skeleton/testing/test_game_builder_sega_8bit_rom.py"
      - "skeleton/testing/test_game_builder_native_sega8_ci.py"
      - "scripts/game_builder/native_sega_8bit_ci.py"
      - "scripts/game_builder/sega8_source_replay.py"
      - "scripts/game_builder/emulate_sega8_sdcc_boot.py"
      - "scripts/game_builder/sega8_port_parity.py"
      - "scripts/game_builder/sega8_real_z80_gameplay.py"
      - "skeleton/testing/test_game_builder_sega8_real_z80_gameplay.py"
      - "scripts/game_builder/sega8_real_z80_gameplay.py"
      - "skeleton/testing/test_game_builder_sega8_real_z80_gameplay.py"
      - "skeleton/testing/test_game_builder_sega8_port_parity.py"
      - "skeleton/testing/test_game_builder_sega8_sdcc_cpu_boot.py"
      - "scripts/game_builder/sega8_host_shim.h"
      - "scripts/game_builder/sega8_host_replay.c"
      - "skeleton/testing/test_game_builder_sega8_host_replay.py"
      - "skeleton/ai/game_builder/sega_reproducibility.py"
      - "skeleton/testing/test_game_builder_sega_reproducibility.py"
      - "scripts/game_builder/sega_reproducibility_ci.py"
      - "scripts/game_builder/sega8_port_parity.py"
      - "skeleton/testing/test_game_builder_sega8_port_parity.py"
      - "docs/GAME_BUILDER_SEGA_8BIT_HOME_BREW.md"
      - "skeleton/testing/test_game_builder_native_release_intake.py"
      - "docs/GAME_BUILDER_NATIVE_BYTE_INTAKE.md"
      - "docs/GAME_BUILDER_ADVERSARIAL_RELEASE_THREAT_MODEL.md"
      - "docs/GAME_BUILDER_EXECUTABLE_FORMAT_VALIDATION.md"
      - "skeleton/testing/test_game_builder_asset_credits.py"
      - "skeleton/testing/test_game_builder_release_assurance.py"
      - "docs/GAME_BUILDER_SIGNED_RELEASE_REVIEW.md"
      - "skeleton/testing/test_game_builder_media_similarity.py"
      - "skeleton/ai/game_builder/plagiarism_cli.py"
      - "skeleton/testing/test_game_builder_plagiarism_guard.py"
      - "docs/GAME_BUILDER_ORIGINALITY_POLICY.md"
      - "skeleton/testing/test_game_builder_legal_paths.py"
      - "docs/GAME_BUILDER_LEGAL_CROSSREFERENCE.md"
      - "skeleton/testing/test_game_builder_platform_porting.py"
      - "skeleton/testing/test_game_builder_archive_evolution.py"
      - ".github/workflows/game-hardware-archive.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-hardware-archive-${{ github.ref }}
  # Finish the currently running focused suite during collaborative updates.
  # GitHub coalesces pending executions for this ref; cancelling active jobs
  # on every other contributor's push never produces a stable validation.
  cancel-in-progress: false

jobs:
  archive-and-evolution-tests:
    name: Historical metadata and playable homebrew evolutions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test runner
        run: python -m pip install "pytest>=8,<10" "Pillow>=11,<13" "cryptography>=50,<60"
      - name: Compile archival module syntax
        run: |
          python -m compileall -q skeleton/ai/game_builder/platform_registry.py skeleton/ai/game_builder/port_planner.py skeleton/ai/game_builder/editor_platforms.py skeleton/ai/game_builder/archive_import.py skeleton/ai/game_builder/evolution_archive.py skeleton/ai/game_builder/evolution_practice.py skeleton/ai/game_builder/desktop_native_export.py skeleton/ai/game_builder/archive_cli.py skeleton/ai/game_builder/legal_paths.py skeleton/ai/game_builder/legal_port_bridge.py skeleton/ai/game_builder/legal_census.py skeleton/ai/game_builder/legal_native_export.py skeleton/ai/game_builder/plagiarism_guard.py skeleton/ai/game_builder/plagiarism_cli.py skeleton/ai/game_builder/media_similarity.py skeleton/ai/game_builder/release_assurance.py skeleton/ai/game_builder/release_trust_anchor.py skeleton/ai/game_builder/asset_credits.py skeleton/ai/game_builder/native_release_intake.py skeleton/ai/game_builder/release_pipeline.py skeleton/ai/game_builder/native_binary_structure.py skeleton/ai/game_builder/native_retro_artifact.py skeleton/ai/game_builder/sega_8bit_native_export.py skeleton/ai/game_builder/sega_8bit_rom.py scripts/game_builder/sega8_source_replay.py scripts/game_builder/emulate_sega8_sdcc_boot.py scripts/game_builder/sega8_port_parity.py scripts/game_builder/sega8_real_z80_gameplay.py scripts/game_builder/sega8_real_z80_gameplay.py skeleton/ai/game_builder/sega_reproducibility.py scripts/game_builder/sega_reproducibility_ci.py scripts/game_builder/sega8_port_parity.py
      - name: Run focused historical archive and homebrew output regressions
        run: |
          python -m pytest -q skeleton/testing/test_game_builder_platform_porting.py skeleton/testing/test_game_builder_archive_evolution.py skeleton/testing/test_game_builder_legal_paths.py skeleton/testing/test_game_builder_plagiarism_guard.py skeleton/testing/test_game_builder_media_similarity.py skeleton/testing/test_game_builder_release_assurance.py skeleton/testing/test_game_builder_release_trust_anchor.py skeleton/testing/test_game_builder_release_adversarial_matrix.py skeleton/testing/test_game_builder_originality_adversarial.py skeleton/testing/test_game_builder_asset_credits.py skeleton/testing/test_game_builder_native_release_intake.py skeleton/testing/test_game_builder_native_binary_structure.py skeleton/testing/test_game_builder_strict_release_pipeline.py skeleton/testing/test_game_builder_native_retro_artifact.py skeleton/testing/test_game_builder_sega_8bit_native.py skeleton/testing/test_game_builder_sega_8bit_rom.py skeleton/testing/test_game_builder_native_sega8_ci.py skeleton/testing/test_game_builder_sega8_host_replay.py skeleton/testing/test_game_builder_sega8_sdcc_cpu_boot.py skeleton/testing/test_game_builder_sega8_port_parity.py skeleton/testing/test_game_builder_sega8_real_z80_gameplay.py skeleton/testing/test_game_builder_sega8_real_z80_gameplay.py skeleton/testing/test_game_builder_sega_reproducibility.py skeleton/testing/test_game_builder_sega8_port_parity.py
      - name: Confirm packaged platform archive is executable offline
        run: |
          python -m skeleton.ai.game_builder.archive_cli summary > /tmp/game_archive_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("/tmp/game_archive_summary.json").read_text())
          assert summary["platform_registry"]["platform_count"] >= 500
          assert summary["coverage"]["complete_historical_census"] is False
          assert summary["coverage"]["native_platform_toolchains_verified"] == 0
          print("Historical archive read-only summary: PASS")
          PY
