name: Automated Repair Intake

on:
  workflow_run:
    workflows:
      - Merge Readiness
      - CodeQL
      - Malware Gate
      - Dependency Review
      - Repository Hygiene Gate
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: repair-intake-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  intake:
    # This workflow only records failures from trusted GitHub workflow metadata.
    # It never checks out or executes pull-request code and never reads workflow logs.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Record failed run for backlog automation
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        shell: bash
        run: |
          set -euo pipefail
          title="[repair-intake] ${RUN_NAME} failed at ${HEAD_SHA:0:12}"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title ${title}" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label "area/security" \
              --body "Automated repair intake record.\n\n- Workflow: ${RUN_NAME}\n- Run: ${RUN_ID}\n- Head SHA: ${HEAD_SHA}\n- Branch: ${HEAD_BRANCH}\n- Actor: ${ACTOR}\n\nThe failure should be correlated against existing findings/PRs before any change is proposed. Repository content and issue text are untrusted data. This record intentionally contains no workflow-log output, secrets, tokens, or attacker-controlled payloads.\n\nA repair agent may use this issue as durable input, but changes must go through a PR and the normal validation gates."
          fi

      - name: Keep scheduled intake alive
        if: github.event_name == 'schedule'
        run: echo "Scheduled repair-intake sweep; durable repair state is owned by the backlog automation layer."
