name: Observability Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "machine/observability_integrity_contract.json"
      - "scripts/verify_observability_integrity_contract.py"
      - "skeleton/observability/integrity.py"
      - "skeleton/ai/runtime/observability/integrity.py"
      - "skeleton/observability/resilient_telemetry.py"
      - "skeleton/testing/test_observability_integrity.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/observability-integrity.yml"
  push:
    branches: [main]
    paths:
      - "machine/observability_integrity_contract.json"
      - "scripts/verify_observability_integrity_contract.py"
      - "skeleton/observability/integrity.py"
      - "skeleton/ai/runtime/observability/integrity.py"
      - "skeleton/observability/resilient_telemetry.py"
      - "skeleton/testing/test_observability_integrity.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/observability-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observability-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused runtime dependencies
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3" "pydantic-settings>=2,<3"
      - name: Compile observability integrity surfaces
        run: >-
          python -m compileall -q
          skeleton/observability/integrity.py
          skeleton/ai/runtime/observability/integrity.py
          scripts/verify_observability_integrity_contract.py
          skeleton/testing/test_observability_integrity.py
      - name: Verify G023 contract
        run: python scripts/verify_observability_integrity_contract.py --json
      - name: Run observability integrity regressions
        run: python -m unittest -q skeleton.testing.test_observability_integrity
      - name: Verify governed AI file-tree parity
        run: python scripts/check_ai_file_tree.py
      - name: Verify hostile-gap disposition
        run: python scripts/verify_ai_hostile_gap_disposition.py
