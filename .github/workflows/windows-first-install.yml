name: Windows First Install

# Clean native Windows first install: bootstrap.ps1 sets up Python, the pinned
# Godot engine and per-user config, starts the local API, then builds and
# headlessly plays a sample game through the API (skeleton.ps1 smoke), then
# drives the Local Studio journey in Edge with Playwright and axe.
#
# Manual and callable only, like the other specialist Windows checks, so it does
# not add an independent PR admission to the paused Actions queue
# (scripts/check_ci_workflow_tiers.py). Dispatch it for a head, or call it from
# a gate workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA to qualify (defaults to the dispatched ref)"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-first-install-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  first-install:
    name: Clean install, start, build and play (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Enable Windows long paths for git
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/satellites/
            !/artifacts/
            !/reports/
            !/memory/
            !/complete/

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Prove the data root starts empty
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP 'SkeletonHome'
          "SKELETON_HOME=$dataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:SKELETON_HOME = $dataRoot
          if (Test-Path -LiteralPath $env:SKELETON_HOME) { throw "SKELETON_HOME already exists: $env:SKELETON_HOME" }
          if (Test-Path -LiteralPath .venv) { throw ".venv already exists in the checkout" }

      - name: Bootstrap (one command, non-interactive)
        shell: pwsh
        run: |
          ./scripts/windows/bootstrap.ps1 -NonInteractive -Provider none -DataRoot $env:SKELETON_HOME `
            -PythonPath "${{ steps.python.outputs.python-path }}" -Start
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 exited $LASTEXITCODE" }

      - name: Verify config and secret custody
        shell: pwsh
        run: |
          $config = Get-Content (Join-Path $env:SKELETON_HOME 'config\config.json') -Raw | ConvertFrom-Json
          if ($config.provider -ne 'none') { throw "unexpected provider $($config.provider)" }
          $secrets = Get-Content (Join-Path $env:SKELETON_HOME 'config\secrets.json') -Raw | ConvertFrom-Json
          $seal = [string]$secrets.values.GF_SEAL_SECRET
          if (-not $seal.StartsWith('dpapi:')) { throw 'seal secret is not DPAPI protected' }
          $acl = (Get-Acl (Join-Path $env:SKELETON_HOME 'config')).Access
          if ($acl | Where-Object { $_.IdentityReference -match 'Everyone|Users$' }) { throw 'config directory is readable by other users' }
          Write-Host "Config and DPAPI-protected secrets verified (values not printed)."

      - name: Launcher status and doctor
        shell: pwsh
        run: |
          ./scripts/windows/skeleton.ps1 status -DataRoot $env:SKELETON_HOME
          if ($LASTEXITCODE -ne 0) { throw "status exited $LASTEXITCODE" }
          ./scripts/windows/skeleton.ps1 doctor -Json -DataRoot $env:SKELETON_HOME
          if ($LASTEXITCODE -ne 0) { throw "doctor exited $LASTEXITCODE" }

      - name: Windows PowerShell 5.1 compatibility (doctor and status)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          & .\scripts\windows\skeleton.ps1 status -DataRoot $env:SKELETON_HOME
          if ($LASTEXITCODE -ne 0) { throw "5.1 status exited $LASTEXITCODE" }
          & .\scripts\windows\skeleton.ps1 doctor -DataRoot $env:SKELETON_HOME
          if ($LASTEXITCODE -ne 0) { throw "5.1 doctor exited $LASTEXITCODE" }

      - name: Smoke - build a sample game through the API and play it headlessly
        shell: pwsh
        run: |
          ./scripts/windows/skeleton.ps1 smoke -DataRoot $env:SKELETON_HOME
          if ($LASTEXITCODE -ne 0) { throw "smoke exited $LASTEXITCODE" }

      - name: Build from the user's own idea and re-check the newest game
        shell: pwsh
        run: |
          ./scripts/windows/skeleton.cmd build "A small top-down shooter. Fantasy: neon sewer drones. Core loop: move, aim and clear packs, then spend salvage. Scope: small prototype." -DataRoot $env:SKELETON_HOME
          if ($LASTEXITCODE -ne 0) { throw "build exited $LASTEXITCODE" }
          ./scripts/windows/skeleton.cmd play -Check -DataRoot $env:SKELETON_HOME
          if ($LASTEXITCODE -ne 0) { throw "play -Check exited $LASTEXITCODE" }

      - name: Unit tests for the first-install adapter
        shell: pwsh
        run: |
          $py = Join-Path $PWD '.venv\Scripts\python.exe'
          & $py -m pip install --disable-pip-version-check --constraint (Join-Path $env:SKELETON_HOME 'run\constraints.txt') "pytest>=8,<9"
          & $py -m pytest -q -p no:cacheprovider skeleton/testing/test_windows_first_install.py skeleton/testing/test_local_studio.py
          if ($LASTEXITCODE -ne 0) { throw "pytest exited $LASTEXITCODE" }

      - name: Pester tests for the PowerShell module (DPAPI, ACL, pins)
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable Pester | Where-Object Version -ge ([version]'5.5.0') | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.5.0
          $result = Invoke-Pester -Path scripts/windows/tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { throw "Pester failed: $($result.FailedCount) failed, $($result.PassedCount) passed" }

      - name: Set up Node for the Studio browser journey
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Studio end-to-end journey (Playwright + axe, Microsoft Edge)
        shell: pwsh
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_VERSION: "1.56.1"
          AXE_PLAYWRIGHT_VERSION: "4.11.0"
          SKELETON_E2E_CHANNEL: msedge
          CI: "true"
        run: |
          $urlFile = Join-Path $env:SKELETON_HOME 'run\studio.url'
          if (-not (Test-Path -LiteralPath $urlFile)) { throw 'Studio link was not published by the running API' }
          if ((Get-Content -LiteralPath $urlFile -Raw).Trim() -notmatch '^http://127\.0\.0\.1:\d+/studio/#token=[A-Za-z0-9_-]+$') { throw 'Studio link is malformed' }
          npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts "@playwright/test@$env:PLAYWRIGHT_VERSION" "@axe-core/playwright@$env:AXE_PLAYWRIGHT_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "npm install exited $LASTEXITCODE" }
          $env:SKELETON_STUDIO_URL_FILE = $urlFile
          npx --no-install playwright test --config playwright.local-studio.config.mjs
          if ($LASTEXITCODE -ne 0) { throw "Studio E2E exited $LASTEXITCODE" }

      - name: Stop the API
        if: always()
        shell: pwsh
        run: ./scripts/windows/skeleton.ps1 stop -DataRoot $env:SKELETON_HOME

      - name: Upload logs and generated games
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-first-install-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\SkeletonHome\logs
            ${{ runner.temp }}\SkeletonHome\games
            ${{ runner.temp }}\SkeletonHome\config\config.json
            tests/e2e/playwright-report-local-studio
            tests/e2e/test-results-local-studio
          if-no-files-found: warn
          retention-days: 7
