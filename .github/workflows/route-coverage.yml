name: Route Coverage CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/utils/routeRegistry.ts'
      - 'frontend/app/**'
      - 'scripts/route_coverage_check.py'
      - 'scripts/test_route_coverage_check.py'
      - 'backend/core/routes_registry.py'
      - 'backend/routes/**'
      - 'backend/scripts/backend_route_inventory.py'
      - 'backend/tests/test_backend_route_inventory.py'
      - '.github/workflows/route-coverage.yml'
  pull_request:
    paths:
      - 'frontend/utils/routeRegistry.ts'
      - 'frontend/app/**'
      - 'scripts/route_coverage_check.py'
      - 'scripts/test_route_coverage_check.py'
      - 'backend/core/routes_registry.py'
      - 'backend/routes/**'
      - 'backend/scripts/backend_route_inventory.py'
      - 'backend/tests/test_backend_route_inventory.py'
      - '.github/workflows/route-coverage.yml'

permissions:
  contents: read

concurrency:
  group: route-coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  route-coverage:
    name: Validate registries and static backend inventory
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run frontend route coverage regression tests
        run: python3 -m unittest -v scripts/test_route_coverage_check.py

      - name: Run frontend route coverage check (static)
        run: python3 scripts/route_coverage_check.py

      - name: Run backend route inventory (static, report-only)
        run: python3 backend/scripts/backend_route_inventory.py

      - name: Emit route evidence artifacts
        if: always()
        run: |
          python3 scripts/route_coverage_check.py --json > route-coverage.json || true
          python3 backend/scripts/backend_route_inventory.py --json > backend-route-inventory.json || true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: route-coverage-report
          path: |
            route-coverage.json
            backend-route-inventory.json
          retention-days: 30
