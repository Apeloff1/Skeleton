name: Non Idempotent Compensation

on:
  pull_request:
    branches:
      - main
    paths:
      - "machine/non_idempotent_compensation_contract.json"
      - "scripts/verify_non_idempotent_compensation_contract.py"
      - "skeleton/skills/tool_saga.py"
      - "skeleton/ai/runtime/skills/tool_saga.py"
      - "skeleton/skills/tool_contract.py"
      - "skeleton/storage/cas.py"
      - "skeleton/testing/test_tool_saga.py"
      - "skeleton/testing/test_distributed_transactions.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/non-idempotent-compensation.yml"
  push:
    branches:
      - main
    paths:
      - "machine/non_idempotent_compensation_contract.json"
      - "scripts/verify_non_idempotent_compensation_contract.py"
      - "skeleton/skills/tool_saga.py"
      - "skeleton/ai/runtime/skills/tool_saga.py"
      - "skeleton/skills/tool_contract.py"
      - "skeleton/storage/cas.py"
      - "skeleton/testing/test_tool_saga.py"
      - "skeleton/testing/test_distributed_transactions.py"
      - "machine/ai_hostile_gap_disposition.json"
      - ".github/workflows/non-idempotent-compensation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: non-idempotent-compensation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  non-idempotent-compensation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Compile compensation authority
        run: >-
          python -m compileall -q
          skeleton/skills/tool_saga.py
          skeleton/ai/runtime/skills/tool_saga.py
          scripts/verify_non_idempotent_compensation_contract.py
      - name: Verify canonical G015 compensation contract
        run: python scripts/verify_non_idempotent_compensation_contract.py --json
      - name: Run durable saga regressions
        run: >-
          python -m unittest -q
          skeleton.testing.test_tool_saga
          skeleton.testing.test_distributed_transactions
      - name: Verify governed AI file-tree parity
        run: python scripts/check_ai_file_tree.py
      - name: Verify hostile-gap disposition
        run: python scripts/verify_ai_hostile_gap_disposition.py
