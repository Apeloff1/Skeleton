name: P1 Answer Artifact Quality Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/intelligence/output_quality.py"
      - "skeleton/ai/runtime/intelligence/output_quality.py"
      - "skeleton/intelligence/__init__.py"
      - "skeleton/ai/runtime/intelligence/__init__.py"
      - "skeleton/intelligence/quality.py"
      - "skeleton/intelligence/strategy_registry.py"
      - "skeleton/contracts/verification.py"
      - "skeleton/testing/test_answer_artifact_quality.py"
      - ".github/workflows/p1-answer-artifact-quality.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/intelligence/output_quality.py"
      - "skeleton/ai/runtime/intelligence/output_quality.py"
      - "skeleton/intelligence/__init__.py"
      - "skeleton/ai/runtime/intelligence/__init__.py"
      - "skeleton/intelligence/quality.py"
      - "skeleton/intelligence/strategy_registry.py"
      - "skeleton/contracts/verification.py"
      - "skeleton/testing/test_answer_artifact_quality.py"
      - ".github/workflows/p1-answer-artifact-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-answer-artifact-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate answer artifact quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Run answer/artifact quality regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_answer_artifact_quality.py
          skeleton/testing/test_verification_contract.py

      - name: Build accepted INTEL-04 decision
        run: |
          set -euo pipefail
          mkdir -p .p1-intel-04
          python - <<'PY'
          import json
          from pathlib import Path

          from skeleton.contracts.canonical import EvidenceRef
          from skeleton.intelligence.output_quality import (
              IndependentQualityEvaluation,
              OutputKind,
              ReasoningRegressionObservation,
              evaluate_answer_artifact_quality,
          )
          from skeleton.intelligence.quality import QualityReport

          def ref(source, char):
              return EvidenceRef(
                  source=source,
                  digest=char * 64,
                  category="quality_eval",
              )

          answer = IndependentQualityEvaluation(
              kind=OutputKind.ANSWER,
              subject_id="ci-answer",
              subject_digest="a" * 64,
              evaluator_id="ci:answer-quality",
              evaluator_digest="b" * 64,
              report=QualityReport(
                  accepted=True,
                  reason="independent answer quality",
                  score=0.95,
                  thresholds={"minimum": 0.80},
                  metadata={"dataset": "ci-gold"},
              ),
              evidence_refs=(ref("ci://answer-quality", "c"),),
          )
          artifact = IndependentQualityEvaluation(
              kind=OutputKind.ARTIFACT,
              subject_id="ci-artifact",
              subject_digest="d" * 64,
              evaluator_id="ci:artifact-quality",
              evaluator_digest="e" * 64,
              report=QualityReport(
                  accepted=True,
                  reason="independent artifact quality",
                  score=0.94,
                  thresholds={"minimum": 0.80},
                  metadata={"rubric": "artifact-v1"},
              ),
              evidence_refs=(ref("ci://artifact-quality", "f"),),
          )
          regression = ReasoningRegressionObservation(
              suite_id="ci-reasoning-regression",
              baseline_digest="1" * 64,
              candidate_digest="2" * 64,
              baseline_score=0.92,
              candidate_score=0.92,
              max_allowed_drop=0.01,
              evaluator_id="ci:reasoning-regression",
              evaluator_digest="3" * 64,
              evidence_refs=(ref("ci://reasoning-regression", "4"),),
          )
          decision = evaluate_answer_artifact_quality(
              answer=answer,
              artifacts=(artifact,),
              expected_artifact_digests=(artifact.subject_digest,),
              reasoning_regressions=(regression,),
          )
          if not decision.accepted:
              raise SystemExit(f"INTEL-04 fixture rejected: {decision.reasons}")
          evidence = decision.accepted_evidence_ref()
          Path(".p1-intel-04/decision.json").write_text(
              json.dumps(decision.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-intel-04/refs.json").write_text(
              json.dumps(
                  [{
                      "source": evidence.source,
                      "digest": evidence.digest,
                      "category": evidence.category,
                  }],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head INTEL-04 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-intel-04/config.digest").write_text(
              hashlib.sha256(b"p1-intel-04-policy-v1").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-intel-04/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|intel-04"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-intel-04/verifier.digest").write_text(
              digest([
                  "skeleton/intelligence/output_quality.py",
                  ".github/workflows/p1-answer-artifact-quality.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-intel-04/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_answer_artifact_quality.py",
                  "skeleton/testing/test_verification_contract.py",
              ]),
              encoding="utf-8",
          )
          PY
          python scripts/emit_p1_promotion_evidence.py             --repository Apeloff1/Skeleton             --commit-sha "$EXPECTED_SHA"             --expected-head "$EXPECTED_SHA"             --task-id P1-INTEL-04             --accountability-id ACC-P1-INTEL-04             --configuration-digest "$(cat .p1-intel-04/config.digest)"             --environment-digest "$(cat .p1-intel-04/environment.digest)"             --verifier-id github-actions:p1-answer-artifact-quality             --verifier-digest "$(cat .p1-intel-04/verifier.digest)"             --test-manifest-digest "$(cat .p1-intel-04/tests.digest)"             --run-id "$RUN_IDENTITY"             --run-attempt "$RUN_ATTEMPT"             --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --evidence-file .p1-intel-04/refs.json             --out .p1-intel-04/receipt.json             > .p1-intel-04/stdout.json

      - name: Assert exact-head receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-intel-04/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("INTEL-04 receipt head mismatch")
          if receipt["task_id"] != "P1-INTEL-04":
              raise SystemExit("INTEL-04 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-INTEL-04":
              raise SystemExit("INTEL-04 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("INTEL-04 exact-head receipt OK", receipt["receipt_digest"])
          PY
