name: P3 Learning Multimodal Acceptance
on:
  pull_request:
    paths:
      - "machine/ai_p3_learning_execution_map.json"
      - "machine/ai_p3_learning_task_backlog.json"
      - "skeleton/ai/runtime/learning_foundation/**"
      - "skeleton/testing/test_p3_data_foundation.py"
      - "skeleton/testing/test_p3_training_control.py"
      - "skeleton/testing/test_p3_learning_programs.py"
      - "skeleton/testing/test_p3_multimodal_foundation.py"
      - "skeleton/testing/test_p3_learning_foundation_acceptance.py"
      - "skeleton/testing/test_p3_model_lifecycle.py"
      - "scripts/check_p3_learning_execution_map.py"
      - ".github/workflows/p3-learning-multimodal-acceptance.yml"
  push:
    branches: [main, feat/p3-learning-multimodal-t2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p3-learning-multimodal-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"
      - name: Validate T2 authority
        run: python scripts/check_p3_learning_execution_map.py --json
      - name: Execute full T2 learning chain
        run: >-
          python -m pytest -q
          tests/test_p3_learning_execution_map.py
          skeleton/testing/test_p3_data_foundation.py
          skeleton/testing/test_p3_training_control.py
          skeleton/testing/test_p3_learning_programs.py
          skeleton/testing/test_p3_multimodal_foundation.py
          skeleton/testing/test_p3_learning_foundation_acceptance.py
          skeleton/testing/test_p3_model_lifecycle.py
