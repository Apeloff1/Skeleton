name: P3 Native Training Control

on:
  pull_request:
    paths:
      - "skeleton/learning/native_training.py"
      - "skeleton/learning/model_program.py"
      - "skeleton/data/native_pipeline.py"
      - "skeleton/testing/test_p3_native_training.py"
      - ".github/workflows/p3-native-training.yml"
  push:
    branches:
      - feat/p3-native-learning-research-frontier
    paths:
      - "skeleton/learning/native_training.py"
      - "skeleton/learning/model_program.py"
      - "skeleton/data/native_pipeline.py"
      - "skeleton/testing/test_p3_native_training.py"
      - ".github/workflows/p3-native-training.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-native-training-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
      - name: Run native training acceptance
        run: >-
          python -m pytest -q
          skeleton/testing/test_p3_data_foundation.py
          skeleton/testing/test_p3_native_training.py
