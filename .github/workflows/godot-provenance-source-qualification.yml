name: Godot Provenance Source Qualification

on:
  pull_request:
    paths:
      - skeleton/godot_export/provenance.py
      - skeleton/forge/export.py
      - skeleton/testing/test_godot_provenance_ancestor_custody_20261110.py
      - skeleton/testing/test_forge_native_output_custody_20261110.py
      - .github/workflows/godot-provenance-source-qualification.yml
  push:
    branches: [main]
    paths:
      - skeleton/godot_export/provenance.py
      - skeleton/forge/export.py
      - skeleton/testing/test_godot_provenance_ancestor_custody_20261110.py
      - skeleton/testing/test_forge_native_output_custody_20261110.py
      - .github/workflows/godot-provenance-source-qualification.yml

permissions:
  contents: read

concurrency:
  group: godot-provenance-source-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-source:
    name: Godot Source and Export Path Custody
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install minimal pinned source-test dependencies
        # skeleton/testing/conftest.py imports signed-offline fixtures when
        # collecting targeted Godot modules. Keep the real Ed25519 fixture
        # available; never bypass it by disabling the test plugin registry.
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          pytest==8.4.2 cryptography==50.0.2
      - name: Compile Godot and Forge source custody modules
        run: >-
          python -m compileall -q skeleton/godot_export/provenance.py
          skeleton/forge/export.py
          skeleton/testing/test_godot_provenance_ancestor_custody_20261110.py
          skeleton/testing/test_forge_native_output_custody_20261110.py
      - name: Offline source regressions and existing custody suites
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q \
            skeleton/testing/test_godot_provenance_ancestor_custody_20261110.py \
            skeleton/testing/test_forge_native_output_custody_20261110.py \
            skeleton/testing/test_godot_export_provenance.py \
            skeleton/testing/test_godot_export_provenance_negative.py \
            skeleton/testing/test_forge_export_quarantine.py
