name: Godot Provenance Source Qualification

# The exact source test suite is required inside the Merge Readiness
# quality_security lane; independent PR/push subscriptions would exceed the
# bounded 20-workflow admission policy. Retain separately dispatchable
# source qualification for independent operator evidence.
on:
  # Caller supplies one immutable source commit for unprivileged,
  # read-only evidence. Dispatch and checkout are independent authorities.
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-hex reviewed source commit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: godot-provenance-source-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  offline-source:
    name: Godot Source and Export Path Custody
    if: github.repository == 'Apeloff1/Skeleton' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Admit only the trusted dispatch commit
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid immutable source SHA'; exit 2; }
      - name: Checkout trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Verify exact trusted source checkout
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install minimal pinned source-test dependencies
        # skeleton/testing/conftest.py imports signed-offline fixtures when
        # collecting targeted Godot modules. Keep the real Ed25519 fixture
        # available; never bypass it by disabling the test plugin registry.
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          pytest==8.4.2 cryptography==50.0.2
      - name: Compile Godot and Forge source custody modules
        run: >-
          python -m compileall -q skeleton/godot_export/provenance.py
          skeleton/godot_export/cli.py skeleton/forge/export.py
          skeleton/testing/test_godot_provenance_ancestor_custody_20261110.py
          skeleton/testing/test_forge_native_output_custody_20261110.py
      - name: Offline source regressions and existing custody suites
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q \
            skeleton/testing/test_godot_provenance_ancestor_custody_20261110.py \
            skeleton/testing/test_forge_native_output_custody_20261110.py \
            skeleton/testing/test_godot_export_provenance.py \
            skeleton/testing/test_godot_export_provenance_negative.py \
            skeleton/testing/test_forge_export_quarantine.py
