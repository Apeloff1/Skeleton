name: GF-M descriptor custody and qualification regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/qualification/**"
      - "tests/qualification/**"
      - ".github/workflows/gfm-descriptor-qualification.yml"

permissions:
  contents: read

concurrency:
  group: gfm-descriptor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source_qualification:
    name: Bounded evidence and case custody; nonrelease native-hardware denial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact untrusted PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate source identity
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Compile all quarantine recovery qualification source and tests
        run: python -m compileall -q skeleton/qualification tests/qualification
      - name: Execute every focused qualification test and negative custody check
        run: python -m pytest -q tests/qualification
      - name: Deny fabricated release from absent evidence
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          python -m skeleton.qualification --head "$EXPECTED" --evidence "$RUNNER_TEMP/nonexistent-source-evidence" --out "$RUNNER_TEMP/qualified.json"
          code=$?
          set -e
          test "$code" = 2
          python -c 'import json,os; p=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"qualified.json"))); assert p["overall"] == "blocked" and p["counts"]["pass"] == 0'
