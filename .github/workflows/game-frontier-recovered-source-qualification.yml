name: Game Frontier recovered-source qualification

on:
  pull_request:
    paths:
      - 'skeleton/jeeves/game_frontier*.py'
      - 'skeleton/ai/agents/jeeves/game_frontier*.py'
      - 'skeleton/forge/game_frontier*.py'
      - 'skeleton/ai/forge/game_frontier*.py'
      - 'tests/test_game_frontier*.py'
      - 'scripts/*game_frontier*.py'
      - '.github/workflows/game-frontier-recovered-source-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-recovered-source-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontier-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.16'
      - name: Verify Jeeves mirror parity
        run: |
          python - <<'PY'
          from pathlib import Path
          canonical = Path('skeleton/jeeves')
          mirror = Path('skeleton/ai/agents/jeeves')
          files = sorted(canonical.glob('game_frontier*.py'))
          assert len(files) >= 59, len(files)
          for f in files:
              twin = mirror / f.name
              assert twin.is_file() and f.read_bytes() == twin.read_bytes(), f.name
          print(f'Checked {len(files)} exact mirror pairs')
          PY
      - name: Compile archived current-runtime surfaces
        run: |
          python -m compileall -q skeleton/jeeves skeleton/ai/agents/jeeves skeleton/forge skeleton/ai/forge scripts tests
      - name: Install hermetic focused-test runner
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -r backend/requirements.txt 'pytest>=8,<9' 'pytest-asyncio>=0.24,<2'
      - name: Run focused original frontier regressions
        env:
          PYTHONPATH: '.:backend'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest -q --import-mode=importlib -p pytest_asyncio.plugin
          tests/test_game_frontier_milestones_p0_p3.py
          tests/test_game_frontier_advanced_physics.py
          tests/test_game_frontier_virtual_navigation.py
          tests/test_game_frontier_studio_quests.py
          tests/test_game_frontier_receipt_journal.py
          tests/test_game_frontier_native_session_vault.py
