# ============================================================================
# Godot playtest + export — the dynamic half of "verified, playable".
#
# Installs the pinned headless Godot 4.3 (checksums from
# backend/godot.artifact.json, verified by scripts/install_godot.py), then:
#   playtest: runs the boot / playtest gate tests with SKELETON_REQUIRE_GODOT=1
#             so they enforce instead of skipping;
#   export:   installs the pinned export templates, forges an era, exports real
#             Linux + Web builds, boots the exported Linux binary headless, and
#             uploads the builds as a workflow artifact.
# ============================================================================
name: Godot Playtest
on:
  push:
    branches: [main]
    paths:
      - 'skeleton/forge/**'
      - 'skeleton/ai/forge/**'
      - 'skeleton/context/**'
      - 'skeleton/api/routes.py'
      - 'skeleton/testing/test_forge_playtest.py'
      - 'skeleton/testing/test_gameforge_http_e2e.py'
      - 'skeleton/testing/test_forge_export.py'
      - 'skeleton/testing/test_install_godot.py'
      - 'backend/godot.artifact.json'
      - 'scripts/install_godot.py'
      - '.github/workflows/godot-playtest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skeleton/forge/**'
      - 'skeleton/ai/forge/**'
      - 'skeleton/context/**'
      - 'skeleton/api/routes.py'
      - 'backend/godot.artifact.json'
      - 'scripts/install_godot.py'
      - '.github/workflows/godot-playtest.yml'
  workflow_dispatch:
    inputs:
      era:
        description: "Era to forge and export"
        required: false
        default: "soulslike"

concurrency:
  group: godot-playtest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11.16"
  PYTHONPATH: "${{ github.workspace }}"
permissions:
  contents: read

jobs:
  playtest:
    name: "Godot boot + playtest gate"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Install Skeleton runtime slice
        run: python -m pip install "pytest>=8,<9" "fastapi>=0.110,<1" "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3" "httpx>=0.27,<1"
      - name: Install pinned Godot 4.3 (checksum verified)
        run: python scripts/install_godot.py --dest "$RUNNER_TEMP/godot"
      - name: Playtest gate (enforced)
        env:
          SKELETON_REQUIRE_GODOT: "1"
        run: |
          set -euo pipefail
          "$SKELETON_GODOT_BIN" --headless --version
          python -m pytest -q -rs \
            skeleton/testing/test_install_godot.py \
            skeleton/testing/test_forge_playtest.py \
            skeleton/testing/test_gameforge_http_e2e.py \
            skeleton/testing/test_forge_export.py

  export:
    name: "Godot export (Linux + Web)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Install pinned Godot 4.3 + export templates (checksum verified)
        run: python scripts/install_godot.py --dest "$RUNNER_TEMP/godot" --templates
      - name: Forge, export and boot
        env:
          ERA: ${{ github.event.inputs.era || 'soulslike' }}
        run: |
          set -euo pipefail
          case "$ERA" in *[!a-z_]*|"") echo "invalid era"; exit 2;; esac
          python -m skeleton.forge.export --era "$ERA" --out dist/godot \
            --preset Linux --preset Web --report dist/godot/report.json
          rm -rf dist/godot/project/.godot
      - name: Upload exported builds
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-export-${{ github.sha }}
          path: dist/godot
          if-no-files-found: error
          retention-days: 14
