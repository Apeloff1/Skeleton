name: P1 Required Gate Authority Gate

on:
  push:
    branches:
      - main
    paths:
      - "machine/p1_required_gate_authority.json"
      - "skeleton/contracts/promotion_gates.py"
      - "skeleton/ai/runtime/contracts/promotion_gates.py"
      - "skeleton/contracts/__init__.py"
      - "skeleton/ai/runtime/contracts/__init__.py"
      - "scripts/check_p1_required_gate_authority.py"
      - "skeleton/testing/test_promotion_gates.py"
      - "tests/test_p1_required_gate_authority.py"
      - ".github/workflows/p1-required-gate-authority.yml"
      - ".github/workflows/*.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/p1_required_gate_authority.json"
      - "skeleton/contracts/promotion_gates.py"
      - "skeleton/ai/runtime/contracts/promotion_gates.py"
      - "skeleton/contracts/__init__.py"
      - "skeleton/ai/runtime/contracts/__init__.py"
      - "scripts/check_p1_required_gate_authority.py"
      - "skeleton/testing/test_promotion_gates.py"
      - "tests/test_p1_required_gate_authority.py"
      - ".github/workflows/p1-required-gate-authority.yml"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-required-gate-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate terminal P1 gate authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused authority runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Validate repository-owned gate authority
        run: >-
          python scripts/check_p1_required_gate_authority.py
          --print-summary

      - name: Run fail-closed authority regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_promotion_gates.py
          tests/test_p1_required_gate_authority.py

      - name: Build exact-head passing observation fixture
        run: |
          set -euo pipefail
          mkdir -p .p1-gate-authority
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          authority = json.loads(
              Path("machine/p1_required_gate_authority.json").read_text(
                  encoding="utf-8"
              )
          )
          head = os.environ["EXPECTED_SHA"]
          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          rows = []
          for index, gate in enumerate(authority["gates"], start=1):
              if gate.get("required_for_terminal_p1_promotion") is not True:
                  continue
              rows.append(
                  {
                      "workflow_name": gate["workflow_name"],
                      "head_sha": head,
                      "run_id": f"synthetic-{index}",
                      "run_attempt": 1,
                      "event": "pull_request",
                      "status": "completed",
                      "conclusion": "success",
                      "completed_at": now,
                  }
              )
          Path(".p1-gate-authority/passing.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-gate-authority/missing.json").write_text(
              json.dumps(rows[:-1], indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head gate-authority decision
        run: >-
          python scripts/check_p1_required_gate_authority.py
          --observations .p1-gate-authority/passing.json
          --target-sha "$EXPECTED_SHA"
          --out .p1-gate-authority/decision.json
          --print-summary

      - name: Prove missing required gate rejects
        run: |
          set -euo pipefail
          if python scripts/check_p1_required_gate_authority.py             --observations .p1-gate-authority/missing.json             --target-sha "$EXPECTED_SHA"; then
            echo "missing required gate unexpectedly passed" >&2
            exit 1
          fi

      - name: Assert exact-head decision receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(".p1-gate-authority/decision.json").read_text(
                  encoding="utf-8"
              )
          )
          authority = payload["authority"]
          decision = payload["decision"]
          if decision["accepted"] is not True:
              raise SystemExit("gate authority decision is not accepted")
          if decision["target_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("gate authority receipt head mismatch")
          if decision["required_gate_count"] != 22:
              raise SystemExit("required gate count drift")
          if decision["passing_gate_count"] != 22:
              raise SystemExit("passing gate count drift")
          if decision["authority_digest"] != authority["authority_digest"]:
              raise SystemExit("authority digest mismatch")
          for field in ("authority_digest", "observations_digest"):
              if len(decision.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print(
              "P1 required-gate authority receipt:",
              decision["target_sha"],
              decision["authority_digest"],
              decision["observations_digest"],
          )
          PY
