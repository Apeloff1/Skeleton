name: Jeeves Predictive Evidence

on:
  push:
    branches: [main, master]
    paths:
      - "skeleton/jeeves/historical_*.py"
      - "skeleton/jeeves/predictive*.py"
      - "skeleton/learning/evidence.py"
      - "skeleton/testing/test_jeeves_historical_*.py"
      - "skeleton/testing/test_jeeves_predictive_*.py"
      - "skeleton/testing/test_learning_evidence.py"
      - ".github/workflows/jeeves-predictive-evidence.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/jeeves/historical_*.py"
      - "skeleton/jeeves/predictive*.py"
      - "skeleton/learning/evidence.py"
      - "skeleton/testing/test_jeeves_historical_*.py"
      - "skeleton/testing/test_jeeves_predictive_*.py"
      - "skeleton/testing/test_learning_evidence.py"
      - ".github/workflows/jeeves-predictive-evidence.yml"

permissions:
  contents: read

concurrency:
  group: jeeves-predictive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  predictive-evidence:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "fastapi>=0.110,<1"
          "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"

      - name: Compile predictive surface
        run: |
          set -euo pipefail
          python -m compileall -q \
            skeleton/jeeves/historical_forecasting.py \
            skeleton/jeeves/historical_autoregression.py \
            skeleton/jeeves/historical_seasonal.py \
            skeleton/jeeves/historical_conformal.py \
            skeleton/jeeves/historical_ensemble.py \
            skeleton/jeeves/historical_regimes.py \
            skeleton/jeeves/predictive.py \
            skeleton/jeeves/predictive_engine.py \
            skeleton/jeeves/predictive_bidirectional.py \
            skeleton/jeeves/predictive_regime_routing.py \
            skeleton/jeeves/predictive_seasonal.py \
            skeleton/jeeves/predictive_evidence.py \
            skeleton/learning/evidence.py

      - name: Run historical and predictive regressions
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_jeeves_historical_forecasting.py
          skeleton/testing/test_jeeves_historical_forecasting_leakage.py
          skeleton/testing/test_jeeves_historical_autoregression.py
          skeleton/testing/test_jeeves_historical_autoregression_leakage.py
          skeleton/testing/test_jeeves_historical_seasonal.py
          skeleton/testing/test_jeeves_historical_conformal.py
          skeleton/testing/test_jeeves_historical_ensemble.py
          skeleton/testing/test_jeeves_historical_ensemble_leakage.py
          skeleton/testing/test_jeeves_historical_regimes.py
          skeleton/testing/test_jeeves_predictive_engine.py
          skeleton/testing/test_jeeves_predictive_bidirectional.py
          skeleton/testing/test_jeeves_predictive_bidirectional_evidence.py
          skeleton/testing/test_jeeves_predictive_regime_routing.py
          skeleton/testing/test_jeeves_predictive_seasonal.py
          skeleton/testing/test_jeeves_predictive_evidence.py
          skeleton/testing/test_jeeves_predictive_evidence_identity.py
          skeleton/testing/test_learning_evidence.py