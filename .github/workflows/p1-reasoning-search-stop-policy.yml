name: P1 Reasoning Search Stop Policy Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/intelligence/strategy_registry.py"
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/ai/runtime/intelligence/strategy_registry.py"
      - "skeleton/intelligence/__init__.py"
      - "skeleton/ai/runtime/intelligence/__init__.py"
      - "skeleton/intelligence/uncertainty.py"
      - "skeleton/ai/runtime/intelligence/uncertainty.py"
      - "skeleton/intelligence/cognition.py"
      - "skeleton/testing/test_reasoning_strategy_registry.py"
      - "skeleton/testing/test_vol013_cognitive_budget_control.py"
      - ".github/workflows/p1-reasoning-search-stop-policy.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/intelligence/strategy_registry.py"
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/ai/runtime/intelligence/strategy_registry.py"
      - "skeleton/intelligence/__init__.py"
      - "skeleton/ai/runtime/intelligence/__init__.py"
      - "skeleton/intelligence/uncertainty.py"
      - "skeleton/ai/runtime/intelligence/uncertainty.py"
      - "skeleton/intelligence/cognition.py"
      - "skeleton/testing/test_reasoning_strategy_registry.py"
      - "skeleton/testing/test_vol013_cognitive_budget_control.py"
      - ".github/workflows/p1-reasoning-search-stop-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-reasoning-stop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate reasoning strategy and stopping policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Run reasoning policy regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_reasoning_strategy_registry.py
          skeleton/testing/test_vol013_cognitive_budget_control.py
          skeleton/testing/test_cognition_control.py
          skeleton/testing/test_jeeves_rational_metareasoning.py

      - name: Build terminal INTEL-03 decision
        run: |
          set -euo pipefail
          mkdir -p .p1-intel-03
          python - <<'PY'
          import json
          from pathlib import Path

          from skeleton.intelligence.strategy_registry import (
              ReasoningPolicy,
              ReasoningRisk,
              ReasoningStep,
              ReasoningStrategy,
              evaluate_stopping,
          )

          policy = ReasoningPolicy(
              policy_id="p1-ci-reasoning",
              version=1,
              allowed_strategies=(
                  ReasoningStrategy.DIRECT,
                  ReasoningStrategy.RETRIEVE,
                  ReasoningStrategy.DECOMPOSE,
                  ReasoningStrategy.SEARCH,
                  ReasoningStrategy.VERIFY,
              ),
              default_strategy=ReasoningStrategy.DIRECT,
              max_steps=6,
              max_tokens=6000,
              max_cost_units=12.0,
              max_wall_time_s=120.0,
              min_value_of_information=0.10,
              completion_confidence=0.85,
              max_uncertainty=0.55,
              max_stall_steps=3,
              require_verification_for_high_risk=True,
          )
          step = ReasoningStep(
              step_index=1,
              cumulative_tokens=600,
              cumulative_cost_units=1.0,
              elapsed_s=8.0,
              confidence=0.93,
              uncertainty=0.12,
              value_of_information=0.25,
              progress_digest="a" * 64,
              verification_passed=True,
          )
          decision = evaluate_stopping(
              policy,
              (step,),
              risk=ReasoningRisk.HIGH,
          )
          if decision.disposition.value != "complete":
              raise SystemExit(
                  f"INTEL-03 fixture did not complete: {decision.payload()}"
              )
          evidence = decision.evidence_ref()
          Path(".p1-intel-03/decision.json").write_text(
              json.dumps(
                  {
                      **decision.payload(),
                      "decision_digest": decision.decision_digest,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          Path(".p1-intel-03/refs.json").write_text(
              json.dumps(
                  [
                      {
                          "source": evidence.source,
                          "digest": evidence.digest,
                          "category": evidence.category,
                      }
                  ],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head INTEL-03 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-intel-03/config.digest").write_text(
              hashlib.sha256(b"p1-intel-03-policy-v1").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-intel-03/environment.digest").write_text(
              hashlib.sha256(b"ubuntu-24.04|python-3.11.16|intel-03").hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-intel-03/verifier.digest").write_text(
              digest(
                  [
                      "skeleton/intelligence/strategy_registry.py",
                      "skeleton/intelligence/uncertainty.py",
                      "skeleton/ai/runtime/intelligence/uncertainty.py",
                      ".github/workflows/p1-reasoning-search-stop-policy.yml",
                  ]
              ),
              encoding="utf-8",
          )
          Path(".p1-intel-03/tests.digest").write_text(
              digest(
                  [
                      "skeleton/testing/test_reasoning_strategy_registry.py",
                      "skeleton/testing/test_vol013_cognitive_budget_control.py",
                      "skeleton/testing/test_cognition_control.py",
                      "skeleton/testing/test_jeeves_rational_metareasoning.py",
                  ]
              ),
              encoding="utf-8",
          )
          PY
          python scripts/emit_p1_promotion_evidence.py             --repository Apeloff1/Skeleton             --commit-sha "$EXPECTED_SHA"             --expected-head "$EXPECTED_SHA"             --task-id P1-INTEL-03             --accountability-id ACC-P1-INTEL-03             --configuration-digest "$(cat .p1-intel-03/config.digest)"             --environment-digest "$(cat .p1-intel-03/environment.digest)"             --verifier-id github-actions:p1-reasoning-search-stop-policy             --verifier-digest "$(cat .p1-intel-03/verifier.digest)"             --test-manifest-digest "$(cat .p1-intel-03/tests.digest)"             --run-id "$RUN_IDENTITY"             --run-attempt "$RUN_ATTEMPT"             --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --evidence-file .p1-intel-03/refs.json             --out .p1-intel-03/receipt.json             > .p1-intel-03/stdout.json

      - name: Assert exact-head receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-intel-03/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("INTEL-03 receipt head mismatch")
          if receipt["task_id"] != "P1-INTEL-03":
              raise SystemExit("INTEL-03 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-INTEL-03":
              raise SystemExit("INTEL-03 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("INTEL-03 exact-head receipt OK", receipt["receipt_digest"])
          PY
