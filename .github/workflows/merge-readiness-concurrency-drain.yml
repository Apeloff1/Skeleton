name: Merge Readiness Legacy Concurrency Drain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-readiness-concurrency-drain.yml'

permissions: {}

jobs:
  tombstone:
    name: Retire legacy Merge Readiness ${{ matrix.sha }}
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        sha:
          - 364b2d60f9639d310ededeabf4d7ac89aa6cb841
          - 871ee27ef1f31d5b6b1fa813505d78f79b93121f
          - 8e63a5675f1a8c086f4249886d76372706f2955c
          - 1109e37e96455412e888feb4ccbfa9faf79e9bb4
          - 3bf0545ad4753b0545c290acc66d987427899765
          - 65393b38c8a9081b573a61efbadb67b9e8f637f1
          - 080c7d22121433f4536b4e77fc74eb979b6853ae
          - 42cd700a93f5f99b9934f82638e8ff1d622bfbce
          - df5a010e930d0a8156d3dbe3ddc6e7591656862d
          - a8f2c026ddc18cfab63588bd63b14204372b2fef
          - 5f6454b199f8f643fe432b0321a07ebb97f52b04
          - 6ade49789bcfaf87c903cda21c996aa018ca9e45
          - 7ac507d90a146f09ee26b011269e3b0c183c70b3
    concurrency:
      # Intentionally matches the pre-#1203 SHA-scoped Merge Readiness group.
      # The current ref-scoped group is not present in this matrix.
      group: merge-readiness-${{ matrix.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Confirm bounded tombstone identity
        env:
          LEGACY_SHA: ${{ matrix.sha }}
          CURRENT_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LEGACY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CURRENT_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LEGACY_SHA" != "$CURRENT_MAIN_SHA" ]]
          printf 'retired legacy Merge Readiness concurrency group for %s\n' "$LEGACY_SHA"
