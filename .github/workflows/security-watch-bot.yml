name: Security Watch Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */2 * * *'

concurrency:
  group: security-watch-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  watch:
    if: github.repository == 'Apeloff1/Skeleton'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.1.0
        with:
          python-version: '3.11'

      - name: Install security-watch runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'pydantic>=2,<3' \
            'pydantic-settings>=2,<3'

      - name: Inspect dependency security queue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m skeleton.automation.security_watch
