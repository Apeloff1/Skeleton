name: P1 Benchmark Registry Gate

on:
  push:
    branches:
      - main
    paths:
      - "skeleton/eval/benchmark_registry.py"
      - "skeleton/ai/evaluation/benchmark_registry.py"
      - "skeleton/eval/experiment_registry.py"
      - "skeleton/contracts/reproducibility.py"
      - "skeleton/eval/__init__.py"
      - "skeleton/ai/evaluation/__init__.py"
      - "skeleton/testing/test_benchmark_registry.py"
      - "machine/p1_benchmark_registry.json"
      - "scripts/check_p1_benchmark_registry.py"
      - "tests/test_p1_benchmark_registry.py"
      - ".github/workflows/p1-benchmark-registry.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/eval/benchmark_registry.py"
      - "skeleton/ai/evaluation/benchmark_registry.py"
      - "skeleton/eval/experiment_registry.py"
      - "skeleton/contracts/reproducibility.py"
      - "skeleton/eval/__init__.py"
      - "skeleton/ai/evaluation/__init__.py"
      - "skeleton/testing/test_benchmark_registry.py"
      - "machine/p1_benchmark_registry.json"
      - "scripts/check_p1_benchmark_registry.py"
      - "tests/test_p1_benchmark_registry.py"
      - ".github/workflows/p1-benchmark-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-benchmark-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate benchmark lineage and contamination
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile LEARN-02 contracts
        run: >-
          python -m compileall -q
          skeleton/eval/benchmark_registry.py
          skeleton/ai/evaluation/benchmark_registry.py
          scripts/check_p1_benchmark_registry.py

      - name: Validate canonical benchmark registry
        run: >-
          python scripts/check_p1_benchmark_registry.py
          --print-summary

      - name: Run LEARN-01/02 and EVID-05 regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_benchmark_registry.py
          skeleton/testing/test_experiment_registry.py
          skeleton/testing/test_reproducibility.py
          tests/test_p1_benchmark_registry.py
          tests/test_p1_experiment_registry.py
          tests/test_p1_reproducibility_bundle.py

      - name: Validate canonical AI file tree parity
        run: python scripts/check_ai_file_tree.py

      - name: Build accepted LEARN-02 benchmark evidence
        run: |
          set -euo pipefail
          mkdir -p .p1-learn-02
          python - <<'PY'
          import json
          from dataclasses import replace
          from pathlib import Path

          from skeleton.contracts.canonical import EvidenceRef
          from skeleton.contracts.reproducibility import ReproducibilityBundle
          from skeleton.eval.benchmark_registry import (
              BenchmarkDataset,
              BenchmarkEnvironment,
              BenchmarkManifest,
              BenchmarkMetric,
              BenchmarkScoreObservation,
              BenchmarkSplit,
              BenchmarkSplitRole,
              ContaminationStatus,
              evaluate_improvement_claim,
              qualify_benchmark,
          )
          from skeleton.eval.experiment_registry import (
              ExperimentBudget,
              ExperimentEligibility,
              ExperimentManifest,
              ExperimentMetric,
              MetricDirection,
              TrafficMode,
          )

          experiment = ExperimentManifest(
              experiment_id="learn-02-ci",
              hypothesis="Candidate improves exact-match quality.",
              owner="p1-eval",
              source_commit="b" * 40,
              environment_id="env-ci",
              candidate_ref="candidate-v2",
              eligibility=ExperimentEligibility(
                  traffic_mode=TrafficMode.OFFLINE,
                  max_traffic_fraction=0.0,
                  allowed_data_classes=("public",),
              ),
              budget=ExperimentBudget(
                  max_samples=1000,
                  max_tokens=100000,
                  max_cost_units=100.0,
                  max_wall_time_s=3600.0,
              ),
              metrics=(
                  ExperimentMetric(
                      metric_id="exact-match",
                      direction=MetricDirection.MAXIMIZE,
                      minimum_samples=100,
                      source="independent-evaluator",
                  ),
              ),
          )
          repro = ReproducibilityBundle(
              repository="Apeloff1/Skeleton",
              commit_sha="b" * 40,
              task_id="P1-EVID-05",
              accountability_id="ACC-P1-EVID-05",
              configuration_digest="1" * 64,
              environment_digest="2" * 64,
              verifier_id="github-actions:p1-reproducibility-bundle",
              verifier_digest="3" * 64,
              test_manifest_digest="4" * 64,
              runner_id="runner-ci",
              runner_digest="5" * 64,
              budget_id="budget-ci",
              budget_digest="6" * 64,
              source_date_epoch=1_800_000_000,
              expected_subject_digest="7" * 64,
              expected_evidence_digest="8" * 64,
              inputs=(
                  EvidenceRef(
                      source="ci://learn-02-repro-input",
                      digest="9" * 64,
                      category="fixture",
                  ),
              ),
          )
          dataset = BenchmarkDataset(
              dataset_id="qa-benchmark",
              version="v1",
              source_ref="dataset://qa-benchmark/v1",
              source_digest="a" * 64,
              content_digest="b" * 64,
              license_id="internal-eval",
          )
          split = BenchmarkSplit(
              split_id="test",
              role=BenchmarkSplitRole.TEST,
              dataset_digest=dataset.digest,
              content_digest="c" * 64,
              sample_count=500,
              contamination_status=ContaminationStatus.CLEAN,
              contamination_evidence=(
                  EvidenceRef(
                      source="ci://contamination-scan/test",
                      digest="d" * 64,
                      category="contamination_scan",
                  ),
              ),
          )
          metric = BenchmarkMetric(
              metric_id="exact-match",
              direction=MetricDirection.MAXIMIZE,
              minimum_samples=100,
              evaluator_id="independent-evaluator",
              evaluator_digest="e" * 64,
          )
          manifest = BenchmarkManifest(
              benchmark_id="qa-core",
              version="v1",
              datasets=(dataset,),
              splits=(split,),
              metrics=(metric,),
              primary_metric_id="exact-match",
              environment=BenchmarkEnvironment(
                  environment_id=experiment.environment_id,
                  environment_digest=repro.environment_digest,
                  runner_digest=repro.runner_digest,
                  dependency_lock_digest="f" * 64,
                  source_date_epoch=repro.source_date_epoch,
              ),
              experiment_manifest_digest=experiment.manifest_digest,
              reproducibility_bundle_digest=repro.bundle_digest,
              tags=("ci", "promotion"),
          )
          qualification = qualify_benchmark(
              manifest=manifest,
              experiment=experiment,
              reproducibility=repro,
              evaluated_split_ids=("test",),
          )
          if not qualification.accepted:
              raise SystemExit(
                  f"LEARN-02 qualification rejected: {qualification.reasons}"
              )
          baseline = BenchmarkScoreObservation(
              benchmark_manifest_digest=manifest.manifest_digest,
              split_id="test",
              metric_id="exact-match",
              candidate_ref="champion-v1",
              score=0.80,
              sample_count=500,
              evaluator_id=metric.evaluator_id,
              evaluator_digest=metric.evaluator_digest,
          )
          candidate = replace(
              baseline,
              candidate_ref=experiment.candidate_ref,
              score=0.86,
          )
          claim = evaluate_improvement_claim(
              manifest=manifest,
              qualification=qualification,
              experiment=experiment,
              baseline=baseline,
              candidate=candidate,
          )
          if not claim.accepted:
              raise SystemExit(
                  f"LEARN-02 improvement claim rejected: {claim.reasons}"
              )

          refs = (
              qualification.accepted_evidence_ref(),
              claim.accepted_evidence_ref(),
          )
          Path(".p1-learn-02/refs.json").write_text(
              json.dumps(
                  [
                      {
                          "source": item.source,
                          "digest": item.digest,
                          "category": item.category,
                      }
                      for item in refs
                  ],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          Path(".p1-learn-02/claim.json").write_text(
              json.dumps(claim.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head LEARN-02 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-learn-02/config.digest").write_text(
              hashlib.sha256(
                  b"p1-learn-02-benchmark-registry-v1"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-learn-02/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|learn-02"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-learn-02/verifier.digest").write_text(
              digest([
                  "skeleton/eval/benchmark_registry.py",
                  "skeleton/eval/experiment_registry.py",
                  "skeleton/contracts/reproducibility.py",
                  "machine/p1_benchmark_registry.json",
                  "scripts/check_p1_benchmark_registry.py",
                  ".github/workflows/p1-benchmark-registry.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-learn-02/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_benchmark_registry.py",
                  "skeleton/testing/test_experiment_registry.py",
                  "skeleton/testing/test_reproducibility.py",
                  "tests/test_p1_benchmark_registry.py",
                  "tests/test_p1_experiment_registry.py",
                  "tests/test_p1_reproducibility_bundle.py",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-LEARN-02 \
            --accountability-id ACC-P1-LEARN-02 \
            --configuration-digest "$(cat .p1-learn-02/config.digest)" \
            --environment-digest "$(cat .p1-learn-02/environment.digest)" \
            --verifier-id github-actions:p1-benchmark-registry \
            --verifier-digest "$(cat .p1-learn-02/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-learn-02/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-learn-02/refs.json \
            --out .p1-learn-02/receipt.json \
            > .p1-learn-02/stdout.json

      - name: Assert exact-head LEARN-02 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-learn-02/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("LEARN-02 receipt head mismatch")
          if receipt["task_id"] != "P1-LEARN-02":
              raise SystemExit("LEARN-02 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-LEARN-02":
              raise SystemExit("LEARN-02 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("LEARN-02 exact-head receipt OK", receipt["receipt_digest"])
          PY
