name: P2 Traceability Focused Contract

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_build_accountability.json"
      - "machine/ai_p2_task_backlog.json"
      - "machine/capability_interfaces.json"
      - "machine/ai_runtime_schemas.json"
      - "machine/master_traceability.json"
      - "machine/traceability/**"
      - "machine/requirement_registry.json"
      - "machine/capability_taxonomy.json"
      - "machine/capability_registry.json"
      - "machine/capability_maturity.json"
      - "machine/behavior_specifications.json"
      - "machine/state_machine_catalogue.json"
      - "machine/interface_standard.json"
      - "machine/schema_registry.json"
      - "machine/compatibility_model.json"
      - "machine/protocol_registry.json"
      - "machine/internal_protocols.json"
      - "machine/maturity_registry.json"
      - "machine/nfr_registry.json"
      - "scripts/check_master_traceability.py"
      - "scripts/check_traceability_spine.py"
      - "scripts/check_nfr_registry.py"
      - "scripts/check_p2_traceability.py"
      - "tests/test_master_traceability.py"
      - "tests/test_traceability_spine.py"
      - "tests/test_nfr_registry.py"
      - "tests/test_p2_traceability.py"
      - "docs/plan/P2_TRACEABILITY_SPINE.md"
      - ".github/workflows/p2-traceability.yml"
      - ".github/workflows/p2-traceability-spine.yml"
  push:
    branches:
      - main
      - feat/p2-traceability-spine
    paths:
      - "machine/**"
      - "scripts/check_master_traceability.py"
      - "scripts/check_traceability_spine.py"
      - "scripts/check_nfr_registry.py"
      - "scripts/check_p2_traceability.py"
      - "tests/test_master_traceability.py"
      - "tests/test_traceability_spine.py"
      - "tests/test_nfr_registry.py"
      - "tests/test_p2_traceability.py"
      - "docs/plan/P2_TRACEABILITY_SPINE.md"
      - ".github/workflows/p2-traceability.yml"
      - ".github/workflows/p2-traceability-spine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-traceability-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-traceability:
    name: Validate focused P2 trace projection
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."

    steps:
      - name: Check out exact head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Validate canonical sharded master trace
        run: python scripts/check_master_traceability.py --json

      - name: Validate canonical requirements-to-runtime spine
        run: python scripts/check_traceability_spine.py --json

      - name: Validate focused P2 projections
        run: python scripts/check_p2_traceability.py --json

      - name: Run focused projection regressions
        run: python -m unittest -v tests.test_p2_traceability

      - name: Compute canonical PR change impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/p2-changed-files.txt
          python scripts/check_p2_traceability.py --json \
            --changed-file-list /tmp/p2-changed-files.txt
