name: P3 VS-002 Engineering Agent

on:
  pull_request:
    paths:
      - "skeleton/ai/runtime/autonomous_engineering/agent.py"
      - "skeleton/ai/runtime/autonomous_engineering/**"
      - "skeleton/testing/test_p3_engineering_agent.py"
      - ".github/workflows/p3-vs002-engineering-agent.yml"
  push:
    branches:
      - main
      - feat/p3-autonomous-engineering-frontier
    paths:
      - "skeleton/ai/runtime/autonomous_engineering/agent.py"
      - "skeleton/testing/test_p3_engineering_agent.py"
      - ".github/workflows/p3-vs002-engineering-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-vs002-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vs002:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pytest-asyncio>=0.24,<1"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"
      - name: Execute credential-free VS-002
        run: >-
          python -m pytest -q
          skeleton/testing/test_p3_workflow_compiler.py
          skeleton/testing/test_p3_safe_change.py
          skeleton/testing/test_p3_autonomy_control.py
          skeleton/testing/test_p3_effect_ledger.py
          skeleton/testing/test_p3_engineering_agent.py
