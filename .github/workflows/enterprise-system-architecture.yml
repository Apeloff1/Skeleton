name: Enterprise System Architecture

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/enterprise_system_architecture.json"
      - "docs/ENTERPRISE_SYSTEM_ARCHITECTURE.md"
      - "machine/architecture.json"
      - "docs/ARCHITECTURE_MAP.md"
      - "machine/ai_app_construction.json"
      - "docs/AI_APP_CONSTRUCTION_MANUAL.md"
      - "machine/capability_interfaces.json"
      - "machine/state_topology.json"
      - "skeleton/app/manifest.json"
      - "scripts/check_enterprise_system_architecture.py"
      - "scripts/verify_enterprise_system_architecture.py"
      - "tests/test_enterprise_system_architecture.py"
      - ".github/workflows/enterprise-system-architecture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-system-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enterprise-architecture:
    name: Enterprise architecture exact-head closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: ".:backend"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install project validation runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate enterprise system architecture
        run: python scripts/check_enterprise_system_architecture.py

      - name: Validate underlying architecture contracts
        run: |
          python scripts/check_architecture_map.py
          python scripts/check_ai_app_construction.py
          python scripts/check_capability_interfaces.py
          python scripts/check_state_topology.py
          python -m skeleton app check

      - name: Run enterprise architecture adversarial tests
        run: >-
          python -m pytest -q --noconftest
          tests/test_enterprise_system_architecture.py

      - name: Compile enterprise architecture tools
        run: >-
          python -m compileall -q
          scripts/check_enterprise_system_architecture.py
          scripts/verify_enterprise_system_architecture.py

      - name: Emit exact-head enterprise architecture evidence
        env:
          ENTERPRISE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/check_enterprise_system_architecture.py
          --head-sha "$ENTERPRISE_HEAD_SHA"
          --evidence-out .enterprise-system-architecture.json
          --print-evidence

      - name: Independently rehash exact-head evidence
        env:
          ENTERPRISE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_enterprise_system_architecture.py
          .enterprise-system-architecture.json
          --head-sha "$ENTERPRISE_HEAD_SHA"
          --evidence-out .enterprise-system-architecture-independent.json
          --print-evidence

      - name: Assert enterprise architecture closure receipt
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          structural = json.loads(
              Path(".enterprise-system-architecture.json").read_text(
                  encoding="utf-8"
              )
          )
          independent = json.loads(
              Path(
                  ".enterprise-system-architecture-independent.json"
              ).read_text(encoding="utf-8")
          )
          expected = os.environ["EXPECTED_SHA"].strip()

          if structural.get("head_sha") != expected:
              raise SystemExit("enterprise structural receipt is not exact-head")
          if structural.get("valid") is not True or structural.get("errors"):
              raise SystemExit("enterprise structural validator failed")
          if structural.get("plan_complete") is not True:
              raise SystemExit("enterprise architecture plan is not complete")
          if structural.get("production_claim") is not False:
              raise SystemExit(
                  "enterprise planning gate must not fabricate production readiness"
              )
          if len(structural.get("file_digests") or {}) != 13:
              raise SystemExit("enterprise digest coverage is incomplete")
          if len(structural.get("evidence_digest") or "") != 64:
              raise SystemExit("enterprise evidence digest is missing")

          if independent.get("expected_head") != expected:
              raise SystemExit("enterprise independent receipt is not exact-head")
          if independent.get("valid") is not True or independent.get("errors"):
              raise SystemExit("enterprise independent verifier failed")
          if (
              independent.get("structural_evidence_digest")
              != independent.get("recomputed_structural_evidence_digest")
          ):
              raise SystemExit("enterprise structural receipt was not rehashed")
          for field in ("contract_digest", "receipt_digest", "verifier_digest"):
              if len(independent.get(field) or "") != 64:
                  raise SystemExit(
                      f"enterprise independent {field} is missing"
                  )
          print("Enterprise system architecture exact-head closure verified:", expected)
          PY
