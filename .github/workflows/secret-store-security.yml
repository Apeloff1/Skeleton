name: Secret Store Security

on:
  pull_request:
    branches: [main]
    paths:
      - ".env.example"
      - "skeleton/organism/secret_manager.py"
      - "skeleton/testing/test_secret_manager_security.py"
      - ".github/workflows/secret-store-security.yml"
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "skeleton/organism/secret_manager.py"
      - "skeleton/testing/test_secret_manager_security.py"
      - ".github/workflows/secret-store-security.yml"

permissions:
  contents: read

concurrency:
  group: secret-store-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Persistent secret-store regressions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8,<9" "cryptography>=42,<47"
      - name: Compile secret-store boundary
        run: python -m compileall -q skeleton/organism/secret_manager.py skeleton/testing/test_secret_manager_security.py
      - name: Run secret-store regressions
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q skeleton/testing/test_secret_manager_security.py
