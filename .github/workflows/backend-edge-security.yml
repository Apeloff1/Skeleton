name: Backend Edge Security

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/middleware/security.py"
      - "backend/security_tests/test_edge_middleware*.py"
      - ".github/workflows/backend-edge-security.yml"
  push:
    branches: [main]
    paths:
      - "backend/middleware/security.py"
      - "backend/security_tests/test_edge_middleware*.py"
      - ".github/workflows/backend-edge-security.yml"

permissions:
  contents: read

concurrency:
  group: backend-edge-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9" "fastapi>=0.100,<1"
      - name: Run backend edge adversarial suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          backend/security_tests/test_edge_middleware.py
          backend/security_tests/test_edge_middleware_hardening.py
          backend/security_tests/test_edge_middleware_properties.py
