name: Idle Security Bot

on:
  schedule:
    - cron: '11 2 * * *'
  workflow_dispatch:

concurrency:
  group: idle-security-bot
  cancel-in-progress: false

permissions: {}

jobs:
  digest:
    name: Maintain security backlog digest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      security-events: read
      vulnerability-alerts: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_TITLE: 'bot: security backlog digest'
    steps:
      - name: Collect open security findings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security"
          gh api --paginate "/repos/${REPO}/code-scanning/alerts?state=open&per_page=100" > "$RUNNER_TEMP/security/code.json" || printf '[]' > "$RUNNER_TEMP/security/code.json"
          gh api --paginate "/repos/${REPO}/dependabot/alerts?state=open&per_page=100" > "$RUNNER_TEMP/security/dependabot.json" || printf '[]' > "$RUNNER_TEMP/security/dependabot.json"

      - name: Create or refresh digest issue
        shell: bash
        run: |
          set -euo pipefail
          gh label create 'security' --repo "$REPO" --color 'b60205' --description 'Security-related repository work' --force
          code_count=$(jq 'if type == "array" then length else 0 end' "$RUNNER_TEMP/security/code.json")
          dep_count=$(jq 'if type == "array" then length else 0 end' "$RUNNER_TEMP/security/dependabot.json")
          total=$((code_count + dep_count))
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          body_file="$RUNNER_TEMP/security/body.md"
          {
            echo '## Automated security backlog'
            echo
            echo "Updated: ${now}"
            echo
            echo "- Open code-scanning alerts: **${code_count}**"
            echo "- Open Dependabot alerts: **${dep_count}**"
            echo "- Total tracked findings: **${total}**"
            echo
            echo '### Code scanning'
            jq -r 'if type == "array" then .[:20][] | "- `#\(.number // "?")` \(.rule.description // .rule.id // "unknown rule") — \(.html_url // "no URL")" else empty end' "$RUNNER_TEMP/security/code.json"
            echo
            echo '### Dependabot'
            jq -r 'if type == "array" then .[:20][] | "- `\(.dependency.package.name // "unknown package")` — \(.security_advisory.summary // .security_advisory.ghsa_id // "unknown advisory") — \(.html_url // "no URL")" else empty end' "$RUNNER_TEMP/security/dependabot.json"
            echo
            echo '> This bot inventories findings and keeps them visible. It does not dismiss alerts or weaken security gates.'
          } > "$body_file"

          existing=$(gh issue list --repo "$REPO" --state open --search "${ISSUE_TITLE} in:title" --limit 1 --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file" >/dev/null
            gh issue edit "$existing" --repo "$REPO" --add-label 'security' >/dev/null
            issue_number="$existing"
          else
            issue_number=$(gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPO}/issues" \
              -f title="$ISSUE_TITLE" \
              -f body="$(cat "$body_file")" \
              -f 'labels[]=security' \
              --jq '.number')
          fi
          if [[ ! "$issue_number" =~ ^[0-9]+$ ]]; then
            echo 'Idle security bot could not resolve a numeric digest issue ID' >&2
            exit 1
          fi

          {
            echo '## Idle security bot'
            echo "- Digest issue: #${issue_number}"
            echo "- Code scanning alerts: ${code_count}"
            echo "- Dependabot alerts: ${dep_count}"
            echo '- No alerts were dismissed or modified.'
          } >> "$GITHUB_STEP_SUMMARY"
