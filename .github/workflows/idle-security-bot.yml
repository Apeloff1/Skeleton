name: Idle Security Bot

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

concurrency:
  group: idle-security-bot
  cancel-in-progress: false

permissions: {}

jobs:
  digest:
    name: Maintain security backlog digest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      security-events: read
      vulnerability-alerts: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_TITLE: 'bot: security backlog digest'
      BATCH_SIZE: '50'
      BODY_MAX_BYTES: '60000'
    steps:
      - name: Collect open security findings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security"

          # Fail closed: API/auth/outage errors must never be converted into an
          # apparently empty security backlog.
          gh api --paginate --slurp "/repos/${REPO}/code-scanning/alerts?state=open&per_page=100" \
            | jq -e '[.[] | if type == "array" then .[] else empty end]' \
            > "$RUNNER_TEMP/security/code.json"

          gh api --paginate --slurp "/repos/${REPO}/dependabot/alerts?state=open&per_page=100" \
            | jq -e '[.[] | if type == "array" then .[] else empty end]' \
            > "$RUNNER_TEMP/security/dependabot.json"

          jq -n \
            --argjson limit "$BATCH_SIZE" \
            --slurpfile code "$RUNNER_TEMP/security/code.json" \
            --slurpfile dependabot "$RUNNER_TEMP/security/dependabot.json" '
              def clip($value; $max):
                (($value // "") | tostring) as $text
                | if ($text | length) > $max
                  then ($text[0:$max] + "…")
                  else $text
                  end;
              def priority($value):
                (($value // "") | ascii_downcase) as $severity
                | if $severity == "critical" then 0
                  elif $severity == "high" or $severity == "error" then 1
                  elif $severity == "medium" or $severity == "warning" then 2
                  elif $severity == "low" or $severity == "note" then 3
                  else 4
                  end;

              [
                ($code[0][]? |
                  (.rule.security_severity_level // .rule.severity // "unknown") as $severity |
                  {
                    kind: "code-scanning",
                    number: (.number // 0),
                    severity: $severity,
                    priority: priority($severity),
                    rule_id: clip((.rule.id // "unknown-rule"); 100),
                    group: ("code:" + clip((.rule.id // "unknown-rule"); 100)),
                    summary: clip((.rule.description // .rule.id // "unknown rule"); 180),
                    path: clip((.most_recent_instance.location.path // "unknown"); 260),
                    line: (.most_recent_instance.location.start_line // 0),
                    url: clip((.html_url // ""); 220)
                  }
                ),
                ($dependabot[0][]? |
                  (.security_advisory.severity // "unknown") as $severity |
                  {
                    kind: "dependabot",
                    number: (.number // 0),
                    severity: $severity,
                    priority: priority($severity),
                    package: clip((.dependency.package.name // "unknown-package"); 100),
                    ecosystem: clip((.dependency.package.ecosystem // "unknown"); 40),
                    group: ("dependabot:" + clip((.dependency.package.name // "unknown-package"); 100)),
                    summary: clip((.security_advisory.summary // .security_advisory.ghsa_id // "unknown advisory"); 180),
                    advisory: clip((.security_advisory.ghsa_id // "unknown"); 80),
                    path: clip((.dependency.manifest_path // "unknown"); 260),
                    url: clip((.html_url // ""); 220)
                  }
                )
              ]
              | if any(.[]; (.number | type) != "number" or .number <= 0)
                then error("security alert payload contains invalid alert number")
                else .
                end
              | unique_by([.kind, .number])
              | sort_by([.priority, -(.number // 0)])
              | .[:$limit]
            ' > "$RUNNER_TEMP/security/batch.json"

      - name: Create or refresh digest issue
        shell: bash
        run: |
          set -euo pipefail
          gh label create 'security' --repo "$REPO" --color 'b60205' --description 'Security-related repository work' --force
          code_count=$(jq 'if type == "array" then length else 0 end' "$RUNNER_TEMP/security/code.json")
          dep_count=$(jq 'if type == "array" then length else 0 end' "$RUNNER_TEMP/security/dependabot.json")
          batch_count=$(jq 'if type == "array" then length else 0 end' "$RUNNER_TEMP/security/batch.json")
          total=$((code_count + dep_count))
          expected_batch=$(( total < BATCH_SIZE ? total : BATCH_SIZE ))
          if (( batch_count > BATCH_SIZE )); then
            echo "Prioritized security batch exceeded configured bound." >&2
            exit 1
          fi
          # Pagination may observe the same alert twice while GitHub's alert
          # set changes between pages. The batch is identity-deduplicated, so a
          # smaller batch than min(total, limit) is allowed and reported rather
          # than padded with duplicate work.
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          body_file="$RUNNER_TEMP/security/body.md"
          {
            echo '## Automated security backlog'
            echo
            echo "Updated: ${now}"
            echo
            echo "- Open code-scanning alerts: **${code_count}**"
            echo "- Open Dependabot alerts: **${dep_count}**"
            echo "- Total tracked findings: **${total}**"
            echo "- Prioritized remediation batch: **${batch_count} / ${BATCH_SIZE}**"
            echo "- Nominal batch target before identity de-duplication: **${expected_batch}**"
            echo
            echo '### Root-cause groups in this batch'
            jq -r '
              if type == "array" then
                group_by(.group)
                | sort_by(-length)
                | .[]
                | "- \(length)x `\(.[0].group)`"
              else empty end
            ' "$RUNNER_TEMP/security/batch.json"
            echo
            echo '### Prioritized remediation batch'
            jq -r '
              if type == "array" then
                .[] |
                if .kind == "code-scanning" then
                  "- [Code scanning][\(.severity)] `#\(.number)` `\(.rule_id)` \(.summary) — `\(.path):\(.line)` — \(.url)"
                else
                  "- [Dependabot][\(.severity)] `#\(.number)` `\(.package)` (\(.ecosystem)) \(.summary) — `\(.path)` — \(.url)"
                end
              else empty end
            ' "$RUNNER_TEMP/security/batch.json"
            echo
            echo '> Batch selection is severity-first and capped at 50 findings. Fix repeated rules/packages at the root cause; do not dismiss alerts merely to reduce the count.'
          } > "$body_file"

          body_bytes=$(wc -c < "$body_file" | tr -d ' ')
          if [[ ! "$body_bytes" =~ ^[0-9]+$ ]] || (( body_bytes > BODY_MAX_BYTES )); then
            echo "Security digest body exceeds bounded issue payload." >&2
            exit 1
          fi

          existing=$(
            gh api --paginate --slurp "/repos/${REPO}/issues?state=all&per_page=100" \
              | jq -r --arg title "$ISSUE_TITLE" '
                  first(
                    .[] | if type == "array" then .[] else empty end
                    | select(
                        (has("pull_request") | not)
                        and (.title == $title)
                        and (.user.login == "github-actions[bot]")
                      )
                    | .number
                  ) // empty
                '
          )

          if [[ -n "$existing" ]]; then
            issue_number="$existing"
            # Keep one bounded digest surface instead of appending an hourly
            # comment forever. Historical state remains available in issue
            # events and Actions logs.
            gh issue edit "$issue_number" --repo "$REPO" \
              --body-file "$body_file" --add-label 'security' >/dev/null
          else
            issue_number=$(gh api --method POST "repos/${REPO}/issues" \
              -f title="$ISSUE_TITLE" \
              -f body="$(cat "$body_file")" \
              -f 'labels[]=security' \
              --jq '.number')
          fi

          if [[ ! "$issue_number" =~ ^[0-9]+$ ]]; then
            echo 'Idle security bot could not resolve a valid digest issue number.' >&2
            exit 1
          fi
          gh api --method PATCH "repos/${REPO}/issues/${issue_number}" -f state=closed >/dev/null

          {
            echo '## Idle security bot'
            echo "- Digest issue: #${issue_number}"
            echo "- Code scanning alerts: ${code_count}"
            echo "- Dependabot alerts: ${dep_count}"
            echo "- Prioritized batch: ${batch_count}/${BATCH_SIZE}"
            echo "- Nominal target before de-duplication: ${expected_batch}"
            echo '- No alerts were dismissed or modified.'
          } >> "$GITHUB_STEP_SUMMARY"
