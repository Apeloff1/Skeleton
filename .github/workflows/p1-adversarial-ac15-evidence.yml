name: P1 Adversarial AC-15 Evidence Gate

on:
  pull_request:
    branches:
      - main
      - p1/adversarial-ac20-evidence-20260930
      - p1/closure-rollup-490-23-20260930
      - p1/adversarial-wave2-bindings-20260930
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "skeleton/intelligence/admission.py"
      - "skeleton/intelligence/admission_runtime.py"
      - "skeleton/intelligence/quota.py"
      - "skeleton/intelligence/quota_sqlite.py"
      - "skeleton/intelligence/shared_pressure.py"
      - "skeleton/provider_runtime.py"
      - "skeleton/testing/test_cost_admission.py"
      - "skeleton/testing/test_tenant_quota.py"
      - "skeleton/testing/test_tenant_quota_sqlite.py"
      - "skeleton/testing/test_shared_pressure.py"
      - "skeleton/testing/test_adversarial_ac15.py"
      - "scripts/verify_cost_admission_closure.py"
      - "tests/test_cost_admission_independent_verifier.py"
      - "scripts/build_p1_adversarial_ac15_evidence.py"
      - "tests/test_p1_adversarial_ac15_evidence.py"
      - "tests/test_p1_adversarial_wave2_bindings.py"
      - ".github/workflows/p1-adversarial-ac15-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-adversarial-ac15-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify AC-15 economic denial evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Prove budget-fault and fanout/quota modes
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_adversarial_ac15.py
          skeleton/testing/test_cost_admission.py
          skeleton/testing/test_tenant_quota.py
          skeleton/testing/test_tenant_quota_sqlite.py
          skeleton/testing/test_shared_pressure.py

      - name: Run independent cost/admission verifier regressions
        run: >-
          python -m pytest -q --noconftest
          tests/test_cost_admission_independent_verifier.py
          tests/test_p1_adversarial_ac15_evidence.py
          tests/test_p1_adversarial_ac15_binding.py
          tests/test_p1_adversarial_wave2_bindings.py
          tests/test_p1_adversarial_ac20_binding.py
          tests/test_p1_risk_evidence_reconciliation.py

      - name: Run independent exact-head cost/admission scan
        run: |
          set -euo pipefail
          mkdir -p .p1-ac15
          GITHUB_SHA="$EXPECTED_SHA"             python scripts/verify_cost_admission_closure.py             --evidence-out .p1-ac15/cost-receipt.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-ac15/cost-receipt.json").read_text(encoding="utf-8")
          )
          if receipt.get("head_sha") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("cost/admission receipt is not exact-head bound")
          if receipt.get("verifier") != "independent-cost-admission-v1":
              raise SystemExit("unexpected independent verifier identity")
          if receipt.get("valid") is not True:
              raise SystemExit("independent cost/admission verification failed")
          PY

      - name: Compile exact-head AC-15 evidence twice
        run: |
          set -euo pipefail
          python scripts/build_p1_adversarial_ac15_evidence.py             --expected-head "$EXPECTED_SHA"             --out .p1-ac15/report.json             --print-summary
          python scripts/build_p1_adversarial_ac15_evidence.py             --expected-head "$EXPECTED_SHA"             --out .p1-ac15/replay.json
          cmp .p1-ac15/report.json .p1-ac15/replay.json

      - name: Prove AC-15 candidate authority boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".p1-ac15/report.json").read_text(encoding="utf-8")
          )
          candidate = report["candidate"]
          expected_modes = {
              "budget_fault",
              "fanout_stress",
              "quota_isolation",
              "provider_reprice_simulation",
          }
          if report["axis_id"] != "AC-15":
              raise SystemExit("wrong adversarial axis")
          if report["candidate_count"] != 1:
              raise SystemExit("AC-15 candidate count drift")
          if report["already_bound_count"] != 1:
              raise SystemExit("AC-15 governed binding not detected")
          if report["candidate_binding_count"] != 0:
              raise SystemExit("AC-15 unexpectedly remains a binding candidate")
          if candidate["binding_present"] is not True:
              raise SystemExit("AC-15 candidate does not detect governed binding")
          if set(candidate["required_evidence_modes"]) != expected_modes:
              raise SystemExit("AC-15 required evidence modes drift")
          if {row["category"] for row in candidate["evidence"]} != expected_modes:
              raise SystemExit("AC-15 evidence categories are incomplete")
          if candidate["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("AC-15 candidate is not exact-head bound")
          if candidate["recommended_severity"] != "high":
              raise SystemExit("AC-15 severity must remain high")
          if candidate["recommended_disposition"] != "evidence":
              raise SystemExit("AC-15 disposition must remain evidence")
          for field in (
              "creates_binding",
              "accepts_risk",
              "lowers_severity",
              "promotes_maturity",
          ):
              if candidate[field] is not False:
                  raise SystemExit(f"AC-15 authority boundary drift: {field}")
          print(
              "P1_AC15_BINDING_SEED "
              + json.dumps(
                  {
                      "obligation_id": candidate["obligation_id"],
                      "obligation_digest": candidate["obligation_digest"],
                      "owner_id": candidate["owner_id"],
                      "severity": candidate["recommended_severity"],
                      "disposition": candidate["recommended_disposition"],
                      "evidence": candidate["evidence"],
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

      - name: Confirm governed frontier remains 509 resolved and 4 blocking
        run: |
          set -euo pipefail
          python scripts/reconcile_p1_risk_evidence.py             --evaluated-at "2026-10-01T12:00:00+00:00"             --out .p1-ac15/reconciliation.json             --print-summary
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-ac15/reconciliation.json").read_text(encoding="utf-8")
          )
          if report["binding_count"] != 509:
              raise SystemExit("AC-15 verifier mutated binding count")
          if report["resolved_count"] != 509:
              raise SystemExit("AC-15 verifier mutated resolved count")
          if report["unresolved_blocking_count"] != 4:
              raise SystemExit("AC-15 verifier mutated blocking count")
          if report["unclassified_count"] != 0:
              raise SystemExit("AC-15 verifier reintroduced unclassified risks")
          if report["disposition_counts"] != {
              "evidence": 509,
              "unbound": 4,
          }:
              raise SystemExit("AC-15 verifier mutated disposition counts")
          PY
