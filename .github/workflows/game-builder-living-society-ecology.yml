name: Game Builder Living NPCs and Ecosystems
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-builder-living-worlds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-living-worlds:
    name: NPC society and ecological replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Checkout signed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/__init__.py
            skeleton/ai/__init__.py
            skeleton/ai/capability_map.py
            skeleton/ai/game_builder/
            tests/__init__.py
            tests/test_game_builder_advanced_npc_society.py
            tests/test_game_builder_advanced_npc_society_planner.py
            tests/test_game_builder_advanced_ecosystem_planner.py
            tests/test_game_builder_living_world_savegame.py
            tests/test_game_builder_advanced_ecosystem.py
      - name: Configure Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Fail on stale checkout and invalid Python
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile skeleton/ai/game_builder/advanced_npc_society_runtime.py skeleton/ai/game_builder/advanced_npc_society_planner.py skeleton/ai/game_builder/advanced_ecosystem_planner.py skeleton/ai/game_builder/advanced_ecosystem_runtime.py skeleton/ai/game_builder/advanced_gameplay_runtime.py skeleton/ai/game_builder/advanced_level_scenes.py skeleton/ai/game_builder/system_editors.py skeleton/ai/game_builder/system_editor_assembly.py skeleton/ai/game_builder/game_workspace_ui.py skeleton/ai/game_builder/game_workspace_server.py skeleton/ai/game_builder/system_editor_cli.py tests/test_game_builder_advanced_npc_society.py tests/test_game_builder_advanced_ecosystem.py tests/test_game_builder_living_world_savegame.py
      - name: Check actual interactive authoring JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from skeleton.ai.game_builder.game_workspace_ui import SCRIPT
          file=Path(os.environ["RUNNER_TEMP"])/"living_worlds_studio.js"
          file.write_text(SCRIPT.replace("__TOKEN__",'"original-proof-ci"'),encoding="utf-8")
          PY
          node --check "$RUNNER_TEMP/living_worlds_studio.js"
      - name: Verify witnessed social choices and real habitat transitions
        shell: bash
        run: |
          python -m unittest tests.test_game_builder_advanced_npc_society tests.test_game_builder_advanced_npc_society_planner tests.test_game_builder_advanced_ecosystem tests.test_game_builder_advanced_ecosystem_planner tests.test_game_builder_living_world_savegame -v
