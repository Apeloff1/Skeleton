name: Night Shift Bots

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

concurrency:
  group: night-shift-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  maintenance:
    if: github.repository == 'Apeloff1/Skeleton'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run repository night-shift bots
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python skeleton/automation/night_shift.py --repo "$GITHUB_REPOSITORY"
