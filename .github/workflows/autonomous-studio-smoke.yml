name: Autonomous Studio Smoke

on:
  pull_request:
    paths:
      - 'skeleton/automation/studio_*.py'
      - 'skeleton/automation/chatgpt_adapter.py'
      - 'skeleton/testing/test_studio*.py'
      - 'core/shift_supervisor/**'
      - 'tests/test_shift_supervisor_planning_harness.py'
      - 'tests/test_shift_supervisor_peak_loop.py'
      - 'tests/test_shift_supervisor_scheduler.py'
      - '.github/workflows/autonomous-studio.yml'
      - '.github/workflows/autonomous-studio-smoke.yml'
      - '.github/workflows/shift-supervisor-harness.yml'
  workflow_dispatch:

concurrency:
  group: autonomous-studio-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - name: Checkout proposed source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.1.0
        with:
          python-version: '3.11.16'

      - name: Install trusted test tooling
        run: python -m pip install -e '.[dev]'

      - name: Prove credential-free boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"

      - name: Compile Studio and Shift Supervisor control planes
        run: python -m compileall skeleton/automation core/shift_supervisor -q

      - name: Exercise Studio CLI import path
        run: python -m skeleton.automation.studio_director --help >/dev/null

      - name: Verify exact logical fleet size
        run: >-
          python -c "from skeleton.automation.studio_registry import STUDIO, STUDIO_SIZE;
          assert STUDIO_SIZE == 1000 and len(STUDIO) == 1000"

      - name: Run focused deterministic Studio suite
        run: |
          python -m pytest \
            skeleton/testing/test_studio_registry.py \
            skeleton/testing/test_studio_director.py \
            skeleton/testing/test_studio_report.py \
            skeleton/testing/test_studio_pipeline_smoke.py \
            -q --tb=short --maxfail=1

      - name: Run deterministic Shift Supervisor planning suite
        run: |
          python -m pytest \
            tests/test_shift_supervisor_planning_harness.py \
            tests/test_shift_supervisor_peak_loop.py \
            tests/test_shift_supervisor_scheduler.py \
            -q --tb=short --maxfail=1

      - name: Run 1,000-worker SMB planning stress contract
        run: python -m core.shift_supervisor.planning_harness --workers 1000 --cycles 4
