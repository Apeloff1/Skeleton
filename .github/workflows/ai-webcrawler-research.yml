name: AI Webcrawler Research Plane

on:
  push:
    branches: [main]
    paths:
      - "skeleton/ai/webcrawler/**"
      - "skeleton/retrieval/provenance.py"
      - "skeleton/retrieval/provenance_checkpoint.py"
      - "skeleton/retrieval/provenance_checkpoint.py"
      - "skeleton/retrieval/provenance.py"
      - "tests/test_ai_webcrawler_*.py"
      - "tests/test_retrieval_provenance_idempotency.py"
      - "tests/test_retrieval_provenance_checkpoint.py"
      - "tests/test_retrieval_provenance_checkpoint.py"
      - "tests/test_retrieval_provenance_idempotency.py"
      - "scripts/check_ai_webcrawler.py"
      - ".github/workflows/ai-webcrawler-research.yml"
  pull_request:
    branches: [main]
    paths:
      - "skeleton/ai/webcrawler/**"
      - "tests/test_ai_webcrawler_*.py"
      - "scripts/check_ai_webcrawler.py"
      - ".github/workflows/ai-webcrawler-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-webcrawler-research-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Exact-head crawler validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Run deterministic crawler verification
        run: python scripts/check_ai_webcrawler.py
      - name: Run provenance idempotency regression
        run: python -m pytest -q --noconftest tests/test_retrieval_provenance_idempotency.py tests/test_retrieval_provenance_checkpoint.py
