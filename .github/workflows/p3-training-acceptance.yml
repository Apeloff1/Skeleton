name: P3 Native Training Acceptance

on:
  pull_request:
    paths:
      - "machine/ai_p3_training_execution_map.json"
      - "machine/ai_p3_training_task_backlog.json"
      - "skeleton/ai/runtime/training/**"
      - "skeleton/testing/test_p3_training_data.py"
      - "skeleton/testing/test_p3_training_control.py"
      - "skeleton/testing/test_p3_local_training_evaluation.py"
      - "skeleton/testing/test_p3_post_training.py"
      - "tests/test_p3_training_execution_map.py"
      - "tests/test_p3_training_acceptance.py"
      - "scripts/check_p3_training_execution_map.py"
      - ".github/workflows/p3-training-acceptance.yml"
  push:
    branches:
      - main
      - feat/p3-t2-training-plane-atomic
    paths:
      - "machine/ai_p3_training_execution_map.json"
      - "machine/ai_p3_training_task_backlog.json"
      - "skeleton/ai/runtime/training/**"
      - "tests/test_p3_training_acceptance.py"
      - "scripts/check_p3_training_execution_map.py"
      - ".github/workflows/p3-training-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-training-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  training-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pytest-asyncio>=0.24,<1"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.136.1"
      - name: Validate P3-T2 authority
        run: python scripts/check_p3_training_execution_map.py --json
      - name: Execute complete provider-independent training path
        run: >-
          python -m pytest -q
          tests/test_p3_training_execution_map.py
          skeleton/testing/test_p3_training_data.py
          skeleton/testing/test_p3_training_control.py
          skeleton/testing/test_p3_local_training_evaluation.py
          skeleton/testing/test_p3_post_training.py
          tests/test_p3_training_acceptance.py
