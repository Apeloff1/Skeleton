name: P1 Learning Evaluation Gap Evidence Batch 3 Gate

on:
  pull_request:
    branches:
      - main
      - p1/reference-provenance-topology-evidence-20260930
      - p1/learning-eval-gap-batch3-current-main-20260930
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "machine/p1_experiment_registry.json"
      - "machine/p1_benchmark_registry.json"
      - "machine/p1_champion_registry.json"
      - "machine/p1_regression_corpus.json"
      - "machine/p1_failure_knowledge.json"
      - "skeleton/eval/experiment_registry.py"
      - "skeleton/eval/benchmark_registry.py"
      - "skeleton/eval/champion_registry.py"
      - "skeleton/eval/shadow_traffic.py"
      - "skeleton/eval/regression_corpus.py"
      - "skeleton/eval/failure_knowledge.py"
      - "scripts/check_p1_experiment_registry.py"
      - "scripts/check_p1_benchmark_registry.py"
      - "scripts/check_p1_champion_registry.py"
      - "scripts/check_p1_regression_corpus.py"
      - "scripts/check_p1_failure_knowledge.py"
      - "scripts/build_p1_learning_eval_gap_evidence.py"
      - "skeleton/testing/test_experiment_registry.py"
      - "skeleton/testing/test_benchmark_registry.py"
      - "skeleton/testing/test_champion_registry.py"
      - "skeleton/testing/test_shadow_traffic.py"
      - "skeleton/testing/test_regression_corpus.py"
      - "skeleton/testing/test_failure_knowledge.py"
      - "tests/test_p1_experiment_registry.py"
      - "tests/test_p1_benchmark_registry.py"
      - "tests/test_p1_champion_registry.py"
      - "tests/test_p1_regression_corpus.py"
      - "tests/test_p1_failure_knowledge.py"
      - "tests/test_p1_learning_eval_gap_evidence.py"
      - "tests/test_p1_learning_eval_gap_bindings_batch3.py"
      - ".github/workflows/p1-experiment-registry.yml"
      - ".github/workflows/p1-benchmark-registry.yml"
      - ".github/workflows/p1-champion-registry.yml"
      - ".github/workflows/p1-shadow-traffic-isolation.yml"
      - ".github/workflows/p1-regression-corpus.yml"
      - ".github/workflows/p1-failure-knowledge.yml"
      - ".github/workflows/p1-learning-eval-gap-evidence-batch3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-learning-eval-gap-batch3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify P1 learning evaluation gap evidence batch 3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused verifier runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Validate canonical P1 and learning registry inputs
        run: |
          set -euo pipefail
          python scripts/check_ai_master_plan.py
          python scripts/check_ai_p1_execution_map.py --print-summary
          python scripts/check_p1_experiment_registry.py
          python scripts/check_p1_benchmark_registry.py
          python scripts/check_p1_champion_registry.py
          python scripts/check_p1_regression_corpus.py
          python scripts/check_p1_failure_knowledge.py

      - name: Run focused learning evaluation regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_experiment_registry.py
          tests/test_p1_experiment_registry.py
          skeleton/testing/test_benchmark_registry.py
          tests/test_p1_benchmark_registry.py
          skeleton/testing/test_champion_registry.py
          tests/test_p1_champion_registry.py
          skeleton/testing/test_shadow_traffic.py
          skeleton/testing/test_regression_corpus.py
          tests/test_p1_regression_corpus.py
          skeleton/testing/test_failure_knowledge.py
          tests/test_p1_failure_knowledge.py
          tests/test_p1_learning_eval_gap_evidence.py
          tests/test_p1_learning_eval_gap_bindings_batch3.py

      - name: Validate exact-head batch 3 binding state
        run: |
          set -euo pipefail
          mkdir -p .p1-learning-eval-gap
          python scripts/build_p1_learning_eval_gap_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-learning-eval-gap/report.json \
            --print-summary \
            --print-candidates

      - name: Prove deterministic replay and authority boundaries
        run: |
          set -euo pipefail
          python scripts/build_p1_learning_eval_gap_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-learning-eval-gap/replay.json
          cmp .p1-learning-eval-gap/report.json .p1-learning-eval-gap/replay.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".p1-learning-eval-gap/report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("batch 3 report does not bind exact PR head")
          if report["covered_gap_count"] != 12:
              raise SystemExit("batch 3 must cover exactly 12 canonical gaps")
          if report["covered_volume_count"] != 6:
              raise SystemExit("batch 3 must cover exactly 6 canonical volumes")
          if report["already_bound_count"] != 12:
              raise SystemExit("batch 3 must have exactly 12 governed bindings")
          if report["candidate_binding_count"] != 0:
              raise SystemExit("batch 3 must have zero unbound candidates")
          for field in (
              "non_authoritative",
              "creates_bindings",
              "clears_masterplan_gaps",
              "signs_accountability",
              "promotes_maturity",
          ):
              expected = field == "non_authoritative"
              if report[field] is not expected:
                  raise SystemExit(f"authority-boundary drift: {field}")
          for row in report["records"]:
              if not row["binding_present"]:
                  raise SystemExit(
                      "batch 3 governed binding is missing: "
                      + row["obligation_id"]
                  )
              ref = row["candidate_evidence_ref"]
              if ref["digest"] != row["packet_digest"]:
                  raise SystemExit("batch 3 candidate digest drift")
              if ref["category"] != "learning_eval_gap_closure":
                  raise SystemExit("batch 3 category drift")
              if not ref["source"].endswith(":" + os.environ["EXPECTED_SHA"]):
                  raise SystemExit("batch 3 evidence is not exact-head bound")
          print("P1 learning/eval batch 3 OK:", report["report_digest"])
          PY

      - name: Reconcile governed EVID-04 registry remains unchanged
        run: |
          set -euo pipefail
          EVALUATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/reconcile_p1_risk_evidence.py \
            --evaluated-at "$EVALUATED_AT" \
            --out .p1-learning-eval-gap/risk-report.json \
            --print-summary
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-learning-eval-gap/risk-report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["binding_count"] != 34:
              raise SystemExit("batch 3 verifier mutated governed binding count")
          if report["resolved_count"] != 34:
              raise SystemExit("batch 3 verifier mutated governed resolution count")
          if report["unresolved_blocking_count"] != 479:
              raise SystemExit("batch 3 verifier mutated blocking obligation count")
          if report["unclassified_count"] != 281:
              raise SystemExit("batch 3 verifier mutated risk classification count")
          if report["disposition_counts"] != {
              "evidence": 34,
              "unbound": 479,
          }:
              raise SystemExit("batch 3 verifier mutated disposition counts")
          print("Governed EVID-04 registry unchanged during batch 3 verification.")
          PY
