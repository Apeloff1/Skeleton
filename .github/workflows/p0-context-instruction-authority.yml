name: P0 Context Instruction Authority

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/shells/ai/context_provenance.py"
      - "skeleton/ai/shell/context_provenance.py"
      - "skeleton/shells/ai/context_policy.py"
      - "skeleton/ai/shell/context_policy.py"
      - "skeleton/testing/test_shell_ai_context_planner.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-context-instruction-authority.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/shells/ai/context_provenance.py"
      - "skeleton/ai/shell/context_provenance.py"
      - "skeleton/shells/ai/context_policy.py"
      - "skeleton/ai/shell/context_policy.py"
      - "skeleton/testing/test_shell_ai_context_planner.py"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_edge_case_priority_queue.json"
      - ".github/workflows/p0-context-instruction-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-context-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  context-instruction-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install project test runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify context mirrors
        run: |
          cmp skeleton/shells/ai/context_provenance.py skeleton/ai/shell/context_provenance.py
          cmp skeleton/shells/ai/context_policy.py skeleton/ai/shell/context_policy.py
      - name: Run context authority regressions
        run: python -m pytest -q skeleton/testing/test_shell_ai_context_planner.py
