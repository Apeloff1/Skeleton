name: Idle CI Watchdog

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: idle-ci-watchdog
  cancel-in-progress: false

permissions: {}

jobs:
  watchdog:
    name: Recover transient CI failures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_TITLE: 'bot: CI watchdog'
    steps:
      - name: Inspect recent workflow failures
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$REPO" --limit 100 --json databaseId,name,status,conclusion,createdAt,url > "$RUNNER_TEMP/runs.json"

      - name: Retry only safe transient runs once
        shell: bash
        run: |
          set -euo pipefail
          issue=$(
            gh issue list --repo "$REPO" --state all --search "${ISSUE_TITLE} in:title" --limit 100 --json number,title |
              jq -r --arg title "$ISSUE_TITLE" '.[] | select(.title == $title) | .number' |
              head -n 1
          )
          if [[ -z "$issue" ]]; then
            issue=$(gh api --method POST "repos/${REPO}/issues" \
              -f title="$ISSUE_TITLE" \
              -f body='Automated CI watchdog ledger. The bot only retries cancelled/timed-out non-security workflows once per run ID and never bypasses a failed security gate.' \
              --jq '.number')
          fi
          if [[ ! "$issue" =~ ^[0-9]+$ ]]; then
            echo 'CI watchdog could not resolve a valid ledger issue number.' >&2
            exit 1
          fi
          gh api --method PATCH "repos/${REPO}/issues/${issue}" -f state=closed >/dev/null

          cutoff=$(date -u -d '6 hours ago' +%s)
          retries=0
          inspected=0

          while IFS= read -r run; do
            [[ -n "${run:-}" ]] || continue
            id=$(jq -r '.databaseId // empty' <<<"$run")
            name=$(jq -r '.name // empty' <<<"$run")
            status=$(jq -r '.status // empty' <<<"$run")
            conclusion=$(jq -r '.conclusion // "none"' <<<"$run")
            created=$(jq -r '.createdAt // empty' <<<"$run")
            url=$(jq -r '.url // empty' <<<"$run")
            [[ -n "$id" && -n "$created" ]] || continue
            inspected=$((inspected + 1))
            created_epoch=$(date -u -d "$created" +%s)
            (( created_epoch >= cutoff )) || continue
            [[ "$status" == 'completed' ]] || continue
            [[ "$conclusion" == 'cancelled' || "$conclusion" == 'timed_out' ]] || continue

            case "$name" in
              *Malware*|*Secret*|*Security*|*CodeQL*|*Provenance*|*Artifact\ Policy*|*Dependency\ Review*)
                continue
                ;;
            esac

            if gh issue view "$issue" --repo "$REPO" --comments --json comments --jq '.comments[].body' | grep -Fq "run:${id}"; then
              continue
            fi

            run_attempt=$(gh api "repos/${REPO}/actions/runs/${id}" --jq '.run_attempt')
            if [[ ! "$run_attempt" =~ ^[0-9]+$ ]] || (( run_attempt < 1 )); then
              echo "CI watchdog could not resolve a valid run_attempt for run ${id}." >&2
              exit 1
            fi
            if (( run_attempt > 1 )); then
              continue
            fi

            if (( retries >= 3 )); then
              break
            fi

            if gh run rerun "$id" --repo "$REPO"; then
              retries=$((retries + 1))
              if ! gh issue comment "$issue" --repo "$REPO" --body "CI watchdog retrying transient ${conclusion} run:${id} (${name}): ${url}" >/dev/null; then
                echo "::warning::Watchdog reran run ${id} but could not record the ledger comment."
              fi
            else
              gh issue comment "$issue" --repo "$REPO" --body "CI watchdog could not rerun candidate:${id}; leaving it eligible for a later watchdog pass." >/dev/null || true
            fi
          done < <(jq -c '.[]' "$RUNNER_TEMP/runs.json")

          {
            echo '## Idle CI watchdog'
            echo "- Recent runs inspected: ${inspected}"
            echo "- Transient retries started: ${retries}"
            echo '- Security, provenance, artifact and dependency-security workflows are never auto-retried.'
            echo '- GitHub run_attempt is authoritative for once-per-run retry enforcement.'
            echo '- Failed runs are not hidden or bypassed; persistent failures remain visible for repair.'
          } >> "$GITHUB_STEP_SUMMARY"
