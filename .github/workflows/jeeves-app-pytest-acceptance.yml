name: Jeeves App Pytest Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/**"
      - "skeleton/**"
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/jeeves-app-pytest-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jeeves-app-pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-evidence:
    name: Selected source-bound pytest regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONPATH: "."
      PYTHONUTF8: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skeleton/
            backend/
            frontend/
            machine/
            tests/
            scripts/
            pyproject.toml
            .github/workflows/jeeves-app-pytest-acceptance.yml
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Refuse stale CI source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install actual project runtime and pinned pytest dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -e . "pytest==8.4.2" "PyYAML>=6,<7" "httpx>=0.27,<1"
      - name: Compile source-pinned runner and adversarial assertions
        shell: bash
        run: |
          python -m py_compile \
            skeleton/ai/game_builder/jeeves_acceptance_matrix.py \
            skeleton/ai/game_builder/jeeves_acceptance_rollup.py \
            tests/test_game_builder_jeeves_acceptance_rollup.py \
            scripts/run_app_pytest_acceptance.py \
            scripts/verify_app_acceptance_ci.py \
            skeleton/ai/game_builder/jeeves_pytest_acceptance_verifier.py \
            tests/test_run_app_pytest_acceptance.py \
            tests/test_game_builder_jeeves_pytest_acceptance_verifier.py
      - name: Validate pytest custody and zero-test fail-closed behavior
        shell: bash
        run: |
          python -m unittest \
            tests.test_run_app_pytest_acceptance \
            tests.test_game_builder_jeeves_pytest_acceptance_verifier \
            tests.test_game_builder_jeeves_acceptance_rollup -v
      - name: Execute actual reviewed pytest family regressions
        shell: bash
        run: |
          python scripts/run_app_pytest_acceptance.py \
            --output build/app_pytest_acceptance_run_evidence.json
      - name: Upload bounded pytest evidence (not release authority)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-pytest-candidates-${{ matrix.os }}-${{ github.run_id }}
          path: build/app_pytest_acceptance_run_evidence.json
          if-no-files-found: warn
          retention-days: 7
