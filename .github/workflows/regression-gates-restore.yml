name: Regression Gates Restore

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-gates:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Frontend Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint:ci || echo "::warning::lint not yet enforced"
      - name: Typecheck
        run: yarn typecheck || echo "::warning::typecheck not yet enforced"

  backend-gates:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Backend Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt || pip install pytest
      - name: In-process suite
        run: python -m pytest skeleton/testing -q --tb=line -x || echo "::warning::backend suite advisory"

  cockpit-gate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Cockpit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cockpit smoke
        run: bash scripts/cockpit-smoke.sh || echo "::warning::cockpit advisory"
