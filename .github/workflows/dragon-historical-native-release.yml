name: Dragon Historical Native Executable Release

on:
  pull_request:
    paths:
      - 'skeleton/ai/webcrawler/dragon_retro_binary_release.py'
      - 'skeleton/ai/webcrawler/dragon_native_legacy_expansion.py'
      - 'tests/test_ai_webcrawler_dragon_retro_binary_release.py'
      - '.github/workflows/dragon-historical-native-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-historical-binary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-6507-6502-win32-native-compilation:
    name: Three real retro cross-compiled game binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original target assemblers and 32-bit compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dasm cc65 gcc-mingw-w64-i686 make
          python -m pip install --disable-pip-version-check pytest
          command -v dasm
          command -v cl65
          command -v i686-w64-mingw32-gcc
          command -v make
      - name: Verify native binary magic and reject spoofing/traversal
        run: |
          python -m pytest -q tests/test_ai_webcrawler_dragon_retro_binary_release.py
      - name: Independently build all three source-bound binary releases
        run: |
          python -m skeleton.ai.webcrawler.dragon_retro_binary_release \
            --out _dragon_evidence/historical-build --seed 2600
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          from skeleton.ai.webcrawler.dragon_retro_binary_release import identify_binary
          root=Path('_dragon_evidence/historical-build')
          envelope=json.loads((root/'dragon-original-hardware-compiled.json').read_text())
          assert len(envelope['records'])==3
          for row in envelope['records']:
              image=(root/row['target']/row['artifact_name']).read_bytes()
              assert identify_binary(row['target'],image)==row['binary_format']
              assert sha256(image).hexdigest()==row['artifact_sha256']
              print('DRAGON_ACTUAL_NATIVE_COMPILE_PASS',row['target'],row['artifact_bytes'])
          assert not envelope['gameplay_playtested']
          assert not envelope['release_approved']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dragon-real-atari2600-apple2-win95-binaries
          path: |
            _dragon_evidence/historical-build/dragon-original-hardware-compiled.zip
            _dragon_evidence/historical-build/dragon-original-hardware-compiled.json
          if-no-files-found: error
          retention-days: 14
