name: AI Learning Promotion Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/ai/learning/promotion.py"
      - "skeleton/learning/promotion.py"
      - "skeleton/testing/test_feedback_promotion.py"
      - "tests/test_ai_learning_promotion_integrity.py"
      - ".github/workflows/ai-learning-promotion-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/ai/learning/promotion.py"
      - "skeleton/learning/promotion.py"
      - "skeleton/testing/test_feedback_promotion.py"
      - "tests/test_ai_learning_promotion_integrity.py"
      - ".github/workflows/ai-learning-promotion-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-learning-promotion-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused validation runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          "pytest>=8,<9"

      - name: Compile promotion surfaces
        run: >-
          python -m py_compile
          skeleton/ai/learning/promotion.py
          skeleton/learning/promotion.py
          skeleton/testing/test_feedback_promotion.py
          tests/test_ai_learning_promotion_integrity.py

      - name: Verify namespace parity and exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          from pathlib import Path
          canonical = Path("skeleton/ai/learning/promotion.py").read_bytes()
          compatibility = Path("skeleton/learning/promotion.py").read_bytes()
          assert canonical == compatibility, "promotion namespaces drifted"
          print("promotion namespace parity", len(canonical), "bytes")
          PY

      - name: Run promotion integrity regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_feedback_promotion.py
          tests/test_ai_learning_promotion_integrity.py
