name: P1 Batching Autoscaling Gate

on:
  push:
    branches:
      - main
    paths:
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/mesh/batching_autoscaling.py"
      - "skeleton/ai/runtime/distributed/mesh/batching_autoscaling.py"
      - "skeleton/network/model_placement.py"
      - "skeleton/shells/worker_scaling.py"
      - "skeleton/shells/worker_sla.py"
      - "skeleton/mesh/throughput_controller.py"
      - "skeleton/testing/test_continuous_batching.py"
      - "skeleton/testing/test_inference_autoscaling.py"
      - ".github/workflows/p1-batching-autoscaling.yml"
  pull_request:
    branches:
      - main
      - p1/release-lane-materialize-20260928
      - p1/dist-02-model-placement-warming-20260928
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_p1_task_backlog.json"
      - "skeleton/mesh/batching_autoscaling.py"
      - "skeleton/ai/runtime/distributed/mesh/batching_autoscaling.py"
      - "skeleton/network/model_placement.py"
      - "skeleton/shells/worker_scaling.py"
      - "skeleton/shells/worker_sla.py"
      - "skeleton/mesh/throughput_controller.py"
      - "skeleton/testing/test_continuous_batching.py"
      - "skeleton/testing/test_inference_autoscaling.py"
      - ".github/workflows/p1-batching-autoscaling.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-batching-autoscaling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate batching and autoscaling
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      RUN_IDENTITY: "${{ github.run_id }}"
      RUN_ATTEMPT: "${{ github.run_attempt }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Compile DIST-03 contracts
        run: >-
          python -m compileall -q
          skeleton/mesh/batching_autoscaling.py
          skeleton/ai/runtime/distributed/mesh/batching_autoscaling.py

      - name: Run batching and autoscaling regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_continuous_batching.py
          skeleton/testing/test_inference_autoscaling.py
          skeleton/testing/test_model_placement.py
          skeleton/testing/test_remote_execution_protocol.py
          skeleton/testing/test_worker_state_scaling_topology.py
          skeleton/testing/test_worker_ownership_sla_drain.py
          skeleton/testing/test_worker_capacity_admission_balancer.py
          skeleton/testing/test_throughput_obs_correlation_context.py

      - name: Validate canonical AI file tree parity
        run: python scripts/check_ai_file_tree.py

      - name: Build accepted DIST-03 decisions
        run: |
          set -euo pipefail
          mkdir -p .p1-dist-03
          python - <<'PY'
          import json
          from pathlib import Path

          from skeleton.contracts.canonical import EvidenceRef
          from skeleton.mesh.batching_autoscaling import (
              ContinuousBatchItem,
              ContinuousBatchPolicy,
              DispatchDisposition,
              ServiceObjectiveObservation,
              ServiceObjectivePolicy,
              plan_continuous_batch,
              qualify_autoscaling,
          )
          from skeleton.network.model_placement import (
              ModelPlacementDecision,
              ModelPlacementRequest,
          )
          from skeleton.shells.worker_identity import WorkerRole

          placement_request = ModelPlacementRequest(
              placement_id="ci-placement",
              model_id="ci-model",
              model_version="v1",
              model_digest="a" * 64,
              runtime_digest="b" * 64,
              tenant_id="ci-tenant",
              data_class="internal",
              allowed_data_boundaries=("eu",),
              required_role=WorkerRole.EXECUTOR,
              required_features=("model-host",),
              required_labels=(("accelerator", "cpu"),),
              topology_label_key="zone",
              min_topology_domains=1,
              max_topology_skew=1,
              demand_inflight=1,
              demand_weight=1,
              max_worker_inflight=4,
          )
          placement = ModelPlacementDecision(
              accepted=True,
              reasons=(),
              request_digest=placement_request.request_digest,
              selected_worker_id="ci-worker",
              selected_worker_generation=1,
              selected_worker_identity_digest="c" * 64,
              warm_authorization_digest="d" * 64,
              warm_observation_digest="e" * 64,
              reservation_digest="f" * 64,
              candidate_worker_ids=("ci-worker",),
              rejected=(),
              topology_digest="1" * 64,
              capacity_digest="2" * 64,
          )
          batch_policy = ContinuousBatchPolicy(
              policy_id="ci-interactive",
              max_batch_size=2,
              max_wait_s=5.0,
              max_batch_runtime_s=20.0,
              per_extra_item_overhead_s=0.5,
          )
          items = (
              ContinuousBatchItem(
                  item_id="ci-item-1",
                  tenant_id=placement_request.tenant_id,
                  placement_request_digest=placement_request.request_digest,
                  placement_decision_digest=placement.decision_digest,
                  model_digest=placement_request.model_digest,
                  input_digest="3" * 64,
                  quality_policy_digest="4" * 64,
                  enqueued_at=90.0,
                  deadline_at=130.0,
                  estimated_runtime_s=5.0,
              ),
              ContinuousBatchItem(
                  item_id="ci-item-2",
                  tenant_id=placement_request.tenant_id,
                  placement_request_digest=placement_request.request_digest,
                  placement_decision_digest=placement.decision_digest,
                  model_digest=placement_request.model_digest,
                  input_digest="5" * 64,
                  quality_policy_digest="4" * 64,
                  enqueued_at=91.0,
                  deadline_at=125.0,
                  estimated_runtime_s=6.0,
              ),
          )
          batch = plan_continuous_batch(
              items=items,
              placement_request=placement_request,
              placement_decision=placement,
              policy=batch_policy,
              observed_at=100.0,
          )
          if (
              not batch.accepted
              or batch.disposition is not DispatchDisposition.READY
          ):
              raise SystemExit(
                  f"DIST-03 batch rejected: {batch.reasons} "
                  f"{batch.disposition.value}"
              )

          slo_policy = ServiceObjectivePolicy(
              policy_id="ci-slo",
              target_p99_latency_ms=250.0,
              max_cancellation_rate=0.02,
              max_error_rate=0.01,
              min_quality_score=0.90,
              observation_max_age_s=30.0,
              target_queue_per_worker=10.0,
              scale_out_queue_per_worker=25.0,
              scale_in_queue_per_worker=2.0,
              min_workers=2,
              max_workers=20,
              max_scale_step=4,
          )
          observation = ServiceObjectiveObservation(
              window_id="ci-window",
              placement_decision_digest=placement.decision_digest,
              sample_count=1000,
              healthy_workers=4,
              queued=120,
              p50_latency_ms=80.0,
              p95_latency_ms=150.0,
              p99_latency_ms=200.0,
              cancellation_rate=0.01,
              error_rate=0.005,
              quality_score=0.95,
              observed_at=190.0,
              evidence_refs=(
                  EvidenceRef(
                      source="ci://dist-03-service-objectives",
                      digest="6" * 64,
                      category="service_objective",
                  ),
              ),
              verifier_id="github-actions:dist-03-slo",
              verifier_digest="7" * 64,
          )
          scaling = qualify_autoscaling(
              placement_decision=placement,
              observation=observation,
              policy=slo_policy,
              observed_at=200.0,
          )
          if not scaling.accepted:
              raise SystemExit(
                  f"DIST-03 scaling rejected: {scaling.reasons}"
              )

          refs = (
              batch.accepted_evidence_ref(),
              scaling.accepted_evidence_ref(),
          )
          Path(".p1-dist-03/refs.json").write_text(
              json.dumps(
                  [
                      {
                          "source": item.source,
                          "digest": item.digest,
                          "category": item.category,
                      }
                      for item in refs
                  ],
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          Path(".p1-dist-03/batch.json").write_text(
              json.dumps(batch.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path(".p1-dist-03/scaling.json").write_text(
              json.dumps(scaling.payload(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head DIST-03 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def digest(paths):
              h = hashlib.sha256()
              for name in paths:
                  h.update(name.encode())
                  h.update(b"\0")
                  h.update(Path(name).read_bytes())
                  h.update(b"\0")
              return h.hexdigest()

          Path(".p1-dist-03/config.digest").write_text(
              hashlib.sha256(
                  b"p1-dist-03-batching-autoscaling-v1"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-dist-03/environment.digest").write_text(
              hashlib.sha256(
                  b"ubuntu-24.04|python-3.11.16|dist-03"
              ).hexdigest(),
              encoding="utf-8",
          )
          Path(".p1-dist-03/verifier.digest").write_text(
              digest([
                  "skeleton/mesh/batching_autoscaling.py",
                  "skeleton/network/model_placement.py",
                  "skeleton/shells/worker_scaling.py",
                  "skeleton/shells/worker_sla.py",
                  "skeleton/mesh/throughput_controller.py",
                  ".github/workflows/p1-batching-autoscaling.yml",
              ]),
              encoding="utf-8",
          )
          Path(".p1-dist-03/tests.digest").write_text(
              digest([
                  "skeleton/testing/test_continuous_batching.py",
                  "skeleton/testing/test_inference_autoscaling.py",
                  "skeleton/testing/test_model_placement.py",
                  "skeleton/testing/test_remote_execution_protocol.py",
                  "skeleton/testing/test_worker_state_scaling_topology.py",
                  "skeleton/testing/test_worker_ownership_sla_drain.py",
                  "skeleton/testing/test_worker_capacity_admission_balancer.py",
                  "skeleton/testing/test_throughput_obs_correlation_context.py",
              ]),
              encoding="utf-8",
          )
          PY

          python scripts/emit_p1_promotion_evidence.py \
            --repository Apeloff1/Skeleton \
            --commit-sha "$EXPECTED_SHA" \
            --expected-head "$EXPECTED_SHA" \
            --task-id P1-DIST-03 \
            --accountability-id ACC-P1-DIST-03 \
            --configuration-digest "$(cat .p1-dist-03/config.digest)" \
            --environment-digest "$(cat .p1-dist-03/environment.digest)" \
            --verifier-id github-actions:p1-batching-autoscaling \
            --verifier-digest "$(cat .p1-dist-03/verifier.digest)" \
            --test-manifest-digest "$(cat .p1-dist-03/tests.digest)" \
            --run-id "$RUN_IDENTITY" \
            --run-attempt "$RUN_ATTEMPT" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --evidence-file .p1-dist-03/refs.json \
            --out .p1-dist-03/receipt.json \
            > .p1-dist-03/stdout.json

      - name: Assert exact-head DIST-03 receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".p1-dist-03/receipt.json").read_text(encoding="utf-8")
          )
          if receipt["commit_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("DIST-03 receipt head mismatch")
          if receipt["task_id"] != "P1-DIST-03":
              raise SystemExit("DIST-03 task identity mismatch")
          if receipt["accountability_id"] != "ACC-P1-DIST-03":
              raise SystemExit("DIST-03 accountability identity mismatch")
          for field in ("subject_digest", "evidence_digest", "receipt_digest"):
              if len(receipt.get(field, "")) != 64:
                  raise SystemExit(f"invalid {field}")
          print("DIST-03 exact-head receipt OK", receipt["receipt_digest"])
          PY
