name: Mainline Failure Regression Qualification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/mainline-failure-regression-qualification.yml'
      - 'skeleton/perf_profiler/**'
      - 'tests/perf_profiler/**'
      - 'skeleton/testing/test_delivery_packaging.py'
      - 'skeleton/testing/test_harbor_crafting_journal_transfer.py'
      - 'skeleton/testing/test_app_offline_archive_schema_parity.py'
      - 'skeleton/testing/test_ecs_ai.py'
      - 'skeleton/testing/test_ai_native_endurance.py'
      - 'skeleton/testing/test_jeeves_native_batch.py'
      - 'backend/tests/test_galaxy_file_budget.py'
      - 'backend/tests/test_storage_lazy_registry.py'

permissions:
  contents: read

concurrency:
  group: mainline-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  profiler_safety:
    name: Exact-head frame and clock safety
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.16'
      - name: Install focused runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.4.2'
      - name: Compile and execute complete profiler regressions
        run: |
          python -m compileall -q skeleton/perf_profiler tests/perf_profiler
          python -m pytest -q --noconftest tests/perf_profiler
          python scripts/check_repository_dynamic_import_safety.py

  historical_reds:
    name: Exact-head mainline domain and backend failure replay
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.16'
      - name: Install canonical domain runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          -r backend/requirements.txt
          'PyYAML>=6,<7' 'pytest>=8,<9' 'pytest-asyncio>=0.24,<2'
          'httpx>=0.28.1,<1' 'motor==3.7.1' 'pymongo==4.19.0'
          'fastapi>=0.142.2,<1' 'pydantic>=2.14.1,<3'
          'pydantic-settings>=2.15.0,<3' 'cryptography>=50.0.2'
          'numpy>=2,<3' 'Pillow>=13.0.0,<14' 'regex>=2026.9.29,<2027'
      - name: Replay seven historical domain failures
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: '.:backend'
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin --maxfail=7
          skeleton/testing/test_harbor_crafting_patrol_guidance.py::test_cli_hints_are_user_reachable
          skeleton/testing/test_ai_native_endurance.py::EnduranceTests::test_empty_output_refused
          skeleton/testing/test_ecs_ai.py::test_utility_curves_and_choice
          skeleton/testing/test_jeeves_native_batch.py::TestNativeBatchWithRealSqlite::test_cli_real_path_commits_synthetic_source_only_batch
          skeleton/testing/test_delivery_packaging.py::test_package_builders_bound_malicious_mapping_iteration
          skeleton/testing/test_harbor_crafting_journal_transfer.py::test_unrelated_world_is_rejected_before_play
          skeleton/testing/test_app_offline_archive_schema_parity.py::test_resealed_source_archive_cannot_bypass_studio_custody
      - name: Replay three historical backend failures
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: '.:backend'
        run: >-
          python -m pytest -q --noconftest --import-mode=importlib -p pytest_asyncio.plugin --maxfail=3
          backend/tests/test_galaxy_file_budget.py::test_unavailable_generation_fails_closed_without_stub_or_fallback_files
          backend/tests/test_storage_lazy_registry.py::test_literal_loader_inventory_matches_declared_repository_modules
      - name: Verify canonical AI source tree
        run: python scripts/check_ai_file_tree.py
