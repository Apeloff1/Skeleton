name: Jeeves Local-Only Live Inference Source Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/ai_chat_installed_smoke.py"
      - "scripts/install_ai_chat.py"
      - "scripts/configure_ai_chat_hosted.py"
      - "scripts/configure_ai_chat.py"
      - "scripts/build_jeeves_local_manifest.py"
      - "skeleton/ai/jeeves_local_policy.py"
      - "skeleton/provider_runtime.py"
      - "skeleton/app/setup_runtime.py"
      - "backend/routes/ai.py"
      - "backend/tests/test_ai_chat_local_engine_e2e.py"
      - "docker-compose.yml"
      - "docs/ai/INSTALLED_AI_CHAT_PROTOTYPE.md"
      - "tests/test_ai_chat_installed_smoke.py"
      - "tests/test_install_ai_chat.py"
      - "tests/test_jeeves_local_policy.py"
      - "tests/test_build_jeeves_local_manifest.py"
      - "tests/test_configure_ai_chat_hosted.py"
      - "frontend/**"
      - ".github/workflows/installed-ai-chat-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-ai-chat-prototype-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-only:
    name: Exact-head protected local Jeeves and genuine native inference plumbing (not operator GGUF)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e . "pytest>=8,<9" "pytest-asyncio>=1.4,<2"
      - name: Verify Jeeves primary is a local-only policy
        run: python -c "from skeleton.ai.jeeves_local_policy import MODEL_ID; assert MODEL_ID == 'jeeves'"
      - name: Compile first-install operator entrypoints
        run: python -m compileall -q scripts/ai_chat_installed_smoke.py scripts/configure_ai_chat.py scripts/configure_ai_chat_hosted.py scripts/build_jeeves_local_manifest.py scripts/install_ai_chat.py skeleton/ai/jeeves_local_policy.py backend/routes/ai.py
      - name: Verify local-only chat receipts, guard policy, provisioning and secret-safe legacy refusal
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --noconftest tests/test_ai_chat_installed_smoke.py tests/test_configure_ai_chat_hosted.py tests/test_install_ai_chat.py tests/test_jeeves_local_policy.py tests/test_build_jeeves_local_manifest.py
      - name: Verify authenticated backend-to-engine HTTP chat with durable local fixture
        env:
          PYTHONPATH: ".:backend"
          # Pytest asyncio must be discovered normally: any value of
          # PYTEST_DISABLE_PLUGIN_AUTOLOAD (even "0") disables plugins.
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_ai_chat_local_engine_e2e.py::test_backend_chat_crosses_real_engine_http_boundary_and_commits_local_result_consumer_runtime
          backend/tests/test_ai_chat_local_engine_e2e.py::test_deferred_chat_reconnect_finalizes_from_engine_handoff_without_original_context_consumer_runtime
          backend/tests/test_ai_chat_local_engine_e2e.py::test_jeeves_local_only_rejects_hosted_chat_before_any_storage_write
          backend/tests/test_ai_chat_local_engine_e2e.py::test_jeeves_local_only_never_discloses_foreign_model_inventory
      - name: Execute real offline native transformer generation and SQLite replay
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          tests/test_app_offline_chat_cli.py::HeadlessOfflineChatTests::test_full_local_chat_and_backup_management
          tests/test_ai_offline_native_chat.py::OfflineNativeChatTests::test_create_generate_and_reopen_durable_session
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked frontend toolchain
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Verify Android/iOS URLs and EAS build contracts
        working-directory: frontend
        run: node --test scripts/test-installed-chat-endpoint.cjs
      - name: Typecheck complete frontend
        working-directory: frontend
        run: yarn typecheck
      - name: Clarify source-only evidence
        run: echo "Native tiny-transformer inference is executed; no operator-owned production GGUF, protected bootstrap or physical-device qualification was performed."
