name: Jeeves Local-Only Live Inference Source Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/ai_chat_installed_smoke.py"
      - "scripts/build_jeeves_game.py"
      - "scripts/evaluate_jeeves_game_builder_quality.py"
      - "skeleton/eval/game_builder_quality.py"
      - "skeleton/eval/game_builder_reference_pack.py"
      - "skeleton/ai/evaluation/game_builder_quality.py"
      - "skeleton/ai/evaluation/game_builder_reference_pack.py"
      - "skeleton/forge/game_builder.py"
      - "skeleton/forge/game_design_spec.py"
      - "skeleton/forge/game_content.py"
      - "skeleton/forge/genre_project.py"
      - "skeleton/forge/playable_runtime.py"
      - "skeleton/forge/ai_builder/**"
      - "skeleton/ai/forge/game_builder.py"
      - "skeleton/ai/forge/game_design_spec.py"
      - "skeleton/ai/forge/game_content.py"
      - "skeleton/ai/forge/genre_project.py"
      - "skeleton/ai/forge/playable_runtime.py"
      - "skeleton/ai/forge/ai_builder/**"
      - "tests/forge_ai_builder/**"
      - "tests/test_game_builder_quality.py"
      - "tests/test_game_builder_reference_pack.py"
      - "tests/test_forge_gameplay_design.py"
      - "tests/test_forge_interactive_runtime.py"
      - "tests/test_build_jeeves_game.py"
      - "skeleton/testing/test_game_build_contracts.py"
      - "skeleton/testing/test_game_builder_golden.py"
      - "skeleton/testing/test_game_studio_swarm.py"
      - "scripts/install_ai_chat.py"
      - "scripts/configure_ai_chat_hosted.py"
      - "scripts/configure_ai_chat.py"
      - "scripts/build_jeeves_local_manifest.py"
      - "scripts/qualify_jeeves_live_local.py"
      - "scripts/qualify_jeeves_workspace_browser.py"
      - "scripts/qualify_jeeves_game_builder_browser.py"
      - "skeleton/app/offline_game_builder.py"
      - "tests/test_offline_game_builder.py"
      - "tests/test_offline_game_builder_integration.py"
      - "tests/test_jeeves_conversation_organization.py"
      - "tests/test_app_offline_http.py"
      - "scripts/check_provider_bootstrap.py"
      - "tests/test_docker_materialization_parser.py"
      - "skeleton/app/jeeves_advisory.py"
      - "skeleton/app/jeeves_media_advisory.py"
      - "tests/test_jeeves_media_advisory.py"
      - "skeleton/app/offline_http.py"
      - "skeleton/app/jeeves_local_lease.py"
      - "skeleton/ai/runtime/inference/lease_custody.py"
      - "skeleton/ai/runtime/inference/llama_cpp.py"
      - "skeleton/ai/runtime/inference/deployment.py"
      - "tests/test_jeeves_local_lease.py"
      - "skeleton/ai/model_runtime/offline_chat.py"
      - "tests/test_jeeves_advisory.py"
      - "tests/test_jeeves_live_local_advanced.py"
      - "tests/test_jeeves_context_window.py"
      - "tests/test_jeeves_document_scope.py"
      - "skeleton/app/offline_knowledge.py"
      - "skeleton/app/offline_grounding.py"
      - "skeleton/app/local_ai.py"
      - "skeleton/app/offline_web.py"
      - "tests/test_jeeves_inference_circuit.py"
      - "tests/test_jeeves_durable_integrity.py"
      - "skeleton/app/jeeves_inference_circuit.py"
      - "skeleton/ai/jeeves_local_policy.py"
      - "skeleton/provider_runtime.py"
      - "skeleton/app/setup_runtime.py"
      - "backend/routes/ai.py"
      - "backend/tests/test_ai_chat_local_engine_e2e.py"
      - "docker-compose.yml"
      - "docs/ai/INSTALLED_AI_CHAT_PROTOTYPE.md"
      - "tests/test_ai_chat_installed_smoke.py"
      - "tests/test_install_ai_chat.py"
      - "tests/test_jeeves_local_policy.py"
      - "tests/test_build_jeeves_local_manifest.py"
      - "skeleton/testing/test_local_model_deployment.py"
      - "tests/test_configure_ai_chat_hosted.py"
      - "frontend/**"
      - ".github/workflows/installed-ai-chat-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-ai-chat-prototype-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-only:
    name: Exact-head protected local Jeeves and genuine native inference plumbing (not operator GGUF)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e . "pytest>=8,<9" "pytest-asyncio>=1.4,<2"
      - name: Verify Jeeves primary is a local-only policy
        run: python -c "from skeleton.ai.jeeves_local_policy import MODEL_ID; assert MODEL_ID == 'jeeves'"
      - name: Verify Docker materialization source-boundary parsing
        run: python -m unittest discover -s tests -p 'test_docker_materialization_parser.py' -v
      - name: Compile first-install operator entrypoints
        run: python -m compileall -q scripts/ai_chat_installed_smoke.py scripts/configure_ai_chat.py scripts/configure_ai_chat_hosted.py scripts/build_jeeves_local_manifest.py scripts/install_ai_chat.py scripts/qualify_jeeves_live_local.py scripts/qualify_jeeves_game_builder_browser.py skeleton/app/offline_game_builder.py skeleton/ai/jeeves_local_policy.py skeleton/app/local_ai.py skeleton/app/offline_knowledge.py skeleton/app/offline_grounding.py skeleton/app/jeeves_advisory.py skeleton/app/jeeves_media_advisory.py skeleton/app/jeeves_inference_circuit.py skeleton/app/jeeves_local_lease.py skeleton/ai/runtime/inference/lease_custody.py skeleton/ai/runtime/inference/llama_cpp.py skeleton/ai/runtime/inference/deployment.py skeleton/app/offline_http.py backend/routes/ai.py
      - name: Verify local-only chat receipts, guard policy, provisioning and secret-safe legacy refusal
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --noconftest -p pytest_asyncio.plugin tests/test_ai_chat_installed_smoke.py tests/test_configure_ai_chat_hosted.py tests/test_install_ai_chat.py tests/test_jeeves_local_policy.py tests/test_build_jeeves_local_manifest.py skeleton/testing/test_local_model_deployment.py tests/test_jeeves_advisory.py tests/test_jeeves_media_advisory.py tests/test_jeeves_live_local_advanced.py tests/test_jeeves_context_window.py tests/test_jeeves_document_scope.py tests/test_jeeves_inference_circuit.py tests/test_jeeves_durable_integrity.py tests/test_jeeves_local_lease.py tests/test_jeeves_conversation_organization.py tests/test_app_offline_http.py
      - name: Compile bounded game-builder quality and grounding tools
        run: >-
          python -m compileall -q
          skeleton/eval/game_builder_quality.py
          skeleton/eval/game_builder_reference_pack.py
          scripts/evaluate_jeeves_game_builder_quality.py
          tests/test_game_builder_reference_pack.py
      - name: Verify typed local game design, playable output and bounded operator build contracts
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # These source tests do not qualify an operator GGUF or a native engine.
        # Real Godot execution is retained by game-frontier-native-smoke.yml.
        run: >-
          python -m pytest -q --noconftest
          tests/forge_ai_builder
          tests/test_game_builder_quality.py
          tests/test_game_builder_reference_pack.py
          tests/test_forge_gameplay_design.py
          tests/test_forge_interactive_runtime.py
          tests/test_build_jeeves_game.py
          skeleton/testing/test_game_build_contracts.py
          skeleton/testing/test_game_builder_golden.py
          skeleton/testing/test_game_studio_swarm.py
      - name: Verify authenticated game-build HTTP, recovery and archive plumbing
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # Controlled operation fixtures test auth/state/archive plumbing only.
        # Actual operator GGUF/browser acceptance remains opt-in and separate.
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          tests/test_offline_game_builder.py
          tests/test_offline_game_builder_integration.py
      - name: Verify authenticated backend-to-engine HTTP chat with durable local fixture
        env:
          PYTHONPATH: ".:backend"
          # Pytest asyncio must be discovered normally: any value of
          # PYTEST_DISABLE_PLUGIN_AUTOLOAD (even "0") disables plugins.
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_ai_chat_local_engine_e2e.py::test_backend_chat_crosses_real_engine_http_boundary_and_commits_local_result_consumer_runtime
          backend/tests/test_ai_chat_local_engine_e2e.py::test_deferred_chat_reconnect_finalizes_from_engine_handoff_without_original_context_consumer_runtime
          backend/tests/test_ai_chat_local_engine_e2e.py::test_jeeves_local_only_rejects_hosted_chat_before_any_storage_write
          backend/tests/test_ai_chat_local_engine_e2e.py::test_jeeves_local_only_never_discloses_foreign_model_inventory
      - name: Execute real offline native transformer generation and SQLite replay
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          tests/test_app_offline_chat_cli.py::HeadlessOfflineChatTests::test_full_local_chat_and_backup_management
          tests/test_ai_offline_native_chat.py::OfflineNativeChatTests::test_create_generate_and_reopen_durable_session
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked frontend toolchain
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Verify Android/iOS URLs and EAS build contracts
        working-directory: frontend
        run: node --test scripts/test-installed-chat-endpoint.cjs
      - name: Verify guided game brief composition contract
        working-directory: frontend
        run: node --test scripts/test-game-builder-brief.cjs
      - name: Verify Jeeves game-builder workspace controls
        working-directory: frontend
        run: node --test scripts/test-jeeves-game-builder.cjs
      - name: Typecheck complete frontend
        working-directory: frontend
        run: yarn typecheck
      - name: Clarify source-only evidence
        run: echo "Native tiny-transformer inference is executed; no operator-owned production GGUF, protected bootstrap or physical-device qualification was performed."

  workspace-browser:
    name: Real Jeeves workspace browser, native execution and SQLite recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install browser acceptance dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e '.[local-inference]' 'playwright==1.62.0'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise real desktop and mobile user journeys
        run: python scripts/qualify_jeeves_workspace_browser.py --output '${{ runner.temp }}/jeeves-browser'
      - name: Retain nonsecret browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jeeves-workspace-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/jeeves-browser/
          retention-days: 7
          if-no-files-found: ignore
