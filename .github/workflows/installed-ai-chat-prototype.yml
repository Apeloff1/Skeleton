      - "tests/test_jeeves_inference_circuit.py"
      - "tests/test_jeeves_durable_integrity.py"
      - "skeleton/app/jeeves_inference_circuit.py"
      - "skeleton/ai/jeeves_local_policy.py"
      - "skeleton/provider_runtime.py"
      - "skeleton/app/setup_runtime.py"
      - "backend/routes/ai.py"
      - "backend/tests/test_ai_chat_local_engine_e2e.py"
      - "docker-compose.yml"
      - "docs/ai/INSTALLED_AI_CHAT_PROTOTYPE.md"
      - "tests/test_ai_chat_installed_smoke.py"
      - "tests/test_install_ai_chat.py"
      - "tests/test_jeeves_local_policy.py"
      - "tests/test_build_jeeves_local_manifest.py"
      - "tests/test_configure_ai_chat_hosted.py"
      - "frontend/**"
      - ".github/workflows/installed-ai-chat-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-ai-chat-prototype-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-only:
    name: Exact-head protected local Jeeves and genuine native inference plumbing (not operator GGUF)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e . "pytest>=8,<9" "pytest-asyncio>=1.4,<2"
      - name: Verify Jeeves primary is a local-only policy
        run: python -c "from skeleton.ai.jeeves_local_policy import MODEL_ID; assert MODEL_ID == 'jeeves'"
      - name: Qualify Jeeves local optimization source contracts
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_jeeves_measured_tuning.py
          skeleton/testing/test_jeeves_evidence_packing.py
          skeleton/testing/test_jeeves_reasoning_economics.py
          skeleton/testing/test_jeeves_local_flight_isolation.py
          skeleton/testing/test_jeeves_consumer_controller_bounds.py
          skeleton/testing/test_jeeves_cache_expiry_work.py
          skeleton/testing/test_jeeves_local_speculation.py
          skeleton/testing/test_jeeves_kv_precision_qualification.py
          skeleton/testing/test_jeeves_native_speculation_config.py
          skeleton/testing/test_jeeves_native_speculation_qualification.py
          skeleton/testing/test_jeeves_evidence_rank_fusion.py
          skeleton/testing/test_jeeves_deep_native_optimization.py
          skeleton/testing/test_jeeves_streaming_reference_search.py
          skeleton/testing/test_jeeves_replay_balance.py
          skeleton/testing/test_jeeves_candidate_retention_learning.py
          skeleton/testing/test_jeeves_runtime_efficiency_v.py
          skeleton/testing/test_jeeves_native_adapter_learning.py
          skeleton/testing/test_jeeves_native_precision_calibration.py
          skeleton/testing/test_jeeves_local_advantage_vii.py
          skeleton/testing/test_jeeves_competitive_compute_viii.py
          skeleton/testing/test_jeeves_checkpoint_efficiency_ix.py
          skeleton/testing/test_jeeves_causal_efficiency_x.py
      - name: Verify Docker materialization source-boundary parsing
        run: python -m unittest discover -s tests -p 'test_docker_materialization_parser.py' -v
      - name: Compile first-install operator entrypoints
        run: python -m compileall -q scripts/ai_chat_installed_smoke.py scripts/configure_ai_chat.py scripts/configure_ai_chat_hosted.py scripts/build_jeeves_local_manifest.py scripts/install_ai_chat.py scripts/qualify_jeeves_live_local.py skeleton/ai/jeeves_local_policy.py skeleton/app/local_ai.py skeleton/app/offline_knowledge.py skeleton/app/offline_grounding.py skeleton/app/jeeves_advisory.py skeleton/app/jeeves_media_advisory.py skeleton/app/jeeves_inference_circuit.py skeleton/app/jeeves_local_lease.py skeleton/ai/runtime/inference/lease_custody.py skeleton/ai/runtime/inference/llama_cpp.py skeleton/app/offline_http.py backend/routes/ai.py
      - name: Verify local-only chat receipts, guard policy, provisioning and secret-safe legacy refusal
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --noconftest tests/test_ai_chat_installed_smoke.py tests/test_configure_ai_chat_hosted.py tests/test_install_ai_chat.py tests/test_jeeves_local_policy.py tests/test_build_jeeves_local_manifest.py tests/test_jeeves_advisory.py tests/test_jeeves_media_advisory.py tests/test_jeeves_live_local_advanced.py tests/test_jeeves_context_window.py tests/test_jeeves_document_scope.py tests/test_jeeves_inference_circuit.py tests/test_jeeves_durable_integrity.py tests/test_jeeves_local_lease.py tests/test_jeeves_conversation_organization.py tests/test_app_offline_http.py
      - name: Verify authenticated backend-to-engine HTTP chat with durable local fixture
        env:
          PYTHONPATH: ".:backend"
          # Pytest asyncio must be discovered normally: any value of
          # PYTEST_DISABLE_PLUGIN_AUTOLOAD (even "0") disables plugins.
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_ai_chat_local_engine_e2e.py::test_backend_chat_crosses_real_engine_http_boundary_and_commits_local_result_consumer_runtime
          backend/tests/test_ai_chat_local_engine_e2e.py::test_deferred_chat_reconnect_finalizes_from_engine_handoff_without_original_context_consumer_runtime
          backend/tests/test_ai_chat_local_engine_e2e.py::test_jeeves_local_only_rejects_hosted_chat_before_any_storage_write
          backend/tests/test_ai_chat_local_engine_e2e.py::test_jeeves_local_only_never_discloses_foreign_model_inventory
      - name: Execute real offline native transformer generation and SQLite replay
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          tests/test_app_offline_chat_cli.py::HeadlessOfflineChatTests::test_full_local_chat_and_backup_management
          tests/test_ai_offline_native_chat.py::OfflineNativeChatTests::test_create_generate_and_reopen_durable_session
      - name: Verify competitive GGUF source and cooperative native fixtures
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest -p pytest_asyncio.plugin
          tests/test_consumer_llama_budget.py
          tests/test_gguf_consumer_auto_geometry.py
          tests/test_compare_consumer_gguf.py
          tests/test_kv_competitive_custody.py
          tests/test_consumer_gguf_shard_audit.py
          tests/test_consumer_gguf_quantization.py
          tests/test_select_consumer_gguf.py
          skeleton/testing/test_local_model_deployment.py
          tests/flgb/test_flgb_02_native_runtime.py
          tests/test_resident_gguf_batch.py
          tests/test_guarded_adaptive_reasoning.py
          tests/test_native_context_reconstruction.py
          tests/test_guarded_resident_competitive.py
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked frontend toolchain
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Verify Android/iOS URLs and EAS build contracts
        working-directory: frontend
        run: node --test scripts/test-installed-chat-endpoint.cjs
      - name: Typecheck complete frontend
        working-directory: frontend
        run: yarn typecheck
      - name: Clarify source-only evidence
        run: echo "Native tiny-transformer inference is executed; no operator-owned production GGUF, protected bootstrap or physical-device qualification was performed."

  workspace-browser:
    name: Real Jeeves workspace browser, native execution and SQLite recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install browser acceptance dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e '.[local-inference]' 'playwright==1.62.0'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise real desktop and mobile user journeys
        run: python scripts/qualify_jeeves_workspace_browser.py --output '${{ runner.temp }}/jeeves-browser'
      - name: Retain nonsecret browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jeeves-workspace-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/jeeves-browser/
          retention-days: 7
          if-no-files-found: ignore

  competitive-accelerator-cpu:
    name: Exact-head real Torch CPU tensor migration and batch execution (not GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.16"
      - name: Install canonical dependencies and explicit CPU Torch
        run: |
          python -m pip install --disable-pip-version-check --no-input -e ".[local-inference]" "pytest>=8,<9"
          python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3"
          python -c "import torch; assert hasattr(torch.nn.functional, 'scaled_dot_product_attention')"
      - name: Execute mandatory real CPU tensor regressions
        run: |
          python -m pytest -q --noconftest tests/test_torch_physical_kv_fused_batch.py tests/test_native_paged_attention.py tests/test_native_lora_specialization.py tests/test_native_kernel_qualification.py tests/test_paged_prefill_prefix_reuse.py
          python scripts/check_ai_file_tree.py

  competitive-semantic-cpu:
    name: Exact-head real ONNX contextual token inference, retrieval and source custody
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.16"
      - name: Install explicit optional CPU semantic dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -e ".[local-semantic]" "pytest>=8,<9"
          python -c "import onnx, onnxruntime, tokenizers, numpy; assert 'CPUExecutionProvider' in onnxruntime.get_available_providers()"
      - name: Compile semantic and native execution surfaces
        run: python -m compileall -q skeleton/retrieval/learned_embeddings.py skeleton/retrieval/semantic_long_context.py skeleton/retrieval/semantic_config.py skeleton/retrieval/semantic_vector_cache.py skeleton/retrieval/semantic_eval.py skeleton/ai/model_runtime/context_reconstruction.py skeleton/ai/model_runtime/paged_attention.py skeleton/app/offline_knowledge.py skeleton/app/offline_http.py scripts/benchmark_semantic_context.py
      - name: Execute real local ONNX regressions with generated fixture weights
        run: >-
          python -m pytest -q --noconftest
          tests/test_learned_context_encoder.py
          tests/test_semantic_long_context_ranker.py
          tests/test_semantic_knowledge_integration.py
          tests/test_semantic_spool_integration.py
          tests/test_semantic_evidence_excerpt.py
          tests/test_local_pair_reranker.py
          tests/test_semantic_context_evaluation.py
          tests/test_disk_semantic_ann.py
          tests/test_semantic_ann_integration.py
          tests/test_semantic_provisioning.py
      - name: Verify canonical retrieval mirror
        run: python scripts/check_ai_file_tree.py
      - name: Clarify evidence
        run: echo "Real CPU graph execution with synthetic fixture weights only; no trained external embedding quality, native GPU performance, installed rollout or benchmark superiority is attested."

  competitive-pretrained-semantic-cpu:
    name: Exact-head actual public pretrained BGE CPU inference and disk ANN diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONPATH: "."
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.16"
      - name: Install explicit CPU inference dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e ".[local-semantic]"
      - name: Acquire only fixed public model bytes and execute native CPU admission
        run: |
          root="$(mktemp -d)"
          printf '%s\n' "$root" > "$RUNNER_TEMP/semantic-qualification-root"
          python -m scripts.provision_semantic_models --destination "$root/package" --encoder bge-small-f32 --acquire-reviewed-public-models
      - name: Measure real learned retrieval and local disk shard evidence
        run: |
          root="$(cat "$RUNNER_TEMP/semantic-qualification-root")"
          python -m scripts.qualify_pretrained_semantic --package "$root/package" --output "$RUNNER_TEMP/semantic-diagnostic/report.json"
      - name: Retain measurements only, not model weights
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: semantic-pretrained-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/semantic-diagnostic/
          if-no-files-found: warn
          retention-days: 7
