name: Installed AI Chat Prototype Source Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/ai_chat_installed_smoke.py"
      - "scripts/install_ai_chat.py"
      - "scripts/configure_ai_chat_hosted.py"
      - "tests/test_ai_chat_installed_smoke.py"
      - "tests/test_install_ai_chat.py"
      - "tests/test_configure_ai_chat_hosted.py"
      - "frontend/**"
      - ".github/workflows/installed-ai-chat-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-ai-chat-prototype-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-only:
    name: Exact-head installed chat security and transport contracts (not live inference)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e . "pytest>=8,<9" "pytest-asyncio>=1.4,<2"
      - name: Compile first-install operator entrypoints
        run: python -m compileall -q scripts/ai_chat_installed_smoke.py scripts/configure_ai_chat_hosted.py scripts/install_ai_chat.py
      - name: Verify chat real-receipt, persistence, credential and hosted activation contracts
        env:
          PYTHONPATH: "."
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --noconftest tests/test_ai_chat_installed_smoke.py tests/test_configure_ai_chat_hosted.py tests/test_install_ai_chat.py
      - name: Verify authenticated backend-to-engine HTTP chat with durable local fixture
        env:
          PYTHONPATH: ".:backend"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "0"
        run: >-
          python -m pytest -q --noconftest
          backend/tests/test_ai_chat_local_engine_e2e.py::test_backend_chat_crosses_real_engine_http_boundary_and_commits_local_result_consumer_runtime
          backend/tests/test_ai_chat_local_engine_e2e.py::test_deferred_chat_reconnect_finalizes_from_engine_handoff_without_original_context_consumer_runtime
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked frontend toolchain
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Verify Android/iOS URLs and EAS build contracts
        working-directory: frontend
        run: node --test scripts/test-installed-chat-endpoint.cjs
      - name: Typecheck complete frontend
        working-directory: frontend
        run: yarn typecheck
      - name: Clarify source-only evidence
        run: echo "No actual model inference or physical-device qualification was performed."
