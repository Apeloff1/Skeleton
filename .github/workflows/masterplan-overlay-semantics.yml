name: Masterplan Overlay Semantic Guard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masterplan-overlay-semantics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check --no-input "pytest>=8,<9"
      - run: python -m py_compile scripts/check_masterplan_overlay_semantics.py tests/test_masterplan_overlay_semantics.py
      - run: python scripts/check_masterplan_overlay_semantics.py
      - run: python -m pytest -q --noconftest tests/test_masterplan_overlay_semantics.py
      - name: Exact-head identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
