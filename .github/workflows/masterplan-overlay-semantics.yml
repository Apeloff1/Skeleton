name: Masterplan Overlay Semantic Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/masterplan_overlay_semantic_registry.json"
      - "machine/advanced_ai_*.json"
      - "machine/frontier_96_ai_ladder.json"
      - "machine/cs_300_computer_science_ladder.json"
      - "machine/learning_400_adversarial_400.json"
      - "machine/project_self_improvement_1000.json"
      - "machine/essentials_1000.json"
      - "machine/competitive_ai_engineering_ladder.json"
      - "machine/ai_game_builder_500_levels.json"
      - "scripts/check_masterplan_overlay_semantics.py"
      - "tests/test_masterplan_overlay_semantics.py"
      - ".github/workflows/masterplan-overlay-semantics.yml"
  push:
    branches: [main]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/masterplan_overlay_semantic_registry.json"
      - "machine/advanced_ai_*.json"
      - "machine/frontier_96_ai_ladder.json"
      - "machine/cs_300_computer_science_ladder.json"
      - "machine/learning_400_adversarial_400.json"
      - "machine/project_self_improvement_1000.json"
      - "machine/essentials_1000.json"
      - "machine/competitive_ai_engineering_ladder.json"
      - "machine/ai_game_builder_500_levels.json"
      - "scripts/check_masterplan_overlay_semantics.py"
      - "tests/test_masterplan_overlay_semantics.py"
      - ".github/workflows/masterplan-overlay-semantics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masterplan-overlay-semantics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - run: python -m pip install --disable-pip-version-check --no-input "pytest>=8,<9"
      - run: python -m py_compile scripts/check_masterplan_overlay_semantics.py tests/test_masterplan_overlay_semantics.py
      - run: python scripts/check_masterplan_overlay_semantics.py
      - run: python -m pytest -q --noconftest tests/test_masterplan_overlay_semantics.py
      - name: Exact-head identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
