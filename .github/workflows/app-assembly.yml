      - "backend/core/operation_stream_transport.py"
      - "backend/routes/operation_stream.py"
      - "backend/tests/test_operation_stream_transport.py"
      - "backend/tests/test_operation_stream_route.py"
      - "skeleton/vault/data_governance.py"
      - "skeleton/vault/data_lifecycle.py"
      - "skeleton/vault/governance_registry.py"
      - "skeleton/vault/governance_audit.py"
      - "skeleton/vault/lifecycle_adapters.py"
      - "skeleton/intelligence/admission.py"
      - "skeleton/intelligence/admission_runtime.py"
      - "skeleton/intelligence/shared_pressure.py"
      - "skeleton/intelligence/capacity_planner.py"
      - "skeleton/agents/swarm_load_shed.py"
      - "skeleton/testing/test_shared_pressure.py"
      - "skeleton/intelligence/quota.py"
      - "skeleton/intelligence/quota_sqlite.py"
      - "skeleton/testing/test_admission_runtime.py"
      - "skeleton/testing/test_tenant_quota.py"
      - "skeleton/testing/test_tenant_quota_sqlite.py"
      - "skeleton/testing/test_data_governance.py"
      - "skeleton/testing/test_data_lifecycle.py"
      - "skeleton/testing/test_governance_registry.py"
      - "skeleton/testing/test_governance_audit.py"
      - "skeleton/testing/test_lifecycle_adapters.py"
