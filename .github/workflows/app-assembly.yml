      - "scripts/check_ai_p0_edge_case_matrix.py"
      - "scripts/check_ai_full_edge_case_matrix.py"
      - "scripts/check_ai_master_build_sequence.py"
      - "scripts/check_ai_file_tree.py"
      - "scripts/check_ai_engineering_pass.py"
      - "scripts/check_ai_engineering_task_matrix.py"
      - "scripts/check_ai_adversarial_closure.py"
      - "scripts/check_ai_build_accountability.py"
      - "scripts/ai_accountability.py"
      - "scripts/check_capability_interfaces.py"
      - "scripts/check_state_topology.py"
      - "scripts/state_recovery_drill.py"
      - "scripts/check_provider_bootstrap.py"
      - "machine/manifest.json"
      - "machine/architecture.json"
      - "machine/ai_app_construction.json"
      - "machine/ai_build_queue.json"
      - "machine/ai_master_plan.json"
      - "machine/ai_edge_case_catalog.json"
      - "machine/ai_exotic_systems_catalog.json"
      - "machine/ai_p0_edge_case_matrix.json"
      - "machine/ai_full_edge_case_matrix.json"
      - "machine/ai_master_build_sequence.json"
      - "machine/ai_file_tree.json"
      - "machine/ai_engineering_pass.json"
      - "machine/ai_engineering_task_matrix.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/ai_edge_case_priority_queue.json"
      - "machine/ai_build_accountability.json"
      - "machine/capability_interfaces.json"
      - "machine/state_topology.json"
      - "docs/ARCHITECTURE_MAP.md"
      - "docs/AI_APP_CONSTRUCTION_MANUAL.md"
      - "docs/plan/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/copilot-instructions.md"
      - ".cursor/rules/architecture.mdc"
      - ".github/workflows/app-assembly.yml"
      - ".github/workflows/state-recovery-drill.yml"

permissions:
  contents: read

concurrency:
  group: app-assembly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11.16"
  NODE_VERSION: "24.20.0"

jobs:
  assembly-contract:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Assembly Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify assembly scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          current_base="$(git rev-parse FETCH_HEAD)"
          mapfile -t changed < <(git diff --name-only "$current_base" "$HEAD_SHA")

          full=false
          frontend=false
          for path in "${changed[@]}"; do
            case "$path" in
              frontend/*|skeleton/frontier/operation_stream.py|skeleton/frontier/operation_stream_store.py|backend/core/operation_stream_transport.py|backend/routes/operation_stream.py|.github/workflows/app-assembly.yml)
                frontend=true
                ;;
            esac

            case "$path" in
              docs/plan/*|machine/ai_master_plan.json|machine/ai_edge_case_catalog.json|machine/ai_exotic_systems_catalog.json|machine/ai_p0_edge_case_matrix.json|machine/ai_full_edge_case_matrix.json|machine/ai_master_build_sequence.json|machine/ai_engineering_pass.json|machine/ai_engineering_task_matrix.json|machine/ai_adversarial_closure.json|machine/ai_edge_case_priority_queue.json|machine/ai_build_accountability.json|scripts/check_ai_*.py|scripts/ai_accountability.py|skeleton/testing/test_ai_*.py)
                ;;
              *)
                full=true
                ;;
            esac
          done

          if [ "${#changed[@]}" -eq 0 ]; then
            full=true
            frontend=true
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          printf 'assembly scope: full=%s frontend=%s changed=%s\n' "$full" "$frontend" "${#changed[@]}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Validate architecture contract
        run: python scripts/check_architecture_map.py

      - name: Validate AI construction contract
        run: python scripts/check_ai_app_construction.py

      - name: Validate AI master plan
        run: python scripts/check_ai_master_plan.py

      - name: Validate AI edge/historical catalogue
        run: python scripts/check_ai_edge_case_catalog.py

      - name: Validate AI exotic systems catalogue
        run: python scripts/check_ai_exotic_systems_catalog.py

      - name: Validate P0 edge-case construction matrix
        run: python scripts/check_ai_p0_edge_case_matrix.py

      - name: Validate full edge-case construction matrix
        run: python scripts/check_ai_full_edge_case_matrix.py

      - name: Validate master build sequence
        run: python scripts/check_ai_master_build_sequence.py

      - name: Validate canonical AI file tree
        run: python scripts/check_ai_file_tree.py

      - name: Validate masterplan engineering pass
        run: python scripts/check_ai_engineering_pass.py

      - name: Validate AIQ engineering propagation
        run: python scripts/check_ai_engineering_task_matrix.py

      - name: Validate masterplan adversarial closure
        run: python scripts/check_ai_adversarial_closure.py

      - name: Validate signed build accountability
        run: python scripts/check_ai_build_accountability.py

      - name: Validate capability interface registry
        run: python scripts/check_capability_interfaces.py

      - name: Validate state authority topology
        run: python scripts/check_state_topology.py

      - name: Validate mandatory provider bootstrap
        run: python scripts/check_provider_bootstrap.py

      - name: Install full assembly test runtime
        if: steps.scope.outputs.full == 'true'
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pytest-asyncio>=0.24,<2"
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
          "fastapi==0.141.1"
          "motor==3.7.1"
          "pymongo==4.18.1"
          "python-dotenv==1.2.3"
          "httpx==0.28.1"
          "matplotlib==3.10.6"
          "networkx==3.5"
          "bcrypt==4.3.0"
          "PyJWT==2.14.0"
          "email-validator==2.3.0"

      - name: Install plan-only test runtime
        if: steps.scope.outputs.full != 'true'
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"

      - name: Set up Node
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies without third-party lifecycle scripts
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: yarn install --ignore-scripts

      - name: Apply reviewed local node_modules patches
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: node ./scripts/patch-node-modules.js

      - name: Validate assembled frontend
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
          EXPO_PUBLIC_SKELETON_URL: http://localhost:8010
        run: |
          yarn typecheck
          yarn test:operation-stream
          yarn export:web

      - name: Compile assembly surface
        if: steps.scope.outputs.full == 'true'
        run: >-
          python -m compileall -q
          skeleton/app skeleton/__main__.py skeleton/provider_contract.py
          skeleton/provider_runtime.py skeleton/contracts/operation.py
          skeleton/contracts/conversation.py skeleton/contracts/context.py
          skeleton/context/compiler.py skeleton/context/policy.py skeleton/context/sources
          skeleton/persistence/operation_store.py skeleton/persistence/conversation_repository.py
          skeleton/persistence/operation_runtime.py skeleton/config/settings.py skeleton/api/server.py
          skeleton/frontier/operation_stream.py skeleton/frontier/operation_stream_store.py
          backend/core/operation_stream_transport.py backend/routes/operation_stream.py backend/routes/app_runtime.py
          backend/core/conversations.py backend/routes/conversations.py
          backend/gameforge/jeeves/chat_contract.py backend/routes/jeeves_compose.py
          skeleton/automation/free_model.py
          skeleton/jeeves/providers.py
          skeleton/vault/data_governance.py skeleton/vault/data_lifecycle.py
          skeleton/vault/governance_registry.py skeleton/vault/governance_audit.py skeleton/vault/lifecycle_adapters.py skeleton/intelligence/admission.py
          skeleton/intelligence/admission_runtime.py skeleton/intelligence/quota.py skeleton/intelligence/quota_sqlite.py
          backend/core/ai_provider.py backend/core/provider_architecture.py
          backend/services/ai_assistant_svc.py backend/services/ai_hub_svc.py
          backend/services/rag_state_repository.py backend/services/rag_service.py
          backend/services/game_llm_service.py backend/routes/llm_router.py
          scripts/check_ai_app_construction.py scripts/check_ai_master_plan.py scripts/check_ai_edge_case_catalog.py scripts/check_ai_exotic_systems_catalog.py scripts/check_ai_p0_edge_case_matrix.py scripts/check_ai_full_edge_case_matrix.py scripts/check_ai_engineering_pass.py scripts/check_ai_engineering_task_matrix.py scripts/check_ai_adversarial_closure.py scripts/check_ai_build_accountability.py scripts/ai_accountability.py scripts/state_recovery_drill.py scripts/check_capability_interfaces.py
          scripts/check_state_topology.py scripts/check_provider_bootstrap.py

      - name: Audit repository-wide assembly contracts
        if: steps.scope.outputs.full == 'true'
        run: python scripts/check_app_assembly.py

      - name: Run plan-only contract tests
        if: steps.scope.outputs.full != 'true'
        env:
          PYTHONPATH: "."
        run: >-
          python -m pytest -q
          skeleton/testing/test_architecture_map.py
          skeleton/testing/test_ai_app_construction.py
          skeleton/testing/test_ai_master_plan.py
          skeleton/testing/test_ai_edge_case_catalog.py
          skeleton/testing/test_ai_exotic_systems_catalog.py
          skeleton/testing/test_ai_p0_edge_case_matrix.py
          skeleton/testing/test_ai_full_edge_case_matrix.py
          skeleton/testing/test_ai_master_build_sequence.py
          skeleton/testing/test_ai_engineering_pass.py
          skeleton/testing/test_ai_engineering_task_matrix.py
          skeleton/testing/test_ai_adversarial_closure.py
          skeleton/testing/test_ai_build_accountability.py
          skeleton/testing/test_ai_accountability_cli.py

      - name: Run engine assembly contract tests
        if: steps.scope.outputs.full == 'true'
        env:
          PYTHONPATH: ".:backend"
        run: >-
          python -m pytest -q
          skeleton/testing/test_architecture_map.py
          skeleton/testing/test_ai_app_construction.py
          skeleton/testing/test_ai_master_plan.py
          skeleton/testing/test_ai_edge_case_catalog.py
          skeleton/testing/test_ai_exotic_systems_catalog.py
          skeleton/testing/test_ai_p0_edge_case_matrix.py
          skeleton/testing/test_ai_full_edge_case_matrix.py
          skeleton/testing/test_ai_engineering_pass.py
          skeleton/testing/test_ai_engineering_task_matrix.py
          skeleton/testing/test_ai_adversarial_closure.py
          skeleton/testing/test_ai_build_accountability.py
          skeleton/testing/test_ai_accountability_cli.py
          skeleton/testing/test_capability_interfaces.py
          skeleton/testing/test_state_topology.py
          skeleton/testing/test_state_recovery_drill.py
          skeleton/testing/test_provider_contract.py
          skeleton/testing/test_data_governance.py
          skeleton/testing/test_data_lifecycle.py
          skeleton/testing/test_governance_registry.py
          skeleton/testing/test_governance_audit.py
          skeleton/testing/test_lifecycle_adapters.py
          skeleton/testing/test_cost_admission.py
          skeleton/testing/test_admission_runtime.py
          skeleton/testing/test_tenant_quota.py
          skeleton/testing/test_tenant_quota_sqlite.py
          skeleton/testing/test_actual_usage_metering.py
          skeleton/testing/test_shared_pressure.py
          skeleton/testing/test_operation_contract.py
          skeleton/testing/test_operation_store.py
          skeleton/testing/test_operation_runtime.py
          skeleton/testing/test_operation_server_binding.py
          skeleton/testing/test_conversation_repository.py
          skeleton/testing/test_context_compiler.py
          skeleton/testing/test_operation_stream.py
          skeleton/testing/test_operation_stream_store.py
          skeleton/testing/test_app_assembly.py
          skeleton/testing/test_app_plan.py
          skeleton/testing/test_app_compose_parity.py
          skeleton/testing/test_app_bootstrap.py
          skeleton/testing/test_app_runtime_contract.py
          skeleton/testing/test_app_installer.py
          skeleton/testing/test_windows_installer.py
          tests/test_jeeves_local_provider_policy.py
          tests/test_jeeves_chat_workspace.py

      - name: Run isolated backend provider contract tests
        if: steps.scope.outputs.full == 'true'
        env:
          PYTHONPATH: ".:backend"
        run: >-
          python -m pytest --noconftest -q
          backend/tests/test_provider_architecture.py
          backend/tests/test_ai_provider_adapter.py
          backend/tests/test_ai_provider_media.py
          backend/tests/test_ai_provider_request_validation.py
          backend/tests/test_operation_stream_transport.py
          backend/tests/test_operation_stream_route.py
          backend/tests/test_conversations_api.py
          backend/tests/test_model_router.py
          backend/tests/test_ai_service_provider_convergence.py

      - name: Validate structural assembly
        if: steps.scope.outputs.full == 'true'
        env:
          PYTHONPATH: "."
        run: |
          python -m skeleton app check
          python -m skeleton app plan --json > /tmp/skeleton-app-plan.json
          python -m json.tool /tmp/skeleton-app-plan.json >/dev/null
          python -m skeleton app status --json > /tmp/skeleton-app-status.json
          python -m json.tool /tmp/skeleton-app-status.json >/dev/null

      - name: Validate Compose topology
        if: steps.scope.outputs.full == 'true'
        env:
          MONGO_URL: mongodb://admin:dummy@mongo:27017/tutolage?authSource=admin
          SKL_MONGO_URI: mongodb://admin:dummy@mongo:27017/skeleton?authSource=admin
          MONGO_INITDB_ROOT_PASSWORD: dummy
          JWT_SECRET: not-a-real-jwt-secret
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml --profile "*" config --format json > /tmp/skeleton-compose.json
          python scripts/check_app_compose_parity.py /tmp/skeleton-compose.json
          docker compose -f docker-compose.yml -f docker-compose.hot.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.hot.yml --profile "*" config --format json > /tmp/skeleton-compose-hot.json
          python scripts/check_app_compose_parity.py /tmp/skeleton-compose-hot.json
          BUILD_TARGET=production \
          FRONTEND_BUILD_TARGET=production \
          FRONTEND_CONTAINER_PORT=8080 \
          ENVIRONMENT=production \
          NODE_ENV=production \
          docker compose -f docker-compose.yml config --quiet

      - name: Verify wheel contains assembly manifest
        if: steps.scope.outputs.full == 'true'
        run: |
          python -m pip wheel --no-deps . -w /tmp/wheelhouse
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("/tmp/wheelhouse").glob("skeleton-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one Skeleton wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "skeleton/app/__init__.py",
              "skeleton/app/assembly.py",
              "skeleton/app/bootstrap.py",
              "skeleton/app/cli.py",
              "skeleton/app/health.py",
              "skeleton/app/installer.py",
              "skeleton/app/preloader.py",
              "skeleton/app/setup_runtime.py",
              "skeleton/app/windows_launcher.py",
              "skeleton/app/manifest.json",
              "skeleton/app/plan.py",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel missing assembly payload: {missing}")
          print(f"verified {wheels[0].name}")
          PY
