name: Emerald V5 Scholar wingfold custody
on:
  pull_request:
    paths:
      - 'scripts/emerald_v5_scholar_wingfold.py'
      - 'scripts/verify_emerald_v5_scholar.py'
      - 'scripts/verify_emerald_v5_publication.py'
      - 'scripts/test_emerald_v5_scholar.py'
      - 'scripts/test_emerald_v5_publication.py'
      - 'assets/emerald/evolution-v5/**'
      - '.github/workflows/emerald-v5-scholar-wingfold.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    name: Exact-head source and negative custody regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned numeric library
        run: python -m pip install --only-binary=:all: numpy==2.3.5
      - name: Compile all new source and synthetic tests
        run: python -m py_compile scripts/emerald_v5_scholar_wingfold.py scripts/verify_emerald_v5_scholar.py scripts/verify_emerald_v5_publication.py scripts/test_emerald_v5_scholar.py scripts/test_emerald_v5_publication.py
      - name: Run negative custody and correction math tests
        run: |
          python scripts/test_emerald_v5_scholar.py
          python scripts/test_emerald_v5_publication.py
      - name: No automatic physical or artistic approval
        run: echo 'Source and synthetic tests only. Missing original GLB, full continuous CCD, GPU, artist and Unreal acceptance remain held.'
  payload:
    name: Actual raw Git byte custody (fail closed if absent)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.head_ref == 'assets/emerald-v5-scholar-wingfold-r1-20261117'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify actual four Git binary blobs and whole SHA-256
        run: python3 scripts/verify_emerald_v5_publication.py verify-tree
