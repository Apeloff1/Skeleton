name: VOL-070 Quality Vector

on:
  pull_request:
    paths:
      - "skeleton/eval/**"
      - "skeleton/ai/evaluation/**"
      - "machine/ai_quality_vector.json"
      - "machine/ai_master_plan.json"
      - "scripts/check_vol070_quality_vector.py"
      - "tests/test_vol070_quality_vector.py"
      - ".github/workflows/vol070-quality-vector.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/eval/**"
      - "skeleton/ai/evaluation/**"
      - "machine/ai_quality_vector.json"
      - "machine/ai_master_plan.json"
      - "scripts/check_vol070_quality_vector.py"
      - "tests/test_vol070_quality_vector.py"
      - ".github/workflows/vol070-quality-vector.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol070-quality-vector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality evidence and hard failures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Compile bounded implementation
        run: |
          python -m py_compile skeleton/eval/quality_vector.py
          python -m py_compile skeleton/ai/evaluation/quality_vector.py
          python -m py_compile scripts/check_vol070_quality_vector.py
      - name: Verify quality-vector contracts
        run: python scripts/check_vol070_quality_vector.py
      - name: Run adversarial VOL-070 regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --noconftest tests/test_vol070_quality_vector.py
