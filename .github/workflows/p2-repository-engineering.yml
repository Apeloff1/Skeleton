name: P2 Repository Engineering Control

on:
  pull_request:
    branches:
      - main
      - feat/p2-traceability-spine
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - feat/p2-repository-engineering-control
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-repository-engineering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate P2 repository engineering
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused regression dependency
        run: python -m pip install --disable-pip-version-check . 'pytest>=7'

      - name: Validate repository engineering authority
        run: python scripts/check_p2_repository_engineering.py --json

      - name: Validate AI-tree parity
        run: python scripts/check_ai_file_tree.py

      - name: Run repository engineering regressions
        run: >-
          python -m unittest -v
          tests.test_repo_machine_transaction
          tests.test_repo_machine_review
          tests.test_repo_machine_code_index
          tests.test_repo_machine_maintenance
          tests.test_repo_machine_priority
          tests.test_repo_machine_completion
          tests.test_repo_machine_anti_patterns
          tests.test_p2_repository_engineering

      - name: Run execution learning regressions
        run: python -m pytest -q skeleton/testing/test_repo_machine_execution_learning.py
