name: VOL-249/250 Research Reasoning Qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vol249250-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-bound-inquiry:
    name: Evidence-bound hypothesis and causal qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXACT_HEAD: '${{ github.event.pull_request.head.sha || github.sha }}'
      PYTHONPATH: '.'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11.16'
      - name: Compile completed research modules and regressions
        run: >-
          python -m py_compile skeleton/ai/research/hypothesis_engine.py
          skeleton/ai/research/causal_knowledge.py
          skeleton/ai/research/game_design_probes.py
          skeleton/ai/research/__init__.py
          skeleton/testing/test_hypothesis_engine.py
          skeleton/testing/test_causal_knowledge.py
          skeleton/testing/test_game_design_probes.py
      - name: Complete VOL-249 focused regressions
        run: python -m unittest discover -s skeleton/testing -p 'test_hypothesis_engine.py' -v
      - name: Complete VOL-250 focused regressions
        run: python -m unittest discover -s skeleton/testing -p 'test_causal_knowledge.py' -v
      - name: Complete integrated game-design probe regressions
        run: python -m unittest discover -s skeleton/testing -p 'test_game_design_probes.py' -v
      - name: Complete Git-custody fixture regression
        run: python -m unittest discover -s skeleton/testing -p 'test_ai_git_knowledge.py' -v
      - name: Install existing research test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9' 'pydantic>=2,<3' 'pydantic-settings>=2,<3'
      - name: Existing research-lineage protection
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q -p no:cacheprovider skeleton/testing/test_research_lineage.py skeleton/testing/test_research_system_acceptance.py
      - name: Canonical architecture map
        run: python scripts/check_architecture_map.py
      - name: Canonical AI construction authority
        run: python scripts/check_ai_app_construction.py
      - name: Capability-interface authority
        run: python scripts/check_capability_interfaces.py
      - name: Provider boundary invariants
        run: python scripts/check_provider_bootstrap.py
      - name: Enterprise assurance baseline
        run: python scripts/check_enterprise_ai_superiority.py --json
      - name: Enterprise notes baseline
        run: python scripts/check_enterprise_ai_implementation_notes.py --json
