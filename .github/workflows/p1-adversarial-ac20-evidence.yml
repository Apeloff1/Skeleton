name: P1 Adversarial AC-20 Evidence Gate

on:
  pull_request:
    branches:
      - main
      - p1/bulk-volume-obligation-bindings-20260930
      - p1/bulk-volume-obligation-evidence-20260930
      - p1/risk-classification-evidence-batch1-20260930
      - p1/closure-rollup-490-23-20260930
      - p1/adversarial-ac20-evidence-20260930
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "machine/ai_master_plan.json"
      - "machine/ai_p1_execution_map.json"
      - "machine/ai_adversarial_closure.json"
      - "machine/p1_risk_evidence_policy.json"
      - "machine/p1_risk_evidence_bindings.json"
      - "machine/ai_file_tree.json"
      - "machine/architecture.json"
      - "machine/state_topology.json"
      - "machine/capability_interfaces.json"
      - "machine/ai_build_accountability.json"
      - "machine/ai_master_build_sequence.json"
      - "scripts/check_ai_master_plan.py"
      - "scripts/check_ai_file_tree.py"
      - "scripts/check_state_topology.py"
      - "scripts/check_architecture_map.py"
      - "scripts/check_ai_app_construction.py"
      - "scripts/check_capability_interfaces.py"
      - "scripts/check_ai_build_accountability.py"
      - "scripts/check_ai_master_build_sequence.py"
      - "scripts/check_ai_engineering_task_matrix.py"
      - "scripts/check_ai_execution_frontier.py"
      - "scripts/build_p1_adversarial_ac20_evidence.py"
      - "tests/test_p1_adversarial_ac20_evidence.py"
      - "tests/test_p1_adversarial_ac20_binding.py"
      - "tests/test_p1_adversarial_ac14_binding.py"
      - "tests/test_p1_adversarial_wave2_bindings.py"
      - ".github/workflows/p1-adversarial-ac20-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-adversarial-ac20-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify AC-20 drift and traceability evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"
          "pydantic[email]>=2.13.5"
          "pydantic-settings>=2.15.0"

      - name: Prove drift-validator mode
        run: |
          set -euo pipefail
          python scripts/check_ai_master_plan.py
          python scripts/check_ai_file_tree.py
          python scripts/check_state_topology.py

      - name: Prove architecture-fitness mode
        run: |
          set -euo pipefail
          python scripts/check_architecture_map.py
          python scripts/check_ai_app_construction.py
          python scripts/check_capability_interfaces.py

      - name: Prove undeclared-component-scan mode
        run: |
          set -euo pipefail
          python scripts/check_ai_file_tree.py
          python scripts/check_capability_interfaces.py
          python scripts/check_state_topology.py

      - name: Prove traceability-check mode
        run: |
          set -euo pipefail
          python scripts/check_ai_build_accountability.py
          python scripts/check_ai_master_build_sequence.py
          python scripts/check_ai_engineering_task_matrix.py
          python scripts/check_ai_execution_frontier.py

      - name: Run AC-20 regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_ai_adversarial_closure.py
          tests/test_p1_adversarial_ac20_evidence.py
          tests/test_p1_adversarial_ac20_binding.py
          tests/test_p1_adversarial_ac14_binding.py
          tests/test_p1_adversarial_wave2_bindings.py
          tests/test_p1_bulk_volume_obligation_bindings.py
          tests/test_p1_risk_evidence_reconciliation.py

      - name: Compile exact-head AC-20 evidence twice
        run: |
          set -euo pipefail
          mkdir -p .p1-ac20
          python scripts/build_p1_adversarial_ac20_evidence.py             --expected-head "$EXPECTED_SHA"             --out .p1-ac20/report.json             --print-summary
          python scripts/build_p1_adversarial_ac20_evidence.py             --expected-head "$EXPECTED_SHA"             --out .p1-ac20/replay.json
          cmp .p1-ac20/report.json .p1-ac20/replay.json

      - name: Prove AC-20 candidate authority boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".p1-ac20/report.json").read_text(encoding="utf-8")
          )
          candidate = report["candidate"]
          expected_modes = {
              "drift_validator",
              "architecture_fitness",
              "undeclared_component_scan",
              "traceability_check",
          }
          if report["axis_id"] != "AC-20":
              raise SystemExit("wrong adversarial axis")
          if report["candidate_count"] != 1:
              raise SystemExit("AC-20 candidate count drift")
          if report["already_bound_count"] != 1:
              raise SystemExit("AC-20 governed binding not detected")
          if report["candidate_binding_count"] != 0:
              raise SystemExit("AC-20 unexpectedly remains a binding candidate")
          if candidate["binding_present"] is not True:
              raise SystemExit("AC-20 candidate does not detect governed binding")
          if set(candidate["required_evidence_modes"]) != expected_modes:
              raise SystemExit("AC-20 required evidence modes drift")
          if {row["category"] for row in candidate["evidence"]} != expected_modes:
              raise SystemExit("AC-20 evidence categories are incomplete")
          if candidate["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("AC-20 candidate is not exact-head bound")
          if candidate["recommended_severity"] != "high":
              raise SystemExit("AC-20 severity must remain high")
          if candidate["recommended_disposition"] != "evidence":
              raise SystemExit("AC-20 disposition must remain evidence")
          for field in (
              "creates_binding",
              "accepts_risk",
              "lowers_severity",
              "promotes_maturity",
          ):
              if candidate[field] is not False:
                  raise SystemExit(f"AC-20 authority boundary drift: {field}")
          print(
              "P1_AC20_BINDING_SEED "
              + json.dumps(
                  {
                      "obligation_id": candidate["obligation_id"],
                      "obligation_digest": candidate["obligation_digest"],
                      "owner_id": candidate["owner_id"],
                      "severity": candidate["recommended_severity"],
                      "disposition": candidate["recommended_disposition"],
                      "evidence": candidate["evidence"],
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY

      - name: Confirm governed frontier is 509 resolved and 4 blocking
        run: |
          set -euo pipefail
          python scripts/reconcile_p1_risk_evidence.py             --evaluated-at "2026-10-01T12:00:00+00:00"             --out .p1-ac20/reconciliation.json             --print-summary
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(".p1-ac20/reconciliation.json").read_text(encoding="utf-8")
          )
          if report["binding_count"] != 509:
              raise SystemExit("AC-20 verifier mutated binding count")
          if report["resolved_count"] != 509:
              raise SystemExit("AC-20 verifier mutated resolved count")
          if report["unresolved_blocking_count"] != 4:
              raise SystemExit("AC-20 verifier mutated blocking count")
          if report["unclassified_count"] != 0:
              raise SystemExit("AC-20 verifier reintroduced unclassified risks")
          if report["disposition_counts"] != {
              "evidence": 509,
              "unbound": 4,
          }:
              raise SystemExit("AC-20 verifier mutated disposition counts")
          PY
