name: Owner-ordered historical Actions cleanup

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

# Admin-triggered issue comment provides a distinct GitHub event admission path.
# macOS uses a separate hosted-runner pool from stalled Linux cleanup runs.
# No push/PR fanout; the one owner-authored issue command is strictly validated.
# Current-head CI and security protections remain independent and unchanged.
permissions: {}

# Every trigger gets an independent workflow-wide slot. In particular, unrelated
# issue comments must NEVER queue behind/cancel an owner-approved cleanup.
# The only shared lock stays on the authorized job after its strict event gate.
concurrency:
  group: owner-historical-actions-cleanup-trigger-${{ github.run_id }}
  cancel-in-progress: false

# Apply shared concurrency at JOB scope, after the exact owner-command if gate.
# Otherwise any unrelated issue_comment can cancel pending owner work before
# it ever reaches a runner, even when that comment's job would be skipped.
jobs:
  owner-cleanup:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 3902 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == '/owner-historical-cleanup-30-arm-v5'))
    concurrency:
      # A queued macOS v4 job must not occupy the ARM runner's recovery slot.
      group: owner-historical-actions-cleanup-v5-arm-${{ github.repository }}
      cancel-in-progress: false
    # The ARM pool executed the successful queue-drain recovery; avoid the
    # stalled macOS cleanup admission lane.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 14
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Read only the approved owner cleanup implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/owner_historical_actions_cleanup.py
            tests/test_owner_historical_cleanup_diagnostics.py
          sparse-checkout-cone-mode: false
      - name: Compile the bounded historical cleanup logic
        shell: bash
        run: python3 -m py_compile scripts/owner_historical_actions_cleanup.py
      - name: Regress sanitized provider refusal diagnostics
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_owner_historical_cleanup_diagnostics.py' -v

      - name: Apply owner-approved immutable cleanup only after proven canary removal
        shell: bash
        env:
          # Optional fine-grained owner token with Actions:write on this repo.
          # The standard job token remains the fallback; both paths execute the
          # identical immutable-ID, canary-first, GET-404-confirmed algorithm.
          GH_TOKEN: ${{ secrets.OWNER_ACTIONS_CLEANUP_TOKEN || github.token }}
          PYTHONUNBUFFERED: "1"
          OWNER_CLEANUP_REPORT_PATH: owner-historical-cleanup-refusals.json
        run: python3 scripts/owner_historical_actions_cleanup.py
      - name: Preserve bounded provider-refusal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owner-historical-cleanup-refusals-${{ github.run_id }}
          path: owner-historical-cleanup-refusals.json
          if-no-files-found: warn
          retention-days: 30
