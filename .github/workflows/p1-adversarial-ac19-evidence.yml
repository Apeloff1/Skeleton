name: P1 Adversarial AC-19 Evidence Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/security/operator_override.py"
      - "skeleton/ai/runtime/security/operator_override.py"
      - "skeleton/testing/test_operator_override.py"
      - "scripts/build_p1_adversarial_ac19_evidence.py"
      - "tests/test_p1_adversarial_ac19_evidence.py"
      - "machine/ai_adversarial_closure.json"
      - "machine/p1_risk_evidence_bindings.json"
      - ".github/workflows/p1-adversarial-ac19-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-adversarial-ac19-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify AC-19 operator override evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8,<9"

      - name: Run AC-19 operator and evidence regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_operator_override.py
          tests/test_p1_adversarial_ac19_evidence.py

      - name: Compile exact-head AC-19 evidence twice
        run: |
          set -euo pipefail
          mkdir -p .p1-ac19
          python scripts/build_p1_adversarial_ac19_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-ac19/report.json \
            --print-summary \
            --print-candidate | tee .p1-ac19/stdout.log
          python scripts/build_p1_adversarial_ac19_evidence.py \
            --expected-head "$EXPECTED_SHA" \
            --out .p1-ac19/replay.json
          cmp .p1-ac19/report.json .p1-ac19/replay.json

      - name: Prove evidence-only authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(".p1-ac19/report.json").read_text(encoding="utf-8"))
          candidate = report["candidate"]
          expected = {
              "break_glass_drill",
              "operator_error_simulation",
              "approval_fatigue",
              "undo_recovery",
          }
          if report["axis_id"] != "AC-19":
              raise SystemExit("wrong AC-19 axis")
          if report["candidate_binding_count"] != 1:
              raise SystemExit("AC-19 must remain one unbound evidence candidate")
          if candidate["binding_present"]:
              raise SystemExit("AC-19 unexpectedly already bound")
          if set(candidate["required_evidence_modes"]) != expected:
              raise SystemExit("AC-19 required modes drift")
          if {row["category"] for row in candidate["evidence"]} != expected:
              raise SystemExit("AC-19 evidence incomplete")
          if candidate["expected_head"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("AC-19 exact-head mismatch")
          if candidate["recommended_severity"] != "high":
              raise SystemExit("AC-19 severity drift")
          for field in ("creates_binding", "accepts_risk", "lowers_severity", "promotes_maturity"):
              if candidate[field] is not False:
                  raise SystemExit(f"AC-19 authority drift: {field}")
          PY

      - name: Surface AC-19 binding seed
        run: grep '^P1_AC19_BINDING_SEED=' .p1-ac19/stdout.log
