name: AI Native Neural LM

on:
  pull_request:
    branches:
      - main
    paths:
      - "skeleton/ai/runtime/inference/__init__.py"
      - "skeleton/ai/runtime/inference/neural.py"
      - "skeleton/testing/test_native_neural_lm.py"
      - ".github/workflows/native-neural-lm.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/ai/runtime/inference/__init__.py"
      - "skeleton/ai/runtime/inference/neural.py"
      - "skeleton/testing/test_native_neural_lm.py"
      - ".github/workflows/native-neural-lm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-native-neural-lm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-neural-lm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install base Skeleton runtime without optional neural dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "pydantic==2.13.5"
          "pydantic-settings==2.15.0"
      - name: Prove base inference import does not require NumPy
        run: |
          python - <<'PY'
          import builtins
          import sys

          real_import = builtins.__import__

          def guarded_import(name, *args, **kwargs):
              if name == "numpy" or name.startswith("numpy."):
                  raise ModuleNotFoundError("numpy intentionally unavailable")
              return real_import(name, *args, **kwargs)

          builtins.__import__ = guarded_import
          import skeleton.ai.runtime.inference as inference
          assert "skeleton.ai.runtime.inference.neural" not in sys.modules
          assert hasattr(inference, "LocalInferenceEngine")
          PY
      - name: Install optional neural dependency
        run: >-
          python -m pip install --disable-pip-version-check
          "numpy==2.4.6"
      - name: Run native neural training and inference tests
        run: python -m unittest -q skeleton.testing.test_native_neural_lm
