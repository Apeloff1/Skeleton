name: Native AI recovery source qualification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-ai-recovery-source-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  recovered_source:
    name: Exact-head native AI transaction and dispatch regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout immutable pull-request source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.16'
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check --no-input 'pytest==8.4.2'
      - name: Compile recovered source and regression cases
        run: |
          python -m compileall -q skeleton/ai/runtime/operational_ai/durable_jobs skeleton/ai/runtime/operational_ai/guarded_request
          python -m py_compile skeleton/testing/test_durable_jobs_guarded_transaction_recovery.py
      - name: Run SQLite custody and scheduler qualification
        run: >-
          python -m pytest -q --noconftest --import-mode=importlib
          skeleton/testing/test_durable_jobs_guarded_transaction_recovery.py
      - name: Run restored guarded-request compatibility vectors
        run: >-
          python -m pytest -q --noconftest --import-mode=importlib
          skeleton/testing/test_guarded_request_queue.py
          skeleton/testing/test_guarded_request_pressure.py
          skeleton/testing/test_guarded_request_stream.py
      - name: Verify no source identity drift
        run: python scripts/check_ai_file_tree.py
