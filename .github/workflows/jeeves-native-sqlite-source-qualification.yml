name: Jeeves native SQLite source qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/jeeves/agent/native_*.py"
      - "skeleton/ai/agents/jeeves/**"
      - "skeleton/jeeves/agent/runtime.py"
      - "skeleton/ai/runtime/operational_ai/laptop_runtime/**"
      - "skeleton/ai/runtime/production_fabric/product/**"
      - "skeleton/ai/runtime/operational_ai/offline_cognition/families/duplicate_filter/evidence.py"
      - "skeleton/testing/test_jeeves_architecture_and_evidence_window.py"
      - "skeleton/testing/test_jeeves_desktop_*.py"
      - "skeleton/testing/test_jeeves_private_batch_recovery.py"
      - "skeleton/testing/test_jeeves_native_preload_admission.py"
      - "scripts/launch_jeeves_desktop.py"
      - "jeeves-desktop.sh"
      - "scripts/run_ai_laptop_native_e2e.py"
      - "skeleton/testing/test_laptop_real_device_harness.py"
      - "skeleton/testing/test_jeeves_native_*.py"
      - "skeleton/testing/test_jeeves_single_provider_*.py"
      - "skeleton/testing/test_laptop_runtime_*.py"
      - "skeleton/testing/test_laptop_once_*.py"
      - "skeleton/testing/test_laptop_real_acceptance_*.py"
      - "skeleton/ai/runtime/operational_ai/laptop_runtime/installed_witness.py"
      - ".github/workflows/jeeves-native-sqlite-source-qualification.yml"

permissions:
  contents: read

concurrency:
  group: jeeves-native-sqlite-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source_contracts:
    name: Source-only native and protected SQLite runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use supported interpreter for existing local native runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install canonical domain-test import dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML>=6,<7" "pytest>=8,<9" "pytest-asyncio>=0.24,<2"
          "httpx>=0.28.1,<1" "motor==3.7.1" "pymongo==4.19.0"
          "fastapi>=0.142.2,<1" "pydantic>=2.14.1,<3"
          "pydantic-settings>=2.15.0,<3" "cryptography>=50.0.2"
          "numpy>=2,<3" "Pillow>=13.0.0,<14" "regex>=2026.9.29,<2027"
      - name: Enforce canonical Jeeves tree identity before qualification
        run: python scripts/check_ai_file_tree.py
      - name: Compile the canonical Jeeves and local inference source
        run: >-
          python -m compileall -q
          skeleton/jeeves/agent
          skeleton/ai/runtime/operational_ai/laptop_runtime
      - name: Prove Jeeves readiness requires canonical source and SQLite owner
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_readiness_*.py' -v
      - name: Strict native model provider and verified receipt contracts
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_provider_bridge.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_prompt_and_schema.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_preflight_resource_admission.py' -v
      - name: Single-provider, attempt budget, uncertain replay and epoch fences
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_single_provider_*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_provider_attempt_limits.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_quota_*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_epoch_*.py' -v
      - name: Source-bound native conversational replay and private history
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_chat*.py' -v
      - name: Protected SQLite exact-identity turns and cold replay custody
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_sqlite_integration.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_checkpoint_journal.py' -v
      - name: Durable native operator session and strict local CLI preflight
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_operator_session.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_architecture_and_evidence_window.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_cli_timeout_and_redaction.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_cli_publication.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_batch_cli_source_custody.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_acceptance_cli*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_source_fence*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_session_source_fence.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_repl*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_session_postio.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_session_resource_shape.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_session_cli_*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_session_cumulative_budgets.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_session_jsonl_transport.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_session_exclusive_stream.py' -v
      - name: Canonical installed-model startup and local replay foundations
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_laptop_runtime_startup*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_device_observer_cgroups.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_device_admission_cgroups.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_runtime_source_guard.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_runtime_replay.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_runtime_postcommit.py' -v
      - name: Preflight new one-shot inference before creating SQLite sessions
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_laptop_once_*.py' -v
      - name: Validate installed-source evidence and no synthetic GGUF promotion
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_laptop_real_acceptance_*.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_cold_reopen_typed_source.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_cold_reopen_source_custody.py' -v
          python -m unittest discover -s skeleton/testing -p 'test_laptop_cold_reopen_cli.py' -v
      - name: Verify real-device harness cannot bypass canonical native custody
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_laptop_real_device_harness.py' -v
      - name: Validate the completed real desktop source contracts
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_desktop_*.py' -v
      - name: Verify private durable batch cold-recovery never reissues native work
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_private_batch_recovery.py' -v
      - name: Verify fresh installed-source CPU/RAM/cgroup admission before native GGUF startup
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s skeleton/testing -p 'test_jeeves_native_preload_admission.py' -v
      - name: Keep source-only tests separate from device and release proof
        run: |
          python -c 'from skeleton.ai.runtime.operational_ai.laptop_runtime.identity import ActiveModel; assert not hasattr(ActiveModel, "release_certified")'
