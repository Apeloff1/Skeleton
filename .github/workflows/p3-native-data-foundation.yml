name: P3 Native Data Foundation

on:
  pull_request:
    paths:
      - "skeleton/data/native_pipeline.py"
      - "skeleton/testing/test_p3_data_foundation.py"
      - ".github/workflows/p3-native-data-foundation.yml"
  push:
    branches:
      - feat/p3-native-learning-research-frontier
    paths:
      - "skeleton/data/native_pipeline.py"
      - "skeleton/testing/test_p3_data_foundation.py"
      - ".github/workflows/p3-native-data-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-native-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  data-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"
      - name: Install focused test runtime
        run: >-\n          python -m pip install --disable-pip-version-check\n          "pytest>=8,<9"\n          "pydantic==2.13.5"\n          "pydantic-settings==2.15.0"\n          "fastapi==0.136.1"
      - name: Run provider-independent data acceptance
        run: python -m pytest -q skeleton/testing/test_p3_data_foundation.py
