name: AI Chat Evidence Citation Closure

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/verification/**"
      - "skeleton/ai/assistant/evidence.py"
      - "skeleton/ai/assistant/response_acceptance.py"
      - "skeleton/ai/assistant/__init__.py"
      - "skeleton/testing/test_ai_chat_evidence_citations.py"
      - "skeleton/testing/test_ai_chat_response_acceptance.py"
      - "backend/core/claim_identity.py"
      - "backend/core/citation_integrity.py"
      - "backend/tests/test_claim_identity_citation_calibration.py"
      - "backend/tests/test_citation_structural_laundering.py"
      - "backend/tests/test_citation_gate_adversarial.py"
      - "backend/tests/test_verification_facade_parity.py"
      - "machine/ai_chat_evidence_citations.json"
      - "scripts/check_ai_chat_evidence_citations.py"
      - "scripts/verify_ai_chat_evidence_citations.py"
      - "docs/plan/AI_CHAT_MASTERPLAN_2026-10-06.md"
      - ".github/workflows/ai-chat-evidence-citations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-chat-evidence-citations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-citations:
    name: AI chat evidence and citation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:backend"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Compile evidence surfaces
        run: >-
          python -m compileall -q
          skeleton/verification
          skeleton/ai/assistant/evidence.py
          skeleton/ai/assistant/response_acceptance.py
          backend/core/claim_identity.py
          backend/core/citation_integrity.py
          skeleton/testing/test_ai_chat_evidence_citations.py
          skeleton/testing/test_ai_chat_response_acceptance.py
          scripts/check_ai_chat_evidence_citations.py
          scripts/verify_ai_chat_evidence_citations.py

      - name: Validate Volume 8 structure
        run: python scripts/check_ai_chat_evidence_citations.py

      - name: Run Volume 8 and compatibility regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_ai_chat_evidence_citations.py
          backend/tests/test_claim_identity_citation_calibration.py
          backend/tests/test_citation_structural_laundering.py
          backend/tests/test_citation_gate_adversarial.py
          backend/tests/test_verification_facade_parity.py

      - name: Emit exact-head Volume 8 evidence
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/check_ai_chat_evidence_citations.py
          --head-sha "$EVIDENCE_HEAD_SHA"
          --evidence-out .ai-chat-evidence-citations.json
          --print-evidence

      - name: Independently verify Volume 8 evidence
        env:
          EVIDENCE_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: >-
          python scripts/verify_ai_chat_evidence_citations.py
          .ai-chat-evidence-citations.json
          --head-sha "$EVIDENCE_HEAD_SHA"
          --evidence-out .ai-chat-evidence-citations-independent.json
          --print-evidence

      - name: Assert exact-head Volume 8 closure
        env:
          EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          structural = json.loads(
              Path(".ai-chat-evidence-citations.json").read_text(encoding="utf-8")
          )
          independent = json.loads(
              Path(".ai-chat-evidence-citations-independent.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = os.environ["EXPECTED_SHA"].strip()
          if structural.get("head_sha") != expected:
              raise SystemExit("Volume 8 structural receipt is not exact-head")
          if structural.get("valid") is not True or structural.get("errors"):
              raise SystemExit("Volume 8 structural validation failed")
          if len(structural.get("digests") or {}) != 18:
              raise SystemExit("Volume 8 structural digest coverage incomplete")
          if independent.get("expected_head") != expected:
              raise SystemExit("Volume 8 independent receipt is not exact-head")
          if independent.get("valid") is not True or independent.get("errors"):
              raise SystemExit("Volume 8 independent verification failed")
          if (
              independent.get("structural_evidence_digest")
              != independent.get("recomputed_structural_evidence_digest")
          ):
              raise SystemExit("Volume 8 evidence was not independently rehashed")
          print("AI chat Volume 8 exact-head closure verified:", expected)
          PY

      - name: Verify governed AI file tree
        run: python scripts/check_ai_file_tree.py
