name: GameForge eight-scene native source qualification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "skeleton/forge/playtest.py"
      - "skeleton/ai/forge/playtest.py"
      - "skeleton/context/pipeline.py"
      - "skeleton/ai/runtime/context/pipeline.py"
      - "skeleton/testing/test_eight_native_scene_qualification.py"
      - "skeleton/testing/test_gameforge_native_scene_convergence.py"
      - "backend/routes/skeleton_gameforge.py"
      - "backend/tests/test_native_eight_scene_api.py"
      - "frontend/src/skeletonForge/**"
      - "frontend/scripts/skeleton-forge/native-scene-qualification.test.cjs"
      - ".github/workflows/gameforge-eight-native-scene-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-eight-source-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python_source:
    name: Eight-mode native scene source contracts (mocked Godot process)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.16"
      - name: Install focused source test prerequisites
        run: python -m pip install --disable-pip-version-check -e . "pytest==8.4.2"
      - name: Verify current context and forge canonical mirrors
        run: |
          python - <<'PY'
          from pathlib import Path
          pairs = (
              ("skeleton/forge/playtest.py", "skeleton/ai/forge/playtest.py"),
              ("skeleton/context/pipeline.py", "skeleton/ai/runtime/context/pipeline.py"),
          )
          for left, right in pairs:
              assert Path(left).read_bytes() == Path(right).read_bytes(), (left, right)
          PY
      - name: Compile changed source
        run: python -m compileall -q skeleton/forge/playtest.py skeleton/ai/forge/playtest.py skeleton/context/pipeline.py skeleton/ai/runtime/context/pipeline.py
      - name: Qualify eight native loop contracts and API (not real device acceptance)
        env:
          PYTHONPATH: ".:backend"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_eight_native_scene_qualification.py
          skeleton/testing/test_gameforge_native_scene_convergence.py
          backend/tests/test_native_eight_scene_api.py
