name: P1 World-Model Simulation Gate

on:
  pull_request:
    branches:
      - main
      - feat/long-horizon-autonomy-vol018-20261004
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skeleton/simulation/environment.py"
      - "skeleton/simulation/world_model.py"
      - "skeleton/simulation/__init__.py"
      - "skeleton/testing/test_simulation_authority_boundary.py"
      - "skeleton/testing/test_simulation_determinism.py"
      - "skeleton/testing/test_simulation_ecs_world_contracts.py"
      - ".github/workflows/p1-world-model-simulation.yml"
  push:
    branches:
      - main
    paths:
      - "skeleton/simulation/environment.py"
      - "skeleton/simulation/world_model.py"
      - "skeleton/simulation/__init__.py"
      - "skeleton/testing/test_simulation_authority_boundary.py"
      - "skeleton/testing/test_simulation_determinism.py"
      - ".github/workflows/p1-world-model-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-world-model-simulation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate world-model simulation authority boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EXPECTED_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install focused runtime
        run: >-
          python -m pip install --disable-pip-version-check
          "pytest>=8,<9"

      - name: Compile simulation boundary
        run: >-
          python -m compileall -q
          skeleton/simulation/environment.py
          skeleton/simulation/world_model.py
          skeleton/simulation/world/scene.py

      - name: Run authority and determinism regressions
        run: >-
          python -m pytest -q --noconftest
          skeleton/testing/test_simulation_authority_boundary.py
          skeleton/testing/test_simulation_determinism.py
          skeleton/testing/test_simulation_ecs_world_contracts.py

      - name: Verify exact checked-out head
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Exact-head world-model validation OK: $actual"
