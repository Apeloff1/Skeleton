name: Frontend Type Repair

on:
  push:
    paths:
      - "scripts/frontend_type_repair.py"
      - ".github/workflows/frontend-type-repair.yml"

permissions:
  contents: write

concurrency:
  group: frontend-type-repair-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Apply guarded repair
        run: python scripts/frontend_type_repair.py

      - name: Validate patch
        run: git diff --check

      - name: Commit guarded repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/
          git commit -m "fix(frontend): resolve strict typecheck debt clusters"
          git fetch origin main
          git rebase origin/main
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
