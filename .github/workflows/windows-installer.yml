name: Windows Installer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packaging/windows/**"
      - "scripts/windows/**"
      - "skeleton/app/**"
      - "skeleton/testing/test_windows_installer.py"
      - "docker-compose.yml"
      - "docker-compose.hot.yml"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  push:
    branches: [main]
    paths:
      - "packaging/windows/**"
      - "scripts/windows/**"
      - "skeleton/app/**"
      - "skeleton/testing/test_windows_installer.py"
      - "docker-compose.yml"
      - "docker-compose.hot.yml"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.7"

jobs:
  build-windows-installer:
    name: Build Setup.exe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/windows-installer.yml
            /.dockerignore
            /.env.example
            /Dockerfile
            /README.md
            /docker-compose.yml
            /docker-compose.hot.yml
            /pyproject.toml
            /requirements.txt
            /backend/
            /frontend/
            /skeleton/
            /scripts/
            /packaging/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 --version 7.1.0 --exact --source winget --silent --disable-interactivity --accept-package-agreements --accept-source-agreements

      - name: Run Windows installer contract tests
        shell: pwsh
        env:
          PYTHONPATH: "."
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8,<9" "pydantic==2.13.5" "pydantic-settings==2.15.0"
          python -m pytest -q skeleton/testing/test_windows_installer.py

      - name: Validate offline Windows network policy syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/windows/offline_network_policy.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw "Offline Windows firewall policy script did not parse"
          }

      - name: Build installer
        shell: pwsh
        run: ./scripts/windows/build_installer.ps1 -SourceRef HEAD

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/windows/Skeleton-Setup-*-windows-x64.exe | Select-Object -First 1
          if (-not $installer) { throw "installer missing" }
          $checksum = Get-Content "$($installer.FullName).sha256"
          $actual = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          if (-not $checksum.StartsWith($actual)) { throw "installer checksum mismatch" }
          Write-Host "Verified $($installer.Name): $actual"

      - name: Smoke install generated Setup.exe
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/windows/Skeleton-Setup-*-windows-x64.exe | Select-Object -First 1
          if (-not $installer) { throw "installer missing" }

          $installDir = Join-Path $env:RUNNER_TEMP "SkeletonInstallerSmoke"
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }

          $setupLog = Join-Path $env:RUNNER_TEMP "SkeletonSetup-smoke.log"
          if (Test-Path -LiteralPath $setupLog) {
            Remove-Item -LiteralPath $setupLog -Force
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/LOG=$setupLog",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $setupLog) {
              Write-Host "---- Inno Setup failure context ----"
              $patterns = "error|exception|abort|failed|denied|access|cannot|unable|not found|rollback"
              $matches = Select-String -LiteralPath $setupLog -Pattern $patterns -CaseSensitive:$false -Context 8,16
              if ($matches) {
                $matches | ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext }
              } else {
                Write-Host "No explicit error token found; printing log head and tail."
                Get-Content -LiteralPath $setupLog -TotalCount 100
                Get-Content -LiteralPath $setupLog -Tail 100
              }
              Write-Host "---- end Inno Setup failure context ----"
            }
            throw "silent installer exited $($install.ExitCode)"
          }

          $launcher = Join-Path $installDir "Skeleton.exe"
          if (-not (Test-Path -LiteralPath $launcher)) {
            throw "installed Skeleton.exe missing"
          }
          $launch = Start-Process -FilePath $launcher -ArgumentList @("--help") -Wait -PassThru
          if ($launch.ExitCode -ne 0) {
            throw "installed Skeleton.exe launch smoke exited $($launch.ExitCode)"
          }

          # The command below performs actual bounded native transformer
          # inference inside the frozen executable. No Docker/credentials/GUI.
          $nativeSmoke = Start-Process -FilePath $launcher -ArgumentList @("--local-ai-smoke") -Wait -PassThru
          if ($nativeSmoke.ExitCode -ne 0) {
            throw "installed Skeleton.exe native offline inference smoke exited $($nativeSmoke.ExitCode)"
          }

          # A genuinely console-capable binary is required for automated
          # local inference. It must work without system Python or Docker.
          $offline = Join-Path $installDir "SkeletonOffline.exe"
          if (-not (Test-Path -LiteralPath $offline)) {
            throw "installed SkeletonOffline.exe missing"
          }
          & $offline --native-smoke
          if ($LASTEXITCODE -ne 0) {
            throw "standalone offline console native graph smoke failed"
          }
          & $offline --help
          if ($LASTEXITCODE -ne 0) {
            throw "standalone offline console help failed"
          }

          # Exercise the installed console's actual local knowledge, durable
          # queue and portable database recovery without external Python.
          $offlineNotes = Join-Path $env:RUNNER_TEMP "SkeletonOfflineNotes"
          New-Item -ItemType Directory -Force -Path $offlineNotes | Out-Null
          "Deterministic local physics frames and game replay." |
            Set-Content -LiteralPath (Join-Path $offlineNotes "facts.md") -Encoding utf8
          $offlineIndex = Join-Path $env:RUNNER_TEMP "SkeletonOfflineKnowledge.sqlite"
          & $offline --library $offlineIndex --index-dir $offlineNotes --json | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "frozen offline local-text index failed"
          }
          $searchResult = & $offline --library $offlineIndex --search "physics" --json
          if ($LASTEXITCODE -ne 0) {
            throw "frozen offline FTS5 retrieval failed"
          }
          $parsedSearch = $searchResult | ConvertFrom-Json
          if ($parsedSearch.results.Count -lt 1) {
            throw "offline search returned no indexed local knowledge"
          }

          $offlineQueue = Join-Path $env:RUNNER_TEMP "SkeletonOfflineJobs.sqlite"
          $queueJson = & $offline --queue-db $offlineQueue --queue-status --json
          if ($LASTEXITCODE -ne 0) {
            throw "frozen offline indexing queue failed"
          }
          $queueStatus = $queueJson | ConvertFrom-Json
          if ($null -eq $queueStatus.jobs) {
            throw "offline indexing queue returned no jobs envelope"
          }
          $auditJson = & $offline --audit-library $offlineIndex --audit-queue $offlineQueue --json
          if ($LASTEXITCODE -ne 0) {
            throw "offline standalone semantic integrity audit failed"
          }
          $auditReport = $auditJson | ConvertFrom-Json
          if (-not $auditReport.ok -or -not $auditReport.reports.library.ok -or
              -not $auditReport.reports.queue.ok) {
            throw "offline semantic audit returned an invalid status envelope"
          }
          $offlineSnapshot = Join-Path $env:RUNNER_TEMP "SkeletonOfflineRecovery"
          & $offline --snapshot-to $offlineSnapshot --snapshot-library $offlineIndex --snapshot-queue $offlineQueue --json | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "offline SQLite snapshot creation failed"
          }
          & $offline --verify-snapshot $offlineSnapshot --json | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "offline SQLite snapshot verification failed"
          }
          $recoveredKnowledge = Join-Path $env:RUNNER_TEMP "SkeletonRecoveredKnowledge.sqlite"
          $recoveredQueue = Join-Path $env:RUNNER_TEMP "SkeletonRecoveredJobs.sqlite"
          & $offline --restore-from $offlineSnapshot --snapshot-library $recoveredKnowledge --snapshot-queue $recoveredQueue --json | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $recoveredKnowledge)) {
            throw "offline SQLite snapshot restore failed"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) {
            throw "uninstaller missing"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "silent uninstaller exited $($uninstall.ExitCode)"
          }
          Start-Sleep -Seconds 1
          if (Test-Path -LiteralPath $launcher) {
            throw "uninstall left installed launcher behind"
          }

      - name: Upload Windows installer
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Skeleton-Windows-Installer-${{ github.sha }}
          path: |
            dist/windows/Skeleton-Setup-*-windows-x64.exe
            dist/windows/Skeleton-Setup-*-windows-x64.exe.sha256
            ${{ runner.temp }}/SkeletonSetup-smoke.log
          if-no-files-found: error
          retention-days: 14
