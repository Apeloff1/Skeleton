name: SMB Shift Manager

on:
  schedule:
    # Secretary runs every 15 minutes. SMB also runs on the :00/:30 events.
    - cron: '0,30 * * * *'
    - cron: '15,45 * * * *'
  workflow_dispatch:

concurrency:
  group: smb-shift-manager
  cancel-in-progress: false

permissions: {}

jobs:
  coordinate:
    if: github.repository == 'Apeloff1/Skeleton'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'

      - name: Install trusted coordination runtime
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate shift-manager control plane
        env:
          OPENAI_API_KEY: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: python -m unittest -v skeleton.testing.test_shift_manager

      - name: Snapshot all authorized planning sources
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .shift-manager-tmp
          gh run list --repo "$REPO" --limit 100 \
            --json databaseId,name,status,conclusion,createdAt,startedAt,updatedAt,displayTitle,headBranch,url \
            > .shift-manager-tmp/runs.json
          gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title,body,updatedAt,labels,url \
            > .shift-manager-tmp/issues.json
          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,title,body,mergeable,mergeStateStatus,updatedAt,labels,url \
            > .shift-manager-tmp/pulls.json

          fetch_ledger() {
            local title="$1"
            local output="$2"
            local number
            number=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
            if [[ -n "${number:-}" ]]; then
              gh issue view "$number" --repo "$REPO" --comments --json comments \
                --jq '[.comments[-20:][] | {createdAt: .createdAt, body: .body, url: .url}]' > "$output"
            else
              printf '[]\n' > "$output"
            fi
          }

          fetch_ledger 'bot: autonomous studio ledger' .shift-manager-tmp/night-ledger.json
          fetch_ledger 'bot: idle studio ledger' .shift-manager-tmp/idle-ledger.json
          fetch_ledger 'bot: shift secretary workload ledger' .shift-manager-tmp/secretary-ledger.json

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.shift-manager-tmp')
          issues = json.loads((root / 'issues.json').read_text(encoding='utf-8'))
          previous = next(
              (str(row.get('body', '')) for row in issues if row.get('title') == 'bot: SMB shift plan'),
              '',
          )
          state = {
              'runs': json.loads((root / 'runs.json').read_text(encoding='utf-8')),
              'issues': issues,
              'pulls': json.loads((root / 'pulls.json').read_text(encoding='utf-8')),
              'backlog': Path('BACKLOG.md').read_text(encoding='utf-8')[:80_000] if Path('BACKLOG.md').exists() else '',
              'night_ledger': json.loads((root / 'night-ledger.json').read_text(encoding='utf-8')),
              'idle_ledger': json.loads((root / 'idle-ledger.json').read_text(encoding='utf-8')),
              'secretary_ledger': json.loads((root / 'secretary-ledger.json').read_text(encoding='utf-8')),
              'previous_plan': previous[:80_000],
          }
          (root / 'state.json').write_text(json.dumps(state, sort_keys=True, indent=2), encoding='utf-8')
          PY

      - name: Secretary adds fresh workload and research every 15 minutes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
        run: >-
          python -m skeleton.automation.shift_manager secretary
          --state .shift-manager-tmp/state.json
          --output .shift-manager-tmp/secretary.json

      - name: Persist append-only Secretary ledger
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          title='bot: shift secretary workload ledger'
          number=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [[ -z "${number:-}" ]]; then
            url=$(gh issue create --repo "$REPO" --title "$title" --body 'Append-only 15-minute workload/research deltas supplied to SMB. Entries are planning evidence only and never authorize repository writes, merges, or command execution.')
            number="${url##*/}"
          fi
          gh issue comment "$number" --repo "$REPO" --body-file .shift-manager-tmp/secretary.md >/dev/null

      - name: SMB refreshes canonical cross-team plan every 30 minutes
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0,30 * * * *'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
        run: >-
          python -m skeleton.automation.shift_manager manager
          --state .shift-manager-tmp/state.json
          --secretary .shift-manager-tmp/secretary.json
          --output .shift-manager-tmp/plan.json

      - name: Persist canonical SMB plan and audit history
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0,30 * * * *'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          title='bot: SMB shift plan'
          number=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [[ -z "${number:-}" ]]; then
            url=$(gh issue create --repo "$REPO" --title "$title" --body 'Canonical 30-minute plan for Night Shift and Idle Studio. SMB is the only writer of this canonical plan; the Secretary contributes append-only workload deltas.')
            number="${url##*/}"
          fi
          {
            cat .shift-manager-tmp/plan.md
            echo
            echo '<details><summary>Machine-readable plan</summary>'
            echo
            echo '```json'
            cat .shift-manager-tmp/plan.json
            echo '```'
            echo '</details>'
          } > .shift-manager-tmp/plan-body.md
          gh issue edit "$number" --repo "$REPO" --body-file .shift-manager-tmp/plan-body.md >/dev/null
          gh issue comment "$number" --repo "$REPO" --body-file .shift-manager-tmp/plan.md >/dev/null

      - name: Summarize coordination cycle
        if: always()
        shell: bash
        run: |
          {
            echo '## Shift Secretary'
            if [[ -s .shift-manager-tmp/secretary.md ]]; then cat .shift-manager-tmp/secretary.md; else echo 'Secretary did not produce a delta.'; fi
            if [[ -s .shift-manager-tmp/plan.md ]]; then
              echo
              echo '## SMB'
              cat .shift-manager-tmp/plan.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
