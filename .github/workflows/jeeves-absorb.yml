name: Jeeves Absorb

on:
  pull_request:
    branches: [main]
    paths:
      - "skeleton/jeeves/absorb.py"
      - "skeleton/jeeves/absorb_claims.py"
      - "skeleton/jeeves/absorb_evolution.py"
      - "skeleton/jeeves/absorb_runtime.py"
      - "skeleton/jeeves/absorb_rag.py"
      - "skeleton/testing/test_jeeves_absorb.py"
      - "skeleton/testing/test_jeeves_absorb_claims.py"
      - "skeleton/testing/test_jeeves_absorb_evolution.py"
      - ".github/workflows/jeeves-absorb.yml"
  push:
    branches: [main]
    paths:
      - "skeleton/jeeves/absorb.py"
      - "skeleton/jeeves/absorb_claims.py"
      - "skeleton/jeeves/absorb_evolution.py"
      - "skeleton/jeeves/absorb_runtime.py"
      - "skeleton/jeeves/absorb_rag.py"
      - "skeleton/testing/test_jeeves_absorb.py"
      - "skeleton/testing/test_jeeves_absorb_claims.py"
      - "skeleton/testing/test_jeeves_absorb_evolution.py"
      - ".github/workflows/jeeves-absorb.yml"

permissions:
  contents: read

concurrency:
  group: jeeves-absorb-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Absorb contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Install focused runtime slice
        run: python -m pip install "pytest>=8,<9" "fastapi>=0.110,<1" "pydantic>=2.5,<3" "pydantic-settings>=2.1,<3"
      - name: Compile absorb plane
        run: python -m compileall -q skeleton/jeeves/absorb.py skeleton/jeeves/absorb_claims.py skeleton/jeeves/absorb_evolution.py skeleton/jeeves/absorb_runtime.py skeleton/jeeves/absorb_rag.py
      - name: Run absorb contract
        env:
          PYTHONPATH: "."
        run: python -m pytest -q skeleton/testing/test_jeeves_absorb.py skeleton/testing/test_jeeves_absorb_claims.py skeleton/testing/test_jeeves_absorb_evolution.py
