name: Dependency Security

on:
  push:
    branches: [main, master]
    paths:
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/scripts/patch-node-modules.js"
      - "frontend/scripts/verify-image-size-security.js"
      - "frontend/scripts/enforce-yarn-audit.js"
      - ".github/workflows/dependency-security.yml"
  pull_request:
    paths:
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/scripts/patch-node-modules.js"
      - "frontend/scripts/verify-image-size-security.js"
      - "frontend/scripts/enforce-yarn-audit.js"
      - ".github/workflows/dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install pinned dependency auditor
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: Audit Python dependencies and build CycloneDX SBOM
        id: python-audit
        shell: bash
        run: |
          set +e
          pip-audit \
            --strict \
            --progress-spinner off \
            --requirement requirements.txt \
            --format cyclonedx-json \
            --output "$RUNNER_TEMP/python-sbom.cdx.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Python SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-cyclonedx-sbom
          path: ${{ runner.temp }}/python-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Python vulnerability policy
        if: steps.python-audit.outputs.status != '0'
        run: |
          echo "Python dependency audit reported vulnerabilities or resolution failures." >&2
          exit 1

  javascript-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Refresh vulnerable frontend transitive dependencies
        if: github.event_name == 'pull_request' && github.actor == 'Apeloff1'
        working-directory: frontend
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.resolutions = {
            ...(p.resolutions || {}),
            '**/minimatch/brace-expansion': '1.1.18',
            'shell-quote': '1.10.0',
            'tar': '7.5.21',
            'undici': '6.28.0',
            'js-yaml': '3.15.2',
            'postcss': '8.5.25',
            'react-native/ws': '6.2.4',
            '@react-native/dev-middleware/ws': '6.2.4',
            'nanoid': '3.3.18',
            'browserslist': '4.28.9',
            '@expo/plist/@xmldom/xmldom': '0.8.15',
            'speech-rule-engine/@xmldom/xmldom': '0.9.12',
            'isomorphic-fetch/node-fetch': '2.7.0'
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          yarn install --ignore-scripts --non-interactive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json yarn.lock
          if ! git diff --cached --quiet; then
            git commit -m 'security: refresh patched frontend dependency graph'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install frozen frontend dependency graph
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Verify image-size parser progress mitigation
        id: image-size-security
        working-directory: frontend
        run: node scripts/verify-image-size-security.js

      - name: Audit production JavaScript dependencies
        working-directory: frontend
        shell: bash
        run: |
          set +e
          yarn audit --groups dependencies --level high --json > "$RUNNER_TEMP/yarn-audit.json"
          exit 0

      - name: Generate Yarn-aware CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0 / Syft v1.42.3
        with:
          path: frontend
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/frontend-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload frontend audit and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dependency-security
          path: |
            ${{ runner.temp }}/yarn-audit.json
            ${{ runner.temp }}/frontend-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce JavaScript vulnerability policy
        if: always()
        env:
          IMAGE_SIZE_SECURITY_VERIFIED: ${{ steps.image-size-security.outcome }}
        working-directory: frontend
        run: node scripts/enforce-yarn-audit.js "$RUNNER_TEMP/yarn-audit.json"
