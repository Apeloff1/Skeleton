name: Dependency Security

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/scripts/patch-node-modules.js"
      - "frontend/scripts/verify-image-size-security.js"
      - "frontend/scripts/enforce-yarn-audit.js"
      - "frontend/scripts/test-enforce-yarn-audit.js"
      - ".github/workflows/dependency-security.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/scripts/patch-node-modules.js"
      - "frontend/scripts/verify-image-size-security.js"
      - "frontend/scripts/enforce-yarn-audit.js"
      - "frontend/scripts/test-enforce-yarn-audit.js"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Install pinned dependency auditor
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: Audit Python dependencies and build CycloneDX SBOM
        id: python-audit
        shell: bash
        run: |
          set +e
          pip-audit \
            --strict \
            --progress-spinner off \
            --requirement requirements.txt \
            --format cyclonedx-json \
            --output "$RUNNER_TEMP/python-sbom.cdx.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Python SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-cyclonedx-sbom
          path: ${{ runner.temp }}/python-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce Python vulnerability policy
        if: steps.python-audit.outputs.status != '0'
        run: |
          echo "Python dependency audit reported vulnerabilities or resolution failures." >&2
          exit 1

  javascript-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frozen frontend dependency graph without lifecycle scripts
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive --ignore-scripts

      - name: Apply reviewed local node_modules security patches
        working-directory: frontend
        run: node scripts/patch-node-modules.js

      - name: Test JavaScript audit policy parser
        working-directory: frontend
        run: yarn audit:policy:test

      - name: Verify image-size parser progress mitigation
        id: image-size-security
        working-directory: frontend
        run: node scripts/verify-image-size-security.js

      - name: Audit production JavaScript dependencies
        id: yarn-audit
        working-directory: frontend
        shell: bash
        run: |
          set +e
          yarn audit --groups dependencies --level high --json | tee "$RUNNER_TEMP/yarn-audit.json"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate Yarn-aware CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0 / Syft v1.42.3
        with:
          path: frontend
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/frontend-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload frontend audit and SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dependency-security
          path: |
            ${{ runner.temp }}/yarn-audit.json
            ${{ runner.temp }}/frontend-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate nonzero Yarn audit status before policy evaluation
        if: steps.yarn-audit.outputs.status != '0'
        env:
          YARN_AUDIT_STATUS: ${{ steps.yarn-audit.outputs.status }}
        shell: bash
        run: |
          case "$YARN_AUDIT_STATUS" in
            ''|*[!0-9]*)
              echo "Yarn audit did not produce a numeric severity mask." >&2
              exit 1
              ;;
          esac

      - name: Enforce JavaScript vulnerability policy
        if: always()
        env:
          IMAGE_SIZE_SECURITY_VERIFIED: ${{ steps.image-size-security.outcome }}
          YARN_AUDIT_STATUS: ${{ steps.yarn-audit.outputs.status }}
        working-directory: frontend
        run: node scripts/enforce-yarn-audit.js "$RUNNER_TEMP/yarn-audit.json"

  container-audit:
    name: "Container CVE Audit (${{ matrix.name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            context: .
            file: ./Dockerfile
            target: ""
            image: skeleton-root:security-scan
          - name: backend
            context: .
            file: ./backend/Dockerfile
            target: production
            image: skeleton-backend:security-scan
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            target: production
            image: skeleton-frontend:security-scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for vulnerability scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ matrix.image }}

      - name: Fail on high or critical container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table
