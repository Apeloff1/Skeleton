name: Dependency Security

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/scripts/patch-node-modules.js"
      - "frontend/scripts/verify-image-size-security.js"
      - "frontend/scripts/enforce-yarn-audit.js"
      - "frontend/scripts/test-enforce-yarn-audit.js"
      - ".github/workflows/dependency-security.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "Dockerfile"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/scripts/patch-node-modules.js"
      - "frontend/scripts/verify-image-size-security.js"
      - "frontend/scripts/enforce-yarn-audit.js"
      - "frontend/scripts/test-enforce-yarn-audit.js"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"

      - name: Install pinned dependency auditor
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: Audit Python dependencies and build CycloneDX SBOM
        id: python-audit
        shell: bash
        run: |
          set +e
          pip-audit \
            --strict \
            --progress-spinner off \
            --requirement requirements.txt \
            --format cyclonedx-json \
            --output "$RUNNER_TEMP/python-sbom.cdx.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Python SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-cyclonedx-sbom
          path: ${{ runner.temp }}/python-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce Python vulnerability policy
        if: steps.python-audit.outputs.status != '0'
        run: |
          echo "Python dependency audit reported vulnerabilities or resolution failures." >&2
          exit 1

  javascript-audit:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frozen frontend dependency graph without lifecycle scripts
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive --ignore-scripts

      - name: Apply reviewed local node_modules security patches
        working-directory: frontend
        run: node scripts/patch-node-modules.js

      - name: Test JavaScript audit policy parser
        working-directory: frontend
        run: yarn audit:policy:test

      - name: Verify image-size parser progress mitigation
        id: image-size-security
        working-directory: frontend
        run: node scripts/verify-image-size-security.js

      - name: Audit production JavaScript dependencies
        id: yarn-audit
        working-directory: frontend
        shell: bash
        run: |
          set +e
          yarn audit --groups dependencies --level high --json | tee "$RUNNER_TEMP/yarn-audit.json"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate Yarn-aware CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0 / Syft v1.42.3
        with:
          path: frontend
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/frontend-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload frontend audit and SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dependency-security
          path: |
            ${{ runner.temp }}/yarn-audit.json
            ${{ runner.temp }}/frontend-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate nonzero Yarn audit status before policy evaluation
        if: steps.yarn-audit.outputs.status != '0'
        env:
          YARN_AUDIT_STATUS: ${{ steps.yarn-audit.outputs.status }}
        shell: bash
        run: |
          case "$YARN_AUDIT_STATUS" in
            ''|*[!0-9]*)
              echo "Yarn audit did not produce a numeric severity mask." >&2
              exit 1
              ;;
          esac

      - name: Enforce JavaScript vulnerability policy
        if: always()
        env:
          IMAGE_SIZE_SECURITY_VERIFIED: ${{ steps.image-size-security.outcome }}
          YARN_AUDIT_STATUS: ${{ steps.yarn-audit.outputs.status }}
        working-directory: frontend
        run: node scripts/enforce-yarn-audit.js "$RUNNER_TEMP/yarn-audit.json"

  container-audit:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: "Container CVE Audit (${{ matrix.name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            context: .
            file: ./Dockerfile
            target: ""
            image: skeleton-root:security-scan
          - name: backend
            context: .
            file: ./backend/Dockerfile
            target: production
            image: skeleton-backend:security-scan
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            target: production
            image: skeleton-frontend:security-scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for vulnerability scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ matrix.image }}

      - name: Verify frontend browser security headers
        if: matrix.name == 'frontend'
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d \
            --add-host skeleton:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            -p 127.0.0.1:18080:8080 \
            "${{ matrix.image }}")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/healthz; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            docker logs "$container_id" >&2 || true
            echo "Frontend container did not become healthy." >&2
            exit 1
          fi

          headers="$(curl --fail --silent --show-error --head http://127.0.0.1:18080/)"
          printf '%s\n' "$headers"
          for expected in \
            'X-Content-Type-Options: nosniff' \
            'X-Frame-Options: SAMEORIGIN' \
            'Referrer-Policy: strict-origin-when-cross-origin' \
            'Permissions-Policy: camera=(), microphone=(), geolocation=()' \
            "Content-Security-Policy: frame-ancestors 'self'; base-uri 'self'; object-src 'none'" \
            'X-Permitted-Cross-Domain-Policies: none'; do
            if ! grep -Fqi "$expected" <<<"$headers"; then
              echo "Missing required frontend security header: $expected" >&2
              exit 1
            fi
          done

          health_headers="$(curl --fail --silent --show-error --head http://127.0.0.1:18080/healthz)"
          if ! grep -Fqi 'Cache-Control: no-store' <<<"$health_headers"; then
            echo "Health endpoint must not be cached." >&2
            exit 1
          fi

      - name: Fail on high or critical container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table

      - name: Generate container CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ matrix.image }}
          format: cyclonedx
          output: ${{ runner.temp }}/container-${{ matrix.name }}-sbom.cdx.json
          exit-code: 0

      - name: Validate generated container SBOM
        env:
          SBOM_PATH: ${{ runner.temp }}/container-${{ matrix.name }}-sbom.cdx.json
          EXPECTED_IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["SBOM_PATH"])
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("container SBOM is missing or empty")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("bomFormat") != "CycloneDX":
              raise SystemExit("container SBOM is not CycloneDX")
          if not isinstance(payload.get("components"), list):
              raise SystemExit("container SBOM components must be a list")
          metadata = payload.get("metadata")
          if not isinstance(metadata, dict):
              raise SystemExit("container SBOM metadata is missing")
          print(
              "validated container SBOM:",
              os.environ["EXPECTED_IMAGE"],
              "components=",
              len(payload["components"]),
          )
          PY

      - name: Retain container SBOM as security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-${{ matrix.name }}-cyclonedx-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/container-${{ matrix.name }}-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
