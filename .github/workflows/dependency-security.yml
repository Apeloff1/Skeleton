name: Dependency Security

on:
  push:
    branches: [main, master]
    paths:
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - ".github/workflows/dependency-security.yml"
  pull_request:
    paths:
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - ".github/workflows/dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install pinned dependency auditor
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: Audit Python dependencies and build CycloneDX SBOM
        id: python-audit
        shell: bash
        run: |
          set +e
          pip-audit \
            --strict \
            --progress-spinner off \
            --requirement requirements.txt \
            --format cyclonedx-json \
            --output "$RUNNER_TEMP/python-sbom.cdx.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Python SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-cyclonedx-sbom
          path: ${{ runner.temp }}/python-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Python vulnerability policy
        if: steps.python-audit.outputs.status != '0'
        run: |
          echo "Python dependency audit reported vulnerabilities or resolution failures." >&2
          exit 1

  javascript-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frozen frontend dependency graph
        run: yarn install --frozen-lockfile --non-interactive

      - name: Audit production JavaScript dependencies
        id: yarn-audit
        shell: bash
        run: |
          set +e
          yarn audit --groups dependencies --level high --json > "$RUNNER_TEMP/yarn-audit.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate frontend CycloneDX SBOM
        run: >-
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1
          --output-format JSON
          --output-file "$RUNNER_TEMP/frontend-sbom.cdx.json"
          package.json

      - name: Upload frontend audit and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dependency-security
          path: |
            ${{ runner.temp }}/yarn-audit.json
            ${{ runner.temp }}/frontend-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce JavaScript vulnerability policy
        if: steps.yarn-audit.outputs.status != '0'
        run: |
          echo "JavaScript dependency audit reported vulnerabilities." >&2
          exit 1
