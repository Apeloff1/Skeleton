name: Consolidate and clean merged branches
# Repository-wide safe branch sweep. Patch-equivalent history is absorbed; unique work is preserved.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-clean.yml'

permissions: {}

jobs:
  consolidate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch complete branch graph
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Absorb patch-equivalent stale branch tips
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          declare -A seen=()
          candidates=()
          already_merged=0
          preserved_unique=0
          preserved_protected=0
          : > ../unique-branches.txt

          while read -r tip branch; do
            [[ -n "$tip" && -n "$branch" ]] || continue

            case "$branch" in
              main|backup/*)
                preserved_protected=$((preserved_protected + 1))
                continue
                ;;
            esac

            if [[ -n "${seen[$tip]:-}" ]]; then
              continue
            fi
            seen[$tip]=1

            main_ref=refs/remotes/origin/main

            if git merge-base --is-ancestor "$tip" "$main_ref"; then
              already_merged=$((already_merged + 1))
              continue
            fi

            # Exact tree equality is always safe to absorb.
            if git diff --quiet "$main_ref" "$tip"; then
              candidates+=("$tip")
              continue
            fi

            merge_base=$(git merge-base "$main_ref" "$tip" || true)
            if [[ -z "$merge_base" ]]; then
              printf '%s %s unrelated-history\n' "$branch" "$tip" >> ../unique-branches.txt
              preserved_unique=$((preserved_unique + 1))
              continue
            fi

            # Be conservative around branch-local merge commits because git cherry
            # intentionally ignores merges and could miss a merge-resolution-only change.
            if git rev-list --merges "${merge_base}..${tip}" | grep -q .; then
              printf '%s %s contains-merge-commits\n' "$branch" "$tip" >> ../unique-branches.txt
              preserved_unique=$((preserved_unique + 1))
              continue
            fi

            # No '+' from git cherry means every branch patch is patch-equivalent
            # to something already reachable from main.
            if git cherry "$main_ref" "$tip" | grep -q '^+'; then
              printf '%s %s unique-patches\n' "$branch" "$tip" >> ../unique-branches.txt
              preserved_unique=$((preserved_unique + 1))
            else
              candidates+=("$tip")
            fi
          done < <(git for-each-ref --format='%(objectname) %(refname:strip=3)' refs/remotes/origin)

          absorbed=0
          batch_size=24

          for ((offset=0; offset<${#candidates[@]}; offset+=batch_size)); do
            batch=("${candidates[@]:offset:batch_size}")
            pushed=0

            for attempt in 1 2 3 4 5; do
              git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
              current=$(git rev-parse refs/remotes/origin/main)
              tree=$(git rev-parse "${current}^{tree}")
              parents=(-p "$current")
              included=()

              for tip in "${batch[@]}"; do
                if git merge-base --is-ancestor "$tip" "$current"; then
                  continue
                fi

                safe=0
                if git diff --quiet "$current" "$tip"; then
                  safe=1
                else
                  mb=$(git merge-base "$current" "$tip" || true)
                  if [[ -n "$mb" ]] \
                    && ! git rev-list --merges "${mb}..${tip}" | grep -q . \
                    && ! git cherry "$current" "$tip" | grep -q '^+'; then
                    safe=1
                  fi
                fi

                if [[ "$safe" -eq 1 ]]; then
                  parents+=(-p "$tip")
                  included+=("$tip")
                fi
              done

              if [[ ${#included[@]} -eq 0 ]]; then
                pushed=1
                break
              fi

              message="consolidate: absorb patch-equivalent branch history"
              new_commit=$(printf '%s\n\nPreserve the current main tree while recording patch-equivalent stale branch tips as parents. Unique branch patches remain unmerged and are not deleted.\n' "$message" \
                | git commit-tree "$tree" "${parents[@]}")

              if git push --quiet origin "${new_commit}:refs/heads/main"; then
                absorbed=$((absorbed + ${#included[@]}))
                pushed=1
                break
              fi

              echo "main moved during consolidation; retrying batch (${attempt}/5)"
            done

            if [[ "$pushed" -ne 1 ]]; then
              echo 'failed to advance main safely after retries' >&2
              exit 1
            fi
          done

          {
            echo "ALREADY_MERGED=${already_merged}"
            echo "ABSORBED=${absorbed}"
            echo "PRESERVED_UNIQUE=${preserved_unique}"
            echo "PRESERVED_PROTECTED=${preserved_protected}"
          } >> "$GITHUB_ENV"

      - name: Delete branches fully contained in main
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git fetch --quiet --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

          mapfile -t branches < <(
            git for-each-ref \
              --merged refs/remotes/origin/main \
              --format='%(refname:strip=3)' \
              refs/remotes/origin \
            | sort -u
          )

          deleted=0
          preserved=0

          for branch in "${branches[@]}"; do
            [[ -n "$branch" ]] || continue

            case "$branch" in
              main|backup/*)
                echo "preserve: $branch"
                preserved=$((preserved + 1))
                continue
                ;;
            esac

            encoded=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
            code=$(curl --silent --show-error --output /tmp/delete-response.json --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}")

            if [[ "$code" == "204" || "$code" == "422" ]]; then
              if [[ "$code" == "204" ]]; then
                echo "deleted: $branch"
                deleted=$((deleted + 1))
              else
                echo "already absent or changed: $branch"
              fi
            else
              echo "failed ($code): $branch"
              cat /tmp/delete-response.json
              exit 1
            fi
          done

          {
            echo '## Repository-wide branch consolidation'
            echo "- Already merged tip groups found: ${ALREADY_MERGED:-0}"
            echo "- Patch-equivalent tip groups absorbed into main: ${ABSORBED:-0}"
            echo "- Branch groups preserved because they contain unique/complex work: ${PRESERVED_UNIQUE:-0}"
            echo "- Protected branch groups preserved: ${PRESERVED_PROTECTED:-0}"
            echo "- Fully merged branch refs deleted: ${deleted}"
            echo "- Protected merged refs preserved: ${preserved}"
            echo '- Safety rule: unique patches are never history-only merged or deleted.'
            if [[ -s ../unique-branches.txt ]]; then
              echo
              echo '### Preserved unique branch representatives'
              echo '```text'
              head -100 ../unique-branches.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
