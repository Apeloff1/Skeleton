name: Prune merged branches safely

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]

# Keep one cleanup sweep alive while main is moving rapidly. New triggers
# coalesce behind the active worker instead of repeatedly cancelling it.
concurrency:
  group: branch-clean-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    name: Delete only proven-redundant branch refs
    # Keep branch maintenance off the normal x64 pool so heavy test traffic
    # cannot starve cleanup. The workflow uses only git, gh, and bash.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch complete branch graph
        shell: bash
        run: |
          set -euo pipefail

          auth_dir="$RUNNER_TEMP/branch-clean-auth"
          mkdir -p "$auth_dir"
          cat > "$auth_dir/askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$auth_dir/askpass.sh"
          export GIT_ASKPASS="$auth_dir/askpass.sh"
          export GIT_ASKPASS_REQUIRE=force
          {
            echo "GIT_ASKPASS=$GIT_ASKPASS"
            echo 'GIT_ASKPASS_REQUIRE=force'
          } >> "$GITHUB_ENV"

          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Classify and prune proven-redundant branches
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          main_ref=refs/remotes/origin/main
          max_rounds=8
          delete_batch_size=32

          declare -A open_pr_heads=()
          declare -A merged_pr_tips=()
          declare -A merged_pr_branches=()

          load_open_pr_heads() {
            local branch
            open_pr_heads=()
            while IFS= read -r branch; do
              [[ -n "$branch" ]] || continue
              open_pr_heads["$branch"]=1
            done < <(
              gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
                --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .head.ref'
            )
          }

          load_merged_pr_tips() {
            local branch tip
            merged_pr_tips=()
            merged_pr_branches=()
            while IFS=$'\t' read -r branch tip; do
              [[ -n "$branch" && -n "$tip" ]] || continue
              merged_pr_tips["${branch}:${tip}"]=1
              merged_pr_branches["$branch"]=1
            done < <(
              gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100&sort=updated&direction=desc" \
                --jq '.[] | select(.merged_at != null and .head.repo.full_name == .base.repo.full_name) | [.head.ref, .head.sha] | @tsv'
            )
          }

          for ((round=1; round<=max_rounds; round++)); do
            # Refresh every branch before each classification round. This makes
            # one active worker chase a rapidly moving repository instead of
            # giving up and waiting for a future trigger to hit a quiet window.
            git fetch --quiet --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
            classified_main=$(git rev-parse "$main_ref")

            delete_branches=()
            delete_tips=()
            merged_pr_count=0
            aligned_merged_count=0
            ancestor_unproven_count=0
            unique_count=0
            protected_count=0
            open_pr_count=0
            late_open_pr_count=0
            : > ../preserved-branches.txt

            load_open_pr_heads
            load_merged_pr_tips

            while read -r tip branch; do
              [[ -n "$tip" && -n "$branch" ]] || continue

              # Permanent coordination/release refs are never cleanup candidates.
              # Every other deletion requires merged-PR history plus either an
              # exact historical merged head or exact alignment with current main.
              # Alignment is safe to prune because there is no unique branch commit,
              # while the expected-tip lease below protects against a new commit race.
              case "$branch" in
                main|develop|release/*|keep/*)
                  protected_count=$((protected_count + 1))
                  printf '%s %s protected-name\n' "$branch" "$tip" >> ../preserved-branches.txt
                  continue
                  ;;
              esac

              if [[ -n "${open_pr_heads[$branch]+x}" ]]; then
                open_pr_count=$((open_pr_count + 1))
                printf '%s %s open-pr-head\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi

              if [[ -n "${merged_pr_tips[${branch}:${tip}]+x}" ]]; then
                merged_pr_count=$((merged_pr_count + 1))
                delete_branches+=("$branch")
                delete_tips+=("$tip")
              elif [[ "$tip" == "$classified_main" && -n "${merged_pr_branches[$branch]+x}" ]]; then
                aligned_merged_count=$((aligned_merged_count + 1))
                delete_branches+=("$branch")
                delete_tips+=("$tip")
              elif git merge-base --is-ancestor "$tip" "$main_ref"; then
                ancestor_unproven_count=$((ancestor_unproven_count + 1))
                printf '%s %s ancestor-without-merged-pr-proof\n' "$branch" "$tip" >> ../preserved-branches.txt
              elif [[ "$branch" == backup/* ]]; then
                protected_count=$((protected_count + 1))
                printf '%s %s protected-backup-unmerged\n' "$branch" "$tip" >> ../preserved-branches.txt
              else
                unique_count=$((unique_count + 1))
                printf '%s %s unique-or-unproven\n' "$branch" "$tip" >> ../preserved-branches.txt
              fi
            done < <(git for-each-ref --format='%(objectname) %(refname:strip=3)' refs/remotes/origin | sort -k2,2)

            # Verify the classification against the live main tip. If main moved,
            # retry inside this same worker rather than exiting immediately.
            git fetch --quiet --no-tags --filter=blob:none origin '+refs/heads/main:refs/remotes/origin/main'
            current_main=$(git rev-parse "$main_ref")
            if [[ "$current_main" != "$classified_main" ]]; then
              {
                echo "- round $round/$max_rounds deferred: main moved from \`$classified_main\` to \`$current_main\`; no refs deleted."
              } >> "$GITHUB_STEP_SUMMARY"
              if (( round < max_rounds )); then
                sleep 1
                continue
              fi
              {
                echo
                echo '## Branch cleanup remains live'
                echo "- main moved during all $max_rounds in-run classification attempts."
                echo '- No stale classification was used for deletion.'
                echo '- The coalesced pending run and five-minute schedule will continue immediately.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # A PR opened during classification wins over cleanup.
            load_open_pr_heads
            safe_delete_branches=()
            safe_delete_tips=()
            for ((i=0; i<${#delete_branches[@]}; i++)); do
              branch="${delete_branches[$i]}"
              tip="${delete_tips[$i]}"
              if [[ -n "${open_pr_heads[$branch]+x}" ]]; then
                late_open_pr_count=$((late_open_pr_count + 1))
                printf '%s %s open-pr-head-late\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi
              safe_delete_branches+=("$branch")
              safe_delete_tips+=("$tip")
            done

            deleted=0
            raced_or_blocked=0
            for ((offset=0; offset<${#safe_delete_branches[@]}; offset+=delete_batch_size)); do
              batch_branches=("${safe_delete_branches[@]:offset:delete_batch_size}")
              batch_tips=("${safe_delete_tips[@]:offset:delete_batch_size}")
              lease_args=()
              refspecs=()

              for ((i=0; i<${#batch_branches[@]}; i++)); do
                branch="${batch_branches[$i]}"
                tip="${batch_tips[$i]}"
                lease_args+=("--force-with-lease=refs/heads/${branch}:${tip}")
                refspecs+=(":refs/heads/${branch}")
              done

              if git push --quiet --atomic "${lease_args[@]}" origin "${refspecs[@]}"; then
                deleted=$((deleted + ${#batch_branches[@]}))
                continue
              fi

              # Isolate a moved/protected ref instead of blocking the rest.
              for ((i=0; i<${#batch_branches[@]}; i++)); do
                branch="${batch_branches[$i]}"
                tip="${batch_tips[$i]}"
                if git push --quiet "--force-with-lease=refs/heads/${branch}:${tip}" origin ":refs/heads/${branch}"; then
                  deleted=$((deleted + 1))
                else
                  raced_or_blocked=$((raced_or_blocked + 1))
                fi
              done
            done

            {
              echo '## Safe branch pruning'
              echo "- Stable classification round: $round/$max_rounds"
              echo "- main tip: \`$current_main\`"
              echo "- Exact merged-PR head refs eligible: $merged_pr_count"
              echo "- Main-aligned refs with merged-PR history eligible: $aligned_merged_count"
              echo "- Ancestor-only refs preserved: $ancestor_unproven_count"
              echo "- Unique/unproven branch refs preserved: $unique_count"
              echo "- Long-lived or still-unique backup refs preserved: $protected_count"
              echo "- Open-PR branch refs preserved during classification: $open_pr_count"
              echo "- Newly-opened PR branch refs preserved before deletion: $late_open_pr_count"
              echo "- Branch refs deleted: $deleted"
              echo "- Moved or server-protected refs preserved at deletion time: $raced_or_blocked"
              echo '- main is never modified by this workflow.'
              echo '- Ancestry alone is never sufficient deletion proof.'
              echo '- Main alignment requires historical merged-PR evidence for that branch name.'
              echo '- Patch-equivalence heuristics are not used for deletion.'
              echo '- Every deletion uses an expected-tip lease.'
              if [[ -s ../preserved-branches.txt ]]; then
                echo
                echo '### Preserved branch sample'
                echo '```text'
                head -100 ../preserved-branches.txt
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done
