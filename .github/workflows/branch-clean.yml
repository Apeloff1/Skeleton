name: One-shot merged branch cleanup
# Sweep trigger: 2026-09-15 consolidated-main cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-clean.yml'

permissions: {}

jobs:
  clean-merged-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Discover fully merged branches
        shell: bash
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

          mapfile -t branches < <(
            git for-each-ref \
              --merged refs/remotes/origin/main \
              --format='%(refname:strip=3)' \
              refs/remotes/origin \
            | sort -u
          )

          printf '%s\n' "${branches[@]}" > ../merged-branches.txt

      - name: Delete safely merged branch refs
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          preserved=0

          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue

            case "$branch" in
              main|backup/*)
                echo "preserve: $branch"
                preserved=$((preserved + 1))
                continue
                ;;
            esac

            encoded=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
            code=$(curl --silent --show-error --output /tmp/delete-response.json --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}")

            if [[ "$code" == "204" ]]; then
              echo "deleted: $branch"
              deleted=$((deleted + 1))
            else
              echo "failed ($code): $branch"
              cat /tmp/delete-response.json
              exit 1
            fi
          done < merged-branches.txt

          {
            echo '## Branch cleanup'
            echo "- Deleted merged branches: ${deleted}"
            echo "- Preserved protected patterns: ${preserved}"
            echo '- Rule: branch tip had to be fully contained in `main`.'
          } >> "$GITHUB_STEP_SUMMARY"
