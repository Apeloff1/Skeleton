name: Prune redundant branches safely

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]

# Keep one cleanup sweep alive while main is moving rapidly. New triggers
# coalesce behind the active worker instead of repeatedly cancelling it.
concurrency:
  group: branch-clean-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    name: Delete refs with no unique commits
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'
      BRANCH_CLEAN_GRACE_SECONDS: '1800'
    steps:
      - name: Fetch complete branch graph
        shell: bash
        run: |
          set -euo pipefail

          auth_dir="$RUNNER_TEMP/branch-clean-auth"
          mkdir -p "$auth_dir"
          cat > "$auth_dir/askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$auth_dir/askpass.sh"
          export GIT_ASKPASS="$auth_dir/askpass.sh"
          export GIT_ASKPASS_REQUIRE=force
          {
            echo "GIT_ASKPASS=$GIT_ASKPASS"
            echo 'GIT_ASKPASS_REQUIRE=force'
          } >> "$GITHUB_ENV"

          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Classify and prune redundant refs
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          main_ref=refs/remotes/origin/main
          max_rounds=8
          delete_batch_size=32

          if [[ ! "$BRANCH_CLEAN_GRACE_SECONDS" =~ ^[0-9]+$ ]]; then
            echo 'BRANCH_CLEAN_GRACE_SECONDS must be a non-negative integer.' >&2
            exit 1
          fi

          declare -A open_pr_heads=()
          declare -A recent_branch_creations=()

          load_open_pr_heads() {
            local branch
            open_pr_heads=()
            while IFS= read -r branch; do
              [[ -n "$branch" ]] || continue
              open_pr_heads["$branch"]=1
            done < <(
              gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
                --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | .head.ref'
            )
          }

          load_recent_branch_creations() {
            local events_file ref created created_epoch now_epoch age
            events_file="$RUNNER_TEMP/branch-create-events.tsv"
            recent_branch_creations=()
            now_epoch=$(date -u +%s)

            # Repository CreateEvent timestamps give newly created refs a real
            # grace period even when their starting commit is old. If this
            # safety signal is unavailable, defer cleanup instead of guessing.
            if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/events?per_page=100" \
              --jq '.[] | select(.type == "CreateEvent" and .payload.ref_type == "branch") | [.payload.ref, .created_at] | @tsv' \
              > "$events_file"; then
              echo '::warning::Branch cleanup could not load repository CreateEvent history; no refs will be deleted.'
              return 1
            fi

            while IFS=$'\t' read -r ref created; do
              [[ -n "$ref" && -n "$created" ]] || continue
              if ! created_epoch=$(date -u -d "$created" +%s 2>/dev/null); then
                continue
              fi
              age=$((now_epoch - created_epoch))
              if (( age < 0 || age < BRANCH_CLEAN_GRACE_SECONDS )); then
                recent_branch_creations["$ref"]=1
              fi
            done < "$events_file"
          }

          for ((round=1; round<=max_rounds; round++)); do
            # Refresh every branch before classification. If main moves during
            # the pass we retry without deleting anything from stale ancestry.
            git fetch --quiet --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
            classified_main=$(git rev-parse "$main_ref")

            delete_branches=()
            delete_tips=()
            ancestor_count=0
            exact_main_count=0
            recent_creation_count=0
            recent_tip_count=0
            unknown_tip_age_count=0
            unique_count=0
            protected_count=0
            open_pr_count=0
            late_open_pr_count=0
            : > ../preserved-branches.txt

            load_open_pr_heads
            if ! load_recent_branch_creations; then
              {
                echo '## Safe branch pruning deferred'
                echo '- Repository CreateEvent history was unavailable.'
                echo '- No branch refs were deleted because creation-age safety could not be established.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            while read -r tip branch; do
              [[ -n "$tip" && -n "$branch" ]] || continue

              # Preserve explicit coordination, deployment, publication, and
              # backup refs. Everything else may be removed only when all of its
              # commits are already reachable from main.
              case "$branch" in
                main|master|develop|development|staging|production|prod|gh-pages|release/*|keep/*|backup/*|archive/*)
                  protected_count=$((protected_count + 1))
                  printf '%s %s protected-name\n' "$branch" "$tip" >> ../preserved-branches.txt
                  continue
                  ;;
              esac

              # Never mutate a branch that currently backs an open same-repo PR.
              if [[ -n "${open_pr_heads[$branch]+x}" ]]; then
                open_pr_count=$((open_pr_count + 1))
                printf '%s %s open-pr-head\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi

              # A branch may exist briefly before its first commit or PR. Honor
              # its repository CreateEvent before considering ancestry cleanup.
              if [[ -n "${recent_branch_creations[$branch]+x}" ]]; then
                recent_creation_count=$((recent_creation_count + 1))
                printf '%s %s recent-create-event\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi

              # Exact-main refs are ambiguous: they may be freshly created work
              # branches that have not received their first commit yet. Preserve
              # them until main moves; the ancestor path below will clean them
              # later after the grace period expires.
              if [[ "$tip" == "$classified_main" ]]; then
                exact_main_count=$((exact_main_count + 1))
                printf '%s %s exact-current-main\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              elif git merge-base --is-ancestor "$tip" "$main_ref"; then
                # A recent default-history tip is a second safety signal for a
                # new branch if CreateEvent delivery is delayed. Only old,
                # already-merged tips can enter the deletion candidate set.
                committed_at=$(git show -s --format=%cI "$tip" 2>/dev/null || true)
                if [[ -z "$committed_at" ]] || ! committed_epoch=$(date -u -d "$committed_at" +%s 2>/dev/null); then
                  unknown_tip_age_count=$((unknown_tip_age_count + 1))
                  printf '%s %s tip-age-unavailable\n' "$branch" "$tip" >> ../preserved-branches.txt
                  continue
                fi
                now_epoch=$(date -u +%s)
                tip_age=$((now_epoch - committed_epoch))
                if (( tip_age < 0 || tip_age < BRANCH_CLEAN_GRACE_SECONDS )); then
                  recent_tip_count=$((recent_tip_count + 1))
                  printf '%s %s recent-merged-tip\n' "$branch" "$tip" >> ../preserved-branches.txt
                  continue
                fi

                # Every commit reachable from this branch tip is already
                # reachable from main, and both creation/tip grace checks have
                # passed, so deleting only the ref cannot discard unique work.
                ancestor_count=$((ancestor_count + 1))
                delete_branches+=("$branch")
                delete_tips+=("$tip")
              else
                unique_count=$((unique_count + 1))
                printf '%s %s unique-or-diverged\n' "$branch" "$tip" >> ../preserved-branches.txt
              fi
            done < <(git for-each-ref --format='%(objectname) %(refname:strip=3)' refs/remotes/origin | sort -k2,2)

            # Do not act on ancestry calculated against an old main tip.
            git fetch --quiet --no-tags --filter=blob:none origin '+refs/heads/main:refs/remotes/origin/main'
            current_main=$(git rev-parse "$main_ref")
            if [[ "$current_main" != "$classified_main" ]]; then
              {
                echo "- round $round/$max_rounds deferred: main moved from \`$classified_main\` to \`$current_main\`; no refs deleted."
              } >> "$GITHUB_STEP_SUMMARY"
              if (( round < max_rounds )); then
                sleep 1
                continue
              fi
              {
                echo
                echo '## Branch cleanup remains live'
                echo "- main moved during all $max_rounds in-run classification attempts."
                echo '- No stale ancestry result was used for deletion.'
                echo '- The queued/scheduled cleanup run will retry.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # A PR opened during classification wins over cleanup.
            load_open_pr_heads
            safe_delete_branches=()
            safe_delete_tips=()
            for ((i=0; i<${#delete_branches[@]}; i++)); do
              branch="${delete_branches[$i]}"
              tip="${delete_tips[$i]}"
              if [[ -n "${open_pr_heads[$branch]+x}" ]]; then
                late_open_pr_count=$((late_open_pr_count + 1))
                printf '%s %s open-pr-head-late\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi
              safe_delete_branches+=("$branch")
              safe_delete_tips+=("$tip")
            done

            deleted=0
            raced_or_blocked=0
            for ((offset=0; offset<${#safe_delete_branches[@]}; offset+=delete_batch_size)); do
              batch_branches=("${safe_delete_branches[@]:offset:delete_batch_size}")
              batch_tips=("${safe_delete_tips[@]:offset:delete_batch_size}")
              lease_args=()
              refspecs=()

              for ((i=0; i<${#batch_branches[@]}; i++)); do
                branch="${batch_branches[$i]}"
                tip="${batch_tips[$i]}"
                lease_args+=("--force-with-lease=refs/heads/${branch}:${tip}")
                refspecs+=(":refs/heads/${branch}")
              done

              if git push --quiet --atomic "${lease_args[@]}" origin "${refspecs[@]}"; then
                deleted=$((deleted + ${#batch_branches[@]}))
                continue
              fi

              # Isolate a moved or ruleset-protected ref instead of blocking the
              # rest of the batch. The expected-tip lease prevents deleting a
              # branch that received a new commit after classification.
              for ((i=0; i<${#batch_branches[@]}; i++)); do
                branch="${batch_branches[$i]}"
                tip="${batch_tips[$i]}"
                if git push --quiet "--force-with-lease=refs/heads/${branch}:${tip}" origin ":refs/heads/${branch}"; then
                  deleted=$((deleted + 1))
                else
                  raced_or_blocked=$((raced_or_blocked + 1))
                fi
              done
            done

            {
              echo '## Safe branch pruning'
              echo "- Stable classification round: $round/$max_rounds"
              echo "- main tip: \`$current_main\`"
              echo "- Recent branch creations preserved: $recent_creation_count"
              echo "- Exact-current-main refs preserved: $exact_main_count"
              echo "- Recent merged-tip refs preserved: $recent_tip_count"
              echo "- Unknown tip-age refs preserved: $unknown_tip_age_count"
              echo "- Older ancestor refs eligible: $ancestor_count"
              echo "- Unique/diverged refs preserved: $unique_count"
              echo "- Long-lived/release/backup refs preserved: $protected_count"
              echo "- Open-PR refs preserved during classification: $open_pr_count"
              echo "- Newly opened PR refs preserved before deletion: $late_open_pr_count"
              echo "- Branch refs deleted: $deleted"
              echo "- Moved or server-protected refs preserved at deletion time: $raced_or_blocked"
              echo "- New-branch grace period: ${BRANCH_CLEAN_GRACE_SECONDS}s"
              echo '- main is never modified by this workflow.'
              echo '- A non-protected branch is eligible only when its tip is an old ancestor of main after creation/tip grace checks.'
              echo '- Open PR heads are never cleanup candidates.'
              echo '- Every deletion uses an expected-tip lease.'
              if [[ -s ../preserved-branches.txt ]]; then
                echo
                echo '### Preserved branch sample'
                echo '```text'
                head -100 ../preserved-branches.txt
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done
