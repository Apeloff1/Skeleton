name: Prune redundant branches safely

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Actions Housekeeping CLI"]
    types: [completed]
    branches:
      - "*"
      - "**"
  schedule:
    # Avoid push-storm starvation: one durable cleanup sweep every five minutes.
    - cron: '3-58/5 * * * *'
  push:
    branches: [main]
    # Immediate kick only when this maintenance workflow itself changes.
    paths: ['.github/workflows/branch-clean.yml']

# Keep one cleanup sweep alive while main is moving rapidly. New triggers
# coalesce behind the active worker instead of repeatedly cancelling it.
concurrency:
  # v4 isolates the corrected fail-closed pruning from provider-stuck v3 runs.
  # New wakes coalesce; open-PR checks and exact-tip leases remain mandatory.
  group: branch-clean-v4-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    name: Delete refs with no unique commits
    # Use independent ARM recovery capacity while x64 validation is saturated.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'
      BRANCH_CLEAN_GRACE_SECONDS: '1800'
    steps:
      - name: Fetch complete branch graph
        shell: bash
        run: |
          set -euo pipefail

          auth_dir="$RUNNER_TEMP/branch-clean-auth"
          mkdir -p "$auth_dir"
          cat > "$auth_dir/askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$auth_dir/askpass.sh"
          export GIT_ASKPASS="$auth_dir/askpass.sh"
          export GIT_ASKPASS_REQUIRE=force
          {
            echo "GIT_ASKPASS=$GIT_ASKPASS"
            echo 'GIT_ASKPASS_REQUIRE=force'
          } >> "$GITHUB_ENV"

          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Classify and prune redundant refs
        shell: bash
        run: |
          set -euo pipefail
          cd repo

          main_ref=refs/remotes/origin/main
          max_rounds=8
          delete_batch_size=32

          if [[ ! "$BRANCH_CLEAN_GRACE_SECONDS" =~ ^[0-9]+$ ]]; then
            echo 'BRANCH_CLEAN_GRACE_SECONDS must be a non-negative integer.' >&2
            exit 1
          fi

          declare -A open_pr_heads=()
          declare -A open_pr_bases=()
          declare -A merged_pr_head_tips=()
          declare -A branch_creation_epochs=()
          declare -A branch_deletion_epochs=()

          load_open_pr_refs() {
            local head base refs_file candidate_file
            refs_file="$RUNNER_TEMP/open-pr-refs.tsv"
            candidate_file="$RUNNER_TEMP/open-pr-refs.candidate.tsv"

            # Head/base pairs must come from the same completed API snapshot.
            # Two paginated requests can observe different PR generations,
            # and unnecessarily double request pressure during a queue storm.
            if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | [.head.ref, .base.ref] | @tsv' \
              > "$candidate_file"; then
              rm -f "$candidate_file"
              echo '::warning::Branch cleanup could not load complete open pull-request refs; no further refs will be deleted.'
              return 1
            fi
            if ! mv -f "$candidate_file" "$refs_file"; then
              echo '::warning::Branch cleanup could not promote the open pull-request snapshot.'
              return 1
            fi
            open_pr_heads=()
            open_pr_bases=()
            while IFS=$'\t' read -r head base; do
              [[ -n "$head" && -n "$base" ]] || continue
              open_pr_heads["$head"]=1
              if [[ "$base" != main ]]; then
                open_pr_bases["$base"]=1
              fi
            done < "$refs_file"
          }

          load_merged_pr_head_tips() {
            local branch tip merged_file merged_cutoff
            merged_file="$RUNNER_TEMP/merged-pr-heads.tsv"
            merged_pr_head_tips=()
            # Only main-targeted historical squash merges qualify after the same
            # grace interval that applies to branch creation and tip age.
            merged_cutoff=$(date -u -d "${BRANCH_CLEAN_GRACE_SECONDS} seconds ago" '+%Y-%m-%dT%H:%M:%SZ') || return 1
            if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
              --jq ".[] | select(.merged_at != null and .merged_at <= \"$merged_cutoff\" and .base.ref == \"main\" and .head.repo.full_name == .base.repo.full_name) | [.head.ref, .head.sha] | @tsv" \
              > "$merged_file"; then
              echo '::warning::Branch cleanup could not load merged pull-request heads; no refs will be deleted.'
              return 1
            fi
            while IFS=$'\t' read -r branch tip; do
              [[ -n "$branch" && -n "$tip" ]] || continue
              merged_pr_head_tips["${branch}:${tip}"]=1
            done < "$merged_file"
          }

          load_branch_creation_history() {
            local events_file kind ref created created_epoch prior
            events_file="$RUNNER_TEMP/branch-ref-events.tsv"
            branch_creation_epochs=()
            branch_deletion_epochs=()

            # Repository events are bounded history. Absence of a CreateEvent
            # means age is unknown, never "old enough". DeleteEvent tracking
            # prevents a delayed recreate event from inheriting stale age.
            if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/events?per_page=100" \
              --jq '.[] | select((.type == "CreateEvent" or .type == "DeleteEvent") and .payload.ref_type == "branch") | [.type, .payload.ref, .created_at] | @tsv' \
              > "$events_file"; then
              echo '::warning::Branch cleanup could not load repository branch event history; no refs will be deleted.'
              return 1
            fi

            while IFS=$'\t' read -r kind ref created; do
              [[ -n "$kind" && -n "$ref" && -n "$created" ]] || continue
              if ! created_epoch=$(date -u -d "$created" +%s 2>/dev/null); then
                continue
              fi
              if [[ "$kind" == "CreateEvent" ]]; then
                prior="${branch_creation_epochs[$ref]:-}"
                if [[ -z "$prior" ]] || (( created_epoch > prior )); then
                  branch_creation_epochs["$ref"]="$created_epoch"
                fi
              elif [[ "$kind" == "DeleteEvent" ]]; then
                prior="${branch_deletion_epochs[$ref]:-}"
                if [[ -z "$prior" ]] || (( created_epoch > prior )); then
                  branch_deletion_epochs["$ref"]="$created_epoch"
                fi
              fi
            done < "$events_file"
          }

          for ((round=1; round<=max_rounds; round++)); do
            # Refresh every branch before classification. If main moves during
            # the pass we retry without deleting anything from stale ancestry.
            git fetch --quiet --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
            classified_main=$(git rev-parse "$main_ref")

            delete_branches=()
            delete_tips=()
            ancestor_count=0
            exact_main_count=0
            merged_pr_tip_count=0
            identical_tree_count=0
            recent_creation_count=0
            unknown_creation_count=0
            historical_ancestor_count=0
            merged_without_create_count=0
            delayed_create_count=0
            recent_tip_count=0
            unknown_tip_age_count=0
            unique_count=0
            protected_count=0
            open_pr_count=0
            open_pr_base_count=0
            late_open_pr_count=0
            late_open_pr_base_count=0
            : > ../preserved-branches.txt
            # All deletion paths, including mature merged PRs without CreateEvents,
            # require a defined current epoch for the tip-age grace check.
            now_epoch=$(date -u +%s) || exit 1

            if ! load_open_pr_refs; then
              {
                echo '## Safe branch pruning deferred'
                echo '- Open pull-request refs were unavailable.'
                echo '- No branch refs were deleted because PR protection could not be established.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! load_merged_pr_head_tips; then
              {
                echo '## Safe branch pruning deferred'
                echo '- Merged pull-request head evidence was unavailable.'
                echo '- No branch refs were deleted because merged-PR safety could not be established.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! load_branch_creation_history; then
              {
                echo '## Safe branch pruning deferred'
                echo '- Repository branch creation history was unavailable.'
                echo '- No branch refs were deleted because creation-age safety could not be established.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            while read -r tip branch; do
              [[ -n "$tip" && -n "$branch" ]] || continue

              # Preserve explicit coordination, deployment, publication, and
              # backup refs. Other refs are eligible only with fresh PR/age checks
              # and established ancestry, identical tree, or exact merged-PR proof.
              case "$branch" in
                main|master|develop|development|staging|production|prod|gh-pages|release/*|keep/*|backup/*|archive/*)
                  protected_count=$((protected_count + 1))
                  printf '%s %s protected-name\n' "$branch" "$tip" >> ../preserved-branches.txt
                  continue
                  ;;
              esac

              # Never mutate a branch that currently backs or bases an open
              # same-repository PR. Stacked PRs rely on non-main base refs.
              if [[ -n "${open_pr_heads[$branch]+x}" ]]; then
                open_pr_count=$((open_pr_count + 1))
                printf '%s %s open-pr-head\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi
              if [[ -n "${open_pr_bases[$branch]+x}" ]]; then
                open_pr_base_count=$((open_pr_base_count + 1))
                printf '%s %s open-pr-base\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi

              # CreateEvents expire from GitHub's bounded event history.
              # An absent event is not a reason to retain proven historical
              # ancestors forever. Keep all unknown fresh or divergent tips.
              merged_key="${branch}:${tip}"
              now_epoch=$(date -u +%s)
              if [[ -z "${branch_creation_epochs[$branch]+x}" ]]; then
                # Commit age is not creation age. Preserve a branch lacking
                # creation events unless a matching merged PR proves its tip.
                if [[ -z "${merged_pr_head_tips[$merged_key]+x}" ]]; then
                  unknown_creation_count=$((unknown_creation_count + 1))
                  printf '%s %s creation-age-unknown\n' "$branch" "$tip" >> ../preserved-branches.txt
                  continue
                fi
                merged_without_create_count=$((merged_without_create_count + 1))
              else
                creation_epoch="${branch_creation_epochs[$branch]}"
                deletion_epoch="${branch_deletion_epochs[$branch]:-}"
                if [[ -n "$deletion_epoch" ]] && (( deletion_epoch >= creation_epoch )); then
                  delayed_create_count=$((delayed_create_count + 1))
                  printf '%s %s delayed-create-event\n' "$branch" "$tip" >> ../preserved-branches.txt
                  continue
                fi
                now_epoch=$(date -u +%s)
                creation_age=$((now_epoch - creation_epoch))
                if (( creation_age < 0 || creation_age < BRANCH_CLEAN_GRACE_SECONDS )); then
                  recent_creation_count=$((recent_creation_count + 1))
                  printf '%s %s recent-create-event\n' "$branch" "$tip" >> ../preserved-branches.txt
                  continue
                fi
              fi

              # A branch equal to current main may simply be waiting for its
              # first unique commit. Preserve it even after the grace period.
              if [[ "$tip" == "$classified_main" ]]; then
                exact_main_count=$((exact_main_count + 1))
                printf '%s %s exact-current-main\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi

              # Commit age is an additional preservation signal, never a
              # substitute for missing creation-age evidence.
              committed_at=$(git show -s --format=%cI "$tip" 2>/dev/null || true)
              if [[ -z "$committed_at" ]] || ! committed_epoch=$(date -u -d "$committed_at" +%s 2>/dev/null); then
                unknown_tip_age_count=$((unknown_tip_age_count + 1))
                printf '%s %s tip-age-unavailable\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi
              tip_age=$((now_epoch - committed_epoch))
              if (( tip_age < 0 || tip_age < BRANCH_CLEAN_GRACE_SECONDS )); then
                recent_tip_count=$((recent_tip_count + 1))
                printf '%s %s recent-tip\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi

              # Squash/rebase merges do not make the original branch tip an
              # ancestor of main. A closed merged PR is an additional safe
              # deletion proof only when the live branch still points at the
              # exact head SHA GitHub recorded for that merged PR.
              merged_key="${branch}:${tip}"
              if [[ -n "${merged_pr_head_tips[$merged_key]+x}" ]]; then
                merged_pr_tip_count=$((merged_pr_tip_count + 1))
                delete_branches+=("$branch")
                delete_tips+=("$tip")
              elif git merge-base --is-ancestor "$tip" "$main_ref"; then
                ancestor_count=$((ancestor_count + 1))
                delete_branches+=("$branch")
                delete_tips+=("$tip")
              elif [[ "$(git rev-parse "$tip^{tree}")" == "$(git rev-parse "$main_ref^{tree}")" ]]; then
                identical_tree_count=$((identical_tree_count + 1))
                delete_branches+=("$branch")
                delete_tips+=("$tip")
              else
                unique_count=$((unique_count + 1))
                printf '%s %s unique-or-diverged\n' "$branch" "$tip" >> ../preserved-branches.txt
              fi
            done < <(git for-each-ref --format='%(objectname) %(refname:strip=3)' refs/remotes/origin | sort -k2,2)

            # Classifications against an earlier main remain sound if current
          # main is a *descendant*. Reject a rewritten/divergent main, not an
          # ordinary fast-forward from an unrelated parallel merge.
          git fetch --quiet --no-tags --filter=blob:none origin '+refs/heads/main:refs/remotes/origin/main'
          current_main=$(git rev-parse "$main_ref")
          if [[ "$current_main" != "$classified_main" ]]; then
            if git merge-base --is-ancestor "$classified_main" "$current_main"; then
              echo "- round $round/$max_rounds: main fast-forwarded; original ancestor/tree evidence is still reachable." >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "- round $round/$max_rounds deferred: main was rewritten/diverged from \u0060$classified_main\u0060 to \u0060$current_main\u0060; no refs deleted."
              } >> "$GITHUB_STEP_SUMMARY"
              if (( round < max_rounds )); then
                sleep 1
                continue
              fi
              {
                echo
                echo '## Branch cleanup deferred'
                echo '- Main history was not a fast-forward during all classification attempts.'
                echo '- No refs were deleted using stale ancestry.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

            # A PR opened during classification wins over cleanup. Fail closed
            # if late revalidation cannot re-establish both head and base refs.
            if ! load_open_pr_refs; then
              {
                echo '## Safe branch pruning deferred'
                echo '- Late open pull-request revalidation failed.'
                echo '- No branch refs were deleted because PR protection could not be re-established.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            safe_delete_branches=()
            safe_delete_tips=()
            for ((i=0; i<${#delete_branches[@]}; i++)); do
              branch="${delete_branches[$i]}"
              tip="${delete_tips[$i]}"
              if [[ -n "${open_pr_heads[$branch]+x}" ]]; then
                late_open_pr_count=$((late_open_pr_count + 1))
                printf '%s %s open-pr-head-late\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi
              if [[ -n "${open_pr_bases[$branch]+x}" ]]; then
                late_open_pr_base_count=$((late_open_pr_base_count + 1))
                printf '%s %s open-pr-base-late\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
              fi
              safe_delete_branches+=("$branch")
              safe_delete_tips+=("$tip")
            done

            deleted=0
            raced_or_blocked=0
            for ((offset=0; offset<${#safe_delete_branches[@]}; offset+=delete_batch_size)); do
              # A fast-forward remains safe even during main churn. A history
              # rewrite, or failure to refresh main, stops all remaining writes.
              if ! git fetch --quiet --no-tags --filter=blob:none origin '+refs/heads/main:refs/remotes/origin/main'; then
                echo '::warning::Main refresh failed before deletion batch; stopping without further deletes.'
                exit 0
              fi
              live_main=$(git rev-parse "$main_ref")
              if ! git merge-base --is-ancestor "$classified_main" "$live_main"; then
                echo '::warning::Main was rewritten while pruning; stopping without further deletes.'
                exit 0
              fi
              # Open PRs can be created after classification. Re-read the
              # authoritative head/base inventory before each destructive batch.
              if ! load_open_pr_refs; then
                echo '::warning::Could not revalidate open PRs before deletion batch; stopping safely.'
                exit 0
              fi
              batch_branches=()
              batch_tips=()
              for ((i=offset; i<${#safe_delete_branches[@]} && i<offset+delete_batch_size; i++)); do
                branch="${safe_delete_branches[$i]}"
                tip="${safe_delete_tips[$i]}"
                if [[ -n "${open_pr_heads[$branch]+x}" ]]; then
                  late_open_pr_count=$((late_open_pr_count + 1))
                  continue
                fi
                if [[ -n "${open_pr_bases[$branch]+x}" ]]; then
                  late_open_pr_base_count=$((late_open_pr_base_count + 1))
                  continue
                fi
                batch_branches+=("$branch")
                batch_tips+=("$tip")
              done
              if (( ${#batch_branches[@]} == 0 )); then
                continue
              fi
              lease_args=()
              refspecs=()
              for ((i=0; i<${#batch_branches[@]}; i++)); do
                branch="${batch_branches[$i]}"
                tip="${batch_tips[$i]}"
                lease_args+=("--force-with-lease=refs/heads/${branch}:${tip}")
                refspecs+=(":refs/heads/${branch}")
              done

              if git push --quiet --atomic "${lease_args[@]}" origin "${refspecs[@]}"; then
                deleted=$((deleted + ${#batch_branches[@]}))
                continue
              fi

              # Atomic rejection may indicate a freshly opened PR, not just a
              # moved tip. Refresh protection before falling back to per-ref
              # expected-SHA leases; fail closed if the snapshot is missing.
              if ! load_open_pr_refs; then
                echo '::warning::Could not revalidate open PRs after atomic rejection; stopping safely.'
                exit 0
              fi
              for ((i=0; i<${#batch_branches[@]}; i++)); do
                branch="${batch_branches[$i]}"
                tip="${batch_tips[$i]}"
                if [[ -n "${open_pr_heads[$branch]+x}" ]]; then
                  late_open_pr_count=$((late_open_pr_count + 1))
                  continue
                fi
                if [[ -n "${open_pr_bases[$branch]+x}" ]]; then
                  late_open_pr_base_count=$((late_open_pr_base_count + 1))
                  continue
                fi
                if git push --quiet "--force-with-lease=refs/heads/${branch}:${tip}" origin ":refs/heads/${branch}"; then
                  deleted=$((deleted + 1))
                else
                  raced_or_blocked=$((raced_or_blocked + 1))
                fi
              done
            done

            {
              echo '## Safe branch pruning'
              echo "- Stable classification round: $round/$max_rounds"
              echo "- main tip: \`$current_main\`"
              echo "- Recent branch creations preserved: $recent_creation_count"
              echo "- Unknown creation-age refs preserved: $unknown_creation_count"
              echo "- Historical main-ancestor refs admitted without CreateEvents: $historical_ancestor_count"
              echo "- Mature merged-PR exact-head refs without CreateEvents: $merged_without_create_count"
              echo "- Delayed CreateEvent recreations preserved: $delayed_create_count"
              echo "- Exact-current-main refs preserved: $exact_main_count"
              echo "- Recent branch tips preserved: $recent_tip_count"
              echo "- Unknown tip-age refs preserved: $unknown_tip_age_count"
              echo "- Older ancestor refs eligible: $ancestor_count"
              echo "- Merged-PR exact-head refs eligible: $merged_pr_tip_count"
              echo "- Tree-identical divergent refs eligible: $identical_tree_count"
              echo "- Unique/diverged refs preserved: $unique_count"
              echo "- Long-lived/release/backup refs preserved: $protected_count"
              echo "- Open-PR head refs preserved during classification: $open_pr_count"
              echo "- Open-PR base refs preserved during classification: $open_pr_base_count"
              echo "- Newly opened PR head refs preserved before deletion: $late_open_pr_count"
              echo "- Newly opened PR base refs preserved before deletion: $late_open_pr_base_count"
              echo "- Branch refs deleted: $deleted"
              echo "- Moved or server-protected refs preserved at deletion time: $raced_or_blocked"
              echo "- New-branch grace period: ${BRANCH_CLEAN_GRACE_SECONDS}s"
              echo '- main is never modified by this workflow.'
              echo '- Exact-current-main branches are preserved so new work branches can receive their first commit safely.'
              echo '- A deletion candidate needs either known old creation age or a mature exact merged-PR head, plus an old tip and redundant content proof.'
              echo '- Unknown creation history preserves refs unless the exact mature merged-PR head is proven or the tip is a main ancestor committed at least seven days ago.'
              echo '- A DeleteEvent at or after the latest CreateEvent preserves the live ref as a delayed recreation.'
              echo '- Open PR heads and non-main open PR base branches are never cleanup candidates.'
              echo '- Every deletion batch and per-ref fallback revalidates active PR head/base protection.'
              echo '- Failure to load PR refs, merged-PR evidence, or branch-event history produces zero deletions.'
              echo '- Every deletion uses an expected-tip lease.'
              if [[ -s ../preserved-branches.txt ]]; then
                echo
                echo '### Preserved branch sample'
                echo '```text'
                head -100 ../preserved-branches.txt
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Branch prune: deleted=$deleted, historical_ancestors=$historical_ancestor_count, direct_ancestors=$ancestor_count, merged_pr_tips=$merged_pr_tip_count, preserved_unknown=$unknown_creation_count, preserved_unique=$unique_count, races=$raced_or_blocked"
            exit 0
          done
