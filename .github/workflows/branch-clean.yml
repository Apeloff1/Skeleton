name: Prune redundant branches

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-clean.yml'

concurrency:
  group: branch-clean-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    name: Delete only content-redundant branch refs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch complete branch graph
        shell: bash
        run: |
          set -euo pipefail
          auth_dir="$RUNNER_TEMP/branch-clean-auth"
          mkdir -p "$auth_dir"
          cat > "$auth_dir/askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$auth_dir/askpass.sh"
          export GIT_ASKPASS="$auth_dir/askpass.sh"
          export GIT_ASKPASS_REQUIRE=force
          {
            echo "GIT_ASKPASS=$GIT_ASKPASS"
            echo 'GIT_ASKPASS_REQUIRE=force'
          } >> "$GITHUB_ENV"
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Classify and prune redundant branches
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          main_ref=refs/remotes/origin/main
          classified_main=$(git rev-parse "$main_ref")
          declare -A classification=()
          delete_branches=()
          delete_tips=()
          ancestor_count=0
          equivalent_count=0
          unique_count=0
          protected_count=0
          : > ../preserved-branches.txt

          is_patch_equivalent() {
            local base="$1"
            local tip="$2"
            local merge_base
            if git diff --quiet "$base" "$tip"; then
              return 0
            fi
            merge_base=$(git merge-base "$base" "$tip" || true)
            [[ -n "$merge_base" ]] || return 1
            if git rev-list --merges "${merge_base}..${tip}" | grep -q .; then
              return 1
            fi
            ! git cherry "$base" "$tip" | grep -q '^+'
          }

          while read -r tip branch; do
            [[ -n "$tip" && -n "$branch" ]] || continue
            case "$branch" in
              main|develop|release/*|backup/*|keep/*)
                protected_count=$((protected_count + 1))
                printf '%s %s protected-name\n' "$branch" "$tip" >> ../preserved-branches.txt
                continue
                ;;
            esac

            if [[ -z "${classification[$tip]+x}" ]]; then
              if git merge-base --is-ancestor "$tip" "$main_ref"; then
                classification[$tip]='ancestor'
              elif is_patch_equivalent "$main_ref" "$tip"; then
                classification[$tip]='equivalent'
              else
                classification[$tip]='unique'
              fi
            fi

            case "${classification[$tip]}" in
              ancestor)
                ancestor_count=$((ancestor_count + 1))
                delete_branches+=("$branch")
                delete_tips+=("$tip")
                ;;
              equivalent)
                equivalent_count=$((equivalent_count + 1))
                delete_branches+=("$branch")
                delete_tips+=("$tip")
                ;;
              unique)
                unique_count=$((unique_count + 1))
                printf '%s %s unique-or-complex\n' "$branch" "$tip" >> ../preserved-branches.txt
                ;;
            esac
          done < <(git for-each-ref --format='%(objectname) %(refname:strip=3)' refs/remotes/origin | sort -k2,2)

          git fetch --quiet --no-tags --filter=blob:none origin '+refs/heads/main:refs/remotes/origin/main'
          current_main=$(git rev-parse "$main_ref")
          if [[ "$current_main" != "$classified_main" ]]; then
            {
              echo '## Branch cleanup deferred'
              echo '- main moved while branches were being classified.'
              echo '- No branch refs were deleted from the stale classification.'
              echo '- The next scheduled sweep will reclassify against the new main tip.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          deleted=0
          raced_or_blocked=0
          delete_batch_size=32
          for ((offset=0; offset<${#delete_branches[@]}; offset+=delete_batch_size)); do
            batch_branches=("${delete_branches[@]:offset:delete_batch_size}")
            batch_tips=("${delete_tips[@]:offset:delete_batch_size}")
            lease_args=()
            refspecs=()
            for ((i=0; i<${#batch_branches[@]}; i++)); do
              branch="${batch_branches[$i]}"
              tip="${batch_tips[$i]}"
              lease_args+=("--force-with-lease=refs/heads/${branch}:${tip}")
              refspecs+=(":refs/heads/${branch}")
            done

            if git push --quiet --atomic "${lease_args[@]}" origin "${refspecs[@]}"; then
              deleted=$((deleted + ${#batch_branches[@]}))
              continue
            fi

            for ((i=0; i<${#batch_branches[@]}; i++)); do
              branch="${batch_branches[$i]}"
              tip="${batch_tips[$i]}"
              if git push --quiet "--force-with-lease=refs/heads/${branch}:${tip}" origin ":refs/heads/${branch}"; then
                deleted=$((deleted + 1))
              else
                raced_or_blocked=$((raced_or_blocked + 1))
              fi
            done
          done

          {
            echo '## Redundant branch cleanup'
            echo "- Fully merged branch refs eligible: $ancestor_count"
            echo "- Patch-equivalent branch refs eligible: $equivalent_count"
            echo "- Unique/complex branch refs preserved: $unique_count"
            echo "- Long-lived/protected-name refs preserved: $protected_count"
            echo "- Branch refs deleted: $deleted"
            echo "- Moved or server-protected refs preserved at deletion time: $raced_or_blocked"
            echo '- main was never modified by this workflow.'
            echo '- Every deletion used an expected-tip lease.'
            if [[ -s ../preserved-branches.txt ]]; then
              echo
              echo '### Preserved branch sample'
              echo '```text'
              head -100 ../preserved-branches.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
