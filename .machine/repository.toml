[ignore]
prefixes = [
  ".git/",
  # Local runtime state, never source inventory. Canonical provenance remains indexed.
  ".skeleton/",
  "chronicle/",
  ".venv/",
  "venv/",
  "node_modules/",
  "frontend/node_modules/",
  "frontend/dist/",
  "frontend/.expo/",
  "skeleton.egg-info/",
  "dist/",
  "build/",
  "coverage/",
  ".pytest_cache/",
  ".mypy_cache/",
  ".ruff_cache/",
  "__pycache__/",
]
suffixes = [".pyc", ".pyo", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".pdf", ".zip", ".tar", ".gz"]
