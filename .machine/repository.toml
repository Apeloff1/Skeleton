[repository]
schema_version = 1
name = "Skeleton"
machine_root = ".machine"
default_owner = "automation-supervisor"
max_files = 50000
max_file_bytes = 2000000
max_context_bytes = 30000

[policy]
require_tests_for_code = true
require_readme_for_top_level_code = true
detect_dependency_cycles = true
detect_oversized_modules = true
oversized_python_lines = 1400
oversized_javascript_lines = 1800
oversized_generic_lines = 2400

[[zone]]
name = "automation"
prefixes = ["skeleton/automation/", ".github/workflows/", "backend/scripts/check_workflow_"]
owner = "automation-control-plane"
criticality = "critical"

[[zone]]
name = "jeeves"
prefixes = ["skeleton/jeeves/", "jeeves/", "core/jeeves/"]
owner = "jeeves-runtime"
criticality = "high"

[[zone]]
name = "backend"
prefixes = ["backend/"]
owner = "backend-runtime"
criticality = "high"

[[zone]]
name = "frontend"
prefixes = ["frontend/"]
owner = "frontend-runtime"
criticality = "medium"

[[zone]]
name = "core"
prefixes = ["core/"]
owner = "core-runtime"
criticality = "high"

[[zone]]
name = "tests"
prefixes = ["tests/", "skeleton/testing/", "backend/tests/"]
owner = "quality-plane"
criticality = "high"

[[zone]]
name = "github"
prefixes = [".github/"]
owner = "repository-control-plane"
criticality = "critical"

[[zone]]
name = "docs"
prefixes = ["docs/", "README", "CONTRIBUTING", "SECURITY"]
owner = "documentation-plane"
criticality = "medium"

[[zone]]
name = "tooling"
prefixes = ["scripts/", "tools/", "pyproject.toml", "package.json", "Makefile"]
owner = "developer-tooling"
criticality = "medium"

[ignore]
prefixes = [
  ".git/",
  ".venv/",
  "venv/",
  "node_modules/",
  "dist/",
  "build/",
  "coverage/",
  ".pytest_cache/",
  ".mypy_cache/",
  ".ruff_cache/",
  "__pycache__/",
]
suffixes = [".pyc", ".pyo", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".pdf", ".zip", ".tar", ".gz"]
