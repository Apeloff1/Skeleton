[repository]
schema_version = 1
name = "Skeleton"
machine_root = ".machine"
default_owner = "automation-supervisor"
max_files = 50000
max_file_bytes = 2000000
max_context_bytes = 30000

[policy]
require_tests_for_code = true
require_readme_for_top_level_code = true
detect_dependency_cycles = true
detect_oversized_modules = true
oversized_python_lines = 1400
oversized_javascript_lines = 1800
oversized_generic_lines = 2400

# Zone order is semantic: first match wins. Keep narrow/specific surfaces before
# broader families. Audience describes the primary navigation consumer, not an
# access-control boundary. Lifecycle is organizational state, not maturity.

[[zone]]
name = "repository-machine"
prefixes = [".machine/", "machine/", "skeleton/repo_machine/"]
owner = "repository-control-plane"
criticality = "high"
purpose = "Canonical repository taxonomy, machine-readable maps, topology, ownership and bounded stewardship."
audience = "machine"
lifecycle = "canonical"

[[zone]]
name = "github"
prefixes = [".github/"]
owner = "repository-control-plane"
criticality = "critical"
purpose = "GitHub Actions, repository policy, merge gates and hosted automation configuration."
audience = "both"
lifecycle = "canonical"

[[zone]]
name = "core-compat"
prefixes = ["core/"]
owner = "repository-control-plane"
criticality = "low"
purpose = "Compatibility-only top-level core namespace; canonical implementations live under skeleton/security and skeleton/automation."
audience = "internal"
lifecycle = "transitional"

[[zone]]
name = "security"
prefixes = ["skeleton/security/", "skeleton/vault/"]
owner = "security-plane"
criticality = "critical"
purpose = "Security policy/runtime primitives, authorization, vaulting and trust-boundary enforcement."
audience = "both"
lifecycle = "canonical"

