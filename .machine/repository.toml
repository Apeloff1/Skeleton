# Canonical machine-operable repository policy.
# This file is intentionally declarative and stdlib-parseable (tomllib).
schema_version = 1

[repository]
name = "Skeleton"
default_branch = "main"
language = "polyglot"
purpose = "AI game engine, agent orchestration framework, and autonomous repository system"
machine_index_version = "1"
canonical_product_roots = ["skeleton", "backend", "frontend", "core", "java-accelerators"]
canonical_test_roots = ["tests", "skeleton/testing", "backend/tests"]
canonical_doc_roots = ["docs"]
canonical_automation_roots = [".github/workflows", "skeleton/automation", "backend/scripts", "scripts"]
archive_roots = ["satellites/branch-snapshots", "docs/archive", "tests/legacy_root", "scripts/legacy_root"]
bulk_data_roots = ["backend/data", "memory/mongo_backup"]
entrypoint_files = ["pyproject.toml", "Makefile", "README.md", "docs/ARCHITECTURE.md"]

[scan]
follow_symlinks = false
max_file_bytes = 1048576
max_python_ast_bytes = 524288
max_text_probe_bytes = 32768
max_dependency_edges = 250000
max_files = 50000
hash_algorithm = "sha256"
include_suffixes = [
  ".py", ".pyi", ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs",
  ".rs", ".java", ".cs", ".gd", ".sh", ".bash", ".zsh",
  ".json", ".jsonl", ".toml", ".yaml", ".yml", ".md", ".txt",
  ".html", ".css", ".scss", ".sql", ".graphql", ".proto"
]
ignore_names = [
  "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache",
  "node_modules", ".next", "dist", "build", ".venv", "venv",
  ".git", ".idea", ".vscode"
]
generated_markers = [
  "generated", "autogenerated", "auto-generated", "do not edit",
  "machine generated", "codegen"
]

[policy]
unknown_path_action = "guarded"
unknown_dependency_action = "record"
cross_zone_dependency_action = "record"
require_machine_metadata_for_new_top_level_directory = true
require_subsystem_assignment_for_active_python = true
require_subsystem_assignment_for_active_typescript = true
fail_on_active_file_outside_canonical_roots = false
fail_on_archive_import_into_active_code = true
fail_on_product_import_from_tests = true
fail_on_control_plane_import_from_archive = true
max_unowned_active_files = 500
max_orphan_active_modules = 250
max_dependency_cycle_size = 30

[[zones]]
id = "control-plane"
description = "Repository authority, automation, CI, security and machine governance."
roots = [".github", "skeleton/automation", "backend/scripts", "scripts"]
kind = "control"
mutability = "guarded"
risk = "critical"
agent_default = "inspect"
allowed_actions = ["inspect", "diagnose", "test", "propose"]
required_evidence = ["targeted-tests", "workflow-contracts", "exact-head"]
tags = ["automation", "ci", "security", "governance"]

[[zones]]
id = "machine-control"
description = "Machine-readable repository model and its implementation."
roots = [".machine", "skeleton/repo_machine"]
kind = "control"
mutability = "guarded"
risk = "high"
agent_default = "maintain"
allowed_actions = ["inspect", "diagnose", "test", "propose", "maintain"]
required_evidence = ["machine-contracts", "deterministic-snapshot"]
tags = ["machine", "index", "ontology", "repository-intelligence"]

[[zones]]
id = "skeleton-product"
description = "Primary Python product/runtime package."
roots = ["skeleton"]
exclude_roots = ["skeleton/testing", "skeleton/automation", "skeleton/repo_machine"]
kind = "product"
mutability = "normal"
risk = "medium"
agent_default = "maintain"
allowed_actions = ["inspect", "diagnose", "test", "repair", "maintain", "build-approved"]
required_evidence = ["targeted-tests"]
tags = ["python", "runtime", "product"]

[[zones]]
id = "backend-product"
description = "Backend services, core systems, routes, GameForge and data access."
roots = ["backend"]
exclude_roots = ["backend/tests", "backend/scripts", "backend/data"]
kind = "product"
mutability = "normal"
risk = "medium"
agent_default = "maintain"
allowed_actions = ["inspect", "diagnose", "test", "repair", "maintain", "build-approved"]
required_evidence = ["backend-tests"]
tags = ["python", "backend", "services"]

[[zones]]
id = "frontend-product"
description = "Frontend application and browser product surface."
roots = ["frontend"]
kind = "product"
mutability = "normal"
risk = "medium"
agent_default = "maintain"
allowed_actions = ["inspect", "diagnose", "test", "repair", "maintain", "build-approved"]
required_evidence = ["frontend-tests"]
tags = ["typescript", "react", "frontend"]

[[zones]]
id = "core-product"
description = "Shared shift-supervisor and compact core runtime."
roots = ["core"]
kind = "product"
mutability = "normal"
risk = "high"
agent_default = "maintain"
allowed_actions = ["inspect", "diagnose", "test", "repair", "maintain", "build-approved"]
required_evidence = ["targeted-tests"]
tags = ["python", "core"]

[[zones]]
id = "accelerators"
description = "Native/JVM/Rust acceleration surfaces."
roots = ["java-accelerators", "satellites/gameforge-rs", "satellites/gameforge-middleware"]
kind = "product"
mutability = "normal"
risk = "high"
agent_default = "maintain"
allowed_actions = ["inspect", "diagnose", "test", "repair", "maintain", "build-approved"]
required_evidence = ["platform-tests", "contract-tests"]
tags = ["java", "rust", "native", "accelerator"]

[[zones]]
id = "tests"
description = "Canonical regression and integration tests."
roots = ["tests", "skeleton/testing", "backend/tests"]
exclude_roots = ["tests/legacy_root"]
kind = "test"
mutability = "normal"
risk = "low"
agent_default = "expand"
allowed_actions = ["inspect", "test", "repair", "maintain", "expand"]
required_evidence = ["tests-pass"]
tags = ["test", "quality"]

[[zones]]
id = "documentation"
description = "Canonical operator, architecture and product documentation."
roots = ["docs"]
exclude_roots = ["docs/archive"]
kind = "docs"
mutability = "normal"
risk = "low"
agent_default = "maintain"
allowed_actions = ["inspect", "repair", "maintain", "expand"]
required_evidence = ["doc-contracts"]
tags = ["docs", "architecture"]

[[zones]]
id = "bulk-data"
description = "Large structured datasets and backup material; not a code authority source."
roots = ["backend/data", "memory/mongo_backup"]
kind = "data"
mutability = "guarded"
risk = "medium"
agent_default = "inspect"
allowed_actions = ["inspect", "validate", "propose"]
required_evidence = ["data-integrity"]
tags = ["data", "bulk", "backup"]

[[zones]]
id = "branch-snapshots"
description = "Historical branch snapshots retained for mining/provenance only."
roots = ["satellites/branch-snapshots"]
kind = "archive"
mutability = "archive"
risk = "low"
agent_default = "ignore"
allowed_actions = ["inspect", "mine"]
required_evidence = []
tags = ["archive", "snapshot", "provenance"]

[[zones]]
id = "legacy-archive"
description = "Archived legacy code, scripts and documentation."
roots = ["docs/archive", "tests/legacy_root", "scripts/legacy_root"]
kind = "archive"
mutability = "archive"
risk = "low"
agent_default = "ignore"
allowed_actions = ["inspect", "mine"]
required_evidence = []
tags = ["archive", "legacy"]

[[zones]]
id = "root-metadata"
description = "Repository entrypoints and build metadata."
exact_paths = [
  "README.md", "SECURITY.md", "CHANGELOG.md", "BACKLOG.md", "LICENSE",
  "Makefile", "pyproject.toml", "setup.cfg", "requirements.txt",
  "requirements-dev.txt", "requirements-build.txt", "Dockerfile",
  "docker-compose.yml", ".gitignore", ".gitattributes", ".dockerignore",
  ".pre-commit-config.yaml", ".gitleaks.toml", ".env.example"
]
kind = "metadata"
mutability = "guarded"
risk = "high"
agent_default = "inspect"
allowed_actions = ["inspect", "diagnose", "test", "propose", "maintain"]
required_evidence = ["packaging-tests"]
tags = ["metadata", "build", "entrypoint"]

[work]
lane_order = [
  "merge-blocker", "security", "regression", "integration",
  "approved-build", "architecture", "performance", "dependency",
  "documentation", "cleanup"
]
minimum_score = 0.20
max_candidates = 200
max_candidates_per_subsystem = 12
prefer_existing_pr = true
prefer_existing_issue = true
prefer_targeted_test = true
penalize_control_plane = 0.20
penalize_archive = 1.00
penalize_generated = 0.90
reward_test_gap = 0.25
reward_large_active_module = 0.10
reward_orphan_module = 0.20
reward_todo = 0.10
reward_dependency_cycle = 0.30
reward_high_fan_in = 0.15
reward_missing_docs = 0.08

[outputs]
default_format = "json"
canonical_json = true
include_timestamp_by_default = false
cache_directory = ".machine/cache"
snapshot_filename = "repository-index.json"
graph_filename = "dependency-graph.json"
work_filename = "work-candidates.json"
