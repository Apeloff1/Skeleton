# ============================================================================
# Tutolage Backend - Modern Python Project Configuration
# ============================================================================
# Package manager: uv | Linter/Formatter: ruff | Testing: pytest | Types: mypy
# Canonical backend runtime/tooling baseline: Python 3.11 + Ruff 0.9.x.
# ============================================================================

[project]
name = "tutolage"
version = "15.0.0"
description = "Tutolage - Ultimate AI-Powered Learning & Game Development Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Tutolage Team", email = "team@tutolage.dev" }
]
keywords = [
    "education", "ai", "learning", "game-development",
    "fastapi", "llm", "tutor", "npc", "animation", "godot"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "python-multipart>=0.0.30",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "openai>=1.10.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.2.2",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.1,<3",
    "httpx>=0.26.0",
    "ruff>=0.9,<0.17",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.1,<3",
    "httpx>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/Apeloff1/Skeleton"
Repository = "https://github.com/Apeloff1/Skeleton"
Issues = "https://github.com/Apeloff1/Skeleton/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.1,<3",
    "ruff>=0.9,<0.17",
    "pre-commit>=3.6.0",
    "mypy>=1.8.0",
]
