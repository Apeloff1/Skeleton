[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["skeleton/testing"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.uv]
required-version = "==0.12.15"

[tool.setuptools.package-data]
"skeleton.acquired.gaming" = ["*.json", "*.jsonl"]
"skeleton.native" = ["asm/*.S", "asm/*.md", "asm/*.h"]
"skeleton.app" = ["manifest.json"]

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skeleton"
version = "16.0.0"
description = "AI game engine and agent orchestration framework"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "black>=26.5.1", "mypy>=1.0.0", "ruff>=0.9,<0.17"]

[project.scripts]
skeleton = "skeleton.__main__:main"
skeleton-dev = "skeleton.developer.cli:run_dev_cli"
skeleton-repo-machine = "skeleton.repo_machine.cli:main"
