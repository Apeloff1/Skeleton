[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["skeleton/testing"]
pythonpath = [".", "backend"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.uv]
required-version = "==0.12.15"

[tool.setuptools.packages.find]
where = ["."]
include = ["skeleton*"]

[tool.setuptools.package-data]
"skeleton.acquired.gaming" = ["*.json", "*.jsonl"]
"skeleton.ai.game_builder" = ["platform_catalog.json", "evolution_lineages.json", "legal_authorities.json"]
"skeleton.native" = ["asm/*.S", "asm/*.md", "asm/*.h"]
"skeleton.app" = ["manifest.json"]
"skeleton.game.gameplay" = ["fixtures/*.json"]
# Recovered offline model corpora: explicit wheel data, never model weights.
"skeleton.ai.runtime.operational_ai.durable_jobs" = ["README.md","scenarios/*/*.json"]
"skeleton.ai.runtime.operational_ai.guarded_request" = ["README.md","scenarios/*/*.json"]
"skeleton.ai.runtime.operational_ai.native_candidate" = ["README.md","examples/v1/*/*.json","vectors/*/*.json"]
"skeleton.ai.runtime.operational_ai.native_genesis" = ["vectors/v1/*/*.json"]
"skeleton.ai.runtime.operational_ai.native_qualification" = ["README.md","cases/v1/*/*.json"]
"skeleton.ai.runtime.operational_ai.native_supervised" = ["challenges/v1/*/*.json"]

[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skeleton"
version = "16.0.0"
description = "Local-first game studio with Jeeves AI chat, Dragon source review and bounded game learning"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4,<5",
  "cryptography>=50.0.2",
  "fastapi>=0.142.2",
  "httpx>=0.28.1,<1",
  "motor==3.7.1",
  "pymongo==4.19.0",
  "pydantic[email]>=2.14.1",
  "pydantic-settings>=2.15.0",
  "regex>=2026.9.29,<2027",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["PyYAML>=6,<7", "pytest>=7.0.0", "pytest-asyncio>=1.4.0", "httpx>=0.28.1,<1", "black>=26.5.1", "mypy>=2.4.0", "ruff>=0.17.2,<0.18"]
local-inference = ["numpy==2.4.6", "Pillow>=13.0.0,<14"]
jeeves-production-training = ["torch>=2.5,<3"]
hosted-inference = ["openai>=2.54.0,<3", "httpx>=0.28.1,<1"]

[project.scripts]
skeleton-jeeves-native-chat = "skeleton.jeeves.agent.native_cli:main"
