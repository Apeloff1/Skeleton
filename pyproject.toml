[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutolage-skeleton"
version = "16.0.0"
description = "The fully rebuilt, maximum-density rewrite of the Tutolage AI Learning & Game-Development Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
chroma = [
    "chromadb>=0.5",
]
mongo = [
    "motor>=3.4",
]

[tool.setuptools.packages.find]
include = ["skeleton*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
