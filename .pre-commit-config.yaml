# ============================================================================
# Pre-commit Configuration for Tutolage / Skeleton
# ============================================================================
# Install backend dev deps + frontend deps first, then:
#   pre-commit install
#   pre-commit run --all-files
# Local quality hooks intentionally call the same canonical commands as CI.
# ============================================================================

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=110000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Repository-native quality gates. These avoid version drift between old
  # pre-commit mirrors and the versions declared by backend/frontend tooling.
  - repo: local
    hooks:
      - id: repo-toolchain-contract
        name: repository toolchain and quality-gate contract
        entry: python scripts/check_toolchain_contract.py
        language: system
        pass_filenames: false
        files: ^(backend/pyproject\.toml|frontend/(package\.json|Dockerfile)|\.github/workflows/(ci|lint|backend-quality)\.yml|scripts/(check_toolchain_contract\.py|quality-gates\.sh)|\.pre-commit-config\.yaml)$

      - id: backend-ruff
        name: backend ruff correctness gate
        entry: bash -c 'cd backend && python -m ruff check . --output-format=github'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: backend-compile
        name: backend syntax compilation
        entry: bash -c 'cd backend && python -m compileall -q .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: backend-process-safety
        name: backend process invocation safety
        entry: bash -c 'cd backend && python scripts/check_process_safety.py'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: backend-exec-guard
        name: backend execution boundary regressions
        entry: bash -c 'cd backend && python -m pytest -q --noconftest tests/test_exec_guard.py tests/test_process_safety_gate.py'
        language: system
        pass_filenames: false
        files: ^backend/(core/exec_guard\.py|scripts/check_process_safety\.py|tests/test_(exec_guard|process_safety_gate)\.py)$

      - id: frontend-lint
        name: frontend canonical lint gate
        entry: bash -c 'cd frontend && yarn lint:ci'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(js|jsx|ts|tsx)$

      - id: frontend-typecheck
        name: frontend canonical typecheck gate
        entry: bash -c 'cd frontend && yarn typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies: [types-python-jose]
        exclude: ^tests/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [json, yaml, markdown]
        args: ['--write']

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ['-r', 'backend']
        additional_dependencies: ['bandit[toml]']
        exclude: ^backend/tests/

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ['--ignore', 'DL3008', '--ignore', 'DL3013']

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

ci:
  autofix_commit_msg: "ci: auto-fix by pre-commit hooks"
  autofix_prs: true
  autoupdate_commit_msg: "ci: pre-commit autoupdate"
  autoupdate_schedule: monthly
  # Local hooks depend on project environments unavailable to pre-commit.ci;
  # GitHub Actions enforces them authoritatively.
  skip: [mypy, repo-toolchain-contract, backend-ruff, backend-compile, backend-process-safety, backend-exec-guard, frontend-lint, frontend-typecheck]
  submodules: false
